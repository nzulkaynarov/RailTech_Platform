# ==============================================================================
# RailTech B2B SaaS — Production Docker Compose Override
# Use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Architecture on the shared railtech.uz VPS (see deploy/RUNBOOK-b2b-vps.md):
#   - The host's existing Caddy owns 80/443 and terminates TLS. This stack runs
#     NO reverse proxy of its own — Caddy proxies b2b.railtech.uz/api,/ws,/admin,
#     /static -> backend (127.0.0.1:8000) and serves the built SPA as static files.
#   - Therefore the frontend container is NOT run in production (build-only profile);
#     its dist/ is built and copied to /var/www/railtech-b2b for Caddy to serve.
#   - All published ports stay on 127.0.0.1 (see base compose) so Docker's iptables
#     rules cannot bypass ufw and expose Redis/MinIO to the internet.
#   - Resource limits are sized for a 2 vCPU / 3.8 GB box shared with other tenants.
#   - Database is external (Neon Cloud); no postgres here.
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # Redis (Channels) — production
  # ---------------------------------------------------------------------------
  redis:
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 160M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Redis (Celery broker/result) — production
  # ---------------------------------------------------------------------------
  redis-celery:
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 160M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # MinIO disabled on this VPS — CPU lacks x86-64-v2 (popcnt/sse4_*/ssse3),
  # which modern minio/minio:latest requires (Fatal glibc error on boot).
  # Storage falls back to Django FileSystemStorage when MINIO_ENDPOINT is unset
  # (see backend/core/storage.py::_minio_is_configured). Files persist on the
  # `backend_media_prod` volume and are served by backend at /media via Caddy.
  # Gated behind a profile that the prod deploy never activates so `compose up`
  # skips it without us having to remove the service from the base file.
  # ---------------------------------------------------------------------------
  minio:
    profiles: ["with-minio"]

  minio-init:
    profiles: ["with-minio"]

  # ---------------------------------------------------------------------------
  # Django backend — gunicorn + uvicorn workers (ASGI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railtech_backend_prod
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
      DJANGO_SETTINGS_MODULE: core.settings
      DJANGO_DEBUG: "False"
    # 2 workers fit a 2 vCPU box shared with other tenants. --timeout=180 covers
    # synchronous PDF / large-Excel responses. Port binding is inherited from the
    # base compose (127.0.0.1:8000) — Caddy on the host proxies to it.
    command: >
      gunicorn
      --worker-class=uvicorn.workers.UvicornWorker
      --workers=2
      --worker-connections=1000
      --max-requests=1000
      --max-requests-jitter=100
      --timeout=180
      --graceful-timeout=30
      --keep-alive=5
      --bind=0.0.0.0:8000
      --access-logfile=-
      --error-logfile=-
      core.asgi:application
    volumes:
      - backend_static_prod:/app/staticfiles
      - backend_media_prod:/app/media
    # `!reset` drops the inherited `minio: service_healthy` from the base file
    # (minio is gated off in prod, see comment above).
    depends_on: !reset
      redis:
        condition: service_healthy
      redis-celery:
        condition: service_healthy
    networks:
      - railtech
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1200M
        reservations:
          cpus: '0.5'
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Celery worker
  # ---------------------------------------------------------------------------
  celery-worker:
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
      DJANGO_SETTINGS_MODULE: core.settings
      DJANGO_DEBUG: "False"
    # Concurrency capped so Excel imports don't exhaust the shared box.
    command: celery -A core worker -l info -Q default,pdf,imports --concurrency=2
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Celery beat (scheduler)
  # ---------------------------------------------------------------------------
  celery-beat:
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
      DJANGO_SETTINGS_MODULE: core.settings
      DJANGO_DEBUG: "False"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Frontend — BUILD ONLY in production.
  # Not started by `up` (gated behind the 'frontend-build' profile). The runbook
  # builds the image, extracts dist/, and copies it to /var/www/railtech-b2b for
  # Caddy to serve. VITE_*_URL stay relative so the SPA talks to the same origin.
  # ---------------------------------------------------------------------------
  frontend:
    profiles: ["frontend-build"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        # No "/ws" default: VITE_WS_URL is an ORIGIN (set in deploy .env), the
        # frontend appends /ws/notifications/ itself. A "/ws" default would
        # double the prefix → ws/ws/notifications/ (Channels: No route found).
        VITE_WS_URL: ${VITE_WS_URL:-}
    container_name: railtech_frontend_build
    restart: "no"

volumes:
  backend_static_prod:
    driver: local
  backend_media_prod:
    driver: local
