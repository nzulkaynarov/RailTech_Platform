# ==============================================================================
# RailTech Nginx — Production Reverse Proxy Configuration
# Handles routing, WebSocket upgrade, SSL, rate limiting, caching
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ===========================================================================
    # Logging
    # ===========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format api_log '$remote_addr - [$time_local] "$request" $status '
                       '$body_bytes_sent $request_time "$http_referer"';

    access_log /var/log/nginx/access.log main;

    # ===========================================================================
    # Performance & Optimization
    # ===========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # ===========================================================================
    # Gzip Compression
    # ===========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ===========================================================================
    # Caching
    # ===========================================================================
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m
                     max_size=1g inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:50m
                     max_size=5g inactive=365d use_temp_path=off;

    # ===========================================================================
    # Rate Limiting Zones
    # ===========================================================================
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=100r/s;

    # ===========================================================================
    # Upstream Definitions
    # ===========================================================================
    upstream backend {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
        keepalive 32;
    }

    upstream minio {
        server minio:9000;
        keepalive 32;
    }

    # ===========================================================================
    # Map for WebSocket upgrade
    # ===========================================================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ===========================================================================
    # Security Headers
    # ===========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://minio:9000 https://*.railtech.uz; font-src 'self'; connect-src 'self' ws: wss: http://minio:9000; frame-ancestors 'self';" always;

    # ===========================================================================
    # Default Server Block (Catch-all)
    # ===========================================================================
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$http_host$request_uri;
    }

    # ===========================================================================
    # HTTPS Server Block (Main)
    # ===========================================================================
    server {
        listen 443 ssl http2 default_server;
        server_name railtech.uz b2b.railtech.uz cabinet.railtech.uz crm.railtech.uz admin.railtech.uz;

        # =====================================================================
        # SSL Configuration (Uncomment for production)
        # =====================================================================
        # ssl_certificate /etc/nginx/ssl/railtech.crt;
        # ssl_certificate_key /etc/nginx/ssl/railtech.key;
        # ssl_trusted_certificate /etc/nginx/ssl/railtech_chain.crt;

        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305;
        # ssl_prefer_server_ciphers on;
        # ssl_session_cache shared:SSL:50m;
        # ssl_session_timeout 1d;
        # ssl_session_tickets off;
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # resolver 8.8.8.8 8.8.4.4 valid=300s;
        # resolver_timeout 5s;

        # =====================================================================
        # Security Headers for HTTPS
        # =====================================================================
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # =====================================================================
        # Health Check Endpoint
        # =====================================================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type "text/plain";
        }

        # =====================================================================
        # API Routes → Backend (Django/Daphne)
        # =====================================================================
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header Connection "";

            # Disable cache for authenticated API requests (prevent cross-user data leakage)
            set $no_cache 0;
            if ($http_authorization) {
                set $no_cache 1;
            }
            proxy_no_cache $no_cache;
            proxy_cache_bypass $no_cache;

            proxy_cache api_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 5m;
            proxy_cache_use_stale error timeout invalid_header updating;
            add_header X-Cache-Status $upstream_cache_status;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # =====================================================================
        # Admin Panel → Backend (Django Admin)
        # =====================================================================
        location /admin/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # No caching for admin
            proxy_no_cache 1;
            proxy_cache_bypass 1;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # =====================================================================
        # WebSocket Routes → Backend
        # =====================================================================
        location /ws/ {
            limit_req zone=ws_limit burst=200 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # WebSocket timeouts (longer than HTTP)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;

            # Disable buffering for WebSocket
            proxy_buffering off;
        }

        # =====================================================================
        # Object Storage (MinIO) → S3-compatible API
        # =====================================================================
        location /storage/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://minio/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Cache static files from MinIO
            proxy_cache static_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout invalid_header updating;
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, immutable";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # =====================================================================
        # Static Files (Frontend)
        # =====================================================================
        location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico)$ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            # Long-term caching for versioned assets
            expires 365d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            access_log off;
        }

        # =====================================================================
        # HTML Files (Frontend SPA)
        # =====================================================================
        location ~* \.html?$ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            # No caching for HTML (fresh SPA)
            expires -1;
            add_header Cache-Control "public, must-revalidate";
            add_header ETag "W/\"railtech-$date_gmt\"";
        }

        # =====================================================================
        # Root / → Frontend (SPA)
        # =====================================================================
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # No caching for SPA root
            expires -1;
            add_header Cache-Control "public, must-revalidate";
        }

        # =====================================================================
        # Deny Access to Sensitive Files
        # =====================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ===========================================================================
    # Include Additional Configuration Files
    # ===========================================================================
    include /etc/nginx/conf.d/*.conf;
}
