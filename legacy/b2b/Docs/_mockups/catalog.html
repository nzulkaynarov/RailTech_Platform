<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailTech B2B — Каталог</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --i50:#f8fafc;--i100:#f1f5f9;--i200:#e2e8f0;--i300:#cbd5e1;--i400:#94a3b8;
  --i500:#64748b;--i600:#475569;--i700:#334155;--i800:#1e293b;--i900:#0f172a;
  --i950:#060d1a;--action:#2563eb;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;background:var(--i50);color:var(--i900);-webkit-font-smoothing:antialiased}
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--i950)}
/* Header */
.hdr{height:56px;background:#fff;border-bottom:1px solid var(--i200);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;z-index:30}
.logo{display:flex;align-items:center;gap:10px;margin-right:8px}
.logo-ic{width:32px;height:32px;background:none;border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-ic svg{width:32px;height:32px;stroke:none;fill:none}
.logo-t{font-size:16px;font-weight:700;color:var(--i900);letter-spacing:-0.025em}
.logo-t span{color:var(--action)}
.logo-b{font-size:12px;color:var(--i400);margin-left:6px}
.tnav{display:flex;gap:4px;font-size:14px}
.tnav a{padding:6px 12px;border-radius:8px;font-weight:500;text-decoration:none;transition:.15s}
.tnav a.on{background:var(--i100);color:var(--i900)}
.tnav a:not(.on){color:var(--i500)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.hb{padding:8px;border-radius:8px;border:1px solid var(--i200);background:0;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.hb svg{width:16px;height:16px;stroke:var(--i500);fill:none;stroke-width:2}
.badge-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;background:var(--danger);border-radius:50%;border:2px solid white}
.cart-b{position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:var(--action);color:white;font-size:10px;font-weight:700;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white}
.dv{width:1px;height:24px;background:var(--i200)}
.lb{font-size:12px;font-weight:600;color:var(--i500);padding:4px 8px;border:1px solid var(--i200);border-radius:6px;background:white;cursor:pointer}
.am{display:flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid var(--i200);border-radius:8px;cursor:pointer;background:0}
.av{width:24px;height:24px;background:var(--action);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:700}
.an{font-size:14px;font-weight:500;color:var(--i700)}
/* Main */
.main{flex:1;display:flex;overflow:hidden;background:var(--i50)}
/* Sidebar */
.sb{width:210px;border-right:1px solid var(--i200);background:#fff;display:flex;flex-direction:column;flex-shrink:0}
.sb-dom{padding:12px;border-bottom:1px solid var(--i200);background:rgba(248,250,252,0.5)}
.sb-dom h3,.sb-cat h3{font-size:11px;font-weight:600;color:var(--i400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;padding:0 4px}
.db{width:100%;display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--i200);background:0;font-size:14px;color:var(--i500);cursor:pointer;margin-bottom:4px;text-align:left;font-family:inherit}
.db.on{background:var(--i900);color:white;border-color:var(--i900);font-weight:600}
.db svg{width:14px;height:14px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2}
.sb-cat{flex:1;overflow-y:auto;padding:12px}
.sb-cat h3{display:flex;align-items:center;gap:8px}
.cl{border:1px solid var(--i100);padding:4px;border-radius:8px;background:rgba(248,250,252,0.3)}
.ci{width:100%;display:flex;align-items:center;justify-content:space-between;height:28px;padding:0 10px;border-radius:6px;border:1px solid transparent;font-size:12px;color:var(--i500);cursor:pointer;background:0;text-align:left;font-family:inherit}
.ci.on{background:white;color:var(--action);border-color:var(--i200);box-shadow:0 1px 2px rgba(0,0,0,.04);font-weight:500}
.cd{width:6px;height:6px;background:var(--action);border-radius:50%}
.sf{padding:12px;border-top:1px solid var(--i200);background:var(--i50)}
.ss{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px}
.ss .l{color:var(--i500);display:flex;align-items:center;gap:6px}
.ss .l svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.ss .v{font-weight:600;font-variant-numeric:tabular-nums}
/* Catalog area */
.ca{flex:1;display:flex;flex-direction:column;min-width:0;background:white}
.tb{height:44px;background:white;border-bottom:1px solid var(--i200);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0}
.tl{display:flex;align-items:center;gap:8px}
.tt{padding:6px;border-radius:8px;color:var(--i400);background:0;border:0;cursor:pointer;display:flex}
.tt svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.sw{position:relative;flex:1;max-width:480px}
.sw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--i400);fill:none;stroke-width:2}
.sw input{width:100%;height:32px;background:var(--i50);border:1px solid var(--i200);font-size:14px;padding-left:40px;padding-right:12px;border-radius:8px;outline:none;font-family:inherit}
.tr{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--i200);margin-left:12px;height:100%}
.ss2{height:28px;background:var(--i50);border:1px solid var(--i200);font-size:12px;font-weight:600;color:var(--i600);border-radius:6px;padding:0 8px;font-family:inherit}
.vg{display:flex;background:var(--i50);border:1px solid var(--i200);border-radius:6px;padding:2px;gap:2px}
.vb{padding:6px;border-radius:4px;background:0;border:0;cursor:pointer;display:flex;color:var(--i400)}
.vb.on{background:var(--i900);color:white}
.vb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.ic{font-size:12px;color:var(--i400);font-variant-numeric:tabular-nums;margin-left:4px}
/* Grid */
.ga{flex:1;overflow:auto;padding:16px}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pc{background:white;border:1px solid var(--i200);border-radius:12px;overflow:hidden;transition:.15s;cursor:pointer}
.pc:hover{border-color:rgba(37,99,235,0.3);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.pi{height:140px;background:var(--i50);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--i100)}
.pi svg{width:48px;height:48px;stroke:#35819B;fill:none;stroke-width:1.5}
.pb{padding:12px}
.ps{font-size:11px;color:var(--i400);margin-bottom:4px;font-variant-numeric:tabular-nums}
.pn{font-size:14px;font-weight:600;color:var(--i900);margin-bottom:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbt{display:flex;justify-content:space-between;align-items:center}
.pp{font-size:14px;font-weight:700;color:var(--i900);font-variant-numeric:tabular-nums}
.stb{display:inline-flex;align-items:center;padding:2px 6px;font-size:10px;font-weight:600;border-radius:4px;border:1px solid;white-space:nowrap}
.stb.g{background:rgba(16,185,129,0.1);color:#047857;border-color:rgba(16,185,129,0.2)}
.stb.y{background:rgba(245,158,11,0.1);color:#b45309;border-color:rgba(245,158,11,0.2)}
.stb.b{background:rgba(59,130,246,0.1);color:#1d4ed8;border-color:rgba(59,130,246,0.2)}
/* Footer */
.ft{height:36px;background:white;border-top:1px solid var(--i200);display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 24px;flex-shrink:0}
.ft p,.ft a{font-size:12px;color:var(--i400);text-decoration:none}
</style>
</head>
<body>
<div class="shell">
<header class="hdr">
  <div class="logo">
    <div class="logo-ic"><svg viewBox="0 0 655 655"><polygon fill="#35819B" points="327.5 0 655 327.5 327.5 655 0 327.5"/><g transform="translate(185,157)" stroke="#FFF" stroke-linecap="round" stroke-width="20" fill="none" stroke-linejoin="round"><path d="M170,267 C205,240 227,197 227,150 C227,67 160,0 78,0 M78,132 L78,0"/><path d="M170,268 L228,341"/><path d="M78,170 L78,340 M0,170 L156,170"/></g></svg></div>
    <div><span class="logo-t">Rail<span>Tech</span></span><span class="logo-b">B2B</span></div>
  </div>
  <nav class="tnav"><a href="#" class="on">Каталог</a><a href="#">Корпоративный сайт ↗</a></nav>
  <div class="hdr-r">
    <span class="lb">RU</span>
    <button class="hb"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button>
    <div class="dv"></div>
    <button class="hb"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge-dot"></span></button>
    <button class="hb"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="cart-b">3</span></button>
    <div class="dv"></div>
    <button class="am"><div class="av">Н</div><span class="an">Нурбек</span><svg style="width:14px;height:14px;stroke:var(--i400);fill:none;stroke-width:2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
</header>
<div class="main">
  <aside class="sb">
    <div class="sb-dom">
      <h3>Домен</h3>
      <button class="db on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Все товары</button>
      <button class="db"><svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>Ж/Д техника</button>
      <button class="db"><svg viewBox="0 0 24 24"><path d="m7.5 4.27 9 5.15M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>Общие товары</button>
      <button class="db"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>Услуги</button>
    </div>
    <div class="sb-cat">
      <h3><svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>Категории</h3>
      <div class="cl">
        <button class="ci on">Двигатели дизельные <div class="cd"></div></button>
        <button class="ci">Тележки и рамы</button>
        <button class="ci">Генераторы тяговые</button>
        <button class="ci">Компрессоры</button>
        <button class="ci">Тормозное оборудование</button>
        <button class="ci">Подшипники</button>
        <button class="ci">Электроаппаратура</button>
        <button class="ci">Фильтры и уплотнения</button>
      </div>
    </div>
    <div class="sf">
      <div class="ss"><span class="l"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>Всего товаров</span><span class="v" style="color:#3b82f6">1 247</span></div>
      <div class="ss"><span class="l"><svg viewBox="0 0 24 24"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/></svg>Производителей</span><span class="v" style="color:var(--i400)">86</span></div>
    </div>
  </aside>
  <div class="ca">
    <div class="tb">
      <div class="tl">
        <button class="tt"><svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>

          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" placeholder="Поиск по наименованию, артикулу, ГОСТ...">

      <div class="tr">

        <div class="vg">
          <button class="vb"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
          <div style="width:1px;background:var(--i200);margin:2px 0"></div>
          <button class="vb"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
          <button class="vb on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18"/><path d="M12 3v18"/></svg></button>
          <button class="vb"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
        </div>
        <span class="ic">1 247 товаров</span>
      </div>
    </div>
    <div class="ga">
      <div class="pg" id="g"></div>
    </div>
  </div>
</div>
<footer class="ft"><p>© 2026 ООО «RailTech»</p><a href="#">Корпоративный сайт ↗</a></footer>
</div>

</body>
</html>
