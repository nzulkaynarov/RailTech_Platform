# ==============================================================================
# RailTech Frontend — Nginx Configuration
# Serves React SPA with proper caching, gzip, and security headers
# ==============================================================================

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ===========================================================================
    # Gzip Compression
    # ===========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ===========================================================================
    # Security Headers
    # ===========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ===========================================================================
    # Cache Configuration
    # ===========================================================================

    # Cache busting for assets with hash in filename (e.g., app.abc123.js)
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Index and HTML files — no cache to ensure fresh SPA
    location ~* \.html?$ {
        expires -1;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        add_header ETag "W/\"railtech-$date_gmt\"";
    }

    # ===========================================================================
    # SPA Fallback
    # ===========================================================================
    # All requests to unknown routes → index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "public, must-revalidate";
    }

    # ===========================================================================
    # Health Check Endpoint
    # ===========================================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type "text/plain";
    }

    # ===========================================================================
    # MinIO Public Bucket Proxy
    # ===========================================================================
    # Exposes the public S3 bucket (logos, avatars, product images) through
    # the frontend origin so MINIO_PUBLIC_DOMAIN=localhost/storage produces
    # valid URLs in dev. In production map /storage/ to S3 via a CDN instead.
    location ^~ /storage/ {
        proxy_pass http://minio:9000/railtech-public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ===========================================================================
    # Deny Access to Sensitive Files
    # ===========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===========================================================================
    # Error Pages
    # ===========================================================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
