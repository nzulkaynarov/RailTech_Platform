name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  i18n-symmetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify ru.json / en.json key sets match
        run: python3 scripts/check_i18n_symmetry.py

  backend-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install flake8 "black>=24,<25" "isort>=5,<6"

      - name: Run flake8
        run: flake8 backend/

      - name: Check black formatting
        run: black --check backend/

      - name: Check isort imports
        run: isort --check-only backend/

  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      # Ephemeral Postgres, NOT Neon. The suite builds its schema from models
      # (--create-db --nomigrations), so it never needs Neon's data — and pointing
      # it at the *shared* Neon instance caused a recurring class of CI flakes:
      # cold-start hangs, a stale test_neondb held open by a pooled session, and
      # the SSL connection dropping mid test-DB-create ("SSL connection has been
      # closed unexpectedly" inside _configure_timezone). A throwaway local DB,
      # fresh every run, removes that entire class. The real migration path is
      # still exercised by the migration-check job. pg_trgm + the GIN trigram
      # indexes live only in migration catalog/0006 (kept out of model state),
      # which --nomigrations skips, so no extension is needed to build the schema.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: railtech
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt pytest-cov

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/railtech
          DB_SSLMODE: disable
          DJANGO_SECRET_KEY: 'ci-test-secret-key-not-for-production'
          REDIS_URL: redis://localhost:6379/0
          DEBUG: 'True'
          # In-memory email backend: no SMTP server exists in CI, so the real
          # SMTP default would make registration (send setup-password email)
          # fail with ConnectionRefused. Cascades to EMAIL_CHANNELS (settings.py).
          EMAIL_BACKEND: 'django.core.mail.backends.locmem.EmailBackend'
        run: |
          cd backend
          # --create-db: build the test schema from current models on the fresh
          # ephemeral Postgres (we run --nomigrations, and addopts sets --reuse-db).
          pytest --create-db --cov=. --cov-report=xml --cov-report=html --cov-fail-under=30

  # The test job above runs with --nomigrations (pyproject addopts), so it builds
  # the schema from models and never exercises the migration graph. This job does:
  # it applies every migration to a clean Postgres, catching breakage that only
  # surfaces on a fresh deploy (bad cross-app deps, seed FieldErrors, missing
  # migrations). Runs against a throwaway service DB — never touches Neon.
  migration-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: railtech
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/railtech
      DB_SSLMODE: disable
      DJANGO_SECRET_KEY: 'ci-migration-check-secret-key-not-for-production'
      DJANGO_DEBUG: 'False'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Check for missing migrations (model/migration drift)
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Apply all migrations to a clean database (real deploy path)
        run: |
          cd backend
          python manage.py migrate --noinput

  api-contract:
    # Fails if the committed OpenAPI schema or generated TS types drift from the
    # code (F2.7). Regenerate both and `git diff` — keeps backend/schema.json +
    # frontend/src/api/schema.d.ts honest so the frontend types can't silently rot.
    # Python pinned to 3.12 (the Docker/prod runtime that produced the committed
    # schema); openapi-typescript is locked in package-lock so its output is stable.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: railtech
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/railtech
      DB_SSLMODE: disable
      DJANGO_SECRET_KEY: 'ci-api-contract-secret-key-not-for-production'
      DJANGO_DEBUG: 'False'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Regenerate OpenAPI schema
        run: |
          cd backend
          python manage.py spectacular --format openapi-json --file schema.json

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Regenerate API types
        run: |
          cd frontend
          npm run gen:api-types

      - name: Fail on schema / type drift
        run: |
          if ! git diff --exit-code -- backend/schema.json frontend/src/api/schema.d.ts; then
            echo "::error::OpenAPI schema or generated TS types are out of date."
            echo "Run 'cd backend && python manage.py spectacular --format openapi-json --file schema.json'"
            echo "then 'cd frontend && npm run gen:api-types', and commit the result."
            exit 1
          fi

  frontend-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22']

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript compiler
        run: |
          cd frontend
          npx tsc --noEmit

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22']

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-build
          path: frontend/dist/

  frontend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22']

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run unit tests (vitest)
        run: |
          cd frontend
          npm run test

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, migration-check, frontend-lint, frontend-build, frontend-test]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build backend Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: railtech-backend:${{ github.sha }}

      - name: Build frontend Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: railtech-frontend:${{ github.sha }}

  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
        node-version: ['22']

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      # INF-02: hard gate — verified clean (2026-07-02: "No known vulnerabilities
      # found" for requirements.txt). A new advisory now FAILS the job; triage with
      # `pip-audit --ignore-vuln <ID>` for accepted risks instead of re-adding `|| true`.
      - name: Run pip audit
        run: |
          pip install pip-audit
          cd backend
          pip-audit

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      # INF-02: hard gate — the runtime advisories were fixed (npm audit fix in #204)
      # and the dev-only vite/vitest chain was cleared by the vitest 4 upgrade (#209).
      # Verified clean 2026-07-03: `npm audit --audit-level=high` → 0 vulnerabilities.
      # A new high/critical advisory now FAILS the job; for an accepted risk, pin/patch
      # or add a documented `--omit` rather than re-adding continue-on-error.
      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high
