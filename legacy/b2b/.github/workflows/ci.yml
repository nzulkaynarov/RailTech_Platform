name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  i18n-symmetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify ru.json / en.json key sets match
        run: python3 scripts/check_i18n_symmetry.py

  backend-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install flake8 "black>=24,<25" "isort>=5,<6"

      - name: Run flake8
        run: flake8 backend/

      - name: Check black formatting
        run: black --check backend/

      - name: Check isort imports
        run: isort --check-only backend/

  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt pytest-cov

      - name: Wake up Neon database
        timeout-minutes: 6
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install psycopg2-binary
          python -c "
          import psycopg2, os, sys, time
          last_error = None
          # A suspended free-tier Neon project can take 30-60s to cold-start, and
          # the first TCP connect may hang up to connect_timeout. Use a short
          # per-attempt timeout with many attempts so a single slow cold-start
          # doesn't blow the whole step's budget (10 x 20s + 9 x 5s = ~245s < 6m).
          for attempt in range(10):
              try:
                  conn = psycopg2.connect(os.environ['DATABASE_URL'], connect_timeout=20)
                  conn.cursor().execute('SELECT 1')
                  conn.close()
                  print(f'Neon awake (attempt {attempt+1})')
                  sys.exit(0)
              except Exception as e:
                  last_error = e
                  print(f'Attempt {attempt+1} failed: {e}')
                  time.sleep(5)
          print(f'Failed to wake Neon after 10 attempts: {last_error}')
          sys.exit(1)
          "

      - name: Drop stale test database (Neon shared instance)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Neon is a *shared* instance, not an ephemeral CI service: a prior run's
          # test_neondb survives, and a stale pooled session (dj-db-conn-pool) holds
          # it open. Then --create-db hits CREATE→"already exists"→DROP→"being
          # accessed by other users"→SystemExit(2) at django_db_setup, erroring every
          # DB-backed test before its body runs. Same root cause CLAUDE.md documents:
          # pg_terminate_backend + DROP DATABASE IF EXISTS test_neondb, here automated.
          # We connect to the configured DB (neondb) and drop the *separate* test DB.
          python -c "
          import psycopg2, os, time
          conn = psycopg2.connect(os.environ['DATABASE_URL'], connect_timeout=20)
          conn.autocommit = True  # DROP DATABASE cannot run inside a transaction
          cur = conn.cursor()
          for attempt in range(3):
              cur.execute(\"SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'test_neondb' AND pid <> pg_backend_pid();\")
              try:
                  cur.execute('DROP DATABASE IF EXISTS test_neondb;')
                  print('Dropped stale test_neondb (if it existed)')
                  break
              except psycopg2.errors.ObjectInUse as e:
                  print(f'Attempt {attempt+1}: still in use, retrying: {e}')
                  time.sleep(3)
          conn.close()
          "

      - name: Run tests with coverage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: 'ci-test-secret-key-not-for-production'
          REDIS_URL: redis://localhost:6379/0
          DEBUG: 'True'
          # In-memory email backend: no SMTP server exists in CI, so the real
          # SMTP default would make registration (send setup-password email)
          # fail with ConnectionRefused. Cascades to EMAIL_CHANNELS (settings.py).
          EMAIL_BACKEND: 'django.core.mail.backends.locmem.EmailBackend'
        run: |
          cd backend
          # --create-db: the test schema is built from current models (we run
          # --nomigrations). The reused Neon test DB drifts when models gain
          # fields (e.g. notifications.audience, activitylog.entity_type), so
          # force a rebuild each run to keep the schema in sync with the models.
          pytest --create-db --cov=. --cov-report=xml --cov-report=html --cov-fail-under=30

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  # The test job above runs with --nomigrations (pyproject addopts), so it builds
  # the schema from models and never exercises the migration graph. This job does:
  # it applies every migration to a clean Postgres, catching breakage that only
  # surfaces on a fresh deploy (bad cross-app deps, seed FieldErrors, missing
  # migrations). Runs against a throwaway service DB — never touches Neon.
  migration-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: railtech
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/railtech
      DB_SSLMODE: disable
      DJANGO_SECRET_KEY: 'ci-migration-check-secret-key-not-for-production'
      DJANGO_DEBUG: 'False'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Check for missing migrations (model/migration drift)
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Apply all migrations to a clean database (real deploy path)
        run: |
          cd backend
          python manage.py migrate --noinput

  frontend-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript compiler
        run: |
          cd frontend
          npx tsc --noEmit

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  frontend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run unit tests (vitest)
        run: |
          cd frontend
          npm run test

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, migration-check, frontend-lint, frontend-build, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: railtech-backend:${{ github.sha }}

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: railtech-frontend:${{ github.sha }}

  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
        node-version: ['22']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run pip audit
        run: |
          pip install pip-audit
          cd backend
          pip-audit || true

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit || true
