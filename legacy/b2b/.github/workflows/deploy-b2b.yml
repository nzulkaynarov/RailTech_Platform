name: Deploy b2b.railtech.uz

# Push-to-deploy onto the VPS via a self-hosted runner registered to THIS repo
# (label: railtech-b2b). The runner executes on 176.101.56.141 alongside Caddy.
# One-time bootstrap (Docker, runner registration, Caddy block) is in
# Docs/dev/ops/RUNBOOK-b2b-vps.md.
#
# Secrets come from GitHub (Environment: production) and are rendered into
# /opt/railtech-b2b/.env on the runner at deploy time. Required secrets:
#   DATABASE_URL, DJANGO_SECRET_KEY, SUPERADMIN_PASSWORD
# Optional (email): EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD
#
# Note: MinIO is disabled on this VPS (CPU lacks x86-64-v2). The stack falls
# back to Django FileSystemStorage when MINIO_ENDPOINT is unset.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'Docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-b2b
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, railtech-b2b]
    environment: production
    env:
      DEPLOY_DIR: /opt/railtech-b2b
      WEB_ROOT: /var/www/railtech-b2b
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Sync source into deploy dir
        run: |
          mkdir -p "$DEPLOY_DIR"
          # `backups/` is an out-of-tree dir where someone (sudo / docker exec)
          # drops DB dumps; rsync --delete can't unlink root-owned files there
          # and the step fails with exit 23. Keep it untouched — backups should
          # arguably live under /var/backups/, but until that's set up, exclude.
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'backups' \
            ./ "$DEPLOY_DIR/"

      - name: Render .env from GitHub secrets
        working-directory: /opt/railtech-b2b
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Default the SPA DSN to the same value as backend (single Sentry project).
          # Override by setting VITE_SENTRY_DSN secret separately if you ever split projects.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || secrets.SENTRY_DSN }}
          # AI заявка import (Claude Structured Outputs). When unset, the stack
          # falls back to the deterministic Excel parser + manual entry
          # (AI_IMPORT_ENABLED auto-derives from the key being present).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::secret DATABASE_URL is not set"; exit 1; }
          test -n "$DJANGO_SECRET_KEY" || { echo "::error::secret DJANGO_SECRET_KEY is not set"; exit 1; }
          umask 077
          cat > .env <<EOF
          DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
          DJANGO_DEBUG=False
          PRODUCTION=true
          ALLOWED_HOSTS=b2b.railtech.uz,localhost,127.0.0.1
          # SEC-04: exactly one trusted proxy (host Caddy overwrites X-Forwarded-For
          # with the client IP). Without this the DRF default (0) keys throttles on
          # REMOTE_ADDR = the fixed Docker-bridge IP → every client shares one bucket.
          DRF_NUM_PROXIES=1
          # INF-03: enforce the Django CSP on /api + /admin (was Report-Only). Verified
          # against the running Unfold /admin — every page loads ONLY self-origin resources
          # + inline styles/scripts (the policy already allows 'unsafe-inline' + data:/blob:),
          # so nothing is blocked. The code default stays Report-Only (core/csp.py) for safety.
          CSP_REPORT_ONLY=false
          DATABASE_URL=${DATABASE_URL}
          DB_SSLMODE=require
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis-celery:6379/0
          CELERY_RESULT_BACKEND=redis://redis-celery:6379/0
          VITE_API_URL=/api/v1
          # WS must be an ORIGIN, not a path: the frontend builds the URL as
          # `${VITE_WS_URL}/ws/notifications/`, so a "/ws" value doubles the
          # prefix → ws/ws/notifications/ → Channels "No route found" every
          # reconnect. Caddy proxies /ws/* (no strip) to the backend's
          # ws/notifications/ route, so the public origin is correct here.
          VITE_WS_URL=wss://b2b.railtech.uz
          FRONTEND_URL=https://b2b.railtech.uz
          SUPERADMIN_EMAIL=admin@railtech.uz
          SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
          EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST=${EMAIL_HOST:-localhost}
          EMAIL_PORT=587
          EMAIL_HOST_USER=${EMAIL_HOST_USER}
          EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
          EMAIL_USE_TLS=True
          DEFAULT_FROM_EMAIL=noreply@railtech.uz
          DJANGO_LOG_LEVEL=INFO
          SENTRY_DSN=${SENTRY_DSN}
          SENTRY_ENVIRONMENT=production
          VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
          VITE_SENTRY_ENVIRONMENT=production
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          EOF
          chmod 600 .env

      - name: Build SPA and publish static for Caddy
        working-directory: /opt/railtech-b2b
        run: |
          $COMPOSE --profile frontend-build build frontend
          # `compose images -q` only lists images for *created* containers, so
          # for a build-only profile it returns empty. Compose tags built images
          # as <project>-<service> where project = directory basename.
          IMG="$(basename "$PWD")-frontend"
          mkdir -p "$WEB_ROOT"
          # `docker cp` preserves the container's UIDs, leaving prior dist
          # owned by uids that the deploy user can't unlink. Clean via root
          # inside a container so the step is re-runnable.
          docker run --rm -v "$WEB_ROOT":/out alpine find /out -mindepth 1 -delete
          CID=$(docker create "$IMG")
          docker cp "$CID":/usr/share/nginx/html/. "$WEB_ROOT"/
          docker rm "$CID"

      - name: Deploy backend stack (migrations auto-apply on the web container)
        working-directory: /opt/railtech-b2b
        run: |
          $COMPOSE up -d --build
          docker image prune -f

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then
              echo "backend healthy"; exit 0
            fi
            echo "waiting for backend... ($i/12)"; sleep 5
          done
          echo "::error::backend did not become healthy"
          $COMPOSE logs --tail=80 backend
          exit 1
