name: E2E (Playwright)

# Browser end-to-end against a RUNNING target. Runs nightly against prod plus on
# manual dispatch — NOT a per-push gate (it needs a live app + Playwright
# browsers). The active specs (smoke + auth-flow) are non-invasive (no user is
# created, fake tokens), so prod is a safe default target. The golden-path
# journey stays skipped until its selectors are filled (see Docs/ops/e2e.md).

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL (e.g. https://staging.b2b.railtech.uz)'
        required: true
        default: 'https://b2b.railtech.uz'
  schedule:
    # Nightly 03:00 UTC against prod — catches silent reg-flow regressions that
    # throw no exception (so Sentry/unit tests miss them).
    - cron: '0 3 * * *'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install deps + Playwright
        run: |
          cd frontend
          npm ci
          npm i -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Run E2E
        env:
          # Manual dispatch uses the provided URL; the nightly schedule has no
          # input, so fall back to prod.
          E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://b2b.railtech.uz' }}
        run: |
          cd frontend
          npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
