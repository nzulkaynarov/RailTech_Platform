repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # Версии ПРИБИТЫ к тем, что ставит CI (джоба backend-lint: flake8 / black>=24,<25 /
  # isort>=5,<6 на Python 3.12). Разойдутся — хук отформатирует одним black, а гейт
  # проверит другим, и мерж встанет на форматировании, которое «уже поправлено».
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12
        exclude: ^backend/migrations/

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black]
        exclude: ^backend/migrations/

  # Без flake8-docstrings/bugbear: CI ставит ГОЛЫЙ flake8, и лишние плагины ругались бы
  # на то, что гейт пропускает.
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        exclude: ^backend/migrations/

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: frontend/
        types: [javascript, typescript]
        additional_dependencies:
          - eslint
          - eslint-config-prettier
          - eslint-plugin-react
          - eslint-plugin-react-hooks

  - repo: local
    hooks:
      - id: i18n-symmetry
        name: i18n ru.json / en.json symmetry check
        entry: python3 scripts/check_i18n_symmetry.py
        language: system
        pass_filenames: false
        files: ^frontend/src/i18n/locales/
