# Образы прода после зелёного CI (ВЫКЛ-3, DECISIONS 2026-11-28). Запуск: workflow_run после workflow «CI» на push в main с итогом success.
# Собирает и кладёт в GHCR семь образов с тегом = полный git sha; этим «образы sha готовы» и сообщается серверу: таймер VPS 1
# (infra/deploy/auto-deploy.sh) проверяет манифест каждого образа и только при полном наборе выкладывает. SSH и секретов production здесь нет.
# Образ rt-cabinet зашивает адрес CRM (VITE_CRM_URL): его домен берётся из переменной репозитория CRM_DOMAIN (не секрет; Settings ->
# Secrets and variables -> Actions -> Variables -> Repository variables), а не из environment production, который из job без environment
# недоступен. Нет переменной - сборка cabinet падает (набор неполный, сервер ждёт и ничего не выкладывает). Ручной Deploy собирает cabinet
# по-прежнему сам, из переменной environment production.
# Список образов обязан совпадать с AUTO_DEPLOY_IMAGES в auto-deploy.sh (сверяет infra/deploy/tests/deploy-jobgraph-test.py).
name: Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    name: Проверка запуска
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
      date: ${{ steps.meta.outputs.date }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - name: Дата и владелец реестра
        id: meta
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  build:
    name: Образ ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Один sha - одна сборка; новый коммит main не отменяет сборку предыдущего (сервер берёт новейший sha с полным набором образов).
    concurrency:
      group: images-${{ needs.prepare.outputs.sha }}-${{ matrix.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: rt-crm-backend, context: apps/crm/backend, target: prod, scope: crm-backend, contexts: "rtbus=packages/rt-bus\ncontracts=packages/contracts"}
          - {image: rt-erp-backend, context: apps/erp/backend, target: "", scope: erp-backend, contexts: "rtbus=packages/rt-bus\ncontracts=packages/contracts\nrtdocs=packages/rt-docs"}
          - {image: rt-cabinet, context: apps/cabinet, target: "", scope: cabinet, contexts: ""}
          - {image: rt-litellm, context: infra/ai/litellm, target: "", scope: litellm, contexts: ""}
          - {image: rt-platform-bff, context: apps/platform/bff, target: prod, scope: platform-bff, contexts: "rtbus=packages/rt-bus\ncontracts=packages/contracts"}
          - {image: rt-platform-web, context: apps/platform/web, target: prod, scope: platform-web, contexts: ""}
          - {image: rt-eds, context: apps/eds, target: prod, scope: eds, contexts: "rtbus=packages/rt-bus\ncontracts=packages/contracts\nrtdocs=packages/rt-docs"}
    steps:
      - name: Переменная CRM_DOMAIN (только cabinet)
        if: matrix.image == 'rt-cabinet'
        env:
          CRM_DOMAIN: ${{ vars.CRM_DOMAIN }}
        run: |
          [ -n "$CRM_DOMAIN" ] || { echo "::error::нет переменной репозитория CRM_DOMAIN (домен CRM без схемы) - образ rt-cabinet не собрать"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Образ ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.contexts }}
          # BFF получает sha и дату сборки - версия «О системе» (W-REL); cabinet - адрес CRM; пустые строки build-push-action пропускает.
          build-args: |
            ${{ matrix.image == 'rt-cabinet' && 'VITE_API_URL=' || '' }}
            ${{ matrix.image == 'rt-cabinet' && format('VITE_CRM_URL=https://{0}', vars.CRM_DOMAIN) || '' }}
            ${{ matrix.image == 'rt-platform-bff' && format('PLATFORM_BUILD_SHA={0}', needs.prepare.outputs.sha) || '' }}
            ${{ matrix.image == 'rt-platform-bff' && format('PLATFORM_BUILD_DATE={0}', needs.prepare.outputs.date) || '' }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}:${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
