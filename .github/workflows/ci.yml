# CI ансамбля (M0-INF-04): один workflow, job'ы по путям. legacy/b2b исключён из всех проверок
# (ORCHESTRATOR §3.11). Раннер — переменная репозитория CI_RUNNER (например, self-hosted),
# по умолчанию ubuntu-latest (DECISIONS 2026-10-13: self-hosted или минуты GitHub — решает владелец).
#
# Скорость (волна 14, W14-S2; docs/runbooks/wave14-speed.md): цель — ответ по PR ≤ 10 мин. Поэтому задания приложения не ждут
# друг друга (lint, unit, integration, e2e, сборка идут параллельно сразу после `changes`), ERP разнесён на параллельные
# задания, e2e Платформы — на сборке и в шардах. Контракты — по потребителям (фильтры ниже), не «весь packages/contracts».
# Контракт: make contracts и чистый git diff в packages/contracts/generated.
# Инфраструктура: docker compose config и caddy validate.
# ci-ok — единственная обязательная проверка для защиты main: красный, если любой job упал; он есть на ВСЕХ событиях
# (PR, push в main, ночной прогон, ручной запуск) — на него опирается автодеплой (проверяет зелёный «CI ok» на sha).
# Таблица «правка → какие задания» и политика событий — docs/systems/infra/ci.md.

name: CI

# PR — проверки по путям (черновики не гоняются, запуск — при «Ready for review»; DECISIONS 2026-10-14).
# push в main — только БЫСТРЫЕ задания по тому, что изменилось с прошлого коммита main (lint, unit, contracts, gitleaks,
# миграции ERP, образы под qemu при правке Dockerfile/infra): мерж-коммит проверяется отдельно (FIX-00), но без повторного
# часового прогона всего, что уже прошло на PR (W14-S2).
# schedule (ночью, раз в сутки) и workflow_dispatch — ПОЛНЫЙ прогон всех job'ов: интеграция, e2e, сборки, аудит, тесты ERP.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * *"  # 01:17 UTC (06:17 по Ташкенту); GitHub запускает расписание только на ветке по умолчанию
  workflow_dispatch:

# Устаревший прогон PR отменяется новым. Прогон push в main — своя группа на каждый sha и не отменяется (иначе «CI ok»
# пропадёт у коммита, который успели обогнать, а автодеплой ждёт зелёный «CI ok» именно на его sha; FIX-54, G-12).
# Ночной (schedule) и ручной (dispatch) прогоны — каждый в своей группе и не отменяют ни друг друга, ни push: GitHub оставляет
# в группе не больше одного ожидающего прогона, поэтому общая с push группа теряла бы ночной прогон при слиянии PR в это время.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read  # dorny/paths-filter читает список файлов PR через API

env:
  UV_VERSION: "0.13.0"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  changes:
    name: Что изменилось
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    # PR — файлы PR; push в main — файлы с прошлого коммита main (dorny/paths-filter берёт base = коммит до push);
    # schedule и workflow_dispatch фильтр не применяют — гоняется всё. heavy=false только на push: тяжёлые задания
    # (интеграция, e2e, сборки, аудит, pytest ERP) там не идут — они уже прошли на PR и проходят заново ночью.
    outputs:
      crm: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) || steps.filter.outputs.crm == 'true' }}
      erp: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) || steps.filter.outputs.erp == 'true' }}
      cabinet: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) || steps.filter.outputs.cabinet == 'true' }}
      platform: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) || steps.filter.outputs.platform == 'true' }}
      eds: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) || steps.filter.outputs.eds == 'true' }}
      packages: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) || steps.filter.outputs.packages == 'true' }}
      rtbus: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) || steps.filter.outputs.rtbus == 'true' }}
      infra: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) || steps.filter.outputs.infra == 'true' }}
      cpu: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) || steps.filter.outputs.cpu == 'true' }}
      cpurules: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) || steps.filter.outputs.cpurules == 'true' }}
      heavy: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          # push: фильтру нужен коммит до push (при необходимости он докачивает глубже сам); PR читает список файлов через API
          fetch-depth: ${{ github.event_name == 'push' && 100 || 1 }}
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        with:
          # Карта «файл контракта → потребители» проверена по коду (grep читателей каждого файла packages/contracts:
          # тесты-сторожа, генераторы клиентов, Dockerfile с контекстом contracts, compose); таблица — docs/systems/infra/ci.md.
          filters: |
            # CRM: свой код; rt-bus и токены (вшиты в образ / интерфейс); контракты — только те, что читают код и тесты CRM:
            # crm.yaml (экспорт OpenAPI и orval), erp-integration.yaml (клиент ERP), eds.yaml и platform-bff.yaml (тесты-сторожа
            # прав и ролей), platform-rbac.yaml (генератор ролей), mcp-tools.json (инструменты агента), события, подписки,
            # пример pairing (examples/pairing-bootstrap.json), модели rt_contracts (generated/python — path-зависимость pyproject).
            crm:
              - 'apps/crm/**'
              - 'packages/rt-bus/**'
              - 'packages/ui-tokens/**'
              - 'packages/contracts/openapi/crm.yaml'
              - 'packages/contracts/openapi/erp-integration.yaml'
              - 'packages/contracts/openapi/eds.yaml'
              - 'packages/contracts/openapi/platform-bff.yaml'
              - 'packages/contracts/platform-rbac.yaml'
              - 'packages/contracts/mcp-tools.json'
              - 'packages/contracts/events/**'
              - 'packages/contracts/bus/**'
              - 'packages/contracts/examples/pairing-bootstrap.json'
              - 'packages/contracts/generated/python/**'
              # справка формата базы знаний — источник правды docs/kb, её читают тесты CRM (бэкенд и фронтенд)
              - 'docs/kb/**'
            # ERP: свой код; rt-bus вшит в образ (B3, L14); сторож портала и интеграции читают erp-portal/-integration,
            # выгрузка схемы пишет erp-internal.yaml; mcp-tools.json — MCP-сервер; события и подписки — в образе.
            erp:
              - 'apps/erp/**'
              - 'packages/rt-bus/**'
              - 'packages/ui-tokens/**'
              - 'packages/contracts/openapi/erp-portal.yaml'
              - 'packages/contracts/openapi/erp-integration.yaml'
              - 'packages/contracts/openapi/erp-internal.yaml'
              - 'packages/contracts/mcp-tools.json'
              - 'packages/contracts/examples/pairing-bootstrap.json'
              - 'packages/contracts/events/**'
              - 'packages/contracts/bus/**'
            # Cabinet: портальный API ERP (типы из erp-portal.yaml) и форма лида CRM (src/api/crm-form.d.ts из crm.yaml).
            cabinet:
              - 'apps/cabinet/**'
              - 'packages/ui-tokens/**'
              - 'packages/contracts/openapi/erp-portal.yaml'
              - 'packages/contracts/openapi/crm.yaml'
            # Платформа: BFF строится по своему OpenAPI, модели CRM — из crm.yaml (app/clients/crm_models.py), клиент EDS —
            # по eds.yaml, роли — из platform-rbac.yaml (+ схема, генератор gen_rbac.py), токены — из ui-tokens. BFF — подписчик
            # шины (B5): rt-bus, схемы событий и подписки читаются тестами и входят в образ. client-statuses.yaml Платформа
            # не читает (по grep — никто, кроме задания contracts).
            platform:
              - 'apps/platform/**'
              - 'packages/ui-tokens/**'
              - 'packages/rt-bus/**'
              - 'packages/contracts/openapi/platform-bff.yaml'
              - 'packages/contracts/openapi/crm.yaml'
              - 'packages/contracts/openapi/eds.yaml'
              - 'packages/contracts/platform-rbac.yaml'
              - 'packages/contracts/platform-rbac.schema.json'
              - 'packages/contracts/events/**'
              - 'packages/contracts/bus/**'
              # справка формата базы знаний: docs/kb копируется в web (pnpm kb:sync), тест kbDocs сверяет копию с источником
              - 'docs/kb/**'
            # EDS (волна 12): сервис — подписчик и издатель шины; контракт eds.yaml сверяется тестом, события и подписки читает
            # шина, модели rt_contracts — path-зависимость (generated/python).
            eds:
              - 'apps/eds/**'
              - 'packages/rt-bus/**'
              - 'packages/contracts/openapi/eds.yaml'
              - 'packages/contracts/events/**'
              - 'packages/contracts/bus/**'
              - 'packages/contracts/generated/python/**'
            # packages: проверка самого контракта и токенов — на любую правку packages/ (задание contracts).
            packages:
              - 'packages/**'
            # Библиотека шины (B1): тесты адаптеров на PostgreSQL; схемы событий и подписки контракта — её тестовые данные.
            rtbus:
              - 'packages/rt-bus/**'
              - 'packages/contracts/events/**'
              - 'packages/contracts/bus/**'
            infra:
              - 'infra/**'
              - 'scripts/**'
              - '.env.example'
              - 'Makefile'
              - '.github/workflows/**'
            # Старт образов прода под CPU qemu64 (S0-7): ТОЛЬКО то, что меняет содержимое образа — Dockerfile, зависимости
            # с нативным кодом, конфиги nginx, образы infra и сами правила проверки. Правка ci.yml/deploy.yml образы не меняет
            # (W14-S2): для неё — лёгкая сверка таблицы правил (cpurules), без сборки 11 образов под qemu.
            cpu:
              - '**/Dockerfile*'
              - 'apps/crm/backend/pyproject.toml'
              - 'apps/crm/backend/uv.lock'
              - 'apps/platform/bff/pyproject.toml'
              - 'apps/platform/bff/uv.lock'
              - 'apps/eds/pyproject.toml'
              - 'apps/eds/uv.lock'
              - 'apps/erp/backend/requirements*'
              - 'apps/erp/frontend/nginx.conf'
              - 'apps/cabinet/nginx.conf'
              - 'infra/ai/litellm/**'
              - 'infra/db/**'
              - 'infra/compose/**'
              - 'infra/deploy/cpu-baseline-*'
              - 'infra/deploy/tests/cpu-baseline-test.sh'
              - 'scripts/qemu_cpu_check.sh'
            cpurules:
              - 'infra/deploy/cpu-baseline-*'
              - 'infra/deploy/tests/cpu-baseline-test.sh'
              - 'scripts/qemu_cpu_check.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'

  gitleaks:
    name: gitleaks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (история ветки; legacy/ в allowlist .gitleaks.toml)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --redact --verbose --config .gitleaks.toml .
      - name: Ссылки на документацию (scripts/check-doc-links.sh, DOCS-1)
        run: scripts/check-doc-links.sh

  # ─── CRM (apps/crm) ────────────────────────────────────────────────────────────────────────

  crm-lint:
    name: CRM · lint & typecheck
    needs: changes
    if: needs.changes.outputs.crm == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/crm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/crm/backend/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/crm/frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/crm/frontend/pnpm-lock.yaml
      - name: uv version matches backend/Dockerfile
        run: |
          image=$(sed -n 's|^FROM ghcr.io/astral-sh/uv:\([0-9.]*\).*|\1|p' backend/Dockerfile)
          if [ "$image" != "$UV_VERSION" ]; then
            echo "::error::UV_VERSION=$UV_VERSION in workflow, uv:$image in apps/crm/backend/Dockerfile"
            exit 1
          fi
      - name: Install
        run: make install
      - name: Backend — ruff, mypy
        working-directory: apps/crm/backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ruff check --config pyproject.toml ../scripts
          uv run ruff format --config pyproject.toml --check ../scripts
          uv run mypy app tests evals promptfoo alembic
      - name: Frontend — eslint, prettier, tsc
        working-directory: apps/crm/frontend
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
      - name: ui-tokens актуальны (packages/ui-tokens → tokens.generated.ts)
        working-directory: .
        run: make -C packages/ui-tokens check
      - name: OpenAPI CRM актуален (packages/contracts/openapi/crm.yaml)
        run: |
          make openapi
          git diff --exit-code -- ../../packages/contracts/openapi/crm.yaml frontend/src/api/generated \
            || (echo "::error::OpenAPI CRM или клиент orval устарели — make -C apps/crm openapi"; exit 1)

  crm-unit:
    name: CRM · unit
    needs: changes
    if: needs.changes.outputs.crm == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/crm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/crm/backend/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/crm/frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/crm/frontend/pnpm-lock.yaml
      - name: Install
        run: make install
      - name: Backend unit (pytest)
        working-directory: apps/crm/backend
        run: uv run pytest --cov --cov-report=term-missing
      - name: Frontend unit (vitest)
        working-directory: apps/crm/frontend
        run: pnpm test

  # integration, build и e2e CRM не ждут lint и unit (W14-S2): цель волны — время ответа по PR, а не экономия минут runner'а;
  # ранний провал lint раньше отменял бы зря потраченные 7 минут, но стоил 3–5 минут к критическому пути каждого PR.
  # На push в main эти задания не идут (heavy=false) — только ночью и вручную.
  crm-integration:
    name: CRM · integration
    needs: changes
    if: needs.changes.outputs.crm == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: rt
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rt -d crm_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: crm_test
      POSTGRES_USER: rt
      POSTGRES_PASSWORD: ci-only-password
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: rt
      S3_SECRET_KEY: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - name: Start RustFS (тот же образ, что в infra/compose)
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=rt -e RUSTFS_SECRET_KEY=ci-only-password \
            -e RUSTFS_ADDRESS=0.0.0.0:9000 \
            rustfs/rustfs:1.0.1
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/health && exit 0
            sleep 2
          done
          docker logs rustfs; exit 1
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/crm/backend/uv.lock
      - name: Install
        working-directory: apps/crm/backend
        run: uv sync --frozen
      - name: Integration (pytest -m integration)
        working-directory: apps/crm/backend
        run: uv run pytest -m integration -v

  crm-build:
    name: CRM · build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.crm == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: backend
            context: apps/crm/backend
            target: prod
            # Шина событий rt_bus (L14): пакет и контракт — именованные контексты Dockerfile.
            contexts: |
              rtbus=packages/rt-bus
              contracts=packages/contracts
          - name: frontend
            context: apps/crm/frontend
            target: prod
            contexts: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.contexts }}
          target: ${{ matrix.target }}
          push: false
          tags: rt-platform-crm-${{ matrix.name }}:ci
          cache-from: type=gha,scope=crm-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=crm-${{ matrix.name }}

  crm-e2e:
    name: CRM · e2e (Playwright)
    needs: changes
    if: needs.changes.outputs.crm == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: crm_e2e
          POSTGRES_USER: rt
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rt -d crm_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      LOG_FORMAT: console
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: crm_e2e
      POSTGRES_USER: rt
      POSTGRES_PASSWORD: ci-only-password
      TELEGRAM_MODE: disabled
      TELEGRAM_DRY_RUN: "true"
      E2E_MANAGER_EMAIL: manager@demo.local
      E2E_MANAGER_PASSWORD: ci-e2e-demo-42
      E2E_ADMIN_EMAIL: admin@demo.local
      E2E_ADMIN_PASSWORD: ci-e2e-boss-42
    defaults:
      run:
        working-directory: apps/crm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/crm/backend/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/crm/frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/crm/frontend/pnpm-lock.yaml
      - name: Install
        run: make install
      - name: Backend — миграции, демо-данные, API
        working-directory: apps/crm/backend
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          uv run alembic upgrade head
          uv run python -m app seed-demo --manager-password "$E2E_MANAGER_PASSWORD"
          uv run python -m app create-admin --email "$E2E_ADMIN_EMAIL" --password "$E2E_ADMIN_PASSWORD"
          nohup uv run python -m app api --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 1; done
      - name: Frontend — сборка и preview
        working-directory: apps/crm/frontend
        run: |
          pnpm build
          nohup pnpm preview --port 4173 --strictPort > ../preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/ > /dev/null && break; sleep 1; done
      - name: Playwright
        working-directory: apps/crm/frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Логи
        if: failure()
        run: tail -n 200 api.log preview.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: crm-playwright-report
          path: apps/crm/frontend/playwright-report
          retention-days: 7

  crm-audit:
    name: CRM · dependency audit
    needs: changes
    if: needs.changes.outputs.crm == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/crm/frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pip-audit (backend, prod-зависимости)
        working-directory: apps/crm/backend
        run: |
          uv export --frozen --no-dev --no-emit-project --no-emit-local --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit@2.10.1 -r /tmp/requirements.txt --no-deps --disable-pip --progress-spinner off
      - name: pnpm audit (frontend, prod, high+)
        working-directory: apps/crm/frontend
        run: pnpm audit --prod --audit-level high

  # ─── ERP и Cabinet: make check-<система> ──────────────────────────────────────────────────

  # ERP — три параллельных задания вместо одного последовательного `make check-erp` (W14-S2): линтеры и vitest, pytest,
  # миграции и дрейф схемы не ждут друг друга. Цели apps/erp/Makefile (lint, test-frontend, test-backend, openapi-check) —
  # те же, что в `make check-erp`; на push в main идут только erp-lint и erp-schema (heavy=false), pytest — ночью и на PR.
  erp-lint:
    name: ERP · lint & vitest
    needs: changes
    if: needs.changes.outputs.erp == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/erp/frontend/package-lock.json
      - name: Install (линтеры бэкенда, npm ci)
        run: make -C apps/erp install
      # flake8, black, isort, eslint, tsc, симметрия i18n
      - run: make -C apps/erp lint
      - run: make -C apps/erp test-frontend

  erp-backend:
    name: ERP · pytest
    needs: changes
    if: needs.changes.outputs.erp == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # pytest в контейнере на одноразовых Postgres 17 и Redis (apps/erp/scripts/test_backend_local.sh)
      - run: make -C apps/erp test-backend
      - name: Контейнеры тестов удалены
        if: always()
        run: apps/erp/scripts/test_backend_local.sh --down

  erp-schema:
    name: ERP · миграции и схема
    needs: changes
    if: needs.changes.outputs.erp == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/erp/frontend/package-lock.json
      - name: Install (npm ci для генерации типов)
        run: make -C apps/erp install
      - name: Миграции на чистой базе и отсутствие дрейфа моделей
        run: apps/erp/scripts/test_backend_local.sh --migration-check
      # schema.json, типы фронтенда и packages/contracts/openapi/erp-internal.yaml перегенерируются из кода; diff = падение (FIX-40)
      - name: Дрейф схемы ERP (schema.json, типы, erp-internal.yaml)
        run: make -C apps/erp openapi-check
      - name: Контейнеры тестов удалены
        if: always()
        run: apps/erp/scripts/test_backend_local.sh --down

  cabinet:
    name: Cabinet · check
    needs: changes
    if: needs.changes.outputs.cabinet == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/cabinet/package-lock.json
      - name: Install (npm ci)
        run: make -C apps/cabinet install
      # eslint + tsc + i18n (ru/uz/en) + токены + типы портального API + vitest/axe
      - run: make check-cabinet

  # ─── Платформа (apps/platform): bff на uv, web на pnpm ─────────────────────────────────────

  platform:
    name: Platform · check
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/platform/bff/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/platform/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/platform/web/pnpm-lock.yaml
      - name: Install
        run: make -C apps/platform install
      # ruff, mypy, pytest (bff); eslint, prettier, tsc, vitest (web); клиент orval и токены свежие
      - run: make check-platform

  # EDS: тесты идут против настоящего PostgreSQL (service-контейнер), как у rt-bus и CRM integration.
  eds:
    name: EDS · check
    needs: changes
    if: needs.changes.outputs.eds == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: rt
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rt -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # make check видит URL и не поднимает свой контейнер (apps/eds/scripts/with_pg.sh).
      EDS_TEST_DATABASE_URL: postgresql://rt:ci-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/eds/uv.lock
      - name: uv version matches Dockerfile
        run: |
          image=$(sed -n 's|^FROM ghcr.io/astral-sh/uv:\([0-9.]*\).*|\1|p' apps/eds/Dockerfile)
          if [ "$image" != "$UV_VERSION" ]; then
            echo "::error::UV_VERSION=$UV_VERSION in workflow, uv:$image in apps/eds/Dockerfile"
            exit 1
          fi
      - name: Install
        run: make -C apps/eds install
      # ruff check/format, mypy --strict, pytest (миграции Alembic, шина, проекция сотрудников, вход, права)
      - run: make check-eds

  # E2E Платформы (MSW, BFF не нужен) не ждёт `platform` (W14-S2): сборка `vite build --mode mock` + `vite preview`, а не dev-сервер
  # (antd приходит готовыми чанками), три шарда `--shard=i/3`, повторов нет (retries=0 в playwright.config.ts: «flaky» = красный).
  # Проект mobile (390) гоняет только сценарии с тегом @mobile. На push в main не идёт (heavy=false).
  platform-e2e:
    name: Platform · e2e (шард ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.platform == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/platform/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/platform/web/pnpm-lock.yaml
      - name: Install (pnpm)
        working-directory: apps/platform/web
        run: pnpm install --frozen-lockfile
      # Браузер Playwright привязан к версии пакета, а она — к pnpm-lock.yaml.
      - name: Кэш браузеров Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: platform-playwright-${{ runner.os }}-${{ hashFiles('apps/platform/web/pnpm-lock.yaml') }}
      # BFF и стенд не нужны: сборка в режиме mock, API отвечает MSW (VITE_API_MOCKING задаёт playwright.config.ts)
      - name: Playwright + axe
        working-directory: apps/platform/web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: platform-playwright-report-${{ matrix.shard }}
          path: apps/platform/web/playwright-report
          retention-days: 7

  # ─── packages: контракт и токены ───────────────────────────────────────────────────────────

  contracts:
    name: packages · contracts
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Совместимость схем событий (L8) и OpenAPI (oasdiff, ADR-0016) сравнивают с базой: нужен её коммит (дерево),
      # история не нужна. oasdiff — закреплённый образ в одноразовом контейнере (scripts/openapi_compat.py).
      # PR, ночной и ручной прогоны — база origin/main; push в main — коммит main ДО push (иначе main сравнивался бы сам с собой).
      - name: База для проверки совместимости
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            echo "CONTRACTS_BASE_REF=$BEFORE" >> "$GITHUB_ENV"
          else
            git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
            echo "CONTRACTS_BASE_REF=origin/main" >> "$GITHUB_ENV"
          fi
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: packages/contracts/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: packages/contracts/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: packages/contracts/pnpm-lock.yaml
      - name: make contracts
        run: make contracts
      - name: Контракт и сгенерированное совпадают
        run: |
          git diff --exit-code -- packages/contracts/generated \
            || (echo "::error::packages/contracts/generated устарел — выполните make contracts и закоммитьте"; exit 1)
          untracked=$(git status --porcelain --untracked-files=all -- packages/contracts/generated)
          [ -z "$untracked" ] \
            || (echo "::error::новые файлы в packages/contracts/generated не закоммичены: $untracked"; exit 1)

  # ─── packages: библиотека шины rt-bus (B1) ──────────────────────────────────────────────────

  rt-bus:
    name: packages · rt-bus
    needs: changes
    if: needs.changes.outputs.rtbus == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: rt
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rt -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # make check видит URL и не поднимает свой контейнер (scripts/with_pg.sh); RT_BUS_REQUIRE_PG — без пропусков.
      RT_BUS_TEST_DATABASE_URL: postgresql://rt:ci-only-password@localhost:5432/postgres
      RT_BUS_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: packages/rt-bus/uv.lock
      - name: Install
        run: make -C packages/rt-bus install
      # ruff, mypy --strict, миграция Django без дрейфа, pytest: ядро, SQLAlchemy (psycopg, asyncpg), Django (psycopg2, psycopg)
      - run: make check-rt-bus

  # ─── infra: compose и Caddy валидны ────────────────────────────────────────────────────────

  infra:
    name: infra · compose & caddy
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: .env из .env.example (без секретов)
        run: sed 's/CHANGE_ME/ci-only-value/' .env.example > .env
      - name: docker compose config (dev, с профилем observability)
        run: |
          docker compose -f infra/compose/base.yml -f infra/compose/dev.yml --env-file .env \
            --profile observability config -q
      - name: caddy validate (dev)
        run: |
          docker run --rm -v "$PWD/infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile
      # Прод-конфиги (FIX-54, G-12): те же проверки, что make deploy-check; секретов нет — CHANGE_ME подменяется заглушкой.
      - name: docker compose config (prod и db, профили observability и kb-ingest)
        env:
          RT_IMAGE_TAG: ci-only
        run: |
          sed 's/CHANGE_ME/ci-only-value/' infra/.env.prod.example > "$RUNNER_TEMP/env.prod"
          docker compose -f infra/compose/base.yml -f infra/compose/prod.yml --env-file "$RUNNER_TEMP/env.prod" \
            --profile observability --profile kb-ingest config -q
          docker compose -f infra/compose/db.yml --env-file "$RUNNER_TEMP/env.prod" config -q
      - name: caddy validate (prod)
        run: |
          docker run --rm \
            -e ACME_EMAIL=ci@example.com -e CRM_DOMAIN=crm.example.org -e ERP_DOMAIN=erp.example.org -e CABINET_DOMAIN=cabinet.example.org -e PLATFORM_DOMAIN=platform.example.org \
            -v "$PWD/infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile

  # ─── CPU прод-VPS: старт каждого образа под qemu64 (S0-7, ADR-0013 п. 8) ────────────────────────────────────────────────────
  # Прод-VPS отдают «QEMU Virtual CPU 2.5+» — базовый x86-64 без v2 (docs/runbooks/servers.md). Образ, которому нужен v2, падает здесь,
  # а не на проде после деплоя. Механика и правила — scripts/qemu_cpu_check.sh, infra/deploy/cpu-baseline-rules.sh.

  # Решение W14-S2: правка ci.yml/deploy.yml образы не меняет, а раньше запускала все 11 образов под qemu (десятки минут).
  # Теперь для неё — только лёгкая сверка таблицы правил с этими файлами (bash, без Docker и qemu); сборка и старт образов —
  # при правке Dockerfile, зависимостей с нативным кодом, infra и самих правил, а также ночью и вручную.
  cpu-rules:
    name: CPU qemu64 · таблица правил
    needs: changes
    if: needs.changes.outputs.cpu == 'true' || needs.changes.outputs.cpurules == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Таблица правил согласована с deploy.yml, ci.yml и deploy.sh
        run: bash infra/deploy/tests/cpu-baseline-test.sh

  cpu-common:
    name: CPU qemu64 · механика и сторонние образы
    needs: changes
    if: needs.changes.outputs.cpu == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Самопроверка механики (Wolfi и numpy 2.4+ обязаны падать, numpy<2.4 — проходить)
        run: scripts/qemu_cpu_check.sh selftest
      - name: Сторонние образы прода (caddy, redis, rustfs, rc)
        run: |
          for n in $(scripts/qemu_cpu_check.sh list pulled); do
            scripts/qemu_cpu_check.sh check "$n"
          done

  cpu-image:
    name: CPU qemu64 · ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.cpu == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Состав = scripts/qemu_cpu_check.sh list built (сверяет infra/deploy/tests/cpu-baseline-test.sh) = образы deploy.yml + VPS 2.
      matrix:
        image:
          - rt-crm-backend
          - rt-erp-backend
          - rt-platform-bff
          - rt-eds
          - rt-litellm
          - rt-crm-frontend
          - rt-erp-frontend
          - rt-cabinet
          - rt-platform-web
          - rt-db-postgres
          - rt-db-backup
    steps:
      - uses: actions/checkout@v7
      - name: Параметры сборки образа
        id: p
        run: scripts/qemu_cpu_check.sh params "${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Сборка ${{ matrix.image }} (linux/amd64, кэш слоёв как в deploy.yml)
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.p.outputs.context }}
          file: ${{ steps.p.outputs.file }}
          target: ${{ steps.p.outputs.target }}
          build-contexts: |
            rtbus=packages/rt-bus
            contracts=packages/contracts
          platforms: linux/amd64
          load: true
          tags: ${{ steps.p.outputs.tag }}
          cache-from: type=gha,scope=${{ steps.p.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.p.outputs.cache_scope }}
      - name: Старт ${{ matrix.image }} под qemu64
        run: scripts/qemu_cpu_check.sh check "${{ matrix.image }}"

  # ─── Итог для защиты main ──────────────────────────────────────────────────────────────────

  ci-ok:
    name: CI ok
    if: always()
    needs: [changes, gitleaks, crm-lint, crm-unit, crm-integration, crm-build, crm-e2e, crm-audit, erp-lint, erp-backend, erp-schema, cabinet, platform, platform-e2e, eds, contracts, rt-bus, infra, cpu-rules, cpu-common, cpu-image]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # На черновике job'ы не запускаются (экономия минут), и без этой проверки «CI ok» был бы
      # зелёным без единого прогона — черновик честно красный, пока его не переведут в «Ready for review».
      - name: Не черновик
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo "::error::Черновик PR: CI не запускался — переведите PR в «Ready for review»"
          exit 1
      - name: Ни один job не упал
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          if grep -Eq '"result": "(failure|cancelled)"' needs.json; then
            cat needs.json; exit 1
          fi
          echo "ok"
