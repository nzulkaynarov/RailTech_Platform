# Деплой прода (M5-INF-01, W14-S4). Запуск:
#   - автоматически после зелёного CI на push в main (workflow_run по workflow «CI»): сборка образов, затем job deploy ждёт
#     одобрения владельца в environment `production` (required reviewers) и выкладывает тот же sha;
#   - вручную (workflow_dispatch): action = deploy | rollback | build. На PR и push сам по себе не запускается.
# Красный CI, ночной прогон (schedule) и ручной прогон CI (workflow_dispatch) деплой не запускают. ci.yml не трогает.
#
# prepare:  без environment и секретов — sha, «sha входит в main» (deploy), зелёная проверка «CI ok» на этом sha (deploy), матрица образов.
# build:    девять образов параллельно (matrix, по job'у на образ), каждый со своим кэшем type=gha,scope=<образ>; push в GHCR с тегом =
#           полный git sha (только при deploy). Без environment: нужны лишь packages: write и GITHUB_TOKEN.
#           Образ rt-cabinet в режиме deploy собирает job deploy (build-args берутся из variables environment production, а в job
#           без environment они недоступны), поэтому в матрице deploy — восемь образов.
# deploy:   environment production (одобрение владельца) -> образ rt-cabinet -> загрузка infra/ на VPS 1 по SSH -> deploy.sh на сервере
#           (pg_dump-гейт баз crm, erp и eds, миграции, up) -> smoke четырёх доменов с раннера.
# build:    (action = build) только сборка без выкладки: любой ref (ветка задачи), push в GHCR НЕТ (push: false), SSH и production не
#           используются — режим проверки скорости и целостности сборки.
# rollback: rollback.sh на VPS 1 — предыдущий тег (по state на сервере), затем smoke с раннера: те же четыре домена, если в релизе
#           отката есть Платформа. Миграции БД не откатываются.
#
# Секреты environment `production` (значений здесь нет): DEPLOY_SSH_KEY (приватный ключ деплоя),
# DEPLOY_KNOWN_HOSTS (строка(и) known_hosts VPS 1: `ssh-keyscan -t ed25519 <host>`, сверенные владельцем).
# Variables environment `production`: DEPLOY_HOST (публичный IP/имя VPS 1), DEPLOY_USER, CRM_DOMAIN, ERP_DOMAIN,
# CABINET_DOMAIN, TELEGRAM_BOT_USERNAME (необязательно), PLATFORM_DOMAIN (необязательно: по умолчанию platform.railtech.uz; домен для
# smoke с раннера — сам домен читают Caddy и deploy.sh из /opt/rt/.env.prod на сервере). Секреты приложений лежат на сервере (/opt/rt/.env.prod), не здесь.
#
# workflow_run берёт этот файл из ветки по умолчанию (main): автозапуск начинает работать после слияния изменения.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git-ref (ветка, тег или sha). deploy — должен входить в main; build — любой ref; rollback — не используется
        required: true
        default: main
        type: string
      action:
        description: Действие (build — сборка образов без выкладки и без push в GHCR)
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback, build]

# Одна выкладка за раз, идущая не отменяется (cancel-in-progress: false). Из ожидающих в группе остаётся только самый новый:
# GitHub отменяет более старый ожидающий запуск, когда приходит следующий. Запуски, которые ничего не деплоят (CI не успешен,
# событие не push, режим build), получают собственную группу — иначе они вытесняли бы настоящий ожидающий деплой.
concurrency:
  group: ${{ ((github.event_name == 'workflow_dispatch' && inputs.action != 'build') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) && 'deploy-production' || format('deploy-aux-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Проверка и матрица образов
    # workflow_run: только успешный CI, только push (не schedule и не dispatch CI), только main. Ручной запуск: deploy и build.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.action != 'rollback')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read  # проверка «CI ok» на sha (check-runs)
    outputs:
      sha: ${{ steps.ver.outputs.sha }}
      owner: ${{ steps.ver.outputs.owner }}
      action: ${{ steps.ver.outputs.action }}
      push: ${{ steps.ver.outputs.push }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      # Входы — через env, а не подстановкой в скрипт (ref вводит человек)
      EVENT_NAME: ${{ github.event_name }}
      INPUT_ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Режим, sha и тег
        id: ver
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then action=deploy; else action="$INPUT_ACTION"; fi
          sha="$(git rev-parse HEAD)"
          # push в GHCR — только при deploy: образы ветки задачи (режим build) в реестр не попадают
          if [ "$action" = "deploy" ]; then push=true; else push=false; fi
          {
            echo "sha=$sha"
            echo "action=$action"
            echo "push=$push"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

      - name: ref должен входить в main
        if: steps.ver.outputs.action == 'deploy'
        env:
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          git rev-parse --verify -q origin/main >/dev/null \
            || { echo "::error::нет origin/main в клоне — не проверить, что sha входит в main"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::$SHA не входит в main — деплой только слитого кода"; exit 1; }

      - name: Зелёный «CI ok» на этом sha
        if: steps.ver.outputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
            -f check_name='CI ok' -f filter=latest -f per_page=100 \
            --jq '[.check_runs[] | {status, conclusion}]')"
          total="$(jq 'length' <<<"$runs")"
          if [ "$total" -eq 0 ]; then
            echo "::error::на $SHA нет проверки «CI ok» — CI на этом коммите не запускался; деплой только после зелёного CI"
            exit 1
          fi
          ok="$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<<"$runs")"
          if [ "$ok" -ne "$total" ]; then
            echo "::error::«CI ok» на $SHA не зелёная ($(jq -c . <<<"$runs")) — деплой не идёт"
            exit 1
          fi
          echo "«CI ok» на $SHA: success"

      - name: Матрица образов
        id: matrix
        env:
          ACTION: ${{ steps.ver.outputs.action }}
        run: |
          # context/target/build-contexts/build-args — как в прежних шагах сборки. rtbus и contracts — именованные контексты Dockerfile
          # (шина rt_bus и контракты, L14). scope кэша прежние — кэш не теряется.
          images='[
            {"image":"rt-crm-backend","context":"apps/crm/backend","target":"prod","contexts":"rtbus=packages/rt-bus\ncontracts=packages/contracts","args":"","scope":"crm-backend"},
            {"image":"rt-crm-frontend","context":"apps/crm/frontend","target":"prod","contexts":"","args":"","scope":"crm-frontend"},
            {"image":"rt-erp-backend","context":"apps/erp/backend","target":"","contexts":"rtbus=packages/rt-bus\ncontracts=packages/contracts","args":"","scope":"erp-backend"},
            {"image":"rt-erp-frontend","context":"apps/erp/frontend","target":"","contexts":"","args":"VITE_API_URL=\nVITE_WS_URL=","scope":"erp-frontend"},
            {"image":"rt-cabinet","context":"apps/cabinet","target":"","contexts":"","args":"VITE_API_URL=","scope":"cabinet"},
            {"image":"rt-litellm","context":"infra/ai/litellm","target":"","contexts":"","args":"","scope":"litellm"},
            {"image":"rt-platform-bff","context":"apps/platform/bff","target":"prod","contexts":"rtbus=packages/rt-bus\ncontracts=packages/contracts","args":"","scope":"platform-bff"},
            {"image":"rt-platform-web","context":"apps/platform/web","target":"prod","contexts":"","args":"","scope":"platform-web"},
            {"image":"rt-eds","context":"apps/eds","target":"prod","contexts":"rtbus=packages/rt-bus\ncontracts=packages/contracts","args":"","scope":"eds"}
          ]'
          # deploy: rt-cabinet собирает job deploy (его build-args — из variables environment production); build: все девять
          echo "matrix=$(jq -c --arg a "$ACTION" '{include: (if $a == "build" then . else map(select(.image != "rt-cabinet")) end)}' <<<"$images")" >> "$GITHUB_OUTPUT"

  build:
    name: Образ ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Без environment production: образы не требуют ни секретов, ни одобрения. Нужны только push в GHCR (при deploy) и GITHUB_TOKEN.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: needs.prepare.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Образ ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.contexts }}
          build-args: ${{ matrix.args }}
          target: ${{ matrix.target }}
          # push: false (режим build) — образ только собирается: ветка задачи не кладёт в GHCR образы с тегом не из main
          push: ${{ needs.prepare.outputs.push == 'true' }}
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}:${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  deploy:
    name: Выкладка на VPS 1
    needs: [prepare, build]
    if: needs.prepare.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      CRM_DOMAIN: ${{ vars.CRM_DOMAIN }}
      ERP_DOMAIN: ${{ vars.ERP_DOMAIN }}
      CABINET_DOMAIN: ${{ vars.CABINET_DOMAIN }}
      PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN || 'platform.railtech.uz' }}
    steps:
      - name: Проверка переменных окружения production
        run: |
          for v in DEPLOY_HOST DEPLOY_USER CRM_DOMAIN ERP_DOMAIN CABINET_DOMAIN PLATFORM_DOMAIN; do
            [ -n "${!v}" ] || { echo "::error::не задана переменная environment production: $v"; exit 1; }
          done

      # Тот же sha, что собран в build (не ref: за время ожидания одобрения ветка могла уйти вперёд)
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: SSH к VPS 1
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::нет секретов DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS в environment production"; exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host app"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config

      - name: Проверка - этот sha уже выложен?
        id: already
        env:
          TAG: ${{ needs.prepare.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Повторный автозапуск на тот же sha (два workflow_run подряд; concurrency их лишь выстраивает в очередь) не должен
          # выкладывать то же самое второй раз. Пропуск только для workflow_run: ручной deploy (workflow_dispatch) выкладывает
          # всегда — так владелец повторяет выкладку, у которой упал smoke (current_tag выставляется до smoke).
          if [ "$EVENT_NAME" = workflow_run ]; then
            # shellcheck disable=SC2029
            cur="$(ssh app "cat /opt/rt/state/current_tag 2>/dev/null || true")" || cur=""   # нет связи - не пропускаем, выкладываем
            if [ "$cur" = "$TAG" ]; then
              echo "sha $TAG уже current_tag на VPS 1 - повторная выкладка пропущена"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - if: steps.already.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.already.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Образ rt-cabinet
        if: steps.already.outputs.skip != 'true'
        # VITE_BOT_USERNAME и VITE_CRM_URL зашиваются в образ и берутся из variables environment production, поэтому образ
        # собирается здесь, а не в job build (без environment этих значений нет).
        uses: docker/build-push-action@v6
        with:
          context: apps/cabinet
          build-args: |
            VITE_API_URL=
            VITE_BOT_USERNAME=${{ vars.TELEGRAM_BOT_USERNAME }}
            VITE_CRM_URL=https://${{ vars.CRM_DOMAIN }}
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/rt-cabinet:${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=cabinet
          cache-to: type=gha,mode=max,scope=cabinet

      - name: Загрузка релиза на VPS 1
        if: steps.already.outputs.skip != 'true'
        env:
          TAG: ${{ needs.prepare.outputs.sha }}
        run: |
          # TAG — полный git sha из шага ver; подстановка на клиенте намеренная
          tar -czf release.tgz infra apps/crm/infra/casbin packages/contracts/mcp-tools.json
          # shellcheck disable=SC2029
          ssh app "mkdir -p /opt/rt/releases/$TAG"
          # shellcheck disable=SC2029
          ssh app "tar -xzf - -C /opt/rt/releases/$TAG" < release.tgz

      - name: Деплой на VPS 1 (pg_dump-гейт, миграции, up)
        if: steps.already.outputs.skip != 'true'
        env:
          TAG: ${{ needs.prepare.outputs.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # Токен прогона (живёт до конца job) — только для pull; передаётся через stdin, не в командной строке.
          # TAG/GHCR_USER — sha и логин GitHub; подстановка на клиенте намеренная.
          # Сеть к ghcr.io плавает («TLS handshake timeout»): login — до пяти попыток с паузами 5/10/20/40 с (retry из lib.sh;
          # токен каждый раз подаётся заново через stdin, в журнал он не попадает). Сам pull с повторами делает deploy.sh.
          # shellcheck source=infra/deploy/lib.sh
          source infra/deploy/lib.sh
          ghcr_login() {
            # shellcheck disable=SC2029
            printf '%s' "$GHCR_TOKEN" | ssh app "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          }
          retry "docker login ghcr.io" ghcr_login
          # shellcheck disable=SC2029
          ssh app "bash /opt/rt/releases/$TAG/infra/deploy/deploy.sh $TAG"

      - name: Smoke четырёх доменов (с раннера)
        if: steps.already.outputs.skip != 'true'
        run: |
          bash infra/deploy/smoke.sh --domains "$CRM_DOMAIN" "$ERP_DOMAIN" "$CABINET_DOMAIN" "$PLATFORM_DOMAIN" --retries 12

      - name: Выход из GHCR на сервере
        if: always()
        run: ssh app "docker logout ghcr.io" || true

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      CRM_DOMAIN: ${{ vars.CRM_DOMAIN }}
      ERP_DOMAIN: ${{ vars.ERP_DOMAIN }}
      CABINET_DOMAIN: ${{ vars.CABINET_DOMAIN }}
      PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN || 'platform.railtech.uz' }}
    steps:
      - name: Проверка переменных окружения production
        run: |
          for v in DEPLOY_HOST DEPLOY_USER CRM_DOMAIN ERP_DOMAIN CABINET_DOMAIN PLATFORM_DOMAIN; do
            [ -n "${!v}" ] || { echo "::error::не задана переменная environment production: $v"; exit 1; }
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: SSH к VPS 1
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::нет секретов DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS в environment production"; exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host app"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config

      - name: Откат кода на предыдущий тег
        # Скрипт берётся из текущего релиза на сервере (/opt/rt/current); образы предыдущего тега уже лежат на VPS 1.
        run: ssh app "bash /opt/rt/current/infra/deploy/rollback.sh"

      - name: Smoke доменов с раннера (четыре, если в релизе отката есть Платформа)
        # Те же четыре домена, что и после деплоя (INF-P1-0). Откат может вернуть релиз до Платформы (INF-P0-5) — тогда
        # платформенного домена в нём нет и проверять нечего (rollback.sh на сервере делает то же различие по
        # `compose config --services`). /opt/rt/current после отката указывает на релиз отката; Платформа в нём — это
        # сервис platform-bff в base.yml. grep: 0 — есть, 1 — нет, иначе (ssh 255 и т. п.) — ошибка, а не молчаливый пропуск.
        run: |
          domains=("$CRM_DOMAIN" "$ERP_DOMAIN" "$CABINET_DOMAIN")
          rc=0
          ssh app "grep -q '^  platform-bff:' /opt/rt/current/infra/compose/base.yml" || rc=$?
          case "$rc" in
            0) domains+=("$PLATFORM_DOMAIN") ;;
            1) echo "В релизе отката нет Платформы — проверяются три домена" ;;
            *) echo "::error::не удалось определить, есть ли Платформа в релизе отката (код $rc)"; exit 1 ;;
          esac
          bash infra/deploy/smoke.sh --domains "${domains[@]}" --retries 12
