# Деплой прода: РУЧНОЙ путь (M5-INF-01, W14-S4). Автоматическую выкладку ведёт таймер сервера (ВЫКЛ-3, DECISIONS 2026-11-28):
# расписание GitHub на этом репозитории опаздывало на 6-9 часов, поэтому кроны из этого файла убраны. Образы после зелёного CI собирает
# images.yml (workflow_run), а infra/deploy/auto-deploy.sh на VPS 1 (systemd-таймер раз в 10 минут) решает по часам Ташкента и активности
# в Платформе и выкладывает сам, с автооткатом; подробно - docs/runbooks/deploy.md. Здесь остаётся запуск вручную (workflow_dispatch):
# action = deploy | rollback | build. deploy и rollback ждут одобрения владельца в job approve (environment `production-approval`);
# на PR, push и после CI этот workflow не запускается. Ручные deploy и rollback берут на сервере тот же замок state/deploy.lock, что и таймер
# (flock), поэтому одновременно с автовыкладкой не идут. ci.yml не трогает.
#
# Одобрение без дублирования секретов: секреты и variables лежат только в environment `production` (его используют deploy и rollback;
# после ВЫКЛ-1 в нём НЕТ required reviewers, а ветки деплоя ограничены main). Ожидание человека - отдельный job approve в
# environment `production-approval` БЕЗ секретов: в нём ОБЯЗАТЕЛЕН required reviewer = владелец. approve запускается только при ручном
# deploy/rollback; deploy и rollback идут после него (только при успехе approve). Отклонённое или
# упавшее одобрение выкладку блокирует.
# Очередь: concurrency `deploy-production` стоит на jobs deploy и rollback, а не на всём запуске, - запуск, забытый в ожидании
# одобрения, группу не держит. Первый шаг prepare отменяет (actions: write) более старые запуски Deploy в статусах waiting/queued/pending.
#
# prepare:  без environment и секретов - sha, «sha входит в main» (deploy), зелёная проверка
#           «CI ok» на этом sha (deploy), матрица образов.
# build:    семь образов параллельно (matrix, по job'у на образ), каждый со своим кэшем type=gha,scope=<образ>; push в GHCR с тегом =
#           полный git sha (только при deploy). Без environment: нужны лишь packages: write и GITHUB_TOKEN.
#           Образ rt-cabinet в режиме deploy собирает job deploy (build-args берутся из variables environment production, а в job
#           без environment они недоступны), поэтому в матрице deploy - шесть образов.
# approve:  (только ручной deploy/rollback) environment production-approval - ждёт владельца; секретов нет.
# deploy:   environment production -> образ rt-cabinet -> загрузка infra/ на VPS 1 по SSH -> deploy.sh на сервере
#           (pg_dump-гейт баз crm, erp и eds, миграции, up) -> smoke четырёх доменов с раннера -> снятие предупреждения о
#           плановом обновлении (/opt/rt/maintenance/maintenance.json, DECISIONS 2026-11-23). Неуспешный smoke -> АВТООТКАТ:
#           rollback.sh на предыдущий тег + smoke, затем запуск падает (красный) - выкладка не считается успешной.
# build:    (action = build) только сборка без выкладки: любой ref (ветка задачи), push в GHCR НЕТ (push: false), SSH и production не
#           используются - режим проверки скорости и целостности сборки.
#
# Секреты environment `production` (значений здесь нет): DEPLOY_SSH_KEY (приватный ключ деплоя),
# DEPLOY_KNOWN_HOSTS (строка(и) known_hosts VPS 1: `ssh-keyscan -t ed25519 <host>`, сверенные владельцем).
# Variables environment `production`: DEPLOY_HOST (публичный IP/имя VPS 1), DEPLOY_USER, CRM_DOMAIN, ERP_DOMAIN,
# CABINET_DOMAIN, PLATFORM_DOMAIN (необязательно: по умолчанию platform.railtech.uz; домен для
# smoke с раннера — сам домен читают Caddy и deploy.sh из /opt/rt/.env.prod на сервере). Секреты приложений лежат на сервере (/opt/rt/.env.prod), не здесь.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git-ref (ветка, тег или sha). deploy — должен входить в main; build — любой ref; rollback — не используется
        required: true
        default: main
        type: string
      action:
        description: Действие (build — сборка образов без выкладки и без push в GHCR)
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback, build]

# Одна выкладка за раз: concurrency `deploy-production` стоит на jobs deploy и rollback (cancel-in-progress: false). Workflow-уровня нет:
# запуск, ожидающий одобрения (approve), группу не держит и свежий запуск не блокирует.

permissions:
  contents: read

jobs:
  prepare:
    name: Проверка и матрица образов
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read  # проверка «CI ok» на sha (check-runs)
      statuses: read  # статус stand-ok на sha
      actions: write  # только здесь: отмена устаревших ожидающих запусков Deploy
    outputs:
      sha: ${{ steps.ver.outputs.sha }}
      date: ${{ steps.ver.outputs.date }}
      owner: ${{ steps.ver.outputs.owner }}
      action: ${{ steps.ver.outputs.action }}
      push: ${{ steps.ver.outputs.push }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      # Входы — через env, а не подстановкой в скрипт (ref вводит человек)
      INPUT_ACTION: ${{ inputs.action }}
    steps:
      # Запуск, забытый в ожидании одобрения (или застрявший в очереди), не должен ничего держать: отменяем более старые запуски
      # этого workflow в статусах waiting/queued/pending (кроме себя). Идущие (in_progress) не трогаем.
      - name: Отмена устаревших ожидающих запусков Deploy
        if: inputs.action != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mine="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          for st in waiting queued pending; do
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" -f status="$st" -f per_page=100 \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .created_at < \"$mine\") | .id" |
            while read -r id; do
              [ -n "$id" ] || continue
              echo "отмена устаревшего запуска $id (статус $st)"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null \
                || echo "::warning::не удалось отменить запуск $id"
            done
          done

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Режим, sha и тег
        id: ver
        run: |
          action="$INPUT_ACTION"
          sha="$(git rev-parse HEAD)"
          # push в GHCR — только при deploy: образы ветки задачи (режим build) в реестр не попадают
          if [ "$action" = "deploy" ]; then push=true; else push=false; fi
          {
            echo "sha=$sha"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "action=$action"
            echo "push=$push"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

      - name: ref должен входить в main
        if: steps.ver.outputs.action == 'deploy'
        env:
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          git rev-parse --verify -q origin/main >/dev/null \
            || { echo "::error::нет origin/main в клоне — не проверить, что sha входит в main"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::$SHA не входит в main — деплой только слитого кода"; exit 1; }

      - name: Зелёный «CI ok» на этом sha
        if: steps.ver.outputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
            -f check_name='CI ok' -f filter=latest -f per_page=100 \
            --jq '[.check_runs[] | {status, conclusion, started_at}] | sort_by(.started_at) | if length > 0 then [last] else [] end')"
          total="$(jq 'length' <<<"$runs")"
          if [ "$total" -eq 0 ]; then
            echo "::error::на $SHA нет проверки «CI ok» — CI на этом коммите не запускался; деплой только после зелёного CI"
            exit 1
          fi
          ok="$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<<"$runs")"
          if [ "$ok" -ne "$total" ]; then
            echo "::error::«CI ok» на $SHA не зелёная ($(jq -c . <<<"$runs")) — деплой не идёт"
            exit 1
          fi
          echo "«CI ok» на $SHA: success"

      # Решение владельца 2026-11-28: на прод ничего не идёт, пока не проверено на тестовом стенде. Серверный таймер без статуса stand-ok
      # (scripts/stand-ok.sh) ничего не выкладывает; ручной deploy не блокируется (одобрение владельца в job approve - сам гейт), но громко предупреждает.
      - name: Проверка на стенде (статус stand-ok)
        if: steps.ver.outputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          st="$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" -f per_page=100 \
            --jq '[.[] | select(.context == "stand-ok")] | sort_by(.created_at) | last | .state // "none"')" || st=unknown
          if [ "$st" = success ]; then
            echo "stand-ok на $SHA: success"
          else
            msg="НА $SHA НЕТ stand-ok (состояние: $st) - этот sha не принят на тестовом стенде. Ручная выкладка не блокируется: решает одобрение владельца."
            echo "::warning::$msg"
            { echo "## ВНИМАНИЕ: не проверено на стенде"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Матрица образов
        id: matrix
        env:
          ACTION: ${{ steps.ver.outputs.action }}
        run: |
          # context/target/build-contexts/build-args — как в прежних шагах сборки. rtbus и contracts — именованные контексты Dockerfile
          # (шина rt_bus и контракты, L14). scope кэша прежние — кэш не теряется.
          images='[
            {"image":"rt-crm-backend","context":"apps/crm/backend","target":"prod","contexts":"rtbus=packages/rt-bus\ncontracts=packages/contracts","args":"","scope":"crm-backend"},
            {"image":"rt-erp-backend","context":"apps/erp/backend","target":"","contexts":"rtbus=packages/rt-bus\ncontracts=packages/contracts\nrtdocs=packages/rt-docs","args":"","scope":"erp-backend"},
            {"image":"rt-cabinet","context":"apps/cabinet","target":"","contexts":"","args":"VITE_API_URL=","scope":"cabinet"},
            {"image":"rt-litellm","context":"infra/ai/litellm","target":"","contexts":"","args":"","scope":"litellm"},
            {"image":"rt-platform-bff","context":"apps/platform/bff","target":"prod","contexts":"rtbus=packages/rt-bus\ncontracts=packages/contracts","args":"","scope":"platform-bff"},
            {"image":"rt-platform-web","context":"apps/platform/web","target":"prod","contexts":"","args":"","scope":"platform-web"},
            {"image":"rt-eds","context":"apps/eds","target":"prod","contexts":"rtbus=packages/rt-bus\ncontracts=packages/contracts\nrtdocs=packages/rt-docs","args":"","scope":"eds"}
          ]'
          # deploy: rt-cabinet собирает job deploy (его build-args — из variables environment production); build: все семь
          echo "matrix=$(jq -c --arg a "$ACTION" '{include: (if $a == "build" then . else map(select(.image != "rt-cabinet")) end)}' <<<"$images")" >> "$GITHUB_OUTPUT"

  build:
    name: Образ ${{ matrix.image }}
    needs: prepare
    # Явное условие: без него GitHub пропускает job, если пропущен job выше по цепочке.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Без environment production: образы не требуют ни секретов, ни одобрения. Нужны только push в GHCR (при deploy) и GITHUB_TOKEN.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: needs.prepare.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Образ ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.contexts }}
          # BFF получает sha и дату сборки — версия «О системе» (W-REL); пустые строки build-push-action пропускает.
          build-args: |
            ${{ matrix.args }}
            ${{ matrix.image == 'rt-platform-bff' && format('PLATFORM_BUILD_SHA={0}', needs.prepare.outputs.sha) || '' }}
            ${{ matrix.image == 'rt-platform-bff' && format('PLATFORM_BUILD_DATE={0}', needs.prepare.outputs.date) || '' }}
          target: ${{ matrix.target }}
          # push: false (режим build) — образ только собирается: ветка задачи не кладёт в GHCR образы с тегом не из main
          push: ${{ needs.prepare.outputs.push == 'true' }}
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}:${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  # Одобрение владельца для РУЧНОГО deploy/rollback. Environment production-approval: required reviewer = владелец, секретов нет.
  approve:
    name: Одобрение владельца
    needs: prepare
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.action == 'deploy' || inputs.action == 'rollback')
      && (inputs.action == 'rollback' || needs.prepare.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 720  # ожидание решения человека; потом запуск отменит prepare следующего
    environment: production-approval
    steps:
      - run: echo "Одобрено - действие ${{ inputs.action }}"

  deploy:
    name: Выкладка на VPS 1
    needs: [prepare, build, approve]
    # Только ручной запуск: нужен success у approve (одобрение владельца), prepare и build. Отклонённое/упавшее одобрение блокирует.
    if: >-
      !cancelled() && needs.prepare.outputs.action == 'deploy' && needs.prepare.result == 'success' && needs.build.result == 'success'
      && needs.approve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    # Для «Что нового» (job release-notes, W-REL): прежний тег на VPS 1 и решение «выкладка пропущена».
    outputs:
      previous: ${{ steps.already.outputs.previous }}
      skip: ${{ steps.already.outputs.skip }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      CRM_DOMAIN: ${{ vars.CRM_DOMAIN }}
      ERP_DOMAIN: ${{ vars.ERP_DOMAIN }}
      CABINET_DOMAIN: ${{ vars.CABINET_DOMAIN }}
      PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN || 'platform.railtech.uz' }}
    steps:
      - name: Проверка переменных окружения production
        run: |
          for v in DEPLOY_HOST DEPLOY_USER CRM_DOMAIN ERP_DOMAIN CABINET_DOMAIN PLATFORM_DOMAIN; do
            [ -n "${!v}" ] || { echo "::error::не задана переменная environment production: $v"; exit 1; }
          done

      # Тот же sha, что собран в build (не ref: за время ожидания одобрения ветка могла уйти вперёд).
      # fetch-depth: 0 — шагу «Проверка» нужна история, чтобы отличить более старый sha от более нового (should-deploy.sh).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: SSH к VPS 1
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::нет секретов DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS в environment production"; exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host app"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config

      - name: Проверка - этот sha уже выложен или старше выложенного?
        id: already
        env:
          TAG: ${{ needs.prepare.outputs.sha }}
        run: |
          # Выкладка идёт только вручную (workflow_dispatch после одобрения владельца): выкладывает всегда - так владелец повторяет выкладку,
          # у которой упал smoke (current_tag выставляется до smoke), или сознательно откатывается на старый sha; решение только пишется в журнал.
          # Автоматическую выкладку ведёт таймер сервера (infra/deploy/auto-deploy.sh, ВЫКЛ-3) - он не откатывает и не повторяет sha из failed_tags.
          # shellcheck disable=SC2029
          cur="$(ssh app "cat /opt/rt/state/current_tag 2>/dev/null || true")" || cur=""   # нет связи - не пропускаем, выкладываем
          cur="$(tr -d '[:space:]' <<<"$cur")"
          echo "previous=$cur" >> "$GITHUB_OUTPUT"
          decision="$(bash infra/deploy/should-deploy.sh "$TAG" "$cur")"
          echo "sha $TAG, current_tag на VPS 1: ${cur:-<пусто>} - решение автовыкладки было бы: $decision"
          [ "$decision" = deploy ] || echo "::notice::ручной запуск: автовыкладка выбрала бы $decision - выкладываем по явному запросу владельца"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - if: steps.already.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.already.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Образ rt-cabinet
        if: steps.already.outputs.skip != 'true'
        # VITE_CRM_URL зашивается в образ и берутся из variables environment production, поэтому образ
        # собирается здесь, а не в job build (без environment этого значения нет).
        uses: docker/build-push-action@v6
        with:
          context: apps/cabinet
          build-args: |
            VITE_API_URL=
            VITE_CRM_URL=https://${{ vars.CRM_DOMAIN }}
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/rt-cabinet:${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=cabinet
          cache-to: type=gha,mode=max,scope=cabinet

      - name: Загрузка релиза на VPS 1
        if: steps.already.outputs.skip != 'true'
        env:
          TAG: ${{ needs.prepare.outputs.sha }}
        run: |
          # TAG — полный git sha из шага ver; подстановка на клиенте намеренная
          tar -czf release.tgz infra apps/crm/infra/casbin packages/contracts/mcp-tools.json scripts/maintenance-notice.sh
          # shellcheck disable=SC2029
          ssh app "mkdir -p /opt/rt/releases/$TAG"
          # shellcheck disable=SC2029
          ssh app "tar -xzf - -C /opt/rt/releases/$TAG" < release.tgz

      - name: Деплой на VPS 1 (pg_dump-гейт, миграции, up)
        id: deployvps
        if: steps.already.outputs.skip != 'true'
        env:
          TAG: ${{ needs.prepare.outputs.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # Токен прогона (живёт до конца job) — только для pull; передаётся через stdin, не в командной строке.
          # TAG/GHCR_USER — sha и логин GitHub; подстановка на клиенте намеренная.
          # Сеть к ghcr.io плавает («TLS handshake timeout»): login — до пяти попыток с паузами 5/10/20/40 с (retry из lib.sh;
          # токен каждый раз подаётся заново через stdin, в журнал он не попадает). Сам pull с повторами делает deploy.sh.
          # shellcheck source=infra/deploy/lib.sh
          source infra/deploy/lib.sh
          ghcr_login() {
            # shellcheck disable=SC2029
            printf '%s' "$GHCR_TOKEN" | ssh app "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          }
          retry "docker login ghcr.io" ghcr_login
          # shellcheck disable=SC2029
          # Замок state/deploy.lock - тот же, что берёт серверный таймер auto-deploy.sh: ручная выкладка и таймер не идут одновременно (ждём до 30 минут).
          ssh app "mkdir -p /opt/rt/state && flock -w 1800 /opt/rt/state/deploy.lock bash /opt/rt/releases/$TAG/infra/deploy/deploy.sh $TAG"

      - name: Smoke четырёх доменов (с раннера)
        id: smoke
        if: steps.already.outputs.skip != 'true'
        run: |
          bash infra/deploy/smoke.sh --domains "$CRM_DOMAIN" "$ERP_DOMAIN" "$CABINET_DOMAIN" "$PLATFORM_DOMAIN" --retries 12

      # Автооткат (ВЫКЛ-1): упал deploy.sh (его smoke и проверка EDS идут ПОСЛЕ переключения current_tag) или smoke с раннера.
      # Откатываем, только если на сервере current_tag == TAG и previous_tag непуст и != TAG: сбой до переключения (pull, cpu-check,
      # pg_dump-гейт, миграции) старый релиз не трогает - откат увёл бы на ещё более старый. Откат: rollback.sh + smoke с раннера,
      # TAG пишется в state/failed_tags (ночная выкладка его больше не берёт), баннер снимается, запуск красный.
      # Миграции не откатываются (docs/runbooks/deploy.md, п. 3).
      - name: Автооткат после неуспешной выкладки
        id: autorollback
        if: failure() && (steps.deployvps.conclusion == 'failure' || steps.smoke.conclusion == 'failure')
        env:
          TAG: ${{ needs.prepare.outputs.sha }}
          PREVIOUS_ON_SERVER: ${{ steps.already.outputs.previous }}
        run: |
          # ручной повтор sha, уже стоявшего на сервере до запуска: сбой до переключения не должен откатывать прод на прежний релиз
          if [ "$PREVIOUS_ON_SERVER" = "$TAG" ]; then
            echo "::error::sha $TAG уже был выложен до этого запуска - автооткат не выполняется"
            exit 1
          fi
          # shellcheck disable=SC2029
          cur="$(ssh app "cat /opt/rt/state/current_tag 2>/dev/null || true")" || cur=""
          # shellcheck disable=SC2029
          prev="$(ssh app "cat /opt/rt/state/previous_tag 2>/dev/null || true")" || prev=""
          cur="$(tr -d '[:space:]' <<<"$cur")"; prev="$(tr -d '[:space:]' <<<"$prev")"
          if [ "$cur" != "$TAG" ] || [ -z "$prev" ] || [ "$prev" = "$TAG" ]; then
            echo "::error::выкладка упала до переключения на $TAG (current_tag=${cur:-<пусто>}, previous_tag=${prev:-<пусто>}) - автооткат не нужен или невозможен"
            exit 1
          fi
          echo "::error::выкладка $TAG не прошла проверки после переключения - автооткат на $prev"
          # shellcheck disable=SC2029
          ssh app "mkdir -p /opt/rt/state && echo '$TAG' >> /opt/rt/state/failed_tags" \
            || echo "::warning::не удалось записать failed_tags"
          ssh app "flock -w 1800 /opt/rt/state/deploy.lock bash /opt/rt/current/infra/deploy/rollback.sh" || { echo "::error::АВТООТКАТ НЕ УДАЛСЯ - прод требует ручного вмешательства (п. 3 runbook)"; exit 1; }
          domains=("$CRM_DOMAIN" "$ERP_DOMAIN" "$CABINET_DOMAIN")
          rc=0
          ssh app "grep -q '^  platform-bff:' /opt/rt/current/infra/compose/base.yml" || rc=$?
          case "$rc" in
            0) domains+=("$PLATFORM_DOMAIN") ;;
            1) ;;
            *) echo "::error::не удалось определить, есть ли Платформа в релизе отката (код $rc)"; exit 1 ;;
          esac
          bash infra/deploy/smoke.sh --domains "${domains[@]}" --retries 12 \
            || { echo "::error::smoke после автоотката не прошёл - прод требует ручного вмешательства"; exit 1; }
          ssh app "rm -f /opt/rt/maintenance/maintenance.json" || true
          echo "::error::выкладка $TAG откатена автоматически на $prev. Прод работает на предыдущем теге."
          exit 1

      - name: Снять предупреждение о плановом обновлении
        # Баннер «Обновление в ЧЧ:ММ» (DECISIONS 2026-11-23) показывается, пока на VPS 1 лежит /opt/rt/maintenance/maintenance.json
        # (scripts/maintenance-notice.sh). После успешной выкладки и smoke файл удаляется; сбой удаления выкладку не отменяет.
        if: success()
        run: ssh app "rm -f /opt/rt/maintenance/maintenance.json" || echo "::warning::не удалось снять предупреждение о плановом обновлении - scripts/maintenance-notice.sh clear на VPS 1"

      - name: Выход из GHCR на сервере
        if: always()
        run: ssh app "docker logout ghcr.io" || true

  # «Что нового» (W-REL): после успешной выкладки — черновик записи docs/kb/help/changelog/<дата>.md из строк «Для пользователей»
  # PR, влитых с прошлого тега (scripts/release_notes.py). Бот в main не пишет и PR не открывает (DECISIONS 2026-11-22:
  # «Что нового» — раз в неделю): черновик остаётся в сводке job и артефакте прогона, недельную запись лид собирает
  # одним PR. Сбой этой job выкладку не отменяет (continue-on-error).
  release-notes:
    name: «Что нового» — черновик записи
    needs: [prepare, deploy]
    if: ${{ !cancelled() && needs.prepare.outputs.action == 'deploy' && needs.deploy.result == 'success' && needs.deploy.outputs.skip != 'true' && needs.deploy.outputs.previous != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Запись из строк «Для пользователей»
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ needs.deploy.outputs.previous }}
          TO: ${{ needs.prepare.outputs.sha }}
        run: |
          day="$(date -u +%Y-%m-%d)"
          python3 scripts/release_notes.py --from "$FROM" --to "$TO" --repo "$GITHUB_REPOSITORY" --date "$day" \
            --out-dir docs/kb/help/changelog | tee notes.log
          file="docs/kb/help/changelog/$day.md"
          if git status --porcelain -- "$file" | grep -q .; then
            node apps/platform/web/scripts/sync-kb-docs.mjs   # копия для сборки web (тест changelog.test.ts)
            { echo "## Черновик «Что нового» $day"; echo; cat "$file"; } >> "$GITHUB_STEP_SUMMARY"
            echo "file=$file" >> "$GITHUB_OUTPUT"
            echo "day=$day" >> "$GITHUB_OUTPUT"
          fi

      - name: Артефакт черновика
        if: steps.notes.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.notes.outputs.day }}
          path: ${{ steps.notes.outputs.file }}

  rollback:
    needs: approve
    if: "!cancelled() && github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' && needs.approve.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      CRM_DOMAIN: ${{ vars.CRM_DOMAIN }}
      ERP_DOMAIN: ${{ vars.ERP_DOMAIN }}
      CABINET_DOMAIN: ${{ vars.CABINET_DOMAIN }}
      PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN || 'platform.railtech.uz' }}
    steps:
      - name: Проверка переменных окружения production
        run: |
          for v in DEPLOY_HOST DEPLOY_USER CRM_DOMAIN ERP_DOMAIN CABINET_DOMAIN PLATFORM_DOMAIN; do
            [ -n "${!v}" ] || { echo "::error::не задана переменная environment production: $v"; exit 1; }
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: SSH к VPS 1
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::нет секретов DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS в environment production"; exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host app"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config

      - name: Откат кода на предыдущий тег
        # Скрипт берётся из текущего релиза на сервере (/opt/rt/current); образы предыдущего тега уже лежат на VPS 1.
        run: ssh app "mkdir -p /opt/rt/state && flock -w 1800 /opt/rt/state/deploy.lock bash /opt/rt/current/infra/deploy/rollback.sh"

      - name: Smoke доменов с раннера (четыре, если в релизе отката есть Платформа)
        # Те же четыре домена, что и после деплоя (INF-P1-0). Откат может вернуть релиз до Платформы (INF-P0-5) — тогда
        # платформенного домена в нём нет и проверять нечего (rollback.sh на сервере делает то же различие по
        # `compose config --services`). /opt/rt/current после отката указывает на релиз отката; Платформа в нём — это
        # сервис platform-bff в base.yml. grep: 0 — есть, 1 — нет, иначе (ssh 255 и т. п.) — ошибка, а не молчаливый пропуск.
        run: |
          domains=("$CRM_DOMAIN" "$ERP_DOMAIN" "$CABINET_DOMAIN")
          rc=0
          ssh app "grep -q '^  platform-bff:' /opt/rt/current/infra/compose/base.yml" || rc=$?
          case "$rc" in
            0) domains+=("$PLATFORM_DOMAIN") ;;
            1) echo "В релизе отката нет Платформы — проверяются три домена" ;;
            *) echo "::error::не удалось определить, есть ли Платформа в релизе отката (код $rc)"; exit 1 ;;
          esac
          bash infra/deploy/smoke.sh --domains "${domains[@]}" --retries 12
