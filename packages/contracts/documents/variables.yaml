# Каталог документов: виды, переменные-чипы и блоки с замком (ADR-0020, semver 1.0.0 — variables.schema.json).
# Читают: packages/rt-docs (подпись неразрешённой переменной и блока по языку документа, проверка обязательных блоков),
# редактор Платформы (меню «/» → «Переменная», «Блок») — D-DOC2, D-DOC3. Подписи: ru, uz (латиница, ʻ = U+02BB в oʻ и gʻ), en.
# Коды переменных ERP (`crm/services/document_placeholders.py`) сохранены; плоский `today` → `system.today` (конвертер
# HTML → JSON переводит сам). Значения подставляет домен-владелец: EDS — письма и служебки, ERP — коммерческие виды.
# Правило изменения: новые коды и виды — добавлением (минор), удаление или переименование кода — мажор (ADR-0016).
version: 1

kinds:
  letter: { label: { ru: Письмо, uz: Xat, en: Letter }, layout: letter, domain: eds }
  memo: { label: { ru: Служебная записка, uz: Xizmat xati, en: Memo }, layout: internal, domain: eds }
  application: { label: { ru: Заявление, uz: Ariza, en: Application }, layout: internal, domain: eds }
  report: { label: { ru: Отчёт, uz: Hisobot, en: Report }, layout: internal, domain: eds }
  custom: { label: { ru: Произвольный документ, uz: Erkin hujjat, en: Custom document }, layout: letter, domain: eds }
  quote: { label: { ru: Коммерческое предложение, uz: Tijorat taklifi, en: Quotation }, layout: commercial, domain: erp }
  contract: { label: { ru: Договор, uz: Shartnoma, en: Contract }, layout: commercial, domain: erp }
  invoice: { label: { ru: Счёт на оплату, uz: Toʻlov uchun hisob, en: Invoice }, layout: commercial, domain: erp }
  act:
    label: { ru: Акт выполненных работ, uz: Bajarilgan ishlar dalolatnomasi, en: Certificate of completion }
    layout: commercial
    domain: erp
  receipt: { label: { ru: Квитанция, uz: Kvitansiya, en: Receipt }, layout: commercial, domain: erp }
  delivery_note: { label: { ru: Накладная, uz: Yuk xati, en: Delivery note }, layout: commercial, domain: erp }
  specification: { label: { ru: Спецификация, uz: Spetsifikatsiya, en: Specification }, layout: commercial, domain: erp }

