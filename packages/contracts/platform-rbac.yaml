# Каталог возможностей Платформы, версия 2 (ADR-0012). Роли — данные (CRM), каталог — код и контракт.
# Основание: ADR-0012, docs/runbooks/wave9-roles.md §3.2, SPEC-v3 §4.2, docs/architecture/integration-map.md §4.
# Что в каталоге: разделы (`resources`) с уровнями доступа и отображением в права бэкендов (CRM casbin, ERP `Permission` и
# с волны 12 — EDS: коды `EdsPermission` openapi/eds.yaml, runbook docs/runbooks/wave12-eds-c1.md §2.2),
# пункты меню (`menu`), поля с ограничением (`restricted_fields`), виды работы «Моей очереди» (`queue`), две системные роли
# (`system_roles`, неизменны), шаблоны ролей (`templates`, при первом запуске создаются обычными редактируемыми ролями)
# и правило базовой роли CRM для старого фронта (`crm_base_role`, до T4).
# Уровни: full — полный доступ, read — только чтение, скрыто — раздела нет в `access` роли. У сотрудника с несколькими ролями
# берётся максимум по разделу (full > read), поля с ограничением объединяются. Права бэкенда накапливаются: уровень `full`
# включает права уровня `read` (списки `full` повторяют `read` для читаемости; раздел без списка `full` даёт то же, что `read`).
# Правила: каждый код права ERP — из `ErpPermission` шва (openapi/erp-integration.yaml); каждое право CRM — `ресурс:действие`
# из каталога apps/crm/backend/app/security/rbac.py (CATALOG). Обе сверки — в тестах CRM и в схеме (enum). Каждый код EDS —
# из девяти кодов v1 (enum в схеме); права EDS сотрудника CRM вычисляет так же, как права ERP, и публикует в
# identity.user.* (`user.permissions.eds`); EDS своей модели ролей не имеет. Отображение ролей в коды EDS проверяет
# packages/contracts/tests/test_platform_rbac.py.
# Изменение файла — PR с тестом каталога. Валидация — platform-rbac.schema.json (make contracts).
# Единственный каталог ролей в packages/contracts (R-2): версия 1 (шесть ролей кодом) удалена, тест «ровно один каталог» —
# apps/platform/bff/tests/test_rbac_generated.py. Генераторы: CRM (`make -C apps/crm platform-roles`), BFF и web
# (`make -C apps/platform rbac`).
version: 2

system_roles:
  ADMIN:
    name: { ru: Администратор, uz: Administrator, en: Administrator }
    access: { admin: full, company.settings: full, dashboard.queue: full, chats.internal: full, eds.memo.create: full }
    restricted_fields: []
  DIRECTOR:
    name: { ru: Директор, uz: Direktor, en: Director }
    access:
      dashboard.queue: full
      dashboard.summary: full
      crm.leads: read
      crm.clients: full
      eds.inbox: full
      eds.drafts: full
      eds.projects: full
      eds.payments: full
      eds.memo.create: full
      eds.memo.approve: full
      erp.calc: full
      erp.calc.goods: full
      erp.calc.services: full
      erp.stock: full
      chats.internal: full
      chats.external: read
      company.settings: full
      admin: read
    restricted_fields: [cost_margin, supplier_prices]
    # R-1b (уточнение ADR-0012 п. 2): директор видит воронку и переписку (`crm.leads`, `chats.external` — read), но не
    # берёт лиды и не отвечает клиентам; директору, который сам ведёт лиды, администратор выдаёт вторую роль (объединение).

# Шаблоны — строки матрицы SPEC-v3 §4.2 (колонки MANAGER, SUPPLY, ENGINEER, ACCOUNTANT) + два новых раздела расчёта.
templates:
  MANAGER:
    name: { ru: Менеджер, uz: Menejer, en: Manager }
    access:
      dashboard.queue: full
      crm.leads: full
      crm.clients: full
      eds.inbox: read
      eds.drafts: read
      eds.projects: read
      eds.payments: read
      eds.memo.create: full
      erp.stock: read
      chats.internal: full
      chats.external: full
    restricted_fields: []
  SUPPLY:
    name: { ru: Снабженец, uz: Ta'minotchi, en: Supply specialist }
    access:
      dashboard.queue: full
      crm.clients: read
      eds.projects: read
      eds.memo.create: full
      erp.calc: full
      erp.calc.goods: full
      erp.stock: full
      chats.internal: full
    restricted_fields: [cost_margin, supplier_prices]
  ENGINEER:
    name: { ru: Гл. инженер, uz: Bosh muhandis, en: Chief engineer }
    access:
      dashboard.queue: full
      crm.clients: read
      eds.projects: read
      eds.memo.create: full
      erp.calc: full
      erp.calc.services: full
      erp.stock: full
      chats.internal: full
    restricted_fields: []
  ACCOUNTANT:
    name: { ru: Бухгалтер, uz: Buxgalter, en: Accountant }
    access:
      dashboard.queue: full
      dashboard.summary: read
      crm.clients: read
      eds.inbox: read
      eds.projects: full
      eds.payments: full
      eds.memo.create: full
      erp.calc: read
      erp.stock: read
      chats.internal: full
      chats.external: full
    # Решение архитектора 2026-10-28 (Q-D2-1-4): бухгалтер видит цены клиенту, итоги и НДС — без цен поставщиков,
    # себестоимости и маржи.
    restricted_fields: [totals_only]

# Базовая роль CRM (admin|manager|viewer) для старого фронта до T4: максимум по ролям сотрудника.
# Роль с кодом из `by_code` (системные и шаблоны) — как в версии 1; роль без кода — по `by_access`; иначе viewer.
crm_base_role:
  by_code:
    MANAGER: manager
    DIRECTOR: viewer
    SUPPLY: viewer
    ENGINEER: viewer
    ACCOUNTANT: manager
    ADMIN: admin
  by_access:
    admin: [{ resource: admin, level: full }]
    manager: [{ resource: crm.leads, level: full }]

resources:
  - key: dashboard.queue
    module: dashboard
    label: { ru: "Главная · Мои задачи", uz: "Bosh sahifa · Mening vazifalarim", en: "Home · My tasks" }
  - key: dashboard.summary
    module: dashboard
    label: { ru: "Главная · Сводка по компании", uz: "Bosh sahifa · Kompaniya xulosasi", en: "Home · Company summary" }
    backend:
      crm: { read: [dashboard:read, spend:read] }
      erp: { full: [data.export] }
  - key: crm.leads
    module: crm
    label: { ru: "Клиенты · Ждут ответа, Лиды, Каналы связи, База знаний бота", uz: "Mijozlar · Javob kutmoqda, lidlar, aloqa kanallari, bot bilimlar bazasi", en: "Clients · Awaiting reply, leads, channels, bot knowledge base" }
    backend:
      crm:
        read: [leads:read, stream:read, dashboard:read, kb:read]
        full: [leads:read, leads:take, leads:work, leads:reply, leads:note, leads:assist, leads:create, stream:read, dashboard:read, kb:read, reply_templates:read]
  - key: crm.clients
    module: crm
    label: { ru: "Клиенты · Клиенты, Заявки, Создать заявку", uz: "Mijozlar · Mijozlar, arizalar, ariza yaratish", en: "Clients · Clients, requests, new request" }
    backend:
      crm:
        read: [clients:read, deals:read, documents:read]
        full: [clients:read, clients:write, deals:read, deals:write, documents:read, documents:write]
      # «Создать заявку» — передача в ERP; quote.send — отправить одобренное директором КП клиенту: менеджер заявки и
      # директор (C1-G-4, решение архитектора 2026-10-26, DECISIONS.md).
      erp: { full: [deal.manage, quote.send] }
  - key: eds.inbox
    module: eds
    label: { ru: "Документы · Входящие письма · резолюция", uz: "Hujjatlar · Kiruvchi xatlar · rezolyutsiya", en: "Documents · Incoming letters · resolution" }
    backend:
      erp: { full: [deal.assign] }
      eds:
        read: [letters.read, registry.read]
        full: [letters.read, registry.read, letters.register, letters.resolve]
  - key: eds.drafts
    module: eds
    label: { ru: "Документы · КП на одобрение, Исходящие · одобрение и отправка", uz: "Hujjatlar · Tasdiqlash uchun TT, chiquvchi · tasdiqlash va yuborish", en: "Documents · Quotes to approve, outgoing · approval and sending" }
    backend:
      # quote.review — права ERP на визы КП; одобряет директор в EDS (EDS-03, E5). Отправка КП клиенту (quote.send) с
      # 2026-10-26 — раздел crm.clients (C1-G-4): у директора он тоже full.
      erp: { full: [quote.review] }
      eds: { full: [approvals.decide] }  # одобрение КП — маршрут EDS (EDS-03)
  - key: eds.projects
    module: eds
    label: { ru: "Документы · Проекты: договор, счёт, акт, сканы", uz: "Hujjatlar · Loyihalar: shartnoma, hisob, dalolatnoma, skanlar", en: "Documents · Projects: contract, invoice, act, scans" }
    backend:
      erp: { full: [contract.manage, contract.sign, fulfillment.act] }
      eds: { read: [registry.read], full: [registry.read] }
  - key: eds.payments
    module: eds
    label: { ru: "Документы · Счета и оплаты · подтвердить оплату, запросить платёжку", uz: "Hujjatlar · Hisoblar va to‘lovlar · to‘lovni tasdiqlash, to‘lov topshiriqnomasini so‘rash", en: "Documents · Invoices & payments · confirm payment, request a payment order" }
    backend:
      erp: { full: [finance.invoice, finance.payment, finance.rates, data.export] }
      # data.export ERP ↔ registry.export EDS: выгрузка реестра — у того, кто выгружает данные «Счетов и оплат».
      # payments.confirm — шаг «бухгалтер» маршрута служебной записки с суммой (решение архитектора, волна 12).
      eds: { read: [registry.read], full: [registry.read, registry.export, payments.confirm] }
  - key: eds.memo.create
    module: eds
    label: { ru: "Документы · Служебная записка · создать", uz: "Hujjatlar · Xizmat xati · yaratish", en: "Documents · Memo · create" }
    backend:
      eds: { full: [memos.create] }  # служебные записки, заявления, отчёты
  - key: eds.memo.approve
    module: eds
    label: { ru: "Документы · Служебная записка · согласовать", uz: "Hujjatlar · Xizmat xati · kelishish", en: "Documents · Memo · approve" }
    backend:
      eds: { full: [memos.approve] }
  - key: erp.calc
    module: erp
    label: { ru: "Расчёт · Заявки в расчёте, Мои расчёты", uz: "Hisob-kitob · Hisobdagi arizalar, mening hisob-kitoblarim", en: "Costing · Requests in costing, my costings" }
    backend:
      erp: { full: [deal.manage, quote.build, quote.edit_pricing] }
  # Виза строки расчёта по типу позиции вместо ролей SUPPLY и ENGINEER в процессе (ADR-0012 п. 6).
  - key: erp.calc.goods
    module: erp
    levels: [full]
    label: { ru: "Расчёт · Виза расчёта: товары и склад", uz: "Hisob-kitob · Hisob-kitob vizasi: tovarlar va ombor", en: "Costing · Costing sign-off: goods and stock" }
    backend:
      erp: { full: [quote.build, quote.edit_pricing, quote.visa_goods] }
  - key: erp.calc.services
    module: erp
    levels: [full]
    label: { ru: "Расчёт · Виза расчёта: услуги", uz: "Hisob-kitob · Hisob-kitob vizasi: xizmatlar", en: "Costing · Costing sign-off: services" }
    backend:
      erp: { full: [quote.build, quote.visa_services] }
  - key: erp.stock
    module: erp
    label: { ru: "Расчёт · Склад, Номенклатура и поставщики, Техдокументация", uz: "Hisob-kitob · Ombor, nomenklatura va yetkazib beruvchilar, texnik hujjatlar", en: "Costing · Stock, items & suppliers, technical files" }
    backend:
      erp: { full: [catalog.manage, catalog.publish, supply.manage, fulfillment.manage] }
  - key: chats.internal
    module: chats
    label: { ru: "Чаты · Команда (проекты, сотрудники)", uz: "Chatlar · Jamoa (loyihalar, xodimlar)", en: "Chats · Team (projects, staff)" }
  - key: chats.external
    module: chats
    label: { ru: "Чаты · С клиентами (Telegram-бот, почта)", uz: "Chatlar · Mijozlar bilan (Telegram-bot, pochta)", en: "Chats · With clients (Telegram bot, email)" }
    backend:
      crm:
        read: [leads:read]
        full: [leads:read, leads:reply, leads:note, leads:assist]
  - key: admin
    module: admin
    label: { ru: "Настройки · Роли и права, Сотрудники, Подключения, Telegram-бот, Журнал, Обращения сотрудников", uz: "Sozlamalar · Rollar va huquqlar, xodimlar, ulanishlar, Telegram-bot, jurnal, xodimlar murojaatlari", en: "Settings · Roles & permissions, employees, connections, Telegram bot, log, staff requests" }
    backend:
      crm:
        # W13-A5: директор (admin: read) читает и настройки бота, шаблоны ответов и базу знаний — без правки; правка и
        # песочница — admin: full (settings:write, kb:write, reply_templates:write, sandbox:use, export:read).
        # W15-H7: «Обращения сотрудников» — директор читает (tickets:read), администратор отвечает и меняет статус (tickets:write).
        read: [users:read, integrations:read, models:read, system:read, external_services:read, backups:read, audit:read, settings:read, reply_templates:read, kb:read, tickets:read]
        full:
          - users:read
          - users:write
          - settings:read
          - settings:write
          - integrations:read
          - integrations:write
          - models:read
          - models:test
          - models:write
          - system:read
          - external_services:read
          - external_services:write
          - backups:read
          - backups:write
          - audit:read
          - spend:read
          - kb:read
          - kb:write
          - reply_templates:read
          - reply_templates:write
          - sandbox:use
          - export:read
          - tickets:read
          - tickets:write
      # Журнал шины (W13-A2): ERP — `team.manage` (код раздела `admin` в ERP, нового кода не нужно); EDS — `bus.manage`
      # (у EDS кода раздела `admin` не было). В CRM журнал — `integrations:read`/`integrations:write`.
      erp: { full: [team.manage] }
      eds: { full: [bus.manage] }
  # Реквизиты, шаблоны документов, нумерация, условия оплаты компании (решение архитектора по Q-R1-1):
  # у ролей из шаблонов раздела нет, у директора и администратора — full.
  - key: company.settings
    module: admin
    label: { ru: "Настройки · Компания и бланки: реквизиты, шаблоны документов, нумерация, условия оплаты", uz: "Sozlamalar · Kompaniya va blankalar: rekvizitlar, hujjat shablonlari, raqamlash, to‘lov shartlari", en: "Settings · Company & letterhead: details, document templates, numbering, payment terms" }
    backend:
      erp: { full: [settings.edit, settings.charge_templates] }

# Пункты меню модулей (SPEC-v3 §6.2) → разделы. Пункт виден, если у сотрудника есть хотя бы один из разделов `any_of`
# (раздел есть в объединённом `access`). Содержимое смешанных реестров («Все документы», «Все чаты») BFF фильтрует по разделу
# каждого типа документа или чата. Q-PLT-12-2.
menu:
  dashboard:
    queue: [dashboard.queue]
    projects: [eds.projects]
    summary: [dashboard.summary]
  crm:
    messages: [crm.leads]
    leads: [crm.leads]
    clients: [crm.clients]
    requests: [crm.clients]
    channels: [crm.leads]
    # W15-H4: в подменю Клиентов база знаний — для ролей с лидами (чтение); администратор (kb:write у раздела admin) входит
    # в неё из Настроек · Telegram-бот, адрес /crm/kb для него открыт (`access` раздела в apps/platform/web/src/modules/crm/module.ts).
    kb: [crm.leads]
  eds:
    documents: [eds.inbox, eds.drafts, eds.projects, eds.payments, eds.memo.create, eds.memo.approve]
    inbox: [eds.inbox]
    outbox: [eds.drafts]
    projects: [eds.projects]
    drafts: [eds.drafts]
    approvals: [eds.memo.approve, eds.memo.create]
    payments: [eds.payments]
  erp:
    requests: [erp.calc]
    calc: [erp.calc]
    stock: [erp.stock]
    catalog: [erp.stock]
    docs: [erp.stock]
  chats:
    all: [chats.internal, chats.external]
    internal: [chats.internal]
    external: [chats.external]
    contacts: [chats.internal]
  admin:
    roles: [admin]
    org: [admin]
    integrations: [admin]
    tickets: [admin]
    company: [company.settings]
    bot: [admin]
    # «Журнал» (W15-H4): действия людей и обмен между системами — фильтр одного экрана. «Обмен между системами» (шина,
    # W13-A2) отдельного пункта не имеет и открывается только при `admin: full` (`level` в modules/admin/module.ts).
    audit: [admin]
    # «Первый запуск» (W15-H4): пункт виден администратору, пока шаги мастера не завершены (`showWhile` в module.ts).
    setup: [admin]

# Поля с ограничением внутри экранов (SPEC-v3 §4.2). Роль перечисляет поля, которые она ВИДИТ; поле скрыто, если ни одна роль
# сотрудника его не видит. `supplier_prices` и `totals_only` своих прав ERP не дают: в расчёте (D2-1) ERP режет цены поставщика
# по `quote.view_cost_margin` или праву визы товаров, BFF — по этим группам; «только итоги» — без себестоимости и цен поставщика.
restricted_fields:
  cost_margin:
    description: { ru: "Себестоимость и маржа", uz: "Tannarx va marja", en: "Cost and margin" }
    backend: { erp: [quote.view_cost_margin] }
  supplier_prices:
    description: { ru: "Цены поставщиков", uz: "Yetkazib beruvchi narxlari", en: "Supplier prices" }
    backend: { erp: [] }
  totals_only:
    description: { ru: "Только итоговые суммы расчёта (без себестоимости по строкам)", uz: "Faqat jami summalar", en: "Totals only" }
    backend: { erp: [] }

# Вид работы «Моей очереди» → что нужно сотруднику (раздел и уровень не ниже). Набор — QueueItemKind контракта BFF.
queue:
  answer_lead: { resource: crm.leads, level: full }
  take_lead: { resource: crm.leads, level: full }
  create_request: { resource: crm.clients, level: full }
  service_request: { resource: crm.clients, level: full }
  resolve_letter: { resource: eds.inbox, level: full }
  approve_quote: { resource: eds.drafts, level: full }
  approve_memo: { resource: eds.memo.approve, level: full }
  problem_project: { resource: eds.projects, level: full }
  calc_task: { resource: erp.calc, level: full }
  supplier_overdue: { resource: erp.stock, level: full }
  confirm_payment: { resource: eds.payments, level: full }
  issue_invoice: { resource: eds.payments, level: full }
  issue_contract: { resource: eds.projects, level: full }
  attach_scan: { resource: eds.projects, level: full }
  pay_memo: { resource: eds.payments, level: full }
  overdue_invoice: { resource: eds.payments, level: full }
  ticket: { resource: admin, level: full }
  integration_issue: { resource: admin, level: full }
