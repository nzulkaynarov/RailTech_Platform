        cancelled_at:
          type: [string, 'null']
          format: date-time
        note:
          type: string
          description: Примечание заказа; уходит поставщику и в письме с заказом
        total_amount:
          type: string
        currency:
          type: [string, 'null']
          description: Код валюты заказа; `null` — валюта в заказе не указана
        date_change:
          description: Запрос партнёра на перенос срока, пока сотрудник не поставил новую дату
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PartnerOrderDateChange'
        shipment_notices:
          type: array
          items:
            $ref: '#/components/schemas/PartnerShipmentNotice'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PartnerOrderLineItem'
        logs:
          type: array
          items:
            $ref: '#/components/schemas/PartnerOrderLogItem'
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/PartnerOrderReceiptItem'
      additionalProperties: false

    PartnerOrderConfirmRequest:
      type: object
      required: [expected_date]
      properties:
        expected_date:
          type: string
          format: date
          description: Дата поставки по подтверждению партнёра; не раньше сегодняшней
      additionalProperties: false

    PartnerOrderDateChange:
      type: object
      required: [requested_date, reason, requested_at]
      properties:
        requested_date:
          type: string
          format: date
        reason:
          type: string
        requested_at:
          type: string
          format: date-time
      additionalProperties: false

    PartnerOrderDateChangeRequest:
      type: object
      required: [requested_date]
      properties:
        requested_date:
          type: string
          format: date
          description: Новая дата поставки; не раньше сегодняшней и не равна текущему сроку
        reason:
          type: string
          maxLength: 500
      additionalProperties: false

    PartnerShipmentNotice:
      type: object
      required: [id, supplier_doc, carrier, tracking_number, note, created_at]
      properties:
        id:
          type: integer
        supplier_doc:
          type: string
        carrier:
          type: string
        tracking_number:
          type: string
        note:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    PartnerShipmentNoticeRequest:
      type: object
      required: [supplier_doc]
      properties:
        supplier_doc:
          type: string
          minLength: 1
          maxLength: 100
        carrier:
          type: string
          maxLength: 120
        tracking_number:
          type: string
          maxLength: 120
        note:
          type: string
          maxLength: 500
      additionalProperties: false

    PartnerPriceRequestStatus:
      type: string
      enum: [sent, failed, answered]

    PartnerPriceRequestListItem:
      type: object
      required: [id, requested_at, subject, status, lines_count]
      properties:
        id:
          type: integer
        requested_at:
          type: string
          format: date-time
        subject:
          type: string
        status:
          $ref: '#/components/schemas/PartnerPriceRequestStatus'
        lines_count:
          type: integer
          minimum: 0
        answered_at:
          type: [string, 'null']
          format: date-time
      additionalProperties: false

    PartnerPriceRequestStatusCounts:
      type: object
      required: [all, sent, answered]
      properties:
        all:
          type: integer
          minimum: 0
        sent:
          type: integer
          minimum: 0
        answered:
          type: integer
          minimum: 0
      additionalProperties: false

    PartnerPriceRequestPage:
      type: object
      required: [items, page, page_size, total, counts]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartnerPriceRequestListItem'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        counts:
          $ref: '#/components/schemas/PartnerPriceRequestStatusCounts'
      additionalProperties: false

    PartnerPriceRequestLineItem:
      type: object
      required: [id, name, article, quantity, unit]
      properties:
        id:
          type: integer
        name:
          type: string
        article:
          type: string
        quantity:
          type: integer
          minimum: 0
        unit:
          type: string
        answer_price:
          type: [string, 'null']
          description: Цена партнёра за единицу из его ответа
      additionalProperties: false

    PartnerPriceRequestDetail:
      type: object
      required: [id, requested_at, subject, note, status, lines, answer_note]
      properties:
        id:
          type: integer
        requested_at:
          type: string
          format: date-time
        subject:
          type: string
        note:
          type: string
        status:
          $ref: '#/components/schemas/PartnerPriceRequestStatus'
        answered_at:
          type: [string, 'null']
          format: date-time
        answer_note:
          type: string
        answer_currency:
          type: [string, 'null']
          description: Валюта цен ответа
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PartnerPriceRequestLineItem'
      additionalProperties: false

    PartnerPriceRequestResponse:
      type: object
      required: [answer_note]
      properties:
        answer_note:
          type: string
          minLength: 1
          maxLength: 1000
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Валюта цен; обязательна, если заданы `lines`
        valid_until:
          type: [string, 'null']
          format: date
          description: Срок действия цен; не раньше сегодняшней даты
        lines:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PartnerPriceResponseLine'
      additionalProperties: false

    PartnerPriceResponseLine:
      type: object
      required: [id, unit_price]
      properties:
        id:
          type: integer
          description: Строка запроса цен
        unit_price:
          type: string
          pattern: '^\d{1,12}(\.\d{1,2})?$'
          description: Цена за единицу, больше нуля
      additionalProperties: false

    PartnerFinanceBalance:
      type: object
      description: Оборот по заказам в одной валюте; валюта не задана — `null`
      required: [currency, ordered_total, received_total, in_transit_total, orders_count]
      properties:
        currency:
          type: [string, 'null']
          example: UZS
        ordered_total:
          type: string
          example: "12500000.00"
        received_total:
          type: string
          example: "10000000.00"
        in_transit_total:
          type: string
          description: Отгружено партнёром по его уведомлению и ещё не принято
          example: "2500000.00"
        orders_count:
          type: integer
          minimum: 0
      additionalProperties: false

    PartnerFinanceScorecard:
      type: object
      description: Показатели поставщика; нечем измерить — `null`, а не 100
      required:
        - otif_rate
        - otif_orders_count
        - rfq_response_rate
        - rfq_avg_response_hours
        - total_rfqs_count
        - price_freshness_rate
        - active_offers_count
      properties:
        otif_rate:
          type: [number, 'null']
          description: "Доля заказов, принятых целиком не позже срока, среди принятых со сроком и подтверждённых с прошедшим сроком"
          minimum: 0
          maximum: 100
          example: 95.5
        otif_orders_count:
          type: integer
          description: Сколько заказов участвует в OTIF
          minimum: 0
        rfq_response_rate:
          type: [number, 'null']
          description: "Доля отвеченных среди доставленных запросов цен"
          minimum: 0
          maximum: 100
          example: 88.0
        rfq_avg_response_hours:
          type: [number, 'null']
          description: Среднее время ответа на запрос цен, часы
          minimum: 0
          example: 18.5
        total_rfqs_count:
          type: integer
          description: Доставленные запросы цен; недоставленные нами не считаются
          minimum: 0
        price_freshness_rate:
          type: [number, 'null']
          description: "Процент актуальных цен в каталоге"
          minimum: 0
          maximum: 100
          example: 92.3
        active_offers_count:
          type: integer
          minimum: 0
      additionalProperties: false

    PartnerSettlementLine:
      type: object
      description: Суммы по одному заказу партнёра
      required:
        - order_id
        - order_number
        - order_date
        - status
        - currency
        - ordered_amount
        - received_amount
        - in_transit_amount
        - receipts_count
      properties:
        order_id:
          type: integer
        order_number:
          type: string
        order_date:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PartnerOrderStatus'
        currency:
          type: [string, 'null']
        ordered_amount:
          type: string
        received_amount:
          type: string
        in_transit_amount:
          type: string
        receipts_count:
          type: integer
          minimum: 0
      additionalProperties: false

    PartnerFinanceSummary:
      type: object
      description: Оборот по заказам и оценка партнёра (K4, FX-8)
      required: [balances, scorecard, settlements, settlements_total, page, page_size]
      properties:
        balances:
          type: array
          items:
            $ref: '#/components/schemas/PartnerFinanceBalance'
        scorecard:
          $ref: '#/components/schemas/PartnerFinanceScorecard'
        settlements:
          type: array
          description: Страница разбивки по заказам
          items:
            $ref: '#/components/schemas/PartnerSettlementLine'
        settlements_total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
      additionalProperties: false

    Reason:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false

    Language:
      type: string
      enum: [ru, uz, en]

    PreferredChannel:
      type: string
      enum: [telegram, email, both]

    Currency:
      type: string
      pattern: '^[A-Z]{3}$'

    Amount:
      type: string
      pattern: '^-?\d+\.\d{2}$'

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
      additionalProperties: false

    DealRef:
      type: object
      description: Сделка глазами клиента (Q-16) — номер и название вместо внутреннего id
      required: [id, number]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
        title:
          type: [string, 'null']
      additionalProperties: false

    AcceptanceCodeSent:
      type: object
      required: [channel, sent_to, expires_in]
      properties:
        channel:
          type: string
          enum: [telegram, email]
        sent_to:
          type: string
          description: 'Куда ушёл код, в замаскированном виде: `i***@example.com`, `@u***` или `Telegram`'
        expires_in:
          type: integer
          minimum: 1
          description: Срок действия кода, секунд
      additionalProperties: false

    ActAccept:
      type: object
      properties:
        upload_id:
          type: string
          description: Скан подписанного акта из `POST /uploads` (PDF или изображение, ≤ 10 МБ)
      additionalProperties: false

    Me:
      type: object
      properties:
        contact:
          $ref: '#/components/schemas/TeamMember'
        company:
          $ref: '#/components/schemas/Company'
        can_act:
          type: boolean
          description: 'Право «действовать» (принимать КП, подписывать, принимать акты); иначе — только смотреть'
        is_admin:
          type: boolean
          description: 'Право «администратор компании» (управление командой и реквизитами); первый приглашённый — админ'
        auth_method:
          type: string
          enum: [telegram, magic_link]
        notifications_unread:
          type: integer
          minimum: 0
          description: Непрочитанные контактом уведомления колокольчика (только видимые модулям сессии); 0 — нет
        roles:
          type: array
          description: Роли компании сессии в кабинете. Клиент — по типу компании CLIENT, партнёр — по действующему отношению `partner`; роли складываются.
          items:
            $ref: '#/components/schemas/PortalRole'
        modules:
          type: array
          description: Разделы кабинета для этих ролей по шаблону `x-role-modules`, в порядке меню. Пусто — разделы ещё не настроены.
          items:
            $ref: '#/components/schemas/ModuleCode'
        unread:
          type: integer
          minimum: 0
          description: Непрочитанные контактом ответы менеджера в чате кабинета (бейдж «Сообщения»); 0 — нет или модуля нет
      required: [contact, company, can_act, auth_method, roles, modules, unread, notifications_unread]
      x-role-modules:
        client: [catalog_requests, quotes, documents, contracts, invoices, acts, deliveries, messages, company, team, profile]
        partner: [my_products, catalog_requests, messages, profile]
      x-role-default-modules:
        client: [catalog_requests, quotes, documents, contracts, invoices, acts, deliveries, messages, company, team, profile]
        partner: [my_products, catalog_requests, messages, profile]

    TelegramStatus:
      type: object
      required: [linked, available]
      properties:
        linked:
          type: boolean
          description: Telegram привязан к контакту (по проекции CRM) — уведомления приходят в бот, Mini App входит без письма
        account:
          type: [string, 'null']
          maxLength: 255
          description: >-
            Какой аккаунт привязан — `@имя_пользователя` или имя профиля Telegram (из проекции CRM); `null` — Telegram не
            привязан или CRM не прислала имени. Защита от пересланной ссылки: человек видит, чей Telegram получает коды
            акцепта и входит в Mini App
        available:
          type: boolean
          description: >-
            Можно ли выпустить ссылку привязки: бот настроен и контакт сопоставлен с CRM. `false` — Cabinet не предлагает
            «Подключить» (плашку не показывает, в Профиле — подсказка написать менеджеру)
      additionalProperties: false

    TelegramLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
          description: '`https://t.me/<бот>?start=<токен>`; её же Cabinet кодирует в QR'
        expires_at:
          type: string
          format: date-time
          description: Когда ссылка перестанет действовать (15 минут от выпуска)
      additionalProperties: false

    PortalRole:
      type: string
      enum: [client, partner]

    ModuleCode:
      type: string
      description: |
        Раздел кабинета. `catalog_requests` — каталог и заявки (два пункта меню). Cabinet рисует только известные ему коды,
        незнакомый пропускает.
      enum: [catalog_requests, quotes, documents, contracts, invoices, acts, deliveries, company, team, profile, my_products, messages]

    NotificationKind:
      type: string
      description: |
        Вид уведомления (событие для контрагента): `quote_sent` — КП ждёт решения, `invoice_issued` — выставлен счёт,
        `payment_overdue` — срок оплаты счёта прошёл, `act_issued` — акт ждёт приёмки, `delivery_status_changed` — статус
        поставки, `delivery_eta_changed` — сдвиг срока поставки, `manager_replied` — ответ менеджера в чате кабинета,
        `partner_card_returned` — карточка партнёра возвращена на доработку, `partner_card_published` — опубликована,
        `partner_order_sent` — направлен заказ на поставку, `partner_rfq_sent` — направлен запрос цен,
        `partner_goods_received` — склад принял товары по заказу, `bank_requisites_change_requested` — подан запрос на смену
        банковских реквизитов, `bank_requisites_changed` — смену подтвердил сотрудник, `bank_requisites_change_rejected` —
        сотрудник отклонил смену (FX-4; группа `security`, отключить нельзя).
        Незнакомый вид Cabinet показывает общим текстом.
      enum:
        - quote_sent
        - invoice_issued
        - payment_overdue
        - act_issued
        - delivery_status_changed
        - delivery_eta_changed
        - manager_replied
        - partner_card_returned
        - partner_card_published
        - bank_requisites_changed
        - partner_order_sent
        - partner_rfq_sent
        - partner_goods_received
        - bank_requisites_change_requested
        - bank_requisites_change_rejected

    NotificationGroup:
      type: string
      description: Группа событий — основа настройки «группа × канал» в профиле контакта (J3)
      enum: [documents, money, deliveries, messages, partner_products, security]

    NotificationObjectType:
      type: string
      enum: [quote, invoice, act, delivery, chat, partner_product, partner_order, partner_rfq, bank_change]

    NotificationAction:
      type: string
      description: Что произошло с объектом или чего ждут от контакта
      enum: [awaiting_decision, issued, overdue, awaiting_acceptance, status_changed, eta_changed, replied, returned, published]

    NotificationObject:
      type: object
      description: |
        Объект уведомления — тип, id в ERP и номер для человека (`null` — номера нет, например у чата). У поставки `id` —
        id сделки (поставка одна на сделку и открывается в кабинете внутри проекта; тот же id в `start_param=delivery_<id>`).
      required: [type, id, number]
      properties:
        type:
          $ref: '#/components/schemas/NotificationObjectType'
        id:
          type: integer
          format: int64
        number:
          type: [string, 'null']
      additionalProperties: false

    PortalNotification:
      type: object
      required: [id, kind, group, object, action, text_key, params, link, created_at, read_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/NotificationKind'
        group:
          $ref: '#/components/schemas/NotificationGroup'
        object:
          $ref: '#/components/schemas/NotificationObject'
        action:
          $ref: '#/components/schemas/NotificationAction'
        text_key:
          type: string
          description: Ключ текста в словарях Cabinet (`notifications.text.<text_key>`); текст на языке контакта рендерит Cabinet
        params:
          type: object
          description: Параметры текста (номер, сумма, дата, статус) — строки
          additionalProperties:
            type: string
        link:
          type: string
          pattern: '^/'
          description: Адрес объекта в кабинете (путь от корня Cabinet, например `/quotes/42`)
        created_at:
          type: string
          format: date-time
        read_at:
          type: [string, 'null']
          format: date-time
          description: Когда контакт прочитал; `null` — не прочитано
      additionalProperties: false

    NotificationPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalNotification'
        has_more:
          type: boolean
          description: Есть более ранние уведомления — следующая страница с `before_id` = `id` последнего элемента
      additionalProperties: false

    NotificationReadMark:
      type: object
      description: 'Ровно одно из двух — `ids` или `all: true`'
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            format: int64
            minimum: 1
        all:
          type: boolean
      additionalProperties: false

    NotificationUnread:
      type: object
      required: [unread]
      properties:
        unread:
          type: integer
          minimum: 0
      additionalProperties: false

    NotificationChannelSettings:
      type: object
      description: Состояние каналов доставки для группы событий (J3, ADR-0023)
      required: [in_app, email, telegram, required]
      properties:
        in_app:
          type: boolean
          description: Колокольчик в кабинете (всегда включен)
        email:
          type: boolean
          description: Уведомления на email контакта
        telegram:
          type: boolean
          description: Уведомления в Telegram бот
        required:
          type: boolean
          description: Обязательная группа (нельзя отключить email или in_app)
      additionalProperties: false

    NotificationGroupSettingsMap:
      type: object
      required: [documents, money, deliveries, messages, partner_products, security]
      properties:
        documents:
          $ref: '#/components/schemas/NotificationChannelSettings'
        money:
          $ref: '#/components/schemas/NotificationChannelSettings'
        deliveries:
          $ref: '#/components/schemas/NotificationChannelSettings'
        messages:
          $ref: '#/components/schemas/NotificationChannelSettings'
        partner_products:
          $ref: '#/components/schemas/NotificationChannelSettings'
        security:
          $ref: '#/components/schemas/NotificationChannelSettings'
      additionalProperties: false

    NotificationSettingsResponse:
      type: object
      required: [telegram_connected, groups]
      properties:
        telegram_connected:
          type: boolean
          description: Привязан ли аккаунт Telegram у контакта (NOTIFY-1)
        groups:
          $ref: '#/components/schemas/NotificationGroupSettingsMap'
      additionalProperties: false

    NotificationChannelSettingsUpdate:
      type: object
      properties:
        email:
          type: boolean
        telegram:
          type: boolean
      additionalProperties: false

    NotificationSettingsUpdate:
      type: object
      required: [groups]
      properties:
        groups:
          type: object
          properties:
            documents:
              $ref: '#/components/schemas/NotificationChannelSettingsUpdate'
            money:
              $ref: '#/components/schemas/NotificationChannelSettingsUpdate'
            deliveries:
              $ref: '#/components/schemas/NotificationChannelSettingsUpdate'
            messages:
              $ref: '#/components/schemas/NotificationChannelSettingsUpdate'
            partner_products:
              $ref: '#/components/schemas/NotificationChannelSettingsUpdate'
          additionalProperties: false
      additionalProperties: false

    RequestStatus:
      type: string
      enum: [new, in_progress, quoted, closed]

    RequestLineIn:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
        quantity:
          type: [string, 'null']
          description: Количество как десятичная строка, если известно
        unit:
          type: [string, 'null']
      additionalProperties: false

    AttachmentRef:
      type: object
      description: Файл, загруженный через `POST /uploads` (`upload_id` из ответа). Лишних полей нет — размер ERP знает сам
      required: [upload_id, name]
      properties:
        upload_id:
          type: string
        name:
          type: string
      additionalProperties: false

    ClientRequestCreate:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 5000
        lines:
          type: array
          description: Нет поля или пустой список — запрос словами, без строк (Q-FIX23-4)
          items:
            $ref: '#/components/schemas/RequestLineIn'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRef'
      additionalProperties: false

    ClientRequest:
      type: object
      required: [id, number, status, summary, created_at]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        outcome:
          type: [string, 'null']
          enum: [won, cancelled, null]
          description: Исход закрытого запроса (B-CABFIX-2); null, пока запрос открыт
        summary:
          type: string
        source:
          type: string
          enum: [crm, cabinet, erp]
        deal:
          description: Сделка, в которую вырос запрос (Q-16); `null`, пока запрос не стал сделкой
          oneOf:
            - $ref: '#/components/schemas/DealRef'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RequestLineIn'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRef'

    QuoteStatus:
      type: string
      enum: [sent, viewed, accepted, rejected, expired]

    QuoteListItem:
      type: object
      required: [id, number, version, status, total, sent_at, deal]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        number:
          type: string
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/QuoteStatus'
        total:
          $ref: '#/components/schemas/Money'
        valid_until:
          type: [string, 'null']
          format: date
        sent_at:
          type: string
          format: date-time

    QuoteLine:
      type: object
      description: Строка КП для клиента — цена продажи без себестоимости и наценки; `unit_price` и `total` без НДС (Q-FIX21-2)
      required: [line_no, kind, title]
      properties:
        line_no:
          type: integer
          minimum: 1
        kind:
          type: string
          enum: [item, section, note, stage]
        title:
          type: string
        description:
          type: string
        quantity:
          type: [string, 'null']
        unit:
          type: [string, 'null']
        unit_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        total:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        promised_date:
          type: [string, 'null']
          format: date

    Quote:
      allOf:
        - $ref: '#/components/schemas/QuoteListItem'
        - type: object
          required: [lines, public_url, subtotal, vat, comments]
          properties:
            subtotal:
              description: Итого без НДС — сумма `total` строк (Q-FIX21-2)
              $ref: '#/components/schemas/Money'
            vat:
              description: НДС; `subtotal + vat = total`, как в PDF КП
              $ref: '#/components/schemas/Money'
            lines:
              type: array
              items:
                $ref: '#/components/schemas/QuoteLine'
            public_url:
              type: string
              format: uri
            pdf_document_id:
              type: [integer, 'null']
              format: int64
            rejected_reason:
              type: [string, 'null']
            comments:
              type: array
              description: Комментарии к КП, старые первыми (`POST /quotes/{id}/comments`)
              items:
                $ref: '#/components/schemas/QuoteComment'

    QuoteCommentCreate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false

    QuoteComment:
      type: object
      required: [id, author, text, created_at]
      properties:
        id:
          type: integer
          format: int64
        author:
          type: string
          enum: [client, manager]
          description: Кто написал — сотрудник компании клиента или менеджер продавца
        author_name:
          type: [string, 'null']
          description: Имя автора; `null`, если его нет в карточке
        text:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    ContractStatus:
      type: string
      enum: [sent, signed_by_client, signed_by_company, signed, cancelled]

    Contract:
      type: object
      required: [id, number, status, deal]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        number:
          type: string
        status:
          $ref: '#/components/schemas/ContractStatus'
        signed_by_client_at:
          type: [string, 'null']
          format: date-time
        signed_by_company_at:
          type: [string, 'null']
          format: date-time
        document_id:
          type: [integer, 'null']
          format: int64

    InvoiceStatus:
      type: string
      enum: [issued, partially_paid, paid, overdue, cancelled]

    Invoice:
      type: object
      required: [id, number, status, total, paid, due_date, deal, proofs]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        number:
          type: string
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        total:
          $ref: '#/components/schemas/Money'
        paid:
          $ref: '#/components/schemas/Money'
        due_date:
          type: string
          format: date
        document_id:
          type: [integer, 'null']
          format: int64
        proofs:
          type: array
          description: Платёжки по счёту, старые первыми — из кабинета и те, что приложил менеджер
          items:
            $ref: '#/components/schemas/PaymentProof'

    PaymentProofStatus:
      type: string
      description: >-
        `pending` — менеджер ещё не сверил платёжку с выпиской; `confirmed` — оплата по ней подтверждена; `rejected` —
        отклонена с причиной `reject_reason` (ERP пока не отклоняет платёжки — BACKLOG B-D24-7)
      enum: [pending, confirmed, rejected]

    PaymentProofCreate:
      type: object
      required: [upload_id]
      properties:
        upload_id:
          type: string
          description: Файл платёжного поручения из `POST /uploads` (PDF или изображение, ≤ 10 МБ)
        paid_on:
          type: [string, 'null']
          format: date
          description: Дата платежа по словам клиента (не позже сегодняшней)
        amount:
          description: Сумма платежа по словам клиента в валюте счёта, больше нуля
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        comment:
          type: [string, 'null']
          maxLength: 500
      additionalProperties: false

    PaymentProof:
      type: object
      required: [id, status, source, file_name, submitted_at]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/PaymentProofStatus'
        source:
          type: string
          enum: [cabinet, bot, email, manager]
          description: Откуда платёжка — кабинет клиента, бот, почта или её приложил менеджер
        file_name:
          type: string
        submitted_at:
          type: string
          format: date-time
        paid_on:
          type: [string, 'null']
          format: date
          description: Дата платежа, которую указал клиент; не проверена
        amount:
          description: Сумма, которую указал клиент; не проверена — сумму подтверждает менеджер по выписке
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        comment:
          type: [string, 'null']
          description: Комментарий клиента (только у платёжек из кабинета)
        confirmed_at:
          type: [string, 'null']
          format: date-time
        reject_reason:
          type: [string, 'null']
      additionalProperties: false

    ActStatus:
      type: string
      enum: [issued, accepted, returned]

    Act:
      type: object
      required: [id, number, status, deal, issued_at]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        number:
          type: string
        status:
          $ref: '#/components/schemas/ActStatus'
        issued_at:
          type: string
          format: date-time
        returned_reason:
          type: [string, 'null']
        document_id:
          type: [integer, 'null']
          format: int64
          description: Выпущенный акт (PDF ERP)
        scan_document_id:
          type: [integer, 'null']
          format: int64
          description: Скан подписанного клиентом экземпляра, если загружен при приёмке

    DeliveryStatus:
      type: string
      description: '`accepted` и `disputed` ставит клиент (`/deliveries/{id}/accept|dispute`); остальное — ERP (M4 — со склада)'
      enum: [assembling, in_transit, ready_to_ship, shipped, delivered, accepted, disputed]

    DeliveryLine:
      type: object
      description: Строка поставки = строка подтверждённого заказа клиента; `id` — её идентификатор для приёмки
      required: [id, deal, line_no, title, status]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        line_no:
          type: integer
          minimum: 1
        title:
          type: string
        quantity:
          type: [string, 'null']
        unit:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        eta:
          type: [string, 'null']
          format: date
        tracking:
          type: [string, 'null']
        shipped_at:
          type: [string, 'null']
          format: date-time
        accepted_at:
          type: [string, 'null']
          format: date-time
          description: Когда клиент принял или оспорил строку
        remark:
          type: [string, 'null']
          description: Замечание клиента при `disputed`

    DocumentKind:
      type: string
      enum: [quote, contract, invoice, act, specification, waybill, receipt, other]

    Document:
      type: object
      required: [id, kind, number, date, title]
      properties:
        id:
          type: integer
          format: int64
        deal:
          oneOf:
            - $ref: '#/components/schemas/DealRef'
            - type: 'null'
        kind:
          $ref: '#/components/schemas/DocumentKind'
        number:
          type: string
        date:
          type: string
          format: date
        title:
          type: string
        file_name:
          type: string
        size_bytes:
          type: integer
          minimum: 0

    DocumentVerificationKind:
      type: string
      enum: [letter_out, quote, contract, invoice, act, memo, other]
      description: Вид официального документа для публичной проверки

    DocumentVerification:
      type: object
      required:
        - code
        - kind
        - number
        - date
        - company_name
        - signatory_name
        - signatory_position
        - signatory_basis
        - status
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,32}$'
          description: Код проверки (с QR-кода или колонтитула)
        kind:
          $ref: '#/components/schemas/DocumentVerificationKind'
        number:
          type: string
          description: Регистрационный номер документа (например, ИСХ-042/26)
        date:
          type: string
          format: date
          description: Дата документа
        company_name:
          type: string
          description: Наименование организации-эмитента
        signatory_name:
          type: string
          description: ФИО подписанта
        signatory_position:
          type: string
          description: Должность подписанта
        signatory_basis:
          type: string
          description: Основание полномочий (Устав, приказ или доверенность)
        status:
          type: string
          enum: [valid, revoked]
          description: Статус документа (действует / отозван)
        sha256_hash:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: Контрольная сумма SHA-256 итогового файла PDF
        signed_at:
          type: [string, 'null']
          format: date-time
          description: Дата и время подписания
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: Дата и время отзыва документа
        revocation_reason:
          type: [string, 'null']
          description: Причина отзыва документа
      additionalProperties: false

    Availability:
      type: string
      enum: [in_stock, on_order, expected]

    CatalogItem:
      type: object
      required: [id, kind, name, unit, price, availability]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [goods, service]
        name:
          type: string
        description:
          type: string
        unit:
          type: string
        category:
          type: [string, 'null']
          description: Название категории; справочник с id — `GET /catalog/categories` (Q-15)
        category_id:
          type: [integer, 'null']
          format: int64
          description: Id категории для фильтра `GET /catalog?category_id=`
        price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: '`null` — «цена по запросу»'
        availability:
          $ref: '#/components/schemas/Availability'
        lead_time_days:
          type: [integer, 'null']
          minimum: 0
        images:
          type: array
          description: Ссылки на фото; главное фото — первым (CAT-CARD-2)
          items:
            type: string
            format: uri
        attributes:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name:
                type: string
              value:
                type: string
            additionalProperties: false
        manufacturer:
          oneOf:
            - $ref: '#/components/schemas/CatalogManufacturer'
            - type: 'null'
          description: Изготовитель (бренд) карточки; `null` — не указан (CAT-CARD-2)
        manufacturer_part_number:
          type: [string, 'null']
          description: Артикул изготовителя (MPN); `null` — не указан. Артикул продавца или поставщика сюда не попадает
        country_of_origin:
          type: [string, 'null']
          description: Название страны происхождения — своя у карточки, иначе страна изготовителя; `null` — нигде не указана
        warranty:
          oneOf:
            - $ref: '#/components/schemas/CatalogWarranty'
            - type: 'null'
          description: Гарантия — своя у карточки, иначе срок по умолчанию у компании; `null`, если нигде не задана или равна нулю
        documents:
          type: array
          description: |
            Только в карточке `GET /catalog/{id}`; в списке `GET /catalog`, в `erp-integration` и MCP документов нет. Только
            документы, отмеченные «видно клиенту», и только действующие (срок «действует до» не прошёл; пусто — бессрочно).
            Файл — `GET /catalog/{id}/documents/{doc_id}/file`.
          items:
            $ref: '#/components/schemas/CatalogItemDocument'

    CatalogManufacturer:
      type: object
      required: [name, country]
      properties:
        name:
          type: string
        country:
          type: [string, 'null']
          description: Название страны изготовителя
      additionalProperties: false

    CatalogWarranty:
      type: object
      required: [months, terms]
      properties:
        months:
          type: integer
          minimum: 1
        terms:
          type: string
          description: Условия гарантии; пустая строка — не заданы
      additionalProperties: false

    CatalogItemDocument:
      type: object
      required: [id, kind_name, title, number, issued_by, issued_at, valid_until]
      properties:
        id:
          type: integer
          format: int64
        kind_name:
          type: string
          description: Название вида документа (справочник, ведёт администратор)
        title:
          type: string
        number:
          type: string
          description: Пустая строка — номера нет
        issued_by:
          type: string
          description: Кем выдан; пустая строка — не указано
        issued_at:
          type: [string, 'null']
          format: date
        valid_until:
          type: [string, 'null']
          format: date
          description: Действует до; `null` — бессрочно
      additionalProperties: false

    CatalogPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
      additionalProperties: false

    Company:
      type: object
      required: [id, name, language]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        inn:
          type: [string, 'null']
        registration_number:
          type: [string, 'null']
          description: Регистрационный номер / Tax ID для компаний-нерезидентов (ОГРН, БИН, CRN и др.)
        country:
          type: [object, 'null']
          description: Страна регистрации компании
          properties:
            code:
              type: string
              example: UZ
            name:
              type: string
              example: Узбекистан
        legal_address:
          type: [string, 'null']
        bank_details:
          type: [string, 'null']
          description: Действующие реквизиты; смена на проверке их не меняет (см. `bank_change_request`)
        bank_change_request:
          description: Последний запрос на смену реквизитов; только в `GET` и `PUT /company`, `null` — запросов не было (FX-4)
          oneOf:
            - $ref: '#/components/schemas/BankChangeRequest'
            - type: 'null'
        language:
          $ref: '#/components/schemas/Language'
        relationship_status:
          $ref: '#/components/schemas/PortalRelationshipStatus'
        relationships:
          type: array
          description: Действующие и архивные отношения компании с нами (роль, статус, договор)
          items:
            $ref: '#/components/schemas/PortalRelationship'

    BankChangeRequest:
      type: object
      description: Запрос на смену банковских реквизитов компании (FX-4)
      required: [id, status, requested_by_name, new_bank_details, created_at, decided_at, reject_reason]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, approved, rejected]
          description: '`pending` — на проверке у сотрудника, `approved` — подтверждён и применён, `rejected` — отклонён'
        requested_by_name:
          type: string
          description: Кто подал
        new_bank_details:
          type: [string, 'null']
          description: Новые реквизиты — только администратору компании, остальным `null`
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        reject_reason:
          type: [string, 'null']
          description: Причина отказа; `null` — запрос не отклонён
      additionalProperties: false

    PortalRelationshipStatus:
      type: string
      enum: [invited, active, suspended, terminated]
      description: |
        Статус отношений контрагента (ADR-0022, Counterparty Journey J7):
        - invited: компания приглашена, ожидает первого входа;
        - active: отношения активны, полный доступ согласно включённым модулям;
        - suspended: отношения временно приостановлены (доступ только на чтение/архив);
        - terminated: отношения завершены (доступ только на чтение к архиву).

    PortalRelationship:
      type: object
      required: [role, status]
      properties:
        role:
          $ref: '#/components/schemas/PortalRole'
        kind:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/PortalRelationshipStatus'
        contract_number:
          type: [string, 'null']
        contract_date:
          type: [string, 'null']
          format: date
        activated_at:
          type: [string, 'null']
          format: date-time
        suspended_at:
          type: [string, 'null']
          format: date-time

    CompanySecurityLogResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompanySecurityLogItem'

    CompanySecurityLogItem:
      type: object
      required: [id, event_type, created_at, actor_name]
      properties:
        id:
          type: integer
        event_type:
          type: string
          enum: [login, logout, revoke_sessions, role_change, member_deactivated, member_invited, bank_details_changed, bank_details_change_requested, bank_details_change_rejected]
        created_at:
          type: string
          format: date-time
        actor_name:
          type: string
          description: Имя сотрудника, выполнившего действие
        actor_email:
          type: [string, 'null']
        ip_address:
          type: [string, 'null']
        user_agent:
          type: [string, 'null']
        target_name:
          type: [string, 'null']
          description: Имя целевого сотрудника при операциях с командой
        details:
          type: [string, 'null']
          description: Дополнительные детали события

    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 300
        inn:
          type: string
          maxLength: 20
        registration_number:
          type: string
          maxLength: 50
          description: Регистрационный номер / Tax ID для нерезидентов
        country_code:
          type: string
          maxLength: 2
          description: Двухбуквенный ISO-код страны
        legal_address:
          type: string
          maxLength: 500
        bank_details:
          type: string
          maxLength: 1000
        language:
          $ref: '#/components/schemas/Language'
      additionalProperties: false

    TeamMember:
      type: object
      required: [id, name, language, preferred_channel, can_act, is_primary]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        has_telegram:
          type: boolean
        language:
          $ref: '#/components/schemas/Language'
        preferred_channel:
          $ref: '#/components/schemas/PreferredChannel'
        can_act:
          type: boolean
        is_primary:
          type: boolean
        is_admin:
          type: boolean
          description: Администратор компании в кабинете
        invited_at:
          type: [string, 'null']
          format: date-time
        last_login_at:
          type: [string, 'null']
          format: date-time

    TeamMemberUpdate:
      type: object
      properties:
        can_act:
          type: boolean
        is_admin:
          type: boolean
      additionalProperties: false

    TeamInvite:
      type: object
      required: [name, language, channels]
      properties:
        name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 32
        language:
          $ref: '#/components/schemas/Language'
        can_act:
          type: boolean
          default: false
        is_admin:
          type: boolean
          description: Права администратора компании (только если сам приглашающий — админ)
        channels:
          type: array
          minItems: 1
          items:
            type: string
            enum: [email, telegram]
      additionalProperties: false

    PortalSessionItem:
      type: object
      required: [id, auth_method, is_current, created_at, last_used_at]
      properties:
        id:
          type: integer
          format: int64
        auth_method:
          type: string
          enum: [telegram, magic_link]
        ip_address:
          type: [string, 'null']
        user_agent:
          type: string
        is_current:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
      additionalProperties: false

    CatalogCategory:
      type: object
      required: [id, name, count]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        count:
          type: integer
          minimum: 0

    PortalUploadResponse:
      type: object
      required: [upload_id, name]
      properties:
        upload_id:
          type: string
        name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0

    MessageContextKind:
      type: string
      description: Вид документа метки сообщения
      enum: [deal, quote, invoice, act]

    MessageContextRef:
      type: object
      description: Метка документа в новом сообщении — вид и id; номер подставляет ERP
      required: [kind, id]
      properties:
        kind:
          $ref: '#/components/schemas/MessageContextKind'
        id:
          type: integer
          format: int64
      additionalProperties: false

    MessageContext:
      type: object
      description: Метка документа у сообщения — вид, id и номер («КП KP-2026-0042»)
      required: [kind, id, number]
      properties:
        kind:
          $ref: '#/components/schemas/MessageContextKind'
        id:
          type: integer
          format: int64
        number:
          type: string
      additionalProperties: false

    PortalMessageCreate:
      type: object
      required: [text, client_message_id]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: Текст как есть; Cabinet показывает его текстом, не HTML
        client_message_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
          description: Ключ повтора, выданный Cabinet при первой попытке; повтор отправки — тот же ключ
        context:
          oneOf:
            - $ref: '#/components/schemas/MessageContextRef'
            - type: 'null'
      additionalProperties: false

    PortalMessage:
      type: object
      required: [id, direction, author_name, mine, text, context, created_at, client_message_id, erased]
      properties:
        id:
          type: integer
          format: int64
        direction:
          type: string
          enum: [client, manager]
          description: '`client` — написал контакт компании, `manager` — ответ менеджера'
        author_name:
          type: [string, 'null']
          description: Имя контакта или менеджера; `null` — имени нет
        mine:
          type: boolean
          description: Сообщение написал контакт этой сессии
        text:
          type: string
        context:
          oneOf:
            - $ref: '#/components/schemas/MessageContext'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        client_message_id:
          type: [string, 'null']
          description: Ключ повтора сообщения контакта (у ответа менеджера — `null`)
        erased:
          type: boolean
          description: >-
            Автор стёр свои персональные данные: текст удалён (`text` пуст), автора нет (`author_name` — `null`), Cabinet
            показывает «Удалённый пользователь · сообщение удалено». Остальная лента компании не меняется
      additionalProperties: false

    PortalMessagePage:
      type: object
      required: [items, has_more, erased_ids]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalMessage'
        has_more:
          type: boolean
          description: С `after_id` — после последнего сообщения страницы есть ещё; без него — есть более ранние
        erased_ids:
          type: array
          description: >-
            С `after_id` — сообщения ленты не новее `after_id`, стёртые по запросу автора (CHAT-1b): опрос приносит только
            новые сообщения, по этому списку Cabinet заменяет уже показанные на «Удалённый пользователь» без перезагрузки.
            Без `after_id` — пусто (стёртые и так приходят с `erased: true`)
          items:
            type: integer
            format: int64
      additionalProperties: false

    PortalMessageReadMark:
      type: object
      required: [last_id]
      properties:
        last_id:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false

    PortalMessageUnread:
      type: object
      required: [unread]
      properties:
        unread:
          type: integer
          minimum: 0
      additionalProperties: false
