  /invoices/{id}/proofs:
    post:
      tags: [invoices]
      operationId: submitPaymentProof
      summary: «Я оплатил» — платёжное поручение к счёту
      description: |
        Клиент прикладывает платёжное поручение (SPEC-v3 §3.1 шаг 8, §8). Файл сначала грузится в `POST /uploads`
        (PDF или изображение, ≤ 10 МБ; тело здесь — JSON, единственный multipart портала — `/uploads`), сюда — его
        `upload_id`, а дата и сумма платежа и комментарий — по желанию. Платёжка деньгами не считается: она попадает
        менеджеру в «Счета и оплаты» на вкладку «Платёжки на подтверждение» (источник — кабинет клиента), он сверяет
        поступление с выпиской банка и подтверждает оплату — тогда меняется статус счёта. До этого платёжка в
        `Invoice.proofs` — `pending`. Требует `can_act`. Счёт другой компании — 404.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentProofCreate'
      responses:
        '201':
          description: Платёжка принята и ждёт проверки менеджером
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProof'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Счёт уже оплачен или отменён (`INVOICE_NOT_OPEN`) — платёжка не нужна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Загрузки нет у компании или она уже вложена в другую сделку (`UPLOAD_NOT_FOUND`); файл не PDF и не
            изображение, больше 10 МБ, сумма не больше нуля, дата платежа в будущем или комментарий длиннее
            500 символов (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /acts:
    get:
      tags: [acts]
      operationId: listActs
      summary: Акты
      responses:
        '200':
          description: Акты компании
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Act'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /acts/{id}/accept:
    post:
      tags: [acts]
      operationId: acceptAct
      summary: Принять акт (при желании — со сканом подписанного экземпляра)
      description: |
        Тело необязательно. `upload_id` из `POST /uploads` привязывает скан к акту: ERP сохраняет его как подписанный
        экземпляр (`Act.signed_file`) и отдаёт в `GET /documents` видом `act` с `scan_document_id` в акте. Требует `can_act`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActAccept'
      responses:
        '200':
          description: Акт принят заказчиком
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Act'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Акт уже в конечном статусе (`ACT_FINALIZED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`upload_id` неизвестен или файл не PDF/изображение (`UPLOAD_NOT_FOUND`, `VALIDATION_ERROR`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /acts/{id}/return:
    post:
      tags: [acts]
      operationId: returnAct
      summary: Вернуть акт с причиной
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: Акт возвращён исполнителю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Act'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Акт уже в конечном статусе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /deliveries:
    get:
      tags: [deliveries]
