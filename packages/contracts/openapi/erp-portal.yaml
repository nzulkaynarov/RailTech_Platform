      operationId: requestPartnerOrderDateChange
      summary: Запрос на перенос срока поставки
      description: |
        Партнёр просит перенести срок подтверждённого заказа. Срок (`expected_date`) и показатель OTIF не меняются, пока
        сотрудник снабжения сам не поставит новую дату. Новый запрос заменяет прежний; повтор той же даты ничего не делает.
        Коды 409: `ORDER_NOT_CONFIRMED` — заказ не в статусе `confirmed`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerOrderDateChangeRequest'
      responses:
        '200':
          description: Запрос передан снабжению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerOrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Заказ не в статусе `confirmed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /partner/orders/{id}/ship:
    post:
      tags: [partner]
      operationId: shipPartnerOrder
      summary: Уведомление об отгрузке (ASN)
      description: |
        Партнёр направляет уведомление об отгрузке (номер транспортной накладной, перевозчик, трек-номер) по заказу в
        статусе `confirmed`. Коды 409: `ORDER_NOT_CONFIRMED` — другой статус, `SHIPMENT_NOTICE_DUPLICATE` — эта накладная по
        заказу уже заявлена.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerShipmentNoticeRequest'
      responses:
        '200':
          description: Уведомление зарегистрировано
          content:
