  /partner/orders/{id}/confirm:
    post:
      tags: [partner]
      operationId: confirmPartnerOrder
      summary: Подтверждение заказа поставщиком
      description: |
        Партнёр подтверждает заказ в статусе `sent` (переход в `confirmed`) и называет дату поставки. Заказ без срока
        получает эту дату; у заказа со сроком срок не меняется, а другая дата становится запросом на перенос (`date_change`).
        Коды 409: `TRANSITION_NOT_ALLOWED` — заказ не в статусе `sent`, в том числе повторное подтверждение.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerOrderConfirmRequest'
      responses:
        '200':
          description: Заказ подтверждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerOrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Недопустимый статус заказа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
