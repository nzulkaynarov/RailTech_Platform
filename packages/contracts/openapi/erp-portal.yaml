      operationId: respondPartnerPriceRequest
      summary: Ответ на запрос цен
      description: |
        Партнёр отвечает на запрос цен. Ответ принимается один раз: повторный не затирает прежний. Цены из `lines` обновляют
        цену поставщика на товар строки запроса (источник `rfq_reply`). Коды 409: `REQUEST_NOT_SENT` — запрос не был
        доставлен, `ALREADY_ANSWERED` — ответ уже дан.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerPriceRequestResponse'
      responses:
        '200':
          description: Ответ зафиксирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerPriceRequestDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Недопустимый статус заказа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /partner/finance:
    get:
      tags: [partner]
      operationId: getPartnerFinanceSummary
      summary: Оборот по заказам и оценка поставщика
      description: |
        Оборот по заказам партнёра (заказано, принято складом, отгружено и ещё не принято) по валютам, оценка
        (OTIF, ответы на запросы цен, актуальность цен) и построчная разбивка по заказам. Счетов и оплат здесь нет.
        Показатель, который нечем измерить, равен `null`. Формулы — `docs/systems/erp/partner-scorecard.md`.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        '200':
          description: Оборот по заказам и оценка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerFinanceSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /company:
    get:
      tags: [company]
      operationId: getCompany
      summary: Профиль компании клиента
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [company]
      operationId: updateCompany
      summary: Обновить профиль компании
      description: |
        Название и ИНН компании, связанной с клиентом CRM, ведёт CRM (ORCHESTRATOR §3 п. 16): их правка — 422
        `REQUISITES_MANAGED_BY_CRM`. Остальные поля правятся здесь.

        `bank_details` не применяется сразу (решение владельца 2026-11-08, FX-4): изменённое значение создаёт запрос на смену, в
        ответе `bank_details` прежнее, а в `bank_change_request` — запрос в статусе `pending`; реквизиты меняются только после
        подтверждения сотрудником. Менять может только администратор компании (иначе 409 `ADMIN_REQUIRED`). Один активный запрос
        на компанию: пока он на проверке, новая смена — 409 `BANK_CHANGE_ALREADY_PENDING`, остальные поля запроса при этом не
        сохраняются. Значение, совпадающее с текущим, запроса не создаёт.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdate'
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Смена реквизитов не администратором (`ADMIN_REQUIRED`) или запрос уже на проверке (`BANK_CHANGE_ALREADY_PENDING`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /company/security-log:
    get:
      tags: [company]
      operationId: getCompanySecurityLog
      summary: Журнал событий безопасности компании
      description: |
        Доступен только администраторам компании (`is_admin: true`). Возвращает историю ключевых событий безопасности
        (входы, смены прав, отзыв сессий, деактивации, изменения реквизитов) согласно ADR-0022 и J2-audit.
      responses:
        '200':
          description: Журнал событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySecurityLogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /company/partner-application:
    get:
      tags: [company]
      operationId: getCompanyPartnerApplication
      summary: Статус заявки компании на получение роли партнёра
      description: |
        Статус заявки «Стать партнёром» компании сессии (DECISIONS 2026-11-05). Открыт любой сессии: кандидат с отношением
        без модулей работает со своей заявкой (FX-1). Заявка другой компании не отдаётся, даже при том же адресе контакта.
      responses:
        '200':
          description: Текущий статус партнёрства и заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApplicationStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [company]
      operationId: submitCompanyPartnerApplication
      summary: Подать заявку «Стать партнёром» из кабинета действующего клиента
      description: |
        Запрос действующего клиента на добавление роли `partner` к существующей компании без дублирования сущностей.
        Реквизиты компании берутся из сессии; заявка уходит в контур снабжения для согласования партнёрского договора.
        Требует модуль `company` и право действовать `can_act`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerApplicationClientCreate'
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApplication'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'ALREADY_PARTNER — компания уже партнёр; APPLICATION_EXISTS — активная заявка уже на рассмотрении'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /company/partner-application/contract-pdf:
    get:
      tags: [company]
      operationId: getCompanyPartnerContractPdf
      summary: Скачать проект или подписанный партнёрский договор
      description: |
        Отдаёт PDF-файл проекта договора или подписанного партнёрского договора компании сессии для ознакомления и
        согласования. Открыт любой сессии (FX-1). Документ не собрался — 503 `DOCUMENT_PENDING`, заглушка не отдаётся.
      responses:
        '200':
          description: PDF-файл договора
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Документ не собрался (`DOCUMENT_PENDING`), повторите позже
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /company/partner-application/agree:
    post:
      tags: [company]
      operationId: agreeCompanyPartnerContract
      summary: Согласовать проект партнёрского договора кандидатом
      description: |
        Кандидат подтверждает согласование проекта партнёрского договора своей компании. Статус переводится в
        `candidate_agreed`. Открыт любой сессии (FX-1), требует права действовать `can_act`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  description: Примечание или комментарий кандидата
      responses:
        '200':
          description: Договор успешно согласован кандидатом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApplication'
        '400':
          description: Заявка не находится в статусе contract_sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Документ не собрался (`DOCUMENT_PENDING`), повторите позже
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /team:
    get:
      tags: [company]
      operationId: listTeam
      summary: Команда клиента (контакты компании)
      responses:
        '200':
          description: Контакты компании
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /team/invite:
    post:
      tags: [company]
      operationId: inviteTeamMember
      summary: Пригласить коллегу в кабинет
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInvite'
      responses:
        '201':
          description: Приглашение отправлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: >-
            Письмо не ушло (`DELIVERY_FAILED`): коллега в команду не добавлен, повторить можно сразу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /team/{id}:
    patch:
      tags: [company]
      operationId: updateTeamMember
      summary: Обновить права коллеги (J2, только администратор компании)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberUpdate'
      responses:
        '200':
          description: Права обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /team/{id}/deactivate:
    post:
      tags: [company]
      operationId: deactivateTeamMember
      summary: Отключить коллегу и завершить все его активные сессии (J2, только администратор)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Коллега деактивирован
          content:
            application/json:
              schema:
                type: object
                required: [ok, deactivated_contact_id]
                properties:
                  ok:
                    type: boolean
                  deactivated_contact_id:
                    type: integer
                    format: int64
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /messages:
    get:
      tags: [messages]
      operationId: listMessages
      summary: Лента чата кабинета компании
      description: |
        Сообщения компании сессии по возрастанию `id`: с `after_id` — новые после него (опрос раз в 10 с, пока экран
        открыт), без него — последние `limit`. Опрос отмечает присутствие контакта в кабинете (`last_seen`, с
        прореживанием) — по нему уведомления решают, слать ли ответ менеджера во внешний канал. Модуль `messages`.
      parameters:
        - name: after_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Сообщения ленты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalMessagePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [messages]
      operationId: postMessage
      summary: Написать менеджеру в чат кабинета
      description: |
        Сообщение контакта сессии в ленту его компании; запись и событие `uz.railtech.erp.cabinet.message_posted.v1`
        — одной транзакцией. Повтор с тем же `client_message_id` в пределах компании возвращает прежнее сообщение (200),
        второго не создаёт. `context` — метка документа, со страницы которого написали: сделка, КП, счёт или акт компании
        сессии (номер подставляет ERP); чужой или невидимый клиенту документ — 404. Требует `can_act`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalMessageCreate'
      responses:
        '201':
          description: Сообщение принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalMessage'
        '200':
          description: Сообщение с этим `client_message_id` уже было — прежнее
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Текст пуст (`TEXT_REQUIRED`) или длиннее 4000 символов, ключ повтора не по формату (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /messages/read:
    post:
      tags: [messages]
      operationId: markMessagesRead
      summary: Контакт прочитал ленту до сообщения
      description: |
        Отметка «прочитано» контактом сессии: ответы менеджера с `id` не больше `last_id` перестают считаться в
        `Me.unread`. Отметка не уходит назад; `last_id` — сообщение ленты своей компании, иначе 404. Модуль `messages`;
        `can_act` не нужен (чтение).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalMessageReadMark'
      responses:
        '200':
          description: Отметка сохранена, число непрочитанных после неё
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalMessageUnread'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    portalSession:
      type: apiKey
      in: cookie
      name: portal_session
      description: >-
        Сессия портала (HttpOnly; SameSite=Lax, а для Telegram Mini App — SameSite=None; Secure, настройка ERP
        `PORTAL_COOKIE_SAMESITE`), выдаётся `/auth/telegram` или `POST /auth/magic`. Сессия архивной компании
        или контакта, переведённого в другую компанию, — 401

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Произвольный уникальный ключ попытки (CONTRACTS §0; Cabinet шлёт UUID). Обязателен на `POST` и `PATCH` —
        заодно это защита от CSRF: заголовок делает запрос «непростым», и междоменный запрос идёт только через
        CORS-preflight (разрешён лишь origin Cabinet). Повтор с тем же ключом возвращает прежний ответ.
      schema:
        type: string
        minLength: 1

  responses:
    Unauthorized:
      description: Нет сессии портала
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: У контакта нет права действовать (`can_act = false`; `FORBIDDEN`) или у сессии нет модуля эндпоинта (`MODULE_REQUIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CompanyArchived:
      description: Компания контакта архивна — вход закрыт любым каналом (`FORBIDDEN`, Q-18)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Объект не найден или принадлежит другой компании
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Тело запроса не прошло проверку
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdempotencyKeyRequired:
      description: 'Нет заголовка `Idempotency-Key` (`{"detail": "IDEMPOTENCY_KEY_REQUIRED"}`); запрос не выполнялся'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 'Тело не `application/json` (`{"detail": "UNSUPPORTED_MEDIA_TYPE"}`); запрос не выполнялся'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 'Лимит частоты исчерпан (`{"detail": "TOO_MANY_REQUESTS"}`); повторить через `Retry-After` секунд'
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          description: Код из `ErrorCode`; новые коды добавляются в перечень в том же PR, что и код ERP
          anyOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: string
      additionalProperties: false

    ErrorCode:
      type: string
      description: |
        Коды ошибок портала (Q-17) — **открытое множество** (решение архитектора 2026-11-04, CONTRACTS §7.2; эталон —
        Zalando RESTful API Guidelines, `x-extensible-enum`): перечень ниже — известные на сегодня коды, новый код
        добавляется без смены версии и не ломает контракт. Клиент обрабатывает незнакомый код как общую ошибку по
        HTTP-статусу (Cabinet — `apiErrorKey`). Поэтому здесь `x-extensible-enum`, а не `enum`.
      x-extensible-enum:
        - UNAUTHORIZED
        - INVALID_INIT_DATA
        - FORBIDDEN
        - MODULE_REQUIRED
        - NOT_FOUND
        - MAGIC_LINK_EXPIRED
        - LOGIN_CODE_INVALID
        - LOGIN_CODE_LOCKED
        - IDEMPOTENCY_KEY_REQUIRED
        - UNSUPPORTED_MEDIA_TYPE
        - TOO_MANY_REQUESTS
        - VALIDATION_ERROR
        - REASON_REQUIRED
        - INN_INVALID
        - REQUISITES_MANAGED_BY_CRM
        - TEAM_MEMBER_EXISTS
        - CONTACT_EMAIL_REQUIRED
        - CONTACT_CHANNEL_REQUIRED
        - INVALID_CHANNEL
        - FILE_REQUIRED
        - FILE_TOO_LARGE
        - UPLOAD_NOT_FOUND
        - QUOTE_FINALIZED
        - QUOTE_EXPIRED
        - QUOTE_CODE_INVALID
        - CONTRACT_FINALIZED
        - ACT_FINALIZED
        - DELIVERY_LINE_NOT_ACCEPTABLE
        - DOCUMENT_PENDING
        - DELIVERY_FAILED
        - INVOICE_NOT_OPEN
        - TEXT_REQUIRED
        - CONFLICT
        - ORDER_FINALIZED
        - TRANSITION_NOT_ALLOWED
        - ORDER_NOT_CONFIRMED
        - SHIPMENT_NOTICE_DUPLICATE
        - REQUEST_NOT_SENT
        - ALREADY_ANSWERED
        - FILE_CONTENT_MISMATCH
        - CONTACT_NOT_IN_CRM
        - TELEGRAM_LINK_UNAVAILABLE
        - TELEGRAM_NOT_LINKED
        - TELEGRAM_ALREADY_LINKED
        - XLSX_REQUIRED
        - VALID_DATE_INVALID
        - OFFER_VALIDITY_RANGE_INVALID
        - PRODUCT_NOT_SUBMITTABLE
        - OFFER_EXPIRED
        - IMPORT_FAILED
        - CONSENT_REQUIRED
        - HONEYPOT_DETECTED
        - ALREADY_PARTNER
        - APPLICATION_EXISTS
        - PARTNER_APPLICATION_NOT_FOUND
        - NOT_IN_CONTRACT_SENT_STATUS
        - LAST_ADMIN_CANNOT_BE_REMOVED
        - CANNOT_DEACTIVATE_SELF
        - CANNOT_ELEVATE_RIGHTS
        - ADMIN_REQUIRED
        - BANK_CHANGE_ALREADY_PENDING
        - CANNOT_MODIFY_PRIMARY_CONTACT
        - TECH_DOC_KIND_INVALID
        - FILE_TYPE_NOT_ALLOWED
        - TECH_DOC_DATE_INVALID
        - TECH_DOC_VALIDITY_RANGE_INVALID

    PartnerKind:
      type: string
      enum: [manufacturer, supplier, principal, other]
      description: |
        Вид партнёра (ADR-0022):
        - `manufacturer`: Изготовитель (завод-производитель)
        - `supplier`: Поставщик (дистрибьютор, торговая компания)
        - `principal`: Принципал (производитель, у которого мы региональный дилер)
        - `other`: Другое

    PartnerApplicationStatus:
      type: string
      enum: [submitted, contract_sent, candidate_agreed, approved, rejected]
      description: |
        Статус заявки в договорном шлюзе (DECISIONS 2026-11-05):
        - `submitted`: заявка подана, ожидает проверки снабжением
        - `contract_sent`: проект партнёрского договора отправлен кандидату
        - `candidate_agreed`: проект договора согласован кандидатом, ожидает утверждения
        - `approved`: договор подписан, отношение `partner` активировано
        - `rejected`: заявка отклонена

    PartnerApplication:
      type: object
      required:
        - id
        - status
        - kind
        - categories_description
        - company_name
        - contact_name
        - email
        - created_at
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/PartnerApplicationStatus'
        kind:
          $ref: '#/components/schemas/PartnerKind'
        categories_description:
          type: string
          description: Категории и номенклатура поставляемой продукции
        company_name:
          type: string
          description: Название организации
        country:
          type: [string, 'null']
          description: Код страны ISO 3166-1 alpha-2
        inn:
          type: [string, 'null']
          description: ИНН организации (для резидентов РУз)
        registration_number:
          type: [string, 'null']
          description: Регистрационный номер компании (для нерезидентов)
        contact_name:
          type: string
          description: Контактное лицо
        email:
          type: string
          format: email
        phone:
          type: [string, 'null']
        contract_number:
          type: [string, 'null']
          description: Номер заключённого партнёрского договора
        contract_date:
          type: [string, 'null']
          format: date
          description: Дата партнёрского договора
        contract_draft_sent_at:
          type: [string, 'null']
          format: date-time
          description: Дата и время направления проекта договора
        candidate_agreed_at:
          type: [string, 'null']
          format: date-time
          description: Дата и время согласования договора кандидатом
        candidate_notes:
          type: [string, 'null']
          description: Примечания/комментарии кандидата при согласовании
        has_contract_pdf:
          type: boolean
          description: Наличие прикреплённого PDF-файла договора
        rejected_reason:
          type: [string, 'null']
          description: Причина отклонения заявки
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PartnerApplicationPublicCreate:
      type: object
      required:
        - company_name
        - kind
        - categories_description
        - contact_name
        - email
        - consent
      properties:
        company_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Название организации
        country:
          type: [string, 'null']
          maxLength: 2
          description: Код страны ISO 3166-1 alpha-2 (UZ, KZ, RU, CN, DE...)
        inn:
          type: [string, 'null']
          maxLength: 32
          description: ИНН (для резидентов РУз)
        registration_number:
          type: [string, 'null']
          maxLength: 64
          description: Регистрационный номер компании (для нерезидентов)
        kind:
          $ref: '#/components/schemas/PartnerKind'
        categories_description:
          type: string
          minLength: 5
          maxLength: 2000
          description: Описание категорий поставляемой продукции и брендов
        contact_name:
          type: string
          minLength: 1
          maxLength: 255
          description: ФИО контактного лица
        email:
          type: string
          format: email
          maxLength: 254
          description: E-mail для связи и отправки проекта договора
        phone:
          type: [string, 'null']
          maxLength: 32
          description: Телефон контактного лица
        language:
          type: string
          enum: [ru, uz, en]
          default: ru
          description: Язык взаимодействия и договора
        consent:
          type: boolean
          description: Согласие на обработку персональных данных (обязательно true)
        website:
          type: [string, 'null']
          description: Скрытое поле-ловушка для спам-ботов (honeypot; должно быть пустым)

    PartnerApplicationPublicResult:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/PartnerApplicationStatus'

    MagicLinkResult:
      type: object
      required:
        - status
        - sent
        - email
      properties:
        status:
          type: string
          enum: [ok]
          description: Запрос принят; не говорит, зарегистрирован ли адрес
        sent:
          type: boolean
          description: Всегда true; письмо уходит, только если адрес зарегистрирован
        email:
          type: string
          description: Адрес из запроса

    PortalCountry:
      type: object
      required:
        - code
        - name
        - is_uzbekistan
      properties:
        code:
          type: string
          description: Двухбуквенный код страны ISO 3166-1 alpha-2 (UZ, KZ, RU, CN, DE...)
        name:
          type: string
          description: Название страны
        alpha3:
          type: string
          description: Трёхбуквенный код страны ISO 3166-1 alpha-3
        phone_code:
          type: string
          description: Международный телефонный код (+998, +7, +86...)
        phone_mask:
          type: string
          description: Маска ввода номера телефона
        phone_placeholder:
          type: string
          description: Пример номера телефона
        tax_label:
          type: string
          description: Название налогового номера (ИНН, БИН, USCC, Tax ID...)
        tax_placeholder:
          type: string
          description: Пример налогового номера
        tax_regex:
          type: string
          description: Регулярное выражение для проверки налогового номера
        is_uzbekistan:
          type: boolean
          description: Является ли страна Узбекистаном (UZ)

