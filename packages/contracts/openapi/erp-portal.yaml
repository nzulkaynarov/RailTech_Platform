openapi: 3.1.0
info:
  title: RailTech Platform ERP — Portal API (Cabinet → ERP)
  version: 0.5.0
  summary: Пространство `/api/portal/v1/` — вызывает Cabinet SPA от имени клиента.
  description: |
    Контракт по `docs/architecture/CONTRACTS.md` §4 и ADR-0004 (Cabinet без бэкенда). Версия 0 (M0-INF-02):
    ERP реализует приложение `portal` (M2-ERP-01…03), Cabinet генерирует типы из этого файла (M2-CAB-01).

    Все ответы отфильтрованы по компании сессии: чужая компания → 404 (негативный тест на каждый эндпоинт).
    Сессия портала — cookie `HttpOnly`, отдельная от сессий сотрудников. Сотрудники сюда не входят
    (инвариант ORCHESTRATOR §3.1). Ошибки — `{"detail": "<CODE>"}`.

    Защита сессии в cookie от CSRF (FIX-15): каждый `POST` и `PATCH` обязан нести
    заголовок `Idempotency-Key` (без него — 400 `IDEMPOTENCY_KEY_REQUIRED`) и тело `application/json`
    (иное — 415 `UNSUPPORTED_MEDIA_TYPE`; единственное исключение — `multipart/form-data` на `/uploads`). Повтор с тем же
    ключом и тем же методом/путём в пределах сессии возвращает прежний ответ (заголовок `Idempotent-Replay: true`);
    исключение — ответы с `Set-Cookie` (`/auth/*`): они не кэшируются, повтор исполняется заново.

    Коды ошибок `detail` — перечень `ErrorCode` (Q-17); незнакомый код Cabinet показывает по HTTP-статусу.
    Ссылка входа из письма ведёт на Cabinet `/auth/magic#token=<токен>`: токен во фрагменте не попадает в журналы
    серверов и прокси, Cabinet обменивает его через `POST /auth/magic` (FIX-20).

    0.3.0 (FIX-25): сняты устаревшие `deal_id` (везде `deal.id`) и `GET /auth/magic/{token}`; у КП `subtotal` и `vat`;
    `FILE_TOO_LARGE` — 422 на `/uploads`; `DELIVERY_FAILED` — 503 на `/team/invite`; `lines` в `POST /requests` необязателен.

    Лимиты частоты (429 `TOO_MANY_REQUESTS`, заголовок `Retry-After`): запросы сессии — 120 в минуту на сессию; вход без
    сессии (`/auth/telegram`, `/auth/magic-link`, `/auth/magic`, `/auth/code`) — 10 в минуту на IP; акцепт КП с кодом и запрос кода —
    10 в минуту на сессию; ссылка входа на один e-mail — не чаще 5 в час. Ставки задаются настройками ERP.

    Код входа (B-MAIL-1): письмо входа и приглашения несёт и ссылку, и 6-значный одноразовый код — клиент вводит код на
    экране «Мы отправили письмо» (`POST /auth/code`), если ссылка не открывается или письмо пришло на другое устройство.
    Ссылка и код — одна запись, живут 60 минут (приглашение — 24 часа), гасятся вместе; 5 неверных кодов подряд —
    429 `LOGIN_CODE_LOCKED` до нового запроса.

    0.4.0 (PART-1, ADR-0022): в кабинет входят клиенты и партнёры (изготовители, поставщики, принципалы — по отношению
    компании, которое заводит сотрудник). Ролей две и они складываются: `client` (тип компании CLIENT) и `partner`.
    `GET /me` отдаёт `roles` и `modules` — разделы кабинета: клиенту весь шаблон роли, партнёру те, что сотрудник включил
    на отношении (из шаблона роли `partner`, по умолчанию `my_products` и `catalog_requests`), и всегда `profile` (выход и язык;
    не выключается). Шаблоны — `Me.x-role-modules`
    и `Me.x-role-default-modules`; меню Cabinet строится из `modules`. Эндпоинт открыт сессии, у которой есть его модуль:
    `/requests*`, `/catalog*`, `/uploads` — `catalog_requests`, `/quotes*` — `quotes`, `/contracts*` — `contracts`,
    `/invoices*` — `invoices`, `/acts*` — `acts`, `/deliveries*` — `deliveries`, `/documents*` — `documents`, `/company` —
    `company`, `/team*` — `team`; без модуля — 403 `MODULE_REQUIRED`. Включение и выключение модуля действует на следующем
    запросе, без перевхода. Приостановленное отношение закрывает вход, живая сессия партнёра гаснет на следующем запросе (401).

    0.5.0 (CHAT-1, ADR-0023): чат кабинета — одна лента на компанию (видят все её контакты), канал `cabinet` в очереди
    «Сообщения» Платформы. `GET /messages`, `POST /messages`, `POST /messages/read` — модуль `messages`: он в шаблонах обеих
    ролей и не выключается (как `profile`); отправка — с `can_act`. `GET /me` несёт `unread` — непрочитанные контактом ответы
    менеджера. Компания и автор — только из сессии; метка документа (`context`) проверяется на принадлежность компании
    сессии — чужая сделка, КП, счёт или акт отвечают 404 без утечки.
servers:
  - url: https://erp.railtech.uz/api/portal/v1
    description: prod
  - url: http://erp.localhost/api/portal/v1
    description: стенд ансамбля (infra/compose)
security:
  - portalSession: []
tags:
  - name: auth
    description: Вход по Telegram initData или magic-link; регистрации «с улицы» нет
  - name: me
  - name: requests
  - name: quotes
  - name: contracts
  - name: invoices
  - name: acts
  - name: deliveries
  - name: documents
  - name: catalog
    description: Опубликованный слой с ценой и наличием — только здесь (решение владельца 2026-10-13)
  - name: company
  - name: messages
    description: Чат кабинета с менеджером (ADR-0023) — лента компании, обновление опросом

paths:
  /auth/telegram:
    post:
      tags: [auth]
      operationId: authTelegram
      summary: Вход из Telegram Mini App
      description: ERP проверяет подпись `initData` токеном клиентского бота CRM (срок ≤ 5 мин), ищет контакт по `telegram_user_id`, выдаёт сессию портала.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data:
                  type: string
                  description: Строка `window.Telegram.WebApp.initData` как есть
              additionalProperties: false
      responses:
        '200':
          description: Сессия выдана (cookie `Set-Cookie`)
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Подпись неверна, срок истёк или контакт не найден (`INVALID_INIT_DATA`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/CompanyArchived'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/magic-link:
    post:
      tags: [auth]
      operationId: requestMagicLink
      summary: Запросить ссылку для входа по e-mail
      description: >-
        Письмо со ссылкой и 6-значным кодом входа на 60 минут, одноразовыми (B-MAIL-1). Новый запрос гасит прежние ссылку и
        код входа (приглашение остаётся). Ответ всегда 200, чтобы не раскрывать наличие адреса.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
              additionalProperties: false
      responses:
        '200':
          description: Принято
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/magic:
    post:
      tags: [auth]
      operationId: exchangeMagicLinkToken
      summary: Обмен токена из ссылки входа на сессию
      description: |
        Cabinet берёт токен из фрагмента ссылки `/auth/magic#token=…` и шлёт его в теле: токен не появляется ни в пути,
        ни в журналах. Токен одноразовый и живёт 60 минут (ссылка-приглашение — 24 часа, B-MAIL-1). Заменяет `GET /auth/magic/{token}`.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 16
                  maxLength: 512
              additionalProperties: false
      responses:
        '200':
          description: Сессия выдана (cookie `Set-Cookie`)
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '403':
          $ref: '#/components/responses/CompanyArchived'
        '410':
          description: Токен просрочен, уже использован или неизвестен (`MAGIC_LINK_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/code:
    post:
      tags: [auth]
      operationId: exchangeLoginCode
      summary: Вход по коду из письма
      description: |
        B-MAIL-1. Клиент вводит адрес и 6-значный код из письма входа или приглашения. Код одноразовый, живёт столько же,
        сколько ссылка того же письма (60 минут, приглашение — 24 часа), в базе — только хеш, сравнение за постоянное
        время. Неверный, просроченный, использованный код и неизвестный адрес дают один ответ — 422 `LOGIN_CODE_INVALID`
        (наличие адреса не раскрывается). Пятая неверная попытка подряд и дальше — 429 `LOGIN_CODE_LOCKED` до нового
        запроса `POST /auth/magic-link`. Верный код гасит и ссылку того же письма.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: '^\d{6}$'
              additionalProperties: false
      responses:
        '200':
          description: Сессия выдана (cookie `Set-Cookie`)
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '403':
          $ref: '#/components/responses/CompanyArchived'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            `LOGIN_CODE_INVALID` — код неверный, устарел или уже использован (и для неизвестного адреса);
            `VALIDATION_ERROR` — тело не по схеме
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: >-
            `LOGIN_CODE_LOCKED` — 5 неверных кодов подряд, нужен новый код; `TOO_MANY_REQUESTS` — лимит частоты по IP
            (заголовок `Retry-After`)
          headers:
            Retry-After:
              description: Через сколько секунд можно повторить (только у `TOO_MANY_REQUESTS`)
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Завершить сессию портала
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Сессия завершена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Сессия, контакт, компания, права
      responses:
        '200':
          description: Текущий контакт и его компания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /requests:
    get:
      tags: [requests]
      operationId: listRequests
      summary: Мои запросы
      responses:
        '200':
          description: Запросы компании
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [requests]
      operationId: createRequest
      summary: Новый запрос
      description: Строки свободным текстом и вложения. Создаёт заявку в ERP минуя CRM; CRM получает событие `request.created(source=cabinet)`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequestCreate'
      responses:
        '201':
          description: Запрос принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /requests/{id}:
    get:
      tags: [requests]
      operationId: getRequest
      summary: Запрос клиента со строками (Q-16)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Запрос клиента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /quotes:
    get:
      tags: [quotes]
      operationId: listQuotes
      summary: Коммерческие предложения
      responses:
        '200':
          description: КП компании (все версии, отправленные клиенту)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /quotes/{id}:
    get:
      tags: [quotes]
      operationId: getQuote
      summary: КП со строками
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: КП
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /quotes/{id}/request-code:
    post:
      tags: [quotes]
      operationId: requestQuoteAcceptanceCode
      summary: Запросить код акцепта КП
      description: |
        Код акцепта (6 цифр, 15 минут, 5 попыток) ERP отправляет контакту сессии по его каналу — в Telegram через бота CRM
        или на e-mail; мастер-кода нет (FIX-02). Cabinet зовёт перед вводом кода на экране КП. Повторный запрос гасит
        прежний код. Требует права `can_act`; лимит — `portal_accept` (10 в минуту на сессию).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: Код отправлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptanceCodeSent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: КП не в статусе ожидания ответа (`QUOTE_FINALIZED`, `QUOTE_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: У контакта нет ни одного канала для кода (`CONTACT_CHANNEL_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /quotes/{id}/accept:
    post:
      tags: [quotes]
      operationId: acceptQuote
      summary: Принять КП по коду акцепта
      description: Код — из `POST /quotes/{id}/request-code`. Договор создаётся автоматически (BUSINESS §4, шаг 6). Требует права `can_act`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 12
              additionalProperties: false
      responses:
        '200':
          description: КП принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: КП уже принято/отклонено или срок истёк (`QUOTE_FINALIZED`, `QUOTE_EXPIRED`); код неверен или не запрошен (`QUOTE_CODE_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /quotes/{id}/reject:
    post:
      tags: [quotes]
      operationId: rejectQuote
      summary: Отклонить КП с причиной
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: КП отклонено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: КП уже в конечном статусе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /quotes/{id}/comments:
    post:
      tags: [quotes]
      operationId: addQuoteComment
      summary: Комментарий клиента к КП
      description: |
        Вопрос или замечание по КП, пока оно ждёт решения (`sent`, `viewed`, срок не вышел). Комментарий попадает в ленту
        `Quote.comments`, в журнал сделки и уведомлением — ответственному менеджеру; КП не меняется. Ответ менеджер даёт
        в канале клиента (бот, почта) или новой версией КП. Требует `can_act`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCommentCreate'
      responses:
        '201':
          description: Комментарий принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteComment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: КП уже принято или отклонено (`QUOTE_FINALIZED`) либо срок вышел (`QUOTE_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
