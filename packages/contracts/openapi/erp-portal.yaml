        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Счёт уже оплачен или отменён (`INVOICE_NOT_OPEN`) — платёжка не нужна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Загрузки нет у компании или она уже вложена в другую сделку (`UPLOAD_NOT_FOUND`); файл не PDF и не
            изображение, больше 10 МБ, сумма не больше нуля, дата платежа в будущем или комментарий длиннее
            500 символов (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

