          required: false
          schema:
            $ref: '#/components/schemas/DocumentKind'
        - name: deal_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Поисковая строка по номеру, названию документа или сделки
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Начало периода (включительно)
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Конец периода (включительно)
      responses:
        '200':
          description: Документы без файлов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /documents/{id}/file:
    get:
      tags: [documents]
      operationId: getDocumentFile
      summary: Файл документа (поток, аудит выдачи)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Файл
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '202':
          description: PDF ещё рендерится (M2-ERP-03) — повторить через `Retry-After`
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /verify/{code}:
    get:
      tags: [verify]
      operationId: verifyDocument
      summary: Проверка подлинности официального документа по коду (ADR-0024 §6)
      description: |
        Публичный эндпоинт проверки официального документа (без авторизации, лимит частоты portal_verify).
        Возвращает данные о документе, подписанте, основании и контрольную сумму SHA-256 файла PDF для проверки.
      security: []
      parameters:
        - name: code
          in: path
          required: true
          description: Код проверки с QR-кода на бланке или из колонтитула
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{8,32}$'
      responses:
        '200':
          description: Документ найден и проверен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVerification'
        '404':
          description: Документ с таким кодом не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /uploads:
    post:
      tags: [documents]
      operationId: uploadFile
      summary: Загрузка файлов клиентом (Q-14, multipart, <= 10MB)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Файл до 10 МБ
      responses:
        '201':
          description: Файл успешно загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUploadResponse'
        '400':
          description: Нет заголовка `Idempotency-Key` (`IDEMPOTENCY_KEY_REQUIRED`) или файл не передан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Файл больше 10 МБ (`FILE_TOO_LARGE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /catalog/categories:
