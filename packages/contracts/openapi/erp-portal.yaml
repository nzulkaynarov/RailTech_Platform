  /messages:
    get:
      tags: [messages]
      operationId: listMessages
      summary: Лента чата кабинета компании
      description: |
        Сообщения компании сессии по возрастанию `id`: с `after_id` — новые после него (опрос раз в 10 с, пока экран
        открыт), без него — последние `limit`. Опрос отмечает присутствие контакта в кабинете (`last_seen`, с
        прореживанием) — по нему уведомления решают, слать ли ответ менеджера во внешний канал. Модуль `messages`.
      parameters:
        - name: after_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Сообщения ленты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalMessagePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [messages]
      operationId: postMessage
      summary: Написать менеджеру в чат кабинета
      description: |
        Сообщение контакта сессии в ленту его компании; запись и событие `uz.railtech.erp.cabinet.message_posted.v1`
        — одной транзакцией. Повтор с тем же `client_message_id` в пределах компании возвращает прежнее сообщение (200),
        второго не создаёт. `context` — метка документа, со страницы которого написали: сделка, КП, счёт или акт компании
        сессии (номер подставляет ERP); чужой или невидимый клиенту документ — 404. Требует `can_act`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalMessageCreate'
      responses:
        '201':
          description: Сообщение принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalMessage'
        '200':
          description: Сообщение с этим `client_message_id` уже было — прежнее
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Текст пуст (`TEXT_REQUIRED`) или длиннее 4000 символов, ключ повтора не по формату (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /messages/read:
    post:
      tags: [messages]
      operationId: markMessagesRead
      summary: Контакт прочитал ленту до сообщения
      description: |
        Отметка «прочитано» контактом сессии: ответы менеджера с `id` не больше `last_id` перестают считаться в
        `Me.unread`. Отметка не уходит назад; `last_id` — сообщение ленты своей компании, иначе 404. Модуль `messages`;
        `can_act` не нужен (чтение).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalMessageReadMark'
      responses:
        '200':
          description: Отметка сохранена, число непрочитанных после неё
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalMessageUnread'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    portalSession:
      type: apiKey
      in: cookie
      name: portal_session
      description: >-
        Сессия портала (HttpOnly; SameSite=Lax, а для Telegram Mini App — SameSite=None; Secure, настройка ERP
        `PORTAL_COOKIE_SAMESITE`), выдаётся `/auth/telegram` или `POST /auth/magic`. Сессия архивной компании
        или контакта, переведённого в другую компанию, — 401

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Произвольный уникальный ключ попытки (CONTRACTS §0; Cabinet шлёт UUID). Обязателен на `POST` и `PATCH` —
        заодно это защита от CSRF: заголовок делает запрос «непростым», и междоменный запрос идёт только через
        CORS-preflight (разрешён лишь origin Cabinet). Повтор с тем же ключом возвращает прежний ответ.
      schema:
        type: string
        minLength: 1

  responses:
    Unauthorized:
      description: Нет сессии портала
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: У контакта нет права действовать (`can_act = false`; `FORBIDDEN`) или у сессии нет модуля эндпоинта (`MODULE_REQUIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CompanyArchived:
      description: Компания контакта архивна — вход закрыт любым каналом (`FORBIDDEN`, Q-18)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Объект не найден или принадлежит другой компании
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Тело запроса не прошло проверку
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdempotencyKeyRequired:
      description: 'Нет заголовка `Idempotency-Key` (`{"detail": "IDEMPOTENCY_KEY_REQUIRED"}`); запрос не выполнялся'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 'Тело не `application/json` (`{"detail": "UNSUPPORTED_MEDIA_TYPE"}`); запрос не выполнялся'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 'Лимит частоты исчерпан (`{"detail": "TOO_MANY_REQUESTS"}`); повторить через `Retry-After` секунд'
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          description: Код из `ErrorCode`; новые коды добавляются в перечень в том же PR, что и код ERP
          anyOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: string
      additionalProperties: false

    ErrorCode:
      type: string
      description: |
        Коды ошибок портала (Q-17) — **открытое множество** (решение архитектора 2026-11-04, CONTRACTS §7.2; эталон —
        Zalando RESTful API Guidelines, `x-extensible-enum`): перечень ниже — известные на сегодня коды, новый код
        добавляется без смены версии и не ломает контракт. Клиент обрабатывает незнакомый код как общую ошибку по
        HTTP-статусу (Cabinet — `apiErrorKey`). Поэтому здесь `x-extensible-enum`, а не `enum`.
      x-extensible-enum:
        - UNAUTHORIZED
        - INVALID_INIT_DATA
        - FORBIDDEN
        - MODULE_REQUIRED
        - NOT_FOUND
        - MAGIC_LINK_EXPIRED
        - LOGIN_CODE_INVALID
        - LOGIN_CODE_LOCKED
        - IDEMPOTENCY_KEY_REQUIRED
        - UNSUPPORTED_MEDIA_TYPE
        - TOO_MANY_REQUESTS
        - VALIDATION_ERROR
        - REASON_REQUIRED
        - INN_INVALID
        - REQUISITES_MANAGED_BY_CRM
        - TEAM_MEMBER_EXISTS
        - CONTACT_EMAIL_REQUIRED
        - CONTACT_CHANNEL_REQUIRED
        - INVALID_CHANNEL
        - FILE_REQUIRED
        - FILE_TOO_LARGE
        - UPLOAD_NOT_FOUND
        - QUOTE_FINALIZED
        - QUOTE_EXPIRED
        - QUOTE_CODE_INVALID
        - CONTRACT_FINALIZED
        - ACT_FINALIZED
        - DELIVERY_LINE_NOT_ACCEPTABLE
        - DOCUMENT_PENDING
        - DELIVERY_FAILED
        - INVOICE_NOT_OPEN
        - TEXT_REQUIRED
        - CONFLICT
        - CONTACT_NOT_IN_CRM
        - TELEGRAM_LINK_UNAVAILABLE
        - TELEGRAM_NOT_LINKED
        - TELEGRAM_ALREADY_LINKED
        - XLSX_REQUIRED
        - VALID_DATE_INVALID
        - OFFER_VALIDITY_RANGE_INVALID
        - PRODUCT_NOT_SUBMITTABLE
        - OFFER_EXPIRED
        - IMPORT_FAILED

    PartnerCardStatus:
      type: string
      description: |
        Статус карточки глазами партнёра: `draft` — черновик, `review` — на проверке, `returned` — возвращена с причиной,
        `published` — опубликована; `matched` — «сопоставлено с карточкой каталога»: цена партнёра привязалась к чужой
        неопубликованной карточке, и ему показано только присланное им самим (его название строки, бренд, артикул
        изготовителя, цена) — ни названия, ни категории, ни полноты, ни хода и истории чужой карточки.
      enum: [draft, review, returned, published, matched]

    OfferFreshness:
      type: string
      description: |
        Свежесть цены: `expired` — срок действия истёк (подтвердить нельзя, нужен новый прайс); `stale` — не подтверждена
        дольше N дней (настройка компании, по умолчанию 30); `expiring` — срок кончается в ближайшие 7 дней; иначе `fresh`.
      enum: [fresh, expiring, stale, expired]

    PartnerOffer:
      type: object
      description: Цена этой компании по карточке. Цен других поставщиков в ответах нет.
      required: [price, valid_from, valid_until, delivery_basis, min_order_qty, confirmed_at, freshness]
      properties:
        price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        valid_from:
          type: [string, 'null']
          format: date
        valid_until:
          type: [string, 'null']
          format: date
        delivery_basis:
          type: [string, 'null']
          description: Код Incoterms (FCA, DAP, EXW…)
        min_order_qty:
          type: integer
          minimum: 0
        confirmed_at:
          type: [string, 'null']
          format: date-time
        freshness:
          $ref: '#/components/schemas/OfferFreshness'
      additionalProperties: false

    PartnerIssueField:
      type: string
      description: Поле карточки, к которому сотрудник привязал замечание при возврате; `other` — замечание не к одному полю
      enum:
        - name
        - description
        - brand
        - manufacturer_part_number
        - gost_drawing
        - category
        - uom
        - hs_code
        - price
        - valid_until
        - other

    PartnerIssue:
      type: object
      required: [field, comment]
      properties:
        field:
          $ref: '#/components/schemas/PartnerIssueField'
        comment:
          type: string
          maxLength: 500
      additionalProperties: false

    PartnerMissingField:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          description: Поле, которого не хватает для публикации (name, uom, category, hs_code, identity)
        label:
          type: string
      additionalProperties: false

    PartnerProduct:
      type: object
      required:
        - id
        - name
        - brand
        - manufacturer_part_number
        - category
        - status
        - return_reason
        - return_issues
        - completeness
        - offer
        - has_pending_change
        - is_own
        - can_submit
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        brand:
          type: [string, 'null']
        manufacturer_part_number:
          type: string
        category:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/PartnerCardStatus'
        return_reason:
          type: [string, 'null']
          description: Общий комментарий последнего возврата — только у своей карточки в статусе `returned`
        return_issues:
          type: array
          description: Замечания по полям последнего возврата (поле подсвечивается рядом с комментарием); пусто вне `returned`
          items:
            $ref: '#/components/schemas/PartnerIssue'
        completeness:
          type: integer
          minimum: 0
          maximum: 100
          description: Полнота по полям, которые партнёр заполняет прайсом
        offer:
          oneOf:
            - $ref: '#/components/schemas/PartnerOffer'
            - type: 'null'
        has_pending_change:
          type: boolean
          description: У карточки есть правка этой компании, ожидающая решения сотрудника
        is_own:
          type: boolean
          description: Карточка заведена из данных этой компании; чужую партнёр не отправляет на проверку
        can_submit:
          type: boolean
          description: Можно отправить на проверку (своя карточка в статусе `draft` или `returned`)
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    PartnerStatusCounts:
      type: object
      required: [all, draft, review, returned, published, matched]
      properties:
        all:
          type: integer
          minimum: 0
        draft:
          type: integer
          minimum: 0
        review:
          type: integer
          minimum: 0
        returned:
          type: integer
          minimum: 0
        published:
          type: integer
          minimum: 0
        matched:
          type: integer
          minimum: 0
      additionalProperties: false

    PartnerAttention:
      type: object
      description: Сколько цен компании требуют внимания (по всем ценам, а не по странице); для плашки «подтвердите актуальность»
      required: [expired, stale, expiring]
      properties:
        expired:
          type: integer
          minimum: 0
        stale:
          type: integer
          minimum: 0
        expiring:
          type: integer
          minimum: 0
      additionalProperties: false

    PartnerProductPage:
      type: object
      required: [items, page, page_size, total, counts, attention]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartnerProduct'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        counts:
          $ref: '#/components/schemas/PartnerStatusCounts'
        attention:
          $ref: '#/components/schemas/PartnerAttention'
      additionalProperties: false

    PartnerReviewEntry:
      type: object
      required: [submitted_at, decision, reason, issues, decided_at]
      properties:
        submitted_at:
          type: string
          format: date-time
        decision:
          type: string
          enum: [pending, published, returned, cancelled]
          description: '`cancelled` — проверка закрыта без решения (карточку сняли с публикации, архивировали или отправили заново)'
        reason:
          type: string
          description: Общий комментарий возврата
        issues:
          type: array
          items:
            $ref: '#/components/schemas/PartnerIssue'
        decided_at:
          type: [string, 'null']
          format: date-time
      additionalProperties: false

    PartnerProductDetail:
      type: object
      description: 'Карточка списка (`PartnerProduct`) и подробности; поля списка повторены, чтобы схема была закрытой'
      required:
        - id
        - name
        - brand
        - manufacturer_part_number
        - category
        - status
        - return_reason
        - return_issues
        - completeness
        - offer
        - has_pending_change
        - is_own
        - can_submit
        - updated_at
        - description
        - hs_code
        - uom
        - missing
        - history
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        brand:
          type: [string, 'null']
        manufacturer_part_number:
          type: string
        category:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/PartnerCardStatus'
        return_reason:
          type: [string, 'null']
          description: Общий комментарий последнего возврата — только у своей карточки в статусе `returned`
        return_issues:
          type: array
          description: Замечания по полям последнего возврата (поле подсвечивается рядом с комментарием); пусто вне `returned`
          items:
            $ref: '#/components/schemas/PartnerIssue'
        completeness:
          type: integer
          minimum: 0
          maximum: 100
          description: Полнота по полям, которые партнёр заполняет прайсом
        offer:
          oneOf:
            - $ref: '#/components/schemas/PartnerOffer'
            - type: 'null'
        has_pending_change:
          type: boolean
          description: У карточки есть правка этой компании, ожидающая решения сотрудника
        is_own:
          type: boolean
          description: Карточка заведена из данных этой компании; чужую партнёр не отправляет на проверку
        can_submit:
          type: boolean
          description: Можно отправить на проверку (своя карточка в статусе `draft` или `returned`)
        updated_at:
          type: string
          format: date-time
        description:
          type: string
        hs_code:
          type: string
        uom:
          type: [string, 'null']
        missing:
          type: array
          items:
            $ref: '#/components/schemas/PartnerMissingField'
        history:
          type: array
          description: Отправки на проверку и решения, новые сверху; только у своей карточки
          items:
            $ref: '#/components/schemas/PartnerReviewEntry'
      additionalProperties: false

    PartnerSubmitRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: integer
            format: int64
      additionalProperties: false

    PartnerItemError:
      type: object
      required: [id, code]
      properties:
        id:
          type: integer
          format: int64
        code:
          $ref: '#/components/schemas/ErrorCode'
      additionalProperties: false

    PartnerSubmitResult:
      type: object
      required: [submitted, errors]
      properties:
        submitted:
          type: array
          items:
            type: integer
            format: int64
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PartnerItemError'
      additionalProperties: false

    PartnerConfirmRequest:
      type: object
      description: 'Либо `ids`, либо `all: true`'
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: integer
            format: int64
        all:
          type: boolean
      additionalProperties: false

    PartnerConfirmResult:
      type: object
      required: [confirmed, expired, errors]
      properties:
        confirmed:
          type: integer
          minimum: 0
        expired:
          type: integer
          minimum: 0
          description: 'Сколько цен не подтверждено из-за истёкшего срока (по `ids` те же цены перечислены в `errors`)'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PartnerItemError'
      additionalProperties: false

    PriceListAccepted:
      type: object
      required: [task_id]
      properties:
        task_id:
          type: string
      additionalProperties: false

    PriceListField:
      type: string
      description: Колонка шаблона, в которой проблема строки
      enum:
        - name
        - brand
        - manufacturer_part_number
        - gost_drawing
        - supplier_sku
        - description
        - category
        - hs_code
        - domain_type
        - uom
        - price
        - currency
        - stock
        - lead
        - moq
        - valid_from
        - valid_until

    PriceListRowIssue:
      type: object
      description: Что исправить в строке файла. Cabinet показывает текст по `code` и `field`, незнакомый код — общим «строка не загружена»
      required: [row, field, code, value]
      properties:
        row:
          type: integer
          minimum: 2
          description: Номер строки файла (с учётом строки заголовков)
        field:
          oneOf:
            - $ref: '#/components/schemas/PriceListField'
            - type: 'null'
        code:
          type: string
          description: 'Код проблемы: `PRICE_NOT_A_NUMBER`, `PRICE_NOT_POSITIVE`, `UNKNOWN_CATEGORY`, `UNKNOWN_DOMAIN`, `UNKNOWN_CURRENCY`, `UNKNOWN_STOCK_STATUS`, `VALID_DATE_INVALID`, `OFFER_VALIDITY_RANGE_INVALID`, `HS_CODE_TOO_LONG`, `HS_CODE_NOT_IN_CLASSIFIER`, `HS_CODE_RETIRED`, `ROW_FAILED`'
        value:
          type: [string, 'null']
          description: Значение из файла, которое не подошло (категория, валюта, код ТН ВЭД…)
      additionalProperties: false

    PriceListProposal:
      type: object
      required: [row, field]
      properties:
        row:
          type: integer
        field:
          type: string
          description: Поле карточки, по которому отправлено предложение изменения
      additionalProperties: false

    PriceListMissing:
      type: object
      required: [code, label, count]
      properties:
        code:
          type: string
        label:
          type: string
        count:
          type: integer
      additionalProperties: false

    PriceListReport:
      type: object
      required:
        - dry_run
        - created
        - updated
        - offers_created
        - offers_updated
        - proposal_count
        - proposals
        - error_count
        - errors
        - warning_count
        - warnings
        - rows_truncated
        - unpublishable
        - missing_breakdown
      properties:
        dry_run:
          type: boolean
        created:
          type: integer
          description: Новых карточек
        updated:
          type: integer
          description: Строк по уже известным карточкам
        offers_created:
          type: integer
        offers_updated:
          type: integer
        proposal_count:
          type: integer
          description: Предложений изменить поля чужой, опубликованной или находящейся на проверке карточки
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/PriceListProposal'
        error_count:
          type: integer
          description: Строк с ошибкой — они не загружены
        errors:
          type: array
          description: Первые 200 строк с ошибкой
          items:
            $ref: '#/components/schemas/PriceListRowIssue'
        warning_count:
          type: integer
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PriceListRowIssue'
        rows_truncated:
          type: integer
          description: Сколько строк файла не прочитано из-за предела размера
        unpublishable:
          type: integer
          description: Сколько карточек файла не наберут полноты для публикации
        missing_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/PriceListMissing'
      additionalProperties: false

    PriceListTask:
      type: object
      required: [task_id, status, error, report]
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        error:
          type: [string, 'null']
          description: Код ошибки уровня файла при `failed` (`NAME_COLUMN_NOT_FOUND` — нет колонки наименования)
        report:
          oneOf:
            - $ref: '#/components/schemas/PriceListReport'
            - type: 'null'
      additionalProperties: false

    Reason:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false

    Language:
      type: string
      enum: [ru, uz, en]

    PreferredChannel:
      type: string
      enum: [telegram, email, both]

    Currency:
      type: string
      pattern: '^[A-Z]{3}$'

    Amount:
      type: string
      pattern: '^-?\d+\.\d{2}$'

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
      additionalProperties: false

    DealRef:
      type: object
      description: Сделка глазами клиента (Q-16) — номер и название вместо внутреннего id
      required: [id, number]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
        title:
          type: [string, 'null']
      additionalProperties: false

    AcceptanceCodeSent:
      type: object
      required: [channel, sent_to, expires_in]
      properties:
        channel:
          type: string
          enum: [telegram, email]
        sent_to:
          type: string
          description: 'Куда ушёл код, в замаскированном виде: `i***@example.com`, `@u***` или `Telegram`'
        expires_in:
          type: integer
          minimum: 1
          description: Срок действия кода, секунд
      additionalProperties: false

    ActAccept:
      type: object
      properties:
        upload_id:
          type: string
          description: Скан подписанного акта из `POST /uploads` (PDF или изображение, ≤ 10 МБ)
      additionalProperties: false

    Me:
      type: object
      properties:
        contact:
          $ref: '#/components/schemas/TeamMember'
        company:
          $ref: '#/components/schemas/Company'
        can_act:
          type: boolean
          description: 'Право «действовать» (принимать КП, подписывать, принимать акты); иначе — только смотреть'
        auth_method:
          type: string
          enum: [telegram, magic_link]
        notifications_unread:
          type: integer
          minimum: 0
          description: Непрочитанные контактом уведомления колокольчика (только видимые модулям сессии); 0 — нет
        roles:
          type: array
          description: Роли компании сессии в кабинете. Клиент — по типу компании CLIENT, партнёр — по действующему отношению `partner`; роли складываются.
          items:
            $ref: '#/components/schemas/PortalRole'
        modules:
          type: array
          description: Разделы кабинета для этих ролей по шаблону `x-role-modules`, в порядке меню. Пусто — разделы ещё не настроены.
          items:
            $ref: '#/components/schemas/ModuleCode'
        unread:
          type: integer
          minimum: 0
          description: Непрочитанные контактом ответы менеджера в чате кабинета (бейдж «Сообщения»); 0 — нет или модуля нет
      required: [contact, company, can_act, auth_method, roles, modules, unread, notifications_unread]
      x-role-modules:
        client: [catalog_requests, quotes, documents, contracts, invoices, acts, deliveries, messages, company, team, profile]
        partner: [my_products, catalog_requests, messages, profile]
      x-role-default-modules:
        client: [catalog_requests, quotes, documents, contracts, invoices, acts, deliveries, messages, company, team, profile]
        partner: [my_products, catalog_requests, messages, profile]

    TelegramStatus:
      type: object
      required: [linked, available]
      properties:
        linked:
          type: boolean
          description: Telegram привязан к контакту (по проекции CRM) — уведомления приходят в бот, Mini App входит без письма
        account:
          type: [string, 'null']
          maxLength: 255
          description: >-
            Какой аккаунт привязан — `@имя_пользователя` или имя профиля Telegram (из проекции CRM); `null` — Telegram не
            привязан или CRM не прислала имени. Защита от пересланной ссылки: человек видит, чей Telegram получает коды
            акцепта и входит в Mini App
        available:
          type: boolean
          description: >-
            Можно ли выпустить ссылку привязки: бот настроен и контакт сопоставлен с CRM. `false` — Cabinet не предлагает
            «Подключить» (плашку не показывает, в Профиле — подсказка написать менеджеру)
      additionalProperties: false

    TelegramLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
          description: '`https://t.me/<бот>?start=<токен>`; её же Cabinet кодирует в QR'
        expires_at:
          type: string
          format: date-time
          description: Когда ссылка перестанет действовать (15 минут от выпуска)
      additionalProperties: false

    PortalRole:
      type: string
      enum: [client, partner]

    ModuleCode:
      type: string
      description: |
        Раздел кабинета. `catalog_requests` — каталог и заявки (два пункта меню). Cabinet рисует только известные ему коды,
        незнакомый пропускает.
      enum: [catalog_requests, quotes, documents, contracts, invoices, acts, deliveries, company, team, profile, my_products, messages]

    NotificationKind:
      type: string
      description: |
        Вид уведомления (событие для контрагента): `quote_sent` — КП ждёт решения, `invoice_issued` — выставлен счёт,
        `payment_overdue` — срок оплаты счёта прошёл, `act_issued` — акт ждёт приёмки, `delivery_status_changed` — статус
        поставки, `delivery_eta_changed` — сдвиг срока поставки, `manager_replied` — ответ менеджера в чате кабинета,
        `partner_card_returned` — карточка партнёра возвращена на доработку, `partner_card_published` — опубликована.
        Незнакомый вид Cabinet показывает общим текстом.
      enum:
        - quote_sent
        - invoice_issued
        - payment_overdue
        - act_issued
        - delivery_status_changed
        - delivery_eta_changed
        - manager_replied
        - partner_card_returned
        - partner_card_published

    NotificationGroup:
      type: string
      description: Группа событий — основа настройки «группа × канал» в профиле контакта (J3)
      enum: [documents, money, deliveries, messages, partner_products]

    NotificationObjectType:
      type: string
      enum: [quote, invoice, act, delivery, chat, partner_product]

    NotificationAction:
      type: string
      description: Что произошло с объектом или чего ждут от контакта
      enum: [awaiting_decision, issued, overdue, awaiting_acceptance, status_changed, eta_changed, replied, returned, published]

    NotificationObject:
      type: object
      description: |
        Объект уведомления — тип, id в ERP и номер для человека (`null` — номера нет, например у чата). У поставки `id` —
        id сделки (поставка одна на сделку и открывается в кабинете внутри проекта; тот же id в `start_param=delivery_<id>`).
      required: [type, id, number]
      properties:
        type:
          $ref: '#/components/schemas/NotificationObjectType'
        id:
          type: integer
          format: int64
        number:
          type: [string, 'null']
      additionalProperties: false

    PortalNotification:
      type: object
      required: [id, kind, group, object, action, text_key, params, link, created_at, read_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/NotificationKind'
        group:
          $ref: '#/components/schemas/NotificationGroup'
        object:
          $ref: '#/components/schemas/NotificationObject'
        action:
          $ref: '#/components/schemas/NotificationAction'
        text_key:
          type: string
          description: Ключ текста в словарях Cabinet (`notifications.text.<text_key>`); текст на языке контакта рендерит Cabinet
        params:
          type: object
          description: Параметры текста (номер, сумма, дата, статус) — строки
          additionalProperties:
            type: string
        link:
          type: string
          pattern: '^/'
          description: Адрес объекта в кабинете (путь от корня Cabinet, например `/quotes/42`)
        created_at:
          type: string
          format: date-time
        read_at:
          type: [string, 'null']
          format: date-time
          description: Когда контакт прочитал; `null` — не прочитано
      additionalProperties: false

    NotificationPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalNotification'
        has_more:
          type: boolean
          description: Есть более ранние уведомления — следующая страница с `before_id` = `id` последнего элемента
      additionalProperties: false

    NotificationReadMark:
      type: object
      description: 'Ровно одно из двух — `ids` или `all: true`'
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            format: int64
            minimum: 1
        all:
          type: boolean
      additionalProperties: false

    NotificationUnread:
      type: object
      required: [unread]
      properties:
        unread:
          type: integer
          minimum: 0
      additionalProperties: false

    RequestStatus:
      type: string
      enum: [new, in_progress, quoted, closed]

    RequestLineIn:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
        quantity:
          type: [string, 'null']
          description: Количество как десятичная строка, если известно
        unit:
          type: [string, 'null']
      additionalProperties: false

    AttachmentRef:
      type: object
      description: Файл, загруженный через `POST /uploads` (`upload_id` из ответа). Лишних полей нет — размер ERP знает сам
      required: [upload_id, name]
      properties:
        upload_id:
          type: string
        name:
          type: string
      additionalProperties: false

    ClientRequestCreate:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 5000
        lines:
          type: array
          description: Нет поля или пустой список — запрос словами, без строк (Q-FIX23-4)
          items:
            $ref: '#/components/schemas/RequestLineIn'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRef'
      additionalProperties: false

    ClientRequest:
      type: object
      required: [id, number, status, summary, created_at]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        summary:
          type: string
        source:
          type: string
          enum: [crm, cabinet, erp]
        deal:
          description: Сделка, в которую вырос запрос (Q-16); `null`, пока запрос не стал сделкой
          oneOf:
            - $ref: '#/components/schemas/DealRef'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RequestLineIn'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRef'

    QuoteStatus:
      type: string
      enum: [sent, viewed, accepted, rejected, expired]

    QuoteListItem:
      type: object
      required: [id, number, version, status, total, sent_at, deal]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        number:
          type: string
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/QuoteStatus'
        total:
          $ref: '#/components/schemas/Money'
        valid_until:
          type: [string, 'null']
          format: date
        sent_at:
          type: string
          format: date-time

    QuoteLine:
      type: object
      description: Строка КП для клиента — цена продажи без себестоимости и наценки; `unit_price` и `total` без НДС (Q-FIX21-2)
      required: [line_no, kind, title]
      properties:
        line_no:
          type: integer
          minimum: 1
        kind:
          type: string
          enum: [item, section, note, stage]
        title:
          type: string
        description:
          type: string
        quantity:
          type: [string, 'null']
        unit:
          type: [string, 'null']
        unit_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        total:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        promised_date:
          type: [string, 'null']
          format: date

    Quote:
      allOf:
        - $ref: '#/components/schemas/QuoteListItem'
        - type: object
          required: [lines, public_url, subtotal, vat, comments]
          properties:
            subtotal:
              description: Итого без НДС — сумма `total` строк (Q-FIX21-2)
              $ref: '#/components/schemas/Money'
            vat:
              description: НДС; `subtotal + vat = total`, как в PDF КП
              $ref: '#/components/schemas/Money'
            lines:
              type: array
              items:
                $ref: '#/components/schemas/QuoteLine'
            public_url:
              type: string
              format: uri
            pdf_document_id:
              type: [integer, 'null']
              format: int64
            rejected_reason:
              type: [string, 'null']
            comments:
              type: array
              description: Комментарии к КП, старые первыми (`POST /quotes/{id}/comments`)
              items:
                $ref: '#/components/schemas/QuoteComment'

    QuoteCommentCreate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false

    QuoteComment:
      type: object
      required: [id, author, text, created_at]
      properties:
        id:
          type: integer
          format: int64
        author:
          type: string
          enum: [client, manager]
          description: Кто написал — сотрудник компании клиента или менеджер продавца
        author_name:
          type: [string, 'null']
          description: Имя автора; `null`, если его нет в карточке
        text:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    ContractStatus:
      type: string
      enum: [sent, signed_by_client, signed_by_company, signed, cancelled]

    Contract:
      type: object
      required: [id, number, status, deal]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        number:
          type: string
        status:
          $ref: '#/components/schemas/ContractStatus'
        signed_by_client_at:
          type: [string, 'null']
          format: date-time
        signed_by_company_at:
          type: [string, 'null']
          format: date-time
        document_id:
          type: [integer, 'null']
          format: int64

    InvoiceStatus:
      type: string
      enum: [issued, partially_paid, paid, overdue, cancelled]

    Invoice:
      type: object
      required: [id, number, status, total, paid, due_date, deal, proofs]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        number:
          type: string
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        total:
          $ref: '#/components/schemas/Money'
        paid:
          $ref: '#/components/schemas/Money'
        due_date:
          type: string
          format: date
        document_id:
          type: [integer, 'null']
          format: int64
        proofs:
          type: array
          description: Платёжки по счёту, старые первыми — из кабинета и те, что приложил менеджер
          items:
            $ref: '#/components/schemas/PaymentProof'

    PaymentProofStatus:
      type: string
      description: >-
        `pending` — менеджер ещё не сверил платёжку с выпиской; `confirmed` — оплата по ней подтверждена; `rejected` —
        отклонена с причиной `reject_reason` (ERP пока не отклоняет платёжки — BACKLOG B-D24-7)
      enum: [pending, confirmed, rejected]

    PaymentProofCreate:
      type: object
      required: [upload_id]
      properties:
        upload_id:
          type: string
          description: Файл платёжного поручения из `POST /uploads` (PDF или изображение, ≤ 10 МБ)
        paid_on:
          type: [string, 'null']
          format: date
          description: Дата платежа по словам клиента (не позже сегодняшней)
        amount:
          description: Сумма платежа по словам клиента в валюте счёта, больше нуля
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        comment:
          type: [string, 'null']
          maxLength: 500
      additionalProperties: false

    PaymentProof:
      type: object
      required: [id, status, source, file_name, submitted_at]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/PaymentProofStatus'
        source:
          type: string
          enum: [cabinet, bot, email, manager]
          description: Откуда платёжка — кабинет клиента, бот, почта или её приложил менеджер
        file_name:
          type: string
        submitted_at:
          type: string
          format: date-time
        paid_on:
          type: [string, 'null']
          format: date
          description: Дата платежа, которую указал клиент; не проверена
        amount:
          description: Сумма, которую указал клиент; не проверена — сумму подтверждает менеджер по выписке
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        comment:
          type: [string, 'null']
          description: Комментарий клиента (только у платёжек из кабинета)
        confirmed_at:
          type: [string, 'null']
          format: date-time
        reject_reason:
          type: [string, 'null']
      additionalProperties: false

    ActStatus:
      type: string
      enum: [issued, accepted, returned]

    Act:
      type: object
      required: [id, number, status, deal, issued_at]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        number:
          type: string
        status:
          $ref: '#/components/schemas/ActStatus'
        issued_at:
          type: string
          format: date-time
        returned_reason:
          type: [string, 'null']
        document_id:
          type: [integer, 'null']
          format: int64
          description: Выпущенный акт (PDF ERP)
        scan_document_id:
          type: [integer, 'null']
          format: int64
          description: Скан подписанного клиентом экземпляра, если загружен при приёмке

    DeliveryStatus:
      type: string
      description: '`accepted` и `disputed` ставит клиент (`/deliveries/{id}/accept|dispute`); остальное — ERP (M4 — со склада)'
      enum: [assembling, in_transit, ready_to_ship, shipped, delivered, accepted, disputed]

    DeliveryLine:
      type: object
      description: Строка поставки = строка подтверждённого заказа клиента; `id` — её идентификатор для приёмки
      required: [id, deal, line_no, title, status]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        line_no:
          type: integer
          minimum: 1
        title:
          type: string
        quantity:
          type: [string, 'null']
        unit:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        eta:
          type: [string, 'null']
          format: date
        tracking:
          type: [string, 'null']
        shipped_at:
          type: [string, 'null']
          format: date-time
        accepted_at:
          type: [string, 'null']
          format: date-time
          description: Когда клиент принял или оспорил строку
        remark:
          type: [string, 'null']
          description: Замечание клиента при `disputed`

    DocumentKind:
      type: string
      enum: [quote, contract, invoice, act, specification, waybill, receipt, other]

    Document:
      type: object
      required: [id, kind, number, date, title]
      properties:
        id:
          type: integer
          format: int64
        deal:
          oneOf:
            - $ref: '#/components/schemas/DealRef'
            - type: 'null'
        kind:
          $ref: '#/components/schemas/DocumentKind'
        number:
          type: string
        date:
          type: string
          format: date
        title:
          type: string
        file_name:
          type: string
        size_bytes:
          type: integer
          minimum: 0

    Availability:
      type: string
      enum: [in_stock, on_order, expected]

    CatalogItem:
      type: object
      required: [id, kind, name, unit, price, availability]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [goods, service]
        name:
          type: string
        description:
          type: string
        unit:
          type: string
        category:
          type: [string, 'null']
          description: Название категории; справочник с id — `GET /catalog/categories` (Q-15)
        category_id:
          type: [integer, 'null']
          format: int64
          description: Id категории для фильтра `GET /catalog?category_id=`
        price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: '`null` — «цена по запросу»'
        availability:
          $ref: '#/components/schemas/Availability'
        lead_time_days:
          type: [integer, 'null']
          minimum: 0
        images:
          type: array
          description: Ссылки на фото; главное фото — первым (CAT-CARD-2)
          items:
            type: string
            format: uri
        attributes:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name:
                type: string
              value:
                type: string
            additionalProperties: false
        manufacturer:
          oneOf:
            - $ref: '#/components/schemas/CatalogManufacturer'
            - type: 'null'
          description: Изготовитель (бренд) карточки; `null` — не указан (CAT-CARD-2)
        manufacturer_part_number:
          type: [string, 'null']
          description: Артикул изготовителя (MPN); `null` — не указан. Артикул продавца или поставщика сюда не попадает
        country_of_origin:
          type: [string, 'null']
          description: Название страны происхождения — своя у карточки, иначе страна изготовителя; `null` — нигде не указана
        warranty:
          oneOf:
            - $ref: '#/components/schemas/CatalogWarranty'
            - type: 'null'
          description: Гарантия — своя у карточки, иначе срок по умолчанию у компании; `null`, если нигде не задана или равна нулю
        documents:
          type: array
          description: |
            Только в карточке `GET /catalog/{id}`; в списке `GET /catalog`, в `erp-integration` и MCP документов нет. Только
            документы, отмеченные «видно клиенту», и только действующие (срок «действует до» не прошёл; пусто — бессрочно).
            Файл — `GET /catalog/{id}/documents/{doc_id}/file`.
          items:
            $ref: '#/components/schemas/CatalogItemDocument'

    CatalogManufacturer:
      type: object
      required: [name, country]
      properties:
        name:
          type: string
        country:
          type: [string, 'null']
          description: Название страны изготовителя
      additionalProperties: false

    CatalogWarranty:
      type: object
      required: [months, terms]
      properties:
        months:
          type: integer
          minimum: 1
        terms:
          type: string
          description: Условия гарантии; пустая строка — не заданы
      additionalProperties: false

    CatalogItemDocument:
      type: object
      required: [id, kind_name, title, number, issued_by, issued_at, valid_until]
      properties:
        id:
          type: integer
          format: int64
        kind_name:
          type: string
          description: Название вида документа (справочник, ведёт администратор)
        title:
          type: string
        number:
          type: string
          description: Пустая строка — номера нет
        issued_by:
          type: string
          description: Кем выдан; пустая строка — не указано
        issued_at:
          type: [string, 'null']
          format: date
        valid_until:
          type: [string, 'null']
          format: date
          description: Действует до; `null` — бессрочно
      additionalProperties: false

    CatalogPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
      additionalProperties: false

    Company:
      type: object
      required: [id, name, language]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        inn:
          type: [string, 'null']
        legal_address:
          type: [string, 'null']
        bank_details:
          type: [string, 'null']
        language:
          $ref: '#/components/schemas/Language'

    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 300
        inn:
          type: string
          maxLength: 20
        legal_address:
          type: string
          maxLength: 500
        bank_details:
          type: string
          maxLength: 1000
        language:
          $ref: '#/components/schemas/Language'
      additionalProperties: false

    TeamMember:
      type: object
      required: [id, name, language, preferred_channel, can_act, is_primary]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        has_telegram:
          type: boolean
        language:
          $ref: '#/components/schemas/Language'
        preferred_channel:
          $ref: '#/components/schemas/PreferredChannel'
        can_act:
          type: boolean
        is_primary:
          type: boolean
        invited_at:
          type: [string, 'null']
          format: date-time
        last_login_at:
          type: [string, 'null']
          format: date-time

    TeamInvite:
      type: object
      required: [name, language, channels]
      properties:
        name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 32
        language:
          $ref: '#/components/schemas/Language'
        can_act:
          type: boolean
          default: false
        channels:
          type: array
          minItems: 1
          items:
            type: string
            enum: [email, telegram]
      additionalProperties: false

    CatalogCategory:
      type: object
      required: [id, name, count]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        count:
          type: integer
          minimum: 0

    PortalUploadResponse:
      type: object
      required: [upload_id, name]
      properties:
        upload_id:
          type: string
        name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0

    MessageContextKind:
      type: string
      description: Вид документа метки сообщения
      enum: [deal, quote, invoice, act]

    MessageContextRef:
      type: object
      description: Метка документа в новом сообщении — вид и id; номер подставляет ERP
      required: [kind, id]
      properties:
        kind:
          $ref: '#/components/schemas/MessageContextKind'
        id:
          type: integer
          format: int64
      additionalProperties: false

    MessageContext:
      type: object
      description: Метка документа у сообщения — вид, id и номер («КП KP-2026-0042»)
      required: [kind, id, number]
      properties:
        kind:
          $ref: '#/components/schemas/MessageContextKind'
        id:
          type: integer
          format: int64
        number:
          type: string
      additionalProperties: false

    PortalMessageCreate:
      type: object
      required: [text, client_message_id]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: Текст как есть; Cabinet показывает его текстом, не HTML
        client_message_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
          description: Ключ повтора, выданный Cabinet при первой попытке; повтор отправки — тот же ключ
        context:
          oneOf:
            - $ref: '#/components/schemas/MessageContextRef'
            - type: 'null'
      additionalProperties: false

    PortalMessage:
      type: object
      required: [id, direction, author_name, mine, text, context, created_at, client_message_id, erased]
      properties:
        id:
          type: integer
          format: int64
        direction:
          type: string
          enum: [client, manager]
          description: '`client` — написал контакт компании, `manager` — ответ менеджера'
        author_name:
          type: [string, 'null']
          description: Имя контакта или менеджера; `null` — имени нет
        mine:
          type: boolean
          description: Сообщение написал контакт этой сессии
        text:
          type: string
        context:
          oneOf:
            - $ref: '#/components/schemas/MessageContext'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        client_message_id:
          type: [string, 'null']
          description: Ключ повтора сообщения контакта (у ответа менеджера — `null`)
        erased:
          type: boolean
          description: >-
            Автор стёр свои персональные данные: текст удалён (`text` пуст), автора нет (`author_name` — `null`), Cabinet
            показывает «Удалённый пользователь · сообщение удалено». Остальная лента компании не меняется
      additionalProperties: false

    PortalMessagePage:
      type: object
      required: [items, has_more, erased_ids]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalMessage'
        has_more:
          type: boolean
          description: С `after_id` — после последнего сообщения страницы есть ещё; без него — есть более ранние
        erased_ids:
          type: array
          description: >-
            С `after_id` — сообщения ленты не новее `after_id`, стёртые по запросу автора (CHAT-1b): опрос приносит только
            новые сообщения, по этому списку Cabinet заменяет уже показанные на «Удалённый пользователь» без перезагрузки.
            Без `after_id` — пусто (стёртые и так приходят с `erased: true`)
          items:
            type: integer
            format: int64
      additionalProperties: false

    PortalMessageReadMark:
      type: object
      required: [last_id]
      properties:
        last_id:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false

    PortalMessageUnread:
      type: object
      required: [unread]
      properties:
        unread:
          type: integer
          minimum: 0
      additionalProperties: false
