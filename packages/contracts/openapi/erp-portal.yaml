openapi: 3.1.0
info:
  title: RailTech Platform ERP — Portal API (Cabinet → ERP)
  version: 0.6.0
  summary: Пространство `/api/portal/v1/` — вызывает Cabinet SPA от имени клиента.
  description: |
    Контракт по `docs/architecture/CONTRACTS.md` §4 и ADR-0004 (Cabinet без бэкенда). Версия 0 (M0-INF-02):
    ERP реализует приложение `portal` (M2-ERP-01…03), Cabinet генерирует типы из этого файла (M2-CAB-01).

    Все ответы отфильтрованы по компании сессии: чужая компания → 404 (негативный тест на каждый эндпоинт).
    Сессия портала — cookie `HttpOnly`, отдельная от сессий сотрудников. Сотрудники сюда не входят
    (инвариант ORCHESTRATOR §3.1). Ошибки — `{"detail": "<CODE>"}`.

    Защита сессии в cookie от CSRF (FIX-15): каждый `POST` и `PATCH` обязан нести
    заголовок `Idempotency-Key` (без него — 400 `IDEMPOTENCY_KEY_REQUIRED`) и тело `application/json`
    (иное — 415 `UNSUPPORTED_MEDIA_TYPE`; исключения — `multipart/form-data` на `/uploads` и `/partner/price-list`). Повтор с тем же
    ключом и тем же методом/путём в пределах сессии возвращает прежний ответ (заголовок `Idempotent-Replay: true`);
    исключение — ответы с `Set-Cookie` (`/auth/*`): они не кэшируются, повтор исполняется заново.

    Коды ошибок `detail` — перечень `ErrorCode` (Q-17); незнакомый код Cabinet показывает по HTTP-статусу.
    Ссылка входа из письма ведёт на Cabinet `/auth/magic#token=<токен>`: токен во фрагменте не попадает в журналы
    серверов и прокси, Cabinet обменивает его через `POST /auth/magic` (FIX-20).

    0.3.0 (FIX-25): сняты устаревшие `deal_id` (везде `deal.id`) и `GET /auth/magic/{token}`; у КП `subtotal` и `vat`;
    `FILE_TOO_LARGE` — 422 на `/uploads`; `DELIVERY_FAILED` — 503 на `/team/invite`; `lines` в `POST /requests` необязателен.

    Лимиты частоты (429 `TOO_MANY_REQUESTS`, заголовок `Retry-After`): запросы сессии — 120 в минуту на сессию; вход без
    сессии (`/auth/telegram`, `/auth/magic-link`, `/auth/magic`, `/auth/code`) — 10 в минуту на IP; акцепт КП с кодом и запрос кода —
    10 в минуту на сессию; ссылка входа на один e-mail — не чаще 5 в час. Ставки задаются настройками ERP.

    Код входа (B-MAIL-1): письмо входа и приглашения несёт и ссылку, и 6-значный одноразовый код — клиент вводит код на
    экране «Мы отправили письмо» (`POST /auth/code`), если ссылка не открывается или письмо пришло на другое устройство.
    Ссылка и код — одна запись, живут 60 минут (приглашение — 24 часа), гасятся вместе; 5 неверных кодов подряд —
    429 `LOGIN_CODE_LOCKED` до нового запроса.

    0.4.0 (PART-1, ADR-0022): в кабинет входят клиенты и партнёры (изготовители, поставщики, принципалы — по отношению
    компании, которое заводит сотрудник). Ролей две и они складываются: `client` (тип компании CLIENT) и `partner`.
    `GET /me` отдаёт `roles` и `modules` — разделы кабинета: клиенту весь шаблон роли, партнёру те, что сотрудник включил
    на отношении (из шаблона роли `partner`, по умолчанию `my_products` и `catalog_requests`), и всегда `profile` (выход и язык;
    не выключается). Шаблоны — `Me.x-role-modules`
    и `Me.x-role-default-modules`; меню Cabinet строится из `modules`. Эндпоинт открыт сессии, у которой есть его модуль:
    `/requests*`, `/catalog*`, `/uploads` — `catalog_requests`, `/quotes*` — `quotes`, `/contracts*` — `contracts`,
    `/invoices*` — `invoices`, `/acts*` — `acts`, `/deliveries*` — `deliveries`, `/documents*` — `documents`, `/company` —
    `company`, `/team*` — `team`; без модуля — 403 `MODULE_REQUIRED`. Включение и выключение модуля действует на следующем
    запросе, без перевхода. Приостановленное отношение закрывает вход, живая сессия партнёра гаснет на следующем запросе (401).
    0.5.0 (PART-2, ADR-0022 п. 4): раздел «Мои товары» партнёра — модуль `my_products`, пути `/partner/*`. Партнёр видит
    только свои карточки (где он источник данных или у него есть цена) и только свою цену по ним; чужие цены, другие
    поставщики и наши цены продажи и закупки не отдаются. Карточкой владеем мы: статусы `draft` → `review` → `published` |
    `returned` (с причиной) → `review`; публикует сотрудник, из портала публикации нет. Цена, привязавшаяся к чужой неопубликованной карточке, показана как `matched`: партнёру видно только присланное им самим. Правка опубликованной карточки —
    предложение по полям (`has_pending_change`), клиент видит прежнюю версию. Прайс загружается по шаблону (`GET
    /partner/price-template`, `POST /partner/price-list` — `multipart/form-data`; `dry_run`
    — предпросмотр без записи), результат — по `task_id`. Цены не модерируются: «подтвердить актуальность»
    (`POST /partner/offers/confirm`), признак `freshness` (`fresh`, `expiring`, `stale`, `expired`). Изменяющие операции
    требуют `can_act`. Новые коды `ErrorCode`: `XLSX_REQUIRED`, `VALID_DATE_INVALID`, `OFFER_VALIDITY_RANGE_INVALID`,
    `PRODUCT_NOT_SUBMITTABLE`, `OFFER_EXPIRED`, `IMPORT_FAILED`.

    0.6.0 (CHAT-1, ADR-0023): чат кабинета — одна лента на компанию (видят все её контакты), канал `cabinet` в очереди
    «Сообщения» Платформы. `GET /messages`, `POST /messages`, `POST /messages/read` — модуль `messages`: он в шаблонах обеих
    ролей и не выключается (как `profile`); отправка — с `can_act`. `GET /me` несёт `unread` — непрочитанные контактом ответы
    менеджера. Компания и автор — только из сессии; метка документа (`context`) проверяется на принадлежность компании
    сессии — чужая сделка, КП, счёт или акт отвечают 404 без утечки.
servers:
  - url: https://erp.railtech.uz/api/portal/v1
    description: prod
  - url: http://erp.localhost/api/portal/v1
    description: стенд ансамбля (infra/compose)
security:
  - portalSession: []
tags:
  - name: auth
    description: Вход по Telegram initData или magic-link; регистрации «с улицы» нет
  - name: me
  - name: requests
  - name: quotes
  - name: contracts
  - name: invoices
  - name: acts
  - name: deliveries
  - name: documents
  - name: catalog
    description: Опубликованный слой с ценой и наличием — только здесь (решение владельца 2026-10-13)
  - name: company
  - name: partner
    description: Раздел «Мои товары» партнёра — модуль `my_products` (ADR-0022, PART-2)
  - name: messages
    description: Чат кабинета с менеджером (ADR-0023) — лента компании, обновление опросом
  - name: notifications
    description: Колокольчик кабинета — лента уведомлений контакта (ADR-0023 п. 2, NOTIFY-2)

paths:
  /auth/telegram:
    post:
      tags: [auth]
      operationId: authTelegram
      summary: Вход из Telegram Mini App
      description: ERP проверяет подпись `initData` токеном клиентского бота CRM (срок ≤ 5 мин), ищет контакт по `telegram_user_id`, выдаёт сессию портала.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data:
                  type: string
                  description: Строка `window.Telegram.WebApp.initData` как есть
              additionalProperties: false
      responses:
        '200':
          description: Сессия выдана (cookie `Set-Cookie`)
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Подпись неверна, срок истёк или контакт не найден (`INVALID_INIT_DATA`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/CompanyArchived'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/magic-link:
    post:
      tags: [auth]
      operationId: requestMagicLink
      summary: Запросить ссылку для входа по e-mail
      description: >-
        Письмо со ссылкой и 6-значным кодом входа на 60 минут, одноразовыми (B-MAIL-1). Новый запрос гасит прежние ссылку и
        код входа (приглашение остаётся). Ответ всегда 200, чтобы не раскрывать наличие адреса.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
              additionalProperties: false
      responses:
        '200':
          description: Принято
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/magic:
    post:
      tags: [auth]
      operationId: exchangeMagicLinkToken
      summary: Обмен токена из ссылки входа на сессию
      description: |
        Cabinet берёт токен из фрагмента ссылки `/auth/magic#token=…` и шлёт его в теле: токен не появляется ни в пути,
        ни в журналах. Токен одноразовый и живёт 60 минут (ссылка-приглашение — 24 часа, B-MAIL-1). Заменяет `GET /auth/magic/{token}`.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 16
                  maxLength: 512
              additionalProperties: false
      responses:
        '200':
          description: Сессия выдана (cookie `Set-Cookie`)
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '403':
          $ref: '#/components/responses/CompanyArchived'
        '410':
          description: Токен просрочен, уже использован или неизвестен (`MAGIC_LINK_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/code:
    post:
      tags: [auth]
      operationId: exchangeLoginCode
      summary: Вход по коду из письма
      description: |
        B-MAIL-1. Клиент вводит адрес и 6-значный код из письма входа или приглашения. Код одноразовый, живёт столько же,
        сколько ссылка того же письма (60 минут, приглашение — 24 часа), в базе — только хеш, сравнение за постоянное
        время. Неверный, просроченный, использованный код и неизвестный адрес дают один ответ — 422 `LOGIN_CODE_INVALID`
        (наличие адреса не раскрывается). Пятая неверная попытка подряд и дальше — 429 `LOGIN_CODE_LOCKED` до нового
        запроса `POST /auth/magic-link`. Верный код гасит и ссылку того же письма.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: '^\d{6}$'
              additionalProperties: false
      responses:
        '200':
          description: Сессия выдана (cookie `Set-Cookie`)
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '403':
          $ref: '#/components/responses/CompanyArchived'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            `LOGIN_CODE_INVALID` — код неверный, устарел или уже использован (и для неизвестного адреса);
            `VALIDATION_ERROR` — тело не по схеме
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: >-
            `LOGIN_CODE_LOCKED` — 5 неверных кодов подряд, нужен новый код; `TOO_MANY_REQUESTS` — лимит частоты по IP
            (заголовок `Retry-After`)
          headers:
            Retry-After:
              description: Через сколько секунд можно повторить (только у `TOO_MANY_REQUESTS`)
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Завершить сессию портала
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Сессия завершена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Сессия, контакт, компания, права
      responses:
        '200':
          description: Текущий контакт и его компания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me/telegram:
    get:
      tags: [me]
      operationId: getTelegramStatus
      summary: Привязан ли Telegram контакта (уведомления и вход в Mini App)
      description: |
        Статус — по проекции контакта в ERP (`telegram_user_id`), поле принадлежит CRM (ADR-0015, ADR-0023 п. 3): после
        привязки ботом или отключения статус меняется, когда CRM опубликует `crm.contact.updated` (обычно за секунды).
        Cabinet опрашивает этот путь, пока открыт экран с выпущенной ссылкой, до привязки или истечения её срока.
      responses:
        '200':
          description: Статус привязки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [me]
      operationId: unlinkTelegram
      summary: Отключить Telegram контакта
      description: |
        Привязка принадлежит CRM, поэтому ERP публикует запрос `uz.railtech.erp.contact.telegram_unlink_requested.v1`, а
        CRM отвязывает Telegram и публикует `crm.contact.updated` без `telegram_user_id`. Ответ 202 — запрос принят;
        `linked` станет `false`, когда придёт проекция (Cabinet опрашивает `GET /me/telegram`). Telegram не привязан — 202
        без события (повтор безопасен). Право «действовать» не нужно: это настройка самого контакта.
      responses:
        '202':
          description: Запрос отключения принят (или Telegram уже не привязан)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Контакт не сопоставлен с контактом CRM (`CONTACT_NOT_IN_CRM`) — отключить может менеджер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me/telegram/test:
    post:
      tags: [me]
      operationId: sendTelegramTest
      summary: Прислать проверочное сообщение в привязанный Telegram
      description: |
        Контакт проверяет, что уведомления доходят (NOTIFY-1). ERP в Telegram не пишет: публикует запрос
        `uz.railtech.erp.contact.telegram_test_requested.v1`, бот CRM присылает короткое сообщение на языке контакта. Ответ
        202 — запрос принят (итог доставки не возвращается). Не чаще раза в минуту на контакт: иначе 429 `TOO_MANY_REQUESTS`
        с `Retry-After`. Telegram не привязан — 409 `TELEGRAM_NOT_LINKED`. Право «действовать» не нужно.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Запрос проверочного сообщения принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramStatus'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Telegram не привязан (`TELEGRAM_NOT_LINKED`) — сначала «Подключить»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Контакт не сопоставлен с контактом CRM (`CONTACT_NOT_IN_CRM`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me/telegram-link:
    post:
      tags: [me]
      operationId: createTelegramLink
      summary: Выпустить одноразовую ссылку привязки Telegram (бот, параметр start)
      description: |
        ADR-0023 п. 3. Ссылка `https://t.me/<бот>?start=<токен>` открывает бот CRM; бот проверяет подпись и срок,
        гасит токен (одноразовый) и привязывает Telegram этого человека к контакту сессии без подтверждения менеджера.
        Токен — `tg_` + base64url (без `=`) от 21 байта данных и 15 байт усечённого HMAC-SHA256: версия, язык контакта,
        `crm_contact_id`, срок (15 минут), случайный nonce; ключ — производный от секрета пары шины `erp → crm` с отдельной
        меткой (`rt-telegram-link/v1`), не ключ почты. 51 символ из алфавита `[A-Za-z0-9_-]` — укладывается в лимит
        параметра `start` Telegram (64). QR рисует Cabinet из `url` сам, без внешних сервисов. Право «действовать» не
        нужно. Повтор с тем же `Idempotency-Key` возвращает ту же ссылку; новый ключ — новый токен (прежний действует
        до своего срока).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Ссылка выпущена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLink'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            Контакт ещё не сопоставлен с контактом CRM (`CONTACT_NOT_IN_CRM`): привязать Telegram сейчас нельзя, поможет
            менеджер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Telegram уже привязан (`TELEGRAM_ALREADY_LINKED`): сначала «Отвязать» — иначе прежний аккаунт остался бы
            подтверждённым Telegram клиента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: >-
            Бот не настроен или нет сопряжения с CRM (`TELEGRAM_LINK_UNAVAILABLE`): подключить Telegram сейчас нельзя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Лента уведомлений контакта (колокольчик)
      description: |
        Уведомления контакта сессии по убыванию `id` (новые сверху): без `before_id` — последние `limit`, с ним — более
        ранние (кнопка «Показать ещё»). Строка ленты — на контакт: прочитанность у каждого контакта своя. В ленте только
        уведомления, чей объект открыт модулям сессии (счёт — `invoices`, акт — `acts`, КП — `quotes`, поставка —
        `deliveries`, ответ менеджера — `messages`, карточка партнёра — `my_products`); выключили модуль — его уведомления
        пропадают из ленты и из `Me.notifications_unread`. Текст рендерит Cabinet на языке контакта по `text_key` и `params`.
        Эндпоинт открыт любой сессии кабинета (модуль `profile`). Компания и контакт — только из сессии.
      parameters:
        - name: before_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Страница ленты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

