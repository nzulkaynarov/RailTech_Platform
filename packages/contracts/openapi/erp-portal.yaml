      operationId: submitPartnerProducts
      summary: Отправить карточки на проверку
      description: |
        Черновики и возвращённые карточки компании → `review`; сотрудникам уходит уведомление. Ответ 200 всегда
        построчный: по каждому id либо отправлено, либо ошибка (`NOT_FOUND` — чужая или несуществующая карточка,
        `PRODUCT_NOT_SUBMITTABLE` — своя, но уже на проверке или опубликована).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerSubmitRequest'
      responses:
        '200':
          description: Итог по каждой карточке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerSubmitResult'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /partner/offers/confirm:
    post:
      tags: [partner]
      operationId: confirmPartnerOffers
      summary: Подтвердить актуальность цен
      description: |
        Без модерации. `ids` — id карточек, цены компании по которым подтверждаются, или `all: true` — все цены компании.
        Цена с истёкшим сроком не подтверждается (`OFFER_EXPIRED` — нужен новый прайс); карточка без цены компании — `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerConfirmRequest'
      responses:
        '200':
          description: Сколько цен подтверждено и что не подтверждено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerConfirmResult'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /partner/price-template:
    get:
      tags: [partner]
      operationId: getPartnerPriceTemplate
      summary: Шаблон прайса (.xlsx) — тот же, что у сотрудника
      responses:
        '200':
          description: Файл шаблона со справочниками допустимых значений
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /partner/price-list:
    post:
      tags: [partner]
      operationId: uploadPartnerPriceList
      summary: Загрузить прайс по шаблону
      description: |
        `multipart/form-data` (как `/uploads`): файл `.xlsx` до 20 МБ. Поставщик — компания сессии, выбрать другого нельзя.
        `dry_run=true` — предпросмотр: те же проверки и отчёт, ничего не записывается. Срок действия цен на весь файл —
        `valid_from` / `valid_until` (колонки «Действует с / до» строки главнее). Загруженные цены считаются подтверждёнными.
        Новые карточки — черновики; карточки, которыми владеем мы или которые опубликованы, прайс не переписывает —
        расхождения уходят в предложения по полям. Обработка асинхронная: 202 и `task_id`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                dry_run:
                  type: boolean
                  default: false
                valid_from:
                  type: string
                  format: date
                valid_until:
                  type: string
                  format: date
      responses:
        '202':
          description: Загрузка принята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListAccepted'
        '400':
          description: Нет заголовка `Idempotency-Key`, файл не передан (`FILE_REQUIRED`) или это не `.xlsx` (`XLSX_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Файл больше 20 МБ (`FILE_TOO_LARGE`), дата не `ГГГГ-ММ-ДД` (`VALID_DATE_INVALID`) или «до» раньше «с» (`OFFER_VALIDITY_RANGE_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Очередь обработки недоступна (`IMPORT_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /partner/price-list/{task_id}:
