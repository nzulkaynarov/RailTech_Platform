openapi: 3.1.0
info:
  title: RailTech Platform ERP — Portal API (Cabinet → ERP)
  version: 0.3.0
  summary: Пространство `/api/portal/v1/` — вызывает Cabinet SPA от имени клиента.
  description: |
    Контракт по `docs/architecture/CONTRACTS.md` §4 и ADR-0004 (Cabinet без бэкенда). Версия 0 (M0-INF-02):
    ERP реализует приложение `portal` (M2-ERP-01…03), Cabinet генерирует типы из этого файла (M2-CAB-01).

    Все ответы отфильтрованы по компании сессии: чужая компания → 404 (негативный тест на каждый эндпоинт).
    Сессия портала — cookie `HttpOnly`, отдельная от сессий сотрудников. Сотрудники сюда не входят
    (инвариант ORCHESTRATOR §3.1). Ошибки — `{"detail": "<CODE>"}`.

    Защита сессии в cookie от CSRF (FIX-15): каждый `POST` и `PATCH` обязан нести
    заголовок `Idempotency-Key` (без него — 400 `IDEMPOTENCY_KEY_REQUIRED`) и тело `application/json`
    (иное — 415 `UNSUPPORTED_MEDIA_TYPE`; единственное исключение — `multipart/form-data` на `/uploads`). Повтор с тем же
    ключом и тем же методом/путём в пределах сессии возвращает прежний ответ (заголовок `Idempotent-Replay: true`);
    исключение — ответы с `Set-Cookie` (`/auth/*`): они не кэшируются, повтор исполняется заново.

    Коды ошибок `detail` — перечень `ErrorCode` (Q-17); незнакомый код Cabinet показывает по HTTP-статусу.
    Ссылка входа из письма ведёт на Cabinet `/auth/magic#token=<токен>`: токен во фрагменте не попадает в журналы
    серверов и прокси, Cabinet обменивает его через `POST /auth/magic` (FIX-20).

    0.3.0 (FIX-25): сняты устаревшие `deal_id` (везде `deal.id`) и `GET /auth/magic/{token}`; у КП `subtotal` и `vat`;
    `FILE_TOO_LARGE` — 422 на `/uploads`; `DELIVERY_FAILED` — 503 на `/team/invite`; `lines` в `POST /requests` необязателен.

    Лимиты частоты (429 `TOO_MANY_REQUESTS`, заголовок `Retry-After`): запросы сессии — 120 в минуту на сессию; вход без
    сессии (`/auth/telegram`, `/auth/magic-link`, `/auth/magic`) — 10 в минуту на IP; акцепт КП с кодом и запрос кода —
    10 в минуту на сессию; ссылка входа на один e-mail — не чаще 5 в час. Ставки задаются настройками ERP.
servers:
  - url: https://erp.railtech.uz/api/portal/v1
    description: prod
  - url: http://erp.localhost/api/portal/v1
    description: стенд ансамбля (infra/compose)
security:
  - portalSession: []
tags:
  - name: auth
    description: Вход по Telegram initData или magic-link; регистрации «с улицы» нет
  - name: me
  - name: requests
  - name: quotes
  - name: contracts
  - name: invoices
  - name: acts
  - name: deliveries
  - name: documents
  - name: catalog
    description: Опубликованный слой с ценой и наличием — только здесь (решение владельца 2026-10-13)
  - name: company

paths:
  /auth/telegram:
    post:
      tags: [auth]
      operationId: authTelegram
      summary: Вход из Telegram Mini App
      description: ERP проверяет подпись `initData` токеном клиентского бота CRM (срок ≤ 5 мин), ищет контакт по `telegram_user_id`, выдаёт сессию портала.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data:
                  type: string
                  description: Строка `window.Telegram.WebApp.initData` как есть
              additionalProperties: false
      responses:
        '200':
          description: Сессия выдана (cookie `Set-Cookie`)
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Подпись неверна, срок истёк или контакт не найден (`INVALID_INIT_DATA`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/CompanyArchived'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/magic-link:
    post:
      tags: [auth]
      operationId: requestMagicLink
      summary: Запросить ссылку для входа по e-mail
      description: Письмо со ссылкой на 15 минут, одноразовой. Ответ всегда 200, чтобы не раскрывать наличие адреса.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
              additionalProperties: false
      responses:
        '200':
          description: Принято
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/magic:
    post:
      tags: [auth]
      operationId: exchangeMagicLinkToken
      summary: Обмен токена из ссылки входа на сессию
      description: |
        Cabinet берёт токен из фрагмента ссылки `/auth/magic#token=…` и шлёт его в теле: токен не появляется ни в пути,
        ни в журналах. Токен одноразовый и живёт 15 минут (ссылка-приглашение — 24 часа). Заменяет `GET /auth/magic/{token}`.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 16
                  maxLength: 512
              additionalProperties: false
      responses:
        '200':
          description: Сессия выдана (cookie `Set-Cookie`)
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '403':
          $ref: '#/components/responses/CompanyArchived'
        '410':
          description: Токен просрочен, уже использован или неизвестен (`MAGIC_LINK_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Завершить сессию портала
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Сессия завершена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Сессия, контакт, компания, права
      responses:
        '200':
          description: Текущий контакт и его компания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /requests:
    get:
      tags: [requests]
      operationId: listRequests
      summary: Мои запросы
      responses:
        '200':
          description: Запросы компании
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [requests]
      operationId: createRequest
      summary: Новый запрос
      description: Строки свободным текстом и вложения. Создаёт заявку в ERP минуя CRM; CRM получает событие `request.created(source=cabinet)`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequestCreate'
      responses:
        '201':
          description: Запрос принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /requests/{id}:
    get:
      tags: [requests]
      operationId: getRequest
      summary: Запрос клиента со строками (Q-16)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Запрос клиента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /quotes:
    get:
      tags: [quotes]
      operationId: listQuotes
      summary: Коммерческие предложения
      responses:
        '200':
          description: КП компании (все версии, отправленные клиенту)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /quotes/{id}:
    get:
      tags: [quotes]
      operationId: getQuote
      summary: КП со строками
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: КП
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /quotes/{id}/request-code:
    post:
      tags: [quotes]
      operationId: requestQuoteAcceptanceCode
      summary: Запросить код акцепта КП
      description: |
        Код акцепта (6 цифр, 15 минут, 5 попыток) ERP отправляет контакту сессии по его каналу — в Telegram через бота CRM
        или на e-mail; мастер-кода нет (FIX-02). Cabinet зовёт перед вводом кода на экране КП. Повторный запрос гасит
        прежний код. Требует права `can_act`; лимит — `portal_accept` (10 в минуту на сессию).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: Код отправлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptanceCodeSent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: КП не в статусе ожидания ответа (`QUOTE_FINALIZED`, `QUOTE_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: У контакта нет ни одного канала для кода (`CONTACT_CHANNEL_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /quotes/{id}/accept:
    post:
      tags: [quotes]
      operationId: acceptQuote
      summary: Принять КП по коду акцепта
      description: Код — из `POST /quotes/{id}/request-code`. Договор создаётся автоматически (BUSINESS §4, шаг 6). Требует права `can_act`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 12
              additionalProperties: false
      responses:
        '200':
          description: КП принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: КП уже принято/отклонено или срок истёк (`QUOTE_FINALIZED`, `QUOTE_EXPIRED`); код неверен или не запрошен (`QUOTE_CODE_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /quotes/{id}/reject:
    post:
      tags: [quotes]
      operationId: rejectQuote
      summary: Отклонить КП с причиной
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: КП отклонено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: КП уже в конечном статусе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /contracts:
    get:
      tags: [contracts]
      operationId: listContracts
      summary: Договоры
      responses:
        '200':
          description: Договоры компании
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /contracts/{id}/sign:
    post:
      tags: [contracts]
      operationId: signContract
      summary: Подписать договор со стороны клиента
      description: Простая подпись подтверждением (E-IMZO отложен до пилота, DECISIONS 2026-10-13).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Подписано клиентом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Договор уже подписан или отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /invoices:
    get:
      tags: [invoices]
      operationId: listInvoices
      summary: Счета
      responses:
        '200':
          description: Счета компании
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /acts:
    get:
      tags: [acts]
      operationId: listActs
      summary: Акты
      responses:
        '200':
          description: Акты компании
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Act'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /acts/{id}/accept:
    post:
      tags: [acts]
      operationId: acceptAct
      summary: Принять акт (при желании — со сканом подписанного экземпляра)
      description: |
        Тело необязательно. `upload_id` из `POST /uploads` привязывает скан к акту: ERP сохраняет его как подписанный
        экземпляр (`Act.signed_file`) и отдаёт в `GET /documents` видом `act` с `scan_document_id` в акте. Требует `can_act`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActAccept'
      responses:
        '200':
          description: Акт принят заказчиком
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Act'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Акт уже в конечном статусе (`ACT_FINALIZED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`upload_id` неизвестен или файл не PDF/изображение (`UPLOAD_NOT_FOUND`, `VALIDATION_ERROR`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /acts/{id}/return:
    post:
      tags: [acts]
      operationId: returnAct
      summary: Вернуть акт с причиной
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: Акт возвращён исполнителю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Act'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Акт уже в конечном статусе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /deliveries:
    get:
      tags: [deliveries]
      operationId: listDeliveries
      summary: Поставки по строкам (проекция клиента)
      responses:
        '200':
          description: Строки с статусом, ожидаемой датой и треком — без поставщика и цен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryLine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /deliveries/{id}/accept:
    post:
      tags: [deliveries]
      operationId: acceptDeliveryLine
      summary: Принять строку поставки (BUSINESS §9, шаг 9)
      description: Строка переходит в `accepted`; принять можно только `delivered`. Требует `can_act`. Событие `delivery.line_accepted` → CRM.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Строка принята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryLine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Строка не доставлена или уже принята/оспорена (`DELIVERY_LINE_NOT_ACCEPTABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /deliveries/{id}/dispute:
    post:
      tags: [deliveries]
      operationId: disputeDeliveryLine
      summary: Замечание по строке поставки
      description: Строка переходит в `disputed` с причиной; менеджер получает задачу, клиент — ответ через бота. Требует `can_act`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: Замечание принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryLine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Строка не доставлена или уже принята/оспорена (`DELIVERY_LINE_NOT_ACCEPTABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Причина пуста (`REASON_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Документы компании
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DocumentKind'
        - name: deal_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Документы без файлов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /documents/{id}/file:
    get:
      tags: [documents]
      operationId: getDocumentFile
      summary: Файл документа (поток, аудит выдачи)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Файл
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '202':
          description: PDF ещё рендерится (M2-ERP-03) — повторить через `Retry-After`
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /uploads:
    post:
      tags: [documents]
      operationId: uploadFile
      summary: Загрузка файлов клиентом (Q-14, multipart, <= 10MB)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Файл до 10 МБ
      responses:
        '201':
          description: Файл успешно загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUploadResponse'
        '400':
          description: Нет заголовка `Idempotency-Key` (`IDEMPOTENCY_KEY_REQUIRED`) или файл не передан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Файл больше 10 МБ (`FILE_TOO_LARGE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /catalog/categories:
    get:
      tags: [catalog]
      operationId: listCatalogCategories
      summary: Категории каталога с количеством опубликованных позиций (Q-15)
      responses:
        '200':
          description: Список опубликованных категорий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /catalog:
    get:
      tags: [catalog]
      operationId: listCatalog
      summary: Опубликованный каталог с ценой и наличием
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Страница каталога
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /catalog/{id}:
    get:
      tags: [catalog]
      operationId: getCatalogItem
      summary: Карточка опубликованного слоя
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Карточка без внутреннего слоя (поставщики, себестоимость, остатки по количеству)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /company:
    get:
      tags: [company]
      operationId: getCompany
      summary: Профиль компании клиента
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [company]
      operationId: updateCompany
      summary: Обновить профиль компании
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdate'
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /team:
    get:
      tags: [company]
      operationId: listTeam
      summary: Команда клиента (контакты компании)
      responses:
        '200':
          description: Контакты компании
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /team/invite:
    post:
      tags: [company]
      operationId: inviteTeamMember
      summary: Пригласить коллегу в кабинет
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInvite'
      responses:
        '201':
          description: Приглашение отправлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: >-
            Письмо не ушло (`DELIVERY_FAILED`): коллега в команду не добавлен, повторить можно сразу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    portalSession:
      type: apiKey
      in: cookie
      name: portal_session
      description: >-
        Сессия портала (HttpOnly; SameSite=Lax, а для Telegram Mini App — SameSite=None; Secure, настройка ERP
        `PORTAL_COOKIE_SAMESITE`), выдаётся `/auth/telegram` или `POST /auth/magic`. Сессия архивной компании
        или контакта, переведённого в другую компанию, — 401

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Произвольный уникальный ключ попытки (CONTRACTS §0; Cabinet шлёт UUID). Обязателен на `POST` и `PATCH` —
        заодно это защита от CSRF: заголовок делает запрос «непростым», и междоменный запрос идёт только через
        CORS-preflight (разрешён лишь origin Cabinet). Повтор с тем же ключом возвращает прежний ответ.
      schema:
        type: string
        minLength: 1

  responses:
    Unauthorized:
      description: Нет сессии портала
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: У контакта нет права действовать (`can_act = false`; `FORBIDDEN`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CompanyArchived:
      description: Компания контакта архивна — вход закрыт любым каналом (`FORBIDDEN`, Q-18)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Объект не найден или принадлежит другой компании
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Тело запроса не прошло проверку
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdempotencyKeyRequired:
      description: 'Нет заголовка `Idempotency-Key` (`{"detail": "IDEMPOTENCY_KEY_REQUIRED"}`); запрос не выполнялся'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 'Тело не `application/json` (`{"detail": "UNSUPPORTED_MEDIA_TYPE"}`); запрос не выполнялся'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 'Лимит частоты исчерпан (`{"detail": "TOO_MANY_REQUESTS"}`); повторить через `Retry-After` секунд'
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          description: Код из `ErrorCode`; новые коды добавляются в перечень в том же PR, что и код ERP
          anyOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: string
      additionalProperties: false

    ErrorCode:
      type: string
      description: Коды `detail` портала (Q-17). Cabinet показывает текст по коду, незнакомый — по HTTP-статусу.
      enum:
        - UNAUTHORIZED
        - INVALID_INIT_DATA
        - FORBIDDEN
        - NOT_FOUND
        - MAGIC_LINK_EXPIRED
        - IDEMPOTENCY_KEY_REQUIRED
        - UNSUPPORTED_MEDIA_TYPE
        - TOO_MANY_REQUESTS
        - VALIDATION_ERROR
        - REASON_REQUIRED
        - INN_INVALID
        - TEAM_MEMBER_EXISTS
        - CONTACT_EMAIL_REQUIRED
        - CONTACT_CHANNEL_REQUIRED
        - INVALID_CHANNEL
        - FILE_REQUIRED
        - FILE_TOO_LARGE
        - UPLOAD_NOT_FOUND
        - QUOTE_FINALIZED
        - QUOTE_EXPIRED
        - QUOTE_CODE_INVALID
        - CONTRACT_FINALIZED
        - ACT_FINALIZED
        - DELIVERY_LINE_NOT_ACCEPTABLE
        - DOCUMENT_PENDING
        - DELIVERY_FAILED
        - CONFLICT

    Reason:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false

    Language:
      type: string
      enum: [ru, uz, en]

    PreferredChannel:
      type: string
      enum: [telegram, email, both]

    Currency:
      type: string
      pattern: '^[A-Z]{3}$'

    Amount:
      type: string
      pattern: '^-?\d+\.\d{2}$'

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
      additionalProperties: false

    DealRef:
      type: object
      description: Сделка глазами клиента (Q-16) — номер и название вместо внутреннего id
      required: [id, number]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
        title:
          type: [string, 'null']
      additionalProperties: false

    AcceptanceCodeSent:
      type: object
      required: [channel, sent_to, expires_in]
      properties:
        channel:
          type: string
          enum: [telegram, email]
        sent_to:
          type: string
          description: 'Куда ушёл код, в замаскированном виде: `i***@example.com`, `@u***` или `Telegram`'
        expires_in:
          type: integer
          minimum: 1
          description: Срок действия кода, секунд
      additionalProperties: false

    ActAccept:
      type: object
      properties:
        upload_id:
          type: string
          description: Скан подписанного акта из `POST /uploads` (PDF или изображение, ≤ 10 МБ)
      additionalProperties: false

    Me:
      type: object
      required: [contact, company, can_act, auth_method]
      properties:
        contact:
          $ref: '#/components/schemas/TeamMember'
        company:
          $ref: '#/components/schemas/Company'
        can_act:
          type: boolean
          description: 'Право «действовать» (принимать КП, подписывать, принимать акты); иначе — только смотреть'
        auth_method:
          type: string
          enum: [telegram, magic_link]

    RequestStatus:
      type: string
      enum: [new, in_progress, quoted, closed]

    RequestLineIn:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
        quantity:
          type: [string, 'null']
          description: Количество как десятичная строка, если известно
        unit:
          type: [string, 'null']
      additionalProperties: false

    AttachmentRef:
      type: object
      description: Файл, загруженный через `POST /uploads` (`upload_id` из ответа). Лишних полей нет — размер ERP знает сам
      required: [upload_id, name]
      properties:
        upload_id:
          type: string
        name:
          type: string
      additionalProperties: false

    ClientRequestCreate:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 5000
        lines:
          type: array
          description: Нет поля или пустой список — запрос словами, без строк (Q-FIX23-4)
          items:
            $ref: '#/components/schemas/RequestLineIn'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRef'
      additionalProperties: false

    ClientRequest:
      type: object
      required: [id, number, status, summary, created_at]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        summary:
          type: string
        source:
          type: string
          enum: [crm, cabinet, erp]
        deal:
          description: Сделка, в которую вырос запрос (Q-16); `null`, пока запрос не стал сделкой
          oneOf:
            - $ref: '#/components/schemas/DealRef'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RequestLineIn'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRef'

    QuoteStatus:
      type: string
      enum: [sent, viewed, accepted, rejected, expired]

    QuoteListItem:
      type: object
      required: [id, number, version, status, total, sent_at, deal]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        number:
          type: string
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/QuoteStatus'
        total:
          $ref: '#/components/schemas/Money'
        valid_until:
          type: [string, 'null']
          format: date
        sent_at:
          type: string
          format: date-time

    QuoteLine:
      type: object
      description: Строка КП для клиента — цена продажи без себестоимости и наценки; `unit_price` и `total` без НДС (Q-FIX21-2)
      required: [line_no, kind, title]
      properties:
        line_no:
          type: integer
          minimum: 1
        kind:
          type: string
          enum: [item, section, note, stage]
        title:
          type: string
        description:
          type: string
        quantity:
          type: [string, 'null']
        unit:
          type: [string, 'null']
        unit_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        total:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        promised_date:
          type: [string, 'null']
          format: date

    Quote:
      allOf:
        - $ref: '#/components/schemas/QuoteListItem'
        - type: object
          required: [lines, public_url, subtotal, vat]
          properties:
            subtotal:
              description: Итого без НДС — сумма `total` строк (Q-FIX21-2)
              $ref: '#/components/schemas/Money'
            vat:
              description: НДС; `subtotal + vat = total`, как в PDF КП
              $ref: '#/components/schemas/Money'
            lines:
              type: array
              items:
                $ref: '#/components/schemas/QuoteLine'
            public_url:
              type: string
              format: uri
            pdf_document_id:
              type: [integer, 'null']
              format: int64
            rejected_reason:
              type: [string, 'null']

    ContractStatus:
      type: string
      enum: [sent, signed_by_client, signed_by_company, signed, cancelled]

    Contract:
      type: object
      required: [id, number, status, deal]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        number:
          type: string
        status:
          $ref: '#/components/schemas/ContractStatus'
        signed_by_client_at:
          type: [string, 'null']
          format: date-time
        signed_by_company_at:
          type: [string, 'null']
          format: date-time
        document_id:
          type: [integer, 'null']
          format: int64

    InvoiceStatus:
      type: string
      enum: [issued, partially_paid, paid, overdue, cancelled]

    Invoice:
      type: object
      required: [id, number, status, total, paid, due_date, deal]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        number:
          type: string
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        total:
          $ref: '#/components/schemas/Money'
        paid:
          $ref: '#/components/schemas/Money'
        due_date:
          type: string
          format: date
        document_id:
          type: [integer, 'null']
          format: int64

    ActStatus:
      type: string
      enum: [issued, accepted, returned]

    Act:
      type: object
      required: [id, number, status, deal, issued_at]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        number:
          type: string
        status:
          $ref: '#/components/schemas/ActStatus'
        issued_at:
          type: string
          format: date-time
        returned_reason:
          type: [string, 'null']
        document_id:
          type: [integer, 'null']
          format: int64
          description: Выпущенный акт (PDF ERP)
        scan_document_id:
          type: [integer, 'null']
          format: int64
          description: Скан подписанного клиентом экземпляра, если загружен при приёмке

    DeliveryStatus:
      type: string
      description: '`accepted` и `disputed` ставит клиент (`/deliveries/{id}/accept|dispute`); остальное — ERP (M4 — со склада)'
      enum: [assembling, in_transit, ready_to_ship, shipped, delivered, accepted, disputed]

    DeliveryLine:
      type: object
      description: Строка поставки = строка подтверждённого заказа клиента; `id` — её идентификатор для приёмки
      required: [id, deal, line_no, title, status]
      properties:
        id:
          type: integer
          format: int64
        deal:
          $ref: '#/components/schemas/DealRef'
        line_no:
          type: integer
          minimum: 1
        title:
          type: string
        quantity:
          type: [string, 'null']
        unit:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        eta:
          type: [string, 'null']
          format: date
        tracking:
          type: [string, 'null']
        shipped_at:
          type: [string, 'null']
          format: date-time
        accepted_at:
          type: [string, 'null']
          format: date-time
          description: Когда клиент принял или оспорил строку
        remark:
          type: [string, 'null']
          description: Замечание клиента при `disputed`

    DocumentKind:
      type: string
      enum: [quote, contract, invoice, act, specification, waybill, receipt, other]

    Document:
      type: object
      required: [id, kind, number, date, title]
      properties:
        id:
          type: integer
          format: int64
        deal:
          oneOf:
            - $ref: '#/components/schemas/DealRef'
            - type: 'null'
        kind:
          $ref: '#/components/schemas/DocumentKind'
        number:
          type: string
        date:
          type: string
          format: date
        title:
          type: string
        file_name:
