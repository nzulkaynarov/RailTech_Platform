      description: 'Очередь «Входящая почта» по представлению (до 200, новые сверху) и состояние приёма:

        `new` — Новые, `mine` — мои в работе, `in_work` — все в работе, `done` — Разобранные (с итогом),

        `spam` — Подозрительные, `all` — все (кроме подозрительных), `tasks` — для «Моих задач»: новые

        не

        «из истории» и мои в работе. `mailbox.configured = false` — приём не настроен. `history=false` —

        без писем «из истории» (за последние 3 дня), `true` — только они; `q` — поиск по отправителю и

        теме;

        `type` — только письма этого типа (код справочника «Типы входящих писем»);

        `counts` — числа вкладок в рамках прав сотрудника.'
      operationId: list_inbound_mail
      parameters:
      - in: query
        name: view
        required: false
        schema:
          default: new
          enum:
          - new
          - mine
          - in_work
          - done
          - spam
          - all
          - tasks
          title: View
          type: string
      - in: query
        name: history
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: History
      - in: query
        name: q
        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Q
      - in: query
        name: type
        required: false
        schema:
          anyOf:
          - pattern: ^[a-z][a-z_]{0,31}$
            type: string
          - type: 'null'
          title: Type
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundMailPage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
