      title: WebLeadAccepted
      type: object
    WebLeadIn:
      description: 'Форма «Запрос» со страницы входа Cabinet: вложений в первой версии нет (Q-12).


        `consent` — согласие на обработку персональных данных, обязательно `true` (Q-12): иначе

        422 `consent_required`. `website` — honeypot: человек поле не видит; заполнено — запрос

        принят, лид не создан.'
      properties:
        company:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Company
        consent:
          default: false
          description: Согласие на обработку персональных данных; обязательно true (иначе 422 consent_required).
          title: Consent
          type: boolean
        email:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Email
        form_token:
          maxLength: 64
          minLength: 1
          title: Form Token
          type: string
        language:
          default: ru
          enum:
          - ru
          - uz
          - en
          title: Language
          type: string
        name:
          maxLength: 255
          minLength: 1
          title: Name
          type: string
        phone:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Phone
        text:
          maxLength: 10000
          minLength: 1
          title: Text
          type: string
        website:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Website
      required:
      - name
      - text
      - form_token
      title: WebLeadIn
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  title: RailTech CRM API
  version: 0.24.0
openapi: 3.1.0
paths:
  /api/v1/admin/ai-spend:
    get:
      description: 'Расходы на ИИ всего ансамбля из журнала LiteLLM (`/spend/logs/v2`), кэш 60 с.


        Вызовы, токены и USD по дням, системам (`system=crm|erp`), функциям и моделям; бюджет на день

        по системе и дни превышения; деградации — вызовы, обслуженные `fallback-model`. Период — до

        90 дней, не в будущем (`422 ai_spend_period`); шлюз недоступен — `502 litellm_unavailable`.'
      operationId: get_ai_spend
      parameters:
      - description: Первый день (Ташкент); по умолчанию to − 29
        in: query
        name: from
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Первый день (Ташкент); по умолчанию to − 29
          title: From
      - description: Последний день (Ташкент); по умолчанию сегодня
        in: query
        name: to
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Последний день (Ташкент); по умолчанию сегодня
          title: To
      - description: Измерение рядов `rows`
        in: query
        name: group
        required: false
        schema:
          default: day
          description: Измерение рядов `rows`
          enum:
          - day
          - system
          - feature
          - model
          title: Group
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSpendReport'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Get Ai Spend
      tags:
      - spend
  /api/v1/admin/external-services:
    get:
      description: 'Все внешние сервисы ансамбля со статусом, подсказкой «что сделать», метриками и выключателем.


        Только чтение: статус — из последней фоновой проверки (раз в минуту / раз в 15 мин), без

        вызовов моделей. Сервисы ERP — по ответу ERP на `GET /health` (`externals[]`, M3-ERP-06).'
      operationId: list_external_services
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalServicesOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: List External Services
      tags:
      - external-services
  /api/v1/admin/external-services/{key}:
    get:
      description: Сервис, его проверки за 24 ч, сводка по дням за 7 дней и инциденты за 30 дней.
      operationId: get_external_service
      parameters:
      - in: path
        name: key
        required: true
        schema:
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_.-]*$
          title: Key
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalServiceDetailOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Get External Service
      tags:
      - external-services
  /api/v1/admin/external-services/{key}/check:
    post:
      description: Проверить сервис сейчас (включая медленные пробы); инцидент и оповещение — как у фоновой.
      operationId: check_external_service
      parameters:
      - in: path
        name: key
        required: true
        schema:
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_.-]*$
          title: Key
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalServiceDetailOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Check External Service
      tags:
      - external-services
  /api/v1/admin/external-services/{key}/disable:
    post:
      description: 'Выключить сервис вручную (пароль админа, аудит): вендор — вызовы на запасную модель,

        Langfuse — без трейсов, почта — пауза очереди, Telegram — пауза исходящих, сервис ERP —

        ERP перестаёт его вызывать (`PUT /externals/{code}/switch`).


        Нет выключателя или вендор запасной модели — `409 service_not_switchable`.'
      operationId: disable_external_service
      parameters:
      - in: path
        name: key
        required: true
        schema:
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_.-]*$
          title: Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceSwitchIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalServiceOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Disable External Service
      tags:
      - external-services
  /api/v1/admin/external-services/{key}/enable:
    post:
      description: Включить сервис обратно (пароль админа, аудит); почта отправляет накопленные письма.
      operationId: enable_external_service
      parameters:
      - in: path
        name: key
        required: true
        schema:
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_.-]*$
          title: Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceEnableIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalServiceOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Enable External Service
      tags:
      - external-services
  /api/v1/audit:
    get:
      operationId: list_audit
      parameters:
      - in: query
        name: actor_user_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Actor User Id
      - in: query
        name: action
        required: false
        schema:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Action
      - in: query
        name: entity_type
        required: false
        schema:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Entity Type
      - in: query
        name: entity_id
        required: false
        schema:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Entity Id
      - in: query
        name: created_from
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created From
      - in: query
        name: created_to
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created To
      - description: Скрыть действия с этими префиксами (напр. auth.login)
        in: query
        name: exclude_actions
        required: false
        schema:
          anyOf:
          - items:
              type: string
            maxItems: 64
            type: array
          - type: 'null'
          description: Скрыть действия с этими префиксами (напр. auth.login)
          title: Exclude Actions
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: List Audit
      tags:
      - admin
  /api/v1/audit/console-open:
    post:
      description: 'Запись «открыл служебную консоль» (OPS-CONSOLE): BFF Платформы пускает администратора в

        консоль сервиса по пути `/console/<ключ>/` и отмечает это здесь — кто, когда, какая.'
      operationId: audit_console_open
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsoleOpenIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Audit Console Open
      tags:
      - admin
  /api/v1/audit/contact-reveal:
    post:
