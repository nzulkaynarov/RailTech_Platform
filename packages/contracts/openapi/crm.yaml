    put:
      description: 'Сменить тип письма одним щелчком (`null` — снять); запись в журнал письма. Правило

        отправителя и помощник этот выбор не перебивают. Отключённый тип выбрать нельзя — 409

        `mail_type_inactive`.'
      operationId: set_inbound_mail_type
      parameters:
      - in: path
        name: mail_id
        required: true
        schema:
          minimum: 1
          title: Mail Id
          type: integer
      requestBody:
        content:
          application/json:
