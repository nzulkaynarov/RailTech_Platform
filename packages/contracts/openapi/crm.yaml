      operationId: export_leads
      parameters:
      - in: query
        name: stage
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Stage
      - in: query
        name: owner
        required: false
        schema:
          anyOf:
          - pattern: ^(me|none|\d+)$
            type: string
          - type: 'null'
          title: Owner
      - in: query
        name: min_score
        required: false
        schema:
          anyOf:
          - maximum: 100
            minimum: 0
            type: integer
          - type: 'null'
          title: Min Score
      - in: query
        name: language
        required: false
        schema:
          anyOf:
          - pattern: ^(ru|uz|en)$
            type: string
          - type: 'null'
          title: Language
      - in: query
        name: q
        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Q
      - in: query
        name: created_from
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created From
      - in: query
        name: created_to
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created To
      responses:
        '200':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Export Leads
      tags:
      - export
  /api/v1/inbox:
    get:
      description: 'Очередь работы с запиской передачи (CRM-06). Читает любой с `leads:read` (D1-1: директор

        видит «Ждут ответа» только для просмотра); забрать и ответить — права `leads:take`/`reply`.


        `on_behalf_of` — очередь замещаемого коллеги (W15-H6): только пока сегодня идёт период, где

        вызывающий назначен заместителем (иначе 403 `not_a_deputy`). Ответ — «мои» лиды замещаемого и

        общие эскалации; список «без ответственного» пуст: его заместитель и так видит в своей очереди.

        Права на сами объекты — свои, расширения нет.'
      operationId: inbox
      parameters:
      - in: query
        name: on_behalf_of
        required: false
        schema:
          anyOf:
          - exclusiveMinimum: 0
            type: integer
          - type: 'null'
          title: On Behalf Of
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Inbox
      tags:
      - leads
  /api/v1/integrations/erp:
    get:
      description: 'Коннектор «ERP» (ADR-0018, ADR-0022): адрес, откуда взяты секреты, режим жизненного цикла.


        Значения сервисного токена и секрета вебхуков не возвращаются — только «задан» и `last4`.'
      operationId: get_erp_status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpStatusOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Get Erp Status
      tags:
      - integrations
    put:
      description: 'Сохранить адрес ERP и секреты (после пароля админа); секрет `null` — оставить прежний.


        Ротация секрета вебхуков без простоя: `webhook_secret` — новый (текущий),

        `webhook_secret_previous` — прежний (принимается, пока его не сняли

        `clear_webhook_secret_previous: true`).


        Ошибки: `erp_invalid_url` (422, поле `base_url`), `wrong_password` (422),

        `secrets_key_missing` (409 — секреты нельзя сохранить без `SECRETS_KEY`).'
      operationId: put_erp_connector
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpConnectorIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpStatusOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Put Erp Connector
      tags:
      - integrations
  /api/v1/integrations/erp/check:
    post:
      description: '«Проверить связь»: `GET {base_url}/api/integration/v1/health` с сервисным токеном, 5 с.


        Ошибки (ADR-0017, `details.reason`): `erp_not_configured` (409), `erp_invalid_url` (422),

        `erp_unauthorized` / `erp_unavailable` / `erp_bad_response` (502). Лимит частоты ERP (429) — не

        ошибка: `status: "rate_limited"` и `retry_after_s` (пауза из `Retry-After`).'
      operationId: check_erp_connection
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpCheckOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Check Erp Connection
      tags:
      - integrations
  /api/v1/integrations/erp/pair:
    post:
      description: '«Подключить ERP»: адрес ERP и одноразовый код из её настроек (M3-CRM-10, CONTRACTS §2).


        CRM сама генерирует токены обоих направлений и секрет вебхуков, передаёт их ERP по коду,

        сохраняет зашифрованными и сразу делает «Проверить связь» (результат — в ответе). Пароль

        админа обязателен.


        Ошибки (`details.reason`): `erp_invalid_url` (422, поле `base_url`),

        `erp_pairing_code_invalid` / `erp_pairing_code_expired` / `erp_pairing_code_used` (422, поле

        `code`), `wrong_password` (422), `secrets_key_missing` (409), `erp_unavailable` /

        `erp_bad_response` / `erp_pairing_unsupported` (502).'
      operationId: pair_erp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpPairIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpPairingOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Pair Erp
      tags:
      - integrations
  /api/v1/integrations/erp/rotate:
    post:
      description: '«Обновить ключи»: CRM генерирует новую тройку секретов, ERP принимает её по токену.


        Прежний токен CRM→ERP остаётся у ERP активным на переходный период (два активных), затем

        гаснет сам; предыдущий секрет вебхуков CRM принимает наравне с новым и снимает по истечении

        срока перехода.


        Ошибки: `erp_not_configured` (409), `secrets_key_missing` (409), `wrong_password` (422),

        `erp_unauthorized` / `erp_unavailable` / `erp_bad_response` (502).'
      operationId: rotate_erp_keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpRotateIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpPairingOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Rotate Erp Keys
      tags:
      - integrations
