          type: string
        segment:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Segment
      required:
      - name
      title: ClientCreate
      type: object
    ClientDetail:
      properties:
        candidates:
          items:
            $ref: '#/components/schemas/IdentityOut'
