  /api/v1/integrations/offsite:
    get:
      description: 'Внешняя копия бэкапов (OPS-GDRIVE-2, OPS-YADISK): выбранный провайдер — Яндекс Диск (логин,

        папка, «пароль приложения задан») или Google Drive (папка, адрес сервисного аккаунта, последние

        символы ID ключа), доставка сервису копирования, итог последней проверки. Секреты не

        возвращаются никогда. Состояние самой копии — строка `offsite_backup` внешних сервисов.'
      operationId: get_offsite_status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffsiteStatusOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Get Offsite Status
      tags:
