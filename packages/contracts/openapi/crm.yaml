          - type: integer
          - type: 'null'
          title: Tg User Id
        tg_username:
          anyOf:
          - type: string
          - type: 'null'
          title: Tg Username
        timezone:
          default: Asia/Tashkent
          title: Timezone
          type: string
        ui_mode:
          title: Ui Mode
          type: string
      required:
      - id
      - email
      - full_name
      - roles
      - is_active
      - tg_user_id
      - must_change_password
      - ui_mode
      - notify_system
      - notify_leads
      title: UserOut
      type: object
    UserUpdate:
      properties:
        clear_tg_user_id:
          default: false
          title: Clear Tg User Id
          type: boolean
        erp_role_codes:
          anyOf:
          - items:
              enum:
              - CALCULATION
              - CATALOG_SUPPLY
              - FULFILLMENT
              - FINANCE
              - HEAD
              - VIEWER
              type: string
            type: array
          - type: 'null'
          title: Erp Role Codes
        full_name:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Full Name
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
        language:
          anyOf:
          - enum:
            - ru
            - uz
            - en
            type: string
          - type: 'null'
          title: Language
        platform_access:
          anyOf:
          - items:
              enum:
              - crm
              - erp
              type: string
            type: array
          - type: 'null'
          title: Platform Access
        platform_role_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          description: 'Полный новый набор ролей Платформы (id). Пустой набор — 422 `roles_required`: у сотрудника хотя бы
            одна роль, закрыть доступ — `is_active = false`.'
          title: Platform Role Ids
        position:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          title: Position
        roles:
          anyOf:
          - items:
              enum:
              - admin
              - manager
              - viewer
              type: string
            minItems: 1
            type: array
          - type: 'null'
          title: Roles
        tg_user_id:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          title: Tg User Id
        transfer_to_user_id:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          title: Transfer To User Id
      title: UserUpdate
      type: object
    WebFormToken:
      description: 'Токен формы «Запрос»: выдаётся вместе с формой, отправляется в `form_token`.'
      properties:
        expires_at:
          format: date-time
          title: Expires At
          type: string
        min_fill_seconds:
          title: Min Fill Seconds
          type: integer
        token:
          title: Token
          type: string
      required:
      - token
      - expires_at
      - min_fill_seconds
      title: WebFormToken
      type: object
    WebLeadAccepted:
      description: '202: запрос принят. `lead_id` пустой — запрос отброшен антиспамом (honeypot).'
      properties:
        lead_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Lead Id
      required:
      - lead_id
      title: WebLeadAccepted
      type: object
    WebLeadIn:
      description: 'Форма «Запрос» со страницы входа Cabinet: вложений в первой версии нет (Q-12).


        `consent` — согласие на обработку персональных данных, обязательно `true` (Q-12): иначе

        422 `consent_required`. `website` — honeypot: человек поле не видит; заполнено — запрос

        принят, лид не создан.'
      properties:
        company:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Company
        consent:
          default: false
          description: Согласие на обработку персональных данных; обязательно true (иначе 422 consent_required).
          title: Consent
          type: boolean
        email:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Email
        form_token:
          maxLength: 64
          minLength: 1
          title: Form Token
          type: string
        language:
          default: ru
          enum:
          - ru
          - uz
          - en
          title: Language
          type: string
        name:
          maxLength: 255
          minLength: 1
          title: Name
          type: string
        phone:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Phone
        text:
          maxLength: 10000
          minLength: 1
          title: Text
          type: string
        website:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Website
      required:
      - name
      - text
      - form_token
      title: WebLeadIn
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  title: RailTech CRM API
  version: 0.9.0
openapi: 3.1.0
paths:
  /api/v1/admin/ai-spend:
    get:
      description: 'Расходы на ИИ всего ансамбля из журнала LiteLLM (`/spend/logs/v2`), кэш 60 с.


        Вызовы, токены и USD по дням, системам (`system=crm|erp`), функциям и моделям; бюджет на день

        по системе и дни превышения; деградации — вызовы, обслуженные `fallback-model`. Период — до

        90 дней, не в будущем (`422 ai_spend_period`); шлюз недоступен — `502 litellm_unavailable`.'
      operationId: get_ai_spend
      parameters:
      - description: Первый день (Ташкент); по умолчанию to − 29
        in: query
        name: from
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Первый день (Ташкент); по умолчанию to − 29
          title: From
      - description: Последний день (Ташкент); по умолчанию сегодня
        in: query
        name: to
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Последний день (Ташкент); по умолчанию сегодня
          title: To
      - description: Измерение рядов `rows`
        in: query
        name: group
        required: false
        schema:
          default: day
          description: Измерение рядов `rows`
          enum:
          - day
          - system
          - feature
          - model
          title: Group
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSpendReport'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Get Ai Spend
      tags:
      - spend
  /api/v1/admin/external-services:
    get:
      description: 'Все внешние сервисы ансамбля со статусом, подсказкой «что сделать», метриками и выключателем.


        Только чтение: статус — из последней фоновой проверки (раз в минуту / раз в 15 мин), без

        вызовов моделей. Сервисы ERP — по ответу ERP на `GET /health` (`externals[]`, M3-ERP-06).'
      operationId: list_external_services
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalServicesOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: List External Services
      tags:
      - external-services
  /api/v1/admin/external-services/{key}:
    get:
      description: Сервис, его проверки за 24 ч, сводка по дням за 7 дней и инциденты за 30 дней.
      operationId: get_external_service
      parameters:
      - in: path
        name: key
        required: true
        schema:
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_.-]*$
          title: Key
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalServiceDetailOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Get External Service
      tags:
      - external-services
  /api/v1/admin/external-services/{key}/check:
    post:
      description: Проверить сервис сейчас (включая медленные пробы); инцидент и оповещение — как у фоновой.
      operationId: check_external_service
      parameters:
      - in: path
        name: key
        required: true
        schema:
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_.-]*$
          title: Key
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalServiceDetailOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Check External Service
      tags:
      - external-services
  /api/v1/admin/external-services/{key}/disable:
    post:
      description: 'Выключить сервис вручную (пароль админа, аудит): вендор — вызовы на запасную модель,

        Langfuse — без трейсов, почта — пауза очереди, Telegram — пауза исходящих, сервис ERP —

        ERP перестаёт его вызывать (`PUT /externals/{code}/switch`).


        Нет выключателя или вендор запасной модели — `409 service_not_switchable`.'
      operationId: disable_external_service
      parameters:
      - in: path
        name: key
        required: true
        schema:
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_.-]*$
          title: Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceSwitchIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalServiceOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Disable External Service
      tags:
      - external-services
  /api/v1/admin/external-services/{key}/enable:
    post:
      description: Включить сервис обратно (пароль админа, аудит); почта отправляет накопленные письма.
      operationId: enable_external_service
      parameters:
      - in: path
        name: key
        required: true
        schema:
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_.-]*$
          title: Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceEnableIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalServiceOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Enable External Service
      tags:
      - external-services
  /api/v1/audit:
    get:
      operationId: list_audit
      parameters:
      - in: query
        name: actor_user_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Actor User Id
      - in: query
        name: action
        required: false
        schema:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Action
      - in: query
        name: entity_type
        required: false
        schema:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Entity Type
      - in: query
        name: entity_id
        required: false
        schema:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Entity Id
      - in: query
        name: created_from
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created From
      - in: query
        name: created_to
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created To
      - description: Скрыть действия с этими префиксами (напр. auth.login)
        in: query
        name: exclude_actions
        required: false
        schema:
          anyOf:
          - items:
              type: string
            maxItems: 64
            type: array
          - type: 'null'
          description: Скрыть действия с этими префиксами (напр. auth.login)
          title: Exclude Actions
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: List Audit
      tags:
      - admin
  /api/v1/auth/change-password:
    post:
      operationId: change_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Change Password
      tags:
      - auth
  /api/v1/auth/forgot-password:
    post:
      description: '«Забыли пароль?»: ответ один и тот же для любой учётной записи (перечислять нельзя).


        Ссылка уходит на почту или в Telegram, если у найденного сотрудника есть канал; иначе тихо

        ничего — экран входа заранее говорит «если нет ни того, ни другого, обратитесь к

        администратору». Частоту по адресу и учётной записи ограничивают BFF и сам сервис (3 в час).

        Выпуск и отправка — после ответа (фоновая задача): время ответа не выдаёт, найдена ли учётная

        запись и ушло ли письмо.'
      operationId: forgot_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                title: Response Forgot Password
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      summary: Forgot Password
      tags:
      - auth
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
      - in: cookie
        name: rt_refresh
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Rt Refresh
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      summary: Logout
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      parameters:
      - in: cookie
        name: rt_refresh
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Rt Refresh
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      summary: Refresh
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      description: Новый пароль по одноразовой ссылке; токен неверный, использованный или просроченный — 422.
      operationId: reset_password_by_link
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      summary: Reset Password By Link
      tags:
      - auth
  /api/v1/auth/sso/exchange:
    post:
      description: Обменять SSO-токен из ERP на сессию CRM (CONTRACTS §6).
      operationId: sso_exchange
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoExchangeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      summary: Sso Exchange
      tags:
      - auth
  /api/v1/auth/sso/token:
    post:
      description: 'Выдать SSO-токен текущему сотруднику (CONTRACTS §6, sso-token.md).


        Без тела или с `aud = erp` — переход в ERP; `aud = eds` — токен сотрудника для обмена в EDS

        (у EDS нет внешнего маршрута: `redirect_url` пуст).'
      operationId: sso_token
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/SsoTokenRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoTokenResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Sso Token
      tags:
      - auth
  /api/v1/bus/deliveries:
    get:
      description: 'Доставки событий CRM подписчикам, новые сверху; DLQ — `status=dead`.


        Страница — `before_id` (id последней строки предыдущей).'
      operationId: busDeliveries
      parameters:
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - enum:
            - pending
            - in_flight
            - delivered
            - dead
            type: string
          - type: 'null'
          title: Status
      - in: query
        name: subscriber
        required: false
        schema:
          anyOf:
          - pattern: ^[a-z][a-z0-9-]{0,63}$
            type: string
          - type: 'null'
          title: Subscriber
      - in: query
        name: type
        required: false
        schema:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Type
      - in: query
        name: created_from
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created From
      - in: query
        name: created_to
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created To
      - in: query
        name: before_id
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          title: Before Id
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusDeliveryPageOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Deliveries
      tags:
      - bus
  /api/v1/bus/deliveries/retry-dead:
    post:
      description: «Повторить все dead подписчика» — после исправления причины (адрес, секрет, приёмник).
      operationId: busRetryDead
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusRetryDeadIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusRetryOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Retry Dead
      tags:
      - bus
  /api/v1/bus/deliveries/{delivery_id}/retry:
    post:
      description: '«Повторить»: доставка `dead` или ожидающая — сейчас, попытки с нуля.


        Подписчик на паузе предохранителя сразу получает пробную доставку.'
      operationId: busRetryDelivery
      parameters:
      - in: path
        name: delivery_id
        required: true
        schema:
          minimum: 1
          title: Delivery Id
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
