        себе» у того, кто ведёт (в журнал). Разобрано или подозрительное — 409 `mail_handled`.'
      operationId: take_inbound_mail
      parameters:
      - in: path
        name: mail_id
        required: true
        schema:
          minimum: 1
          title: Mail Id
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundMailTakeIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Take Inbound Mail
      tags:
      - inbound-mail
