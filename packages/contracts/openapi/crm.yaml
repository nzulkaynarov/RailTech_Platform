# Сгенерировано из CRM (make -C apps/crm openapi) — руками не править; свежесть проверяет CI.
components:
  schemas:
    AccessOut:
      properties:
        accessed_by_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Accessed By Id
        accessed_by_type:
          title: Accessed By Type
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        document_id:
          title: Document Id
          type: integer
        id:
          title: Id
          type: integer
        tg_user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tg User Id
      required:
      - id
      - document_id
      - accessed_by_type
      - accessed_by_id
      - tg_user_id
      - created_at
      title: AccessOut
      type: object
    ActionResult:
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
        ok:
          const: true
          default: true
          title: Ok
          type: boolean
      title: ActionResult
      type: object
    AiBudgetOverrun:
      properties:
        cost_usd:
          title: Cost Usd
          type: number
        daily_usd:
          title: Daily Usd
          type: number
        day:
          format: date
          title: Day
          type: string
        system:
          title: System
          type: string
      required:
      - system
      - day
      - cost_usd
      - daily_usd
      title: AiBudgetOverrun
      type: object
    AiSpendReport:
      properties:
        date_from:
          format: date
          title: Date From
          type: string
        date_to:
          format: date
          title: Date To
          type: string
        erp_connected:
          description: 'ERP ходит в шлюз: есть строки `system=erp` за период'
          title: Erp Connected
          type: boolean
        fetched_at:
          format: date-time
          title: Fetched At
          type: string
        group:
          enum:
          - day
          - system
          - feature
          - model
          title: Group
          type: string
        overruns:
          items:
            $ref: '#/components/schemas/AiBudgetOverrun'
          title: Overruns
          type: array
        rows:
          items:
            $ref: '#/components/schemas/AiSpendRow'
          title: Rows
          type: array
        systems:
          items:
            $ref: '#/components/schemas/AiSystemBudget'
          title: Systems
          type: array
        timezone:
          title: Timezone
          type: string
        totals:
          $ref: '#/components/schemas/AiSpendTotals'
        truncated:
          description: Журнал LiteLLM отдал не все строки (потолок выборки)
          title: Truncated
          type: boolean
      required:
      - date_from
      - date_to
      - group
      - timezone
      - rows
      - totals
      - systems
      - overruns
      - erp_connected
      - truncated
      - fetched_at
      title: AiSpendReport
      type: object
    AiSpendRow:
      properties:
        by_system:
          items:
            $ref: '#/components/schemas/AiSpendSystemCost'
          title: By System
          type: array
        calls:
          description: Строк журнала LiteLLM (вызовов), включая неуспешные
          title: Calls
          type: integer
        cost_usd:
          title: Cost Usd
          type: number
        failed_calls:
          title: Failed Calls
          type: integer
        fallback_calls:
          description: 'Деградации: успешные вызовы через fallback-model'
          title: Fallback Calls
          type: integer
        input_tokens:
          title: Input Tokens
          type: integer
        key:
          description: День `YYYY-MM-DD`, система, функция или алиас — по `group`
          title: Key
          type: string
        output_tokens:
          title: Output Tokens
          type: integer
      required:
      - key
      - calls
      - failed_calls
      - input_tokens
      - output_tokens
      - cost_usd
      - fallback_calls
      - by_system
      title: AiSpendRow
      type: object
    AiSpendSystemCost:
      properties:
        calls:
          title: Calls
          type: integer
        cost_usd:
          title: Cost Usd
          type: number
        system:
          description: '`crm`, `erp` или `other` — вызов без тега системы'
          title: System
          type: string
      required:
      - system
      - cost_usd
      - calls
      title: AiSpendSystemCost
      type: object
    AiSpendTotals:
      properties:
        calls:
          title: Calls
          type: integer
        cost_usd:
          title: Cost Usd
          type: number
        failed_calls:
          title: Failed Calls
          type: integer
        fallback_calls:
          title: Fallback Calls
          type: integer
        input_tokens:
          title: Input Tokens
          type: integer
        output_tokens:
          title: Output Tokens
          type: integer
      required:
      - calls
      - failed_calls
      - input_tokens
      - output_tokens
      - cost_usd
      - fallback_calls
      title: AiSpendTotals
      type: object
    AiSystemBudget:
      properties:
        connected:
          description: За период есть вызовы с тегом этой системы
          title: Connected
          type: boolean
        daily_usd:
          description: Бюджет на день; 0 — без лимита
          title: Daily Usd
          type: number
        days_over:
          description: Дней периода с расходом ≥ бюджета
          title: Days Over
          type: integer
        fallback_calls:
          title: Fallback Calls
          type: integer
        over_today:
          title: Over Today
          type: boolean
        period_calls:
          title: Period Calls
          type: integer
        period_usd:
          title: Period Usd
          type: number
        system:
          title: System
          type: string
        today_calls:
          title: Today Calls
          type: integer
        today_usd:
          title: Today Usd
          type: number
      required:
      - system
      - daily_usd
      - today_usd
      - today_calls
      - over_today
      - period_usd
      - period_calls
      - fallback_calls
      - days_over
      - connected
      title: AiSystemBudget
      type: object
    Assign:
      properties:
        user_id:
          title: User Id
          type: integer
      required:
      - user_id
      title: Assign
      type: object
    AssistOut:
      description: 'Текст для поля ответа (клиенту не отправляется). `notice`: `numbers_removed` — из

        черновика убраны предложения с числами не из базы знаний; `new_numbers` — правка добавила

        числа, возвращён исходный текст.'
      properties:
        cost_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Cost Usd
        notice:
          anyOf:
          - enum:
            - numbers_removed
            - new_numbers
            type: string
          - type: 'null'
          title: Notice
        text:
          title: Text
          type: string
      required:
      - text
      title: AssistOut
      type: object
    AssistRequest:
      description: 'ИИ-помощь при ответе (Q-019): `draft` — черновик, `improve` — правка текста `text`.'
      properties:
        mode:
          enum:
          - draft
          - improve
          title: Mode
          type: string
        text:
          anyOf:
          - maxLength: 4000
            type: string
          - type: 'null'
          title: Text
      required:
      - mode
      title: AssistRequest
      type: object
    AuditItem:
      properties:
        action:
          title: Action
          type: string
        actor_name:
          anyOf:
          - type: string
          - type: 'null'
          description: Имя пользователя-автора
          title: Actor Name
        actor_type:
          title: Actor Type
          type: string
        actor_user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Actor User Id
        after:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: After
        before:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Before
        created_at:
          format: date-time
          title: Created At
          type: string
        entity_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Id
        entity_type:
          title: Entity Type
          type: string
        id:
          title: Id
          type: integer
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
      required:
      - id
      - actor_user_id
      - actor_type
      - action
      - entity_type
      - entity_id
      - before
      - after
      - ip
      - created_at
      title: AuditItem
      type: object
    AuditPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditItem'
          title: Items
          type: array
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      title: AuditPage
      type: object
    BackupDatabase:
      properties:
        last_success_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Последняя копия базы; нет — None
          title: Last Success At
        name:
          title: Name
          type: string
      required:
      - name
      - last_success_at
      title: BackupDatabase
      type: object
    BackupItem:
      properties:
        at:
          format: date-time
          title: At
          type: string
        name:
          title: Name
          type: string
        size_bytes:
          title: Size Bytes
          type: integer
      required:
      - name
      - at
      - size_bytes
      title: BackupItem
      type: object
    BackupsOut:
      properties:
        available:
          description: Том бэкапов смонтирован в api / бакет `backups` читается
          title: Available
          type: boolean
        can_request:
          description: «Сделать сейчас» доступно (только для тома)
          title: Can Request
          type: boolean
        daemon_alive:
          description: 'Сервис бэкапа отвечает: heartbeat свежее 2 мин'
          title: Daemon Alive
          type: boolean
        databases:
          description: Последняя копия по каждой базе (бакет)
          items:
            $ref: '#/components/schemas/BackupDatabase'
          title: Databases
          type: array
        error:
          anyOf:
          - enum:
            - bucket_missing
            - access_denied
            - unreachable
            type: string
          - type: 'null'
          description: Почему бакет не прочитан; None — прочитан
          title: Error
        items:
          items:
            $ref: '#/components/schemas/BackupItem'
          title: Items
          type: array
        last_success_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Success At
        request_stuck:
          description: Запрос «Сделать сейчас» старше 2 мин без новой копии — можно повторить
          title: Request Stuck
          type: boolean
        requested_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: «Сделать сейчас» ждёт сервис бэкапа
          title: Requested At
        source:
          description: 'Откуда статус: том backup-контейнера (dev) или бакет `backups` RustFS (прод)'
          enum:
          - volume
          - rustfs
          title: Source
          type: string
        stale:
          description: Последний успешный бэкап старше 26 ч или его нет
          title: Stale
          type: boolean
      required:
      - available
      - source
      - can_request
      - error
      - databases
      - last_success_at
      - stale
      - requested_at
      - daemon_alive
      - request_stuck
      - items
      title: BackupsOut
      type: object
    Body_upload_document:
      properties:
        client_id:
          title: Client Id
          type: integer
        doc_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Doc Date
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
        number:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Number
        title:
          maxLength: 500
          minLength: 1
          title: Title
          type: string
        type:
          enum:
          - contract
          - proposal
          - letter
          - invoice
          - act
          - other
          title: Type
          type: string
        visible:
          default: true
          title: Visible
          type: boolean
      required:
      - file
      - client_id
      - type
      - title
      title: Body_upload_document
      type: object
    Body_upload_kb_document:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
        gap_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Gap Id
        language:
          enum:
          - ru
          - uz
          - en
          title: Language
          type: string
        product_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Product Key
        title:
          maxLength: 500
          minLength: 1
          title: Title
          type: string
      required:
      - file
      - title
      - language
      title: Body_upload_kb_document
      type: object
    BotProfileOut:
      properties:
        profile:
          $ref: '#/components/schemas/BotProfileSettings'
        published:
          anyOf:
          - $ref: '#/components/schemas/ProfilePublishOut'
          - type: 'null'
      required:
      - profile
      - published
      title: BotProfileOut
      type: object
    BotProfileSettings:
      additionalProperties: false
      properties:
        description:
          $ref: '#/components/schemas/LocalizedText'
          description: «Что умеет этот бот?» — видно до /start, до 512 символов
        name:
          $ref: '#/components/schemas/LocalizedText'
          description: Имя бота в Telegram, до 64 символов
        short_description:
          $ref: '#/components/schemas/LocalizedText'
          description: Краткое описание в профиле бота и при пересылке, до 120 символов
      title: BotProfileSettings
      type: object
    BusDeliveryOut:
      properties:
        attempts:
          title: Attempts
          type: integer
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        created_at:
          format: date-time
          title: Created At
          type: string
        delivered_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Delivered At
        event_created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Event Created At
        event_id:
          format: uuid
          title: Event Id
          type: string
        event_type:
          title: Event Type
          type: string
        id:
          title: Id
          type: integer
        last_attempt_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Attempt At
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        last_status_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Status Code
        next_attempt_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Next Attempt At
        status:
          enum:
          - pending
          - in_flight
          - delivered
          - dead
          title: Status
          type: string
        subject:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject
        subscriber:
          title: Subscriber
          type: string
      required:
      - id
      - event_id
      - event_type
      - subscriber
      - status
      - attempts
      - next_attempt_at
      - last_attempt_at
      - last_status_code
      - last_error
      - delivered_at
      - created_at
      - subject
      - correlation_id
      - event_created_at
      title: BusDeliveryOut
      type: object
    BusDeliveryPageOut:
      properties:
        has_more:
          title: Has More
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/BusDeliveryOut'
          title: Items
          type: array
      required:
      - items
      - has_more
      title: BusDeliveryPageOut
      type: object
    BusInboxEntryOut:
      properties:
        attempts:
          title: Attempts
          type: integer
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        event_id:
          format: uuid
          title: Event Id
          type: string
        processed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Processed At
        publisher:
          title: Publisher
          type: string
        received_at:
          format: date-time
          title: Received At
          type: string
        status:
          enum:
          - received
          - processed
          - failed
          - skipped
          title: Status
          type: string
        subject:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject
        type:
          title: Type
          type: string
      required:
      - event_id
      - type
      - publisher
      - subject
      - correlation_id
      - status
      - attempts
      - error
      - received_at
      - processed_at
      title: BusInboxEntryOut
      type: object
    BusInboxPageOut:
      properties:
        has_more:
          title: Has More
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/BusInboxEntryOut'
          title: Items
          type: array
      required:
      - items
      - has_more
      title: BusInboxPageOut
      type: object
    BusOverviewOut:
      properties:
        dlq_size:
          title: Dlq Size
          type: integer
        inbox_failed:
          title: Inbox Failed
          type: integer
        inbox_received:
          title: Inbox Received
          type: integer
        inbox_retrying:
          title: Inbox Retrying
          type: integer
        oldest_undelivered_age_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Oldest Undelivered Age Seconds
        outbox_pending:
          title: Outbox Pending
          type: integer
        service:
          title: Service
          type: string
        subscribers:
          items:
            $ref: '#/components/schemas/BusSubscriberOut'
          title: Subscribers
          type: array
      required:
      - service
      - outbox_pending
      - oldest_undelivered_age_seconds
      - dlq_size
      - inbox_received
      - inbox_retrying
      - inbox_failed
      - subscribers
      title: BusOverviewOut
      type: object
    BusRetryDeadIn:
      additionalProperties: false
      description: «Повторить все dead подписчика».
      properties:
        subscriber:
          pattern: ^[a-z][a-z0-9-]{0,63}$
          title: Subscriber
          type: string
      required:
      - subscriber
      title: BusRetryDeadIn
      type: object
    BusRetryOut:
      description: 'Сколько поставлено на повтор.


        0 — повторять нечего: уже доставлено, уже в работе или записи нет.'
      properties:
        retried:
          title: Retried
          type: integer
      required:
      - retried
      title: BusRetryOut
      type: object
    BusSubscriberOut:
      properties:
        configured:
          title: Configured
          type: boolean
        consecutive_failures:
          title: Consecutive Failures
          type: integer
        dead:
          title: Dead
          type: integer
        drop:
          title: Drop
          type: boolean
        enabled:
          title: Enabled
          type: boolean
        endpoint:
          anyOf:
          - type: string
          - type: 'null'
          title: Endpoint
        in_flight:
          title: In Flight
          type: integer
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        last_failure_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Failure At
        last_success_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Success At
        name:
          title: Name
          type: string
        oldest_undelivered_age_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Oldest Undelivered Age Seconds
        paused_until:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Paused Until
        pending:
          title: Pending
          type: integer
      required:
      - name
      - configured
      - enabled
      - drop
      - endpoint
      - pending
      - in_flight
      - dead
      - oldest_undelivered_age_seconds
      - consecutive_failures
      - paused_until
      - last_failure_at
      - last_success_at
      - last_error
      title: BusSubscriberOut
      type: object
    ChangePasswordRequest:
