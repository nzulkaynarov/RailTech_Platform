        created_at:
          format: date-time
          title: Created At
          type: string
        erp_company_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Erp Company Id
        erp_handoff_error:
          anyOf:
          - type: string
          - type: 'null'
