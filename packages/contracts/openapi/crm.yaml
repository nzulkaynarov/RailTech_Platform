            - dead
            type: string
          - type: 'null'
          title: Status
      - in: query
        name: subscriber
        required: false
        schema:
          anyOf:
          - pattern: ^[a-z][a-z0-9-]{0,63}$
            type: string
          - type: 'null'
          title: Subscriber
      - in: query
        name: type
        required: false
        schema:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Type
      - in: query
        name: created_from
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created From
      - in: query
        name: created_to
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created To
      - in: query
        name: before_id
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          title: Before Id
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
