  /api/v1/team:
    get:
      description: Менеджеры и админы (без `section`) либо сотрудники раздела каталога (с `section`).
      operationId: team
      parameters:
      - description: 'Раздел каталога (`erp.calc.goods`, `eds.payments`, …): сотрудники с этим разделом. Нужен `level`. Право
          — чтение сотрудников (`users:read`, раздел `admin` не ниже чтения); без `section` — `leads:read` или `chats:read`.
          Раздела нет в каталоге — 422.'
        in: query
        name: section
        required: false
        schema:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          description: 'Раздел каталога (`erp.calc.goods`, `eds.payments`, …): сотрудники с этим разделом. Нужен `level`.
            Право — чтение сотрудников (`users:read`, раздел `admin` не ниже чтения); без `section` — `leads:read` или `chats:read`.
            Раздела нет в каталоге — 422.'
          title: Section
      - description: 'Уровень раздела не ниже: `full` или `read` (`full` ⊇ `read`).'
        in: query
        name: level
        required: false
        schema:
          anyOf:
          - enum:
            - full
            - read
            type: string
          - type: 'null'
          description: 'Уровень раздела не ниже: `full` или `read` (`full` ⊇ `read`).'
          title: Level
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TeamMember'
                title: Response Team
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Ошибка валидации
      security:
      - HTTPBearer: []
      summary: Team
      tags:
      - leads
