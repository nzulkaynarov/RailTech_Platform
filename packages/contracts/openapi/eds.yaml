      properties:
        items:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/LetterDuplicate'
    LetterRelatedRef:
      type: object
      additionalProperties: false
      required: [kind, id, number]
      description: Связанный документ карточки — предыдущий ВХ (`letter_in`) или наш ИСХ (`letter_out`)
      properties:
        kind:
          type: string
          enum: [letter_in, letter_out]
        id:
          $ref: '#/components/schemas/Uuid'
        number:
          type: string
    LetterCreate:
      type: object
      additionalProperties: false
      required: [subject, sender, received_at]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 300
        summary:
          type: string
          minLength: 1
          maxLength: 10000
          description: Суть документа (краткое содержание); не задана — тема
        sender:
          $ref: '#/components/schemas/IncomingLetterSender'
        sender_ref:
          $ref: '#/components/schemas/SenderRef'
        received_at:
          type: string
