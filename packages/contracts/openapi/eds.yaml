          description: Зарегистрировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}:
    get:
      tags: [letters]
      operationId: getLetter
      summary: Карточка входящего письма
      description: |
        Держатель `letters.read` видит любое письмо. Без него (P8b, SPEC-v3 §3.2a «Права») — только письмо, где сотрудник
        исполнитель поручения, в списке «ознакомить» или автор резолюции; иначе 403 `FORBIDDEN`
        (`details.permission = [letters.read]`). Файлы такого письма и отчётов поручений он скачивает так же.
      x-rt-permissions: []
      parameters:
        - $ref: '#/components/parameters/LetterId'
      responses:
        '200':
          description: Письмо с резолюцией и журналом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/letters/{letter_id}/resolution:
    post:
      tags: [letters]
      operationId: resolveLetter
      summary: Утвердить резолюцию → задание в ERP
      description: |
        Только письмо в статусе `awaiting_resolution` (иначе 409 `CONFLICT`, `details.reason = invalid_state`). Статус →
        `resolved`; публикуется `letter.resolved` (исполнители, срок, мин. маржа, ссылки на заявку и сделку ERP) — ERP создаёт
        задание расчёта (EDS-01). Исполнители — активные сотрудники проекции (иначе 422, `details.fields.assignees =
        not_active_employee`), у каждого — раздел каталога его зоны на уровне `full`: товары — `erp.calc.goods`, услуги —
        `erp.calc.services`, условия оплаты — `eds.payments` (проекция берёт разделы из `identity.user.*`,
        `user.permissions.sections`; иначе 422, `details.fields.assignees = assignee_zone_mismatch`; D1-8, B-007). Срок
        `due` — не раньше сегодняшней даты по `Asia/Tashkent` (иначе 422, `details.fields.due`; решение архитектора
        2026-10-26, C1-G-1). Письмо пути делопроизводства (`Letter.track = office`) — 409, `details.reason = track_mismatch`:
        его резолюция — `POST …/office-resolution` (P8b).
      x-rt-permissions: [letters.resolve]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolutionIn'
      responses:
        '200':
          description: Резолюция наложена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/return:
    post:
      tags: [letters]
      operationId: returnLetter
      summary: Вернуть письмо менеджеру с комментарием
      description: |
        Только из `awaiting_resolution`; статус → `returned` — письмо у регистратора (`letters.register`), который правит его
        и подаёт снова (`POST …/submit`); публикуется `letter.returned`.
      x-rt-permissions: [letters.resolve]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterReturnIn'
      responses:
        '200':
          description: Возвращено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/reject:
    post:
      tags: [letters]
      operationId: rejectLetter
      summary: Отклонить письмо с причиной
      description: |
        Только из `awaiting_resolution`; статус → `rejected`; публикуется `letter.rejected` — ERP переводит сделку в `LOST`
        с причиной. Письмо пути делопроизводства (`track = office`, P8b) отклоняется без события: отказ по такому письму
        сделку не закрывает.
      x-rt-permissions: [letters.resolve]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterRejectIn'
      responses:
        '200':
          description: Отклонено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/submit:
    post:
      tags: [letters]
      operationId: resubmitLetter
      summary: Подать возвращённое письмо на резолюцию повторно
      description: |
        Только из `returned`; необязательные правки применяются, статус → `awaiting_resolution`, номер прежний; в журнал —
        `letter.resubmitted` (события шины нет). Другой статус — 409 `CONFLICT` (`details.reason = invalid_state`).
      x-rt-permissions: [letters.register]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterSubmitIn'
      responses:
        '200':
          description: Снова ждёт резолюции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/resolution-draft:
    put:
      tags: [letters]
      operationId: saveResolutionDraft
      summary: Проект резолюции делопроизводителя (P8b)
      description: |
        Делопроизводитель (или директор) заполняет проект резолюции пути делопроизводства (SPEC-v3 §3.2a п. 1–2): тип,
        ответственный, срок, текст, соисполнители, «ознакомить». Проект заменяется целиком; `null`-тело не принимается —
        пустой проект задаётся `{"kind": null}`. Директор утверждает его одним действием (`POST …/office-resolution` с теми
        же полями) или правит. Только письмо пути `office` (`Letter.track`; иначе 409, `details.reason = track_mismatch`) в
        статусе `awaiting_resolution` (иначе 409 `invalid_state`). Сотрудники — активные в проекции (иначе 422,
        `details.fields.<поле> = not_active_employee`); срок в прошлом — 422 `details.fields.due = due_in_past`. Журнал —
        `letter.draft_saved`; событий шины нет.
      x-rt-permissions: [letters.register, letters.resolve]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolutionDraftIn'
      responses:
        '200':
          description: Проект сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/office-resolution:
    post:
      tags: [letters]
      operationId: resolveOfficeLetter
      summary: Резолюция пути делопроизводства — К исполнению · Подготовить ответ · Для сведения (P8b)
      description: |
        SPEC-v3 §3.2a п. 2. Только письмо пути `office` (иначе 409, `details.reason = track_mismatch`) в статусе
        `awaiting_resolution` (иначе 409 `invalid_state`). `execute` и `reply`: обязательны ответственный и срок (не раньше
        сегодняшней даты по `Asia/Tashkent`; иначе 422 `details.fields.due = due_in_past`), создаются поручения
        ответственному и соисполнителям (статус `in_work`, общий срок), письмо → `in_execution`, `on_control = true`.
        `info`: ответственного и срока нет (переданные — 422 `details.fields.<поле> = not_allowed_for_info`), поручений нет,
        письмо → `noted`. «Ознакомить» — строки ознакомления у любого типа. Ответственный, соисполнители, «ознакомить» —
        любые активные сотрудники проекции без проверки зоны (иначе 422 `not_active_employee`); один человек дважды —
        422 `duplicate`. Проект резолюции очищается. Журнал `letter.resolved`. `letter.resolved` **не** публикуется (он
        для расчёта ERP по зонам); исполнители и «ознакомить» получают `notice.requested` (колокольчик и Telegram).
      x-rt-permissions: [letters.resolve]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficeResolutionIn'
      responses:
        '200':
          description: Резолюция наложена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/acquaint:
    post:
      tags: [letters]
      operationId: acknowledgeLetter
      summary: «Ознакомлен» (P8b)
      description: |
        Сотрудник из списка «ознакомить» отмечает, что ознакомился: строка получает дату. Повтор — без изменений (200).
        Сотрудника нет в списке — 404 `NOT_FOUND`. Журнал `letter.acknowledged`.
      x-rt-permissions: []
      parameters:
        - $ref: '#/components/parameters/LetterId'
      responses:
        '200':
          description: Отмечено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/instructions/{instruction_id}/complete:
    post:
      tags: [letters]
      operationId: completeInstruction
      summary: Поручение исполнено (P8b)
      description: |
        Исполнитель поручения отмечает «Исполнено» (SPEC-v3 §3.2a п. 3): нужен отчёт (`report`, `file_ids`) или ссылка на
        отправленный ИСХ (`outgoing_number`), иначе 422 `details.fields.report = report_required`; ИСХ не найден или не
        отправлен — 422 `details.fields.outgoing_number = not_found`. Только сам исполнитель (иначе 403,
        `details.reason = not_executor`), только поручение `in_work` (иначе 409 `invalid_state`). Когда исполнены все
        поручения письма — письмо `executed`, `on_control = false`, `notice.requested` автору резолюции и регистратору.
        Журнал `instruction.executed` (и `letter.executed`).
      x-rt-permissions: []
      parameters:
        - $ref: '#/components/parameters/InstructionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructionCompleteIn'
      responses:
        '200':
          description: Исполнено — карточка письма
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/instructions/{instruction_id}/extension:
    post:
      tags: [letters]
      operationId: requestInstructionExtension
      summary: Запросить перенос срока поручения (P8b)
      description: |
        Исполнитель просит новый срок с причиной (SPEC-v3 §3.2a п. 3–4). Срок срочного письма не продлевается (Росархив
        5.14): запросить можно, автор резолюции может только отклонить; уже есть запрос без решения — 409
        `extension_pending`; новый срок не позже
        текущего — 422 `details.fields.new_due = not_later`. Только исполнитель поручения `in_work` (403 `not_executor`, 409
        `invalid_state`). Статус поручения не меняется; автору резолюции — строка «Перенос срока» и `notice.requested`.
        Журнал `instruction.extension_requested`.
      x-rt-permissions: []
      parameters:
        - $ref: '#/components/parameters/InstructionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionRequestIn'
      responses:
        '200':
          description: Запрос отправлен — карточка письма
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/instructions/{instruction_id}/extension/decision:
    post:
      tags: [letters]
      operationId: decideInstructionExtension
      summary: Одобрить или отклонить перенос срока (P8b)
      description: |
        Решает автор резолюции (иначе 403, `details.reason = not_resolution_author`). Нет запроса без решения — 409
        `no_pending_extension`. `approve` — срок поручения меняется (напоминания считаются заново), `reject` — срок прежний.
        Срочное письмо — `approve` отклоняется: 409, `details.reason = urgent_not_extendable` (срочные не продлеваются).
        Исполнителю — `notice.requested`; история переносов — в поручении. Журнал `instruction.extension_approved` или
        `instruction.extension_rejected`.
      x-rt-permissions: []
      parameters:
        - $ref: '#/components/parameters/InstructionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionDecisionIn'
      responses:
        '200':
          description: Решение принято — карточка письма
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letter-tasks:
    get:
      tags: [letters]
      operationId: listMyLetterTasks
      summary: Мои поручения, переносы на решение и ознакомления (P8b)
      description: |
        Строки «Моих задач» сотрудника по входящим (SPEC-v3 §3.2a п. 3–5): поручения в работе, где он исполнитель (со
        сроком и признаком просрочки); запросы переноса без решения, где он автор резолюции; ознакомления без отметки.
        Не больше 100 строк каждого вида, раньше — ближайший срок.
      x-rt-permissions: []
      responses:
        '200':
          description: Задачи сотрудника
          content:
            application/json:
