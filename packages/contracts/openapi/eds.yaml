    DocumentKind:
      type: string
      enum: [memo, application, report, letter_out]
      description: Служебная записка (СЗ), заявление (ЗЯ), отчёт (ОТ), исходящее письмо (ИСХ)
    DocumentStatus:
      type: string
      enum: [draft, on_approval, returned, rejected, approved, to_accountant, paid, sent]
      description: |
        SPEC-v3 §2.4 «Служебная записка». Статус по решениям маршрута (шаг 1 — директор, `memos.approve`; шаг 2 — бухгалтер,
        `payments.confirm`, только при сумме):

        | Из | Действие | В | Маршрут | Архив |
        |---|---|---|---|---|
        | — | `POST /documents` | `draft` | — | — |
        | `draft`, `returned` | `POST …/submit` (после возврата — `version + 1`, новый круг) | `on_approval` | `approval.requested` | — |
        | `on_approval` | директор `approve`, суммы нет (и заявление, отчёт) | `approved` | закрыт: `approved` | `document.archived` |
        | `on_approval` | директор `approve`, сумма есть | `to_accountant` (передана бухгалтеру) | открыт, шаг 2 | — |
        | `to_accountant` | бухгалтер `approve` (оплачено) | `paid` | закрыт: `approved` | `document.archived` |
        | `on_approval`, `to_accountant` | `return` (комментарий обязателен) | `returned` (автор правит) | закрыт: `returned` | — |
        | `on_approval`, `to_accountant` | `reject` (комментарий обязателен) | `rejected` | закрыт: `rejected` | `document.archived` |
        | `draft` (`letter_out`) | `POST …/submit` — отправка, `ИСХ-NNN/ГГ` | `sent` | — | `document.archived` |

        Архив — признак `archived_at`, итоговый статус сохраняется.
    DocumentBody:
      type: object
      additionalProperties: false
      required: [version, lang, doc]
      description: |
        Тело документа на бланке — контракт `packages/contracts/documents/body.schema.json` (D-DOC1, ADR-0020): узлы ProseMirror
        (`paragraph`, `heading`, списки, `table`, …), без цветов, шрифтов и HTML. EDS нормализует и проверяет тело `rt_docs`
        (схема, глубина ≤ 20, ≤ 1 МБ); отказ — 422 `VALIDATION_FAILED`, `details.fields = [body]`.
      properties:
        version:
          type: integer
          const: 1
        lang:
          type: string
          enum: [ru, uz, en]
        page:
          type: object
          description: '`orientation`, `density`, `tuning` — см. схему тела'
        doc:
          type: object
          description: 'Корень `{type: doc, content: [...]}`'
    OutgoingLetterIn:
      type: object
      additionalProperties: false
      required: [body]
      description: Письмо на бланке (P4) — только `letter_out`
      properties:
        body:
          $ref: '#/components/schemas/DocumentBody'
        recipient_attention:
          type: [string, 'null']
          maxLength: 300
          description: "«Кому» — должность и ФИО получателя («Начальнику ГНИ Мирабадского района Каримову А. А.»)"
        recipient_email:
          type: [string, 'null']
          format: email
          maxLength: 254
          description: Почта адресата — «Отправить адресату»
        signatory_name:
          type: [string, 'null']
          maxLength: 255
          description: Подписант; `null` — подписант бланка (директор)
        signatory_position:
          type: [string, 'null']
          maxLength: 255
    OutgoingLetter:
      type: object
      additionalProperties: false
      required:
        [body, recipient_attention, recipient_email, signatory_name, signatory_position, pdf, mailings, registration_requested]
      description: Письмо на бланке (P4) — тело и реквизиты, последний PDF, журнал отправки, передача на регистрацию
      properties:
        body:
          oneOf:
            - $ref: '#/components/schemas/DocumentBody'
            - type: 'null'
          description: '`null` — письмо без бланка (до P4, только текст)'
        recipient_attention:
          type: [string, 'null']
        recipient_email:
          type: [string, 'null']
        signatory_name:
          type: [string, 'null']
        signatory_position:
          type: [string, 'null']
        pdf:
          oneOf:
            - $ref: '#/components/schemas/DocumentPdf'
            - type: 'null'
          description: Последний запрошенный PDF; `null` — не запрашивался
        mailings:
          type: array
          items:
            $ref: '#/components/schemas/DocumentMailing'
          description: Журнал отправки адресату, новые ниже
        registration_requested:
          oneOf:
            - $ref: '#/components/schemas/RegistrationRequest'
            - type: 'null'
          description: Автор без `letters.register` передал черновик делопроизводителю (B-P8B-4)
    DocumentPdf:
      type: object
      additionalProperties: false
      required: [status, final, error, pages, requested_at, ready_at]
      description: PDF письма на бланке из фонового воркера (B-094)
      properties:
        status:
          type: string
          enum: [pending, ready, failed]
          description: '`pending` — готовится, `ready` — готов, `failed` — ошибка (`error`)'
        final:
          type: boolean
          description: '`true` — с номером ИСХ и датой регистрации (уходит адресату); `false` — предпросмотр черновика'
        error:
          type: [string, 'null']
          description: Причина словами («Письмо слишком большое для PDF — сократите текст»)
        pages:
          type: [integer, 'null']
          minimum: 1
        requested_at:
          type: string
          format: date-time
        ready_at:
          type: [string, 'null']
          format: date-time
    DocumentMailing:
      type: object
      additionalProperties: false
      required: [id, to, status, reason, requested_by, requested_at, finished_at]
      description: Строка журнала отправки письма адресату (почтовый сервис CRM)
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        to:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
        status:
          type: string
          enum: [awaiting_pdf, requested, sent, failed]
          description: '`awaiting_pdf` — ждёт итогового PDF; `requested` — передано почтовому сервису; `sent`/`failed` — итог CRM'
        reason:
          type: [string, 'null']
          description: Причина неудачи словами («Почта не настроена — Настройки · Подключения · Почта»)
        requested_by:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        requested_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [by, at]
      properties:
        by:
          $ref: '#/components/schemas/PersonRef'
        at:
          type: string
          format: date-time
    Letterhead:
      type: object
      additionalProperties: false
      required: [configured, company_name, requisites, signatory_name, signatory_position, has_logo, updated_at]
      description: Бланк компании — проекция события ERP `letterhead.updated` (P4)
      properties:
        configured:
          type: boolean
          description: '`false` — бланк из ERP ещё не получен: PDF письма не строится (409 `letterhead_missing`), пока админ не сохранит «Компания и бланки»'
        company_name:
          type: [string, 'null']
        requisites:
          type: array
          items:
            type: string
          description: Строки под названием — адрес, ИНН, банк
        signatory_name:
          type: [string, 'null']
        signatory_position:
          type: [string, 'null']
        has_logo:
          type: boolean
        updated_at:
          type: [string, 'null']
          format: date-time
    DocumentCreate:
      type: object
      additionalProperties: false
      required: [kind, subject, text]
      properties:
        kind:
          $ref: '#/components/schemas/DocumentKind'
        subject:
          type: string
          minLength: 1
          maxLength: 300
        text:
          type: string
          minLength: 1
          maxLength: 20000
        addressee_crm_user_id:
          type: [integer, 'null']
          description: Кому; нет — директор (первый шаг маршрута — любой с `memos.approve`)
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Сумма — маршрут служебной записки после директора идёт бухгалтеру
        due_date:
          type: [string, 'null']
          format: date
          description: «Нужно до»
        file_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
        source_message_id:
          type: [string, 'null']
          maxLength: 128
          description: Сообщение чата, из которого создан документ (непрозрачная ссылка)
        erp_deal_id:
          type: [integer, 'null']
          description: Связь с проектом (заявкой) ERP
        recipient:
          oneOf:
            - $ref: '#/components/schemas/LetterSender'
            - type: 'null'
          description: Только `letter_out` — адресат исходящего письма
        in_reply_to:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Только `letter_out` — входящее письмо, на которое отвечаем
        letter:
          oneOf:
            - $ref: '#/components/schemas/OutgoingLetterIn'
            - type: 'null'
          description: |
            Только `letter_out` (P4) — письмо на бланке: тело блоками, «кому», почта адресата, подписант. Создать черновик письма
            может любой с `memos.create` (исполнитель поручения «Подготовить ответ», B-P8B-4); регистрирует — `letters.register`.
            Если тело дано, `text` — производный от тела (поиск).
    DocumentSubmitIn:
      type: object
      additionalProperties: false
      description: Необязательные правки перед отправкой (после возврата — новая версия)
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 300
        text:
          type: string
          minLength: 1
          maxLength: 20000
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        due_date:
          type: [string, 'null']
          format: date
        file_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
        send:
          type: boolean
          default: false
          description: |
            Только `letter_out` (P4): после регистрации отправить письмо на `letter.recipient_email` почтовым сервисом CRM — с
            итоговым PDF (номер и дата регистрации) вложением; нет адреса — 422 (`recipient_email`).
        dispatch_method:
          oneOf:
            - $ref: '#/components/schemas/DispatchMethod'
            - type: 'null'
          default: email
          description: Способ отправки документа адресату (EDS-REPLY-2, ADR-0024)
    DispatchMethod:
      type: string
      enum: [email, paper, courier, edo, other]
      description: |
        Способ отправки исходящего документа адресату (EDS-REPLY-2, ADR-0024):
        `email` — электронная почта через CRM;
        `paper` — выдача на бумаге на руки;
        `courier` — отправка курьерской службой;
        `edo` — отправка через электронный документооборот (E-IMZO / Didox);
        `other` — иной способ.
    DocumentSignIn:
      type: object
      additionalProperties: false
      description: Параметры подписания документа уполномоченным лицом (SIGN-3, ADR-0024)
      properties:
        authority_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            Идентификатор полномочия из реестра `signing_authorities`. Если не передан (`null`), система
            автоматически подбирает действующее полномочие текущего пользователя по виду документа и сумме.
        dispatch_method:
          $ref: '#/components/schemas/DispatchMethod'
          default: email
        send:
          type: boolean
          default: true
          description: |
            Только при `dispatch_method = email`: отправить письмо адресату по электронной почте сразу
            после подготовки итогового подписанного PDF.
    DocumentPaymentIn:
      type: object
      additionalProperties: false
      required: [paid_on, amount]
      description: «Оплачено» — дата и сумма платежа, платёжка бухгалтера
      properties:
        paid_on:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Money'
        receipt_file_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        note:
          type: [string, 'null']
          maxLength: 500
    DocumentPayment:
      type: object
      additionalProperties: false
      required: [paid_on, amount, receipt_file_id, note, paid_by, recorded_at]
      description: Факт оплаты служебной записки
      properties:
        paid_on:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Money'
        receipt_file_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        note:
          type: [string, 'null']
        paid_by:
          $ref: '#/components/schemas/PersonRef'
        recorded_at:
          type: string
          format: date-time
    DocumentUpdate:
      type: object
      additionalProperties: false
      description: Правка черновика без отправки (0.4.0, D1-5) — поля `DocumentSubmitIn` и связь с проектом
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 300
        text:
          type: string
          minLength: 1
          maxLength: 20000
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        due_date:
          type: [string, 'null']
          format: date
        file_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
        erp_deal_id:
          type: [integer, 'null']
          description: Связь с проектом (заявкой) ERP; `null` снимает связь
        recipient:
          oneOf:
            - $ref: '#/components/schemas/LetterSender'
            - type: 'null'
          description: Только `letter_out` — адресат исходящего письма (другой тип — 422 `recipient`)
        letter:
          oneOf:
            - $ref: '#/components/schemas/OutgoingLetterIn'
            - type: 'null'
          description: Только `letter_out` (P4) — письмо на бланке целиком (другой тип — 422 `letter`)
    DocumentDecision:
      type: object
      additionalProperties: false
      required: [round, step, decision, comment, by, at]
      properties:
        round:
          type: integer
          minimum: 1
          description: Круг маршрута (растёт после возврата)
        step:
          type: integer
          minimum: 1
        decision:
          $ref: '#/components/schemas/Decision'
        comment:
          type: [string, 'null']
        by:
          $ref: '#/components/schemas/PersonRef'
        at:
          type: string
          format: date-time
    DocumentListItem:
      type: object
      additionalProperties: false
      required: [id, kind, number, status, subject, author, files_count, paid_on, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/DocumentKind'
        number:
          oneOf:
            - $ref: '#/components/schemas/DocumentNumber'
            - type: 'null'
          description: '`null` — исходящее письмо до отправки'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        subject:
          type: string
        author:
          $ref: '#/components/schemas/PersonRef'
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        due_date:
          type: [string, 'null']
          format: date
        files_count:
          type: integer
          minimum: 0
          description: Сколько файлов приложено к документу (у записки к оплате — счёт поставщика и платёжка)
        paid_on:
          type: [string, 'null']
          format: date
          description: Дата оплаты записки; `null` — не оплачена
        created_at:
          type: string
          format: date-time
    DocumentPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentListItem'
        next_cursor:
          type: [string, 'null']
    Document:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - number
        - status
        - version
        - subject
        - text
        - author
        - addressee
        - amount
        - due_date
        - files
        - source_message_id
        - erp_deal_id
        - deal_number
        - approval_id
        - payment
        - decisions
        - journal
        - created_at
        - updated_at
        - archived_at
        - letter
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/DocumentKind'
        number:
          oneOf:
            - $ref: '#/components/schemas/DocumentNumber'
            - type: 'null'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        version:
          type: integer
          minimum: 1
        subject:
          type: string
        text:
          type: string
        author:
          $ref: '#/components/schemas/PersonRef'
        addressee:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
          description: '`null` — директор (любой с `memos.approve`)'
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        due_date:
          type: [string, 'null']
          format: date
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileRef'
        source_message_id:
          type: [string, 'null']
        erp_deal_id:
          type: [integer, 'null']
        deal_number:
          type: [string, 'null']
        recipient:
          oneOf:
            - $ref: '#/components/schemas/LetterSender'
            - type: 'null'
        in_reply_to:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        reply_to:
          oneOf:
            - $ref: '#/components/schemas/ReplyToLetter'
            - type: 'null'
          description: |
            Только `letter_out` «в ответ на ВХ» (EDS-REPLY-1): номер и тема входящего, на которое отвечаем (для ссылки «В ответ
            на ВХ-…» в карточке ИСХ); `null` — письмо ни на что не отвечает. Поля может не быть у старого ответа.
        letter:
          oneOf:
            - $ref: '#/components/schemas/OutgoingLetter'
            - type: 'null'
          description: Только `letter_out` — письмо на бланке (P4); у остальных типов `null`
        approval_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Маршрут текущего круга; `null` — не отправлялся
        payment:
          oneOf:
            - $ref: '#/components/schemas/DocumentPayment'
            - type: 'null'
          description: Факт оплаты служебной записки; `null` — не оплачена
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/DocumentDecision'
        journal:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, 'null']
          format: date-time
          description: Маршрут завершён окончательно — документ в архиве (`document.archived`)
        signed_at:
          type: [string, 'null']
          format: date-time
          description: Дата и время подписания документа уполномоченным лицом (SIGN-3, ADR-0024)
        signed_by:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
          description: Фактический подписант документа
        signing_authority_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Полномочие из реестра `signing_authorities`, по которому подписан документ
        signatory_basis:
          type: [string, 'null']
          enum: [charter, order, power_of_attorney, null]
          description: Основание подписи (устав, приказ, доверенность)
        signatory_basis_text:
          type: [string, 'null']
          description: Текст отметки основания для печатной формы
        acting_for:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
          description: За кого действовал подписант в случае замещения
        verification_code:
          type: [string, 'null']
          description: Код проверки подлинности (ADR-0024 п. 5)
        verification_url:
          type: [string, 'null']
          description: Ссылка публичной проверки подлинности (/v/<код>)
        dispatch_method:
          oneOf:
            - $ref: '#/components/schemas/DispatchMethod'
            - type: 'null'
          description: Способ отправки документа адресату

    ApprovalTemplate:
      type: string
      enum: [memo, application, report, quote, signing]
    RouteStatus:
      type: string
      enum: [open, approved, returned, rejected]
    Decision:
      type: string
      enum: [approve, return, reject]
    SendChannel:
      type: string
      enum: [telegram, cabinet, email]
    StepAssignee:
      type: object
      additionalProperties: false
      required: [crm_user_id, permission]
      description: Конкретный сотрудник или любой с правом EDS — ровно одно не `null`
      properties:
        crm_user_id:
          type: [integer, 'null']
        permission:
          oneOf:
            - $ref: '#/components/schemas/EdsPermission'
            - type: 'null'
      if:
        properties:
          crm_user_id:
            type: integer
      then:
        properties:
          permission:
            type: 'null'
      else:
        properties:
          permission:
            type: string
    ApprovalStep:
      type: object
      additionalProperties: false
      required: [index, label, assignee, status, decided_by, decided_at, comment]
      properties:
        index:
          type: integer
          minimum: 1
        label:
          type: string
          description: «Директор», «Бухгалтер»
        assignee:
          $ref: '#/components/schemas/StepAssignee'
        status:
          type: string
          enum: [pending, current, approved, returned, rejected, skipped]
        decided_by:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        decided_at:
          type: [string, 'null']
          format: date-time
        comment:
          type: [string, 'null']
    ApprovalObject:
      type: object
      additionalProperties: false
      required: [kind]
      description: Документ EDS (`document_id`, `number`) или КП ERP (`erp_quote_id`, `quote_number`, `quote_version`, `erp_deal_id`)
      if:
        properties:
          kind:
            const: quote
      then:
        required: [erp_quote_id, quote_number, quote_version, erp_deal_id]
        properties:
          erp_quote_id:
            type: integer
          quote_number:
            type: string
          quote_version:
            type: integer
          erp_deal_id:
            type: [integer, 'null']
      else:
        if:
          properties:
            kind:
              const: signing
        then:
          required: [signing_kind, signing_number]
        else:
          required: [document_id, number]
          properties:
            document_id:
              $ref: '#/components/schemas/Uuid'
            number:
              $ref: '#/components/schemas/DocumentNumber'
      properties:
        kind:
          $ref: '#/components/schemas/ApprovalTemplate'
        signing_kind:
          type: string
          enum: [quote, contract, invoice, act]
        signing_number:
          type: string
        signing_version:
          type: [integer, 'null']
        signing_amount_tiyins:
          type: [integer, 'null']
        signing_currency:
          type: [string, 'null']
        document_id:
          $ref: '#/components/schemas/Uuid'
        number:
          $ref: '#/components/schemas/DocumentNumber'
        erp_quote_id:
          type: integer
        quote_number:
          type: string
        quote_version:
          type: integer
          minimum: 1
          description: Версия КП ERP (`Quote.version`, сквозная в заявке); повторная отправка после возврата — версия +1
        erp_deal_id:
          type: [integer, 'null']
        deal_number:
          type: [string, 'null']
        superseded_by_version:
          type: integer
          minimum: 2
          description: |
            Только у КП, которое заменила более новая версия (D26G-2): номер новейшей версии того же КП или той же заявки.
            Нет поля — версия актуальна. Платформа показывает такую версию в истории как «Заменена».
    ChecklistItem:
      type: object
      additionalProperties: false
      required: [code, label, ok, blocking, by, at, value]
      description: |
        Строка чек-листа одобрения КП (SPEC-v3 §7.3) — с датой и автором. `margin` сверяет маржу КП с порогом **резолюции EDS**
        (владелец поля — EDS); `min_margin_pct` из события ERP — только снимок для показа. Блокирующие строки (`blocking = true`:
        визы и маржа) — красная запрещает `approve`; строка `due` — предупреждение (`blocking = false`): красная показывает
        опоздание, одобрение остаётся доступным (решение архитектора 2026-10-26, C1-G-1).
      properties:
        code:
          type: string
          enum: [visa_goods, visa_services, margin, due]
          description: виза снабженца, виза гл. инженера, маржа ≥ порога резолюции, срок расчёта выдержан
        label:
          type: string
        ok:
          type: boolean
        blocking:
          type: boolean
          description: '`true` — красная строка блокирует одобрение; `false` — предупреждение (`due`). С 0.2.0'
        by:
          oneOf:
            - $ref: '#/components/schemas/QuoteVisaAuthor'
            - type: 'null'
          description: Кто поставил визу
        at:
          type: [string, 'null']
          format: date-time
        value:
          type: [string, 'null']
          description: Значение для показа (`17.6 % ≥ 15 %`)
    CalcZone:
      type: string
      enum: [goods, services]
      description: Зона визы расчёта (как `CalcZone` события ERP)
    QuoteVisaAuthor:
      type: object
      additionalProperties: false
      required: [crm_user_id, full_name]
      properties:
        crm_user_id:
          type: [integer, 'null']
          description: '`null` — сотрудник ERP без связи с CRM'
        full_name:
          type: string
    QuoteVisa:
      type: object
      additionalProperties: false
      required: [zone, by, at]
      properties:
        zone:
          $ref: '#/components/schemas/CalcZone'
        by:
          $ref: '#/components/schemas/QuoteVisaAuthor'
        at:
          type: string
          format: date-time
    QuoteSnapshot:
      type: object
      additionalProperties: false
      required: [erp_quote_id, number, version, total, currency, margin_pct, min_margin_pct, required_zones, visas, ready_at]
      description: |
        Снимок КП из `uz.railtech.erp.quote.ready_for_approval.v1` (поля — как `QuoteReadyForApproval` события) — только для
        показа; `min_margin_pct` — порог, который видела ERP; чек-лист сверяет с порогом резолюции EDS.
      properties:
        erp_quote_id:
          type: integer
        number:
          type: string
        version:
          type: integer
          minimum: 1
        client_name:
          type: [string, 'null']
        total:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        cost:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        margin_amount:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        margin_pct:
          type: string
          pattern: '^-?\d{1,3}(\.\d{1,2})?$'
          description: Маржа КП, % строкой; может быть отрицательной
        min_margin_pct:
          oneOf:
            - $ref: '#/components/schemas/MarginPct'
            - type: 'null'
        required_zones:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CalcZone'
        visas:
          type: array
          items:
            $ref: '#/components/schemas/QuoteVisa'
        due:
          type: [string, 'null']
          format: date
        ready_at:
          type: string
          format: date-time
        valid_until:
          type: [string, 'null']
          format: date
    ApprovalListItem:
      type: object
      additionalProperties: false
      required: [id, template, title, object, status, round, current_step, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        template:
          $ref: '#/components/schemas/ApprovalTemplate'
        title:
          type: string
        object:
          $ref: '#/components/schemas/ApprovalObject'
        status:
          $ref: '#/components/schemas/RouteStatus'
        round:
          type: integer
          minimum: 1
        current_step:
          oneOf:
            - $ref: '#/components/schemas/ApprovalStep'
            - type: 'null'
          description: '`null` — маршрут закрыт'
        created_at:
          type: string
          format: date-time
    ApprovalPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalListItem'
        next_cursor:
          type: [string, 'null']
    Approval:
      type: object
      additionalProperties: false
      required:
        - id
        - template
        - title
        - object
        - status
        - round
        - steps
        - checklist
        - quote
        - can_decide
        - allowed_decisions
        - outgoing_number
        - approved_late
        - created_at
        - closed_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        template:
          $ref: '#/components/schemas/ApprovalTemplate'
        title:
          type: string
        object:
          $ref: '#/components/schemas/ApprovalObject'
        status:
          $ref: '#/components/schemas/RouteStatus'
        round:
          type: integer
          minimum: 1
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalStep'
        checklist:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
          description: Только КП; у документов — пусто
        quote:
          oneOf:
            - $ref: '#/components/schemas/QuoteSnapshot'
            - type: 'null'
          description: Снимок КП — только тому, кто решает шаг КП; иначе `null`
        can_decide:
          type: boolean
          description: Текущий шаг ждёт этого сотрудника
        allowed_decisions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Decision'
          description: Что можно сейчас (`approve` нет, пока красна хотя бы одна блокирующая строка чек-листа КП)
        outgoing_number:
          oneOf:
            - $ref: '#/components/schemas/OutgoingNumber'
            - type: 'null'
          description: ИСХ-номер одобренного КП
        approved_late:
          type: boolean
          description: |
            КП одобрено с опозданием: готово позже срока резолюции, директор одобрил, приняв опоздание (C1-G-1, с 0.2.0).
            У остальных маршрутов — `false`
        created_at:
          type: string
          format: date-time
        closed_at:
          type: [string, 'null']
          format: date-time
    DecisionIn:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/Decision'
        comment:
          type: [string, 'null']
          maxLength: 4000
          description: Обязателен для `return` и `reject`
        channels:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SendChannel'
          description: Только `approve` КП — каналы отправки клиенту (Telegram-бот, Кабинет, почта)
      if:
        properties:
          decision:
            enum: [return, reject]
      then:
        required: [comment]
        properties:
          comment:
            type: string
            minLength: 1

    RegistryKind:
      type: string
      enum: [letter_in, letter_out, quote, memo, application, report, contract, invoice, act]
      description: 'Вкладки «Все документы»: письма (входящие, исходящие), КП (маршруты одобрения), служебные, заявления, отчёты; с 0.7.0 — договоры, счета и акты проектов (проекция событий ERP)'
    RegistryItem:
      type: object
      additionalProperties: false
      required: [kind, id, number, title, status, registered_at, responsible, client, links]
      properties:
        kind:
          $ref: '#/components/schemas/RegistryKind'
        id:
          $ref: '#/components/schemas/Uuid'
          description: Письмо (`letter_in`), документ (`letter_out`, `memo`, `application`, `report`), маршрут (`quote`) или проекция документа проекта (`contract`, `invoice`, `act`)
        number:
          type: [string, 'null']
          description: Номер реестра EDS или номер КП, договора, счёта, акта ERP; `null` — исходящее до отправки
        title:
          type: string
        status:
          type: string
          description: Значение `LetterStatus`, `DocumentStatus` или `RouteStatus` по типу; у `contract`, `invoice`, `act` — слово SPEC-v3 §2.4 (см. 0.5.0)
        registered_at:
          type: string
          format: date-time
        responsible:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        client:
          oneOf:
            - $ref: '#/components/schemas/LetterSender'
            - type: 'null'
        links:
          $ref: '#/components/schemas/ErpLinks'
    RegistryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegistryItem'
        next_cursor:
          type: [string, 'null']
