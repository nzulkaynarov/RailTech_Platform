  /api/v1/employees:
    get:
      tags: [letters]
      operationId: listActiveEmployees
      summary: Активные сотрудники — адресат, исполнитель, «ознакомить» (P8b)
      description: |
        Активные сотрудники проекции (без «надгробий»), по имени. Для выбора адресата при регистрации и людей резолюции
        пути делопроизводства: исполнитель — любой активный сотрудник, без проверки зоны (SPEC-v3 §3.2a п. 2).
      x-rt-permissions: [letters.register, letters.resolve]
      responses:
        '200':
