        - subject
        - summary
        - sender
        - received_at
        - registered_at
        - registered_by
        - addressee
        - manager
        - urgent
        - links
        - files
        - resolution
        - return_comment
        - reject_reason
        - journal
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        number:
          $ref: '#/components/schemas/LetterNumber'
        status:
          $ref: '#/components/schemas/LetterStatus'
