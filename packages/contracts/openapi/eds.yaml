  /api/v1/documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Документы (служебные записки, заявления, отчёты, исходящие письма)
      description: |
        Без `registry.read` — только документы, где сотрудник автор или участник маршрута; с `registry.read` — все.
        В любом случае чужой черновик (`draft`) виден только автору (кроме письма, переданного на регистрацию, — его видит держатель
        `letters.register`), а чужое исходящее письмо (`letter_out`) — только с `letters.read`.
      x-rt-permissions: [memos.create, memos.approve, approvals.decide, registry.read]
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DocumentKind'
          style: form
          explode: true
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DocumentStatus'
          style: form
          explode: true
        - name: mine
          in: query
          required: false
          description: Только документы, где сотрудник — автор (`1`/`true`)
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница документов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [documents]
      operationId: createDocument
      summary: Создать документ (черновик)
      description: |
        `memo`, `application`, `report` — право `memos.create`; номер (`СЗ-`, `ЗЯ-`, `ОТ-ГГГГ/NNN`) присваивается при создании,
        публикуется `document.registered`; маршрут открывает `POST …/submit`. `letter_out` — черновик создаёт любой с
        `memos.create` или `letters.register` (P4, B-P8B-4: исполнитель готовит ответ), регистрирует только `letters.register`; номер
        `ИСХ-NNN/ГГ` присваивается при регистрации (`submit`), до неё `number = null`. Нет права на тип — 403 `FORBIDDEN`.
        Документ из сообщения чата — `source_message_id` (ссылка, текст и вложения передаёт клиент).
      x-rt-permissions: [memos.create, letters.register]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/documents/{document_id}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: Карточка документа
      description: |
        Автор, участник маршрута или сотрудник с `registry.read`; иначе 404 `NOT_FOUND` (существование не раскрывается).
        Чужой черновик — всегда 404; исходящее письмо — 404 без `letters.read`.
      x-rt-permissions: [memos.create, memos.approve, approvals.decide, registry.read]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Документ с решениями и журналом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [documents]
      operationId: updateDocument
      summary: Править черновик или возвращённый документ (без отправки)
      description: |
        Только автор; `memo`, `application`, `report` — из `draft` и `returned`, `letter_out` — из `draft` (поле `letter` — письмо на бланке, P4); другой статус —
        409 `CONFLICT` (`details.reason = invalid_state`), не автор — 403 (`details.reason = not_author`; чужой черновик не виден вовсе — 404). Меняются только
        переданные поля (`amount: null` и `due_date: null` очищают значение); `file_ids` привязывает файлы (уже привязанные
        к этому документу пропускаются, снять вложение нельзя); `erp_deal_id` — связь с проектом (заявкой) ERP. Версия
        не растёт (растёт при повторной отправке после возврата), номер и маршрут не меняются; в журнал — `document.updated`.
      x-rt-permissions: [memos.create, letters.register]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
      responses:
        '200':
          description: Документ с правками
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/documents/{document_id}/submit:
    post:
      tags: [documents]
      operationId: submitDocument
      summary: Отправить на согласование (или отправить исходящее письмо)
      description: |
        Только автор. `memo`, `application`, `report` из `draft` или `returned`: необязательные правки тела применяются,
        после возврата `version` растёт на 1; открывается маршрут (новый круг) — статус `on_approval`, `approval.requested`.
        Шаблоны (runbook §2.5): `memo` — директор (любой с `memos.approve`), затем, если указана сумма, бухгалтер (любой с
        `payments.confirm` — решение архитектора); `application`, `report` — директор. Статусы по решениям — `DocumentStatus`.
        `letter_out` из `draft` (регистрация ИСХ, право `letters.register`): автор или — для черновика, переданного на
        регистрацию (`registration-request`), — любой держатель `letters.register`; присваивается `ИСХ-NNN/ГГ`, статус `sent`,
        `document.registered`, затем `document.archived`; ИСХ «в ответ на ВХ» закрывает поручения «Подготовить ответ». Письмо с
        телом (P4): ставится рендер итогового PDF (номер и дата), а при `send = true` — отправка адресату, как только PDF готов
        (`letter.mailings`). Без `letters.register` — 403 (`details.permission`). Другой статус — 409 `CONFLICT`
        (`details.reason = invalid_state`).
      x-rt-permissions: [memos.create, letters.register]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSubmitIn'
      responses:
        '200':
          description: Отправлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/documents/{document_id}/sign:
    post:
      tags: [documents]
      operationId: signDocument
      summary: Подписать исходящее письмо или документ уполномоченным лицом (SIGN-3, ADR-0024)
      description: |
        Подписание официального документа уполномоченным лицом из реестра полномочий (`signing_authorities`).
        Подписант проверяется через `signing_resolve` (вид документа, сумма, валюта, дата, срок полномочия, замещение).
        По правилу «автор ≠ подписант» автор черновика не вправе подписать исходящее письмо сам, если в организации
        есть другие уполномоченные лица. При подписании документу присваивается регистрационный номер `ИСХ-NNN/ГГ`
        (для исходящих писем), генерируется криптографический код проверки подлинности (`verification_code`),
        статус переходит в `sent`, рендерится итоговый PDF/A без плашки «ПРОЕКТ», закрываются связанные поручения
        по входящему письму, публикуется событие `uz.railtech.eds.document.signed.v1`, и при `dispatch_method = email`
        и `send = true` запускается отправка адресату.
      x-rt-permissions: [letters.register, memos.approve]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSignIn'
      responses:
        '200':
          description: Документ успешно подписан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/documents/{document_id}/payment:
    post:
      tags: [documents]
      operationId: payDocument
      summary: «Оплачено» — оплата согласованной служебной записки (D2-4)
      description: |
        Бухгалтер фиксирует оплату записки с суммой, которую согласовал директор (SPEC-v3 §3.2 п. 5): `paid_on` — дата платежа
        (не позже сегодняшней по `Asia/Tashkent`), `amount` — сумма (валюта записки, не больше согласованной суммы),
        `receipt_file_id` — платёжка, загруженная `POST /files` (привязывается к документу), `note` — необязательно.
        Записка обязана быть в статусе `to_accountant`, а шаг «Бухгалтер» — ждать этого сотрудника (автор записки её не платит,
        если есть другой держатель права): иначе 409 `CONFLICT` (`details.reason = invalid_state`, `route_closed`) или 403
        `FORBIDDEN` (`not_your_step`). Шаг закрывается решением `approve` (`approval.decided`), документ получает `paid`,
        архивируется (`document.archived`), журнал — `document.paid` (дата, сумма, файл платёжки). Повтор с теми же датой и суммой
        возвращает прежний документ (идемпотентно); другие данные по оплаченной записке — 409 (`already_paid`). Сумма, валюта и дата
        вне правил — 422 `VALIDATION_FAILED` (`amount`: `must_be_positive`, `currency_mismatch`, `exceeds_approved`; `paid_on`: `in_future`).
      x-rt-permissions: [payments.confirm]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentPaymentIn'
      responses:
        '200':
          description: Записка оплачена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/documents/{document_id}/pdf:
    post:
      tags: [documents]
      operationId: requestDocumentPdf
      summary: Построить PDF письма на бланке (фоновый рендер, P4)
      description: |
        Только `letter_out` с телом (`letter.body`); иначе 409 `CONFLICT` (`details.reason = no_body`). Видит и строит автор, а
        держатель `letters.register` — черновик, переданный на регистрацию, и зарегистрированное письмо. PDF строит фоновый
        воркер EDS (`rt-docs`, WeasyPrint; B-094 — параллельность 1, отдельный процесс с тайм-аутом), **в запросе рендера нет**:
        ответ сразу — `DocumentPdf` со статусом `pending` (или `ready`, если такой PDF уже есть). Кэш — по SHA-256 тела, бланка,
        реквизитов письма и подписанта: тот же ввод второй раз не рендерится; неудачный рендер повторяется только этим вызовом.
        Черновик — без номера и даты регистрации (`final = false`), зарегистрированное письмо — с `ИСХ-NNN/ГГ` и датой
        (`final = true`, тот же файл уходит адресату). Бланк компании ещё не получен из ERP — 409 (`details.reason =
        letterhead_missing`, «Бланк компании не задан — Настройки · Компания и бланки»).
      x-rt-permissions: [memos.create, letters.register]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '202':
          description: Рендер поставлен в очередь или PDF уже готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPdf'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    get:
      tags: [documents]
      operationId: getDocumentPdf
      summary: Состояние PDF письма (опрос)
      description: |
        Последний запрошенный PDF документа: `pending` — готовится, `ready` — готов (`GET …/pdf/file`), `failed` — ошибка с
        причиной словами (`error`). PDF не запрашивался — 404 (`details.reason = pdf_not_requested`).
      x-rt-permissions: [memos.create, memos.approve, approvals.decide, registry.read]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Состояние PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPdf'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/documents/{document_id}/pdf/file:
    get:
      tags: [documents]
      operationId: downloadDocumentPdf
      summary: Скачать PDF письма (поток)
      description: |
        Готовый PDF последнего запроса — тот же файл, что в предпросмотре и во вложении письма адресату. Не готов — 409
        (`details.reason = pdf_not_ready`), не запрашивался — 404.
      x-rt-permissions: [memos.create, memos.approve, approvals.decide, registry.read]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: PDF
          headers:
            Content-Disposition:
              description: '`inline; filename*=UTF-8''''…`'
              schema:
                type: string
            ETag:
              description: SHA-256 ввода рендера (ключ кэша)
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/documents/{document_id}/registration-request:
    post:
      tags: [documents]
      operationId: requestDocumentRegistration
      summary: Передать письмо на регистрацию делопроизводителю (B-P8B-4)
      description: |
        Автор черновика `letter_out` без права `letters.register` (исполнитель поручения «Подготовить ответ») передаёт письмо
        делопроизводителю: `letter.registration_requested` = кто и когда, журнал `document.registration_requested`. Черновик
        становится виден держателям `letters.register` (реестр «Все документы», карточка), они строят PDF и регистрируют его
        (`POST …/submit`). Автор может продолжать править черновик. Повтор — без изменений. Не черновик — 409 (`invalid_state`),
        не автор — 403 (`not_author`), у письма нет тела — 409 (`no_body`). Делопроизводитель узнаёт сразу (EDS-REPLY-1):
        `notice.requested` держателям `letters.register` (если письмо «в ответ на ВХ») и задача в `GET /letter-tasks`
        (`registrations`); задача уходит при регистрации.
      x-rt-permissions: [memos.create, letters.register]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Передано на регистрацию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/documents/{document_id}/send:
    post:
      tags: [documents]
      operationId: sendDocument
      summary: Отправить зарегистрированное письмо адресату почтой (повтор)
      description: |
        Зарегистрированное (`sent`) письмо на бланке ещё раз уходит на `letter.recipient_email` через почтовый сервис CRM
        (событие `mail.requested`, вложение — итоговый PDF по подписанной ссылке): например, после настройки почты. Новая строка
        журнала отправки `letter.mailings` (`awaiting_pdf` → `requested` → `sent`/`failed` по итогу CRM `crm.mail.sent|failed`).
        Право `letters.register`. Нет адреса — 422 (`recipient_email`), не зарегистрировано — 409 (`invalid_state`), отправка
        уже идёт — 409 (`mail_in_progress`). Если письмо не ушло (`crm.mail.failed`, «почта не настроена»), автору и держателям
        `letters.register` приходит `notice.requested` (EDS-REPLY-1); этим же вызовом отправляют ещё раз.
      x-rt-permissions: [letters.register]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Отправка запрошена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letterhead:
    get:
      tags: [documents]
      operationId: getLetterhead
      summary: Бланк компании (проекция ERP) для формы письма
      description: |
        Проекция бланка из события `erp.letterhead.updated` (ERP — владелец реквизитов; админ правит их в Платформе:
        Настройки · Компания и бланки). `configured = false` — событие ещё не приходило (сохраните «Компания и бланки»);
        подписант по умолчанию — `signatory_name` и `signatory_position`.
      x-rt-permissions: []
      responses:
        '200':
          description: Бланк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letterhead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: Маршруты согласования («На согласовании», «Черновик КП»)
      description: |
        `mine=1` (по умолчанию) — маршруты, текущий шаг которых ждёт этого сотрудника (назначен по `crm_user_id` или он
        держит право шага). `mine=0` — без `registry.read` маршруты, где сотрудник автор или участник; с `registry.read` — все.
        Участник маршрута видит его всегда; остальные — маршрут документа, только если виден сам документ (исходящее письмо
        без `letters.read` и чужой черновик скрыты и при `registry.read`); КП — с `registry.read`.
      x-rt-permissions: [memos.create, memos.approve, approvals.decide, payments.confirm, registry.read]
      parameters:
        - name: mine
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RouteStatus'
          style: form
          explode: true
        - name: template
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ApprovalTemplate'
          style: form
          explode: true
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница маршрутов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/approvals/{approval_id}:
    get:
      tags: [approvals]
      operationId: getApproval
      summary: Карточка маршрута (шаги, чек-лист КП, снимок КП)
      description: |
        Автор объекта, участник маршрута (в том числе держатель права шага) или сотрудник с `registry.read`; иначе 404.
        Маршрут документа виден неучастнику, только если ему виден сам документ (D1-10); участнику — всегда.
        Снимок КП (`quote`) с себестоимостью и маржой — только тем, кто решает шаг маршрута КП (`approvals.decide`).
      x-rt-permissions: [memos.create, memos.approve, approvals.decide, payments.confirm, registry.read]
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      responses:
        '200':
          description: Маршрут
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/approvals/{approval_id}/decision:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Решение на текущем шаге (approve, return, reject)
      description: |
        Решает только тот, кого ждёт текущий шаг (назначен по `crm_user_id` или держит право шага); иначе 403
        `FORBIDDEN` (`details.reason = not_your_step`). `comment` обязателен для `return` и `reject` (422). КП: `approve`
        недоступно, пока не выполнены блокирующие строки чек-листа — визы и маржа (проверка на сервере; маржа сверяется с
        порогом резолюции EDS) — 409 `CONFLICT`, `details.reason = checklist_not_green`, `details.failed` — коды красных
        блокирующих строк. Строка «срок» (`due`, `blocking = false`) — предупреждение: КП, готовое позже срока резолюции,
        директор одобряет, осознанно приняв опоздание; маршрут получает `approved_late = true`, журнал — строку
        `approval.approved_late`, событие `approval.decided` — `approved_late: true` (решение архитектора 2026-10-26, C1-G-1).
        При одобрении КП присваивается `ИСХ-NNN/ГГ`, выбранные `channels` уходят в событие. Маршрут закрыт — 409
        (`details.reason = route_closed`). Каждое решение — строка журнала и `approval.decided`.
        Шаг «Бухгалтер» служебной записки с суммой: `approve` недоступно — 409 `CONFLICT`, `details.reason = payment_required`
        (оплату фиксирует `payDocument`: дата, сумма, платёжка); `return` и `reject` работают.
      x-rt-permissions: [memos.approve, approvals.decide, payments.confirm]
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionIn'
      responses:
        '200':
          description: Решение принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/registry:
    get:
      tags: [registry]
      operationId: listRegistry
      summary: Реестр «Все документы» (SPEC-v3 §7.3)
      description: |
        Единый реестр с вкладками по типу и фильтрами статус · период · ответственный · клиент. КП — маршруты одобрения
        (номер КП ERP); договоры, счета и акты проектов (0.7.0, D2-5) — проекция событий ERP: `title` — название сделки,
        `client` и `responsible` — из письма по той же заявке (нет письма — `null`), `links.deal_number` — номер сделки в ERP.

        `registry.read` открывает сам реестр, но он **не шире прав на вид документа**: входящие и исходящие письма
        (`letter_in`, `letter_out`) попадают в выдачу только у сотрудника с `letters.read`; черновики (`status = draft`) —
        только у автора; служебные записки, заявления и отчёты — по видимости документа, КП — по видимости маршрута.
        Отбор идёт до курсора и ограничения страницы: скрытые строки не занимают место на странице. Вкладка, на которую
        у сотрудника нет прав, — `200` с пустой страницей, не `403`.
      x-rt-permissions: [registry.read]
      parameters:
        - $ref: '#/components/parameters/RegistryKind'
        - $ref: '#/components/parameters/RegistryStatus'
        - $ref: '#/components/parameters/RegistryDateFrom'
        - $ref: '#/components/parameters/RegistryDateTo'
        - $ref: '#/components/parameters/RegistryResponsible'
        - $ref: '#/components/parameters/RegistryClient'
        - $ref: '#/components/parameters/RegistryNumber'
        - $ref: '#/components/parameters/RegistryQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница реестра
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/registry/export:
    get:
      tags: [registry]
      operationId: exportRegistry
      summary: Экспорт реестра с теми же фильтрами
      description: |
        Не больше 10 000 строк (иначе 422 `VALIDATION_FAILED`, `details.reason = export_too_large`); в журнал — `registry.export`.
        Видимость строк — как у `GET /registry`: письма только с `letters.read`, чужие черновики не выгружаются.
      x-rt-permissions: [registry.export]
      parameters:
        - $ref: '#/components/parameters/RegistryKind'
        - $ref: '#/components/parameters/RegistryStatus'
        - $ref: '#/components/parameters/RegistryDateFrom'
        - $ref: '#/components/parameters/RegistryDateTo'
        - $ref: '#/components/parameters/RegistryResponsible'
        - $ref: '#/components/parameters/RegistryClient'
        - $ref: '#/components/parameters/RegistryNumber'
        - $ref: '#/components/parameters/RegistryQuery'
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [xlsx, csv]
            default: xlsx
      responses:
        '200':
          description: Файл реестра
          headers:
            Content-Disposition:
              description: '`attachment; filename*=UTF-8''''…`'
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/files:
    post:
      tags: [files]
      operationId: uploadFile
      summary: Загрузить файл или новую версию файла
      description: |
        `multipart/form-data`: `file` и необязательный `version_of` (id файла — новая версия той же цепочки; прежние версии
        остаются). Не больше 25 МБ (413), типы — PDF, изображения, документы Office (415). Файл привязывается к документу
        полем `file_ids` при создании или отправке; непривязанный видит только загрузивший.
      x-rt-permissions: [letters.register, letters.resolve, memos.create, memos.approve, approvals.decide, files.upload]
      parameters:
