            - $ref: '#/components/schemas/LetterKindCode'
            - type: 'null'
        receipt_method:
          oneOf:
            - $ref: '#/components/schemas/ReceiptMethod'
            - type: 'null'
        signed_by:
          type: [string, 'null']
          maxLength: 255
          description: Кто подписал у отправителя
        document_due:
          type: [string, 'null']
          format: date
          description: Срок по документу (срок ответа или исполнения, указанный отправителем)
        related_number:
          type: [string, 'null']
          minLength: 1
          maxLength: 32
          description: Номер предыдущего ВХ или нашего ИСХ, на который ссылается письмо
        addressee_crm_user_id:
          type: [integer, 'null']
          description: На чьё имя (активный сотрудник); нет — директор
        resolution_draft:
          oneOf:
            - $ref: '#/components/schemas/ResolutionDraftIn'
            - type: 'null'
          description: Проект резолюции делопроизводителя (P8b) — те же правила, что у `PUT …/resolution-draft`
        manager_crm_user_id:
          type: [integer, 'null']
          description: Ответственный менеджер
        urgent:
          type: boolean
          default: false
        links:
          $ref: '#/components/schemas/ErpLinksIn'
        file_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
        source:
          oneOf:
            - $ref: '#/components/schemas/LetterSourceIn'
            - type: 'null'
          description: >-
            Откуда письмо (W18A-P2): письмо общего ящика CRM, зарегистрированное из очереди «Входящая почта», — уходит в
            `letter.registered.source`, CRM снимает письмо с очереди и пишет номер ВХ
        force:
          type: boolean
          default: false
          description: Зарегистрировать, хотя то же письмо уже есть (EDS-DUP); нужна `force_reason`
        force_reason:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000
          description: Почему это другое письмо (повторное письмо с тем же номером и т. п.) — в журнал ВХ
    LetterSourceIn:
      type: object
      additionalProperties: false
