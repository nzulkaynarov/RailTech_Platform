          type: integer
          minimum: 0

    Amount:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Деньги строкой с двумя знаками
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
    MarginPct:
      type: string
      pattern: '^(100(\.0{1,2})?|\d{1,2}(\.\d{1,2})?)$'
      description: Процент 0–100 строкой, до двух знаков (`15`, `12.5`)
    LetterNumber:
      type: string
      pattern: '^ВХ-\d{3,}/\d{2}$'
      examples: [ВХ-104/26]
    OutgoingNumber:
      type: string
      pattern: '^ИСХ-\d{3,}/\d{2}$'
      examples: [ИСХ-082/26]
    DocumentNumber:
      type: string
      pattern: '^(ИСХ-\d{3,}/\d{2}|(СЗ|ЗЯ|ОТ)-\d{4}/\d{3,})$'
      description: '`СЗ-ГГГГ/NNN`, `ЗЯ-ГГГГ/NNN`, `ОТ-ГГГГ/NNN`, `ИСХ-NNN/ГГ` (исходящее письмо)'
      examples: [СЗ-2026/031]

    PersonRef:
      type: object
      additionalProperties: false
      required: [crm_user_id, full_name]
      properties:
        crm_user_id:
          type: integer
        full_name:
          type: string

    Me:
      type: object
      additionalProperties: false
      required: [crm_user_id, full_name, email, permissions]
      properties:
        crm_user_id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EdsPermission'
          description: Права по проекции на момент запроса

    SsoExchangeIn:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 4096
          description: Токен сотрудника CRM с `aud = eds`
    AccessToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
          const: 900
          description: Секунды; refresh нет

    Health:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        version:
          type: string
          description: Версия сборки сервиса
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          description: Зависимости (`database`, …)

    ErpLinks:
      type: object
      additionalProperties: false
      required: [erp_request_id, erp_deal_id, deal_number]
      description: Ссылки на заявку и сделку ERP и клиента CRM; `null` — ещё не связано
      properties:
        erp_request_id:
          type: [integer, 'null']
        erp_deal_id:
          type: [integer, 'null']
        deal_number:
          type: [string, 'null']
          maxLength: 64
          description: Бизнес-номер заявки или проекта ERP (`ЗВ-ГГГГ-NNN`, `ПР-ГГГГ-NNN`)
        crm_client_id:
          type: [integer, 'null']
        erp_company_id:
          type: [integer, 'null']
    ErpLinksIn:
      type: object
      additionalProperties: false
      properties:
        erp_request_id:
          type: [integer, 'null']
        erp_deal_id:
          type: [integer, 'null']
        deal_number:
          type: [string, 'null']
          maxLength: 64
        crm_client_id:
          type: [integer, 'null']
        erp_company_id:
          type: [integer, 'null']

    JournalEntry:
      type: object
      additionalProperties: false
      required: [at, action, by]
      description: Строка журнала «кто, что, когда, файл»
      properties:
        at:
          type: string
          format: date-time
        action:
          type: string
          pattern: '^[a-z_.]+$'
          description: '`letter.registered`, `letter.resolved`, `document.submitted`, `approval.decided`, `file.attached`, …'
          examples: [approval.decided]
        by:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
