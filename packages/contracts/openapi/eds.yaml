        text:
          type: [string, 'null']
          maxLength: 100000
          description: Текст письма; BFF берёт его из CRM при регистрации. Хранится в карточке ВХ (`Letter.body_text`), в событие шины не уходит
    LetterListItem:
      type: object
      additionalProperties: false
