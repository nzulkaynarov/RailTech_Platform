  /api/v1/letter-duplicates:
    get:
      tags: [letters]
      operationId: findLetterDuplicates
      summary: Проверка дубля перед регистрацией (корреспондент + исх. №)
      description: |
        P8 (SPEC-v3 §3.2a п. 1): письма с тем же исходящим номером отправителя и тем же корреспондентом — по названию (без
        учёта регистра и лишних пробелов) или по клиенту CRM. Не больше пяти, новые первыми. Это предупреждение: регистрация
        дубля не запрещена. Без названия и без клиента — пустой список.
      x-rt-permissions: [letters.read, letters.register]
      parameters:
        - name: ref_number
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: sender_name
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
        - name: crm_client_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Возможные дубли
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterDuplicateList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/duplicates-check:
    post:
      tags: [letters]
      operationId: checkLetterDuplicates
      summary: Проверка дублей до регистрации (точное совпадение и похожие)
      description: |
        EDS-DUP. Форма регистрации зовёт её в фоне по мере заполнения. `exact` — то же письмо: корреспондент (ИНН у обоих —
        по ИНН, иначе по нормализованному названию: регистр, кавычки, ООО/OOO/LLC/MChJ и т. п., лишние пробелы, или тот же
        клиент CRM) + исходящий номер отправителя (без регистра и пробелов; «б/н», «-», «нет», «без номера» и номер без
        букв и цифр — пустой, такой письмо не совпадает) + дата исходящего; такая регистрация без `force` получит 409
        `duplicate_letter`. `similar` — похожие, регистрации не мешают: `same_subject` — тот же корреспондент и
        та же тема, дата получения в пределах ±3 дней; `same_ref` — тот же корреспондент и исходящий номер с другой или
        пустой датой; `same_file` — вложение с тем же SHA-256 (`file_ids` — свои непривязанные файлы формы). Письма со
        статусом `duplicate` не возвращаются. Не больше пяти, точные первыми.
      x-rt-permissions: [letters.read, letters.register]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterDuplicateCheckIn'
      responses:
        '200':
          description: Найденные совпадения (может быть пусто)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterDuplicateCheck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters:
    get:
      tags: [letters]
      operationId: listLetters
      summary: Входящие письма
      x-rt-permissions: [letters.read]
      parameters:
        - name: status
          in: query
          required: false
          description: Только письма в этих статусах (несколько — через повтор параметра)
          schema:
            type: array
            items:
              $ref: '#/components/schemas/LetterStatus'
          style: form
          explode: true
        - name: q
          in: query
          required: false
          description: Поиск по номеру, теме, отправителю, номеру заявки
          schema:
            type: string
            maxLength: 200
        - name: on_control
          in: query
          required: false
          description: Только письма на контроле (`true`) — фильтр журнала «На контроле» (P8b)
          schema:
            type: boolean
        - name: overdue
          in: query
          required: false
          description: Только письма с просроченным поручением (`true`) — фильтр «Просрочено» (P8b)
          schema:
            type: boolean
        - name: kind
          in: query
          required: false
          description: Только письма этого вида документа — код справочника `letter-kinds` (EDS-REG)
          schema:
            type: string
            pattern: '^[a-z][a-z_]{0,31}$'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница писем
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [letters]
      operationId: registerLetter
      summary: Зарегистрировать входящее письмо (номер ВХ-NNN/ГГ)
      description: |
        Ручная регистрация. Письмо по заявке из CRM EDS регистрирует сам по событию `uz.railtech.erp.request.created.v1`
        (ссылки `ErpLinks` заполнены). Номер присваивается в транзакции создания; статус сразу `awaiting_resolution`;
        публикуется `letter.registered`.

        Карточка делопроизводства (P8, SPEC-v3 §3.2a п. 1): `kind` — действующий код справочника `letter-kinds` (иначе
        422, в `details.fields` — поле `kind` с `unknown_kind`), `receipt_method` — действующий код `receipt-methods`
        (иначе `receipt_method` с `unknown_method`); вид с `urgent` ставит `urgent = true` сам; `related_number` —
        номер предыдущего ВХ или нашего ИСХ (нет такого — 422, поле `related_number` с `not_found`); `summary` не задано —
        берётся тема.

        Письмо общего ящика CRM (`source.crm_inbound_mail_id`, W18A-P2-3): одно письмо — один ВХ. Повторная регистрация
        того же письма (другой `Idempotency-Key`, повтор после обрыва, двойное нажатие) возвращает уже созданный ВХ —
        `200` вместо `201`, без нового номера и без второго `letter.registered`. Две одновременные регистрации дают один
        ВХ (частичный уникальный индекс по источнику).

        Дубль (EDS-DUP): то же письмо (см. `POST /letters/duplicates-check`, `exact`) уже зарегистрировано — 409 `CONFLICT`,
        `details.reason = duplicate_letter`, `details.duplicate` — найденный ВХ (`LetterDuplicate`); ВХ не создаётся.
        Зарегистрировать всё равно (повторное письмо с тем же номером) — `force = true` и `force_reason` (без причины — 422,
        поле `force_reason` с `required`); причина и номер найденного ВХ — в журнал (`letter.duplicate_forced`). Две
        одновременные регистрации одного письма без `force` дают один ВХ (частичный уникальный индекс по ключу точного
        совпадения): вторая получает 409 `duplicate_letter`.
      x-rt-permissions: [letters.register]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterCreate'
      responses:
        '200':
          description: Письмо общего ящика уже зарегистрировано — прежний ВХ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '201':
          description: Зарегистрировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}:
    get:
      tags: [letters]
      operationId: getLetter
      summary: Карточка входящего письма
      description: |
        Держатель `letters.read` видит любое письмо. Без него (P8b, SPEC-v3 §3.2a «Права») — только письмо, где сотрудник
        исполнитель поручения, в списке «ознакомить» или автор резолюции; иначе 403 `FORBIDDEN`
        (`details.permission = [letters.read]`). Файлы такого письма и отчётов поручений он скачивает так же.
      x-rt-permissions: []
      parameters:
        - $ref: '#/components/parameters/LetterId'
      responses:
        '200':
          description: Письмо с резолюцией и журналом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/letters/{letter_id}/resolution:
    post:
      tags: [letters]
      operationId: resolveLetter
      summary: Утвердить резолюцию → задание в ERP
      description: |
        Только письмо в статусе `awaiting_resolution` (иначе 409 `CONFLICT`, `details.reason = invalid_state`). Статус →
        `resolved`; публикуется `letter.resolved` (исполнители, срок, мин. маржа, ссылки на заявку и сделку ERP) — ERP создаёт
        задание расчёта (EDS-01). Исполнители — активные сотрудники проекции (иначе 422, `details.fields.assignees =
        not_active_employee`), у каждого — раздел каталога его зоны на уровне `full`: товары — `erp.calc.goods`, услуги —
        `erp.calc.services`, условия оплаты — `eds.payments` (проекция берёт разделы из `identity.user.*`,
        `user.permissions.sections`; иначе 422, `details.fields.assignees = assignee_zone_mismatch`; D1-8, B-007). Срок
        `due` — не раньше сегодняшней даты по `Asia/Tashkent` (иначе 422, `details.fields.due`; решение архитектора
        2026-10-26, C1-G-1). Письмо пути делопроизводства (`Letter.track = office`) — 409, `details.reason = track_mismatch`:
        его резолюция — `POST …/office-resolution` (P8b).
      x-rt-permissions: [letters.resolve]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolutionIn'
      responses:
        '200':
          description: Резолюция наложена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/return:
    post:
      tags: [letters]
      operationId: returnLetter
      summary: Вернуть письмо менеджеру с комментарием
      description: |
        Только из `awaiting_resolution`; статус → `returned` — письмо у регистратора (`letters.register`), который правит его
        и подаёт снова (`POST …/submit`); публикуется `letter.returned`.
      x-rt-permissions: [letters.resolve]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterReturnIn'
      responses:
        '200':
          description: Возвращено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/reject:
    post:
      tags: [letters]
      operationId: rejectLetter
      summary: Отклонить письмо с причиной
      description: |
        Только из `awaiting_resolution`; статус → `rejected`; публикуется `letter.rejected` — ERP переводит сделку в `LOST`
        с причиной. Письмо пути делопроизводства (`track = office`, P8b) отклоняется без события: отказ по такому письму
        сделку не закрывает.
      x-rt-permissions: [letters.resolve]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterRejectIn'
      responses:
        '200':
          description: Отклонено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/submit:
    post:
      tags: [letters]
      operationId: resubmitLetter
      summary: Подать возвращённое письмо на резолюцию повторно
      description: |
        Только из `returned`; необязательные правки применяются, статус → `awaiting_resolution`, номер прежний; в журнал —
        `letter.resubmitted` (события шины нет). Другой статус — 409 `CONFLICT` (`details.reason = invalid_state`).
      x-rt-permissions: [letters.register]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterSubmitIn'
      responses:
        '200':
          description: Снова ждёт резолюции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/duplicate:
    post:
      tags: [letters]
      operationId: markLetterDuplicate
      summary: «Это дубль ВХ-…» — закрыть повторно зарегистрированное письмо
      description: |
        EDS-DUP (ГОСТ Р 7.0.97: документ регистрируется один раз). Письмо получает статус-итог `duplicate` и ссылку
        `duplicate_of` на оригинал; номер не освобождается (журнал непрерывный). Поручения в работе отменяются (`cancelled`,
        запросы переноса — `rejected`), ожидающие «ознакомить» снимаются, «на контроле» снимается; в «Ждёт резолюции», «На
        контроле» и задачах письмо больше не участвует. Журнал — `letter.marked_duplicate` (оригинал и комментарий),
        `letter.work_cancelled` (сколько поручений и ознакомлений снято), у оригинала — `letter.duplicate_linked`. Событий
        шины нет.

        Оригинал — номер ВХ (`original_number`; без регистра и пробелов, латинские «BX» — как «ВХ»): нет такого — 422
        `original_number` с `not_found`; то же письмо — `same_letter`; оригинал сам дубль — `original_is_duplicate`; у
        письма уже есть свои дубли — `letter_has_duplicates` (цепочек нет). Ключ точного совпадения дубля переходит к
        оригиналу, только если это ключ оригинала по его же полям. Письмо уже дубль — 409 `invalid_state`. По письму уже
        есть резолюция (статус не `awaiting_resolution` и не `returned`) — без `confirm = true` 409 `resolution_exists`
        (`details.status`, `details.instructions` — поручений в работе). Письмо по заявке клиента (путь `calc`) после
        резолюции — 409 `calc_in_progress`: расчёт уже идёт, закрывают его в проекте.
      x-rt-permissions: [letters.register]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterMarkDuplicateIn'
      responses:
        '200':
          description: Письмо закрыто как дубль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/resolution-draft:
    put:
      tags: [letters]
      operationId: saveResolutionDraft
      summary: Проект резолюции делопроизводителя (P8b)
      description: |
        Делопроизводитель (или директор) заполняет проект резолюции пути делопроизводства (SPEC-v3 §3.2a п. 1–2): тип,
        ответственный, срок, текст, соисполнители, «ознакомить». Проект заменяется целиком; `null`-тело не принимается —
        пустой проект задаётся `{"kind": null}`. Директор утверждает его одним действием (`POST …/office-resolution` с теми
        же полями) или правит. Только письмо пути `office` (`Letter.track`; иначе 409, `details.reason = track_mismatch`) в
        статусе `awaiting_resolution` (иначе 409 `invalid_state`). Сотрудники — активные в проекции (иначе 422,
        `details.fields.<поле> = not_active_employee`); срок в прошлом — 422 `details.fields.due = due_in_past`. Журнал —
        `letter.draft_saved`; событий шины нет.
      x-rt-permissions: [letters.register, letters.resolve]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolutionDraftIn'
      responses:
        '200':
          description: Проект сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/office-resolution:
    post:
      tags: [letters]
      operationId: resolveOfficeLetter
      summary: Резолюция пути делопроизводства — К исполнению · Подготовить ответ · Для сведения (P8b)
      description: |
        SPEC-v3 §3.2a п. 2. Только письмо пути `office` (иначе 409, `details.reason = track_mismatch`) в статусе
        `awaiting_resolution` (иначе 409 `invalid_state`). `execute` и `reply`: обязательны ответственный и срок (не раньше
        сегодняшней даты по `Asia/Tashkent`; иначе 422 `details.fields.due = due_in_past`), создаются поручения
        ответственному и соисполнителям (статус `in_work`, общий срок), письмо → `in_execution`, `on_control = true`.
        `info`: ответственного и срока нет (переданные — 422 `details.fields.<поле> = not_allowed_for_info`), поручений нет,
        письмо → `noted`. «Ознакомить» — строки ознакомления у любого типа. Ответственный, соисполнители, «ознакомить» —
        любые активные сотрудники проекции без проверки зоны (иначе 422 `not_active_employee`); один человек дважды —
        422 `duplicate`. Проект резолюции очищается. Журнал `letter.resolved`. `letter.resolved` **не** публикуется (он
        для расчёта ERP по зонам); исполнители и «ознакомить» получают `notice.requested` (колокольчик и Telegram).
      x-rt-permissions: [letters.resolve]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficeResolutionIn'
      responses:
        '200':
          description: Резолюция наложена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/acquaint:
    post:
      tags: [letters]
      operationId: acknowledgeLetter
      summary: «Ознакомлен» (P8b)
      description: |
        Сотрудник из списка «ознакомить» отмечает, что ознакомился: строка получает дату. Повтор — без изменений (200).
        Сотрудника нет в списке — 404 `NOT_FOUND`. Журнал `letter.acknowledged`.
      x-rt-permissions: []
      parameters:
        - $ref: '#/components/parameters/LetterId'
      responses:
        '200':
          description: Отмечено
          content:
            application/json:
