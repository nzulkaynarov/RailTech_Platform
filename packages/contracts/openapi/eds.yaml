            schema:
              $ref: '#/components/schemas/FileUploadIn'
      responses:
        '201':
          description: Файл сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRef'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: '`PAYLOAD_TOO_LARGE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/files/{file_id}:
    get:
      tags: [files]
      operationId: downloadFile
      summary: Скачать файл (поток)
      description: |
        Последняя версия, или `version`. Видит тот, кому виден документ, к которому файл привязан (чужой черновик и исходящее письмо без `letters.read` не видны), или загрузивший; иначе 404.
      x-rt-permissions: [letters.read, memos.create, memos.approve, approvals.decide, registry.read, files.upload]
      parameters:
        - $ref: '#/components/parameters/FileId'
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Содержимое файла
          headers:
            Content-Disposition:
              description: '`attachment; filename*=UTF-8''''…`'
              schema:
                type: string
            ETag:
              description: SHA-256 содержимого версии
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/files/{file_id}/versions:
    get:
      tags: [files]
      operationId: listFileVersions
      summary: Версии файла
      x-rt-permissions: [letters.read, memos.create, memos.approve, approvals.decide, registry.read, files.upload]
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Версии от последней к первой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileVersions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/bus/overview:
    get:
      tags: [bus]
      operationId: busOverview
      summary: Сводка шины EDS — outbox, DLQ, inbox и подписчики
      x-rt-permissions: [bus.manage]
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/bus/deliveries:
    get:
      tags: [bus]
      operationId: busDeliveries
      summary: Доставки событий EDS подписчикам (DLQ — `status=dead`), новые сверху
      x-rt-permissions: [bus.manage]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BusDeliveryStatus'
        - $ref: '#/components/parameters/BusSubscriberQuery'
        - $ref: '#/components/parameters/BusTypeQuery'
        - name: created_from
          in: query
          required: false
          description: Доставка создана не раньше (включительно)
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          required: false
          description: Доставка создана раньше (не включительно)
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          required: false
          description: Страница — id последней строки предыдущей страницы
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница доставок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusDeliveryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/bus/deliveries/{delivery_id}/retry:
    post:
      tags: [bus]
      operationId: busRetryDelivery
      summary: «Повторить» доставку `dead` или ожидающую — сейчас, попытки с нуля; подписчик на паузе получает пробу
      x-rt-permissions: [bus.manage]
      parameters:
        - name: delivery_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Сколько поставлено на повтор (0 — доставлено, в работе или нет такой)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusRetryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/bus/deliveries/retry-dead:
    post:
      tags: [bus]
      operationId: busRetryDead
      summary: «Повторить все dead подписчика» — после исправления причины
      x-rt-permissions: [bus.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusRetryDeadIn'
      responses:
        '200':
          description: Сколько доставок `dead` поставлено на повтор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusRetryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/bus/inbox:
    get:
      tags: [bus]
      operationId: busInbox
      summary: Принятые события, новые сверху; `errors=true` — обработка упала или ждёт автоповтора
      x-rt-permissions: [bus.manage]
      parameters:
        - name: errors
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BusInboxStatus'
        - $ref: '#/components/parameters/BusTypeQuery'
        - name: before
          in: query
          required: false
          description: Страница — `received_at` последней строки предыдущей страницы
          schema:
            type: string
            format: date-time
        - name: before_event_id
          in: query
          required: false
          description: Страница — `event_id` последней строки (строки с тем же временем не теряются)
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница принятых событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusInboxPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/bus/inbox/{event_id}/retry:
    post:
      tags: [bus]
      operationId: busRetryInbox
      summary: «Повторить обработку» записи `failed` или `skipped`
      x-rt-permissions: [bus.manage]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Сколько поставлено на повтор (0 — обработано, ждёт или нет такой записи)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusRetryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

components:
  securitySchemes:
    edsAccess:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен доступа EDS из `POST /api/v1/auth/sso/exchange` (HS256, `iss = eds`, `aud = eds-api`, 15 минут); токен сотрудника CRM (`aud = eds`) здесь отклоняется — 401 `UNAUTHORIZED`

  parameters:
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AuthorityId:
      name: authority_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DictionaryKind:
      name: kind
      in: path
      required: true
      description: Вид справочника (`letter-kinds`, `receipt-methods`); неизвестный — 404
      schema:
        type: string
        pattern: '^[a-z][a-z-]{0,31}$'
    DictionaryCode:
      name: code
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DictionaryCode'
    LetterId:
      name: letter_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InstructionId:
      name: instruction_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозрачный курсор из `next_cursor`
      schema:
        type: string
        maxLength: 500
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    BusSubscriberQuery:
      name: subscriber
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BusSubscriberName'
    BusTypeQuery:
      name: type
      in: query
      required: false
      description: Подстрока типа события (`quote.`, `letter.registered`)
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Ключ повтора (24 часа)
      schema:
        type: string
        minLength: 8
        maxLength: 128
    RegistryKind:
      name: kind
      in: query
      required: false
      description: Вкладки реестра (несколько — повтором параметра)
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RegistryKind'
      style: form
      explode: true
    RegistryStatus:
      name: status
      in: query
      required: false
      description: Статус объекта (значения — `LetterStatus`, `DocumentStatus`, `RouteStatus` по типу)
      schema:
        type: array
        items:
          type: string
          pattern: '^[a-z_]+$'
      style: form
      explode: true
    RegistryDateFrom:
      name: date_from
      in: query
      required: false
      description: Дата регистрации с (включительно, `Asia/Tashkent`)
      schema:
        type: string
        format: date
    RegistryDateTo:
      name: date_to
      in: query
      required: false
      description: Дата регистрации по (включительно)
      schema:
        type: string
        format: date
    RegistryResponsible:
      name: responsible
      in: query
      required: false
      description: Ответственный — `crm_user_id` (менеджер письма, автор документа, кто решает текущий шаг)
      schema:
        type: integer
    RegistryClient:
      name: crm_client_id
      in: query
      required: false
      description: Клиент CRM
      schema:
        type: integer
    RegistryNumber:
      name: number
      in: query
      required: false
      description: Точный номер (`ВХ-104/26`, `СЗ-2026/031`, `КП-2026/115`)
      schema:
        type: string
        maxLength: 64
    RegistryQuery:
      name: q
      in: query
      required: false
      description: Поиск по номеру и теме
      schema:
        type: string
        maxLength: 200

  responses:
    Unauthorized:
      description: '`UNAUTHORIZED` — нет, неверный или истёкший токен доступа EDS (`details.reason`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`FORBIDDEN` — нет права (`details.permission`) или действие не положено (`details.reason`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: '`CONFLICT` — `details.reason`: `invalid_state`, `route_closed`, `checklist_not_green`, `idempotency_key_reused`, `duplicate_letter`, `resolution_exists`, `calc_in_progress`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: '`VALIDATION_FAILED` — `details.fields` перечисляет поля'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, source]
      properties:
        code:
          type: string
          description: Стабильный код (`UNAUTHORIZED`, `INVALID_SSO_TOKEN`, `USER_NOT_PROVISIONED`, `USER_INACTIVE`, `FORBIDDEN`, `NOT_FOUND`, `VALIDATION_FAILED`, `CONFLICT`, `PAYLOAD_TOO_LARGE`, `UNSUPPORTED_MEDIA_TYPE`, `BAD_REQUEST`, `INTERNAL_ERROR`)
          examples: [FORBIDDEN]
        message:
          type: string
          description: Текст для сотрудника на его языке
        source:
          type: string
          enum: [eds]
        details:
          type: object
          description: '`reason`, `permission`, `fields` — для разбора, не для показа'
          additionalProperties: true

    LocalizedName:
      type: object
      additionalProperties: false
      required: [ru, uz, en]
      description: Название на трёх языках; пустые `uz` и `en` экран заменяет `ru`
      properties:
        ru: { type: string, minLength: 1, maxLength: 120 }
        uz: { type: string, maxLength: 120 }
        en: { type: string, maxLength: 120 }
    LocalizedNameIn:
      type: object
      additionalProperties: false
      required: [ru]
      properties:
        ru: { type: string, minLength: 1, maxLength: 120 }
        uz: { type: string, maxLength: 120 }
        en: { type: string, maxLength: 120 }
    DictionaryCode:
      type: string
      pattern: '^[a-z][a-z_]{0,31}$'
    DictionaryAttr:
      type: object
      additionalProperties: false
      required: [key, type, name]
      description: Дополнительное поле значения справочника (поведение — код, значение — данные)
      properties:
        key: { type: string, pattern: '^[a-z][a-z_]{0,31}$', examples: [due_days] }
        type: { type: string, enum: [boolean, integer] }
        name: { $ref: '#/components/schemas/LocalizedName' }
        minimum: { type: [integer, 'null'] }
        maximum: { type: [integer, 'null'] }
    Dictionary:
      type: object
      additionalProperties: false
      required: [kind, name, closed, attrs]
      properties:
        kind: { type: string, pattern: '^[a-z][a-z-]{0,31}$', examples: [letter-kinds] }
        name: { $ref: '#/components/schemas/LocalizedName' }
        closed:
          type: boolean
          description: Закрытый список поведения кода — только переименовать и переставить
        attrs:
          type: array
          items: { $ref: '#/components/schemas/DictionaryAttr' }
    DictionaryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Dictionary' }
    DictionaryAttrValues:
      type: object
      description: Значения полей `attrs` вида (`urgent`, `due_days` у видов документа); `null` — не задано
      additionalProperties:
        type: [boolean, integer, 'null']
    DictionaryItem:
      type: object
      additionalProperties: false
      required: [code, name, attrs, active, position]
      properties:
        code: { $ref: '#/components/schemas/DictionaryCode' }
        name: { $ref: '#/components/schemas/LocalizedName' }
        attrs: { $ref: '#/components/schemas/DictionaryAttrValues' }
        active:
          type: boolean
          description: '`false` — скрыто: в формах не предлагается, у старых писем остаётся'
        position: { type: integer, description: Порядок показа }
        used:
          type: [boolean, 'null']
          description: Значение уже есть у писем (удалить нельзя, только скрыть); `null` — не считалось (без `include_hidden`)
    DictionaryItemList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DictionaryItem' }
    DictionaryItemIn:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/LocalizedNameIn' }
        attrs: { $ref: '#/components/schemas/DictionaryAttrValues' }
    DictionaryItemPatch:
      type: object
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/LocalizedNameIn' }
        attrs: { $ref: '#/components/schemas/DictionaryAttrValues' }
        active: { type: boolean }
    DictionaryOrderIn:
      type: object
      additionalProperties: false
      required: [codes]
      properties:
        codes:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/DictionaryCode' }

    EdsPermission:
      type: string
      enum:
        - letters.read
        - letters.register
        - letters.resolve
        - memos.create
        - memos.approve
        - approvals.decide
        - registry.read
        - registry.export
        - payments.confirm
        - bus.manage
        - files.upload
        - signing.manage
      description: |
        Код права EDS v1 (runbook волны 12 §2.2; `platform-rbac.yaml`, `backend.eds`). `payments.confirm` — шаг «бухгалтер»
        маршрута служебной записки с суммой (решение архитектора). `bus.manage` (0.3.0, W13-A2) — «Журнал интеграций» шины:
        раздел `admin` каталога, уровень `full`. `files.upload` (D1-2b) — загрузить свой файл и читать свои файлы
        (письмо директору к «Создать заявку»): раздел `crm.clients`, уровень `full`. `signing.manage` (0.11.0, SIGN-2) — вести
        реестр полномочий подписи: раздел `eds.signing.manage`, уровень `full`. В событиях шины (`identity`, `eds`) код — строка по шаблону
        `^[a-z_]+\.[a-z_]+$`, не перечень: новый код не ломает события v1.

    Uuid:
      type: string
      format: uuid

    BusSubscriberName:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,63}$'
      description: Имя подписчика шины (`crm`, `erp`, `platform-bff`)
    BusDeliveryStatus:
      type: string
      enum: [pending, in_flight, delivered, dead]
    BusInboxStatus:
      type: string
      enum: [received, processed, failed, skipped]
    BusSubscriber:
      type: object
      additionalProperties: false
      required: [name, configured, enabled, drop, endpoint, pending, in_flight, dead, oldest_undelivered_age_seconds,
                 consecutive_failures, paused_until, last_failure_at, last_success_at, last_error]
      description: |
        Подписчик издателя. `configured = false` — его больше нет в файле подписок, но остались доставки или состояние.
        `paused_until` — действующая пауза предохранителя (в будущем), иначе `null`. `endpoint` — адрес приёмника: только
        схема, хост, порт и путь. `oldest_undelivered_age_seconds` — возраст самого старого недоставленного (без `dead`).
      properties:
        name:
          type: string
        configured:
          type: boolean
        enabled:
          type: boolean
        drop:
          type: boolean
        endpoint:
          type: [string, 'null']
        pending:
          type: integer
        in_flight:
          type: integer
        dead:
          type: integer
        oldest_undelivered_age_seconds:
          type: [number, 'null']
        consecutive_failures:
          type: integer
        paused_until:
          type: [string, 'null']
          format: date-time
        last_failure_at:
          type: [string, 'null']
          format: date-time
        last_success_at:
          type: [string, 'null']
          format: date-time
        last_error:
          type: [string, 'null']
    BusOverview:
      type: object
      additionalProperties: false
      required: [service, outbox_pending, oldest_undelivered_age_seconds, dlq_size, inbox_received, inbox_retrying,
                 inbox_failed, subscribers]
      properties:
        service:
          type: string
        outbox_pending:
          type: integer
        oldest_undelivered_age_seconds:
          type: [number, 'null']
        dlq_size:
          type: integer
        inbox_received:
          type: integer
        inbox_retrying:
          type: integer
        inbox_failed:
          type: integer
        subscribers:
          type: array
          items:
            $ref: '#/components/schemas/BusSubscriber'
    BusDelivery:
      type: object
      additionalProperties: false
      required: [id, event_id, event_type, subscriber, status, attempts, next_attempt_at, last_attempt_at, last_status_code,
                 last_error, delivered_at, created_at, subject, correlation_id, event_created_at]
      description: Метаданные доставки; тела события нет.
      properties:
        id:
          type: integer
        event_id:
          $ref: '#/components/schemas/Uuid'
        event_type:
          type: string
        subscriber:
          type: string
        status:
          $ref: '#/components/schemas/BusDeliveryStatus'
        attempts:
          type: integer
        next_attempt_at:
          type: [string, 'null']
          format: date-time
        last_attempt_at:
          type: [string, 'null']
          format: date-time
        last_status_code:
          type: [integer, 'null']
        last_error:
          type: [string, 'null']
        delivered_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        subject:
          type: [string, 'null']
        correlation_id:
          type: [string, 'null']
        event_created_at:
          type: [string, 'null']
          format: date-time
    BusDeliveryPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusDelivery'
        has_more:
          type: boolean
    BusInboxEntry:
      type: object
      additionalProperties: false
