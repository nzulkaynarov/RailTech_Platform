openapi: 3.1.0
info:
  title: RailTech Platform — EDS API (электронный документооборот)
  version: 0.4.0
  summary: Пространство `/api/v1/` сервиса EDS — вызывает BFF Платформы от имени сотрудника.
  description: |
    Контракт сервиса EDS (`apps/eds`, ADR-0015; `docs/runbooks/wave12-eds-c1.md` §2). EDS — владелец реестра документов и
    их номеров, входящих писем и резолюций, служебных записок, заявлений, отчётов, исходящих писем и общего движка маршрутов
    согласования. Коммерческие объекты (заявка, сделка, КП) живут в ERP; EDS хранит ссылки (`ErpLinks`) и снимок КП для
    показа в маршруте одобрения. Интеграции с CRM и ERP — только шина `rt_bus` (`events/eds/*.v1.json`, `bus/subscriptions.yaml`).

    **Кто зовёт.** Только BFF Платформы во внутренней сети compose: у EDS нет внешнего маршрута в Caddy и своей формы входа
    (решение архитектора 4 к волне 12). Машинный доступ — только приёмник шины `POST /bus/v1/events` (подпись HMAC,
    `docs/architecture/CONTRACTS.md` §9.3; в этом файле не описан).

    **Вход (решение лида L-C1-1, `docs/architecture/sso-token.md`, «Токен сотрудника для EDS»).** BFF берёт у CRM токен
    сотрудника `POST /api/v1/auth/sso/token {"aud": "eds"}` (JWT HS256, `PLATFORM_SSO_SECRET`, `iss=crm`, `aud=eds`,
    `sub=crm_user_id`, срок 60 с, одноразовый `jti`) и обменивает его здесь: `POST /api/v1/auth/sso/exchange` → собственный
    токен доступа EDS (JWT HS256, секрет `EDS_ACCESS_SECRET`, `iss = eds`, `aud = eds-api`, срок 15 минут, без refresh: истёк — BFF берёт у CRM новый токен
    сотрудника и обменивает снова). Каждый запрос `/api/v1/*`, кроме обмена, — `Authorization: Bearer <токен доступа EDS>`.

    **0.4.0 (D1-5).** Добавляющее изменение: `PATCH /api/v1/documents/{document_id}` — правка черновика (или возвращённого документа) без отправки.

    **Права (runbook §2.2).** Коды EDS v1: `letters.read`, `letters.register`, `letters.resolve`, `memos.create`, `memos.approve`,
    `approvals.decide`, `registry.read`, `registry.export`, `payments.confirm` (`EdsPermission`; `payments.confirm` — решение
    архитектора: шаг «бухгалтер» служебной записки с суммой), с 0.3.0 — `bus.manage` (журнал шины, раздел `admin` каталога). Их вычисляет CRM из ролей Платформы по каталогу
    (`platform-rbac.yaml`, `backend.eds`) и публикует в `identity.user.created/updated` (`user.permissions.eds`); EDS держит
    проекцию сотрудников и проверяет право **на каждый запрос по проекции на момент запроса** (claim `permissions` токена —
    справочный, не применяется): отзыв роли или отключение сотрудника действуют сразу, без ожидания срока токена. Нет поля
    `permissions` или `permissions.eds` в снимке сотрудника, или список пуст — доступа к EDS нет.
    У каждой операции — расширение `x-rt-permissions`: список кодов, **любого** из которых достаточно для вызова
    (403 `FORBIDDEN` иначе); пустой список — любой активный сотрудник из проекции. Сужение выдачи внутри операции (свои
    документы, шаг маршрута, тип документа) описано в операции. Тесты сервиса сверяют таблицу маршрутов с этим расширением.

    **Ошибки.** Тело любой ошибки — `Error` (как у BFF): стабильный `code`, текст на языке сотрудника, `source = eds`,
    `details` для разбора. Коды: `UNAUTHORIZED` (401: нет, неверный или истёкший токен доступа; `details.reason`),
    `INVALID_SSO_TOKEN` (401 обмена: `details.reason` — `signature`, `issuer`, `audience`, `expired`, `lifetime`, `replayed`,
    `malformed`),
    `USER_NOT_PROVISIONED`, `USER_INACTIVE` (403 обмена), `FORBIDDEN` (403, `details.permission` — недостающее право, или
    `details.reason`), `NOT_FOUND`, `VALIDATION_FAILED` (422, `details.fields`), `CONFLICT` (409, `details.reason`),
    `PAYLOAD_TOO_LARGE` (413), `UNSUPPORTED_MEDIA_TYPE` (415), `BAD_REQUEST`, `INTERNAL_ERROR`.

    **Идентификаторы и номера.** Объекты EDS адресуются в пути **стабильным id (UUID)**, не номером: номер реестра содержит
    `/` (`ВХ-104/26`), а `%2F` в пути проксируется и декодируется неодинаково. Номер — поле объекта и фильтр `number` реестра
    (`GET /api/v1/registry?number=ВХ-104/26`). Форматы (runbook §2.1): `ВХ-NNN/ГГ`, `ИСХ-NNN/ГГ`, `СЗ-ГГГГ/NNN`, `ЗЯ-ГГГГ/NNN`,
    `ОТ-ГГГГ/NNN`; счётчик — на тип и год по `Asia/Tashkent`, без пропусков (строка счётчика под `SELECT … FOR UPDATE` в
    транзакции создания); отменённый документ номер не возвращает. Номера ЗВ/ПР/КП/ДОГ/СЧ/АКТ — у ERP.

    **Списки** — курсорная пагинация: `cursor` (непрозрачный, из `next_cursor`) и `limit` (1–100, по умолчанию 50);
    `next_cursor = null` — страниц больше нет. Порядок — от новых к старым.

    **Идемпотентность.** Создающие `POST` принимают необязательный `Idempotency-Key` (повтор с тем же ключом и телом в течение
    24 часов возвращает прежний ответ; с другим телом — 409 `CONFLICT`, `details.reason = idempotency_key_reused`).

    **События.** Каждое изменение публикуется в той же транзакции (outbox): регистрация письма — `letter.registered`;
    резолюция, возврат, отказ — `letter.resolved`, `letter.returned`, `letter.rejected`; номер документа — `document.registered`;
    открытие маршрута (круга) — `approval.requested`; каждое решение — `approval.decided`. `document.archived` публикуется
    **автоматически, без отдельной операции**, когда маршрут документа завершён окончательно: одобрен на последнем шаге
    (служебная записка без суммы, заявление, отчёт — `approved`; с суммой — `paid`) или отклонён (`rejected`); исходящее письмо —
    при отправке (`sent`). Документ сохраняет итоговый статус, получает `archived_at`. Возврат на доработку маршрут не
    завершает. Входящие письма в C1 в архив не переносятся.

    **Входящее письмо — статусы и переходы** (SPEC-v3 §2.4; `LetterStatus`):

    | Из | Операция | В | Право | Событие |
    |---|---|---|---|---|
    | — | регистрация (`POST /letters` или по `erp.request.created`) | `awaiting_resolution` | `letters.register` | `letter.registered` |
    | `awaiting_resolution` | `POST …/resolution` | `resolved` | `letters.resolve` | `letter.resolved` |
    | `awaiting_resolution` | `POST …/return` | `returned` (письмо у регистратора) | `letters.resolve` | `letter.returned` |
    | `awaiting_resolution` | `POST …/reject` | `rejected` | `letters.resolve` | `letter.rejected` |
    | `returned` | `POST …/submit` (повторная подача, правки) | `awaiting_resolution` | `letters.register` | — (запись журнала `letter.resubmitted`) |

    `resolved` и `rejected` — конечные. Операция не из своего статуса — 409 `CONFLICT`, `details.reason = invalid_state`.
servers:
  - url: http://eds-api:8000
    description: внутренняя сеть compose (только BFF Платформы); снаружи маршрута нет
security:
  - edsAccess: []
tags:
  - name: system
  - name: auth
    description: Обмен токена сотрудника CRM на токен доступа EDS
  - name: letters
    description: Входящие письма и резолюции (EDS-01)
  - name: documents
    description: Служебные записки, заявления, отчёты, исходящие письма (EDS-02)
  - name: approvals
    description: Маршруты согласования — документы EDS и КП ERP (EDS-02, EDS-03)
  - name: registry
    description: Реестр «Все документы» и экспорт
  - name: files
    description: Файлы документов с версиями (S3 сервиса)
  - name: bus
    description: |
      «Журнал интеграций» шины `rt_bus` (W13-A2, `docs/architecture/rt-bus.md`, «Журнал в Admin»): сводка подписчиков,
      доставки и DLQ, принятые события с ошибками, повторы — вместо CLI `python -m app bus …`. Право `bus.manage` (раздел
      `admin` каталога Платформы, уровень `full`). Те же поля, что у CRM и ERP: BFF сводит три домена в один журнал, поэтому
      страницы здесь — явный keyset (`before_id`; `before` + `before_event_id`) и `has_more`, а не непрозрачный курсор.
      Тела событий API не отдаёт — только метаданные доставки. Повтор идемпотентен (нечего повторять — `retried: 0`) и пишется
      в журнал EDS (`bus.delivery_retried`, `bus.dead_retried`, `bus.inbox_retried`) с автором.

paths:
  /health:
    get:
      tags: [system]
      operationId: health
      summary: Живость сервиса и базы
      security: []
      responses:
        '200':
          description: Сервис и база доступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: База недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/v1/auth/sso/exchange:
    post:
      tags: [auth]
      operationId: ssoExchange
      summary: Обмен токена сотрудника CRM на токен доступа EDS
      description: |
        Проверки по порядку (`docs/architecture/sso-token.md`, «Проверка приёмником»): 1) подпись HS256 секретом
        `PLATFORM_SSO_SECRET` (оба активных значения); 2) `iss = crm` и `aud = eds`; 3) `exp` не прошёл (допуск часов 5 с) и
        `exp − iat ≤ 60` (с допуском — не больше 65 с); 4) `jti` не встречался — EDS хранит использованные `jti` 10 минут в
        своей базе; 5) сотрудник найден **только по `sub`** в проекции сотрудников EDS (`identity.user.*`) — нет: 403
        `USER_NOT_PROVISIONED`, `is_active = false`: 403 `USER_INACTIVE`. Отказы 1–4 — 401 `INVALID_SSO_TOKEN`
        (`details.reason`: `signature`, `issuer` — `iss ≠ crm`, `audience`, `expired`, `lifetime`, `replayed`, `malformed`).
        Обмен сотрудников не создаёт и прав не меняет (права — только из проекции). Выдаётся токен доступа EDS (HS256,
        `EDS_ACCESS_SECRET`, `iss = eds`, `aud = eds-api` — не `eds`, чтобы токен CRM и токен доступа не путались, `sub =
        crm_user_id`, срок 900 с); в журнал EDS — `sso.exchange`
        (`iss`, `sub`, `jti`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoExchangeIn'
      responses:
        '200':
          description: Токен доступа EDS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          description: '`INVALID_SSO_TOKEN` — подпись, `iss`, `aud`, срок, срок жизни или повтор `jti` (`details.reason`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`USER_NOT_PROVISIONED` — сотрудника нет в проекции EDS; `USER_INACTIVE` — отключён'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Сотрудник и его права EDS по проекции
      x-rt-permissions: []
      responses:
        '200':
          description: Сотрудник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/letters:
    get:
      tags: [letters]
      operationId: listLetters
      summary: Входящие письма
      x-rt-permissions: [letters.read]
      parameters:
        - name: status
          in: query
          required: false
          description: Только письма в этих статусах (несколько — через повтор параметра)
          schema:
            type: array
            items:
              $ref: '#/components/schemas/LetterStatus'
          style: form
          explode: true
        - name: q
          in: query
          required: false
          description: Поиск по номеру, теме, отправителю, номеру заявки
          schema:
            type: string
            maxLength: 200
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница писем
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [letters]
      operationId: registerLetter
      summary: Зарегистрировать входящее письмо (номер ВХ-NNN/ГГ)
      description: |
        Ручная регистрация. Письмо по заявке из CRM EDS регистрирует сам по событию `uz.railtech.erp.request.created.v1`
        (ссылки `ErpLinks` заполнены). Номер присваивается в транзакции создания; статус сразу `awaiting_resolution`;
        публикуется `letter.registered`.
      x-rt-permissions: [letters.register]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterCreate'
      responses:
        '201':
          description: Зарегистрировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}:
    get:
      tags: [letters]
      operationId: getLetter
      summary: Карточка входящего письма
      x-rt-permissions: [letters.read]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      responses:
        '200':
          description: Письмо с резолюцией и журналом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/letters/{letter_id}/resolution:
    post:
      tags: [letters]
      operationId: resolveLetter
      summary: Утвердить резолюцию → задание в ERP
      description: |
        Только письмо в статусе `awaiting_resolution` (иначе 409 `CONFLICT`, `details.reason = invalid_state`). Статус →
        `resolved`; публикуется `letter.resolved` (исполнители, срок, мин. маржа, ссылки на заявку и сделку ERP) — ERP создаёт
        задание расчёта (EDS-01). Исполнители — активные сотрудники проекции (иначе 422, `details.fields.assignees`). Срок
        `due` — не раньше сегодняшней даты по `Asia/Tashkent` (иначе 422, `details.fields.due`; решение архитектора
        2026-10-26, C1-G-1).
      x-rt-permissions: [letters.resolve]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolutionIn'
      responses:
        '200':
          description: Резолюция наложена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/return:
    post:
      tags: [letters]
      operationId: returnLetter
      summary: Вернуть письмо менеджеру с комментарием
      description: |
        Только из `awaiting_resolution`; статус → `returned` — письмо у регистратора (`letters.register`), который правит его
        и подаёт снова (`POST …/submit`); публикуется `letter.returned`.
      x-rt-permissions: [letters.resolve]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterReturnIn'
      responses:
        '200':
          description: Возвращено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/reject:
    post:
      tags: [letters]
      operationId: rejectLetter
      summary: Отклонить письмо с причиной
      description: |
        Только из `awaiting_resolution`; статус → `rejected`; публикуется `letter.rejected` — ERP переводит сделку в `LOST`
        с причиной.
      x-rt-permissions: [letters.resolve]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterRejectIn'
      responses:
        '200':
          description: Отклонено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/letters/{letter_id}/submit:
    post:
      tags: [letters]
      operationId: resubmitLetter
      summary: Подать возвращённое письмо на резолюцию повторно
      description: |
        Только из `returned`; необязательные правки применяются, статус → `awaiting_resolution`, номер прежний; в журнал —
        `letter.resubmitted` (события шины нет). Другой статус — 409 `CONFLICT` (`details.reason = invalid_state`).
      x-rt-permissions: [letters.register]
      parameters:
        - $ref: '#/components/parameters/LetterId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterSubmitIn'
      responses:
        '200':
          description: Снова ждёт резолюции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Letter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Документы (служебные записки, заявления, отчёты, исходящие письма)
      description: |
        Без `registry.read` — только документы, где сотрудник автор или участник маршрута; с `registry.read` — все.
      x-rt-permissions: [memos.create, memos.approve, approvals.decide, registry.read]
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DocumentKind'
          style: form
          explode: true
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DocumentStatus'
          style: form
          explode: true
        - name: mine
          in: query
          required: false
          description: Только документы, где сотрудник — автор (`1`/`true`)
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница документов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [documents]
      operationId: createDocument
      summary: Создать документ (черновик)
      description: |
        `memo`, `application`, `report` — право `memos.create`; номер (`СЗ-`, `ЗЯ-`, `ОТ-ГГГГ/NNN`) присваивается при создании,
        публикуется `document.registered`; маршрут открывает `POST …/submit`. `letter_out` — право `letters.register`; номер
        `ИСХ-NNN/ГГ` присваивается при отправке (`submit`), до неё `number = null`. Нет права на тип — 403 `FORBIDDEN`.
        Документ из сообщения чата — `source_message_id` (ссылка, текст и вложения передаёт клиент).
      x-rt-permissions: [memos.create, letters.register]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/documents/{document_id}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: Карточка документа
      description: Автор, участник маршрута или сотрудник с `registry.read`; иначе 404 `NOT_FOUND` (существование не раскрывается).
      x-rt-permissions: [memos.create, memos.approve, approvals.decide, registry.read]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Документ с решениями и журналом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [documents]
      operationId: updateDocument
      summary: Править черновик или возвращённый документ (без отправки)
      description: |
        Только автор; `memo`, `application`, `report` — из `draft` и `returned`, `letter_out` — из `draft`; другой статус —
        409 `CONFLICT` (`details.reason = invalid_state`), не автор — 403 (`details.reason = not_author`). Меняются только
        переданные поля (`amount: null` и `due_date: null` очищают значение); `file_ids` привязывает файлы (уже привязанные
        к этому документу пропускаются, снять вложение нельзя); `erp_deal_id` — связь с проектом (заявкой) ERP. Версия
        не растёт (растёт при повторной отправке после возврата), номер и маршрут не меняются; в журнал — `document.updated`.
      x-rt-permissions: [memos.create, letters.register]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
      responses:
        '200':
          description: Документ с правками
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/documents/{document_id}/submit:
    post:
      tags: [documents]
      operationId: submitDocument
      summary: Отправить на согласование (или отправить исходящее письмо)
      description: |
        Только автор. `memo`, `application`, `report` из `draft` или `returned`: необязательные правки тела применяются,
        после возврата `version` растёт на 1; открывается маршрут (новый круг) — статус `on_approval`, `approval.requested`.
        Шаблоны (runbook §2.5): `memo` — директор (любой с `memos.approve`), затем, если указана сумма, бухгалтер (любой с
        `payments.confirm` — решение архитектора); `application`, `report` — директор. Статусы по решениям — `DocumentStatus`.
        `letter_out` из `draft`: присваивается `ИСХ-NNN/ГГ`, статус `sent`, `document.registered`, затем `document.archived`. Другой статус — 409 `CONFLICT`
        (`details.reason = invalid_state`).
      x-rt-permissions: [memos.create, letters.register]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSubmitIn'
      responses:
        '200':
          description: Отправлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: Маршруты согласования («На согласовании», «Черновик КП»)
      description: |
        `mine=1` (по умолчанию) — маршруты, текущий шаг которых ждёт этого сотрудника (назначен по `crm_user_id` или он
        держит право шага). `mine=0` — без `registry.read` маршруты, где сотрудник автор или участник; с `registry.read` — все.
      x-rt-permissions: [memos.create, memos.approve, approvals.decide, payments.confirm, registry.read]
      parameters:
        - name: mine
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RouteStatus'
          style: form
          explode: true
        - name: template
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ApprovalTemplate'
          style: form
          explode: true
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница маршрутов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/approvals/{approval_id}:
    get:
      tags: [approvals]
      operationId: getApproval
      summary: Карточка маршрута (шаги, чек-лист КП, снимок КП)
      description: |
        Автор объекта, участник маршрута (в том числе держатель права шага) или сотрудник с `registry.read`; иначе 404.
        Снимок КП (`quote`) с себестоимостью и маржой — только тем, кто решает шаг маршрута КП (`approvals.decide`).
      x-rt-permissions: [memos.create, memos.approve, approvals.decide, payments.confirm, registry.read]
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      responses:
        '200':
          description: Маршрут
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/approvals/{approval_id}/decision:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Решение на текущем шаге (approve, return, reject)
      description: |
        Решает только тот, кого ждёт текущий шаг (назначен по `crm_user_id` или держит право шага); иначе 403
        `FORBIDDEN` (`details.reason = not_your_step`). `comment` обязателен для `return` и `reject` (422). КП: `approve`
        недоступно, пока не выполнены блокирующие строки чек-листа — визы и маржа (проверка на сервере; маржа сверяется с
        порогом резолюции EDS) — 409 `CONFLICT`, `details.reason = checklist_not_green`, `details.failed` — коды красных
        блокирующих строк. Строка «срок» (`due`, `blocking = false`) — предупреждение: КП, готовое позже срока резолюции,
        директор одобряет, осознанно приняв опоздание; маршрут получает `approved_late = true`, журнал — строку
        `approval.approved_late`, событие `approval.decided` — `approved_late: true` (решение архитектора 2026-10-26, C1-G-1).
        При одобрении КП присваивается `ИСХ-NNN/ГГ`, выбранные `channels` уходят в событие. Маршрут закрыт — 409
        (`details.reason = route_closed`). Каждое решение — строка журнала и `approval.decided`.
      x-rt-permissions: [memos.approve, approvals.decide, payments.confirm]
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionIn'
      responses:
        '200':
          description: Решение принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/registry:
    get:
      tags: [registry]
      operationId: listRegistry
      summary: Реестр «Все документы» (SPEC-v3 §7.3)
      description: |
        Единый реестр с вкладками по типу и фильтрами статус · период · ответственный · клиент. КП — маршруты одобрения
        (номер КП ERP); договоры, счета и акты ERP появятся, когда EDS начнёт вести их проекции (вне C1).
      x-rt-permissions: [registry.read]
      parameters:
        - $ref: '#/components/parameters/RegistryKind'
        - $ref: '#/components/parameters/RegistryStatus'
        - $ref: '#/components/parameters/RegistryDateFrom'
        - $ref: '#/components/parameters/RegistryDateTo'
        - $ref: '#/components/parameters/RegistryResponsible'
        - $ref: '#/components/parameters/RegistryClient'
        - $ref: '#/components/parameters/RegistryNumber'
        - $ref: '#/components/parameters/RegistryQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница реестра
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/registry/export:
    get:
      tags: [registry]
      operationId: exportRegistry
      summary: Экспорт реестра с теми же фильтрами
      description: Не больше 10 000 строк (иначе 422 `VALIDATION_FAILED`, `details.reason = export_too_large`); в журнал — `registry.export`.
      x-rt-permissions: [registry.export]
      parameters:
        - $ref: '#/components/parameters/RegistryKind'
        - $ref: '#/components/parameters/RegistryStatus'
        - $ref: '#/components/parameters/RegistryDateFrom'
        - $ref: '#/components/parameters/RegistryDateTo'
        - $ref: '#/components/parameters/RegistryResponsible'
        - $ref: '#/components/parameters/RegistryClient'
        - $ref: '#/components/parameters/RegistryNumber'
        - $ref: '#/components/parameters/RegistryQuery'
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [xlsx, csv]
            default: xlsx
      responses:
        '200':
          description: Файл реестра
          headers:
            Content-Disposition:
              description: '`attachment; filename*=UTF-8''''…`'
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/files:
    post:
      tags: [files]
      operationId: uploadFile
      summary: Загрузить файл или новую версию файла
      description: |
        `multipart/form-data`: `file` и необязательный `version_of` (id файла — новая версия той же цепочки; прежние версии
        остаются). Не больше 25 МБ (413), типы — PDF, изображения, документы Office (415). Файл привязывается к документу
        полем `file_ids` при создании или отправке; непривязанный видит только загрузивший.
      x-rt-permissions: [letters.register, letters.resolve, memos.create, memos.approve, approvals.decide]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadIn'
      responses:
        '201':
          description: Файл сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRef'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: '`PAYLOAD_TOO_LARGE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/files/{file_id}:
    get:
      tags: [files]
      operationId: downloadFile
      summary: Скачать файл (поток)
      description: |
        Последняя версия, или `version`. Видит тот, кому виден документ, к которому файл привязан, или загрузивший; иначе 404.
      x-rt-permissions: [letters.read, memos.create, memos.approve, approvals.decide, registry.read]
      parameters:
        - $ref: '#/components/parameters/FileId'
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Содержимое файла
          headers:
            Content-Disposition:
              description: '`attachment; filename*=UTF-8''''…`'
              schema:
                type: string
            ETag:
              description: SHA-256 содержимого версии
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/files/{file_id}/versions:
    get:
      tags: [files]
      operationId: listFileVersions
      summary: Версии файла
      x-rt-permissions: [letters.read, memos.create, memos.approve, approvals.decide, registry.read]
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Версии от последней к первой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileVersions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/bus/overview:
    get:
      tags: [bus]
      operationId: busOverview
      summary: Сводка шины EDS — outbox, DLQ, inbox и подписчики
      x-rt-permissions: [bus.manage]
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/bus/deliveries:
    get:
      tags: [bus]
      operationId: busDeliveries
      summary: Доставки событий EDS подписчикам (DLQ — `status=dead`), новые сверху
      x-rt-permissions: [bus.manage]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BusDeliveryStatus'
        - $ref: '#/components/parameters/BusSubscriberQuery'
        - $ref: '#/components/parameters/BusTypeQuery'
        - name: created_from
          in: query
          required: false
          description: Доставка создана не раньше (включительно)
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          required: false
          description: Доставка создана раньше (не включительно)
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          required: false
          description: Страница — id последней строки предыдущей страницы
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница доставок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusDeliveryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/bus/deliveries/{delivery_id}/retry:
    post:
      tags: [bus]
      operationId: busRetryDelivery
      summary: «Повторить» доставку `dead` или ожидающую — сейчас, попытки с нуля; подписчик на паузе получает пробу
      x-rt-permissions: [bus.manage]
      parameters:
        - name: delivery_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Сколько поставлено на повтор (0 — доставлено, в работе или нет такой)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusRetryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/bus/deliveries/retry-dead:
    post:
      tags: [bus]
      operationId: busRetryDead
      summary: «Повторить все dead подписчика» — после исправления причины
      x-rt-permissions: [bus.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusRetryDeadIn'
      responses:
        '200':
          description: Сколько доставок `dead` поставлено на повтор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusRetryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/bus/inbox:
    get:
      tags: [bus]
      operationId: busInbox
      summary: Принятые события, новые сверху; `errors=true` — обработка упала или ждёт автоповтора
      x-rt-permissions: [bus.manage]
      parameters:
        - name: errors
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BusInboxStatus'
        - $ref: '#/components/parameters/BusTypeQuery'
        - name: before
          in: query
          required: false
          description: Страница — `received_at` последней строки предыдущей страницы
          schema:
            type: string
            format: date-time
        - name: before_event_id
          in: query
          required: false
          description: Страница — `event_id` последней строки (строки с тем же временем не теряются)
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница принятых событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusInboxPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/bus/inbox/{event_id}/retry:
    post:
      tags: [bus]
      operationId: busRetryInbox
      summary: «Повторить обработку» записи `failed` или `skipped`
      x-rt-permissions: [bus.manage]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Сколько поставлено на повтор (0 — обработано, ждёт или нет такой записи)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusRetryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

components:
  securitySchemes:
    edsAccess:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен доступа EDS из `POST /api/v1/auth/sso/exchange` (HS256, `iss = eds`, `aud = eds-api`, 15 минут); токен сотрудника CRM (`aud = eds`) здесь отклоняется — 401 `UNAUTHORIZED`

  parameters:
    LetterId:
      name: letter_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозрачный курсор из `next_cursor`
      schema:
        type: string
        maxLength: 500
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    BusSubscriberQuery:
      name: subscriber
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BusSubscriberName'
    BusTypeQuery:
      name: type
      in: query
      required: false
      description: Подстрока типа события (`quote.`, `letter.registered`)
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Ключ повтора (24 часа)
      schema:
        type: string
        minLength: 8
        maxLength: 128
    RegistryKind:
      name: kind
      in: query
      required: false
      description: Вкладки реестра (несколько — повтором параметра)
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RegistryKind'
      style: form
      explode: true
    RegistryStatus:
      name: status
      in: query
      required: false
      description: Статус объекта (значения — `LetterStatus`, `DocumentStatus`, `RouteStatus` по типу)
      schema:
        type: array
        items:
          type: string
          pattern: '^[a-z_]+$'
      style: form
      explode: true
    RegistryDateFrom:
      name: date_from
      in: query
      required: false
      description: Дата регистрации с (включительно, `Asia/Tashkent`)
      schema:
        type: string
        format: date
    RegistryDateTo:
      name: date_to
      in: query
      required: false
      description: Дата регистрации по (включительно)
      schema:
        type: string
        format: date
    RegistryResponsible:
      name: responsible
      in: query
      required: false
      description: Ответственный — `crm_user_id` (менеджер письма, автор документа, кто решает текущий шаг)
      schema:
        type: integer
    RegistryClient:
      name: crm_client_id
      in: query
      required: false
      description: Клиент CRM
      schema:
        type: integer
    RegistryNumber:
      name: number
      in: query
      required: false
      description: Точный номер (`ВХ-104/26`, `СЗ-2026/031`, `КП-2026/115`)
      schema:
        type: string
        maxLength: 64
    RegistryQuery:
      name: q
      in: query
      required: false
      description: Поиск по номеру и теме
      schema:
        type: string
        maxLength: 200

  responses:
    Unauthorized:
      description: '`UNAUTHORIZED` — нет, неверный или истёкший токен доступа EDS (`details.reason`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`FORBIDDEN` — нет права (`details.permission`) или действие не положено (`details.reason`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: '`CONFLICT` — `details.reason`: `invalid_state`, `route_closed`, `checklist_not_green`, `idempotency_key_reused`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: '`VALIDATION_FAILED` — `details.fields` перечисляет поля'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, source]
      properties:
        code:
          type: string
          description: Стабильный код (`UNAUTHORIZED`, `INVALID_SSO_TOKEN`, `USER_NOT_PROVISIONED`, `USER_INACTIVE`, `FORBIDDEN`, `NOT_FOUND`, `VALIDATION_FAILED`, `CONFLICT`, `PAYLOAD_TOO_LARGE`, `UNSUPPORTED_MEDIA_TYPE`, `BAD_REQUEST`, `INTERNAL_ERROR`)
          examples: [FORBIDDEN]
        message:
          type: string
          description: Текст для сотрудника на его языке
        source:
          type: string
          enum: [eds]
        details:
          type: object
          description: '`reason`, `permission`, `fields` — для разбора, не для показа'
          additionalProperties: true

    EdsPermission:
      type: string
      enum:
        - letters.read
        - letters.register
        - letters.resolve
        - memos.create
        - memos.approve
        - approvals.decide
        - registry.read
        - registry.export
        - payments.confirm
        - bus.manage
      description: |
        Код права EDS v1 (runbook волны 12 §2.2; `platform-rbac.yaml`, `backend.eds`). `payments.confirm` — шаг «бухгалтер»
        маршрута служебной записки с суммой (решение архитектора). `bus.manage` (0.3.0, W13-A2) — «Журнал интеграций» шины:
        раздел `admin` каталога, уровень `full`. В событиях шины (`identity`, `eds`) код — строка по шаблону
        `^[a-z_]+\.[a-z_]+$`, не перечень: новый код не ломает события v1.

    Uuid:
      type: string
      format: uuid

    BusSubscriberName:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,63}$'
      description: Имя подписчика шины (`crm`, `erp`, `platform-bff`)
    BusDeliveryStatus:
      type: string
      enum: [pending, in_flight, delivered, dead]
    BusInboxStatus:
      type: string
      enum: [received, processed, failed, skipped]
    BusSubscriber:
      type: object
      additionalProperties: false
      required: [name, configured, enabled, drop, endpoint, pending, in_flight, dead, oldest_undelivered_age_seconds,
                 consecutive_failures, paused_until, last_failure_at, last_success_at, last_error]
      description: |
        Подписчик издателя. `configured = false` — его больше нет в файле подписок, но остались доставки или состояние.
        `paused_until` — действующая пауза предохранителя (в будущем), иначе `null`. `endpoint` — адрес приёмника: только
        схема, хост, порт и путь. `oldest_undelivered_age_seconds` — возраст самого старого недоставленного (без `dead`).
      properties:
        name:
          type: string
        configured:
          type: boolean
        enabled:
          type: boolean
        drop:
          type: boolean
        endpoint:
          type: [string, 'null']
        pending:
          type: integer
        in_flight:
          type: integer
        dead:
          type: integer
        oldest_undelivered_age_seconds:
          type: [number, 'null']
        consecutive_failures:
          type: integer
        paused_until:
          type: [string, 'null']
          format: date-time
        last_failure_at:
          type: [string, 'null']
          format: date-time
        last_success_at:
          type: [string, 'null']
          format: date-time
        last_error:
          type: [string, 'null']
    BusOverview:
      type: object
      additionalProperties: false
      required: [service, outbox_pending, oldest_undelivered_age_seconds, dlq_size, inbox_received, inbox_retrying,
                 inbox_failed, subscribers]
      properties:
        service:
          type: string
        outbox_pending:
          type: integer
        oldest_undelivered_age_seconds:
          type: [number, 'null']
        dlq_size:
          type: integer
        inbox_received:
          type: integer
        inbox_retrying:
          type: integer
        inbox_failed:
          type: integer
        subscribers:
          type: array
          items:
            $ref: '#/components/schemas/BusSubscriber'
    BusDelivery:
      type: object
      additionalProperties: false
      required: [id, event_id, event_type, subscriber, status, attempts, next_attempt_at, last_attempt_at, last_status_code,
                 last_error, delivered_at, created_at, subject, correlation_id, event_created_at]
      description: Метаданные доставки; тела события нет.
      properties:
        id:
          type: integer
        event_id:
          $ref: '#/components/schemas/Uuid'
        event_type:
          type: string
        subscriber:
          type: string
        status:
          $ref: '#/components/schemas/BusDeliveryStatus'
        attempts:
          type: integer
        next_attempt_at:
          type: [string, 'null']
          format: date-time
        last_attempt_at:
          type: [string, 'null']
          format: date-time
        last_status_code:
          type: [integer, 'null']
        last_error:
          type: [string, 'null']
        delivered_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        subject:
          type: [string, 'null']
        correlation_id:
          type: [string, 'null']
        event_created_at:
          type: [string, 'null']
          format: date-time
    BusDeliveryPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusDelivery'
        has_more:
          type: boolean
    BusInboxEntry:
      type: object
      additionalProperties: false
      required: [event_id, type, publisher, subject, correlation_id, status, attempts, error, received_at, processed_at]
      description: Принятое событие (метаданные; тела нет).
      properties:
        event_id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
        publisher:
          type: string
        subject:
          type: [string, 'null']
        correlation_id:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/BusInboxStatus'
        attempts:
          type: integer
        error:
          type: [string, 'null']
        received_at:
          type: string
          format: date-time
        processed_at:
          type: [string, 'null']
          format: date-time
    BusInboxPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusInboxEntry'
        has_more:
          type: boolean
    BusRetryDeadIn:
      type: object
      additionalProperties: false
      required: [subscriber]
      properties:
        subscriber:
          $ref: '#/components/schemas/BusSubscriberName'
    BusRetryResult:
      type: object
      additionalProperties: false
      required: [retried]
      properties:
        retried:
          type: integer
          minimum: 0

    Amount:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Деньги строкой с двумя знаками
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
    MarginPct:
      type: string
      pattern: '^(100(\.0{1,2})?|\d{1,2}(\.\d{1,2})?)$'
      description: Процент 0–100 строкой, до двух знаков (`15`, `12.5`)
    LetterNumber:
      type: string
      pattern: '^ВХ-\d{3,}/\d{2}$'
      examples: [ВХ-104/26]
    OutgoingNumber:
      type: string
      pattern: '^ИСХ-\d{3,}/\d{2}$'
      examples: [ИСХ-082/26]
    DocumentNumber:
      type: string
      pattern: '^(ИСХ-\d{3,}/\d{2}|(СЗ|ЗЯ|ОТ)-\d{4}/\d{3,})$'
      description: '`СЗ-ГГГГ/NNN`, `ЗЯ-ГГГГ/NNN`, `ОТ-ГГГГ/NNN`, `ИСХ-NNN/ГГ` (исходящее письмо)'
      examples: [СЗ-2026/031]

    PersonRef:
      type: object
      additionalProperties: false
      required: [crm_user_id, full_name]
      properties:
        crm_user_id:
          type: integer
        full_name:
          type: string

    Me:
      type: object
      additionalProperties: false
      required: [crm_user_id, full_name, email, permissions]
      properties:
        crm_user_id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EdsPermission'
          description: Права по проекции на момент запроса

    SsoExchangeIn:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 4096
          description: Токен сотрудника CRM с `aud = eds`
    AccessToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
          const: 900
          description: Секунды; refresh нет

    Health:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        version:
          type: string
          description: Версия сборки сервиса
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          description: Зависимости (`database`, …)

    ErpLinks:
      type: object
      additionalProperties: false
      required: [erp_request_id, erp_deal_id, deal_number]
      description: Ссылки на заявку и сделку ERP и клиента CRM; `null` — ещё не связано
      properties:
        erp_request_id:
          type: [integer, 'null']
        erp_deal_id:
          type: [integer, 'null']
        deal_number:
          type: [string, 'null']
          maxLength: 64
          description: Бизнес-номер заявки или проекта ERP (`ЗВ-ГГГГ-NNN`, `ПР-ГГГГ-NNN`)
        crm_client_id:
          type: [integer, 'null']
        erp_company_id:
          type: [integer, 'null']
    ErpLinksIn:
      type: object
      additionalProperties: false
      properties:
        erp_request_id:
          type: [integer, 'null']
        erp_deal_id:
          type: [integer, 'null']
        deal_number:
          type: [string, 'null']
          maxLength: 64
        crm_client_id:
          type: [integer, 'null']
        erp_company_id:
          type: [integer, 'null']

    JournalEntry:
      type: object
      additionalProperties: false
      required: [at, action, by]
      description: Строка журнала «кто, что, когда, файл»
      properties:
        at:
          type: string
          format: date-time
        action:
          type: string
          pattern: '^[a-z_.]+$'
          description: '`letter.registered`, `letter.resolved`, `document.submitted`, `approval.decided`, `file.attached`, …'
          examples: [approval.decided]
        by:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
          description: '`null` — система'
        comment:
          type: [string, 'null']
        file_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        version:
          type: [integer, 'null']
          minimum: 1

    FileRef:
      type: object
      additionalProperties: false
      required: [id, name, content_type, size, version, sha256, uploaded_at, uploaded_by]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 255
        content_type:
          type: string
        size:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        uploaded_at:
          type: string
          format: date-time
        uploaded_by:
          $ref: '#/components/schemas/PersonRef'
    FileVersions:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileRef'
    FileUploadIn:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
        version_of:
          $ref: '#/components/schemas/Uuid'

    LetterStatus:
      type: string
      enum: [awaiting_resolution, resolved, returned, rejected]
      description: |
        SPEC-v3 §2.4 («Зарегистрировано → Ждёт резолюции» — одним шагом): `awaiting_resolution` — зарегистрировано и ждёт
        резолюции директора; `resolved` — резолюция наложена; `returned` — возвращено, письмо у регистратора; `rejected` —
        отклонено. Переходы — таблица в описании API.
    Zone:
      type: string
      enum: [goods, services, payment_terms]
      description: 'Зона исполнителя резолюции: `goods` — товары, склад, цены поставщиков (снабженец); `services` — услуги, ТЗ, бригада (гл. инженер); `payment_terms` — условия оплаты (бухгалтер)'
    Assignee:
      type: object
      additionalProperties: false
      required: [crm_user_id, zone]
      properties:
        crm_user_id:
          type: integer
        zone:
          $ref: '#/components/schemas/Zone'
        full_name:
          type: string
          readOnly: true
    ResolutionIn:
      type: object
      additionalProperties: false
      required: [text, assignees, due]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
        assignees:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Assignee'
        due:
          type: string
          format: date
          description: Срок расчёта — не раньше сегодняшней даты по `Asia/Tashkent` (иначе 422, `details.fields.due`)
        min_margin_pct:
          oneOf:
            - $ref: '#/components/schemas/MarginPct'
            - type: 'null'
          description: '«Маржа не ниже, %»; нет или `null` — без ограничения'
    Resolution:
      type: object
      additionalProperties: false
      required: [text, assignees, due, min_margin_pct, decided_by, decided_at]
      properties:
        text:
          type: string
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/Assignee'
        due:
          type: string
          format: date
        min_margin_pct:
          oneOf:
            - $ref: '#/components/schemas/MarginPct'
            - type: 'null'
        decided_by:
          $ref: '#/components/schemas/PersonRef'
        decided_at:
          type: string
          format: date-time
    LetterReturnIn:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 4000
    LetterRejectIn:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 4000
    LetterSubmitIn:
      type: object
      additionalProperties: false
      description: Необязательные правки возвращённого письма перед повторной подачей
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 300
        summary:
          type: string
          minLength: 1
          maxLength: 10000
        links:
          $ref: '#/components/schemas/ErpLinksIn'
        file_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
        comment:
          type: [string, 'null']
          maxLength: 4000
          description: Ответ на комментарий возврата (в журнал)
    LetterSender:
      type: object
      additionalProperties: false
      required: [name]
      description: Организация — отправитель письма, адресат исходящего письма, клиент в реестре
      properties:
        name:
          type: [string, 'null']
          maxLength: 255
          description: '`null` — письмо зарегистрировано по заявке ERP без названия компании, клиент — по `links.crm_client_id`'
        inn:
          type: [string, 'null']
          pattern: '^\d{9,14}$'
    IncomingLetterSender:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        Отправитель входящего письма (с 0.2.0): `LetterSender` и контактное лицо. Письмо по заявке ERP берёт название, ИНН и
        контакт из `erp.request.created` (`payload.company_name`, `company_inn`, `contact_name`; C1-G-7)
      properties:
        name:
          type: [string, 'null']
          maxLength: 255
          description: '`null` — письмо по заявке ERP без названия компании, клиент — по `links.crm_client_id`'
        inn:
          type: [string, 'null']
          pattern: '^\d{9,14}$'
        contact:
          type: [string, 'null']
          maxLength: 255
          description: Контактное лицо отправителя
    SenderRef:
      type: object
      additionalProperties: false
      description: Исходящий номер и дата письма у отправителя
      properties:
        number:
          type: [string, 'null']
          maxLength: 64
        date:
          type: [string, 'null']
          format: date
    LetterCreate:
      type: object
      additionalProperties: false
      required: [subject, summary, sender, received_at]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 300
        summary:
          type: string
          minLength: 1
          maxLength: 10000
          description: Суть документа
        sender:
          $ref: '#/components/schemas/IncomingLetterSender'
        sender_ref:
          $ref: '#/components/schemas/SenderRef'
        received_at:
          type: string
          format: date
        addressee_crm_user_id:
          type: [integer, 'null']
          description: На чьё имя; нет — директор
        manager_crm_user_id:
          type: [integer, 'null']
          description: Ответственный менеджер
        urgent:
          type: boolean
          default: false
        links:
          $ref: '#/components/schemas/ErpLinksIn'
        file_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
    LetterListItem:
      type: object
      additionalProperties: false
      required: [id, number, subject, sender, received_at, status, links, urgent]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        number:
          $ref: '#/components/schemas/LetterNumber'
        subject:
          type: string
        sender:
          $ref: '#/components/schemas/IncomingLetterSender'
        received_at:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/LetterStatus'
        links:
