        sender:
          $ref: '#/components/schemas/IncomingLetterSender'
        sender_ref:
          $ref: '#/components/schemas/SenderRef'
        received_at:
          type: string
          format: date
        registered_at:
          type: string
          format: date-time
        registered_by:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
          description: '`null` — зарегистрировано системой по заявке ERP'
        addressee:
          $ref: '#/components/schemas/PersonRef'
        manager:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        urgent:
          type: boolean
        links:
          $ref: '#/components/schemas/ErpLinks'
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileRef'
        resolution:
          oneOf:
            - $ref: '#/components/schemas/Resolution'
            - type: 'null'
        return_comment:
          type: [string, 'null']
        reject_reason:
          type: [string, 'null']
        journal:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'
        kind:
          type: [string, 'null']
          description: Код вида документа (P8); у писем по заявкам — `null`
        receipt_method:
          oneOf:
            - $ref: '#/components/schemas/ReceiptMethod'
            - type: 'null'
        signed_by:
          type: [string, 'null']
        document_due:
          type: [string, 'null']
          format: date
        related:
          oneOf:
            - $ref: '#/components/schemas/LetterRelatedRef'
            - type: 'null'
        track:
          $ref: '#/components/schemas/LetterTrack'
        on_control:
          type: boolean
          description: На контроле (P8b) — есть поручения в работе
        suggested_due:
          type: [string, 'null']
          format: date
          description: |
            Подсказка срока резолюции пути `office` (P8b, бенчмарк СЭД §6.4): срок по документу минус рабочий день; без
            него — дата регистрации плюс 3 дня («срочно») или 10 дней; выходной (сб, вс) переносится на понедельник; не
            раньше сегодня. У пути `calc` — `null`.
        resolution_draft:
          oneOf:
            - $ref: '#/components/schemas/ResolutionDraft'
            - type: 'null'
        office_resolution:
          oneOf:
            - $ref: '#/components/schemas/OfficeResolution'
            - type: 'null'
          description: Резолюция пути делопроизводства; у пути `calc` — `resolution`
        instructions:
          type: array
          description: Поручения (ответственный первым)
          items:
            $ref: '#/components/schemas/Instruction'
        acquaintances:
          type: array
          items:
            $ref: '#/components/schemas/Acquaintance'
        executed_at:
          type: [string, 'null']
          format: date-time
          description: Когда исполнены все поручения
        duplicate_of:
          oneOf:
            - $ref: '#/components/schemas/LetterDuplicateRef'
            - type: 'null'
          description: Оригинал, если письмо закрыто как дубль (`status = duplicate`, EDS-DUP)
        replies:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/LetterReply'
          description: |
            Ответы на это входящее (EDS-REPLY-1), новейший первым: черновик, «передан на регистрацию», ИСХ и итог его отправки.
            Поля может не быть у старого ответа — это «ответов нет».

    LetterTrack:
      type: string
      enum: [calc, office]
      description: |
        Путь резолюции (P8b, SPEC-v3 §3.2a). `calc` — письмо по заявке клиента: есть `links.erp_request_id`, или вид
        документа не задан и есть `links.erp_deal_id` (письма «Создать заявку» и до P8); резолюция «расчёт по зонам»
        (`POST …/resolution`). `office` — остальное, в том числе письмо с видом документа, связанное с заявкой как контекст;
        резолюция трёх типов (`POST …/office-resolution`). Путь вычисляет EDS, экран его не выбирает.
    ResolutionKind:
      type: string
      enum: [execute, reply, info]
      description: |
        Тип резолюции пути делопроизводства — `execute` «К исполнению», `reply` «Подготовить ответ», `info` «Для сведения». Это
        поведение системы (закрытый список кода); названия на экране — справочник `resolution-kinds` (закрытый: только
        переименовать и переставить, EDS-REG).
    LetterIntakeIn:
      type: object
      additionalProperties: false
      required: [file_id]
      properties:
        file_id: { $ref: '#/components/schemas/Uuid' }
    LetterIntakeFields:
      type: object
      additionalProperties: false
      required:
        [sender_name, sender_inn, sender_ref_number, sender_ref_date, subject, summary, kind, document_due]
      description: Предложенные поля карточки; `null` — не найдено. ИНН — найден кодом в тексте файла, не моделью
      properties:
        sender_name: { type: [string, 'null'], maxLength: 255 }
        sender_inn: { type: [string, 'null'], pattern: '^\d{9,14}$' }
        sender_ref_number: { type: [string, 'null'], maxLength: 64 }
        sender_ref_date: { type: [string, 'null'], format: date }
        subject: { type: [string, 'null'], maxLength: 300 }
        summary: { type: [string, 'null'], maxLength: 2000 }
        kind:
          oneOf:
            - $ref: '#/components/schemas/LetterKindCode'
            - type: 'null'
        document_due: { type: [string, 'null'], format: date }
    LetterIntakeSuggestion:
      type: object
      additionalProperties: false
      required: [suggestion_id, source, fields, alias, prompt_version]
      properties:
        suggestion_id: { $ref: '#/components/schemas/Uuid' }
        source:
          type: string
          enum: [text, image]
          description: '`text` — текстовый слой PDF (маскированный), `image` — скан или фото (модель с изображением)'
        fields: { $ref: '#/components/schemas/LetterIntakeFields' }
        alias: { type: string, examples: [intake-model] }
        prompt_version: { type: string }
    AiDecisionIn:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accepted, edited, manual]
    DocflowSettings:
      type: object
      additionalProperties: false
      required: [recognize_scans, pii_policy, ai_available]
      properties:
        recognize_scans: { type: boolean }
        pii_policy:
          type: string
          enum: [business, strict]
          description: 'Политика защиты данных для ИИ: `business` — «Деловая», `strict` — «Строгая»; задаёт CRM'
        ai_available: { type: boolean, description: Ключ шлюза моделей задан (помощник может работать) }
    DocflowSettingsPatch:
      type: object
      additionalProperties: false
      required: [recognize_scans]
      properties:
        recognize_scans: { type: boolean }
    ResolutionTemplateScope:
      type: string
      enum: [personal, company]
      description: '`personal` — свой шаблон сотрудника, `company` — общий, ведёт администратор'
    ResolutionTemplateResponsibleType:
      type: string
      enum: [person, addressee, none]
      description: |
        Кто ответственный при применении: `person` — этот сотрудник, `addressee` — адресат письма (директор по умолчанию или
        кому письмо адресовал делопроизводитель), `none` — выбрать при резолюции
    ResolutionTemplateIn:
      type: object
      additionalProperties: false
      required: [name, scope, kind, text]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        scope: { $ref: '#/components/schemas/ResolutionTemplateScope' }
        kind: { $ref: '#/components/schemas/ResolutionKind' }
        text: { type: string, minLength: 1, maxLength: 4000 }
        responsible_type:
          $ref: '#/components/schemas/ResolutionTemplateResponsibleType'
        responsible_crm_user_id:
          type: [integer, 'null']
          description: Только при `responsible_type = person`
        co_executor_ids:
          type: array
          maxItems: 20
          items: { type: integer }
        acquaint_ids:
          type: array
          maxItems: 50
          items: { type: integer }
        due_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
          description: Срок — через столько дней (рабочий день); `null` — подсказка срока письма
    ResolutionTemplate:
      type: object
      additionalProperties: false
      required:
        [id, name, scope, kind, text, responsible_type, responsible, co_executors, acquaint, due_days, owner, editable]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        scope: { $ref: '#/components/schemas/ResolutionTemplateScope' }
        kind: { $ref: '#/components/schemas/ResolutionKind' }
        text: { type: string }
        responsible_type: { $ref: '#/components/schemas/ResolutionTemplateResponsibleType' }
        responsible:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        co_executors:
          type: array
          items: { $ref: '#/components/schemas/PersonRef' }
        acquaint:
          type: array
          items: { $ref: '#/components/schemas/PersonRef' }
        due_days: { type: [integer, 'null'] }
        owner:
          description: Владелец личного шаблона; у общего — `null`
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        editable: { type: boolean, description: Вызывающий может изменить и удалить шаблон }
    ResolutionTemplateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ResolutionTemplate' }
    SigningBasis:
      type: string
      enum: [charter, order, power_of_attorney]
      description: Устав (без номера), приказ (номер и дата), доверенность (номер, дата, срок — не больше 3 лет, ГК РУз ст. 139)
    SigningKindCode:
      type: string
      pattern: '^[a-z][a-z_]{0,31}$'
      description: Код значения справочника `signing-kinds` (открытый каталог видов; стартовые — letter_out, quote, contract, invoice, act, memo)
    SigningAuthorityStatus:
      type: string
      enum: [active, expiring, scheduled, expired, revoked]
    SigningAuthorityIn:
      type: object
      additionalProperties: false
      required: [crm_user_id, kinds, basis, valid_from]
      properties:
        crm_user_id:
          type: integer
        kinds:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/SigningKindCode' }
        limit_amount:
          oneOf: [{ $ref: '#/components/schemas/Amount' }, { type: 'null' }]
        limit_currency:
          oneOf: [{ $ref: '#/components/schemas/Currency' }, { type: 'null' }]
        basis: { $ref: '#/components/schemas/SigningBasis' }
        basis_number: { type: [string, 'null'], maxLength: 64 }
        basis_date: { type: [string, 'null'], format: date }
        valid_from: { type: string, format: date }
        valid_to: { type: [string, 'null'], format: date }
        vakolat_url: { type: [string, 'null'], maxLength: 500 }
        note: { type: [string, 'null'], maxLength: 2000 }
    SigningAuthorityPatch:
      type: object
      additionalProperties: false
      description: Все поля необязательны; обязательные (`kinds`, `basis`, `valid_from`) очистить нельзя
      properties:
        kinds:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/SigningKindCode' }
        limit_amount:
          oneOf: [{ $ref: '#/components/schemas/Amount' }, { type: 'null' }]
        limit_currency:
          oneOf: [{ $ref: '#/components/schemas/Currency' }, { type: 'null' }]
        basis: { $ref: '#/components/schemas/SigningBasis' }
        basis_number: { type: [string, 'null'], maxLength: 64 }
        basis_date: { type: [string, 'null'], format: date }
        valid_from: { type: string, format: date }
        valid_to: { type: [string, 'null'], format: date }
        vakolat_url: { type: [string, 'null'], maxLength: 500 }
        note: { type: [string, 'null'], maxLength: 2000 }
    SigningRevokeIn:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
    SigningBasisFileIn:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
    SigningRevoked:
      type: object
      additionalProperties: false
      required: [at, by, reason]
      properties:
        at: { type: string, format: date-time }
        by: { $ref: '#/components/schemas/PersonRef' }
        reason: { type: string }
    SigningAuthority:
      type: object
      additionalProperties: false
      required: [id, holder, holder_position, holder_active, kinds, limit_amount, limit_currency, basis, basis_number, basis_date, valid_from, valid_to, vakolat_url, note, file, status, expires_in_days, revoked, created_by, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        holder: { $ref: '#/components/schemas/PersonRef' }
        holder_position: { type: [string, 'null'] }
        holder_active: { type: boolean }
        kinds:
          type: array
          items: { $ref: '#/components/schemas/SigningKindCode' }
        limit_amount:
          oneOf: [{ $ref: '#/components/schemas/Amount' }, { type: 'null' }]
        limit_currency:
          oneOf: [{ $ref: '#/components/schemas/Currency' }, { type: 'null' }]
        basis: { $ref: '#/components/schemas/SigningBasis' }
        basis_number: { type: [string, 'null'] }
        basis_date: { type: [string, 'null'], format: date }
        valid_from: { type: string, format: date }
        valid_to: { type: [string, 'null'], format: date }
        vakolat_url: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        file:
          oneOf: [{ $ref: '#/components/schemas/FileRef' }, { type: 'null' }]
        status: { $ref: '#/components/schemas/SigningAuthorityStatus' }
        expires_in_days:
          type: [integer, 'null']
          description: Дней до окончания срока (0 — последний день); `null` — срока нет, отозвано или уже истекло
        revoked:
          oneOf: [{ $ref: '#/components/schemas/SigningRevoked' }, { type: 'null' }]
        created_by: { $ref: '#/components/schemas/PersonRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SigningAuthorityEvent:
      type: object
      additionalProperties: false
      required: [at, action, by, comment, details]
      properties:
        at: { type: string, format: date-time }
        action:
          type: string
          enum: [issued, updated, revoked, file_replaced, expiry_reminded]
        by:
          oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }]
        comment: { type: [string, 'null'] }
        details:
          type: object
          additionalProperties: true
          description: 'Что изменилось (`changed`: поле → [было, стало]), снимок выданного (`after`), имя файла; секретов нет'
    SigningAuthorityDetail:
      type: object
      additionalProperties: false
      required: [id, holder, holder_position, holder_active, kinds, limit_amount, limit_currency, basis, basis_number, basis_date, valid_from, valid_to, vakolat_url, note, file, status, expires_in_days, revoked, created_by, created_at, updated_at, journal]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        holder: { $ref: '#/components/schemas/PersonRef' }
        holder_position: { type: [string, 'null'] }
        holder_active: { type: boolean }
        kinds:
          type: array
          items: { $ref: '#/components/schemas/SigningKindCode' }
        limit_amount:
          oneOf: [{ $ref: '#/components/schemas/Amount' }, { type: 'null' }]
        limit_currency:
          oneOf: [{ $ref: '#/components/schemas/Currency' }, { type: 'null' }]
        basis: { $ref: '#/components/schemas/SigningBasis' }
        basis_number: { type: [string, 'null'] }
        basis_date: { type: [string, 'null'], format: date }
        valid_from: { type: string, format: date }
        valid_to: { type: [string, 'null'], format: date }
        vakolat_url: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        file:
          oneOf: [{ $ref: '#/components/schemas/FileRef' }, { type: 'null' }]
        status: { $ref: '#/components/schemas/SigningAuthorityStatus' }
        expires_in_days:
          type: [integer, 'null']
          description: Дней до окончания срока (0 — последний день); `null` — срока нет, отозвано или уже истекло
        revoked:
          oneOf: [{ $ref: '#/components/schemas/SigningRevoked' }, { type: 'null' }]
        created_by: { $ref: '#/components/schemas/PersonRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        journal:
          type: array
          items: { $ref: '#/components/schemas/SigningAuthorityEvent' }
    SigningAuthorityList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SigningAuthority' }
    SigningSetupHint:
      type: object
      additionalProperties: false
      required: [has_authorities, signatory_name, signatory_position, director]
      properties:
        has_authorities: { type: boolean }
        signatory_name: { type: [string, 'null'] }
        signatory_position: { type: [string, 'null'] }
        director:
          oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }]
    SigningResolvedAuthority:
      type: object
      additionalProperties: false
      required: [id, basis, basis_number, basis_date, valid_to, limit_amount, limit_currency]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        basis: { $ref: '#/components/schemas/SigningBasis' }
        basis_number: { type: [string, 'null'] }
        basis_date: { type: [string, 'null'], format: date }
        valid_to: { type: [string, 'null'], format: date }
        limit_amount:
          oneOf: [{ $ref: '#/components/schemas/Amount' }, { type: 'null' }]
        limit_currency:
          oneOf: [{ $ref: '#/components/schemas/Currency' }, { type: 'null' }]
    SignerCandidate:
      type: object
      additionalProperties: false
      required: [signer, position, acting_for, authority, authorities, basis_text]
      description: Кто вправе подписать; полномочие всегда своё, замещение прав не даёт
      properties:
        signer: { $ref: '#/components/schemas/PersonRef' }
        position: { type: [string, 'null'] }
        acting_for:
          type: array
          description: Отсутствующие держатели, чья задача подписи пришла этому человеку по замещению; пусто — подписывает как держатель
          items: { $ref: '#/components/schemas/PersonRef' }
        authority:
          $ref: '#/components/schemas/SigningResolvedAuthority'
        authorities:
          type: array
          description: Все подходящие полномочия; первое — основное (устав, затем приказ, затем доверенность)
          items: { $ref: '#/components/schemas/SigningResolvedAuthority' }
        basis_text:
          type: [string, 'null']
          description: 'Основание для отметки на документе («Действует по доверенности № … от … (до …)»); у устава — `null`. Формулу уточняет юрист (Q-SIGN-1)'
    SigningRejectReason:
      type: string
      enum: [revoked, not_started, expired, limit_exceeded, currency_mismatch, holder_inactive, absent, deputy_without_authority, deputy_loop]
    SigningRejected:
      type: object
      additionalProperties: false
      required: [signer, authority_id, reason, message]
      properties:
        signer: { $ref: '#/components/schemas/PersonRef' }
        authority_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        reason: { $ref: '#/components/schemas/SigningRejectReason' }
        message: { type: string }
    SigningResolveStep:
      type: object
      additionalProperties: false
      required: [code, crm_user_id, text]
      properties:
        code:
          type: string
          description: Причина из `SigningRejectReason`, `candidate`, `candidate_deputy`, `no_authority` (никому не выдано) или `no_signer`
        crm_user_id: { type: [integer, 'null'] }
        text: { type: string }
    SigningResolution:
      type: object
      additionalProperties: false
      required: [kind, amount, currency, on_date, resolved, candidates, rejected, explanation]
      properties:
        kind: { $ref: '#/components/schemas/SigningKindCode' }
        amount:
          oneOf: [{ $ref: '#/components/schemas/Amount' }, { type: 'null' }]
        currency:
          oneOf: [{ $ref: '#/components/schemas/Currency' }, { type: 'null' }]
        on_date: { type: string, format: date }
        resolved: { type: boolean }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/SignerCandidate' }
        rejected:
          type: array
          items: { $ref: '#/components/schemas/SigningRejected' }
        explanation:
          type: array
          description: Пошаговое объяснение по-русски — для экрана и будущего помощника
          items: { $ref: '#/components/schemas/SigningResolveStep' }
    ResolutionDraftIn:
      type: object
      additionalProperties: false
      description: Проект резолюции делопроизводителя; все поля необязательны, `kind = null` — проекта нет
      properties:
        kind:
          oneOf:
            - $ref: '#/components/schemas/ResolutionKind'
            - type: 'null'
        responsible_crm_user_id:
          type: [integer, 'null']
        due:
          type: [string, 'null']
          format: date
        text:
          type: [string, 'null']
          maxLength: 4000
        co_executor_ids:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            type: integer
        acquaint_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            type: integer
    ResolutionDraft:
      type: object
      additionalProperties: false
      required: [kind, responsible, due, text, co_executors, acquaint, drafted_by, drafted_at]
      properties:
        kind:
          oneOf:
            - $ref: '#/components/schemas/ResolutionKind'
            - type: 'null'
        responsible:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        due:
          type: [string, 'null']
          format: date
        text:
          type: [string, 'null']
        co_executors:
          type: array
          items:
            $ref: '#/components/schemas/PersonRef'
        acquaint:
          type: array
          items:
            $ref: '#/components/schemas/PersonRef'
        drafted_by:
          $ref: '#/components/schemas/PersonRef'
        drafted_at:
          type: string
          format: date-time
    OfficeResolutionIn:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          $ref: '#/components/schemas/ResolutionKind'
        responsible_crm_user_id:
          type: [integer, 'null']
          description: Обязателен для `execute` и `reply`
        due:
          type: [string, 'null']
          format: date
          description: Обязателен для `execute` и `reply`; подсказка — `Letter.suggested_due`
        text:
          type: string
          minLength: 1
          maxLength: 4000
        co_executor_ids:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            type: integer
        acquaint_ids:
          type: array
          uniqueItems: true
          maxItems: 50
