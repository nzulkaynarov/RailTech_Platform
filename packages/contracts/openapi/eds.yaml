  /api/v1/letter-intake:
    post:
      tags: [letters]
      operationId: suggestLetterFromFile
      summary: «Заполнить из файла» — ИИ-помощник регистрации входящего (EDS-REG)
      description: |
        Только по кнопке делопроизводителя (решение юриста 2026-11-02): файл письма уже загружен (`POST /files`), EDS читает
        его и предлагает поля карточки — человек правит и регистрирует обычным `POST /letters`. Ничего не сохраняется в письмо.

        * PDF с текстовым слоем — текст извлекает EDS, маскирует персональные данные кодом по политике защиты данных для ИИ
          (`pii_policy` в `GET /docflow-settings`, решение владельца 2026-11-03): «Деловая» (по умолчанию) — паспорт,
          ПИНФЛ, номера карт, даты рождения; «Строгая» — ещё e-mail, телефоны, ИНН, счета и прочие длинные номера. В модель
          уходит только маскированный текст; скрытый номер (например, «исх. №») код возвращает сам, локально.
        * Скан или фото без текста — модель с поддержкой изображений, при «Деловой» политике и включённой настройке
          `recognize_scans` (по умолчанию включена); при «Строгой» политике или выключенной настройке — 409
          `scan_recognition_disabled` с понятным текстом.
        * Пределы — до чтения файла: PDF до 10 МБ и 30 страниц, изображение до 5 МБ; иначе 409 `file_too_large`.
        * Модель — алиас LiteLLM `intake-model` (ключ EDS), промпт — файл с версией, ответ — JSON по схеме; вид документа
          код принимает только из действующих значений справочника `letter-kinds`, ИНН корреспондента ищет код в тексте
          (не модель).
        * Журнал (`ai_suggestions`): кто, когда, функция, алиас, версия промпта, итог и потом решение человека — без текстов.

        409: `scan_recognition_disabled`, `file_too_large` (больше предела), `ai_unavailable` (шлюз не настроен или не
        ответил), `ai_budget_exceeded`, `nothing_recognized`. 422: файл не PDF и не изображение (`file_id` с `unsupported_file`).
      x-rt-permissions: [letters.register]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterIntakeIn'
      responses:
        '200':
          description: Предложение полей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterIntakeSuggestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/ai-suggestions/{suggestion_id}/decision:
    post:
      tags: [letters]
      operationId: decideAiSuggestion
      summary: Решение человека по предложению ИИ (журнал)
      description: |
        `accepted` — зарегистрировал как предложено, `edited` — поправил, `manual` — заполнил вручную (отказался). Только тот,
        кто вызвал помощника; повтор с тем же решением — тот же ответ, другое решение заменяет прежнее.
      x-rt-permissions: [letters.register]
      parameters:
        - name: suggestion_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiDecisionIn'
      responses:
        '204':
          description: Записано
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

