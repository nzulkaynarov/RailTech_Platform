      description: |
        Причина обязательна. Отозванное полномочие остаётся в реестре и журнале (кто, когда, почему); подбор подписанта его
        больше не учитывает. Повторный отзыв — 409 `revoked`.
      x-rt-permissions: [signing.manage]
      parameters:
