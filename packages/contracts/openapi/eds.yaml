  /api/v1/signing/authorities:
    get:
      tags: [signing]
      operationId: listSigningAuthorities
      summary: Реестр полномочий подписи (SIGN-2)
      description: |
        Полномочия подписи (ADR-0024 п. 1): кто, какие виды документов, до какой суммы, на каком основании и до какого срока.
        `status`: `active` — действующие (`active` и `expiring` в ответе), `expiring` — действуют, но окончатся в ближайшие
        30 дней, `inactive` — отозванные, истёкшие и ещё не начавшиеся, `all` (по умолчанию) — все. Состояние считается
        на сегодняшний день компании (`Asia/Tashkent`).
      x-rt-permissions: [signing.manage]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, expiring, inactive, all]
            default: all
        - name: crm_user_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Полномочия по имени держателя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningAuthorityList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [signing]
      operationId: createSigningAuthority
      summary: Выдать полномочие подписи
      description: |
        Инварианты основания (ГК РУз ст. 134, 138, 139): доверенность — номер, дата и срок обязательны, срок не позже даты
        выдачи плюс 3 года, действует не ранее выдачи; приказ — номер и дата; устав — без номера. Лимит — сумма и валюта
        вместе (пусто — без лимита). Пересечения полномочий допустимы. Держатель — активный сотрудник; виды — действующие
        значения справочника `signing-kinds`; ссылка Vakolat.uz — `https://…vakolat.uz/…`. Нарушение — 422 с полем в
        `details.fields`. Выдача пишется в журнал полномочия.
      x-rt-permissions: [signing.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigningAuthorityIn'
      responses:
        '201':
          description: Выдано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningAuthorityDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/signing/authorities/{authority_id}:
    get:
      tags: [signing]
      operationId: getSigningAuthority
      summary: Полномочие с журналом
