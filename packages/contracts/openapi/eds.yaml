        - deal_number
        - approval_id
        - payment
        - decisions
        - journal
        - created_at
        - updated_at
        - archived_at
        - letter
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/DocumentKind'
        number:
          oneOf:
            - $ref: '#/components/schemas/DocumentNumber'
            - type: 'null'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        version:
          type: integer
          minimum: 1
        subject:
          type: string
        text:
          type: string
        author:
          $ref: '#/components/schemas/PersonRef'
        addressee:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
          description: '`null` — директор (любой с `memos.approve`)'
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        due_date:
          type: [string, 'null']
          format: date
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileRef'
        source_message_id:
          type: [string, 'null']
        erp_deal_id:
          type: [integer, 'null']
        deal_number:
          type: [string, 'null']
        recipient:
          oneOf:
            - $ref: '#/components/schemas/LetterSender'
            - type: 'null'
        in_reply_to:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        letter:
          oneOf:
            - $ref: '#/components/schemas/OutgoingLetter'
            - type: 'null'
          description: Только `letter_out` — письмо на бланке (P4); у остальных типов `null`
        approval_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Маршрут текущего круга; `null` — не отправлялся
        payment:
          oneOf:
            - $ref: '#/components/schemas/DocumentPayment'
            - type: 'null'
          description: Факт оплаты служебной записки; `null` — не оплачена
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/DocumentDecision'
        journal:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, 'null']
          format: date-time
          description: Маршрут завершён окончательно — документ в архиве (`document.archived`)

    ApprovalTemplate:
      type: string
      enum: [memo, application, report, quote]
    RouteStatus:
      type: string
      enum: [open, approved, returned, rejected]
    Decision:
      type: string
      enum: [approve, return, reject]
    SendChannel:
      type: string
      enum: [telegram, cabinet, email]
    StepAssignee:
      type: object
      additionalProperties: false
      required: [crm_user_id, permission]
      description: Конкретный сотрудник или любой с правом EDS — ровно одно не `null`
      properties:
        crm_user_id:
          type: [integer, 'null']
        permission:
          oneOf:
            - $ref: '#/components/schemas/EdsPermission'
            - type: 'null'
      if:
        properties:
          crm_user_id:
            type: integer
      then:
        properties:
          permission:
            type: 'null'
      else:
        properties:
          permission:
            type: string
    ApprovalStep:
      type: object
      additionalProperties: false
      required: [index, label, assignee, status, decided_by, decided_at, comment]
      properties:
        index:
          type: integer
          minimum: 1
        label:
          type: string
          description: «Директор», «Бухгалтер»
        assignee:
          $ref: '#/components/schemas/StepAssignee'
        status:
          type: string
          enum: [pending, current, approved, returned, rejected, skipped]
        decided_by:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        decided_at:
          type: [string, 'null']
          format: date-time
        comment:
          type: [string, 'null']
    ApprovalObject:
      type: object
      additionalProperties: false
      required: [kind]
      description: Документ EDS (`document_id`, `number`) или КП ERP (`erp_quote_id`, `quote_number`, `quote_version`, `erp_deal_id`)
      if:
        properties:
          kind:
            const: quote
      then:
        required: [erp_quote_id, quote_number, quote_version, erp_deal_id]
        properties:
          erp_quote_id:
            type: integer
          quote_number:
            type: string
          quote_version:
            type: integer
          erp_deal_id:
            type: [integer, 'null']
      else:
        required: [document_id, number]
        properties:
          document_id:
            $ref: '#/components/schemas/Uuid'
          number:
            $ref: '#/components/schemas/DocumentNumber'
      properties:
        kind:
          $ref: '#/components/schemas/ApprovalTemplate'
        document_id:
          $ref: '#/components/schemas/Uuid'
        number:
          $ref: '#/components/schemas/DocumentNumber'
        erp_quote_id:
          type: integer
        quote_number:
          type: string
        quote_version:
          type: integer
          minimum: 1
        erp_deal_id:
          type: [integer, 'null']
        deal_number:
          type: [string, 'null']
    ChecklistItem:
      type: object
      additionalProperties: false
      required: [code, label, ok, blocking, by, at, value]
      description: |
        Строка чек-листа одобрения КП (SPEC-v3 §7.3) — с датой и автором. `margin` сверяет маржу КП с порогом **резолюции EDS**
        (владелец поля — EDS); `min_margin_pct` из события ERP — только снимок для показа. Блокирующие строки (`blocking = true`:
        визы и маржа) — красная запрещает `approve`; строка `due` — предупреждение (`blocking = false`): красная показывает
        опоздание, одобрение остаётся доступным (решение архитектора 2026-10-26, C1-G-1).
      properties:
        code:
          type: string
          enum: [visa_goods, visa_services, margin, due]
          description: виза снабженца, виза гл. инженера, маржа ≥ порога резолюции, срок расчёта выдержан
        label:
          type: string
        ok:
          type: boolean
        blocking:
          type: boolean
          description: '`true` — красная строка блокирует одобрение; `false` — предупреждение (`due`). С 0.2.0'
        by:
          oneOf:
            - $ref: '#/components/schemas/QuoteVisaAuthor'
            - type: 'null'
          description: Кто поставил визу
        at:
          type: [string, 'null']
          format: date-time
        value:
          type: [string, 'null']
          description: Значение для показа (`17.6 % ≥ 15 %`)
    CalcZone:
      type: string
      enum: [goods, services]
      description: Зона визы расчёта (как `CalcZone` события ERP)
    QuoteVisaAuthor:
      type: object
      additionalProperties: false
      required: [crm_user_id, full_name]
      properties:
        crm_user_id:
          type: [integer, 'null']
          description: '`null` — сотрудник ERP без связи с CRM'
        full_name:
          type: string
    QuoteVisa:
      type: object
      additionalProperties: false
      required: [zone, by, at]
      properties:
        zone:
          $ref: '#/components/schemas/CalcZone'
        by:
          $ref: '#/components/schemas/QuoteVisaAuthor'
        at:
          type: string
          format: date-time
    QuoteSnapshot:
      type: object
      additionalProperties: false
      required: [erp_quote_id, number, version, total, currency, margin_pct, min_margin_pct, required_zones, visas, ready_at]
      description: |
        Снимок КП из `uz.railtech.erp.quote.ready_for_approval.v1` (поля — как `QuoteReadyForApproval` события) — только для
        показа; `min_margin_pct` — порог, который видела ERP; чек-лист сверяет с порогом резолюции EDS.
      properties:
        erp_quote_id:
          type: integer
        number:
          type: string
        version:
          type: integer
          minimum: 1
        client_name:
          type: [string, 'null']
        total:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        cost:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        margin_amount:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        margin_pct:
          type: string
          pattern: '^-?\d{1,3}(\.\d{1,2})?$'
          description: Маржа КП, % строкой; может быть отрицательной
        min_margin_pct:
          oneOf:
            - $ref: '#/components/schemas/MarginPct'
            - type: 'null'
        required_zones:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CalcZone'
        visas:
          type: array
          items:
            $ref: '#/components/schemas/QuoteVisa'
        due:
          type: [string, 'null']
          format: date
        ready_at:
          type: string
          format: date-time
        valid_until:
          type: [string, 'null']
          format: date
    ApprovalListItem:
      type: object
      additionalProperties: false
      required: [id, template, title, object, status, round, current_step, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        template:
          $ref: '#/components/schemas/ApprovalTemplate'
        title:
          type: string
        object:
          $ref: '#/components/schemas/ApprovalObject'
        status:
          $ref: '#/components/schemas/RouteStatus'
        round:
          type: integer
          minimum: 1
        current_step:
          oneOf:
            - $ref: '#/components/schemas/ApprovalStep'
            - type: 'null'
          description: '`null` — маршрут закрыт'
        created_at:
          type: string
          format: date-time
    ApprovalPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalListItem'
        next_cursor:
          type: [string, 'null']
    Approval:
      type: object
      additionalProperties: false
      required:
        - id
        - template
        - title
        - object
        - status
        - round
        - steps
        - checklist
        - quote
        - can_decide
        - allowed_decisions
        - outgoing_number
        - approved_late
        - created_at
        - closed_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        template:
          $ref: '#/components/schemas/ApprovalTemplate'
        title:
          type: string
        object:
          $ref: '#/components/schemas/ApprovalObject'
        status:
          $ref: '#/components/schemas/RouteStatus'
        round:
          type: integer
          minimum: 1
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalStep'
        checklist:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
          description: Только КП; у документов — пусто
        quote:
          oneOf:
            - $ref: '#/components/schemas/QuoteSnapshot'
            - type: 'null'
          description: Снимок КП — только тому, кто решает шаг КП; иначе `null`
        can_decide:
          type: boolean
          description: Текущий шаг ждёт этого сотрудника
        allowed_decisions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Decision'
          description: Что можно сейчас (`approve` нет, пока красна хотя бы одна блокирующая строка чек-листа КП)
        outgoing_number:
          oneOf:
            - $ref: '#/components/schemas/OutgoingNumber'
            - type: 'null'
          description: ИСХ-номер одобренного КП
        approved_late:
          type: boolean
          description: |
            КП одобрено с опозданием: готово позже срока резолюции, директор одобрил, приняв опоздание (C1-G-1, с 0.2.0).
            У остальных маршрутов — `false`
        created_at:
          type: string
          format: date-time
        closed_at:
          type: [string, 'null']
          format: date-time
    DecisionIn:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/Decision'
        comment:
          type: [string, 'null']
          maxLength: 4000
          description: Обязателен для `return` и `reject`
        channels:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SendChannel'
          description: Только `approve` КП — каналы отправки клиенту (Telegram-бот, Кабинет, почта)
      if:
        properties:
          decision:
            enum: [return, reject]
      then:
        required: [comment]
        properties:
          comment:
            type: string
            minLength: 1

    RegistryKind:
      type: string
      enum: [letter_in, letter_out, quote, memo, application, report, contract, invoice, act]
      description: 'Вкладки «Все документы»: письма (входящие, исходящие), КП (маршруты одобрения), служебные, заявления, отчёты; с 0.7.0 — договоры, счета и акты проектов (проекция событий ERP)'
    RegistryItem:
      type: object
      additionalProperties: false
      required: [kind, id, number, title, status, registered_at, responsible, client, links]
      properties:
        kind:
          $ref: '#/components/schemas/RegistryKind'
        id:
          $ref: '#/components/schemas/Uuid'
          description: Письмо (`letter_in`), документ (`letter_out`, `memo`, `application`, `report`), маршрут (`quote`) или проекция документа проекта (`contract`, `invoice`, `act`)
        number:
          type: [string, 'null']
          description: Номер реестра EDS или номер КП, договора, счёта, акта ERP; `null` — исходящее до отправки
        title:
          type: string
        status:
          type: string
          description: Значение `LetterStatus`, `DocumentStatus` или `RouteStatus` по типу; у `contract`, `invoice`, `act` — слово SPEC-v3 §2.4 (см. 0.5.0)
        registered_at:
          type: string
          format: date-time
        responsible:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        client:
          oneOf:
            - $ref: '#/components/schemas/LetterSender'
            - type: 'null'
        links:
          $ref: '#/components/schemas/ErpLinks'
    RegistryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegistryItem'
        next_cursor:
          type: [string, 'null']
