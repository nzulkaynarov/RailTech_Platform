        subject:
          type: [string, 'null']
          maxLength: 300
        received_at:
          type: [string, 'null']
          format: date
        file_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
    LetterDuplicateCheck:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 5
          description: Совпадения, точные (`match = exact`) первыми
          items:
            $ref: '#/components/schemas/LetterDuplicate'
    LetterMarkDuplicateIn:
      type: object
      additionalProperties: false
      required: [original_number]
      properties:
        original_number:
          type: string
          minLength: 1
          maxLength: 32
