          application/json:
            schema:
              $ref: '#/components/schemas/SigningRevokeIn'
      responses:
        '200':
          description: Отозвано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningAuthorityDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
