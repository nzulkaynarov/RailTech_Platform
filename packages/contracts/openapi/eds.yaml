          description: '`null` — система'
        comment:
          type: [string, 'null']
        file_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        version:
          type: [integer, 'null']
          minimum: 1

    FileRef:
      type: object
      additionalProperties: false
      required: [id, name, content_type, size, version, sha256, uploaded_at, uploaded_by]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 255
        content_type:
          type: string
        size:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        uploaded_at:
          type: string
          format: date-time
        uploaded_by:
          $ref: '#/components/schemas/PersonRef'
    FileVersions:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileRef'
    FileUploadIn:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
        version_of:
          $ref: '#/components/schemas/Uuid'

    LetterStatus:
      type: string
      enum: [awaiting_resolution, resolved, returned, rejected, in_execution, executed, noted, duplicate]
      description: |
        SPEC-v3 §2.4 («Зарегистрировано → Ждёт резолюции» — одним шагом): `awaiting_resolution` — зарегистрировано и ждёт
        резолюции директора; `resolved` — резолюция «расчёт» наложена (путь `calc`); `returned` — возвращено, письмо у
        регистратора; `rejected` — отклонено. Путь делопроизводства (P8b, SPEC-v3 §3.2a): `in_execution` — «На исполнении»
        (поручения в работе, на контроле), `executed` — «Исполнено» (все поручения исполнены, контроль снят), `noted` —
        «Принято к сведению». `duplicate` — «Дубль ВХ-…» (EDS-DUP): письмо зарегистрировано повторно, закрыто, ссылка на
        оригинал — `Letter.duplicate_of`. Переходы — таблица в описании API.
    Zone:
      type: string
      enum: [goods, services, payment_terms]
      description: 'Зона исполнителя резолюции: `goods` — товары, склад, цены поставщиков (снабженец); `services` — услуги, ТЗ, бригада (гл. инженер); `payment_terms` — условия оплаты (бухгалтер)'
    Assignee:
      type: object
      additionalProperties: false
      required: [crm_user_id, zone]
      properties:
        crm_user_id:
          type: integer
        zone:
          $ref: '#/components/schemas/Zone'
        full_name:
          type: string
          readOnly: true
    ResolutionIn:
      type: object
      additionalProperties: false
      required: [text, assignees, due]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
        assignees:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Assignee'
        due:
          type: string
          format: date
          description: Срок расчёта — не раньше сегодняшней даты по `Asia/Tashkent` (иначе 422, `details.fields.due`)
        min_margin_pct:
          oneOf:
            - $ref: '#/components/schemas/MarginPct'
            - type: 'null'
          description: '«Маржа не ниже, %»; нет или `null` — без ограничения'
    Resolution:
      type: object
      additionalProperties: false
      required: [text, assignees, due, min_margin_pct, decided_by, decided_at]
      properties:
        text:
          type: string
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/Assignee'
        due:
          type: string
          format: date
        min_margin_pct:
          oneOf:
            - $ref: '#/components/schemas/MarginPct'
            - type: 'null'
        decided_by:
          $ref: '#/components/schemas/PersonRef'
        decided_at:
          type: string
          format: date-time
    LetterReturnIn:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 4000
    LetterRejectIn:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 4000
    LetterSubmitIn:
      type: object
      additionalProperties: false
      description: Необязательные правки возвращённого письма перед повторной подачей
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 300
        summary:
          type: string
          minLength: 1
          maxLength: 10000
        links:
          $ref: '#/components/schemas/ErpLinksIn'
        file_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
        comment:
          type: [string, 'null']
          maxLength: 4000
          description: Ответ на комментарий возврата (в журнал)
    LetterSender:
      type: object
      additionalProperties: false
      required: [name]
      description: Организация — отправитель письма, адресат исходящего письма, клиент в реестре
      properties:
        name:
          type: [string, 'null']
          maxLength: 255
          description: '`null` — письмо зарегистрировано по заявке ERP без названия компании, клиент — по `links.crm_client_id`'
        inn:
          type: [string, 'null']
          pattern: '^\d{9,14}$'
    IncomingLetterSender:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        Отправитель входящего письма (с 0.2.0): `LetterSender` и контактное лицо. Письмо по заявке ERP берёт название, ИНН и
        контакт из `erp.request.created` (`payload.company_name`, `company_inn`, `contact_name`; C1-G-7)
      properties:
        name:
          type: [string, 'null']
          maxLength: 255
          description: '`null` — письмо по заявке ERP без названия компании, клиент — по `links.crm_client_id`'
        inn:
          type: [string, 'null']
          pattern: '^\d{9,14}$'
        contact:
          type: [string, 'null']
          maxLength: 255
          description: Контактное лицо отправителя
    SenderRef:
      type: object
      additionalProperties: false
      description: Исходящий номер и дата письма у отправителя
      properties:
        number:
          type: [string, 'null']
          maxLength: 64
        date:
          type: [string, 'null']
          format: date
    ReceiptMethod:
      type: string
      pattern: '^[a-z][a-z_]{0,31}$'
      description: |
        Способ получения (P8) — код справочника `receipt-methods` (EDS-REG: ведёт администратор). Стартовые коды: `post`,
        `paper`, `taxpayer_cabinet`, `courier`, `email`; регистрация со скрытым или неизвестным кодом — 422, поле
        `receipt_method` с `unknown_method`.
    LetterKindCode:
      type: string
      pattern: '^[a-z][a-z_]{0,31}$'
      description: Код вида документа из `GET /letter-kinds`
    LetterKindItem:
      type: object
      additionalProperties: false
      required: [code, name, urgent]
      properties:
        code:
          $ref: '#/components/schemas/LetterKindCode'
        name:
          type: object
          additionalProperties: false
          required: [ru, uz, en]
          properties:
            ru: { type: string }
            uz: { type: string }
            en: { type: string }
        urgent:
          type: boolean
          description: Регистрация этим видом сразу ставит «срочно»
        due_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
          description: Срок исполнения по умолчанию, дней (EDS-REG); `null` — общее правило (срочно 3, обычный 10)
    LetterKindList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LetterKindItem'
    LetterDuplicate:
      type: object
      additionalProperties: false
