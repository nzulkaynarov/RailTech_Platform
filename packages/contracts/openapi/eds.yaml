        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/approvals/{approval_id}/decision:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Решение на текущем шаге (approve, return, reject)
      description: |
        Решает только тот, кого ждёт текущий шаг (назначен по `crm_user_id` или держит право шага); иначе 403
        `FORBIDDEN` (`details.reason = not_your_step`). `comment` обязателен для `return` и `reject` (422). КП: `approve`
        недоступно, пока не выполнены блокирующие строки чек-листа — визы и маржа (проверка на сервере; маржа сверяется с
        порогом резолюции EDS) — 409 `CONFLICT`, `details.reason = checklist_not_green`, `details.failed` — коды красных
        блокирующих строк. Строка «срок» (`due`, `blocking = false`) — предупреждение: КП, готовое позже срока резолюции,
        директор одобряет, осознанно приняв опоздание; маршрут получает `approved_late = true`, журнал — строку
        `approval.approved_late`, событие `approval.decided` — `approved_late: true` (решение архитектора 2026-10-26, C1-G-1).
        При одобрении КП присваивается `ИСХ-NNN/ГГ`, выбранные `channels` уходят в событие. Маршрут закрыт — 409
        (`details.reason = route_closed`). Каждое решение — строка журнала и `approval.decided`.
        Шаг «Бухгалтер» служебной записки с суммой: `approve` недоступно — 409 `CONFLICT`, `details.reason = payment_required`
        (оплату фиксирует `payDocument`: дата, сумма, платёжка); `return` и `reject` работают.
      x-rt-permissions: [memos.approve, approvals.decide, payments.confirm]
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionIn'
      responses:
        '200':
          description: Решение принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/registry:
    get:
      tags: [registry]
      operationId: listRegistry
      summary: Реестр «Все документы» (SPEC-v3 §7.3)
      description: |
        Единый реестр с вкладками по типу и фильтрами статус · период · ответственный · клиент. КП — маршруты одобрения
        (номер КП ERP); договоры, счета и акты проектов (0.7.0, D2-5) — проекция событий ERP: `title` — название сделки,
        `client` и `responsible` — из письма по той же заявке (нет письма — `null`), `links.deal_number` — номер сделки в ERP.

        `registry.read` открывает сам реестр, но он **не шире прав на вид документа**: входящие и исходящие письма
        (`letter_in`, `letter_out`) попадают в выдачу только у сотрудника с `letters.read`; черновики (`status = draft`) —
        только у автора; служебные записки, заявления и отчёты — по видимости документа, КП — по видимости маршрута.
        Отбор идёт до курсора и ограничения страницы: скрытые строки не занимают место на странице. Вкладка, на которую
        у сотрудника нет прав, — `200` с пустой страницей, не `403`.
      x-rt-permissions: [registry.read]
      parameters:
        - $ref: '#/components/parameters/RegistryKind'
        - $ref: '#/components/parameters/RegistryStatus'
        - $ref: '#/components/parameters/RegistryDateFrom'
        - $ref: '#/components/parameters/RegistryDateTo'
        - $ref: '#/components/parameters/RegistryResponsible'
        - $ref: '#/components/parameters/RegistryClient'
        - $ref: '#/components/parameters/RegistryNumber'
        - $ref: '#/components/parameters/RegistryQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница реестра
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/registry/export:
    get:
      tags: [registry]
      operationId: exportRegistry
      summary: Экспорт реестра с теми же фильтрами
      description: |
        Не больше 10 000 строк (иначе 422 `VALIDATION_FAILED`, `details.reason = export_too_large`); в журнал — `registry.export`.
        Видимость строк — как у `GET /registry`: письма только с `letters.read`, чужие черновики не выгружаются.
      x-rt-permissions: [registry.export]
      parameters:
        - $ref: '#/components/parameters/RegistryKind'
        - $ref: '#/components/parameters/RegistryStatus'
        - $ref: '#/components/parameters/RegistryDateFrom'
        - $ref: '#/components/parameters/RegistryDateTo'
        - $ref: '#/components/parameters/RegistryResponsible'
        - $ref: '#/components/parameters/RegistryClient'
        - $ref: '#/components/parameters/RegistryNumber'
        - $ref: '#/components/parameters/RegistryQuery'
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [xlsx, csv]
            default: xlsx
      responses:
        '200':
          description: Файл реестра
          headers:
            Content-Disposition:
              description: '`attachment; filename*=UTF-8''''…`'
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/files:
    post:
      tags: [files]
      operationId: uploadFile
      summary: Загрузить файл или новую версию файла
      description: |
        `multipart/form-data`: `file` и необязательный `version_of` (id файла — новая версия той же цепочки; прежние версии
        остаются). Не больше 25 МБ (413), типы — PDF, изображения, документы Office (415). Файл привязывается к документу
        полем `file_ids` при создании или отправке; непривязанный видит только загрузивший.
      x-rt-permissions: [letters.register, letters.resolve, memos.create, memos.approve, approvals.decide, files.upload]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadIn'
      responses:
        '201':
          description: Файл сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRef'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: '`PAYLOAD_TOO_LARGE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/files/{file_id}:
    get:
      tags: [files]
      operationId: downloadFile
      summary: Скачать файл (поток)
      description: |
        Последняя версия, или `version`. Видит тот, кому виден документ, к которому файл привязан (чужой черновик и исходящее письмо без `letters.read` не видны), или загрузивший; иначе 404.
      x-rt-permissions: [letters.read, memos.create, memos.approve, approvals.decide, registry.read, files.upload]
      parameters:
        - $ref: '#/components/parameters/FileId'
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Содержимое файла
          headers:
            Content-Disposition:
              description: '`attachment; filename*=UTF-8''''…`'
              schema:
                type: string
            ETag:
              description: SHA-256 содержимого версии
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/files/{file_id}/versions:
    get:
      tags: [files]
      operationId: listFileVersions
      summary: Версии файла
      x-rt-permissions: [letters.read, memos.create, memos.approve, approvals.decide, registry.read, files.upload]
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Версии от последней к первой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileVersions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/bus/overview:
    get:
      tags: [bus]
      operationId: busOverview
      summary: Сводка шины EDS — outbox, DLQ, inbox и подписчики
      x-rt-permissions: [bus.manage]
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/bus/deliveries:
    get:
      tags: [bus]
      operationId: busDeliveries
      summary: Доставки событий EDS подписчикам (DLQ — `status=dead`), новые сверху
      x-rt-permissions: [bus.manage]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BusDeliveryStatus'
        - $ref: '#/components/parameters/BusSubscriberQuery'
        - $ref: '#/components/parameters/BusTypeQuery'
        - name: created_from
          in: query
          required: false
          description: Доставка создана не раньше (включительно)
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          required: false
          description: Доставка создана раньше (не включительно)
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          required: false
          description: Страница — id последней строки предыдущей страницы
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница доставок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusDeliveryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/bus/deliveries/{delivery_id}/retry:
    post:
      tags: [bus]
      operationId: busRetryDelivery
      summary: «Повторить» доставку `dead` или ожидающую — сейчас, попытки с нуля; подписчик на паузе получает пробу
      x-rt-permissions: [bus.manage]
      parameters:
        - name: delivery_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Сколько поставлено на повтор (0 — доставлено, в работе или нет такой)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusRetryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/bus/deliveries/retry-dead:
    post:
      tags: [bus]
      operationId: busRetryDead
      summary: «Повторить все dead подписчика» — после исправления причины
      x-rt-permissions: [bus.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusRetryDeadIn'
      responses:
        '200':
          description: Сколько доставок `dead` поставлено на повтор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusRetryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/bus/inbox:
    get:
      tags: [bus]
      operationId: busInbox
      summary: Принятые события, новые сверху; `errors=true` — обработка упала или ждёт автоповтора
      x-rt-permissions: [bus.manage]
      parameters:
        - name: errors
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BusInboxStatus'
        - $ref: '#/components/parameters/BusTypeQuery'
        - name: before
          in: query
          required: false
          description: Страница — `received_at` последней строки предыдущей страницы
          schema:
            type: string
            format: date-time
        - name: before_event_id
          in: query
          required: false
          description: Страница — `event_id` последней строки (строки с тем же временем не теряются)
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница принятых событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusInboxPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/bus/inbox/{event_id}/retry:
    post:
      tags: [bus]
      operationId: busRetryInbox
      summary: «Повторить обработку» записи `failed` или `skipped`
      x-rt-permissions: [bus.manage]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Сколько поставлено на повтор (0 — обработано, ждёт или нет такой записи)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusRetryResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

components:
  securitySchemes:
    edsAccess:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен доступа EDS из `POST /api/v1/auth/sso/exchange` (HS256, `iss = eds`, `aud = eds-api`, 15 минут); токен сотрудника CRM (`aud = eds`) здесь отклоняется — 401 `UNAUTHORIZED`

  parameters:
    LetterId:
      name: letter_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InstructionId:
      name: instruction_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозрачный курсор из `next_cursor`
      schema:
        type: string
        maxLength: 500
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    BusSubscriberQuery:
      name: subscriber
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BusSubscriberName'
    BusTypeQuery:
      name: type
      in: query
      required: false
      description: Подстрока типа события (`quote.`, `letter.registered`)
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Ключ повтора (24 часа)
      schema:
        type: string
        minLength: 8
        maxLength: 128
    RegistryKind:
      name: kind
      in: query
      required: false
      description: Вкладки реестра (несколько — повтором параметра)
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RegistryKind'
      style: form
      explode: true
    RegistryStatus:
      name: status
      in: query
      required: false
      description: Статус объекта (значения — `LetterStatus`, `DocumentStatus`, `RouteStatus` по типу)
      schema:
        type: array
        items:
          type: string
          pattern: '^[a-z_]+$'
      style: form
      explode: true
    RegistryDateFrom:
      name: date_from
      in: query
      required: false
      description: Дата регистрации с (включительно, `Asia/Tashkent`)
      schema:
        type: string
        format: date
    RegistryDateTo:
      name: date_to
      in: query
      required: false
      description: Дата регистрации по (включительно)
      schema:
        type: string
        format: date
    RegistryResponsible:
      name: responsible
      in: query
      required: false
      description: Ответственный — `crm_user_id` (менеджер письма, автор документа, кто решает текущий шаг)
      schema:
        type: integer
    RegistryClient:
      name: crm_client_id
      in: query
      required: false
      description: Клиент CRM
      schema:
        type: integer
    RegistryNumber:
      name: number
      in: query
      required: false
      description: Точный номер (`ВХ-104/26`, `СЗ-2026/031`, `КП-2026/115`)
      schema:
        type: string
        maxLength: 64
    RegistryQuery:
      name: q
      in: query
      required: false
      description: Поиск по номеру и теме
      schema:
        type: string
        maxLength: 200

  responses:
    Unauthorized:
      description: '`UNAUTHORIZED` — нет, неверный или истёкший токен доступа EDS (`details.reason`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`FORBIDDEN` — нет права (`details.permission`) или действие не положено (`details.reason`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: '`CONFLICT` — `details.reason`: `invalid_state`, `route_closed`, `checklist_not_green`, `idempotency_key_reused`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: '`VALIDATION_FAILED` — `details.fields` перечисляет поля'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, source]
      properties:
        code:
          type: string
          description: Стабильный код (`UNAUTHORIZED`, `INVALID_SSO_TOKEN`, `USER_NOT_PROVISIONED`, `USER_INACTIVE`, `FORBIDDEN`, `NOT_FOUND`, `VALIDATION_FAILED`, `CONFLICT`, `PAYLOAD_TOO_LARGE`, `UNSUPPORTED_MEDIA_TYPE`, `BAD_REQUEST`, `INTERNAL_ERROR`)
          examples: [FORBIDDEN]
        message:
          type: string
          description: Текст для сотрудника на его языке
        source:
          type: string
          enum: [eds]
        details:
          type: object
          description: '`reason`, `permission`, `fields` — для разбора, не для показа'
          additionalProperties: true

    EdsPermission:
      type: string
      enum:
        - letters.read
        - letters.register
        - letters.resolve
        - memos.create
        - memos.approve
        - approvals.decide
        - registry.read
        - registry.export
        - payments.confirm
        - bus.manage
        - files.upload
      description: |
        Код права EDS v1 (runbook волны 12 §2.2; `platform-rbac.yaml`, `backend.eds`). `payments.confirm` — шаг «бухгалтер»
        маршрута служебной записки с суммой (решение архитектора). `bus.manage` (0.3.0, W13-A2) — «Журнал интеграций» шины:
        раздел `admin` каталога, уровень `full`. `files.upload` (D1-2b) — загрузить свой файл и читать свои файлы
        (письмо директору к «Создать заявку»): раздел `crm.clients`, уровень `full`. В событиях шины (`identity`, `eds`) код — строка по шаблону
        `^[a-z_]+\.[a-z_]+$`, не перечень: новый код не ломает события v1.

    Uuid:
      type: string
      format: uuid

    BusSubscriberName:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,63}$'
      description: Имя подписчика шины (`crm`, `erp`, `platform-bff`)
    BusDeliveryStatus:
      type: string
      enum: [pending, in_flight, delivered, dead]
    BusInboxStatus:
      type: string
      enum: [received, processed, failed, skipped]
    BusSubscriber:
      type: object
      additionalProperties: false
      required: [name, configured, enabled, drop, endpoint, pending, in_flight, dead, oldest_undelivered_age_seconds,
                 consecutive_failures, paused_until, last_failure_at, last_success_at, last_error]
      description: |
        Подписчик издателя. `configured = false` — его больше нет в файле подписок, но остались доставки или состояние.
        `paused_until` — действующая пауза предохранителя (в будущем), иначе `null`. `endpoint` — адрес приёмника: только
        схема, хост, порт и путь. `oldest_undelivered_age_seconds` — возраст самого старого недоставленного (без `dead`).
      properties:
        name:
          type: string
        configured:
          type: boolean
        enabled:
          type: boolean
        drop:
          type: boolean
        endpoint:
          type: [string, 'null']
        pending:
          type: integer
        in_flight:
          type: integer
        dead:
          type: integer
        oldest_undelivered_age_seconds:
          type: [number, 'null']
        consecutive_failures:
          type: integer
        paused_until:
          type: [string, 'null']
          format: date-time
        last_failure_at:
          type: [string, 'null']
          format: date-time
        last_success_at:
          type: [string, 'null']
          format: date-time
        last_error:
          type: [string, 'null']
    BusOverview:
      type: object
      additionalProperties: false
      required: [service, outbox_pending, oldest_undelivered_age_seconds, dlq_size, inbox_received, inbox_retrying,
                 inbox_failed, subscribers]
      properties:
        service:
          type: string
        outbox_pending:
          type: integer
        oldest_undelivered_age_seconds:
          type: [number, 'null']
        dlq_size:
          type: integer
        inbox_received:
          type: integer
        inbox_retrying:
          type: integer
        inbox_failed:
          type: integer
        subscribers:
          type: array
          items:
            $ref: '#/components/schemas/BusSubscriber'
    BusDelivery:
      type: object
      additionalProperties: false
      required: [id, event_id, event_type, subscriber, status, attempts, next_attempt_at, last_attempt_at, last_status_code,
                 last_error, delivered_at, created_at, subject, correlation_id, event_created_at]
      description: Метаданные доставки; тела события нет.
      properties:
        id:
          type: integer
        event_id:
          $ref: '#/components/schemas/Uuid'
        event_type:
          type: string
        subscriber:
          type: string
        status:
          $ref: '#/components/schemas/BusDeliveryStatus'
        attempts:
          type: integer
        next_attempt_at:
          type: [string, 'null']
          format: date-time
        last_attempt_at:
          type: [string, 'null']
          format: date-time
        last_status_code:
          type: [integer, 'null']
        last_error:
          type: [string, 'null']
        delivered_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        subject:
          type: [string, 'null']
        correlation_id:
          type: [string, 'null']
        event_created_at:
          type: [string, 'null']
          format: date-time
    BusDeliveryPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusDelivery'
        has_more:
          type: boolean
    BusInboxEntry:
      type: object
      additionalProperties: false
      required: [event_id, type, publisher, subject, correlation_id, status, attempts, error, received_at, processed_at]
      description: Принятое событие (метаданные; тела нет).
      properties:
        event_id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
        publisher:
          type: string
        subject:
          type: [string, 'null']
        correlation_id:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/BusInboxStatus'
        attempts:
          type: integer
        error:
          type: [string, 'null']
        received_at:
          type: string
          format: date-time
        processed_at:
          type: [string, 'null']
          format: date-time
    BusInboxPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusInboxEntry'
        has_more:
          type: boolean
    BusRetryDeadIn:
      type: object
      additionalProperties: false
      required: [subscriber]
      properties:
        subscriber:
          $ref: '#/components/schemas/BusSubscriberName'
    BusRetryResult:
      type: object
      additionalProperties: false
      required: [retried]
      properties:
        retried:
          type: integer
          minimum: 0

    Amount:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Деньги строкой с двумя знаками
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
    MarginPct:
      type: string
      pattern: '^(100(\.0{1,2})?|\d{1,2}(\.\d{1,2})?)$'
      description: Процент 0–100 строкой, до двух знаков (`15`, `12.5`)
    LetterNumber:
      type: string
      pattern: '^ВХ-\d{3,}/\d{2}$'
      examples: [ВХ-104/26]
    OutgoingNumber:
      type: string
      pattern: '^ИСХ-\d{3,}/\d{2}$'
      examples: [ИСХ-082/26]
    DocumentNumber:
      type: string
      pattern: '^(ИСХ-\d{3,}/\d{2}|(СЗ|ЗЯ|ОТ)-\d{4}/\d{3,})$'
      description: '`СЗ-ГГГГ/NNN`, `ЗЯ-ГГГГ/NNN`, `ОТ-ГГГГ/NNN`, `ИСХ-NNN/ГГ` (исходящее письмо)'
      examples: [СЗ-2026/031]

    PersonRef:
      type: object
      additionalProperties: false
      required: [crm_user_id, full_name]
      properties:
        crm_user_id:
          type: integer
        full_name:
          type: string

    Me:
      type: object
      additionalProperties: false
      required: [crm_user_id, full_name, email, permissions]
      properties:
        crm_user_id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EdsPermission'
          description: Права по проекции на момент запроса

    SsoExchangeIn:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 4096
          description: Токен сотрудника CRM с `aud = eds`
    AccessToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
          const: 900
          description: Секунды; refresh нет

    Health:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        version:
          type: string
          description: Версия сборки сервиса
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          description: Зависимости (`database`, …)

    ErpLinks:
      type: object
      additionalProperties: false
      required: [erp_request_id, erp_deal_id, deal_number]
      description: Ссылки на заявку и сделку ERP и клиента CRM; `null` — ещё не связано
      properties:
        erp_request_id:
          type: [integer, 'null']
        erp_deal_id:
          type: [integer, 'null']
        deal_number:
          type: [string, 'null']
          maxLength: 64
          description: Бизнес-номер заявки или проекта ERP (`ЗВ-ГГГГ-NNN`, `ПР-ГГГГ-NNN`)
        crm_client_id:
          type: [integer, 'null']
        erp_company_id:
          type: [integer, 'null']
    ErpLinksIn:
      type: object
      additionalProperties: false
      properties:
        erp_request_id:
          type: [integer, 'null']
        erp_deal_id:
          type: [integer, 'null']
        deal_number:
          type: [string, 'null']
          maxLength: 64
        crm_client_id:
          type: [integer, 'null']
        erp_company_id:
          type: [integer, 'null']

    JournalEntry:
      type: object
      additionalProperties: false
      required: [at, action, by]
      description: Строка журнала «кто, что, когда, файл»
      properties:
        at:
          type: string
          format: date-time
        action:
          type: string
          pattern: '^[a-z_.]+$'
          description: '`letter.registered`, `letter.resolved`, `document.submitted`, `approval.decided`, `file.attached`, …'
          examples: [approval.decided]
        by:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
          description: '`null` — система'
        comment:
          type: [string, 'null']
        file_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        version:
          type: [integer, 'null']
          minimum: 1

    FileRef:
      type: object
      additionalProperties: false
      required: [id, name, content_type, size, version, sha256, uploaded_at, uploaded_by]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 255
        content_type:
          type: string
        size:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        uploaded_at:
          type: string
          format: date-time
        uploaded_by:
          $ref: '#/components/schemas/PersonRef'
    FileVersions:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileRef'
    FileUploadIn:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
        version_of:
          $ref: '#/components/schemas/Uuid'

    LetterStatus:
      type: string
      enum: [awaiting_resolution, resolved, returned, rejected, in_execution, executed, noted]
      description: |
        SPEC-v3 §2.4 («Зарегистрировано → Ждёт резолюции» — одним шагом): `awaiting_resolution` — зарегистрировано и ждёт
        резолюции директора; `resolved` — резолюция «расчёт» наложена (путь `calc`); `returned` — возвращено, письмо у
        регистратора; `rejected` — отклонено. Путь делопроизводства (P8b, SPEC-v3 §3.2a): `in_execution` — «На исполнении»
        (поручения в работе, на контроле), `executed` — «Исполнено» (все поручения исполнены, контроль снят), `noted` —
        «Принято к сведению». Переходы — таблица в описании API.
    Zone:
      type: string
      enum: [goods, services, payment_terms]
      description: 'Зона исполнителя резолюции: `goods` — товары, склад, цены поставщиков (снабженец); `services` — услуги, ТЗ, бригада (гл. инженер); `payment_terms` — условия оплаты (бухгалтер)'
    Assignee:
      type: object
      additionalProperties: false
      required: [crm_user_id, zone]
      properties:
        crm_user_id:
          type: integer
        zone:
          $ref: '#/components/schemas/Zone'
        full_name:
          type: string
          readOnly: true
    ResolutionIn:
      type: object
      additionalProperties: false
      required: [text, assignees, due]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
        assignees:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Assignee'
        due:
          type: string
          format: date
          description: Срок расчёта — не раньше сегодняшней даты по `Asia/Tashkent` (иначе 422, `details.fields.due`)
        min_margin_pct:
          oneOf:
            - $ref: '#/components/schemas/MarginPct'
            - type: 'null'
          description: '«Маржа не ниже, %»; нет или `null` — без ограничения'
    Resolution:
      type: object
      additionalProperties: false
      required: [text, assignees, due, min_margin_pct, decided_by, decided_at]
      properties:
        text:
          type: string
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/Assignee'
        due:
          type: string
          format: date
        min_margin_pct:
          oneOf:
            - $ref: '#/components/schemas/MarginPct'
            - type: 'null'
        decided_by:
          $ref: '#/components/schemas/PersonRef'
        decided_at:
          type: string
          format: date-time
    LetterReturnIn:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 4000
    LetterRejectIn:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 4000
    LetterSubmitIn:
      type: object
      additionalProperties: false
      description: Необязательные правки возвращённого письма перед повторной подачей
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 300
        summary:
          type: string
          minLength: 1
          maxLength: 10000
        links:
          $ref: '#/components/schemas/ErpLinksIn'
        file_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
        comment:
          type: [string, 'null']
          maxLength: 4000
          description: Ответ на комментарий возврата (в журнал)
    LetterSender:
      type: object
      additionalProperties: false
      required: [name]
      description: Организация — отправитель письма, адресат исходящего письма, клиент в реестре
      properties:
        name:
          type: [string, 'null']
          maxLength: 255
          description: '`null` — письмо зарегистрировано по заявке ERP без названия компании, клиент — по `links.crm_client_id`'
        inn:
          type: [string, 'null']
          pattern: '^\d{9,14}$'
    IncomingLetterSender:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        Отправитель входящего письма (с 0.2.0): `LetterSender` и контактное лицо. Письмо по заявке ERP берёт название, ИНН и
        контакт из `erp.request.created` (`payload.company_name`, `company_inn`, `contact_name`; C1-G-7)
      properties:
        name:
          type: [string, 'null']
          maxLength: 255
          description: '`null` — письмо по заявке ERP без названия компании, клиент — по `links.crm_client_id`'
        inn:
          type: [string, 'null']
          pattern: '^\d{9,14}$'
        contact:
          type: [string, 'null']
          maxLength: 255
          description: Контактное лицо отправителя
    SenderRef:
      type: object
      additionalProperties: false
      description: Исходящий номер и дата письма у отправителя
      properties:
        number:
          type: [string, 'null']
          maxLength: 64
        date:
          type: [string, 'null']
          format: date
    ReceiptMethod:
      type: string
      enum: [post, paper, taxpayer_cabinet, courier, email]
      description: Способ получения (P8) — почта, бумага из рук, кабинет налогоплательщика my.soliq, курьер, e-mail
    LetterKindCode:
      type: string
      pattern: '^[a-z][a-z_]{0,31}$'
      description: Код вида документа из `GET /letter-kinds`
    LetterKindItem:
      type: object
      additionalProperties: false
      required: [code, name, urgent]
      properties:
        code:
          $ref: '#/components/schemas/LetterKindCode'
        name:
          type: object
          additionalProperties: false
          required: [ru, uz, en]
          properties:
            ru: { type: string }
            uz: { type: string }
            en: { type: string }
        urgent:
          type: boolean
          description: Регистрация этим видом сразу ставит «срочно»
    LetterKindList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LetterKindItem'
    LetterDuplicate:
      type: object
      additionalProperties: false
      required: [id, number, subject, received_at, status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        number:
          $ref: '#/components/schemas/LetterNumber'
        subject:
          type: string
        received_at:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/LetterStatus'
    LetterDuplicateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/LetterDuplicate'
    LetterRelatedRef:
      type: object
      additionalProperties: false
      required: [kind, id, number]
      description: Связанный документ карточки — предыдущий ВХ (`letter_in`) или наш ИСХ (`letter_out`)
      properties:
        kind:
          type: string
          enum: [letter_in, letter_out]
        id:
          $ref: '#/components/schemas/Uuid'
        number:
          type: string
    LetterCreate:
      type: object
      additionalProperties: false
      required: [subject, sender, received_at]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 300
        summary:
          type: string
          minLength: 1
          maxLength: 10000
          description: Суть документа (краткое содержание); не задана — тема
        sender:
          $ref: '#/components/schemas/IncomingLetterSender'
        sender_ref:
          $ref: '#/components/schemas/SenderRef'
        received_at:
          type: string
          format: date
        kind:
          oneOf:
            - $ref: '#/components/schemas/LetterKindCode'
            - type: 'null'
        receipt_method:
          oneOf:
            - $ref: '#/components/schemas/ReceiptMethod'
            - type: 'null'
        signed_by:
          type: [string, 'null']
          maxLength: 255
          description: Кто подписал у отправителя
        document_due:
          type: [string, 'null']
          format: date
          description: Срок по документу (срок ответа или исполнения, указанный отправителем)
        related_number:
          type: [string, 'null']
          minLength: 1
          maxLength: 32
          description: Номер предыдущего ВХ или нашего ИСХ, на который ссылается письмо
        addressee_crm_user_id:
          type: [integer, 'null']
          description: На чьё имя (активный сотрудник); нет — директор
        resolution_draft:
          oneOf:
            - $ref: '#/components/schemas/ResolutionDraftIn'
            - type: 'null'
          description: Проект резолюции делопроизводителя (P8b) — те же правила, что у `PUT …/resolution-draft`
        manager_crm_user_id:
          type: [integer, 'null']
          description: Ответственный менеджер
        urgent:
          type: boolean
          default: false
        links:
          $ref: '#/components/schemas/ErpLinksIn'
        file_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
    LetterListItem:
      type: object
      additionalProperties: false
      required: [id, number, subject, sender, received_at, status, links, urgent]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        number:
          $ref: '#/components/schemas/LetterNumber'
        subject:
          type: string
        sender:
          $ref: '#/components/schemas/IncomingLetterSender'
        received_at:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/LetterStatus'
        links:
          $ref: '#/components/schemas/ErpLinks'
        urgent:
          type: boolean
        due:
          type: [string, 'null']
          format: date
          description: Срок по резолюции — расчёта (путь `calc`) или ответственного (путь `office`)
        kind:
          type: [string, 'null']
          description: Код вида документа (P8); у писем по заявкам — `null`
        track:
          $ref: '#/components/schemas/LetterTrack'
        on_control:
          type: boolean
          description: На контроле — поручения в работе (P8b)
        overdue:
          type: boolean
          description: Есть просроченное поручение (P8b)
        executor:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
          description: Ответственный исполнитель поручения (P8b); у пути `calc` — `null`
    LetterPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LetterListItem'
        next_cursor:
          type: [string, 'null']
    Letter:
      type: object
      additionalProperties: false
      required:
        - id
        - number
        - status
        - subject
        - summary
        - sender
        - received_at
        - registered_at
        - registered_by
        - addressee
        - manager
        - urgent
        - links
        - files
        - resolution
        - return_comment
        - reject_reason
        - journal
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        number:
          $ref: '#/components/schemas/LetterNumber'
        status:
          $ref: '#/components/schemas/LetterStatus'
        subject:
          type: string
        summary:
          type: string
        sender:
          $ref: '#/components/schemas/IncomingLetterSender'
        sender_ref:
          $ref: '#/components/schemas/SenderRef'
        received_at:
          type: string
          format: date
        registered_at:
          type: string
          format: date-time
        registered_by:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
          description: '`null` — зарегистрировано системой по заявке ERP'
        addressee:
          $ref: '#/components/schemas/PersonRef'
        manager:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        urgent:
          type: boolean
        links:
          $ref: '#/components/schemas/ErpLinks'
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileRef'
        resolution:
          oneOf:
            - $ref: '#/components/schemas/Resolution'
            - type: 'null'
        return_comment:
          type: [string, 'null']
        reject_reason:
          type: [string, 'null']
        journal:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'
        kind:
          type: [string, 'null']
          description: Код вида документа (P8); у писем по заявкам — `null`
        receipt_method:
          oneOf:
            - $ref: '#/components/schemas/ReceiptMethod'
            - type: 'null'
        signed_by:
          type: [string, 'null']
        document_due:
          type: [string, 'null']
          format: date
        related:
          oneOf:
            - $ref: '#/components/schemas/LetterRelatedRef'
            - type: 'null'
        track:
          $ref: '#/components/schemas/LetterTrack'
        on_control:
          type: boolean
          description: На контроле (P8b) — есть поручения в работе
        suggested_due:
          type: [string, 'null']
          format: date
          description: |
            Подсказка срока резолюции пути `office` (P8b, бенчмарк СЭД §6.4): срок по документу минус рабочий день; без
            него — дата регистрации плюс 3 дня («срочно») или 10 дней; выходной (сб, вс) переносится на понедельник; не
            раньше сегодня. У пути `calc` — `null`.
        resolution_draft:
          oneOf:
            - $ref: '#/components/schemas/ResolutionDraft'
            - type: 'null'
        office_resolution:
          oneOf:
            - $ref: '#/components/schemas/OfficeResolution'
            - type: 'null'
          description: Резолюция пути делопроизводства; у пути `calc` — `resolution`
        instructions:
          type: array
          description: Поручения (ответственный первым)
          items:
            $ref: '#/components/schemas/Instruction'
        acquaintances:
          type: array
          items:
            $ref: '#/components/schemas/Acquaintance'
        executed_at:
          type: [string, 'null']
          format: date-time
          description: Когда исполнены все поручения

    LetterTrack:
      type: string
      enum: [calc, office]
      description: |
        Путь резолюции (P8b, SPEC-v3 §3.2a). `calc` — письмо по заявке клиента: есть `links.erp_request_id`, или вид
        документа не задан и есть `links.erp_deal_id` (письма «Создать заявку» и до P8); резолюция «расчёт по зонам»
        (`POST …/resolution`). `office` — остальное, в том числе письмо с видом документа, связанное с заявкой как контекст;
        резолюция трёх типов (`POST …/office-resolution`). Путь вычисляет EDS, экран его не выбирает.
    ResolutionKind:
      type: string
      enum: [execute, reply, info]
      description: Тип резолюции пути делопроизводства — `execute` «К исполнению», `reply` «Подготовить ответ», `info` «Для сведения»
    ResolutionDraftIn:
      type: object
      additionalProperties: false
      description: Проект резолюции делопроизводителя; все поля необязательны, `kind = null` — проекта нет
      properties:
        kind:
          oneOf:
            - $ref: '#/components/schemas/ResolutionKind'
            - type: 'null'
        responsible_crm_user_id:
          type: [integer, 'null']
        due:
          type: [string, 'null']
          format: date
        text:
          type: [string, 'null']
          maxLength: 4000
        co_executor_ids:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            type: integer
        acquaint_ids:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            type: integer
    ResolutionDraft:
      type: object
      additionalProperties: false
      required: [kind, responsible, due, text, co_executors, acquaint, drafted_by, drafted_at]
      properties:
        kind:
          oneOf:
            - $ref: '#/components/schemas/ResolutionKind'
            - type: 'null'
        responsible:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        due:
          type: [string, 'null']
          format: date
        text:
          type: [string, 'null']
        co_executors:
          type: array
          items:
            $ref: '#/components/schemas/PersonRef'
        acquaint:
          type: array
          items:
            $ref: '#/components/schemas/PersonRef'
        drafted_by:
          $ref: '#/components/schemas/PersonRef'
        drafted_at:
          type: string
          format: date-time
    OfficeResolutionIn:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          $ref: '#/components/schemas/ResolutionKind'
        responsible_crm_user_id:
          type: [integer, 'null']
          description: Обязателен для `execute` и `reply`
        due:
          type: [string, 'null']
          format: date
          description: Обязателен для `execute` и `reply`; подсказка — `Letter.suggested_due`
        text:
          type: string
          minLength: 1
          maxLength: 4000
        co_executor_ids:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            type: integer
        acquaint_ids:
