        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    staffJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен сотрудника ERP (HS256), выдаётся входом или обменом SSO-токена

  responses:
    Unauthorized:
      description: Нет действительного токена сотрудника
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Недостаточно прав для выполнения действия
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
      additionalProperties: false

    StaffRole:
      type: string
      description: |
        Роли бэк-офиса (DECISIONS 2026-10-13, M1-ERP-05);
        6 канонических ролей: CALCULATION, CATALOG_SUPPLY, FULFILLMENT, FINANCE, HEAD, VIEWER;
        admin = суперпользователь; estimator, catalog_supply, fulfilment_logistics — легаси-алиасы.
      enum:
        - admin
        - CALCULATION
        - CATALOG_SUPPLY
        - FULFILLMENT
        - FINANCE
        - HEAD
        - VIEWER
        - estimator
        - catalog_supply
        - fulfilment_logistics

    StaffUser:
      type: object
      required: [erp_user_id, crm_user_id, email, name, roles, permissions, platform_access]
      properties:
        erp_user_id:
          type: integer
          format: int64
        crm_user_id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/StaffRole'
        permissions:
          type: array
          items:
            type: string
            pattern: '^(deal|quote|contract|catalog|supply|fulfillment|finance|settings|team|data)\.[a-z_*]+$'
        platform_access:
          type: array
          description: Системы, доступные сотруднику (решает переключатель в шапке)
          items:
            type: string
            enum: [crm, erp]

    StaffSession:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          minimum: 60
        user:
          $ref: '#/components/schemas/StaffUser'
      additionalProperties: false

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          required: [database, migrations, redis, worker]
          properties:
            database:
              type: boolean
            migrations:
              type: boolean
            redis:
              type: boolean
            worker:
              type: boolean
          additionalProperties: false
      additionalProperties: false

    CompanySettings:
      type: object
      description: Настройки компании (КП-умолчания, префиксы, каталог)
      properties:
        id:
          type: integer
        company:
          type: integer
        default_delivery_basis:
          type: [integer, 'null']
        default_delivery_basis_code:
          type: [string, 'null']
        default_cost_currency:
          type: [integer, 'null']
        default_cost_currency_code:
          type: [string, 'null']
        default_vat_rate:
          type: string
        default_target_margin:
          type: string
        default_validity_days:
          type: integer
        numbering_prefix:
          type: string
        auto_numbering_enabled:
          type: boolean
        catalog_visible_to_all:
          type: boolean
        catalog_allow_rfq_anonymous:
          type: boolean
      required:
        - id
        - company
        - default_vat_rate
        - default_target_margin
        - default_validity_days
        - numbering_prefix

    CompanySettingsUpdate:
      type: object
      description: Поля обновления настроек компании
      properties:
        default_delivery_basis:
          type: string
          description: Код базиса (например 'FCA')
        default_cost_currency:
          type: string
          description: Код валюты (например 'USD')
        default_vat_rate:
          type: string
        default_target_margin:
          type: string
        default_validity_days:
          type: integer
        numbering_prefix:
          type: string
        auto_numbering_enabled:
          type: boolean
        catalog_visible_to_all:
          type: boolean
        catalog_allow_rfq_anonymous:
          type: boolean

    SystemSettings:
      type: object
      description: Общесистемные настройки платформы
      properties:
        platform_name:
          type: string
        support_email:
          type: string
          format: email
        default_language:
          type: string
        maintenance_mode:
          type: boolean

    EmailTemplate:
      type: object
      description: Шаблон почтовых уведомлений
      required: [id, key, subject, html_body, text_body, language, is_active]
      properties:
        id:
          type: integer
        key:
          type: string
        subject:
          type: string
        html_body:
          type: string
        text_body:
          type: string
        language:
          type: string
        is_active:
          type: boolean
        updated_by:
          type: [integer, 'null']
        updated_at:
          type: string
          format: date-time

    EmailTemplateCreate:
      type: object
      required: [key, subject, html_body, text_body]
      properties:
        key:
          type: string
        subject:
          type: string
        html_body:
          type: string
        text_body:
          type: string
        language:
          type: string
          default: ru
        is_active:
          type: boolean
          default: true

    EmailTemplatePreviewRequest:
      type: object
      properties:
        context:
          type: object

    EmailTemplatePreviewResponse:
      type: object
      required: [subject, html_body, text_body]
      properties:
        subject:
          type: string
        html_body:
          type: string
        text_body:
          type: string

    EmailTemplateTestSendRequest:
      type: object
      required: [recipient]
      properties:
        recipient:
          type: string
          format: email
        context:
          type: object

    Country:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        name_ru:
          type: string
        name_uz:
          type: string
        name_en:
          type: string
        is_active:
          type: boolean

    Currency:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        symbol:
          type: string
        rate_to_base:
          type: string
        is_active:
          type: boolean

    UnitOfMeasure:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        symbol:
          type: string
        is_active:
          type: boolean

    DeliveryBasis:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        description:
          type: string
        is_active:
          type: boolean

    HsCodeDuties:
      type: object
      required: [code, customs_duty_rate, vat_rate]
      properties:
        code:
          type: string
        customs_duty_rate:
          type: number
        vat_rate:
          type: number
        excise_rate:
          type: number
        source:
          type: string

    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        parent:
          type: [integer, 'null']
        domain_type:
          type: [integer, 'null']
        level:
          type: integer
        is_active:
          type: boolean

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        code:
          type: string
        parent:
          type: [integer, 'null']
        domain_type:
          type: [integer, 'null']
        is_active:
          type: boolean

    QuoteFxOverrideRequest:
      type: object
      required: [currency, reason]
      properties:
        currency:
          type: string
          description: Код валюты себестоимости (не UZS)
        rate:
          type: [string, 'null']
          description: Курс UZS за 1 единицу (> 0); null или пусто — снять договорной курс
        reason:
          type: string
          description: Причина изменения (обязательна, пишется в журнал)

    ReferenceQuote:
      type: object
      required: [id, number, version, status_code, frozen_at, fx_fixed_at]
      properties:
        id:
          type: integer
        number:
          type: string
        version:
          type: integer
        status_code:
          type: string
        frozen_at:
          type: [string, 'null']
        fx_fixed_at:
          type: [string, 'null']

    MarginDeviationRow:
      type: object
      properties:
        currency:
          type: string
        lines:
          type: integer
        quoted_amount:
          type: string
        quoted_rate:
          type: [string, 'null']
        quoted_rate_date:
          type: [string, 'null']
        quoted_cost:
          type: string
        has_actual:
          type: boolean
        actual_amount:
          type: [string, 'null']
        actual_rate:
          type: [string, 'null']
        actual_cost:
          type: string
        cost_deviation:
          type: string
        purchased_on:
          type: [string, 'null']

    MarginDeviation:
      type: object
      required: [deal, currency, has_actuals, reference_quote, rows]
      properties:
        deal:
          type: integer
        currency:
          type: string
        has_actuals:
          type: boolean
        reference_quote:
          $ref: '#/components/schemas/ReferenceQuote'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/MarginDeviationRow'
        revenue:
          type: string
        quoted_cost:
          type: string
        quoted_profit:
          type: string
        quoted_margin_percent:
          type: string
        actual_cost:
          type: string
        actual_profit:
          type: string
        actual_margin_percent:
          type: string
        deviation_amount:
          type: string
        deviation_percent_points:
          type: string
        deviation_profit_percent:
          type: [string, 'null']

    PurchaseActual:
      type: object
      required: [deal, currency, actual_amount, actual_rate, actual_cost, purchased_on]
      properties:
        id:
          type: integer
        deal:
          type: integer
        currency:
          type: string
        actual_amount:
          type: string
        actual_rate:
          type: string
        actual_cost:
          type: string
        purchased_on:
          type: string
          format: date
        notes:
          type: string

    PurchaseActualInput:
      type: object
      required: [currency, actual_amount, actual_rate, purchased_on]
      properties:
        currency:
          type: string
        actual_amount:
          type: string
        actual_rate:
          type: string
        purchased_on:
          type: string
          format: date
        notes:
          type: string

    Contract:
      type: object
      required: [id, number]
      properties:
        id:
          type: integer
        number:
          type: string
        deal:
          type: integer
        total_amount:
          type: string
        currency:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
