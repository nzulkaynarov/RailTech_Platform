  /crm/quotes/{id}/fx-override:
    post:
      tags: [quotes]
      operationId: quoteFxOverride
      summary: Установить или снять договорной курс КП по валюте себестоимости
      description: |
        Договорной курс побеждает курс ЦБ в снимке, КП пересчитывается.
        Требуется право `finance.rates`, указание причины обязательно (пишется в журнал КП).
        Доступно только до отправки КП клиенту (незамороженное КП).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteFxOverrideRequest'
      responses:
        '200':
          description: Курс установлен/снят, КП пересчитано
          content:
            application/json:
              schema:
                type: object
                required: [id, number, status]
                properties:
                  id:
                    type: integer
                  number:
                    type: string
                  status:
                    type: string
                  total_amount:
                    type: string
        '400':
          description: Некорректный курс или валюта UZS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: КП заморожено (QUOTE_FROZEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /finance/deals/{deal_id}/margin-deviation:
