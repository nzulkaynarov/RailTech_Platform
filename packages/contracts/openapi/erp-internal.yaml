openapi: 3.1.0
info:
  title: RailTech Platform ERP — Internal API (ERP SPA)
  version: 0.1.0
  summary: Пространство `/api/v1/` — вызывает ERP SPA от имени сотрудников бэк-офиса.
  description: |
    Внутренний API ERP для ERP SPA (бэк-офис). Содержит контрактные эндпоинты аутентификации/SSO,
    здоровья, настроек (Settings Hub), мастер-данных, категорий, фиксации валютных курсов КП,
    учёта отклонения маржи и договоров (M1-ERP-10). Полный автогенерируемый снимок всех 212 эндпоинтов
    DRF доступен в `packages/contracts/openapi/erp-internal-full.json`.
servers:
  - url: https://erp.railtech.uz/api/v1
    description: prod
  - url: http://erp.localhost/api/v1
    description: стенд ансамбля (infra/compose)
security:
  - staffJwt: []
tags:
  - name: auth
  - name: system
  - name: settings
  - name: master-data
  - name: catalog
  - name: quotes
  - name: finance
  - name: contracts

paths:
  /auth/sso/exchange:
    post:
      tags: [auth]
      operationId: exchangeSsoToken
      summary: Обмен SSO-токена CRM на сессию ERP
      description: |
        Принимает одноразовый JWT (`iss=crm`, `aud=erp`, 60 с, `jti` хранится 10 мин), находит пользователя
        только по `sub` (сопоставление `CrmUserMapping`; не создаёт и не меняет права), выдаёт пару токенов
        сотрудника ERP и пишет аудит перехода.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: SSO-токен по `packages/contracts/sso-token.md`
              additionalProperties: false
      responses:
        '200':
          description: Сессия ERP выдана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSession'
        '401':
          description: Подпись, `aud`, срок или одноразовость `jti` не прошли
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь не провижинен в ERP или деактивирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/sso/token:
    post:
      tags: [auth]
      operationId: issueSsoToken
      summary: Выдать SSO-токен для перехода в CRM
      description: Доступно только пользователю с сопоставлением `CrmUserMapping` (провижининг из CRM); иначе 403 `USER_NOT_PROVISIONED`.
      responses:
        '200':
          description: Токен на 60 с
          content:
            application/json:
              schema:
                type: object
                required: [token, redirect_url]
                properties:
                  token:
                    type: string
                  redirect_url:
                    type: string
                    format: uri
                    description: 'Точка приёма в CRM, например `https://crm.railtech.uz/sso/exchange`'
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет сопоставления с CRM (`USER_NOT_PROVISIONED`) или пользователь неактивен (`USER_INACTIVE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me:
    get:
      tags: [auth]
      operationId: getCurrentStaff
      summary: Текущий сотрудник, роли и права
      responses:
        '200':
          description: Сотрудник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness ERP
      security: []
      responses:
        '200':
          description: Процесс жив
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
                additionalProperties: false

  /ready:
    get:
      tags: [system]
      operationId: getReady
      summary: Readiness ERP (база, миграции, Redis, очередь)
      security: []
      responses:
        '200':
          description: Готова принимать трафик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Не готова
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

