    post:
      tags: [contracts]
      operationId: createContract
      summary: Создать договор
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contract'
      responses:
        '201':
          description: Договор создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /crm/contracts/{id}:
    get:
      tags: [contracts]
      operationId: retrieveContract
      summary: Получить договор
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
