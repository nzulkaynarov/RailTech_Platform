      responses:
        '204':
          description: Запись удалена

  /crm/contracts:
    get:
      tags: [contracts]
      operationId: listContracts
      summary: Список договоров
      parameters:
        - name: deal
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Список договоров
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contract'
        '401':
