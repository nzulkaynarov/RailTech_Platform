          - {$ref: '#/components/schemas/IntegrationCardKey'}
          - {type: 'null'}
        state: {$ref: '#/components/schemas/ServiceState'}
        flaps_24h: {type: integer, description: 'Провалов (полос сбоя) за сутки: много — «Нестабильно»'}
        cause_key: {type: string, description: 'Корень причины; у сервисов с общей причиной он общий'}
        owner:
          anyOf:
          - {$ref: '#/components/schemas/ServiceOwner'}
          - {type: 'null'}
        action:
          anyOf:
          - {$ref: '#/components/schemas/ServiceAction'}
          - {type: 'null'}
        more_actions:
          type: array
          items: {$ref: '#/components/schemas/ServiceAction'}
        since: {type: [string, 'null'], format: date-time, description: 'Когда впервые обнаружено (не в порядке с …)'}
        last_recovered_at: {type: [string, 'null'], format: date-time, description: 'Когда восстановился после последнего сбоя за 30 дней — «восстановлено в …» из журнала инцидентов'}
      required: [check, checked_at, checks_24h, error, failures_24h, frequency, hint, incident, key, latency_ms, p95_ms_24h, purpose,
        source, stale, status, summary, switch, system, title, uptime_24h, uptime_7d, fix_card, state, cause_key, owner, action,
        more_actions, since, last_recovered_at, flaps_24h]
      type: object
      additionalProperties: false
    ExternalServiceDetail:
      description: 'Сервис, его проверки за 24 часа, сводка по дням за 7 дней и инциденты за 30 дней.'
      properties: {checks: {items: {$ref: '#/components/schemas/ServiceCheck'}, type: array}, days: {items: {$ref: '#/components/schemas/ServiceDay'},
          type: array}, incidents: {items: {$ref: '#/components/schemas/ServiceIncident'}, type: array}, service: {$ref: '#/components/schemas/ExternalService'}}
      required: [checks, days, incidents, service]
      type: object
      additionalProperties: false
