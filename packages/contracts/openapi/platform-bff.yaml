openapi: 3.1.0
info:
  title: RailTech Platform — BFF API (Платформа → CRM и ERP)
  version: 0.7.0
  summary: Пространство `/api/v1/` BFF Платформы — вызывает SPA `apps/platform/web` от имени сотрудника.
  description: |
    Контракт по ADR-0011 и `docs/architecture/platform-bff.md`. Версия 0.1.0 (INF-P0-1) покрывает фазу P1:
    сессия, профиль, счётчики меню, «Моя очередь», лента «Сегодня», уведомления, поиск. Экраны фаз P2–P4 добавляются
    минорными версиями этого файла до кода (`docs/architecture/integration-map.md` §1).

    Словарь — SPEC-v3 §2 (`docs/product/SPEC-v3.md`): старых кодов стадий и статусов CRM и ERP в ответах нет.
    BFF не имеет своей базы: данные приходят из CRM и ERP, каждый вызов бэкенда — с токеном сотрудника.

    **Сессия.** `POST /auth/login` ставит cookie `rt_pf_session` (`HttpOnly; Secure; SameSite=Lax; Path=/`) и CSRF-cookie
    `rt_pf_csrf` (читается скриптом). Каждый `POST`, `PUT`, `PATCH`, `DELETE`, кроме `/auth/login`, несёт заголовок
    `X-CSRF-Token` со значением CSRF-cookie; без него или с другим значением — 403 `CSRF_FAILED`. Истёкшая или
    отозванная сессия — 401 `SESSION_EXPIRED`.

    **Ошибки.** Тело любой ошибки — `Error`: стабильный `code`, текст на языке сотрудника, источник (`crm`, `erp`, `bff`)
    и детали бэкенда для разбора.

    **Частичные данные.** Агрегирующие ответы несут `sources`: если один бэкенд не ответил за 3 с, ответ 200 с данными
    второго и `sources.<бэкенд> = unavailable`; SPA показывает плашку «данные неполные».

    **Номера объектов** — бизнес-номера SPEC-v3 §2.2 (`ЗВ-2026-104`, `L-2041`); внутренних идентификаторов бэкендов в
    ссылках нет.

    0.2.0 (волна 8): смена пароля (`POST /auth/change-password`, `Session.must_change_password`); Admin · Оргструктура —
    сотрудники, выдача ролей Платформы, приглашение по почте (`/admin/users*`, раздел матрицы `admin`).

    **0.4.0 (R-1b, ADR-0012 п. 2) — ломающее (до 1.0 допустимо).** Директор видит Ролевую матрицу только для чтения:
    `GET /admin/roles` и `GET /admin/roles/{id}` — от `admin: read` (раньше `full`), создание, изменение, удаление и
    `POST /admin/roles/preview` — по-прежнему `admin: full`. Оптимистическая блокировка роли: `Role.version` (целое, растёт при
    каждом изменении), `RoleUpdate.version` — обязательное поле (ломающее: тело PATCH без него — 422); устаревшая версия —
    409 `CONFLICT` с `details.reason = role_version_conflict` и `details.current_version`. Системная роль «Директор»: лиды
    (`crm.leads`) и внешние чаты (`chats.external`) — только чтение (`platform-rbac.yaml`), поэтому «Моя очередь» директора без видов
    «ответить лиду» и «взять лид».

    **0.3.0 (R-2, ADR-0012) — ломающее (до 1.0 допустимо): роли — данные.** Роль сотрудника — `RoleRef {id, name,
    system, code?}` вместо перечисления `RoleCode` (удалено): `Me.roles: RoleRef[]`, `Me.active_role` и `MeUpdate.active_role` —
    id роли или `null`; `Employee.roles: RoleRef[]`, `EmployeeInvite.role_ids`, `EmployeeUpdate.role_ids`; параметр `role` очереди
    и карточек — id роли; `QueueItem.role` → `QueueItem.role_id`. Доступ сотрудника (`Me.modules`, `Me.resources`,
    `Me.restricted_fields`) — объединение матриц его ролей (матрицы и права бэкендов считает CRM), «вид» — по активной роли,
    как в 0.2.2. Новое: Admin · Ролевая матрица — `GET/POST /admin/roles`, `GET/PATCH/DELETE /admin/roles/{id}`,
    `POST /admin/roles/preview` («что произойдёт»); `POST /admin/users/{id}/invite` (повтор приглашения);
    `EmployeeUpdate.transfer_to_user_id` (кому передать лиды при отключении или смене ролей); `Employee.erp_sync` и
    `erp_sync_error` — из CRM. Коды ошибок: `ROLE_IN_USE`, `ROLE_SYSTEM`, `LAST_DIRECTOR` (вместе с `LAST_ADMIN`) и `CONFLICT` с
    `details.reason` (`user_has_active_leads`, `name_taken`) или `details.invite = not_sent`; у каждого 409 в `details.reason` —
    код CRM. Каталог разделов, меню, полей и видов очереди — `packages/contracts/platform-rbac.yaml` версии 2.

    **0.5.0 (B5, ADR-0014) — поток вместо опроса.** `GET /events/stream` (SSE, `text/event-stream`): BFF — подписчик шины
    событий `rt_bus`, на событие ERP, лида CRM или сотрудника шлёт открытому соединению подсказку инвалидации
    `InvalidationHint {topics, reason}`; SPA перезапрашивает уведомления, счётчики меню, «Мою очередь» и ленту «Сегодня»
    обычными API (с проверкой прав). Данных событий в потоке нет. Пока поток жив, опрос — редкий (5 минут), при обрыве —
    прежние 30 секунд. Чисто добавляющее изменение.

    **0.7.0 (W13-A3) — Admin · Компания.** Чисто добавляющее изменение: `GET/PATCH /admin/company` (реквизиты), `/admin/company/logo`
    (загрузка `multipart/form-data` и удаление), `/admin/company/brand` (+ `/logo`, `/preview`) — бланк и бренд документов,
    `/admin/company/numbering` (+ `/preview`), `/admin/company/quote-defaults`, `/admin/company/charge-types` и `charge-templates`,
    `/admin/company/document-templates` (+ `placeholders`, `preview`, `{id}/copy`), `/admin/company/email-templates` (+ `{id}/preview`),
    `/admin/company/reference/{kind}` (страны, валюты, единицы, базисы поставки), `/admin/company/categories`,
    `/admin/company/category-requests` (+ `approve`, `reject`), `/admin/company/platform-settings`. Доступ — раздел `company.settings`
    (чтение — `GET` и предпросмотры, полный — изменения). BFF только проксирует к ERP с токеном сотрудника и сам находит свою компанию по
    профилю сотрудника в ERP; нет компании — 409 `COMPANY_NOT_SET`. Ошибки ERP: 400 -> 422 `VALIDATION_FAILED` (`details.reason` —
    код ERP в нижнем регистре, `details.fields`), «используется», «префикс занят» и «уже рассмотрен» -> 409 `CONFLICT` с
    `details.reason`. Поля маржи `QuoteDefaults` вырезаются без права на группу `cost_margin` (правило 6 CONVENTIONS).

    **0.6.0 (R-1c, R3-D-1) — ломающее (до 1.0 допустимо).** У сотрудника хотя бы одна роль: `EmployeeUpdate.role_ids` —
    `minItems: 1`, пустой набор — 422 `ROLES_REQUIRED` (`details.fields = [role_ids]`), в CRM запрос не уходит; тот же код —
    перевод отказа CRM `roles_required` (CRM API 0.3.0). Закрыть доступ — `is_active = false` («Отключить сотрудника»).

    0.2.4: `423 ACCOUNT_LOCKED` объявлен и на `POST /auth/change-password` (CRM блокирует учётную запись после неверных
    текущих паролей).

    0.2.3 (Q-PLT-10-1): вход при недоступной ERP проходит (ERP подключается при первом обращении, агрегаты отдают
    `sources.erp = unavailable`); 503 на входе — только если не отвечает CRM; отключённый сотрудник получает
    `INVALID_CREDENTIALS` (CRM не различает «нет такого» и «отключён» — защита от перебора), `USER_DISABLED` остаётся для
    будущих путей; новый код `ACCOUNT_LOCKED` (423) — учётная запись временно заблокирована после неудачных попыток.

    0.2.2 (Q-PLT-12-1): `active_role` — «вид»: `modules`, `resources`, `restricted_fields` и очередь считаются по активной
    роли, если она задана; право на операцию BFF всегда проверяет по объединению всех ролей сотрудника (смена активной роли
    права не сужает и не расширяет). Пункты меню привязаны к разделам матрицы секцией `menu` в `platform-rbac.yaml`.

    0.2.1 (Q-P0-3): перечень `Error.code` дополнен `INTERNAL_ERROR` (500) и нейтральными кодами 4xx `BAD_REQUEST`,
    `METHOD_NOT_ALLOWED`, `HTTP_<статус>` для ответов, которые не относятся ни к одному именованному коду.

    Лимиты: вход — 10 неудачных попыток в минуту на IP и e-mail; остальные запросы — 300 в минуту на сессию; превышение — 429
    `TOO_MANY_REQUESTS` с `Retry-After`.
servers:
  - url: https://platform.railtech.uz/api/v1
    description: prod
  - url: https://platform.localhost/api/v1
    description: стенд ансамбля (infra/compose)
security:
  - platformSession: []
tags:
  - name: auth
    description: Вход логином CRM; токены CRM и ERP живут только в сессии BFF
  - name: me
  - name: system
  - name: dashboard
  - name: notifications
  - name: search
  - name: events
    description: Поток подсказок инвалидации (SSE) — замена опроса уведомлений, счётчиков и очереди
  - name: admin
    description: Admin · Оргструктура, Ролевая матрица (CRM — источник истины по людям и ролям) и Компания (ERP — реквизиты, бланк, нумерация, справочники)

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход сотрудника
      description: |
        BFF входит в CRM теми же логином и паролем, читает профиль и роли Платформы, при доступе к ERP получает
        сессию ERP SSO-обменом. Ответ ставит `rt_pf_session` и `rt_pf_csrf`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
      responses:
        '200':
          description: Вошёл
          headers:
            Set-Cookie:
              description: '`rt_pf_session` и `rt_pf_csrf`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: '`INVALID_CREDENTIALS` — неверный e-mail или пароль, в том числе у отключённого сотрудника'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`NO_PLATFORM_ROLE` — у сотрудника нет ни одной роли Платформы'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: '`ACCOUNT_LOCKED` — учётная запись временно заблокирована CRM после неудачных попыток входа'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: '`BACKEND_UNAVAILABLE` — не отвечает CRM (вход невозможен). Недоступность ERP вход не останавливает'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Выход — BFF закрывает сессии CRM и ERP и удаляет свою
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Вышел; cookie сброшены
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/CsrfFailed'

  /auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Смена пароля (в том числе обязательная после приглашения)
      description: BFF меняет пароль в CRM (`POST /api/v1/auth/change-password`); сессия сохраняется, `must_change_password` снимается.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordIn'
      responses:
        '204':
          description: Пароль изменён
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '423':
          description: '`ACCOUNT_LOCKED` — учётная запись временно заблокирована CRM после неверных паролей'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`WRONG_PASSWORD` (текущий неверен) или `VALIDATION_FAILED` (новый не проходит правила CRM)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Текущая сессия (для старта SPA)
      responses:
        '200':
          description: Сессия жива
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/SessionExpired'

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Профиль, роли, доступные модули и разделы
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/SessionExpired'
    patch:
      tags: [me]
      operationId: updateMe
      summary: Язык интерфейса и активная роль
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Состояние BFF и источников
      security: []
      responses:
        '200':
          description: BFF жив; статусы источников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /menu-counters:
    get:
      tags: [dashboard]
      operationId: getMenuCounters
      summary: Бейджи подменю всех доступных модулей
      responses:
        '200':
          description: Счётчики
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCounters'
        '401':
          $ref: '#/components/responses/SessionExpired'

  /queue:
    get:
      tags: [dashboard]
      operationId: getQueue
      summary: «Моя очередь» — что сделать сейчас
      description: |
        Строки по всем ролям сотрудника (или по одной, если задан `role` — id роли; иначе по активной роли, если она задана).
        Какие виды работы попадают в очередь — секция `queue` каталога `platform-rbac.yaml`: вид виден, если у ролей «вида» есть
        его раздел с уровнем не ниже нужного. Порядок: просроченные → сегодня → по сроку (SPEC-v3 §7.1). Одна строка — одно
        действие.
      parameters:
        - $ref: '#/components/parameters/RoleQuery'
      responses:
        '200':
          description: Очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /queue/cards:
    get:
      tags: [dashboard]
      operationId: getQueueCards
      summary: Карточки-счётчики над очередью (набор задают разделы ролей «вида»)
      parameters:
        - $ref: '#/components/parameters/RoleQuery'
      responses:
        '200':
          description: Карточки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueCards'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /activity/today:
    get:
      tags: [dashboard]
      operationId: getActivityToday
      summary: Лента событий компании за день (вкладка «Сегодня»), только доступные сотруднику объекты
      responses:
        '200':
          description: Лента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityFeed'
        '401':
          $ref: '#/components/responses/SessionExpired'

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Центр уведомлений (CRM и ERP вместе)
      parameters:
        - name: tab
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NotificationTab'
        - name: cursor
          in: query
          required: false
          description: Непрозрачный курсор из `next_cursor`
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Страница уведомлений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/SessionExpired'

  /notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Отметить прочитанным
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор с префиксом источника — `erp:123`, `crm:45`
          schema:
            type: string
            pattern: '^(crm|erp):[0-9]+$'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Отмечено
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Отметить все прочитанными
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Отмечены
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/CsrfFailed'

  /events/stream:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Поток подсказок инвалидации (SSE) — что перезапросить после события шины
      description: |
        Долгоживущий ответ `text/event-stream` для вошедшего сотрудника с разделом «Моя очередь» (его имеет каждая роль).
        Кадры:

        - `event: invalidate`, `data: <InvalidationHint>` — после события шины (ERP, лид CRM, сотрудник). Всплеск событий
          сливается в один кадр (окно около 300 мс): `topics` — объединение тем, `reason` — тип последнего события.
          Подсказка адресована всем сессиям: события не несут адресата. Данных события в кадре нет — клиент перезапрашивает
          обычные API, поэтому чужие данные в поток не попадают.
        - `: ping` — комментарий-heartbeat каждые 20 секунд тишины (держит соединение через прокси). Если сессия закрыта
          (выход, срок), BFF завершает поток при ближайшем heartbeat.
        - `: connected` — первый кадр: заголовки и первый байт уходят сразу.

        `Last-Event-ID` не поддерживается: после переподключения клиент делает разовый полный перезапрос. Обрыв потока —
        сигнал вернуться к опросу (`POLL_INTERVAL_MS`). Ответ несёт `Cache-Control: no-cache, no-transform`.
      responses:
        '200':
          description: Поток открыт
          content:
            text/event-stream:
              schema:
                type: string
                description: Кадры SSE; `data` кадра `invalidate` — JSON `InvalidationHint`
                contentMediaType: application/json
                contentSchema:
                  $ref: '#/components/schemas/InvalidationHint'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /search:
    get:
      tags: [search]
      operationId: search
      summary: Сквозной поиск — номера, ИНН, название клиента, артикул; результаты группами по модулям
      description: >-
        Доступен сотруднику с любым видимым разделом (в том числе роли без «Моей очереди»): каждая группа и каждый
        результат фильтруются по разделам ролей «вида»; источник без разделов у ролей — `not_applicable`.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: Результаты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/users:
    get:
      tags: [admin]
      operationId: listEmployees
      summary: Сотрудники (Admin · Оргструктура)
      description: Доступ — раздел `admin` каталога (чтение — список и карточки, полный — изменения).
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EmployeeStatus'
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeList'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/invite:
    post:
      tags: [admin]
      operationId: inviteEmployee
      summary: Пригласить сотрудника по почте
      description: >-
        BFF создаёт пользователя в CRM с ролями Платформы (`role_ids`) и отправляет приглашение (CRM `/users`,
        `/users/{id}/invite`); провижининг в ERP делает CRM. Раздел `admin` — полный. Письмо не ушло — 409 `CONFLICT` с
        `details.invite = not_sent` и `details.employee_id` (сотрудник создан; повтор — `POST /admin/users/{id}/invite`).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInvite'
      responses:
        '201':
          description: Приглашён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`EMAIL_EXISTS`; `CONFLICT` с `details.invite = not_sent` (письмо не ушло)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          description: '`BACKEND_UNAVAILABLE` — CRM не ответила; если сотрудник уже создан — `details.invite = not_sent`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users/{id}/invite:
    post:
      tags: [admin]
      operationId: resendInvite
      summary: Отправить приглашение снова
      description: >-
        Повтор письма-приглашения сотруднику со статусом «Приглашён» (CRM `/users/{id}/invite`). CRM выдаёт новый
        временный пароль только при отправке письма: без подключённой почты пароль не меняется и ответ — 409 `CONFLICT` с
        `details.invite = not_sent`. Раздел `admin` — полный.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Письмо поставлено в отправку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CONFLICT` с `details.invite = not_sent` — письмо не ушло (почта не подключена)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`BACKEND_UNAVAILABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users/{id}:
    get:
      tags: [admin]
      operationId: getEmployee
      summary: Карточка сотрудника
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: Сотрудник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [admin]
      operationId: updateEmployee
      summary: Роли, должность, отключение — единое место выдачи ролей обеих систем
      description: >-
        Раздел `admin` — полный. Роли — полный новый набор `role_ids`; права в CRM и ERP вычисляет CRM. Снять последнего
        активного администратора или директора (роль или отключение) нельзя — 409 `LAST_ADMIN` / `LAST_DIRECTOR`. У сотрудника
        есть лиды в работе, а изменение отнимает у него работу с лидами, — 409 `CONFLICT` с
        `details.reason = user_has_active_leads`; повтор с `transfer_to_user_id` передаёт лиды коллеге. Пустой набор ролей —
        422 `ROLES_REQUIRED` (0.6.0): у сотрудника хотя бы одна роль, закрыть доступ — `is_active = false`.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdate'
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`LAST_ADMIN`, `LAST_DIRECTOR`, `CONFLICT` (`details.reason = user_has_active_leads`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            `ROLES_REQUIRED` — пустой набор `role_ids` (`details.fields = [role_ids]`); `VALIDATION_FAILED` — прочие поля
            (`details.fields`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/roles:
    get:
      tags: [admin]
      operationId: listRoles
      summary: Роли Платформы (Admin · Ролевая матрица) — системные и созданные, с числом сотрудников
      description: >-
        Раздел `admin` — от чтения (0.4.0): матрицу видят администратор (полный доступ) и директор (только чтение);
        CRM — `users:read`.
      responses:
        '200':
          description: Роли в порядке CRM (системные первыми)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      operationId: createRole
      summary: Создать роль (с нуля или из шаблона каталога — шаблон SPA подставляет в черновик)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`CONFLICT` с `details.reason = name_taken` — роль с таким названием уже есть'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/roles/preview:
    post:
      tags: [admin]
      operationId: previewRole
      summary: «Что произойдёт» — кто из сотрудников какие разделы получит или потеряет при сохранении черновика
      description: >-
        Без `role_id` — черновик новой роли (сотрудников не затрагивает), с `role_id` — изменение существующей. Ничего не
        сохраняет. Системную роль изменить нельзя — 409 `ROLE_SYSTEM`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePreviewIn'
      responses:
        '200':
          description: Последствия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePreview'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ROLE_SYSTEM`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/roles/{id}:
    get:
      tags: [admin]
      operationId: getRole
      summary: Роль
      description: Раздел `admin` — от чтения (0.4.0), как у списка.
      parameters:
        - $ref: '#/components/parameters/RoleIdPath'
      responses:
        '200':
          description: Роль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [admin]
      operationId: updateRole
      summary: Переименовать роль, изменить описание, матрицу или поля с ограничением
      description: >-
        Не присланное поле не меняется (кроме `version` нужно хотя бы одно — иначе 422); `version` — обязательная версия
        роли, которую видел клиент. Права сотрудников с этой
        ролью CRM пересчитывает сразу (CRM) и фоном (ERP). Системную роль изменить нельзя — 409 `ROLE_SYSTEM`; изменение,
        после которого не остаётся ни одного администратора, — 409 `LAST_ADMIN`; роль изменена после чтения клиентом — 409
        `CONFLICT` с `details.reason = role_version_conflict` (SPA предлагает обновить страницу).
      parameters:
        - $ref: '#/components/parameters/RoleIdPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: Сохранена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ROLE_SYSTEM`, `LAST_ADMIN`, `CONFLICT` (`details.reason = name_taken` или `role_version_conflict`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [admin]
      operationId: deleteRole
      summary: Удалить роль — только без сотрудников
      description: >-
        Роль, выданную сотрудникам, удалить нельзя — 409 `ROLE_IN_USE` с `details.employees` (сколько сотрудников);
        системную — 409 `ROLE_SYSTEM`.
      parameters:
        - $ref: '#/components/parameters/RoleIdPath'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Удалена
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ROLE_IN_USE`, `ROLE_SYSTEM`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/company:
    get:
      tags:
        - admin
      operationId: getCompany
      summary: Реквизиты своей компании (Admin · Компания)
      description: BFF находит свою компанию по `own_company_id` из `setup/status/` ERP; нет компании — 409 `COMPANY_NOT_SET`. Раздел `company.settings`
