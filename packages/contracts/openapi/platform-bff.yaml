            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/company/category-requests/{id}/reject:
    post:
      tags:
        - admin
      operationId: rejectCategoryRequest
      summary: Отклонить запрос с причиной
      description: Причина обязательна. Решает ERP по праву `settings.edit` (его даёт раздел `company.settings`) или администратору; иначе 403 `FORBIDDEN` (`source = erp`). Раздел
        `company.settings` — полный.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CompanyItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequestRejectIn'
      responses:
        '200':
          description: Отклонён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRequest'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CONFLICT` — запрос уже рассмотрен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/company/platform-settings:
    get:
      tags:
        - admin
      operationId: getPlatformSettings
      summary: 'Платформенные настройки: НДС и курс'
      description: Раздел `company.settings` — чтение.
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
        - admin
      operationId: updatePlatformSettings
      summary: Изменить ставку НДС платформы
      description: Ставку меняет ERP по праву `settings.edit` или администратору; иначе 403 `FORBIDDEN` (`source = erp`). Раздел `company.settings`
        — полный.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSettingsUpdate'
      responses:
        '200':
          description: Сохранено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

components:
  securitySchemes:
    platformSession:
      type: apiKey
      in: cookie
      name: rt_pf_session

  parameters:
    EmployeeId:
      name: id
      in: path
      required: true
      description: '`crm_user_id`'
      schema:
        type: string
        pattern: '^[0-9]+$'
    RoleIdPath:
      name: id
      in: path
      required: true
      description: Id роли Платформы (CRM)
      schema:
        $ref: '#/components/schemas/RoleId'
    RoleQuery:
      name: role
      in: query
      required: false
      description: Только по этой роли сотрудника (id); чужая роль — 403
      schema:
        $ref: '#/components/schemas/RoleId'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Значение cookie `rt_pf_csrf`
      schema:
        type: string
        minLength: 16

    CompanyItemId:
      name: id
      in: path
      required: true
      description: Id объекта ERP (строкой)
      schema:
        $ref: '#/components/schemas/CompanyItemRef'
    ReferenceKindPath:
      name: kind
      in: path
      required: true
      description: Справочник ERP
      schema:
        $ref: '#/components/schemas/ReferenceKind'

  responses:
    SessionExpired:
      description: '`SESSION_EXPIRED` — сессии нет, истекла или сотрудник отключён'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CsrfFailed:
      description: '`CSRF_FAILED`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`FORBIDDEN` — раздел или действие не положены ролям сотрудника'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: '`VALIDATION_FAILED` — `details.fields` перечисляет поля'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: '`TOO_MANY_REQUESTS`'
      headers:
        Retry-After:
          description: Секунды до повтора
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, source]
      properties:
        code:
          type: string
          description: Стабильный код (`INVALID_CREDENTIALS`, `SESSION_EXPIRED`, `CSRF_FAILED`, `FORBIDDEN`, `NOT_FOUND`, `VALIDATION_FAILED`, `TOO_MANY_REQUESTS`, `BACKEND_UNAVAILABLE`, `NO_PLATFORM_ROLE`, `USER_DISABLED`, `ACCOUNT_LOCKED`, `CONFLICT`, `WRONG_PASSWORD`, `EMAIL_EXISTS`, `LAST_ADMIN`, `LAST_DIRECTOR`, `ROLE_IN_USE`, `ROLE_SYSTEM`, `ROLES_REQUIRED`, `COMPANY_NOT_SET`, `INTERNAL_ERROR`, `BAD_REQUEST`, `METHOD_NOT_ALLOWED`, `HTTP_<статус>`)
          examples: [SESSION_EXPIRED]
        message:
          type: string
          description: Текст для сотрудника на его языке
        source:
          type: string
          enum: [bff, crm, erp]
        details:
          type: object
          description: Код и тело ошибки бэкенда, поля валидации — для разбора, не для показа
          additionalProperties: true

    SourceState:
      type: string
      enum: [ok, unavailable, not_applicable]
      description: '`not_applicable` — у сотрудника нет доступа к этому бэкенду'

    Sources:
      type: object
      additionalProperties: false
      required: [crm, erp]
      properties:
        crm:
          $ref: '#/components/schemas/SourceState'
        erp:
          $ref: '#/components/schemas/SourceState'

    RoleId:
      type: string
      pattern: '^[0-9]+$'
      description: Id роли Платформы в CRM (роли — данные, ADR-0012)
      examples: ['3']

    RoleRef:
      type: object
      additionalProperties: false
      required: [id, name, system]
      properties:
        id:
          $ref: '#/components/schemas/RoleId'
        name:
          type: string
          description: Название роли — данные (его задаёт администратор); интерфейс показывает его как есть
        system:
          type: boolean
          description: Системная роль («Администратор», «Директор») — неизменна, не удаляется
        code:
          type: string
          description: >-
            Код системной роли (`ADMIN`, `DIRECTOR`) или шаблона, из которого создана роль при первом запуске (`tpl:MANAGER`);
            у созданных администратором — нет. Интерфейс на коды не опирается, кроме двух системных.

    ResourceAccess:
      type: object
      description: Раздел каталога `platform-rbac.yaml` → уровень; скрытые разделы не перечисляются
      additionalProperties:
        $ref: '#/components/schemas/AccessLevel'

    RestrictedField:
      type: string
      enum: [cost_margin, supplier_prices, totals_only]
      description: Поле с ограничением каталога (`restricted_fields`); роль перечисляет поля, которые она видит

    Role:
      type: object
      additionalProperties: false
      required: [id, name, description, system, version, access, restricted_fields, employees, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/RoleId'
        name:
          type: string
        description:
          type: string
        system:
          type: boolean
        code:
          type: string
          description: Как в `RoleRef.code`
        version:
          type: integer
          minimum: 1
          description: Растёт при каждом изменении роли; `RoleUpdate.version` присылает прочитанную (0.4.0)
        access:
          $ref: '#/components/schemas/ResourceAccess'
        restricted_fields:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RestrictedField'
        employees:
          type: integer
          minimum: 0
          description: Сколько сотрудников имеют роль
        updated_at:
          type: string
          format: date-time

    RoleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    RoleCreate:
      type: object
      additionalProperties: false
      required: [name, access, restricted_fields]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        access:
          $ref: '#/components/schemas/ResourceAccess'
        restricted_fields:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RestrictedField'

    RoleUpdate:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 1
      properties:
        version:
          type: integer
          minimum: 1
          description: Версия роли, которую видел клиент (`Role.version`); при расхождении — 409 `role_version_conflict`
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        access:
          $ref: '#/components/schemas/ResourceAccess'
        restricted_fields:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RestrictedField'

    RolePreviewIn:
      type: object
      additionalProperties: false
      properties:
        role_id:
          $ref: '#/components/schemas/RoleId'
        access:
          $ref: '#/components/schemas/ResourceAccess'
        restricted_fields:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RestrictedField'

    SectionLevel:
      type: object
      additionalProperties: false
      required: [resource, level]
      properties:
        resource:
          type: string
          description: Раздел каталога
        level:
          $ref: '#/components/schemas/AccessLevel'

    RoleImpact:
      type: object
      additionalProperties: false
      required: [employee, gained, lost, fields_gained, fields_lost]
      properties:
        employee:
          $ref: '#/components/schemas/PersonRef'
        gained:
          type: array
          description: Разделы, которые появятся или станут полными (уровень «после»)
          items:
            $ref: '#/components/schemas/SectionLevel'
        lost:
          type: array
          description: Разделы, которые пропадут или станут только для чтения (уровень «до»)
          items:
            $ref: '#/components/schemas/SectionLevel'
        fields_gained:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedField'
        fields_lost:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedField'

    RolePreview:
      type: object
      additionalProperties: false
      required: [employees_total, employees, gained, lost, fields_gained, fields_lost]
      properties:
        role_id:
          oneOf:
            - $ref: '#/components/schemas/RoleId'
            - type: 'null'
        employees_total:
          type: integer
          minimum: 0
          description: Сколько сотрудников имеют роль (у черновика новой роли — 0)
        employees:
          type: array
          description: Только сотрудники, у которых права изменятся
          items:
            $ref: '#/components/schemas/RoleImpact'
        gained:
          type: array
          items:
            $ref: '#/components/schemas/SectionLevel'
        lost:
          type: array
          items:
            $ref: '#/components/schemas/SectionLevel'
        fields_gained:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedField'
        fields_lost:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedField'

    ModuleCode:
      type: string
      enum: [dashboard, crm, eds, erp, chats, admin]

    AccessLevel:
      type: string
      enum: [full, read]
      description: Скрытые разделы в ответах не перечисляются

    Language:
      type: string
      enum: [ru, uz, en]

    StepCode:
      type: string
      enum: [REQUEST, RESOLUTION, CALCULATION, QUOTE, CONTRACT, PAYMENT, DONE, LOST]
      description: Шкала пути заявки SPEC-v3 §2.3

    ObjectKind:
      type: string
      enum: [lead, client, request, project, letter, quote, contract, invoice, act, memo, chat, ticket, integration]

    ObjectRef:
      type: object
      additionalProperties: false
      required: [kind, number, path]
      properties:
        kind:
          $ref: '#/components/schemas/ObjectKind'
        number:
          type: string
          description: Бизнес-номер SPEC-v3 §2.2 или код (для интеграции — её ключ)
          examples: [ЗВ-2026-104]
        title:
          type: string
        path:
          type: string
          description: Путь в SPA с вкладкой бокового окна, например `/eds/inbox/ВХ-104%2F26?panel=open&tab=resolution`
        step:
          $ref: '#/components/schemas/StepCode'

    PersonRef:
      type: object
      additionalProperties: false
      required: [id, name, initials]
      properties:
        id:
          type: string
          description: '`crm_user_id` сотрудника'
        name:
          type: string
        initials:
          type: string
          maxLength: 3

    LoginIn:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true

    Session:
      type: object
      additionalProperties: false
      required: [me, expires_at, must_change_password]
      properties:
        me:
          $ref: '#/components/schemas/Me'
        must_change_password:
          type: boolean
          description: true — SPA сразу ведёт на смену пароля; остальные разделы недоступны до смены
        expires_at:
          type: string
          format: date-time

    Me:
      type: object
      additionalProperties: false
      required: [id, email, name, initials, language, roles, modules, resources, access]
      properties:
        id:
          type: string
          description: '`crm_user_id`'
        email:
          type: string
          format: email
        name:
          type: string
        initials:
          type: string
          maxLength: 3
        position:
          type: string
          description: Должность — текст (не роль)
        language:
          $ref: '#/components/schemas/Language'
        roles:
          type: array
          minItems: 1
          description: Роли сотрудника (названия — данные CRM)
          items:
            $ref: '#/components/schemas/RoleRef'
        active_role:
          description: >-
            Id роли, выбранной в профиле («вид»): при заданной роли `modules`, `resources`, `restricted_fields`, «Моя очередь»
            и карточки считаются только по ней; пусто — по объединению всех ролей. На права операций не влияет: BFF проверяет
            их по объединению ролей.
          oneOf:
            - $ref: '#/components/schemas/RoleId'
            - type: 'null'
        modules:
          type: array
          description: Модули рейла в порядке показа — для активной роли, если задана, иначе для объединения ролей
          items:
            $ref: '#/components/schemas/ModuleCode'
        resources:
          type: object
          description: >-
            Разделы каталога `platform-rbac.yaml` → уровень (максимум по матрицам ролей) — для активной роли, если задана,
            иначе для объединения ролей. Видимость пункта меню — по секции `menu` того же файла.
          additionalProperties:
            $ref: '#/components/schemas/AccessLevel'
        restricted_fields:
          type: array
          description: Поля с ограничением, которые сотруднику видны
          items:
            $ref: '#/components/schemas/RestrictedField'
        access:
          type: object
          additionalProperties: false
          required: [crm, erp]
          properties:
            crm:
              type: boolean
            erp:
              type: boolean

    ChangePasswordIn:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
        new_password:
          type: string
          minLength: 8
          maxLength: 256
          writeOnly: true

    EmployeeStatus:
      type: string
      enum: [active, invited, disabled]

    ErpSyncState:
      type: string
      enum: [ok, pending, error, not_applicable]
      description: Итог провижининга в ERP

    Employee:
      type: object
      additionalProperties: false
      required: [id, name, initials, email, roles, access, status, telegram_linked, erp_sync]
      properties:
        id:
          type: string
        name:
          type: string
        initials:
          type: string
          maxLength: 3
        email:
          type: string
          format: email
        position:
          type: string
          maxLength: 120
          description: Должность — текст, не роль
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        access:
          type: object
          additionalProperties: false
          required: [crm, erp]
          properties:
            crm:
              type: boolean
            erp:
              type: boolean
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        telegram_linked:
          type: boolean
          description: Привязан Telegram для уведомлений сотруднику
        erp_sync:
          $ref: '#/components/schemas/ErpSyncState'
        erp_sync_error:
          type: string
          description: Текст последней ошибки провижининга ERP (из CRM), если `erp_sync = error`

    EmployeeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Employee'

    EmployeeInvite:
      type: object
      additionalProperties: false
      required: [email, name, role_ids]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 120
        position:
          type: string
          maxLength: 120
        role_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleId'

    EmployeeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role_ids:
          type: array
          uniqueItems: true
          minItems: 1
          description: Полный новый набор ролей, хотя бы одна; пустой набор — 422 `ROLES_REQUIRED` (0.6.0)
          items:
            $ref: '#/components/schemas/RoleId'
        position:
          type: string
          maxLength: 120
        is_active:
          type: boolean
        transfer_to_user_id:
          type: string
          pattern: '^[0-9]+$'
          description: >-
            Кому передать лиды в работе (`crm_user_id` коллеги), если отключение или новые роли отнимают у сотрудника работу
            с лидами; без поля при таких лидах — 409 `CONFLICT` (`details.reason = user_has_active_leads`)

    MeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        language:
          $ref: '#/components/schemas/Language'
        active_role:
          oneOf:
            - $ref: '#/components/schemas/RoleId'
            - type: 'null'

    InvalidationTopic:
      type: string
      enum: [notifications, counters, queue, activity]
      description: >-
        Что перезапросить: `notifications` — `listNotifications`; `counters` — `getMenuCounters`; `queue` — `getQueue`
        и `getQueueCards`; `activity` — `getActivityToday`.

    InvalidationHint:
      type: object
      description: Данные кадра `invalidate` потока `/events/stream` — подсказка, не данные события.
      additionalProperties: false
      required: [topics, reason]
      properties:
        topics:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/InvalidationTopic'
        reason:
          type: string
          description: Тип события шины (`uz.railtech.erp.quote.sent.v1`) или `resync` (слушатель BFF переподключился — перезапросите всё)

    Health:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties: false
          required: [redis, crm, erp]
          properties:
            redis:
              type: string
              enum: [ok, fail]
            crm:
              type: string
              enum: [ok, fail]
            erp:
              type: string
              enum: [ok, fail]
        version:
          type: string

    MenuCounter:
      type: object
      additionalProperties: false
      required: [module, section, count, attention]
      properties:
        module:
          $ref: '#/components/schemas/ModuleCode'
        section:
          type: string
          description: Ключ раздела подменю (`queue`, `inbox`, `drafts`, `approvals`, `payments`, `calc`, `leads`, `messages`…)
        count:
          type: integer
          minimum: 0
        attention:
          type: boolean
          description: true — красный бейдж «требует действия», false — серый счётчик

    MenuCounters:
      type: object
      additionalProperties: false
      required: [items, sources]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuCounter'
        sources:
          $ref: '#/components/schemas/Sources'

    QueueItemKind:
      type: string
      description: Вид действия; какой раздел и уровень нужен — секция `queue` каталога `platform-rbac.yaml`
      enum:
        - answer_lead
        - take_lead
        - create_request
        - service_request
        - resolve_letter
        - approve_quote
        - approve_memo
        - problem_project
        - calc_task
        - supplier_overdue
        - confirm_payment
        - issue_invoice
        - issue_contract
        - attach_scan
        - pay_memo
        - overdue_invoice
        - ticket
        - integration_issue

    DueLabel:
      type: string
      enum: [overdue, today, tomorrow, later, memo]
      description: Бейдж срока — red «просрочено», red «срок сегодня», gold «завтра», default — дата, purple «служебка»

    QueueItem:
      type: object
      additionalProperties: false
      required: [id, role_id, kind, title, subtitle, due_label, object]
      properties:
        id:
          type: string
        role_id:
          $ref: '#/components/schemas/RoleId'
        kind:
          $ref: '#/components/schemas/QueueItemKind'
        title:
          type: string
          description: Заголовок действия — «Наложить резолюцию на письмо ВХ-104/26»
        subtitle:
          type: string
          description: Клиент · объект · от кого · когда
        due_label:
          $ref: '#/components/schemas/DueLabel'
