          type: array
          items: {$ref: '#/components/schemas/EdsDecision'}
          description: Решения всех кругов по порядку — кто, что и когда решил
        can_edit: {type: boolean, description: 'Автор, статус `draft` или `returned`: экран открывает форму «Продолжить»'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    EdsDocumentIn:
