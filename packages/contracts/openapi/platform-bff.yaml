        items:
          type: array
          items: {$ref: '#/components/schemas/ReplyTemplate'}

    ReplyTemplateIn:
      type: object
      additionalProperties: false
      required: [title, text]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        text: {$ref: '#/components/schemas/LocalizedText'}

    LetterStatus:
      type: string
      enum: [awaiting_resolution, resolved, returned, rejected]
      description: >-
        Статус входящего письма (SPEC-v3 §2.4; EDS `LetterStatus`): `awaiting_resolution` — «Ждёт резолюции» (зарегистрировано),
        `resolved` — «Резолюция наложена», `returned` — «Возвращено» менеджеру, `rejected` — «Отклонено». Слова — в словаре
        интерфейса, не в API.

    LetterZone:
      type: string
      enum: [goods, services, payment_terms]
      description: >-
        Зона исполнителя резолюции: `goods` — товары, склад, цены поставщиков (снабженец), `services` — услуги, ТЗ, бригада
        (гл. инженер), `payment_terms` — условия оплаты (бухгалтер).

    LetterSender:
      type: object
      additionalProperties: false
      required: [name, inn, contact]
      description: Организация-отправитель; `null` — письмо по заявке ERP без этого поля
      properties:
        name: {type: [string, 'null']}
        inn: {type: [string, 'null']}
        contact: {type: [string, 'null'], description: Контактное лицо}

    LetterSenderRef:
      type: object
      additionalProperties: false
      required: [number, date]
      description: Исходящий номер и дата письма у отправителя
      properties:
        number: {type: [string, 'null']}
        date: {type: [string, 'null'], format: date}

    LetterRow:
      type: object
      additionalProperties: false
      required: [id, number, subject, client_name, request_number, received_at, status, urgent, due]
      properties:
        id: {type: string, format: uuid}
        number:
          type: string
          description: Номер ВХ-NNN/ГГ
          examples: [ВХ-104/26]
        subject: {type: string}
        client_name: {type: [string, 'null'], description: Название организации-отправителя}
        request_number:
          type: [string, 'null']
          description: Бизнес-номер заявки ЗВ из связей письма; `null` — письмо ещё не связано с заявкой
        received_at: {type: string, format: date}
        status: {$ref: '#/components/schemas/LetterStatus'}
        urgent: {type: boolean}
        due:
          type: [string, 'null']
          format: date
          description: Срок расчёта из резолюции

    LetterPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LetterRow'}
        next_cursor:
          type: [string, 'null']

    LetterFile:
      type: object
      additionalProperties: false
      required: [id, name, content_type, size, uploaded_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        content_type: {type: string}
        size: {type: integer, minimum: 0, description: Байт}
        uploaded_at: {type: string, format: date-time}

    LetterClient:
      type: object
      additionalProperties: false
      required: [id, name, inn, path]
      description: Клиент письма из связей (CRM); без связи с клиентом в карточке блока нет
      properties:
        id: {type: string, description: '`crm_client_id`'}
        name: {type: [string, 'null']}
        inn: {type: [string, 'null']}
        path: {type: string, description: 'Путь карточки клиента в SPA, `/crm/clients/{id}`'}

    LetterRequest:
      type: object
      additionalProperties: false
      required: [number, title, path]
      description: >-
        Заявка письма. Номер EDS знает из связей письма; название и путь — из ERP (сделка по `erp_deal_id`): ERP не ответил —
        `title = null`, путь ведёт в список заявок по номеру.
      properties:
        number: {type: string, examples: [ЗВ-2026-104]}
        title: {type: [string, 'null']}
        path: {type: string}

    LetterAssignee:
      type: object
      additionalProperties: false
      required: [person, zone]
      properties:
        person: {$ref: '#/components/schemas/PersonRef'}
        zone: {$ref: '#/components/schemas/LetterZone'}

    LetterResolution:
      type: object
      additionalProperties: false
      required: [text, assignees, due, decided_by, decided_at]
      properties:
        text: {type: string}
        assignees:
          type: array
          items: {$ref: '#/components/schemas/LetterAssignee'}
        due: {type: string, format: date, description: Срок расчёта}
        min_margin_pct:
          type: [string, 'null']
          description: >-
            «Маржа не ниже, %» строкой (`15`, `12.5`); `null` — без ограничения. Поля нет в ответе, если ни у одной роли
            сотрудника нет группы `cost_margin` (правило 6 CONVENTIONS Платформы).
        decided_by: {$ref: '#/components/schemas/PersonRef'}
        decided_at: {type: string, format: date-time}

    LetterJournalEntry:
      type: object
      additionalProperties: false
      required: [at, action, by, comment]
      properties:
        at: {type: string, format: date-time}
        action:
          type: string
          description: Код действия EDS (`letter.registered`, `letter.resolved`, `letter.returned`, `letter.rejected`, …)
        by:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
          description: '`null` — система'
        comment: {type: [string, 'null']}

    LetterCard:
      type: object
      additionalProperties: false
      required:
        - id
        - number
        - status
        - subject
        - summary
        - urgent
        - received_at
        - registered_at
        - registered_by
        - addressee
        - manager
        - sender
        - sender_ref
        - client
        - request
        - stage
        - lost_at_step
        - files
        - resolution
        - return_comment
        - reject_reason
        - journal
        - sources
      properties:
        id: {type: string, format: uuid}
        number: {type: string, examples: [ВХ-104/26]}
        status: {$ref: '#/components/schemas/LetterStatus'}
        subject: {type: string}
        summary: {type: string, description: Суть документа}
        urgent: {type: boolean}
        received_at: {type: string, format: date}
        registered_at: {type: string, format: date-time}
        registered_by:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
          description: '`null` — зарегистрировано системой по заявке ERP'
        addressee: {$ref: '#/components/schemas/PersonRef'}
        manager:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        sender: {$ref: '#/components/schemas/LetterSender'}
        sender_ref: {$ref: '#/components/schemas/LetterSenderRef'}
        client:
          oneOf:
            - $ref: '#/components/schemas/LetterClient'
            - type: 'null'
        request:
          oneOf:
            - $ref: '#/components/schemas/LetterRequest'
            - type: 'null'
        stage:
          $ref: '#/components/schemas/StepCode'
        lost_at_step:
          type: [integer, 'null']
          minimum: 1
          maximum: 7
          description: Для `stage = LOST` — номер шага, на котором закрыли заявку (2 — резолюция); иначе `null`
        files:
          type: array
          items: {$ref: '#/components/schemas/LetterFile'}
        resolution:
          oneOf:
            - $ref: '#/components/schemas/LetterResolution'
            - type: 'null'
        return_comment: {type: [string, 'null']}
        reject_reason: {type: [string, 'null']}
        journal:
          type: array
          items: {$ref: '#/components/schemas/LetterJournalEntry'}
        sources:
          $ref: '#/components/schemas/Sources'

    ResolutionAssigneeIn:
      type: object
      additionalProperties: false
      required: [id, zone]
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: '`crm_user_id` сотрудника'
        zone: {$ref: '#/components/schemas/LetterZone'}

    ResolutionIn:
      type: object
      additionalProperties: false
      required: [text, assignees, due]
      properties:
        text: {type: string, minLength: 1, maxLength: 4000}
        assignees:
          type: array
          minItems: 1
          maxItems: 12
          items: {$ref: '#/components/schemas/ResolutionAssigneeIn'}
        due: {type: string, format: date, description: Срок расчёта — не раньше сегодняшней даты по Asia/Tashkent}
        min_margin_pct:
          type: [string, 'null']
          pattern: '^(100(\.0{1,2})?|\d{1,2}(\.\d{1,2})?)$'
          description: '«Маржа не ниже, %»; нет или `null` — без ограничения'

    LetterReturnIn:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment: {type: string, minLength: 1, maxLength: 4000}

    LetterRejectIn:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 4000}

    ResolutionCandidate:
      type: object
      additionalProperties: false
      required: [id, name, initials, position]
      properties:
        id: {type: string, description: '`crm_user_id`'}
        name: {type: string}
        initials: {type: string, maxLength: 3}
        position: {type: [string, 'null']}

    ResolutionZone:
      type: object
      additionalProperties: false
      required: [zone, candidates]
      properties:
        zone: {$ref: '#/components/schemas/LetterZone'}
        candidates:
          type: array
          items: {$ref: '#/components/schemas/ResolutionCandidate'}

    ResolutionAssignees:
      type: object
      additionalProperties: false
      required: [zones, directory]
      properties:
        zones:
          type: array
          description: Всегда три зоны в порядке товары, услуги, условия оплаты
          items: {$ref: '#/components/schemas/ResolutionZone'}
        directory:
          type: string
          enum: [ok, forbidden, unavailable]
          description: >-
            `ok` — сотрудники зон получены от CRM; `forbidden` — роли сотрудника не дают чтения сотрудников в CRM (кандидатов
            нет); `unavailable` — CRM не ответила

    # --- Клиенты · Ждут ответа (D1-1, 0.22.0) -----------------------------------------------------------------------

    LeadOwnerMode:
      type: string
      enum: [bot, waiting, manager]
      description: Кто ведёт диалог — `bot` (бот отвечает сам), `waiting` (бот передал и ждёт человека), `manager` (ведёт сотрудник)

    MessageChannel:
      type: string
      description: Канал лида (`telegram`, `web`, `email`, `phone`, `referral`); подпись — у экрана
      pattern: '^[a-z][a-z_]{0,15}$'

    HandoffFacts:
      type: object
      additionalProperties: false
      description: Факты квалификации от бота; коды срока и роли подписывает экран
      required: [interest, timeline, decision_role, budget_hint, company, company_size, region]
      properties:
        interest:
          type: array
          items: {type: string}
          description: Продукты по справочнику CRM (названия)
        timeline:
          type: [string, 'null']
          enum: ['<1m', '<3m', '<12m', '>12m', null]
        decision_role:
          type: [string, 'null']
          enum: [decision_maker, influencer, researcher, null]
        budget_hint: {type: [string, 'null']}
        company: {type: [string, 'null']}
        company_size: {type: [string, 'null']}
        region: {type: [string, 'null']}

    HandoffNote:
      type: object
      additionalProperties: false
      description: Записка передачи (CRM-06) — что известно о запросе клиента
      required: [request, facts, last_message]
      properties:
        request:
          type: [string, 'null']
          description: Суть запроса клиента (резюме бота)
        facts:
          $ref: '#/components/schemas/HandoffFacts'
        last_message:
          type: [string, 'null']
          description: Последнее сообщение клиента (до 200 символов)

    HandoffInfo:
      type: object
      additionalProperties: false
      description: Открытая передача от бота
      required: [priority, state, reasons, reason_text, recommendation, created_at, sla_due_at, snoozed_until, taken_by]
      properties:
        priority:
          type: string
          enum: [hot, warm, info]
          description: '`hot` — срочно, `warm` — важно, `info` — к сведению (без срока реакции)'
        state:
          type: string
          enum: [open, taken, snoozed]
        reasons:
          type: array
          items: {type: string, pattern: '^[a-z_]{1,32}$'}
          description: Коды причин передачи CRM (`human_requested`, `price_or_contract_asked`, …); подписи — у экрана
        reason_text:
          type: [string, 'null']
          description: 'Пояснение причины словами (служебные пометки CRM вида «dialog: …» BFF не отдаёт)'
        recommendation:
          type: [string, 'null']
          description: Рекомендуемый шаг
        created_at:
          type: string
          format: date-time
          description: Когда бот передал диалог (начало таймера «ждёт»)
        sla_due_at:
          type: [string, 'null']
          format: date-time
          description: Срок реакции; после него таймер красный. `null` — без срока (`info`)
        snoozed_until:
          type: [string, 'null']
          format: date-time
        taken_by:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'

    MessageInboxItem:
      type: object
      additionalProperties: false
      required: [lead, name, group, language, channel, unread, last_message_at, assigned, handoff, note]
      properties:
        lead:
          type: string
          pattern: '^L-\d{4,}$'
          description: Номер лида
        name: {type: string}
        group:
          type: string
          enum: [handoff, mine, unassigned]
        language:
          $ref: '#/components/schemas/Language'
        channel:
          $ref: '#/components/schemas/MessageChannel'
        unread:
          type: boolean
          description: Клиент написал после последнего ответа сотрудника
        last_message_at:
          type: [string, 'null']
          format: date-time
          description: Последнее сообщение клиента
        assigned:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        handoff:
          oneOf:
            - $ref: '#/components/schemas/HandoffInfo'
            - type: 'null'
        note:
          $ref: '#/components/schemas/HandoffNote'

    MessageInbox:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MessageInboxItem'}

    ConversationContacts:
      type: object
      additionalProperties: false
      required: [telegram, phone, email, company]
      properties:
        telegram:
          type: [string, 'null']
          description: Имя пользователя Telegram без @
        phone: {type: [string, 'null'], description: 'E.164'}
        email: {type: [string, 'null']}
        company: {type: [string, 'null']}

    ConversationCard:
      type: object
      additionalProperties: false
      required: [lead, name, language, channel, owner_mode, assigned, consent_given_at, contacts, facts, request, handoff, client_in_erp]
      properties:
        lead: {type: string, pattern: '^L-\d{4,}$'}
        name: {type: string}
        language: {$ref: '#/components/schemas/Language'}
        channel: {$ref: '#/components/schemas/MessageChannel'}
        owner_mode: {$ref: '#/components/schemas/LeadOwnerMode'}
        assigned:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        consent_given_at:
          type: [string, 'null']
          format: date-time
          description: Согласие на обработку данных; без него написать клиенту нельзя
        contacts: {$ref: '#/components/schemas/ConversationContacts'}
        facts: {$ref: '#/components/schemas/HandoffFacts'}
        request: {type: [string, 'null']}
        handoff:
          oneOf:
            - $ref: '#/components/schemas/HandoffInfo'
            - type: 'null'
        client_in_erp:
          type: boolean
          description: Лид уже стал клиентом (компания в ERP)

    ThreadAttachment:
      type: object
      additionalProperties: false
      required: [index, name, mime, size, url]
      properties:
        index: {type: integer, minimum: 0}
        name: {type: string}
        mime: {type: string}
        size: {type: [integer, 'null']}
        url:
          type: [string, 'null']
          description: Ссылка BFF на файл (`/api/v1/crm/messages/{lead}/attachments/…`); `null` — файл не сохранён

    ThreadMessage:
      type: object
      additionalProperties: false
      required: [id, author, author_name, text, created_at, attachments, delivery]
      properties:
        id: {type: integer}
        author:
          type: string
          enum: [lead, bot, manager, system]
        author_name:
          type: [string, 'null']
          description: Имя сотрудника у ответа менеджера
        text: {type: string}
        created_at: {type: string, format: date-time}
        attachments:
          type: array
          items: {$ref: '#/components/schemas/ThreadAttachment'}
        delivery:
          type: [string, 'null']
          enum: [sending, unconfirmed, null]
          description: >-
            Только у ответа менеджера с ключом повтора: `sending` — отправка идёт («Отправляется…»); `unconfirmed` — доставка
            не подтверждена (таймаут Telegram или сбой записи итога, отправка старше 2 минут — тот же срок, что у CRM): повтор
            этим ключом сообщение не шлёт, проверьте у клиента (B-013). `null` — доставлено или это не ответ менеджера

    TeamNote:
      type: object
      additionalProperties: false
      required: [id, author_name, text, created_at, visible_to_bot]
      properties:
        id: {type: integer}
        author_name: {type: [string, 'null']}
        text: {type: string}
        created_at: {type: string, format: date-time}
        visible_to_bot:
          type: boolean
          description: Заметка при возврате боту — её видит и бот

    ConversationThread:
      type: object
      additionalProperties: false
      required: [items, notes, has_more]
      properties:
        items:
          type: array
          description: Сообщения, старые выше
          items: {$ref: '#/components/schemas/ThreadMessage'}
        notes:
          type: array
          description: Заметки команды (только на первой странице, без `before`), новые выше
          items: {$ref: '#/components/schemas/TeamNote'}
        has_more:
          type: boolean
          description: Есть сообщения старше — «Показать раньше»

    ReplyIn:
      type: object
      additionalProperties: false
      required: [text, client_message_id]
      properties:
        text: {type: string, minLength: 1, maxLength: 4000}
        client_message_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
          description: Ключ повтора черновика — тот же при «Повторить»

    SentMessage:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: integer, description: 'Id сообщения в переписке'}

    TeamNoteIn:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 4000}

    AssistIn:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [draft, improve]
        text: {type: [string, 'null'], maxLength: 4000, description: 'Текст из поля для `improve`'}

    AssistSuggestion:
      type: object
      additionalProperties: false
      required: [text, notice]
      properties:
        text: {type: string}
        notice:
          type: [string, 'null']
          enum: [numbers_removed, new_numbers, null]
          description: '`numbers_removed` — из черновика убраны числа не из базы знаний; `new_numbers` — правка добавила числа, возвращён исходный текст'

    ReturnToBotIn:
      type: object
      additionalProperties: false
      properties:
        note: {type: [string, 'null'], maxLength: 4000}

    CalcState:
      type: string
      enum: [not_started, in_progress, returned, at_director, rejected, approved]
      description: >-
        Где расчёт: не начат; в работе; возвращён директором на доработку; черновик КП у директора; КП отклонено; КП одобрено
        (и дальше)

    CalcVisaState:
      type: string
      enum: [none, waiting, done]
      description: '`none` — строк этого вида нет; `waiting` — есть строки без визы; `done` — все строки вида завизированы'

    CalcVisaIndicators:
      type: object
      additionalProperties: false
      required: [stock, supply, engineer]
      description: Три индикатора виз заявки (SPEC-v3 §7.4) — склад (товары со склада), снабжение (под заказ), гл. инженер (услуги)
      properties:
        stock: {$ref: '#/components/schemas/CalcVisaState'}
        supply: {$ref: '#/components/schemas/CalcVisaState'}
        engineer: {$ref: '#/components/schemas/CalcVisaState'}

    CalcAssignee:
      type: object
      additionalProperties: false
      required: [zone, name]
      description: Исполнитель из резолюции директора; `name` пуст, если сотрудник ещё не заведён в ERP
      properties:
        zone: {$ref: '#/components/schemas/LetterZone'}
        name: {type: [string, 'null']}

    CalcRequestRow:
      type: object
      additionalProperties: false
      required: [number, title, client, step, state, due, letter_number, lines, visas, responsible, assignees, path]
      properties:
        number: {type: string, examples: [ЗВ-2026-104]}
        title: {type: string}
        client: {type: [string, 'null']}
        step: {$ref: '#/components/schemas/StepCode'}
        state: {$ref: '#/components/schemas/CalcState'}
        due: {type: string, format: date, description: Срок расчёта из резолюции}
        letter_number: {type: string, examples: [ВХ-104/26]}
        lines: {type: integer, minimum: 0}
        visas: {$ref: '#/components/schemas/CalcVisaIndicators'}
        responsible: {type: [string, 'null'], description: Менеджер заявки}
        assignees:
          type: array
          items: {$ref: '#/components/schemas/CalcAssignee'}
        path: {type: string, examples: ['/erp/calc/ЗВ-2026-104']}

    CalcRequestList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CalcRequestRow'}

    CalcTask:
      type: object
      additionalProperties: false
      required: [letter_number, letter_subject, resolution_text, decided_at, decided_by, due, assignees]
      description: Задание расчёта — резолюция директора (проекция события EDS в ERP)
      properties:
        letter_number: {type: string}
        letter_subject: {type: string}
        resolution_text: {type: string}
        decided_at: {type: string, format: date-time}
        decided_by: {type: [string, 'null']}
        due: {type: string, format: date}
        min_margin_pct:
          description: Маржа не ниже, % — только группе `cost_margin`
          oneOf:
            - {$ref: '#/components/schemas/DecimalString'}
            - {type: 'null'}
        assignees:
          type: array
          items: {$ref: '#/components/schemas/CalcAssignee'}

    CalcRequestText:
      type: object
      additionalProperties: false
      required: [text, lines]
      properties:
        text: {type: string, description: Заявка словами (текст клиента или суть из «Создать заявку»)}
        lines: {type: integer, minimum: 0, description: Строк в заявке клиента}

    CalcQuote:
      type: object
      additionalProperties: false
      required: [number, version, state, director_comment, vat_rate]
      properties:
        number: {type: [string, 'null'], description: Номер КП появляется при «Расчёт готов»}
        version: {type: integer, minimum: 1}
        state: {$ref: '#/components/schemas/CalcState'}
        director_comment: {type: [string, 'null'], description: Комментарий директора при возврате на доработку}
        vat_rate: {$ref: '#/components/schemas/DecimalString'}

    CalcLineKind:
      type: string
      enum: [goods, goods_to_order, service]
      description: Товар со склада (остаток покрывает количество), товар под заказ, услуга

    CalcZone:
      type: string
      enum: [goods, services]
      description: Зона визы строки — товары (`erp.calc.goods`) или услуги (`erp.calc.services`)

    CalcStock:
      type: object
      additionalProperties: false
      required: [on_hand, cell, reserved]
      description: Склад своей компании; ячейка и резерв — с экрана «Склад» (D2-2), пока пусто
      properties:
        on_hand: {type: [integer, 'null'], description: Остаток; пусто — строка без карточки каталога}
        cell: {type: [string, 'null']}
        reserved: {type: [integer, 'null']}

    CalcSupplier:
      type: object
      additionalProperties: false
      required: [name, lead_days, min_order_qty, price_valid_until]
      properties:
        name: {type: string}
        lead_days: {type: [integer, 'null']}
        min_order_qty: {type: integer, description: Квота — минимальный заказ у поставщика}
        price_valid_until: {type: [string, 'null'], format: date}
        offer_price:
          description: Цена предложения поставщика — группе `supplier_prices` или держателю `erp.calc.goods`
          oneOf:
            - {$ref: '#/components/schemas/DecimalString'}
            - {type: 'null'}
        offer_currency:
          description: Валюта предложения — группе `supplier_prices` или держателю `erp.calc.goods`
          type: [string, 'null']

    CalcLineVisa:
      type: object
      additionalProperties: false
      required: [by, at]
      properties:
        by: {type: string, description: Кто подтвердил строку (факт визы)}
        at: {type: string, format: date-time}

    CalcLine:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - article
        - product_id
        - product_name
        - kind
        - zone
        - group
        - quantity
        - unit
        - stock
        - supplier
        - lead_days
        - crew_rate
        - crew_days
        - client_price
        - visa
        - can_edit
      properties:
        id: {type: string, pattern: '^[0-9]+$'}
        name: {type: string}
        article: {type: string}
        product_id: {type: [string, 'null'], pattern: '^[0-9]+$', description: Карточка каталога (сопоставление)}
        product_name: {type: [string, 'null']}
        kind: {$ref: '#/components/schemas/CalcLineKind'}
        zone: {$ref: '#/components/schemas/CalcZone'}
        group:
          type: string
          enum: [stock, supply, engineer]
          description: Индикатор виз, к которому относится строка
        quantity: {type: integer, minimum: 1}
        unit: {type: string}
        stock: {$ref: '#/components/schemas/CalcStock'}
        supplier:
          oneOf:
            - {$ref: '#/components/schemas/CalcSupplier'}
            - {type: 'null'}
        lead_days: {type: [integer, 'null'], description: 'Срок поставки строки, дней'}
        purchase_price:
          description: Закупка товара за единицу в валюте строки — `cost_margin` или держателю `erp.calc.goods`
          oneOf:
            - {$ref: '#/components/schemas/DecimalString'}
            - {type: 'null'}
        purchase_currency:
          description: Валюта закупки — `cost_margin` или держателю зоны строки
          type: string
        crew_rate:
          description: Услуга — ставка бригады, сум/день (вводит гл. инженер); `cost_margin` или держателю `erp.calc.services`, иначе null
          oneOf:
            - {$ref: '#/components/schemas/DecimalString'}
            - {type: 'null'}
        crew_days:
          description: Услуга — дней работы бригады; `cost_margin` или держателю `erp.calc.services`, иначе null
          oneOf:
            - {$ref: '#/components/schemas/DecimalString'}
            - {type: 'null'}
        cost:
          description: Себестоимость за единицу, сум (закупка с пошлиной по курсу) — `cost_margin` или держателю зоны строки
          oneOf:
            - {$ref: '#/components/schemas/DecimalString'}
            - {type: 'null'}
        client_price:
          $ref: '#/components/schemas/DecimalString'
          description: Клиенту за единицу, сум, без НДС
        markup_pct:
          description: Наценка строки, % — только группе `cost_margin`
          oneOf:
            - {$ref: '#/components/schemas/DecimalString'}
            - {type: 'null'}
        visa:
          oneOf:
            - {$ref: '#/components/schemas/CalcLineVisa'}
            - {type: 'null'}
        can_edit: {type: boolean, description: 'Сотрудник может править и визировать строку (зона, черновик)'}

    CalcTotals:
      type: object
      additionalProperties: false
      required: [client, vat_included]
      description: Итоги без НДС
      properties:
        client: {$ref: '#/components/schemas/DecimalString'}
        purchase:
          description: Закупка итого — только группе `cost_margin`
          $ref: '#/components/schemas/DecimalString'
        markup_pct:
          description: Наценка итого — только группе `cost_margin`
          oneOf:
            - {$ref: '#/components/schemas/DecimalString'}
            - {type: 'null'}
        vat_included: {type: boolean, const: false}

    CalcVisaGroup:
      type: object
      additionalProperties: false
      required: [state, total, signed, by]
      properties:
        state: {$ref: '#/components/schemas/CalcVisaState'}
        total: {type: integer, minimum: 0}
        signed: {type: integer, minimum: 0}
        by:
          type: array
          description: Кто визировал строки этого вида (факт визы)
          items: {type: string}

    CalcVisaGroups:
      type: object
      additionalProperties: false
      required: [stock, supply, engineer]
      properties:
        stock: {$ref: '#/components/schemas/CalcVisaGroup'}
        supply: {$ref: '#/components/schemas/CalcVisaGroup'}
        engineer: {$ref: '#/components/schemas/CalcVisaGroup'}

    CalcReady:
      type: object
      additionalProperties: false
      required: [allowed, blocker, missing]
      properties:
        allowed: {type: boolean}
        blocker:
          type: [string, 'null']
          enum: [not_started, not_in_calculation, not_draft, no_lines, visas_missing, null]
          description: Почему «Расчёт готов» неактивна
        missing: {type: integer, minimum: 0, description: Строк без визы}

    CalcRights:
      type: object
      additionalProperties: false
      required: [goods, services, build, cost]
      description: Что сотрудник может в этом расчёте (права ERP, вычисленные из разделов каталога)
      properties:
        goods: {type: boolean, description: Править и визировать товары}
        services: {type: boolean, description: Править и визировать услуги}
        build: {type: boolean, description: 'Начать расчёт, «Расчёт готов», ИИ-разбор'}
        cost: {type: boolean, description: Видеть себестоимость и наценку по строкам}

    CalcSheet:
      type: object
      additionalProperties: false
      required: [number, title, client, step, path, task, request, quote, lines, totals, visas, ready, rights]
      properties:
        number: {type: string, examples: [ЗВ-2026-104]}
        title: {type: string}
        client: {type: [string, 'null']}
        step: {$ref: '#/components/schemas/StepCode'}
        path: {type: string}
        task: {$ref: '#/components/schemas/CalcTask'}
        request: {$ref: '#/components/schemas/CalcRequestText'}
        quote:
          oneOf:
            - {$ref: '#/components/schemas/CalcQuote'}
            - {type: 'null'}
        lines:
          type: array
          items: {$ref: '#/components/schemas/CalcLine'}
        totals: {$ref: '#/components/schemas/CalcTotals'}
        visas: {$ref: '#/components/schemas/CalcVisaGroups'}
        ready: {$ref: '#/components/schemas/CalcReady'}
        rights: {$ref: '#/components/schemas/CalcRights'}

    CalcLineIn:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 500}
        quantity: {type: integer, minimum: 1, maximum: 1000000}
        unit: {type: string, maxLength: 32}
        kind:
          type: string
          enum: [goods, service]
          description: Тип строки без карточки каталога (у карточки тип задаёт каталог)
        product_id: {type: [string, 'null'], pattern: '^[0-9]+$'}
        article: {type: string, maxLength: 120}
        note: {type: string, maxLength: 1000}

    CalcLinesIn:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/CalcLineIn'}

    CalcLinePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 500}
        quantity: {type: integer, minimum: 1, maximum: 1000000}
        unit: {type: string, maxLength: 32}
        lead_days: {type: [integer, 'null'], minimum: 0, maximum: 3650}
        purchase_price: {$ref: '#/components/schemas/DecimalString'}
        purchase_currency: {type: string, pattern: '^[A-Z]{3}$'}
        crew_rate:
          oneOf:
            - {$ref: '#/components/schemas/DecimalString'}
            - {type: 'null'}
        crew_days:
          oneOf:
            - {$ref: '#/components/schemas/DecimalString'}
            - {type: 'null'}
        client_price: {$ref: '#/components/schemas/DecimalString'}
        product_id: {type: [string, 'null'], pattern: '^[0-9]+$'}
        kind: {type: string, enum: [goods, service]}

    CalcParseIn:
      type: object
      additionalProperties: false
      properties:
        text: {type: string, maxLength: 20000, description: Свой текст; без поля — текст заявки}

    CalcParseJob:
      type: object
      additionalProperties: false
      required: [job_id]
      properties:
        job_id: {type: string}

    CalcProposalLine:
      type: object
      additionalProperties: false
      required: [name, quantity, unit, article, note]
      properties:
        name: {type: string}
        quantity: {type: integer, minimum: 1}
        unit: {type: string}
        article: {type: string}
        note: {type: string}

    CalcParseResult:
      type: object
      additionalProperties: false
      required: [status, lines]
      properties:
        status: {type: string, enum: [pending, done, failed]}
        lines:
          type: array
          items: {$ref: '#/components/schemas/CalcProposalLine'}
        recognized: {type: integer, minimum: 0}
        truncated: {type: boolean}
        reason: {type: string, description: 'Причина `failed`: код ERP в нижнем регистре'}

    CalcCatalogItem:
      type: object
      additionalProperties: false
      required: [id, name, article, kind, on_hand, supplier_name, lead_days]
      properties:
        id: {type: string, pattern: '^[0-9]+$'}
        name: {type: string}
        article: {type: string}
        kind: {type: string, enum: [goods, service]}
        on_hand: {type: integer, minimum: 0}
        supplier_name: {type: [string, 'null']}
        lead_days: {type: [integer, 'null']}

    CalcCatalogPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CalcCatalogItem'}
