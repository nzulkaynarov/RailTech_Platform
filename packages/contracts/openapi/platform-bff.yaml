      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/EdsDocumentKind'}
        number: {type: [string, 'null']}
        status: {type: string, enum: [draft, on_approval, returned, rejected, approved, to_accountant, paid, sent]}
        version: {type: integer, minimum: 1}
        subject: {type: string}
        text: {type: string}
        author: {$ref: '#/components/schemas/EdsPerson'}
