  /admin/bot/exports/{entity}:
    get:
      tags: [bot]
      operationId: downloadCsvExport
      summary: 'Выгрузка CSV: лиды, клиенты или сделки'
      description: >-
        CRM `GET /export/{leads|clients|deals}.csv`. Нужен `admin: full` (право CRM `export:read`) **и** чтение выгружаемых данных:
        лиды — `crm.leads`, клиенты и сделки — `crm.clients` (системная «Администратор» без второй роли бизнес-данные не
        выгружает, R3-D-2). BFF проверяет оба раздела и отдаёт файл потоком, не накапливая его в памяти: CSV для Excel (UTF-8 с BOM,
        разделитель `;`), до 10 000 строк, имя файла с датой в `Content-Disposition` (`leads-20261026-1530.csv`). Каждая выгрузка
        пишется в журнал аудита CRM. Фильтры — как на экранах списков; недопустимый — 422.
      parameters:
        - name: entity
          in: path
          required: true
          schema: {type: string, enum: [leads, clients, deals]}
        - name: q
          in: query
          required: false
          description: 'Поиск (лиды, клиенты), до 100 символов'
          schema: {type: string, maxLength: 100}
        - name: stage
          in: query
          required: false
          description: 'Стадия: у сделок `open`, `won`, `lost`; у лидов — код стадии CRM'
          schema: {type: string, maxLength: 32}
        - name: language
          in: query
          required: false
          description: Лиды — язык
          schema: {$ref: '#/components/schemas/Language'}
        - name: created_from
          in: query
          required: false
          description: Лиды — созданы не раньше (дата-время)
          schema: {type: string, format: date-time}
        - name: created_to
          in: query
          required: false
          description: Лиды — созданы не позже (дата-время)
          schema: {type: string, format: date-time}
        - name: closed_from
          in: query
          required: false
          description: Сделки — закрыты не раньше
          schema: {type: string, format: date}
        - name: closed_to
          in: query
          required: false
          description: Сделки — закрыты не позже
          schema: {type: string, format: date}
      responses:
        '200':
          description: Файл CSV
          headers:
            Content-Disposition:
              description: '`attachment; filename="leads-20261026-1530.csv"`'
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/letters:
    get:
      tags: [letters]
      operationId: listLetters
      summary: 'EDS · Входящие письма: список'
      description: >-
        EDS `GET /letters` (право `letters.read`). Раздел `eds.inbox` — чтение; менеджер и бухгалтер видят список, директор
        — тоже и решает. Порядок — от новых к старым. Страница — непрозрачный `cursor` из `next_cursor`. Клиент — название
        организации-отправителя из письма, заявка — бизнес-номер ЗВ из связей письма. EDS не ответил — 503
        `BACKEND_UNAVAILABLE` (`source = eds`); у сотрудника нет прав в EDS — 403 `FORBIDDEN` (`details.reason = eds_not_granted`).
      parameters:
        - name: status
          in: query
          required: false
          description: Только письма в этих статусах (параметр повторяется); без параметра — все
          schema:
            type: array
            uniqueItems: true
            items: {$ref: '#/components/schemas/LetterStatus'}
          style: form
          explode: true
        - name: q
          in: query
          required: false
          description: Поиск по номеру, теме, отправителю и номеру заявки
          schema: {type: string, maxLength: 200}
        - name: cursor
          in: query
          required: false
          description: Непрозрачный курсор из `next_cursor`
          schema: {type: string, maxLength: 500}
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Страница писем
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterPage'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/letters/{ref}:
    get:
      tags: [letters]
      operationId: getLetter
      summary: 'EDS · Карточка входящего письма (по id или по номеру ВХ)'
      description: >-
        EDS `GET /letters/{id}`; по номеру — сначала `GET /registry?number=` (EDS адресует письма UUID, в номере есть «/»).
        `ref` — UUID письма или номер `ВХ-104/26`; косая черта номера допускается в пути как есть и как `%2F`. Номера нет в
        реестре или он не письмо — 404 `NOT_FOUND`. Данные заявки (шаг пути, название) BFF читает в ERP по ссылке письма
        (`links.erp_deal_id`); ERP не ответил — ответ 200 без данных заявки, шаг выведен по самому письму, а
        `sources.erp = unavailable` (плашка «ERP не отвечает, данные неполные»). Шаг пути — по правилу
        `docs/architecture/integration-map.md` §2: ждёт резолюции — «Резолюция», резолюция наложена — «Расчёт» (или дальше, если
        заявка ERP уже дальше), возвращено — «Заявка», отклонено — «Отказ». Поле `resolution.min_margin_pct` (маржа) без группы
        `cost_margin` у ролей сотрудника не отдаётся. Раздел `eds.inbox` — чтение.
      parameters:
        - name: ref
          in: path
          required: true
          description: UUID письма или номер `ВХ-NNN/ГГ`
          schema: {type: string, minLength: 1, maxLength: 64}
      responses:
        '200':
          description: Карточка письма
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/letters/{id}/resolution:
    post:
      tags: [letters]
      operationId: resolveLetter
      summary: 'EDS · Утвердить резолюцию → задание в расчёт'
      description: >-
        EDS `POST /letters/{id}/resolution` (право `letters.resolve`). Раздел `eds.inbox` — полный: роль только для чтения
        получает 403 в BFF до EDS. Письмо должно ждать резолюции, иначе 409 `CONFLICT` (`details.reason = invalid_state`).
        Срок расчёта в прошлом (по `Asia/Tashkent`) — 422 `VALIDATION_FAILED`, `details.fields = [due]`, `details.reason =
        due_in_past`; исполнитель не найден или отключён — `details.fields = [assignees]`, `details.reason =
        not_active_employee`; исполнитель дважды в одной зоне — `duplicate`; `min_margin_pct` у роли без группы `cost_margin` — 422 BFF, `details.reason = margin_forbidden`, в EDS запрос не уходит. Текст ошибки — `message` EDS на языке
        сотрудника. Исполнитель без раздела своей зоны — 422, `details.fields = [assignees]`, `details.reason =
        assignee_zone_mismatch` (проверяет EDS, D1-8). Ответ — обновлённая карточка. Решение, кого можно назначить, остаётся за EDS и ERP: BFF только передаёт
        сотрудников и зоны (`GET /eds/resolution/assignees` подсказывает, кого выбрать).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/LetterIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolutionIn'
      responses:
        '200':
          description: Резолюция наложена, задание в расчёт поставлено событием шины
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LetterConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/letters/{id}/return:
    post:
      tags: [letters]
      operationId: returnLetter
      summary: 'EDS · Вернуть письмо менеджеру с комментарием'
      description: >-
        EDS `POST /letters/{id}/return` (право `letters.resolve`). Раздел `eds.inbox` — полный. Комментарий обязателен
        (пустой — 422 `details.fields = [comment]`). Письмо уходит к регистратору (статус «Возвращено»), событие
        `letter.returned`. Ответ — обновлённая карточка.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/LetterIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterReturnIn'
      responses:
        '200':
          description: Возвращено менеджеру
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LetterConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/letters/{id}/reject:
    post:
      tags: [letters]
      operationId: rejectLetter
      summary: 'EDS · Отклонить письмо с причиной'
      description: >-
        EDS `POST /letters/{id}/reject` (право `letters.resolve`). Раздел `eds.inbox` — полный. Причина обязательна (пустая —
        422 `details.fields = [reason]`). Статус «Отклонено», событие `letter.rejected`: ERP переводит заявку в «Отказ» с
        причиной. Ответ — обновлённая карточка.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/LetterIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetterRejectIn'
      responses:
        '200':
          description: Отклонено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LetterConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/resolution/assignees:
    get:
      tags: [letters]
      operationId: listResolutionAssignees
      summary: 'EDS · Кого можно назначить исполнителем резолюции, по зонам'
      description: >-
        Кандидаты по зонам резолюции: товары (склад и цены поставщиков), услуги (ТЗ, бригада), условия оплаты. Зона даёт
        сотрудникам **раздел каталога**, а не код роли: товары — `erp.calc.goods`, услуги — `erp.calc.services`, условия оплаты —
        `eds.payments` (все — уровень «полный»). Выбор делает CRM — `GET /team?section=&level=full` по вызову на зону (D1-8,
        B-007); BFF матрицы ролей не сводит. Операция CRM требует чтения сотрудников (раздел `admin` не ниже чтения): если роли
        сотрудника его не дают — 200 с пустыми списками и `directory = forbidden`. EDS при резолюции сверяет зону исполнителя
        сам (422 `assignee_zone_mismatch`). Автор резолюции в списках исключён. Раздел `eds.inbox` — полный.
      responses:
        '200':
          description: Кандидаты по трём зонам
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolutionAssignees'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/letter-files/{file_id}:
    get:
      tags: [letters]
      operationId: downloadLetterFile
      summary: 'EDS · Скачать вложение письма'
      description: >-
        EDS `GET /files/{id}` потоком, последняя версия. Раздел `eds.inbox` — чтение. Файл отдаётся как вложение
        (`Content-Disposition: attachment`), тип содержимого браузер не исполняет (`X-Content-Type-Options: nosniff`,
        `Content-Security-Policy: sandbox`). Файла нет или он не виден сотруднику — 404 `NOT_FOUND`.
      parameters:
        - name: file_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Содержимое файла
          headers:
            Content-Disposition:
              description: '`attachment; filename*=UTF-8''''…`'
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/messages:
    get:
      tags: [messages]
      operationId: listCrmMessages
      summary: 'Клиенты · Ждут ответа: передачи от бота, мои диалоги, лиды без менеджера'
      description: >-
        CRM `GET /inbox` с запиской передачи (CRM-06). Раздел `crm.leads` от чтения: директор видит очередь без «Забрать» и
        ответа. Группы: `handoff` — открытые и отложенные передачи (срочные выше, затем по времени), `mine` — мои лиды в
        диалоге, `unassigned` — лиды на паузе без менеджера. Лид в одной группе (первая подходящая). Таймер SLA экран считает
        от `handoff.created_at` до `handoff.sla_due_at`. Живые обновления — подсказка `messages` потока `/events/stream`.
      responses:
        '200':
          description: Очередь «Ждут ответа»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageInbox'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/messages/{lead}:
    get:
      tags: [messages]
      operationId: getCrmConversation
      summary: 'Карточка лида для переписки: контакты, каналы, факты квалификации, кто ведёт'
      description: >-
        CRM `GET /leads/{id}` (+ открытая передача). Раздел `crm.leads` от чтения. Номер лида — `L-NNNN`.
      parameters:
        - $ref: '#/components/parameters/LeadNumber'
      responses:
        '200':
          description: Карточка лида
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/messages/{lead}/thread:
    get:
      tags: [messages]
      operationId: getCrmThread
      summary: 'Лента диалога: сообщения клиента, бота и менеджера, вложения, заметки команды'
      description: >-
        CRM `GET /leads/{id}/messages` (страница, старые выше), `GET /leads/{id}/notes` (только первая страница — без `before`)
        и `GET /team` (имена менеджеров). Раздел `crm.leads` от чтения. Подгрузка истории — `before` = id самого старого
        показанного сообщения. Вложения — ссылками BFF (`attachments[].url`): адреса и ключи хранилища наружу не уходят.
      parameters:
        - $ref: '#/components/parameters/LeadNumber'
        - name: before
          in: query
          required: false
          description: Сообщения старше этого id (подгрузка истории)
          schema: {type: integer, minimum: 1}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Страница переписки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationThread'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/messages/{lead}/attachments/{message}/{index}:
    get:
      tags: [messages]
      operationId: downloadCrmAttachment
      summary: 'Вложение сообщения клиента (файл)'
      description: >-
        CRM `GET /leads/{id}/messages/{message}/attachments/{index}` потоком. Раздел `crm.leads` от чтения. Ответ —
        `Content-Disposition: attachment` и `X-Content-Type-Options: nosniff`: файл скачивается, браузер его не исполняет.
        Файл не сохранён (до согласия, больше 20 МБ) — 404; хранилище CRM недоступно — 502 `INTEGRATION_FAILED`.
      parameters:
        - $ref: '#/components/parameters/LeadNumber'
        - name: message
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: index
          in: path
          required: true
          schema: {type: integer, minimum: 0, maximum: 19}
      responses:
        '200':
          description: Файл
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/IntegrationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/messages/{lead}/take:
    post:
      tags: [messages]
      operationId: takeCrmLead
      summary: 'Забрать лида: бот замолкает, диалог ведёт сотрудник'
      description: >-
        CRM `POST /leads/{id}/actions/take`. Раздел `crm.leads` полный. Лида уже забрал другой — 409 `CONFLICT`
        (`details.reason = lead_taken`, `details.assigned_user_name`).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/LeadNumber'
      responses:
        '200':
          description: Лид у сотрудника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOk'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MessagesConflict'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/messages/{lead}/reply:
    post:
      tags: [messages]
      operationId: replyCrmLead
      summary: 'Ответить клиенту «От себя» (уходит в Telegram)'
      description: >-
        CRM `POST /leads/{id}/messages`. Раздел `crm.leads` полный; отвечает тот, кто забрал лида (или администратор CRM).
        `client_message_id` — ключ повтора, который экран создаёт на черновик: «Повторить» с тем же ключом не отправит клиенту
        второе сообщение. Telegram отказал — 502 `INTEGRATION_FAILED` с `details.reason = delivery_failed`, сообщение не
        записано, текст остаётся у экрана; Telegram не ответил вовремя — 502 `INTEGRATION_FAILED` с `delivery_unknown` (итог
        неизвестен: «Повторить» тем же ключом не продублирует, пока отправка идёт — 409 `reply_in_progress`); итог прежней
        отправки с этим ключом так и не узнали — 409 `CONFLICT` `delivery_unconfirmed` (второе сообщение не уходит, «лид
        отвечен» не ставится). Лид не забран — 409 `CONFLICT` (`take_first`), нет согласия клиента — 409
        (`no_consent`), лид у другого — 403 `FORBIDDEN` (`not_lead_owner`).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/LeadNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyIn'
      responses:
        '200':
          description: Отправлено клиенту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MessagesConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          $ref: '#/components/responses/IntegrationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/messages/{lead}/note:
    post:
      tags: [messages]
      operationId: noteCrmLead
      summary: 'Заметка команде (клиенту не уходит)'
      description: >-
        CRM `POST /leads/{id}/actions/note` (`visible_to_bot = false`). Раздел `crm.leads` полный.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/LeadNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamNoteIn'
      responses:
        '201':
          description: Заметка записана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedId'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/messages/{lead}/assist:
    post:
      tags: [messages]
      operationId: assistCrmReply
      summary: 'Подсказать ответ (ИИ через CRM): текст для поля, клиенту ничего не уходит'
      description: >-
        CRM `POST /leads/{id}/assist` (ИИ — только CRM через LiteLLM). Раздел `crm.leads` полный. `draft` — черновик ответа на
        последнее сообщение клиента, `improve` — правка текста из поля. Отправляет человек. Таймаут — как у проб (30 с).
        Отказы — 409 `CONFLICT` с `details.reason`: `assist_disabled`, `assist_budget`, `assist_empty`, `assist_no_history`;
        модель не ответила — 502 `INTEGRATION_FAILED` (`assist_unavailable`).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/LeadNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistIn'
      responses:
        '200':
          description: Предложение для поля ответа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistSuggestion'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MessagesConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          $ref: '#/components/responses/IntegrationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/messages/{lead}/return-to-bot:
    post:
      tags: [messages]
      operationId: returnCrmLeadToBot
      summary: 'Вернуть лида боту (бот снова отвечает сам)'
