            $ref: '#/components/schemas/SearchGroup'
        sources:
          $ref: '#/components/schemas/Sources'

    EdsDocumentKind:
      type: string
      enum: [memo, application, report, letter_out]
      description: Служебная записка (СЗ), заявление (ЗЯ), отчёт (ОТ), письмо (ИСХ)
    EdsRegistryKind:
      type: string
      enum: [letter_in, letter_out, quote, memo, application, report]
      description: 'Вкладки реестра «Все документы»: письма (входящие и исходящие), КП, служебные, заявления, отчёты'
    EdsPerson:
      type: object
      additionalProperties: false
      required: [crm_user_id, full_name]
      properties:
        crm_user_id: {type: integer}
        full_name: {type: string}
    EdsMoney:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: {type: string, pattern: '^\d+\.\d{2}$', description: 'Деньги строкой с двумя знаками, больше нуля: `1500000.00`'}
        currency: {type: string, pattern: '^[A-Z]{3}$', examples: [UZS]}
    EdsRecipient:
      type: object
      additionalProperties: false
      required: [name]
      description: Адресат письма (организация) — только тип `letter_out`
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        inn: {type: [string, 'null'], maxLength: 32}
    EdsDocumentRow:
      type: object
      additionalProperties: false
      required: [kind, id, number, subject, status, author, amount, due_date, created_at, openable]
      properties:
        kind: {$ref: '#/components/schemas/EdsRegistryKind'}
        id: {type: string, format: uuid}
        number: {type: [string, 'null'], description: 'Номер реестра EDS или КП ERP; `null` — письмо до отправки'}
        subject: {type: string}
        status:
          type: string
          description: >-
            Статус словом по типу. Документ — `draft`, `on_approval`, `returned`, `rejected`, `approved`, `to_accountant`,
            `paid`, `sent`; входящее письмо — `awaiting_resolution`, `resolved`, `returned`, `rejected`; КП (маршрут) —
            `open`, `approved`, `returned`, `rejected`
        author: {oneOf: [{$ref: '#/components/schemas/EdsPerson'}, {type: 'null'}], description: 'Автор документа; у письма и КП — ответственный'}
        amount: {oneOf: [{$ref: '#/components/schemas/EdsMoney'}, {type: 'null'}], description: 'Только «Мои»; в реестре `null`'}
        due_date: {type: [string, 'null'], format: date, description: 'Только «Мои»; в реестре `null`'}
        created_at: {type: string, format: date-time, description: 'Создан (в реестре — зарегистрирован)'}
        openable:
          type: boolean
          description: Документ (`memo`, `application`, `report`, `letter_out`) открывается в боковом окне; письма и КП — в своих разделах
    EdsDocumentPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/EdsDocumentRow'}
        next_cursor: {type: [string, 'null']}
    EdsFile:
      type: object
      additionalProperties: false
      required: [id, name, content_type, size]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 255}
        content_type: {type: string}
        size: {type: integer, minimum: 0}
    EdsFileUpload:
      type: object
      required: [file]
      properties:
        file: {type: string, format: binary}
    EdsRouteStep:
      type: object
      additionalProperties: false
      required: [label, status, decided_by, decided_at, comment]
      properties:
        label: {type: string, description: '«Директор», «Бухгалтер»'}
        status: {type: string, enum: [pending, current, approved, returned, rejected, skipped]}
        decided_by: {oneOf: [{$ref: '#/components/schemas/EdsPerson'}, {type: 'null'}]}
        decided_at: {type: [string, 'null'], format: date-time}
        comment: {type: [string, 'null']}
    EdsDecision:
      type: object
      additionalProperties: false
      required: [round, step, decision, comment, by, at]
      properties:
        round: {type: integer, minimum: 1, description: Круг маршрута (растёт после возврата)}
        step: {type: integer, minimum: 1}
        decision: {type: string, enum: [approve, return, reject]}
        comment: {type: [string, 'null']}
        by: {$ref: '#/components/schemas/EdsPerson'}
        at: {type: string, format: date-time}
    EdsDealRef:
      type: object
      additionalProperties: false
      required: [erp_deal_id, number]
      properties:
        erp_deal_id: {type: integer}
        number: {type: [string, 'null'], description: 'Бизнес-номер заявки или проекта, если EDS его знает'}
    EdsDocument:
      type: object
      additionalProperties: false
      required:
        [id, kind, number, status, version, subject, text, author, addressee, amount, due_date, files, deal, recipient,
         route, decisions, can_edit, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/EdsDocumentKind'}
        number: {type: [string, 'null']}
        status: {type: string, enum: [draft, on_approval, returned, rejected, approved, to_accountant, paid, sent]}
        version: {type: integer, minimum: 1}
        subject: {type: string}
        text: {type: string}
        author: {$ref: '#/components/schemas/EdsPerson'}
        addressee: {oneOf: [{$ref: '#/components/schemas/EdsPerson'}, {type: 'null'}], description: '`null` — директор (любой, кто согласует служебные записки)'}
        amount: {oneOf: [{$ref: '#/components/schemas/EdsMoney'}, {type: 'null'}]}
        due_date: {type: [string, 'null'], format: date}
        files:
          type: array
          items: {$ref: '#/components/schemas/EdsFile'}
        deal: {oneOf: [{$ref: '#/components/schemas/EdsDealRef'}, {type: 'null'}], description: Связь с проектом}
        recipient: {oneOf: [{$ref: '#/components/schemas/EdsRecipient'}, {type: 'null'}]}
        route:
          type: array
          items: {$ref: '#/components/schemas/EdsRouteStep'}
          description: Шаги маршрута текущего круга; пусто, пока документ не отправлялся
        decisions:
          type: array
          items: {$ref: '#/components/schemas/EdsDecision'}
          description: Решения всех кругов по порядку — кто, что и когда решил
        can_edit: {type: boolean, description: 'Автор, статус `draft` или `returned`: экран открывает форму «Продолжить»'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    EdsDocumentIn:
      type: object
      additionalProperties: false
      required: [kind, subject, text]
      properties:
        kind: {$ref: '#/components/schemas/EdsDocumentKind'}
        subject: {type: string, minLength: 1, maxLength: 300}
        text: {type: string, minLength: 1, maxLength: 20000}
        amount: {oneOf: [{$ref: '#/components/schemas/EdsMoney'}, {type: 'null'}], description: 'Сумма: служебная записка с суммой после директора идёт бухгалтеру'}
        due_date: {type: [string, 'null'], format: date, description: '«Нужно до» — не в прошлом'}
        file_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: uuid}
        erp_deal_id: {type: [integer, 'null'], description: 'Связь с проектом (`GET /eds/deal-options`)'}
        recipient: {oneOf: [{$ref: '#/components/schemas/EdsRecipient'}, {type: 'null'}], description: 'Только `letter_out`'}
        submit:
          type: boolean
          default: false
          description: '`true` — сразу отправить (на согласование; письмо — зарегистрировать); `false` — сохранить черновик'
    EdsDocumentUpdateIn:
      type: object
      additionalProperties: false
      required: [subject, text]
      description: Форма черновика целиком; `amount`, `due_date`, `erp_deal_id` со значением `null` очищают поле
      properties:
        subject: {type: string, minLength: 1, maxLength: 300}
        text: {type: string, minLength: 1, maxLength: 20000}
        amount: {oneOf: [{$ref: '#/components/schemas/EdsMoney'}, {type: 'null'}]}
        due_date: {type: [string, 'null'], format: date}
        file_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: uuid}
        erp_deal_id: {type: [integer, 'null']}
        recipient: {oneOf: [{$ref: '#/components/schemas/EdsRecipient'}, {type: 'null'}], description: 'Только `letter_out`'}
        submit: {type: boolean, default: false}
    ApprovalRouteStatus:
      type: string
      enum: [open, approved, returned, rejected]
      description: Статус маршрута согласования EDS; открыт — ждёт решения
    ApprovalDecision:
      type: string
      enum: [approve, return, reject]
    QuoteSendChannel:
      type: string
      enum: [telegram, cabinet, email]
      description: Telegram-бот, Кабинет клиента, почта
    ChecklistCode:
      type: string
      enum: [visa_goods, visa_services, margin, due]
      description: Виза снабженца, виза гл. инженера, маржа не ниже порога резолюции, срок клиента выдержан

    QuoteApprovalRow:
      type: object
      additionalProperties: false
      required: [id, number, version, request_number, client_name, total, due, status, can_decide, outgoing_number, created_at]
      properties:
        id: {type: string, format: uuid, description: Маршрут одобрения КП (EDS)}
        number: {type: string, description: Номер КП, examples: [КП-2026/115]}
        version: {type: integer, minimum: 1}
        request_number: {type: [string, 'null'], description: Бизнес-номер заявки ЗВ}
        client_name: {type: [string, 'null'], description: 'Из снимка КП; `null` у роли, которой EDS снимок не отдаёт'}
        total: {oneOf: [{$ref: '#/components/schemas/EdsMoney'}, {type: 'null'}], description: Итог с НДС из снимка КП}
        due: {type: [string, 'null'], format: date, description: Срок расчёта из резолюции (снимок КП)}
        status: {$ref: '#/components/schemas/ApprovalRouteStatus'}
        can_decide: {type: boolean, description: Текущий шаг ждёт этого сотрудника (из маршрута EDS; не удалось прочитать — `false`)}
        outgoing_number: {type: [string, 'null'], description: ИСХ-номер одобренного КП}
        created_at: {type: string, format: date-time, description: Когда КП пришло на одобрение}
    QuoteApprovalPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/QuoteApprovalRow'}
        next_cursor: {type: [string, 'null']}

    QuoteLine:
      type: object
      additionalProperties: false
      required: [position, name, quantity, unit, unit_price, amount, lead_time_days, optional]
      properties:
        position: {type: integer, minimum: 1, description: Номер строки по порядку}
        name: {type: string}
        quantity: {type: integer, minimum: 0}
        unit: {type: [string, 'null']}
        unit_price: {type: string, pattern: '^-?\d+(\.\d+)?$', description: Цена без НДС}
        amount: {type: string, pattern: '^-?\d+(\.\d+)?$', description: Сумма строки без НДС}
        lead_time_days: {type: [integer, 'null'], description: 'Срок поставки строки, дней'}
        optional: {type: boolean, description: Опциональная позиция — в итог не входит по решению ERP}
    QuoteTotals:
      type: object
      additionalProperties: false
      required: [currency, subtotal, vat_rate, vat_amount, total]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        subtotal: {type: [string, 'null'], pattern: '^-?\d+(\.\d+)?$', description: 'Без НДС'}
        vat_rate: {type: [string, 'null'], description: 'Ставка НДС, %'}
        vat_amount: {type: [string, 'null'], pattern: '^-?\d+(\.\d+)?$'}
        total: {type: string, pattern: '^-?\d+(\.\d+)?$', description: С НДС}
    QuoteInternal:
      type: object
      additionalProperties: false
      required: [cost, margin_amount, margin_pct, min_margin_pct, payment_terms, valid_until, supplier_price_until]
      description: >-
        Внутренний блок КП — группа полей `cost_margin`. Клиент получает PDF без этих полей. Блок не передаётся совсем, если
        ни одна роль сотрудника не видит `cost_margin`, и если EDS не отдал снимок КП.
      properties:
        cost: {type: [string, 'null'], pattern: '^-?\d+(\.\d+)?$', description: Себестоимость}
        margin_amount: {type: [string, 'null'], pattern: '^-?\d+(\.\d+)?$'}
        margin_pct: {type: string, description: 'Маржа КП, %; может быть отрицательной'}
        min_margin_pct: {type: [string, 'null'], description: 'Порог маржи из резолюции, %'}
        payment_terms:
          type: [string, 'null']
          description: >-
            Условия оплаты. ERP хранит их на уровне компании, а не КП, и в снимке КП их нет — пока всегда `null`
            (хвост в `docs/BACKLOG.md`)
        valid_until: {type: [string, 'null'], format: date, description: Срок действия КП}
        supplier_price_until:
          type: [string, 'null']
          format: date
          description: До какой даты действует цена поставщика. В снимке КП нет — пока всегда `null` (хвост в `docs/BACKLOG.md`)
    QuoteChecklistLine:
      type: object
      additionalProperties: false
      required: [code, ok, blocking, by_name, at]
      properties:
        code: {$ref: '#/components/schemas/ChecklistCode'}
        ok: {type: boolean}
        blocking: {type: boolean, description: '`true` — красная строка блокирует одобрение (визы, маржа); `false` — предупреждение (срок, C1-G-1)'}
        by_name: {type: [string, 'null'], description: Кто поставил визу}
        at: {type: [string, 'null'], format: date-time}
        value:
          type: [string, 'null']
          description: Значение для показа (`17.6 % ≥ 15 %`); строка `margin` — только с группой `cost_margin`, иначе поле не передаётся
    QuoteChannels:
      type: object
      additionalProperties: false
      required: [contact_name, telegram, cabinet, email]
      description: Что известно об основном контакте клиента в ERP (`GET /accounts/contacts/{id}/`); адреса и идентификаторы наружу не отдаются
      properties:
        contact_name: {type: [string, 'null']}
        telegram: {type: boolean, description: Контакт привязан к боту}
        cabinet: {type: boolean, description: У компании клиента есть кабинет}
        email: {type: boolean, description: У контакта указан e-mail}
    QuoteLetterRef:
      type: object
      additionalProperties: false
      required: [number, path]
      properties:
        number: {type: string, examples: [ВХ-104/26]}
        path: {type: string}
    QuoteCalculator:
      type: object
      additionalProperties: false
      required: [name, zone]
      properties:
        name: {type: string}
        zone: {type: string, enum: [goods, services]}
    QuoteApprovalCard:
      type: object
      additionalProperties: false
      required:
        [id, number, version, round, status, stage, can_decide, allowed_decisions, approved_late, outgoing_number, created_at,
         ready_at, due, client_name, request, letter, calculated_by, snapshot_total, totals_mismatch, lines, totals, checklist, steps,
         channels, sources]
      properties:
        id: {type: string, format: uuid, description: 'Маршрут одобрения КП (EDS); именно он идёт в `POST /eds/quotes/{id}/decision`'}
        number: {type: string}
        version: {type: integer, minimum: 1}
        round: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/ApprovalRouteStatus'}
        stage: {$ref: '#/components/schemas/StepCode'}
        can_decide: {type: boolean}
        allowed_decisions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/ApprovalDecision'}
          description: Что можно сейчас; `approve` нет, пока красна блокирующая строка чек-листа (решает EDS)
        approved_late: {type: boolean, description: КП одобрено с опозданием (C1-G-1)}
        outgoing_number: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        ready_at: {type: [string, 'null'], format: date-time, description: Когда расчёт готов (снимок КП)}
        due: {type: [string, 'null'], format: date, description: Срок расчёта из резолюции (снимок КП)}
        client_name: {type: [string, 'null']}
        request: {oneOf: [{$ref: '#/components/schemas/LetterRequest'}, {type: 'null'}]}
        letter: {oneOf: [{$ref: '#/components/schemas/QuoteLetterRef'}, {type: 'null'}], description: Письмо заявки в «Входящих»}
        calculated_by:
          type: array
          items: {$ref: '#/components/schemas/QuoteCalculator'}
          description: Кто считал — авторы виз чек-листа
        snapshot_total:
          oneOf: [{$ref: '#/components/schemas/EdsMoney'}, {type: 'null'}]
          description: 'Итог с НДС из снимка КП (EDS отдаёт его только решающему шаг); `null` — снимка нет'
        totals_mismatch:
          type: boolean
          description: Итог ERP расходится с итогом снимка EDS — КП в ERP менялось после передачи на одобрение; экран предупреждает
        lines:
          type:
            - array
            - 'null'
          items: {$ref: '#/components/schemas/QuoteLine'}
          description: >-
            Состав КП из ERP; `null` — ERP не ответил, не отдал КП (нет доступа) или у ERP другая редакция КП, чем в маршруте
            (закрытые круги прежних версий): тогда строки не показываются, только снимок. Пока `lines = null`, одобрить КП на
            экране нельзя (подпись «Нет данных КП из ERP — обновите карточку»)
        totals:
          oneOf: [{$ref: '#/components/schemas/QuoteTotals'}, {type: 'null'}]
          description: Итоги из ERP; `null` — ERP не ответил
        internal:
          $ref: '#/components/schemas/QuoteInternal'
        checklist:
          type: array
          items: {$ref: '#/components/schemas/QuoteChecklistLine'}
        steps:
          type: array
          items: {$ref: '#/components/schemas/EdsRouteStep'}
        channels: {oneOf: [{$ref: '#/components/schemas/QuoteChannels'}, {type: 'null'}], description: '`null` — контакт клиента не получен из ERP'}
        sources: {$ref: '#/components/schemas/Sources'}
    QuoteDecisionIn:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {$ref: '#/components/schemas/ApprovalDecision'}
        comment:
          type: [string, 'null']
          maxLength: 4000
          description: Обязателен для `return` и `reject`
        channels:
          type: array
          maxItems: 3
          uniqueItems: true
          items: {$ref: '#/components/schemas/QuoteSendChannel'}
          description: Только `approve` — каналы отправки клиенту; пусто — одобрить без отправки (отправит менеджер заявки)

    PaymentTab:
      type: string
      enum: [to_issue, awaiting, proofs, overdue, all]
      description: 'Вкладки «Счетов и оплат»: К выставлению, Ждут оплаты, Платёжки на подтверждение, Просрочены, Все счета'
    PaymentDisplayStatus:
      type: string
      enum: [draft, issued, proof_received, partially_paid, paid, overdue, cancelled]
      description: 'Выставлен (`issued`), Платёжка получена (`proof_received`), Частично (`partially_paid`), Оплачен (`paid`), Просрочен (`overdue`); `draft` — не выставлен'
    PaymentMoney:
      type: object
