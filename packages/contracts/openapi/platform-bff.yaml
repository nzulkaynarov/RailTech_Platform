        amount: {type: string, pattern: '^-?\d+\.\d{2}$', description: 'Деньги строкой с двумя знаками; может быть `0.00`'}
        currency: {type: string, pattern: '^[A-Z]{3}$', examples: [UZS]}
    PaymentSources:
