      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyProfileUpdate'
      responses:
        '200':
          description: Сохранено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`COMPANY_NOT_SET`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/company/logo/image:
    get:
      tags:
        - admin
      operationId: getCompanyLogoImage
      summary: Файл логотипа компании
      description: 'BFF берёт файл в ERP по адресу из карточки компании (только публичный путь логотипа) и отдаёт с теми же защитными заголовками (`X-Content-Type-Options`, `Content-Security-Policy: sandbox`). Нет логотипа, чужой путь или файл больше 5 МБ — 404 `NOT_FOUND`. Раздел `company.settings` — чтение.'
      responses:
        '200':
          description: Изображение
          content:
            image/*:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`COMPANY_NOT_SET` — своя компания в ERP ещё не создана'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/company/logo:
    post:
      tags:
        - admin
      operationId: uploadCompanyLogo
      summary: Загрузить логотип компании
      description: '`multipart/form-data`, поле `logo`; BFF передаёт файл в ERP как есть: не больше 2 МБ, тип части — PNG, JPEG, WebP или SVG, иначе 422 `VALIDATION_FAILED` (`details.reason = unsupported_type`); содержимое проверяет ERP. Раздел `company.settings`
        — полный.'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoUpload'
      responses:
        '200':
          description: Логотип заменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`COMPANY_NOT_SET`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
        - admin
      operationId: deleteCompanyLogo
      summary: Удалить логотип компании
      description: Раздел `company.settings` — полный.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Удалён
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`COMPANY_NOT_SET`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/company/brand:
