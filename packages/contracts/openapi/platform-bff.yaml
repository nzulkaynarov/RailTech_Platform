  /crm/kb/documents:
    get:
      tags: [kb]
      operationId: listKbDocuments
      summary: 'CRM · База знаний: документы'
      description: >-
        CRM `GET /kb/documents`. Читают роли с разделом `crm.leads` или `admin` (любой уровень): у них есть право CRM
        `kb:read`. Администратор без `crm.leads` видит базу знаний тоже — пункт меню `kb` открывает и раздел `admin`.
      parameters:
        - name: active
          in: query
          required: false
          description: Только включённые (`true`) или только выключенные (`false`) документы
          schema: {type: boolean}
      responses:
        '200':
          description: Документы, новые выше
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbDocumentList'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'
    post:
      tags: [kb]
      operationId: uploadKbDocument
      summary: 'Загрузить файл Markdown в базу знаний'
      description: >-
        CRM `POST /kb/documents` (multipart). Раздел `admin` — полный (право CRM `kb:write`). Принимается один файл `.md` по
        формату базы знаний (`docs/kb/FORMAT.md`), не больше 25 МБ: BFF читает файл ограниченно и передаёт CRM, весь файл в
        память не накапливается сверх лимита. Индексация идёт в фоне — документ появляется в списке со статусом «В очереди».
        Нарушение формата — 422 `VALIDATION_FAILED` с `details.reason = kb_format`, `details.rule` и текстами
        `details.messages {ru, uz, en}` «что исправить»; не `.md` — `kb_markdown_only`; пустой файл — `file_empty`; больше
        25 МБ — `file_too_large` (`details.max_bytes`); неизвестный продукт — поле `product_key` в `details.fields`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KbDocumentUpload'
      responses:
        '201':
          description: Документ принят, индексация поставлена в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedId'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          $ref: '#/components/responses/IntegrationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/kb/documents/manual:
    post:
      tags: [kb]
      operationId: createManualKbDocument
      summary: 'Добавить документ базы знаний вручную (Markdown)'
      description: >-
        CRM `POST /kb/documents/manual`. Раздел `admin` — полный. Текст без заголовка получает заголовок из названия; формат
        front matter ручной ввод не проверяет. `gap_id` закрывает пробел базы знаний созданным документом.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KbManualDocumentIn'
      responses:
        '201':
          description: Документ создан, индексация поставлена в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedId'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          $ref: '#/components/responses/IntegrationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/kb/documents/{id}:
    get:
      tags: [kb]
      operationId: getKbDocument
      summary: 'Документ базы знаний'
      parameters:
        - $ref: '#/components/parameters/KbDocumentId'
      responses:
        '200':
          description: Документ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbDocument'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'
    patch:
      tags: [kb]
      operationId: updateKbDocument
      summary: 'Включить или выключить документ, сменить продукт или название'
      description: >-
        CRM `PATCH /kb/documents/{id}`. Раздел `admin` — полный. Удаления документов в CRM нет: «Выключить» убирает документ из
        поиска бота, «Включить» возвращает (разрыв в `docs/QUESTIONS.md`).
      parameters:
        - $ref: '#/components/parameters/KbDocumentId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KbDocumentPatch'
      responses:
        '200':
          description: Сохранено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOk'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/kb/documents/{id}/chunks:
    get:
      tags: [kb]
      operationId: listKbChunks
      summary: 'Фрагменты документа — как их видит поиск бота'
      parameters:
        - $ref: '#/components/parameters/KbDocumentId'
      responses:
        '200':
          description: Фрагменты по порядку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbChunkList'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/kb/documents/{id}/reingest:
    post:
      tags: [kb]
      operationId: reingestKbDocument
      summary: 'Переиндексировать документ'
      description: >-
        CRM `POST /kb/documents/{id}/reingest`. Раздел `admin` — полный. Документ, который сейчас индексируется или уже
        стоит в очереди на индексацию, — 409 `CONFLICT` с `details.reason = document_indexing`.
      parameters:
        - $ref: '#/components/parameters/KbDocumentId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Поставлен в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOk'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CONFLICT` — `details.reason = document_indexing`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/kb/search:
    post:
      tags: [kb]
      operationId: searchKb
      summary: 'Что найдёт бот на этот вопрос'
      description: >-
        CRM `POST /kb/search`: тот же поиск и порог, что у диалогового агента; ничего не меняет и не пишет в расходы
        (поиск по векторам и словам без вызова модели ответа). Шлюз моделей отказал (нет ключа эмбеддингов, модель
        недоступна) — 422 `VALIDATION_FAILED` с `details.reason = model_key_required`; шлюз не отвечает по сети — 502
        `INTEGRATION_FAILED` с `details.reason = litellm_unavailable`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KbSearchIn'
      responses:
        '200':
          description: Найденные фрагменты и уверенность
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbSearchResult'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          $ref: '#/components/responses/IntegrationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/kb/gaps:
    get:
      tags: [kb]
      operationId: listKbGaps
      summary: 'Пробелы базы знаний: вопросы, на которые бот не нашёл ответа'
      description: CRM `GET /kb/gaps`. По умолчанию — открытые, чаще повторяющиеся не выше, страницами.
      parameters:
        - name: status
          in: query
          required: false
          schema: {$ref: '#/components/schemas/KbGapStatus'}
        - name: language
          in: query
          required: false
          schema: {$ref: '#/components/schemas/Language'}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Страница пробелов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbGapPage'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/kb/gaps/{id}/resolve:
    post:
      tags: [kb]
      operationId: resolveKbGap
      summary: 'Закрыть пробел: ответ есть в документе'
      description: CRM `POST /kb/gaps/{id}/resolve`. Раздел `admin` — полный. Привязывает пробел к документу и закрывает его.
      parameters:
        - $ref: '#/components/parameters/KbGapId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KbGapResolveIn'
      responses:
        '200':
          description: Пробел закрыт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOk'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/kb/gaps/{id}/ignore:
    post:
      tags: [kb]
      operationId: ignoreKbGap
      summary: 'Игнорировать пробел'
      description: CRM `POST /kb/gaps/{id}/ignore`. Раздел `admin` — полный. Вопрос уходит из открытых; вернуть его можно.
      parameters:
        - $ref: '#/components/parameters/KbGapId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Пробел скрыт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOk'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/kb/gaps/{id}/reopen:
    post:
      tags: [kb]
      operationId: reopenKbGap
      summary: 'Вернуть пробел в открытые'
      description: CRM `POST /kb/gaps/{id}/reopen`. Раздел `admin` — полный.
      parameters:
        - $ref: '#/components/parameters/KbGapId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Пробел снова открыт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOk'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/kb/products:
    get:
      tags: [kb]
      operationId: listKbProducts
      summary: 'Справочник продуктов (ключ → название)'
      description: >-
        CRM `GET /kb/products` требует право `leads:read`. У администратора без второй роли его нет: CRM отвечает 403, BFF
        передаёт его как есть, а экран подставляет ключ продукта вручную (разрыв в `docs/QUESTIONS.md`).
      responses:
        '200':
          description: Продукты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbProductList'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/sandbox/messages:
    post:
      tags: [kb]
      operationId: sendSandboxMessage
      summary: 'Песочница: сообщение боту от имени тестового клиента'
      description: >-
        CRM `POST /sandbox/messages`. Раздел `admin` — полный (право CRM `sandbox:use`). Тот же ход, что в Telegram: база знаний,
        тексты, правила передачи; **платно** — вызовы моделей пишутся в «Расходы» с пометкой «тест». Передача менеджеру только
        показывается в `why` и в CRM не создаётся. Таймаут ответа — как у проб (30 с).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxMessageIn'
      responses:
        '200':
          description: Ответ бота и разбор «почему так»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxTurn'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          $ref: '#/components/responses/IntegrationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/sandbox/reset:
    post:
      tags: [kb]
      operationId: resetSandbox
      summary: 'Песочница: начать заново'
      description: CRM `POST /sandbox/reset`. Раздел `admin` — полный. Тестовый диалог сотрудника удаляется целиком.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Диалог очищен
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/bot/settings:
    get:
      tags: [bot]
      operationId: getBotSettings
      summary: 'Настройки бота: значения и схемы разделов'
      description: >-
        CRM `GET /settings`. Раздел `admin` — от чтения (директор видит без правки): компания, рабочие часы, тексты бота, поведение
        бота, поиск по базе знаний, стоп-слова, конкуренты, правила передачи, квалификация, канал команды, бюджет моделей, сделки,
        форма «Запрос», оповещения о сбоях. Ключ раздела и его схема приходят из CRM как есть (JSON Schema Pydantic CRM): экран
        строит форму по схеме, поэтому новый параметр в CRM появляется в Платформе без правки BFF. Профиль бота и коннекторы правятся
        в «Внешних интеграциях» и сюда не входят.
      responses:
        '200':
          description: Значения и схемы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotSettings'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/bot/settings/{key}:
    put:
      tags: [bot]
      operationId: saveBotSetting
      summary: 'Сохранить раздел настроек бота'
      description: >-
        CRM `PUT /settings/{key}`. Раздел `admin` — полный (право CRM `settings:write`). Тело — значения раздела целиком (по схеме из
        `getBotSettings`). CRM проверяет значения своей моделью: ошибка — 422 `VALIDATION_FAILED`, `details.fields = [key]`,
        `details.paths` — пути невалидных полей («greeting.uz»). Неизвестный раздел — 404.
      parameters:
        - name: key
          in: path
          required: true
          description: Ключ раздела (`company`, `business_hours`, `texts`, …)
          schema: {type: string, pattern: '^[a-z_]{1,32}$'}
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Сохранено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOk'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/bot/settings/escalation/dry-run:
    post:
      tags: [bot]
      operationId: dryRunEscalation
      summary: 'Пробный прогон правил передачи на последних диалогах'
      description: >-
        CRM `POST /settings/escalation/dry-run`. Раздел `admin` — полный. Считает, сколько передач менеджеру было бы на последних
        50 диалогах при новых значениях, и какие лиды изменились. Ничего не сохраняет и не меняет.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationSettingsIn'
      responses:
        '200':
          description: Сравнение «сейчас» и «с новыми правилами»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationDryRun'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          $ref: '#/components/responses/IntegrationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/bot/reply-templates:
    get:
      tags: [bot]
      operationId: listReplyTemplates
      summary: 'Шаблоны быстрых ответов'
      description: >-
        CRM `GET /reply-templates`. Читают `admin` от чтения и `crm.leads` полный (менеджеру шаблоны нужны в карточке лида);
        правит `admin` полный.
      responses:
        '200':
          description: Шаблоны по названию; текст на ru, uz, en с подстановками `{name}`, `{manager}`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyTemplateList'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'
    post:
      tags: [bot]
      operationId: createReplyTemplate
      summary: 'Новый шаблон ответа'
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyTemplateIn'
      responses:
        '201':
          description: Шаблон создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedId'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/bot/reply-templates/{id}:
    put:
      tags: [bot]
      operationId: updateReplyTemplate
      summary: 'Изменить шаблон ответа'
      parameters:
        - $ref: '#/components/parameters/ReplyTemplateId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyTemplateIn'
      responses:
        '200':
          description: Сохранено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOk'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'
    delete:
      tags: [bot]
      operationId: deleteReplyTemplate
      summary: 'Удалить шаблон ответа'
      description: Раздел `admin` — полный. Шаблон удаляется без возможности вернуть; в карточках лидов он больше не предлагается.
      parameters:
        - $ref: '#/components/parameters/ReplyTemplateId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionOk'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/bot/exports/{entity}:
    get:
      tags: [bot]
      operationId: downloadCsvExport
      summary: 'Выгрузка CSV: лиды, клиенты или сделки'
      description: >-
        CRM `GET /export/{leads|clients|deals}.csv`. Нужен `admin: full` (право CRM `export:read`) **и** чтение выгружаемых данных:
        лиды — `crm.leads`, клиенты и сделки — `crm.clients` (системная «Администратор» без второй роли бизнес-данные не
        выгружает, R3-D-2). BFF проверяет оба раздела и отдаёт файл потоком, не накапливая его в памяти: CSV для Excel (UTF-8 с BOM,
        разделитель `;`), до 10 000 строк, имя файла с датой в `Content-Disposition` (`leads-20261026-1530.csv`). Каждая выгрузка
        пишется в журнал аудита CRM. Фильтры — как на экранах списков; недопустимый — 422.
      parameters:
        - name: entity
          in: path
          required: true
          schema: {type: string, enum: [leads, clients, deals]}
        - name: q
          in: query
          required: false
          description: 'Поиск (лиды, клиенты), до 100 символов'
          schema: {type: string, maxLength: 100}
        - name: stage
          in: query
          required: false
          description: 'Стадия: у сделок `open`, `won`, `lost`; у лидов — код стадии CRM'
          schema: {type: string, maxLength: 32}
        - name: language
          in: query
          required: false
          description: Лиды — язык
          schema: {$ref: '#/components/schemas/Language'}
        - name: created_from
          in: query
          required: false
          description: Лиды — созданы не раньше (дата-время)
          schema: {type: string, format: date-time}
        - name: created_to
          in: query
          required: false
          description: Лиды — созданы не позже (дата-время)
          schema: {type: string, format: date-time}
        - name: closed_from
          in: query
          required: false
          description: Сделки — закрыты не раньше
          schema: {type: string, format: date}
        - name: closed_to
          in: query
          required: false
          description: Сделки — закрыты не позже
          schema: {type: string, format: date}
      responses:
        '200':
          description: Файл CSV
          headers:
            Content-Disposition:
              description: '`attachment; filename="leads-20261026-1530.csv"`'
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

components:
  securitySchemes:
    platformSession:
      type: apiKey
      in: cookie
      name: rt_pf_session

  parameters:
    EmployeeId:
      name: id
      in: path
      required: true
      description: '`crm_user_id` — число без ведущих нулей (`07` и `007` — не адрес сотрудника)'
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
    RoleIdPath:
      name: id
      in: path
      required: true
      description: Id роли Платформы (CRM)
      schema:
        $ref: '#/components/schemas/RoleId'
    RoleQuery:
      name: role
      in: query
      required: false
      description: Только по этой роли сотрудника (id); чужая роль — 403
      schema:
        $ref: '#/components/schemas/RoleId'
    PageLimit:
      name: limit
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageOffset:
      name: offset
      in: query
      required: false
      description: Сколько записей пропустить
      schema:
        type: integer
        minimum: 0
        default: 0
    BusDomainQuery:
      name: domain
      in: query
      required: false
      description: Только этот домен (по умолчанию — все три)
      schema:
        $ref: '#/components/schemas/BusDomain'
    BusDomainPath:
      name: domain
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BusDomain'
    BusSubscriberQuery:
      name: subscriber
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BusSubscriberName'
    BusTypeQuery:
      name: type
      in: query
      required: false
      description: Подстрока типа события (`quote.`, `client.updated`)
      schema: {type: string, minLength: 1, maxLength: 200}
    BusCursor:
      name: cursor
      in: query
      required: false
      description: Непрозрачный курсор из `next_cursor`
      schema: {type: string, maxLength: 2000}
    BusLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    EdsIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Ключ повтора создания (8–128 знаков, на экземпляр формы и тело запроса); EDS хранит его 24 часа
      schema: {type: string, minLength: 8, maxLength: 128}
    EdsDocumentId:
      name: id
      in: path
      required: true
      description: Id документа EDS (UUID); номер `СЗ-2026/031` содержит «/» и в адресе не используется
      schema: {type: string, format: uuid}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Значение cookie `rt_pf_csrf`
      schema:
        type: string
        minLength: 16
    KbDocumentId:
      name: id
      in: path
      required: true
      description: Id документа базы знаний (CRM)
      schema:
        type: integer
        minimum: 1
    KbGapId:
      name: id
      in: path
      required: true
      description: Id пробела базы знаний (CRM)
      schema:
        type: integer
        minimum: 1
    ReplyTemplateId:
      name: id
      in: path
      required: true
      description: Id шаблона ответа (CRM)
      schema:
        type: integer
        minimum: 1

    CompanyItemId:
      name: id
      in: path
      required: true
      description: Id объекта ERP (строкой)
      schema:
        $ref: '#/components/schemas/CompanyItemRef'
    ReferenceKindPath:
      name: kind
      in: path
      required: true
      description: Справочник ERP
      schema:
        $ref: '#/components/schemas/ReferenceKind'

  responses:
    SessionExpired:
      description: '`SESSION_EXPIRED` — сессии нет, истекла или сотрудник отключён'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CsrfFailed:
      description: '`CSRF_FAILED`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`FORBIDDEN` — раздел или действие не положены ролям сотрудника'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: '`VALIDATION_FAILED` — `details.fields` перечисляет поля'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: '`TOO_MANY_REQUESTS`'
      headers:
        Retry-After:
          description: Секунды до повтора
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    EdsConflict:
      description: >-
        409 `CONFLICT` — документ не в том статусе для действия (`details.reason = invalid_state`) или объект изменился
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EdsPayloadTooLarge:
      description: '413 `PAYLOAD_TOO_LARGE` — файл больше 25 МБ (`details.max_bytes`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EdsUnsupportedMedia:
      description: '415 `UNSUPPORTED_MEDIA_TYPE` — допустимы PDF, изображения и документы Office'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    IntegrationConflict:
      description: >-
        409: `NOT_CONFIGURED` (коннектор или сервис не настроен), `SECRETS_KEY_MISSING` (на сервере нет ключа шифрования),
        `SERVICE_NOT_SWITCHABLE` (у сервиса нет выключателя), `CONFLICT` (состояние не позволяет действие); код CRM — в `details.reason`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IntegrationInvalid:
      description: >-
        422: `WRONG_PASSWORD` — пароль администратора неверен; `VALIDATION_FAILED` — поле не принято (`details.fields`,
        `details.reason`: `erp_invalid_url`, `erp_pairing_code_invalid`, `smtp_invalid_host`, `invalid_bot_token`, `ai_spend_period`, …)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AccountLocked:
      description: '`ACCOUNT_LOCKED` — после неверных паролей CRM временно блокирует учётную запись'
      headers:
        Retry-After:
          description: Секунды до повтора
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IntegrationFailed:
      description: >-
        502 `INTEGRATION_FAILED` — CRM не достучалась до внешнего сервиса (ERP, SMTP, Telegram, LiteLLM) или он отказал; причина —
        `details.reason` (`erp_unavailable`, `smtp_auth_failed`, `litellm_unavailable`, …)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BackendUnavailable:
      description: '`BACKEND_UNAVAILABLE` — CRM не ответила за таймаут'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, source]
      properties:
        code:
          type: string
          description: Стабильный код (`INVALID_CREDENTIALS`, `SESSION_EXPIRED`, `CSRF_FAILED`, `FORBIDDEN`, `NOT_FOUND`, `VALIDATION_FAILED`, `TOO_MANY_REQUESTS`, `BACKEND_UNAVAILABLE`, `NO_PLATFORM_ROLE`, `USER_DISABLED`, `ACCOUNT_LOCKED`, `CONFLICT`, `WRONG_PASSWORD`, `EMAIL_EXISTS`, `LAST_ADMIN`, `LAST_DIRECTOR`, `ROLE_IN_USE`, `ROLE_SYSTEM`, `ROLES_REQUIRED`, `NOT_CONFIGURED`, `SECRETS_KEY_MISSING`, `SERVICE_NOT_SWITCHABLE`, `INTEGRATION_FAILED`, `PAYLOAD_TOO_LARGE`, `UNSUPPORTED_MEDIA_TYPE`, `COMPANY_NOT_SET`, `SETUP_DONE`, `SETUP_CODE_INVALID`, `SETUP_CODE_EXPIRED`, `SETUP_LOCKED`, `OWN_COMPANY_ALREADY_EXISTS`, `ERP_NOT_CONNECTED`, `INTERNAL_ERROR`, `BAD_REQUEST`, `METHOD_NOT_ALLOWED`, `HTTP_<статус>`)
          examples: [SESSION_EXPIRED]
        message:
          type: string
          description: Текст для сотрудника на его языке
        source:
          type: string
          enum: [bff, crm, erp, eds]
        details:
          type: object
          description: Код и тело ошибки бэкенда, поля валидации — для разбора, не для показа
          additionalProperties: true

    BusDomain:
      type: string
      enum: [crm, erp, eds]
      description: Домен-издатель журнала шины
    BusSourceState:
      type: string
      enum: [ok, unavailable, forbidden, not_applicable]
      description: >-
        `unavailable` — домен не ответил (сеть, таймаут, 5xx); `forbidden` — домен отказал в праве (например, права ещё не
        дошли до EDS); `not_applicable` — у сотрудника нет доступа к домену или домен вне фильтра
    BusSources:
      type: object
      additionalProperties: false
      required: [crm, erp, eds]
      properties:
        crm: {$ref: '#/components/schemas/BusSourceState'}
        erp: {$ref: '#/components/schemas/BusSourceState'}
        eds: {$ref: '#/components/schemas/BusSourceState'}
    BusSubscriberName:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,63}$'
      description: Имя подписчика шины (`crm`, `erp`, `eds`, `platform-bff`)
    BusDeliveryStatus:
      type: string
      enum: [pending, in_flight, delivered, dead]
      description: '`pending` — ждёт отправки или повтора, `in_flight` — отправляется, `delivered` — доставлено, `dead` — DLQ'
    BusInboxStatus:
      type: string
      enum: [received, processed, failed, skipped]
    BusSubscriberState:
      type: string
      enum: [ok, failing, paused, dead_letters, disabled, removed]
      description: >-
        Состояние словом (по порядку важности): `removed` — подписчика нет в файле подписок, остались доставки; `disabled` —
        выключен (`enabled: false`), события копятся; `paused` — пауза предохранителя до `paused_until`; `dead_letters` — есть
        доставки в DLQ; `failing` — ошибки подряд ниже порога предохранителя; `ok` — работает
    BusSubscriber:
      type: object
      additionalProperties: false
      required: [name, state, configured, enabled, drop, endpoint, pending, in_flight, dead, oldest_undelivered_age_seconds,
                 consecutive_failures, paused_until, last_failure_at, last_success_at, last_error]
      properties:
        name: {type: string}
        state: {$ref: '#/components/schemas/BusSubscriberState'}
        configured: {type: boolean}
        enabled: {type: boolean}
        drop: {type: boolean, description: 'Выключен с `drop: true` — события за время остановки не копятся'}
        endpoint: {type: [string, 'null'], description: 'Адрес приёмника: только схема, хост, порт и путь'}
        pending: {type: integer}
        in_flight: {type: integer}
        dead: {type: integer}
        oldest_undelivered_age_seconds: {type: [number, 'null'], description: Возраст самого старого недоставленного (без DLQ)}
        consecutive_failures: {type: integer}
        paused_until: {type: [string, 'null'], format: date-time}
        last_failure_at: {type: [string, 'null'], format: date-time}
        last_success_at: {type: [string, 'null'], format: date-time}
        last_error: {type: [string, 'null']}
    BusDomainOverview:
      type: object
      additionalProperties: false
      required: [domain, outbox_pending, oldest_undelivered_age_seconds, dlq_size, inbox_received, inbox_retrying,
                 inbox_failed, subscribers]
      properties:
        domain: {$ref: '#/components/schemas/BusDomain'}
        outbox_pending: {type: integer, description: События ещё не разложены по подписчикам}
        oldest_undelivered_age_seconds: {type: [number, 'null']}
        dlq_size: {type: integer}
        inbox_received: {type: integer, description: Принятые события ждут обработки}
        inbox_retrying: {type: integer, description: 'Из них ждут автоповтора после ошибки'}
        inbox_failed: {type: integer}
        subscribers:
          type: array
          items: {$ref: '#/components/schemas/BusSubscriber'}
    BusJournal:
      type: object
      additionalProperties: false
      required: [domains, sources]
      properties:
        domains:
          type: array
          items: {$ref: '#/components/schemas/BusDomainOverview'}
        sources: {$ref: '#/components/schemas/BusSources'}
    BusDelivery:
      type: object
      additionalProperties: false
      required: [domain, id, event_id, event_type, subscriber, status, attempts, next_attempt_at, last_attempt_at,
                 last_status_code, last_error, delivered_at, created_at, subject, correlation_id]
      description: Метаданные доставки; тела события нет.
      properties:
        domain: {$ref: '#/components/schemas/BusDomain'}
        id: {type: integer}
        event_id: {type: string, format: uuid}
        event_type: {type: string}
        subscriber: {type: string}
        status: {$ref: '#/components/schemas/BusDeliveryStatus'}
        attempts: {type: integer}
        next_attempt_at: {type: [string, 'null'], format: date-time}
        last_attempt_at: {type: [string, 'null'], format: date-time}
        last_status_code: {type: [integer, 'null']}
        last_error: {type: [string, 'null']}
        delivered_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        subject: {type: [string, 'null']}
        correlation_id: {type: [string, 'null']}
    BusDeliveryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, sources]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/BusDelivery'}
        next_cursor: {type: [string, 'null']}
        sources: {$ref: '#/components/schemas/BusSources'}
    BusInboxEntry:
      type: object
      additionalProperties: false
      required: [domain, event_id, type, publisher, subject, correlation_id, status, attempts, error, received_at,
                 processed_at]
      description: Принятое доменом событие (метаданные; тела нет).
      properties:
        domain: {$ref: '#/components/schemas/BusDomain'}
        event_id: {type: string, format: uuid}
        type: {type: string}
        publisher: {type: string}
        subject: {type: [string, 'null']}
        correlation_id: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/BusInboxStatus'}
        attempts: {type: integer}
        error: {type: [string, 'null']}
        received_at: {type: string, format: date-time}
        processed_at: {type: [string, 'null'], format: date-time}
    BusInboxPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, sources]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/BusInboxEntry'}
        next_cursor: {type: [string, 'null']}
        sources: {$ref: '#/components/schemas/BusSources'}
    BusRetryDeadIn:
      type: object
      additionalProperties: false
      required: [subscriber]
      properties:
        subscriber: {$ref: '#/components/schemas/BusSubscriberName'}
    BusRetryResult:
      type: object
      additionalProperties: false
      required: [retried]
      properties:
        retried: {type: integer, minimum: 0, description: 'Сколько поставлено на повтор; 0 — повторять нечего'}

    SourceState:
      type: string
      enum: [ok, unavailable, not_applicable]
      description: '`not_applicable` — у сотрудника нет доступа к этому бэкенду'

    Sources:
      type: object
      additionalProperties: false
      required: [crm, erp]
      properties:
        crm:
          $ref: '#/components/schemas/SourceState'
        erp:
          $ref: '#/components/schemas/SourceState'

    RoleId:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Id роли Платформы в CRM (роли — данные, ADR-0012)
      examples: ['3']

    RoleRef:
      type: object
      additionalProperties: false
      required: [id, name, system]
      properties:
        id:
          $ref: '#/components/schemas/RoleId'
        name:
          type: string
          description: Название роли — данные (его задаёт администратор); интерфейс показывает его как есть
        system:
          type: boolean
          description: Системная роль («Администратор», «Директор») — неизменна, не удаляется
        code:
          type: string
          description: >-
            Код системной роли (`ADMIN`, `DIRECTOR`) или шаблона, из которого создана роль при первом запуске (`tpl:MANAGER`);
            у созданных администратором — нет. Интерфейс на коды не опирается, кроме двух системных.

    ResourceAccess:
      type: object
      description: Раздел каталога `platform-rbac.yaml` → уровень; скрытые разделы не перечисляются
      additionalProperties:
        $ref: '#/components/schemas/AccessLevel'

    RestrictedField:
      type: string
      enum: [cost_margin, supplier_prices, totals_only]
      description: Поле с ограничением каталога (`restricted_fields`); роль перечисляет поля, которые она видит

    Role:
      type: object
      additionalProperties: false
      required: [id, name, description, system, version, access, restricted_fields, employees, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/RoleId'
        name:
          type: string
        description:
          type: string
        system:
          type: boolean
        code:
          type: string
          description: Как в `RoleRef.code`
        version:
          type: integer
          minimum: 1
          description: Растёт при каждом изменении роли; `RoleUpdate.version` присылает прочитанную (0.4.0)
        access:
          $ref: '#/components/schemas/ResourceAccess'
        restricted_fields:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RestrictedField'
        employees:
          type: integer
          minimum: 0
          description: Сколько сотрудников имеют роль
        updated_at:
          type: string
          format: date-time

    RoleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    RoleSnapshot:
      type: object
      additionalProperties: false
      description: Содержимое роли на момент записи аудита CRM
      required: [name, description, access, restricted_fields]
      properties:
        name:
          type: string
        description:
          type: string
        access:
          $ref: '#/components/schemas/ResourceAccess'
        restricted_fields:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedField'

    RoleChange:
      type: object
      additionalProperties: false
      description: Одно изменение роли. `create` — только `after`, `delete` — только `before`, `update` — оба.
      required: [id, at, action]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        action:
          type: string
          enum: [create, update, delete]
        actor_id:
          type: string
          description: Кто изменил (`crm_user_id`); нет — автор неизвестен (система или удалённый пользователь)
        actor_name:
          type: string
        before:
          $ref: '#/components/schemas/RoleSnapshot'
        after:
          $ref: '#/components/schemas/RoleSnapshot'

    RoleJournal:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleChange'
        total:
          type: integer
          minimum: 0

    AuditActorType:
      type: string
      enum: [user, system, bot]

    AuditEntry:
      type: object
      additionalProperties: false
      description: Запись аудита CRM. `action` и `entity_type` — коды CRM (`user.update`, `platform_role`); слова к ним даёт SPA по языку сотрудника.
      required: [id, at, actor_type, action, entity_type]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        actor_type:
          $ref: '#/components/schemas/AuditActorType'
        actor_id:
          type: string
        actor_name:
          type: string
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        before:
          type: object
          additionalProperties: true
          description: Значения до изменения; секретные поля заменены на `***`
        after:
          type: object
          additionalProperties: true
          description: Значения после изменения; секретные поля заменены на `***`
        ip:
          type: string

    AuditPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        total:
          type: integer
          minimum: 0
          description: Записей по фильтрам всего
        limit:
          type: integer
        offset:
          type: integer

    NotificationSettings:
      type: object
      additionalProperties: false
      description: Личные уведомления сотрудника от бота (профиль)
      required: [telegram_linked, notify_leads, notify_system]
      properties:
        telegram_linked:
          type: boolean
          description: Telegram привязан; без него подписки не работают и пробное сообщение не отправить
        notify_leads:
          type: boolean
          description: Сообщать боту, когда лид ждёт сотрудника
        notify_system:
          type: boolean
          description: Системные оповещения (мониторинг, сбои) — администратору
        delivery_failed_at:
          type: string
          format: date-time
          description: Когда последний раз личное сообщение бота не дошло; нет — доставка исправна

    NotificationSettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        notify_leads:
          type: boolean
        notify_system:
          type: boolean

    RoleCreate:
      type: object
      additionalProperties: false
      required: [name, access, restricted_fields]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        access:
          $ref: '#/components/schemas/ResourceAccess'
        restricted_fields:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RestrictedField'

    RoleUpdate:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 1
      properties:
        version:
          type: integer
          minimum: 1
          description: Версия роли, которую видел клиент (`Role.version`); при расхождении — 409 `role_version_conflict`
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        access:
          $ref: '#/components/schemas/ResourceAccess'
        restricted_fields:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RestrictedField'

    RolePreviewIn:
      type: object
      additionalProperties: false
      properties:
        role_id:
          $ref: '#/components/schemas/RoleId'
        access:
          $ref: '#/components/schemas/ResourceAccess'
        restricted_fields:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RestrictedField'

    SectionLevel:
      type: object
      additionalProperties: false
      required: [resource, level]
      properties:
        resource:
          type: string
          description: Раздел каталога
        level:
          $ref: '#/components/schemas/AccessLevel'

    RoleImpact:
      type: object
      additionalProperties: false
      required: [employee, gained, lost, fields_gained, fields_lost]
      properties:
        employee:
          $ref: '#/components/schemas/PersonRef'
        gained:
          type: array
          description: Разделы, которые появятся или станут полными (уровень «после»)
          items:
            $ref: '#/components/schemas/SectionLevel'
        lost:
          type: array
          description: Разделы, которые пропадут или станут только для чтения (уровень «до»)
          items:
            $ref: '#/components/schemas/SectionLevel'
        fields_gained:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedField'
        fields_lost:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedField'

    RolePreview:
      type: object
      additionalProperties: false
      required: [employees_total, employees, gained, lost, fields_gained, fields_lost]
      properties:
        role_id:
          oneOf:
            - $ref: '#/components/schemas/RoleId'
            - type: 'null'
        employees_total:
          type: integer
          minimum: 0
          description: Сколько сотрудников имеют роль (у черновика новой роли — 0)
        employees:
          type: array
          description: Только сотрудники, у которых права изменятся
          items:
            $ref: '#/components/schemas/RoleImpact'
        gained:
          type: array
          items:
            $ref: '#/components/schemas/SectionLevel'
        lost:
          type: array
          items:
            $ref: '#/components/schemas/SectionLevel'
        fields_gained:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedField'
        fields_lost:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedField'

    IntegrationCardKey:
      type: string
      enum: [erp, telegram, mail, services, models, spend, storage, system]
      description: >-
        Карточки экрана «Внешние интеграции» в порядке показа: ERP, Telegram, Почта, Внешние сервисы, Модели ИИ, Расходы,
        Хранилище и бэкапы, Состояние системы.

    IntegrationStatus:
      type: string
      enum: [ok, warn, fail, unknown, 'off']
      description: >-
        Статус пятью уровнями — уровни реестра внешних сервисов CRM (ADR-0024 CRM): `ok` работает, `warn` внимание, `fail`
        сбой, `unknown` нет данных, `off` не подключён или не применимо. Интерфейс всегда показывает слово, не только цвет.

    IntegrationAccess:
      type: string
      enum: [ok, forbidden, unavailable]
      description: >-
        Данные карточки получены (`ok`), CRM отказала ролям сотрудника (`forbidden`, например у директора нет моделей и
        бэкапов) или не ответила (`unavailable`). Статус `unknown` у карточки без данных.

    IntegrationNote:
      type: string
      enum: [all_ok, problems, not_configured, paused, rotation_pending, backup_stale, no_backups, bot_not_running, budget_near, budget_over, no_data]
      description: >-
        Короткая пометка карточки — машинный код, фраза на языке сотрудника собирается в интерфейсе. `count` — сколько
        сервисов или алиасов с проблемой; `amount_usd` — расход за сегодня.

    IntegrationCard:
      type: object
      additionalProperties: false
      required: [key, status, access, note, count, amount_usd, last_activity_at]
      properties:
        key: {$ref: '#/components/schemas/IntegrationCardKey'}
        status: {$ref: '#/components/schemas/IntegrationStatus'}
        access: {$ref: '#/components/schemas/IntegrationAccess'}
        note: {$ref: '#/components/schemas/IntegrationNote'}
        count: {type: [integer, 'null']}
        amount_usd: {type: [number, 'null']}
        last_activity_at:
          type: [string, 'null']
          format: date-time
          description: Последняя проверка или событие карточки; `null` — данных нет

    AttentionKind:
      type: string
      enum: [not_configured, service, model_problem, backup_stale, component, budget_over, budget_near, rotation_pending, paused, bot_not_running]

    AttentionItem:
      type: object
      additionalProperties: false
      required: [id, card, severity, kind, subject, detail]
      properties:
        id: {type: string, description: 'Стабильный ключ строки (`service:telegram`, `model:dialog-model`, `setup:erp`)'}
        card: {$ref: '#/components/schemas/IntegrationCardKey'}
        severity:
          type: string
          enum: [fail, warn, setup]
          description: '`fail` сбой, `warn` внимание, `setup` ещё не подключено'
        kind: {$ref: '#/components/schemas/AttentionKind'}
        subject:
          type: [string, 'null']
          description: Название сервиса, алиаса или компонента — данные CRM, показываются как есть
        detail:
          type: [string, 'null']
          description: Итог проверки и подсказка «что сделать» от CRM (текст CRM, на русском)

    IntegrationsOverview:
      type: object
      additionalProperties: false
      required: [checked_at, cards, attention]
      properties:
        checked_at: {type: string, format: date-time}
        cards:
          type: array
          items: {$ref: '#/components/schemas/IntegrationCard'}
        attention:
          type: array
          description: '«Требует внимания»: сначала сбои, затем предупреждения, затем неподключённое'
          items: {$ref: '#/components/schemas/AttentionItem'}

    PasswordConfirm:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 256
          description: Пароль администратора (повторный ввод); уходит только в CRM, нигде не сохраняется и не пишется в журнал

    ErpPairIn:
      type: object
      additionalProperties: false
      required: [base_url, password]
      properties:
        base_url: {type: string, minLength: 1, maxLength: 500, description: Адрес ERP}
        code:
          type: [string, 'null']
          format: password
          writeOnly: true
          maxLength: 64
          description: Одноразовый код из настроек ERP; без него — сопряжение без кода (если ERP его разрешает)
        password: {type: string, format: password, writeOnly: true, minLength: 1, maxLength: 256}

    TelegramTokenIn:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: {type: string, format: password, writeOnly: true, minLength: 20, maxLength: 128}
        password: {type: string, format: password, writeOnly: true, minLength: 1, maxLength: 256}

    SmtpSettingsIn:
      type: object
      additionalProperties: false
      required: [host, password]
      properties:
        host: {type: string, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535, default: 587}
        security: {type: string, enum: [starttls, ssl, none], default: starttls}
        from_email: {type: string, maxLength: 255, default: ''}
        from_name: {type: string, maxLength: 120, default: ''}
        username: {type: [string, 'null'], maxLength: 255, description: '`null` — оставить прежний логин'}
        smtp_password:
          type: [string, 'null']
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 512
          description: Пароль SMTP; `null` — оставить прежний
        password: {type: string, format: password, writeOnly: true, minLength: 1, maxLength: 256, description: Пароль администратора}

    ServiceSwitchIn:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, format: password, writeOnly: true, minLength: 1, maxLength: 256}
        reason: {type: [string, 'null'], maxLength: 200, description: Причина — попадает в аудит}

    AiModelChangeIn:
      type: object
      additionalProperties: false
      required: [provider, model, password]
      properties:
        provider: {type: string, enum: [anthropic, gemini, openai]}
        model: {type: string, minLength: 1, maxLength: 128}
        api_key:
          type: [string, 'null']
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 512
          description: Ключ провайдера; `null` — ключ из настроек сервера
        api_base: {type: [string, 'null'], maxLength: 256}
        password: {type: string, format: password, writeOnly: true, minLength: 1, maxLength: 256}

    TelegramChannelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TelegramChannel'}

    MailLog:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MailLogItem'}

    AiModelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AiModel'}

    ExternalServiceList:
      type: object
      additionalProperties: false
      required: [checked_at, summary, items]
      properties:
        checked_at: {type: [string, 'null'], format: date-time}
        summary: {$ref: '#/components/schemas/ServicesSummary'}
        items:
          type: array
          items: {$ref: '#/components/schemas/ExternalService'}

    ErpConnector:
      description: 'Коннектор ERP (CRM `GET /integrations/erp`). Значения токенов не возвращаются — только «задан» и последние 4 символа (`*_last4`).'
      properties:
        base_url: {type: string}
        configured: {type: boolean}
        mode: {enum: [local, erp], type: string}
        paired: {type: boolean}
        previous_secret_until: {format: date-time, type: [string, 'null']}
        rotation_pending: {type: boolean}
        secrets_enabled: {type: boolean}
        suggested_base_url: {type: string}
        token_configured: {type: boolean}
        token_last4: {type: [string, 'null']}
        token_updated_at: {format: date-time, type: [string, 'null']}
        webhook_secret_configured: {type: boolean}
        webhook_secret_last4: {type: [string, 'null']}
      required: [base_url, configured, mode, paired, previous_secret_until, rotation_pending, secrets_enabled, suggested_base_url,
        token_configured, token_last4, token_updated_at, webhook_secret_configured, webhook_secret_last4]
      type: object
      additionalProperties: false
    ErpCheck:
      description: 'Итог «Проверить связь» с ERP. `rate_limited` — ERP ответила лимитом частоты сервисного токена: это статус, не ошибка; `retry_after_s` — через сколько секунд повторить.'
      properties:
        checked_at: {format: date-time, type: string}
        latency_ms: {type: [integer, 'null']}
        migrations_applied: {type: [boolean, 'null']}
        queue_alive: {type: [boolean, 'null']}
        retry_after_s: {type: [integer, 'null']}
        status: {enum: [ok, degraded, rate_limited], type: string}
        version: {type: [string, 'null']}
      required: [checked_at, latency_ms, migrations_applied, queue_alive, retry_after_s, status, version]
      type: object
      additionalProperties: false
    ErpPairing:
      description: 'Итог сопряжения или ротации: состояние коннектора и проверка связи сразу после. Сопряжение удалось, даже если проверка не прошла: тогда `check = null`, а `check_error` — подкод причины (`erp_unauthorized`, `erp_unavailable`, …).'
      properties: {check: {anyOf: [{$ref: '#/components/schemas/ErpCheck'}, {type: 'null'}]}, check_error: {type: [string, 'null']},
        status: {$ref: '#/components/schemas/ErpConnector'}}
      required: [check, check_error, status]
      type: object
      additionalProperties: false
    TelegramConnector:
      description: 'Telegram-бот и канал команды. Значение токена не попадает сюда никогда — только `configured` и `last4`.'
      properties:
        channel_id: {type: [integer, 'null']}
        channel_title: {type: [string, 'null']}
        configured: {type: boolean}
        last4: {type: [string, 'null']}
        last_error: {type: [string, 'null']}
        mode: {type: string}
        running: {type: boolean}
        secrets_enabled: {type: boolean}
        updated_at: {format: date-time, type: [string, 'null']}
        username: {type: [string, 'null']}
      required: [channel_id, channel_title, configured, last4, last_error, mode, running, secrets_enabled, updated_at, username]
      type: object
      additionalProperties: false
    TelegramChannel:
      description: 'Чат, куда добавлен бот и откуда он получил сообщение: кандидат в канал команды.'
      properties: {chat_id: {type: integer}, chat_type: {type: string}, detected_at: {format: date-time, type: string}, title: {
          type: string}}
      required: [chat_id, chat_type, detected_at, title]
      type: object
      additionalProperties: false
    BotProfileState:
      description: 'Профиль бота и итог последней публикации в Telegram.'
      properties: {profile: {$ref: '#/components/schemas/BotProfile'}, published: {anyOf: [{$ref: '#/components/schemas/BotProfilePublish'},
            {type: 'null'}]}}
      required: [profile, published]
      type: object
      additionalProperties: false
    BotProfile:
      description: 'Имя и описания бота на трёх языках.'
      additionalProperties: false
      properties:
        description:
          $ref: '#/components/schemas/LocalizedText'
          description: «Что умеет этот бот?» — видно до /start, до 512 символов
        name:
          $ref: '#/components/schemas/LocalizedText'
          description: Имя бота в Telegram, до 64 символов
        short_description:
          $ref: '#/components/schemas/LocalizedText'
          description: Краткое описание в профиле бота и при пересылке, до 120 символов
      type: object
      required: [description, name, short_description]
    LocalizedText:
      additionalProperties: false
      properties: {en: {type: string}, ru: {type: string}, uz: {type: string}}
      required: [en, ru, uz]
      type: object
    BotProfilePublish:
      description: 'Итог последней публикации профиля в Telegram; `error` — код, текст — в интерфейсе.'
      properties: {at: {format: date-time, type: string}, changed: {type: integer}, error: {enum: [rate_limited, telegram_error,
            bot_not_running, null], type: [string, 'null']}, ok: {type: boolean}, retry_after: {type: [integer, 'null']}}
      required: [at, changed, error, ok, retry_after]
      type: object
      additionalProperties: false
    ActionOk:
      description: 'Действие выполнено.'
      properties: {id: {type: [integer, 'null']}, ok: {const: true, type: boolean}}
      type: object
      required: [id, ok]
      additionalProperties: false
    SmtpConnector:
      description: 'Коннектор «Почта» (один SMTP на ансамбль). Пароль не возвращается — только «задан» и `last4`.'
      properties:
        configured: {type: boolean}
        from_email: {type: string}
        from_name: {type: string}
        host: {type: string}
        password_configured: {type: boolean}
        password_last4: {type: [string, 'null']}
        password_updated_at: {format: date-time, type: [string, 'null']}
        port: {type: integer}
        secrets_enabled: {type: boolean}
        security: {enum: [starttls, ssl, none], type: string}
        username: {type: string}
      required: [configured, from_email, from_name, host, password_configured, password_last4, password_updated_at, port, secrets_enabled,
        security, username]
      type: object
      additionalProperties: false
    SmtpCheck:
      description: 'Итог проверки связи с почтовым релеем: приветствие сервера, выполнен ли вход, время ответа.'
      properties: {authenticated: {type: boolean}, latency_ms: {type: integer}, server: {type: string}}
      required: [authenticated, latency_ms, server]
      type: object
      additionalProperties: false
    MailLogItem:
      description: 'Строка журнала писем сотрудникам; тела письма (временного пароля) в журнале нет.'
      properties:
        attempts: {type: integer}
        created_at: {format: date-time, type: string}
        error: {type: [string, 'null']}
        id: {type: integer}
        sent_at: {format: date-time, type: [string, 'null']}
        status: {enum: [queued, sent, failed, skipped_no_smtp], type: string}
        subject: {type: string}
        template: {type: string}
        to_email: {type: string}
      required: [attempts, created_at, error, id, sent_at, status, subject, template, to_email]
      type: object
      additionalProperties: false
    MailQueued:
      description: 'Письмо поставлено в очередь: номер строки журнала, адрес получателя, статус.'
      properties: {email_log_id: {type: integer}, status: {enum: [queued, sent, failed, skipped_no_smtp], type: string}, to_email: {
          type: string}}
      required: [email_log_id, status, to_email]
      type: object
      additionalProperties: false
    ServicesSummary:
      description: 'Сколько сервисов реестра в каждом статусе; `disabled` — выключены вручную.'
      properties:
        disabled: {type: integer}
        fail: {type: integer}
        'off': {type: integer}
        ok: {type: integer}
        unknown: {type: integer}
        warn: {type: integer}
      required: [disabled, fail, 'off', ok, unknown, warn]
      type: object
      additionalProperties: false
    ExternalService:
      description: 'Внешний сервис реестра CRM (ADR-0024 CRM): статус из последней проверки, подсказка «что сделать», выключатель.'
      properties:
        check:
          description: Как проверяется — словами
          type: string
        checked_at: {format: date-time, type: [string, 'null']}
        checks_24h: {type: integer}
        error: {type: [string, 'null']}
        failures_24h: {type: integer}
        frequency: {enum: [minute, quarter, erp], type: string}
        hint:
          type: [string, 'null']
          description: Что сделать, если не в норме
        incident: {anyOf: [{$ref: '#/components/schemas/ServiceIncident'}, {type: 'null'}]}
        key: {type: string}
        latency_ms: {type: [integer, 'null']}
        p95_ms_24h: {type: [integer, 'null']}
        purpose: {type: string}
        source:
          description: 'Кто проверяет: CRM сама или передаёт ERP'
          enum: [crm, erp]
          type: string
        stale: {type: boolean}
        status: {enum: [ok, warn, fail, unknown, 'off'], type: string}
        summary: {type: string}
        switch: {anyOf: [{$ref: '#/components/schemas/ServiceSwitch'}, {type: 'null'}]}
        system: {enum: [crm, erp, ensemble], type: string}
        title: {type: string}
        uptime_24h: {type: [number, 'null']}
        uptime_7d: {type: [number, 'null']}
        fix_card:
          description: Карточка экрана, где это исправляется (`IntegrationCardKey`); `null` — настроить негде
          anyOf:
          - {$ref: '#/components/schemas/IntegrationCardKey'}
          - {type: 'null'}
      required: [check, checked_at, checks_24h, error, failures_24h, frequency, hint, incident, key, latency_ms, p95_ms_24h, purpose,
        source, stale, status, summary, switch, system, title, uptime_24h, uptime_7d, fix_card]
      type: object
      additionalProperties: false
    ExternalServiceDetail:
      description: 'Сервис, его проверки за 24 часа, сводка по дням за 7 дней и инциденты за 30 дней.'
      properties: {checks: {items: {$ref: '#/components/schemas/ServiceCheck'}, type: array}, days: {items: {$ref: '#/components/schemas/ServiceDay'},
          type: array}, incidents: {items: {$ref: '#/components/schemas/ServiceIncident'}, type: array}, service: {$ref: '#/components/schemas/ExternalService'}}
      required: [checks, days, incidents, service]
      type: object
      additionalProperties: false
    ServiceCheck:
      properties:
        checked_at: {format: date-time, type: string}
        error: {type: [string, 'null']}
        latency_ms: {type: [integer, 'null']}
        status: {enum: [ok, warn, fail, unknown, 'off'], type: string}
        summary: {type: string}
        tier: {enum: [cheap, heavy, manual], type: string}
      required: [checked_at, error, latency_ms, status, summary, tier]
      type: object
      additionalProperties: false
    ServiceDay:
      properties:
        day: {format: date, type: string}
        fail: {type: integer}
        ok: {type: integer}
        unknown: {type: integer}
        uptime: {type: [number, 'null']}
        warn: {type: integer}
      required: [day, fail, ok, unknown, uptime, warn]
      type: object
      additionalProperties: false
    ServiceIncident:
      properties:
        duration_s:
          type: [integer, 'null']
          description: Длительность закрытого инцидента, секунд
        ended_at: {format: date-time, type: [string, 'null']}
        id: {type: integer}
        last_error: {type: [string, 'null']}
        started_at: {format: date-time, type: string}
        summary: {type: string}
      required: [duration_s, ended_at, id, last_error, started_at, summary]
      type: object
      additionalProperties: false
    ServiceSwitch:
      description: 'Выключатель сервиса: доступен ли, выключен ли вручную, что произойдёт при выключении (`effect` — текст CRM для блока «Что произойдёт»).'
      properties:
        available: {type: boolean}
        changed_at: {format: date-time, type: [string, 'null']}
        changed_by: {type: [string, 'null']}
        disabled: {type: boolean}
        effect: {type: string}
        kind: {enum: [vendor, langfuse, mail, telegram, erp], type: string}
        problem: {type: [string, 'null']}
        reason: {type: [string, 'null']}
      required: [available, changed_at, changed_by, disabled, effect, kind, problem, reason]
      type: object
      additionalProperties: false
    AiModel:
      description: 'Алиас роли модели ИИ: провайдер, модель, здоровье по последней проверке, расход за сегодня и маска ключа (источник и последние 4 символа). Сам ключ не возвращается никогда.'
      properties:
        alias: {type: string}
        checked_at: {format: date-time, type: [string, 'null']}
        health: {enum: [ok, problem, unknown], type: string}
        health_detail: {type: [string, 'null']}
        key_last4:
          type: [string, 'null']
          maxLength: 4
          description: Последние 4 символа ключа, введённого в Платформе; `null` — ключ из настроек сервера или не менялся
        key_source:
          type: [string, 'null']
          enum: [crm, env, null]
          description: Откуда ключ роли — `crm` (введён в Платформе), `env` (из настроек сервера); `null` — роль не менялась из Платформы
        model: {type: [string, 'null']}
        provider: {type: [string, 'null']}
        today_usd: {type: number}
      required: [alias, checked_at, health, health_detail, key_last4, key_source, model, provider, today_usd]
      type: object
      additionalProperties: false
    AiModelChange:
      description: 'Итог смены или сброса модели; `key_source`: `crm` — ключ задан в Платформе, `env` — из настроек сервера.'
      properties:
        alias: {type: string}
        key_source: {enum: [crm, env], type: string}
        model: {type: string}
        provider: {type: string}
        quality_check_recommended: {type: boolean}
        reindex_required: {type: boolean}
      required: [alias, key_source, model, provider, quality_check_recommended, reindex_required]
      type: object
      additionalProperties: false
    AiModelTest:
      description: 'Итог проверки модели одним платным запросом.'
      properties: {alias: {type: string}, cost_usd: {type: [number, 'null']}, detail: {type: [string, 'null']}, latency_ms: {
          type: integer}, ok: {type: boolean}}
      required: [alias, cost_usd, detail, latency_ms, ok]
      type: object
      additionalProperties: false
    SpendReport:
      description: 'Расходы бота на ИИ за период (USD): по дням, назначению, виду, провайдерам и бюджетам на день.'
      properties:
        avg_per_lead_usd: {type: number}
        by_kind: {items: {$ref: '#/components/schemas/SpendSlice'}, type: array}
        by_purpose: {items: {$ref: '#/components/schemas/SpendSlice'}, type: array}
        daily_usd: {type: number}
        days: {type: integer}
        leads: {type: integer}
        providers: {items: {$ref: '#/components/schemas/ProviderToday'}, type: array}
        series: {items: {$ref: '#/components/schemas/SpendDay'}, type: array}
        today_usd: {type: number}
        total_usd: {type: number}
      required: [avg_per_lead_usd, by_kind, by_purpose, daily_usd, days, leads, providers, series, today_usd, total_usd]
      type: object
      additionalProperties: false
    SpendSlice:
      properties: {calls: {type: integer}, cost_usd: {type: number}, key: {type: string}}
      required: [calls, cost_usd, key]
      type: object
      additionalProperties: false
    SpendDay:
      properties: {day: {format: date, type: string}, test_usd: {type: number}, work_usd: {type: number}}
      required: [day, test_usd, work_usd]
      type: object
      additionalProperties: false
    ProviderToday:
      properties: {limit_usd: {type: number}, provider: {type: string}, spent_usd: {type: number}}
      required: [limit_usd, provider, spent_usd]
      type: object
      additionalProperties: false
    AiSpendReport:
      description: 'Расходы на ИИ всего ансамбля из журнала LiteLLM: по дням, системам, функциям или моделям, бюджеты и дни превышения.'
      properties:
        date_from: {format: date, type: string}
        date_to: {format: date, type: string}
        erp_connected:
          description: 'ERP ходит в шлюз: есть строки `system=erp` за период'
          type: boolean
        fetched_at: {format: date-time, type: string}
        group: {enum: [day, system, feature, model], type: string}
        overruns: {items: {$ref: '#/components/schemas/AiBudgetOverrun'}, type: array}
        rows: {items: {$ref: '#/components/schemas/AiSpendRow'}, type: array}
        systems: {items: {$ref: '#/components/schemas/AiSystemBudget'}, type: array}
        timezone: {type: string}
        totals: {$ref: '#/components/schemas/AiSpendTotals'}
        truncated:
          description: Журнал LiteLLM отдал не все строки (потолок выборки)
          type: boolean
      required: [date_from, date_to, erp_connected, fetched_at, group, overruns, rows, systems, timezone, totals, truncated]
      type: object
      additionalProperties: false
    AiBudgetOverrun:
      properties: {cost_usd: {type: number}, daily_usd: {type: number}, day: {format: date, type: string}, system: {type: string}}
      required: [cost_usd, daily_usd, day, system]
      type: object
      additionalProperties: false
    AiSpendRow:
      properties:
        calls:
          description: Строк журнала LiteLLM (вызовов), включая неуспешные
          type: integer
        cost_usd: {type: number}
        failed_calls: {type: integer}
        fallback_calls:
          description: 'Деградации: успешные вызовы через fallback-model'
          type: integer
        input_tokens: {type: integer}
        key:
          description: День `YYYY-MM-DD`, система, функция или алиас — по `group`
          type: string
        output_tokens: {type: integer}
      required: [calls, cost_usd, failed_calls, fallback_calls, input_tokens, key, output_tokens]
      type: object
      additionalProperties: false
    AiSpendTotals:
      properties:
        calls: {type: integer}
        cost_usd: {type: number}
        failed_calls: {type: integer}
        fallback_calls: {type: integer}
        input_tokens: {type: integer}
        output_tokens: {type: integer}
      required: [calls, cost_usd, failed_calls, fallback_calls, input_tokens, output_tokens]
      type: object
      additionalProperties: false
    AiSystemBudget:
      properties:
        connected:
          description: За период есть вызовы с тегом этой системы
          type: boolean
        daily_usd:
          description: Бюджет на день; 0 — без лимита
          type: number
        days_over:
          description: Дней периода с расходом ≥ бюджета
          type: integer
        fallback_calls: {type: integer}
        over_today: {type: boolean}
        period_calls: {type: integer}
        period_usd: {type: number}
        system: {type: string}
        today_calls: {type: integer}
        today_usd: {type: number}
      required: [connected, daily_usd, days_over, fallback_calls, over_today, period_calls, period_usd, system, today_calls, today_usd]
      type: object
      additionalProperties: false
    BackupsStatus:
      description: 'Хранилище и бэкапы: источник (том или бакет), свежесть последней копии, состояние сервиса бэкапа.'
      properties:
        available:
          description: Том бэкапов смонтирован в api / бакет `backups` читается
          type: boolean
        can_request:
          description: «Сделать сейчас» доступно (только для тома)
          type: boolean
        daemon_alive:
          description: 'Сервис бэкапа отвечает: heartbeat свежее 2 мин'
          type: boolean
        databases:
          description: Последняя копия по каждой базе (бакет)
          items: {$ref: '#/components/schemas/BackupDatabase'}
          type: array
        error:
          enum: [bucket_missing, access_denied, unreachable, null]
          type: [string, 'null']
          description: Почему бакет не прочитан; None — прочитан
        items: {items: {$ref: '#/components/schemas/BackupItem'}, type: array}
        last_success_at: {format: date-time, type: [string, 'null']}
        request_stuck:
          description: Запрос «Сделать сейчас» старше 2 мин без новой копии — можно повторить
          type: boolean
        requested_at:
          format: date-time
          type: [string, 'null']
          description: «Сделать сейчас» ждёт сервис бэкапа
        source:
          description: 'Откуда статус: том backup-контейнера (dev) или бакет `backups` RustFS (прод)'
          enum: [volume, rustfs]
          type: string
        stale:
          description: Последний успешный бэкап старше 26 ч или его нет
          type: boolean
      required: [available, can_request, daemon_alive, databases, error, items, last_success_at, request_stuck, requested_at,
        source, stale]
      type: object
      additionalProperties: false
    BackupItem:
      properties: {at: {format: date-time, type: string}, name: {type: string}, size_bytes: {type: integer}}
      required: [at, name, size_bytes]
      type: object
      additionalProperties: false
    BackupDatabase:
      properties: {last_success_at: {format: date-time, type: [string, 'null'], description: Последняя копия базы; нет — None},
        name: {type: string}}
      required: [last_success_at, name]
      type: object
      additionalProperties: false
    SystemStatus:
      description: 'Состояние системы: итог и компоненты в порядке «сбой, предупреждение, нет данных, норма».'
      properties: {checked_at: {format: date-time, type: string}, components: {items: {$ref: '#/components/schemas/SystemComponent'},
          type: array}, status: {enum: [ok, warn, fail, unknown], type: string}}
      required: [checked_at, components, status]
      type: object
      additionalProperties: false
    SystemComponent:
      properties: {checked_at: {format: date-time, type: [string, 'null']}, key: {type: string}, reason: {type: string}, status: {
          enum: [ok, warn, fail, unknown], type: string}, title: {type: string}}
      required: [checked_at, key, reason, status, title]
      type: object
      additionalProperties: false

    ModuleCode:
      type: string
      enum: [dashboard, crm, eds, erp, chats, admin]

    AccessLevel:
      type: string
      enum: [full, read]
      description: Скрытые разделы в ответах не перечисляются

    Language:
      type: string
      enum: [ru, uz, en]

    StepCode:
      type: string
      enum: [REQUEST, RESOLUTION, CALCULATION, QUOTE, CONTRACT, PAYMENT, DONE, LOST]
      description: Шкала пути заявки SPEC-v3 §2.3

    ObjectKind:
      type: string
      enum: [lead, client, request, project, letter, quote, contract, invoice, act, memo, chat, ticket, integration]

    ObjectRef:
      type: object
      additionalProperties: false
      required: [kind, number, path]
      properties:
        kind:
          $ref: '#/components/schemas/ObjectKind'
        number:
          type: string
          description: Бизнес-номер SPEC-v3 §2.2 или код (для интеграции — её ключ)
          examples: [ЗВ-2026-104]
        title:
          type: string
        path:
          type: string
          description: Путь в SPA с вкладкой бокового окна, например `/eds/inbox/ВХ-104%2F26?panel=open&tab=resolution`
        step:
          $ref: '#/components/schemas/StepCode'

    PersonRef:
      type: object
      additionalProperties: false
      required: [id, name, initials]
      properties:
        id:
          type: string
          description: '`crm_user_id` сотрудника'
        name:
          type: string
        initials:
          type: string
          maxLength: 3

    LoginIn:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true

    Session:
      type: object
      additionalProperties: false
      required: [me, expires_at, must_change_password]
      properties:
        me:
          $ref: '#/components/schemas/Me'
        must_change_password:
          type: boolean
          description: true — SPA сразу ведёт на смену пароля; остальные разделы недоступны до смены
        expires_at:
          type: string
          format: date-time

    Me:
      type: object
      additionalProperties: false
      required: [id, email, name, initials, language, roles, modules, resources, access]
      properties:
        id:
          type: string
          description: '`crm_user_id`'
        email:
          type: string
          format: email
        name:
          type: string
        initials:
          type: string
          maxLength: 3
        position:
          type: string
          description: Должность — текст (не роль)
        language:
          $ref: '#/components/schemas/Language'
        roles:
          type: array
          minItems: 1
          description: Роли сотрудника (названия — данные CRM)
          items:
            $ref: '#/components/schemas/RoleRef'
        active_role:
          description: >-
            Id роли, выбранной в профиле («вид»): при заданной роли `modules`, `resources`, `restricted_fields`, «Моя очередь»
            и карточки считаются только по ней; пусто — по объединению всех ролей. На права операций не влияет: BFF проверяет
            их по объединению ролей.
          oneOf:
            - $ref: '#/components/schemas/RoleId'
            - type: 'null'
        modules:
          type: array
          description: Модули рейла в порядке показа — для активной роли, если задана, иначе для объединения ролей
          items:
            $ref: '#/components/schemas/ModuleCode'
        resources:
          type: object
          description: >-
            Разделы каталога `platform-rbac.yaml` → уровень (максимум по матрицам ролей) — для активной роли, если задана,
            иначе для объединения ролей. Видимость пункта меню — по секции `menu` того же файла.
          additionalProperties:
            $ref: '#/components/schemas/AccessLevel'
        restricted_fields:
          type: array
          description: Поля с ограничением, которые сотруднику видны
          items:
            $ref: '#/components/schemas/RestrictedField'
        access:
          type: object
          additionalProperties: false
          required: [crm, erp]
          properties:
            crm:
              type: boolean
            erp:
              type: boolean

    ChangePasswordIn:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
        new_password:
          type: string
          minLength: 8
          maxLength: 256
          writeOnly: true

    EmployeeStatus:
      type: string
      enum: [active, invited, disabled]

    ErpSyncState:
      type: string
      enum: [ok, pending, error, not_applicable]
      description: Итог провижининга в ERP

    Employee:
      type: object
      additionalProperties: false
      required: [id, name, initials, email, roles, access, status, telegram_linked, erp_sync]
      properties:
        id:
          type: string
        name:
          type: string
        initials:
          type: string
          maxLength: 3
        email:
          type: string
          format: email
        position:
          type: string
          maxLength: 120
          description: Должность — текст, не роль
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        access:
          type: object
          additionalProperties: false
          required: [crm, erp]
          properties:
            crm:
              type: boolean
            erp:
              type: boolean
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        telegram_linked:
          type: boolean
          description: Привязан Telegram для уведомлений сотруднику
        erp_sync:
          $ref: '#/components/schemas/ErpSyncState'
        erp_sync_error:
          type: string
          description: Текст последней ошибки провижининга ERP (из CRM), если `erp_sync = error`

    EmployeeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Employee'

    EmployeeInvite:
      type: object
      additionalProperties: false
      required: [email, name, role_ids]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 120
        position:
          type: string
          maxLength: 120
        role_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleId'

    EmployeeCredentials:
      type: object
      additionalProperties: false
      required: [employee, temporary_password]
      description: Сотрудник и его временный пароль — показывается администратору один раз, повторно получить нельзя
      properties:
        employee:
          $ref: '#/components/schemas/Employee'
        temporary_password:
          type: string
          minLength: 1
          description: Одноразовый временный пароль; сотрудник обязан сменить его при входе. Не логируется и не кэшируется

    SetupState:
      type: object
      additionalProperties: false
      required: [needs_admin]
      properties:
        needs_admin:
          type: boolean
          description: В CRM ещё нет активного администратора — нужен экран «Первый запуск»

    SetupAdminIn:
      type: object
      additionalProperties: false
      required: [code, name, email, password]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Одноразовый код первого запуска из журнала `crm-api` (`setup_code_issued`)
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
          description: Правила пароля проверяет CRM; слабый — 422 `VALIDATION_FAILED` (`details.fields = [password]`)

    SetupStepKey:
      type: string
      enum: [erp, bot, mail, models, first_employee]
      description: Пять шагов чек-листа (SPEC-v3 §7.6) в порядке выполнения — ERP, бот, почта, модели ИИ, первый сотрудник

    SetupStepState:
      type: string
      enum: [done, todo, unknown]
      description: '`unknown` — бэкенд не ответил или не отдал данные; чек-лист при этом не падает'

    SetupStep:
      type: object
      additionalProperties: false
      required: [key, state]
      properties:
        key:
          $ref: '#/components/schemas/SetupStepKey'
        state:
          $ref: '#/components/schemas/SetupStepState'

    SetupCompanyStatus:
      type: object
      additionalProperties: false
      required: [required, can_setup]
      properties:
        required:
          type: boolean
          description: Своей компании в ERP ещё нет
        can_setup:
          type: boolean
          description: Текущий сотрудник может её создать (суперпользователь ERP)

    SetupChecklist:
      type: object
      additionalProperties: false
      required: [steps, done, total, company, company_blocker]
      properties:
        steps:
          type: array
          description: Всегда пять шагов в порядке `SetupStepKey`
          items:
            $ref: '#/components/schemas/SetupStep'
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 5
          maximum: 5
        company:
          oneOf:
            - $ref: '#/components/schemas/SetupCompanyStatus'
            - type: 'null'
          description: Шаг мастера «своя компания»; `null` — данных нет, причина в `company_blocker`
        company_blocker:
          oneOf:
            - $ref: '#/components/schemas/SetupCompanyBlocker'
            - type: 'null'
          description: Почему нет данных о компании (`company = null`); `null`, когда данные есть

    SetupCompanyBlocker:
      type: string
      enum: [erp_not_connected, erp_unavailable]
      description: >-
        `erp_not_connected` — ERP не сопряжена (CRM: коннектор не задан): сначала шаг «ERP», компания невозможна.
        `erp_unavailable` — ERP сопряжена, но не ответила или не выдала сессию администратору: повторить позже

    SetupCompanyIn:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        inn:
          type: string
          maxLength: 20
        legal_address:
          type: string
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 254
          description: Пусто или корректный адрес (проверяет ERP)

    SetupCompanyCreated:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    EmployeeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role_ids:
          type: array
          uniqueItems: true
          minItems: 1
          description: Полный новый набор ролей, хотя бы одна; пустой набор — 422 `ROLES_REQUIRED` (0.6.0)
          items:
            $ref: '#/components/schemas/RoleId'
        position:
          type: string
          maxLength: 120
        is_active:
          type: boolean
        transfer_to_user_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: >-
            Кому передать лиды в работе (`crm_user_id` коллеги), если отключение или новые роли отнимают у сотрудника работу
            с лидами; без поля при таких лидах — 409 `CONFLICT` (`details.reason = user_has_active_leads`)

    MeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        language:
          $ref: '#/components/schemas/Language'
        active_role:
          oneOf:
            - $ref: '#/components/schemas/RoleId'
            - type: 'null'

    InvalidationTopic:
      type: string
      enum: [notifications, counters, queue, activity]
      description: >-
        Что перезапросить: `notifications` — `listNotifications`; `counters` — `getMenuCounters`; `queue` — `getQueue`
        и `getQueueCards`; `activity` — `getActivityToday`.

    InvalidationHint:
      type: object
      description: Данные кадра `invalidate` потока `/events/stream` — подсказка, не данные события.
      additionalProperties: false
      required: [topics, reason]
      properties:
        topics:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/InvalidationTopic'
        reason:
          type: string
          description: Тип события шины (`uz.railtech.erp.quote.sent.v1`) или `resync` (слушатель BFF переподключился — перезапросите всё)

    Health:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties: false
          required: [redis, crm, erp]
          properties:
            redis:
              type: string
              enum: [ok, fail]
            crm:
              type: string
              enum: [ok, fail]
            erp:
              type: string
              enum: [ok, fail]
        version:
          type: string

    MenuCounter:
      type: object
      additionalProperties: false
      required: [module, section, count, attention]
      properties:
        module:
          $ref: '#/components/schemas/ModuleCode'
        section:
          type: string
          description: Ключ раздела подменю (`queue`, `inbox`, `drafts`, `approvals`, `payments`, `calc`, `leads`, `messages`…)
        count:
          type: integer
          minimum: 0
        attention:
          type: boolean
          description: true — красный бейдж «требует действия», false — серый счётчик

    MenuCounters:
      type: object
      additionalProperties: false
      required: [items, sources]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuCounter'
        sources:
          $ref: '#/components/schemas/Sources'

    QueueItemKind:
      type: string
      description: Вид действия; какой раздел и уровень нужен — секция `queue` каталога `platform-rbac.yaml`
      enum:
        - answer_lead
        - take_lead
        - create_request
        - service_request
        - resolve_letter
        - approve_quote
        - approve_memo
        - problem_project
        - calc_task
        - supplier_overdue
        - confirm_payment
        - issue_invoice
        - issue_contract
        - attach_scan
        - pay_memo
        - overdue_invoice
        - ticket
        - integration_issue

    DueLabel:
      type: string
      enum: [overdue, today, tomorrow, later, memo]
