      parameters:
        - $ref: '#/components/parameters/TicketNumberPath'
      responses:
        '200':
          description: Обращение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/tickets/{number}/reply:
    post:
      tags: [tickets, admin]
      operationId: replyTicket
      summary: Ответить на обращение
      description: >-
        Раздел `admin` — полный. Ответ уходит автору в колокольчик и в Telegram (если привязан); новое обращение берётся «В
        работу», `status` задаёт итог сразу («Решено»). Недопустимый переход — 409 `CONFLICT`
        (`details.reason = ticket_status_transition`), пустой или слишком длинный ответ — 422.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/TicketNumberPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketReply'
      responses:
        '200':
          description: Обновлённое обращение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CONFLICT` — статус так сменить нельзя'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/tickets/{number}/status:
    post:
      tags: [tickets, admin]
      operationId: setTicketStatus
      summary: Сменить статус обращения
      description: >-
        Раздел `admin` — полный. «Новое → В работе → Решено»; «Решено» можно вернуть «В работу». Решение без ответа тоже
        сообщается автору. Иначе — 409 `CONFLICT` (`details.reason = ticket_status_transition`).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/TicketNumberPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketStatusChange'
      responses:
        '200':
          description: Обновлённое обращение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CONFLICT` — статус так сменить нельзя'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /me/profile:
    get:
      tags: [me]
      operationId: getProfile
      summary: Мой профиль для страницы /me
      description: >-
        Данные сотрудника из CRM (`GET /me`): имя, почта, должность, телефон, язык, часовой пояс, подпись для писем, фото, привязка
        Telegram и замещение. Доступно каждому вошедшему; чужой профиль этим путём не читается.
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '503':
          $ref: '#/components/responses/BackendUnavailable'
    patch:
      tags: [me]
      operationId: updateProfile
      summary: Сохранить свой профиль
      description: >-
        Не присланное поле не меняется; пустая строка в `phone` и `email_signature` очищает поле. Должность и роли сюда не
        приходят (задаёт админ). Ошибка значения — 422 `VALIDATION_FAILED` с `details.fields` и `details.reason`
        (`phone_invalid`, `timezone_unknown`, `signature_invalid`).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
