          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - admin
      operationId: updateCompany
      summary: Изменить реквизиты
      description: Не присланное поле не меняется; ошибки полей — 422 с `details.fields`. Раздел `company.settings` — полный.
      parameters:
