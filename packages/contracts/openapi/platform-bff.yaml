        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MessagesConflict'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /crm/reply-templates:
    get:
      tags: [messages]
      operationId: listCrmReplyTemplates
      summary: 'Шаблоны ответов для поля ответа (только чтение)'
