  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Отметить все прочитанными
      description: |
        Отмечает обе ленты — ERP и CRM (у каждой своя). Недоступность одной ленты не отменяет отметку другой: ответ 204,
        недоступный источник остаётся непрочитанным и виден в `sources` следующей выдачи `GET /notifications`. Ошибка
        возвращается, только если не отмечена ни одна лента.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Отмечены (хотя бы одна лента)
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/CsrfFailed'

  /events/stream:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Поток подсказок инвалидации (SSE) — что перезапросить после события шины
      description: |
        Долгоживущий ответ `text/event-stream` для вошедшего сотрудника с разделом «Моя очередь» (его имеет каждая роль).
        Кадры:

        - `event: invalidate`, `data: <InvalidationHint>` — после события шины (ERP, лид CRM, сотрудник). Всплеск событий
          сливается в один кадр (окно около 300 мс): `topics` — объединение тем, `reason` — тип последнего события.
          Подсказка адресована всем сессиям: события не несут адресата. Данных события в кадре нет — клиент перезапрашивает
          обычные API, поэтому чужие данные в поток не попадают.
        - `: ping` — комментарий-heartbeat каждые 20 секунд тишины (держит соединение через прокси). Если сессия закрыта
          (выход, срок), BFF завершает поток при ближайшем heartbeat.
        - `: connected` — первый кадр: заголовки и первый байт уходят сразу.

        `Last-Event-ID` не поддерживается: после переподключения клиент делает разовый полный перезапрос. Обрыв потока —
        сигнал вернуться к опросу (`POLL_INTERVAL_MS`). Ответ несёт `Cache-Control: no-cache, no-transform`.
      responses:
        '200':
          description: Поток открыт
          content:
            text/event-stream:
              schema:
                type: string
                description: Кадры SSE; `data` кадра `invalidate` — JSON `InvalidationHint`
                contentMediaType: application/json
                contentSchema:
                  $ref: '#/components/schemas/InvalidationHint'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /search:
    get:
      tags: [search]
      operationId: search
      summary: Сквозной поиск — номера, ИНН, название клиента, артикул; результаты группами по модулям
      description: >-
        Доступен сотруднику с любым видимым разделом (в том числе роли без «Моей очереди»): каждая группа и каждый
        результат фильтруются по разделам ролей «вида»; источник без разделов у ролей — `not_applicable`.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: Результаты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /eds/documents:
    get:
      tags: [eds-documents]
      operationId: listEdsDocuments
      summary: 'EDS · Документы: «Мои документы» и реестр «Все документы»'
      description: >-
        EDS `GET /documents?mine=1` (`scope=mine`, по умолчанию) или `GET /registry` (`scope=all`). «Мои» — документы, где
        сотрудник автор: служебные записки, заявления, отчёты, письма (черновики тоже). «Все» — реестр компании
        (SPEC-v3 §7.3): письма, КП, служебные, заявления, отчёты; нужен раздел `eds.inbox`, `eds.projects` или `eds.payments`
        (в EDS это право `registry.read`; решает EDS, иначе 403 `FORBIDDEN`). Договоры, счета и акты в реестре появятся, когда EDS
        начнёт вести их проекции. Страницы — курсором (`next_cursor`), новые выше.
      parameters:
        - name: scope
          in: query
          required: false
          schema: {type: string, enum: [mine, all], default: mine}
        - name: kind
          in: query
          required: false
          description: Вкладки по типу (повтором параметра); в «Мои» письма-входящие и КП игнорируются
          schema:
            type: array
            items: {$ref: '#/components/schemas/EdsRegistryKind'}
          style: form
          explode: true
        - name: status
          in: query
          required: false
          description: Статусы (повтором); значения — статусы документа, письма или маршрута КП
          schema:
            type: array
            items: {type: string, pattern: '^[a-z_]+$', maxLength: 32}
          style: form
          explode: true
        - name: q
          in: query
          required: false
          description: Поиск по номеру и теме (только `scope=all`)
          schema: {type: string, maxLength: 200}
        - name: cursor
          in: query
          required: false
          schema: {type: string, maxLength: 2000}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Страница документов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdsDocumentPage'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'
    post:
      tags: [eds-documents]
      operationId: createEdsDocument
      summary: 'EDS · Создать документ (и отправить на согласование)'
      description: >-
        EDS `POST /documents` и, если `submit = true`, `POST /documents/{id}/submit`. Необязательный `Idempotency-Key` уходит в EDS как есть: повтор с тем же
        ключом и телом (ответ потерялся) возвращает прежний документ, а не создаёт второй; тот же ключ с другим телом — 409 `CONFLICT`
        (`details.reason = idempotency_key_reused`). Раздел `eds.memo.create` (есть у всех ролей);
        право на тип решает EDS: `memo`, `application`, `report` — `memos.create`, `letter_out` (Письмо) — `letters.register`
        (нет права — 403 `FORBIDDEN`). Номер (`СЗ-`, `ЗЯ-`, `ОТ-ГГГГ/NNN`) присваивает EDS при создании; маршрут служебной
        записки — директор, затем бухгалтер, если указана сумма; заявления и отчёта — директор. Письмо отправка не согласует:
        EDS присваивает номер `ИСХ-NNN/ГГ` и переводит его в «Отправлено» (бланк, PDF и отправка адресату — волна D-DOC).
        Если документ создан, а отправка отклонена (например, 422), ответ — ошибка, а созданный черновик назван в
        `details.document_id`: введённое не теряется, экран продолжает с этим id через `PUT /eds/documents/{id}`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/EdsIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdsDocumentIn'
      responses:
        '201':
          description: Документ создан (черновик или на согласовании)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdsDocument'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/EdsConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/documents/{id}:
    get:
      tags: [eds-documents]
      operationId: getEdsDocument
      summary: 'EDS · Документ: статус, маршрут, решения, вложения'
      description: >-
        EDS `GET /documents/{id}` и, если документ отправлялся, `GET /approvals/{approval_id}` (шаги маршрута). Автор, участник
        маршрута или сотрудник с правом реестра; иначе 404. `can_edit` — автор и статус `draft` или `returned`.
      parameters:
        - $ref: '#/components/parameters/EdsDocumentId'
      responses:
        '200':
          description: Документ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdsDocument'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'
    put:
      tags: [eds-documents]
      operationId: updateEdsDocument
      summary: 'EDS · Сохранить черновик (и отправить на согласование)'
      description: >-
        EDS `PATCH /documents/{id}` (с `eds.yaml` 0.4.0) и, если `submit = true`, `POST /documents/{id}/submit`. Только автор;
        документ в статусе `draft` или `returned` (после возврата отправка открывает новый круг и версию), иначе 409 `CONFLICT`
        (`details.reason = invalid_state`). Передаётся форма целиком: `amount`, `due_date`, `erp_deal_id` со значением `null`
        очищают поле. Вложения привязываются; снять уже привязанное нельзя. Отправка отклонена — ошибка, а правки сохранены
        (`details.saved = true`).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/EdsDocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdsDocumentUpdateIn'
      responses:
        '200':
          description: Документ с правками
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdsDocument'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EdsConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/document-files:
    post:
      tags: [eds-documents]
      operationId: uploadEdsDocumentFile
      summary: 'EDS · Загрузить вложение документа'
      description: >-
        EDS `POST /files` (multipart). BFF читает тело потоком до предела (25 МБ и поля формы), multipart не разбирает и
        передаёт EDS как есть. Файл привязывается к документу при создании или сохранении (`file_ids`); пока не привязан, его видит
        только загрузивший. Больше 25 МБ — 413 `PAYLOAD_TOO_LARGE` (`details.max_bytes`); не PDF, не изображение и не документ
        Office — 415 `UNSUPPORTED_MEDIA_TYPE`. Раздел `eds.memo.create`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EdsFileUpload'
      responses:
        '201':
          description: Файл сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdsFile'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/EdsPayloadTooLarge'
        '415':
          $ref: '#/components/responses/EdsUnsupportedMedia'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/document-files/{file_id}:
    get:
      tags: [eds-documents]
      operationId: downloadEdsDocumentFile
      summary: 'EDS · Скачать вложение документа'
      description: >-
        EDS `GET /files/{id}`. Файл отдаётся потоком, в памяти BFF не накапливается; видит тот, кому виден документ с этим
        вложением, или загрузивший. Имя файла — в `Content-Disposition`.
      parameters:
        - name: file_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Содержимое файла
          headers:
            Content-Disposition:
              description: "`attachment; filename*=UTF-8''…`"
              schema: {type: string}
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/quotes:
    get:
      tags: [eds-approvals]
      operationId: listQuoteApprovals
      summary: 'EDS · КП на одобрение: список'
      description: >-
        EDS `GET /approvals?template=quote`. `scope=mine` (по умолчанию) — маршруты, текущий шаг которых ждёт этого сотрудника;
        `scope=all` — все КП, которые EDS показывает сотруднику (директор и менеджер — все). Порядок — от новых к старым;
        страница — непрозрачный `cursor`. Клиент, сумма и срок приходят из снимка КП маршрута (EDS отдаёт снимок только тому,
        кто решает шаг: у менеджера `client_name` и `total` — `null`). Раздел `eds.drafts` — чтение. EDS не ответил — 503
        `BACKEND_UNAVAILABLE` (`source = eds`); нет прав в EDS — 403 `FORBIDDEN` (`details.reason = eds_not_granted`).
      parameters:
        - $ref: '#/components/parameters/ApprovalScope'
        - $ref: '#/components/parameters/ApprovalStatusFilter'
        - name: cursor
          in: query
          required: false
          description: Непрозрачный курсор из `next_cursor`
          schema: {type: string, maxLength: 500}
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Страница КП на одобрение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteApprovalPage'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/quotes/{ref}:
    get:
      tags: [eds-approvals]
      operationId: getQuoteApproval
      summary: 'EDS · Карточка КП на одобрение (по id маршрута или по номеру КП)'
      description: >-
        Маршрут «КП» EDS `GET /approvals/{id}` (шаги, чек-лист, снимок КП) плюс данные ERP по ссылкам маршрута: состав КП и итоги
        (`GET /crm/quotes/{id}/`), заявка и контакт клиента для каналов отправки (`GET /crm/deals/{id}/`,
        `GET /accounts/contacts/{id}/`); письмо заявки — EDS `GET /letters?q=<номер заявки>`. `ref` — UUID маршрута или
        номер КП `КП-2026/115` (сначала `GET /registry?number=&kind=quote`; у номера несколько версий — берётся открытая,
        иначе последняя); косая черта допускается в пути как есть и как `%2F`. ERP не ответил — 200 без строк и итогов,
        `sources.erp = unavailable`. **Внутренний блок** `internal` (себестоимость, маржа, порог, условия оплаты, сроки) и
        значение маржи в чек-листе BFF вырезает у роли без группы `cost_margin`: поле не передаётся совсем. Раздел
        `eds.drafts` — чтение (менеджер видит КП без маржи и без кнопок решения).
      parameters:
        - name: ref
          in: path
          required: true
          description: UUID маршрута одобрения КП или номер `КП-ГГГГ/NNN`
          schema: {type: string, minLength: 1, maxLength: 64}
      responses:
        '200':
          description: Карточка КП
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteApprovalCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/quotes/{id}/decision:
    post:
      tags: [eds-approvals]
      operationId: decideQuoteApproval
      summary: 'EDS · Одобрить КП → отправить клиенту / Вернуть на доработку / Отклонить'
      description: >-
        EDS `POST /approvals/{id}/decision` (право `approvals.decide`). Раздел `eds.drafts` — полный: роль только для чтения
        получает 403 в BFF до EDS. **Проверку чек-листа делает EDS**, не BFF: `approve` при красной блокирующей строке (визы,
        маржа) — 409 `CONFLICT`, `details.reason = checklist_not_green`, `details.failed` — коды красных строк; строка `due`
        (срок) — предупреждение, КП одобряется с отметкой `approved_late`. Маршрут уже закрыт (решил другой директор, новая версия
        КП) — 409 `details.reason = route_closed`; сотрудника не ждёт шаг — 403 `FORBIDDEN`, `details.reason = not_your_step`.
        `comment` обязателен для `return` и `reject` — пустой 422 в BFF до EDS (`details.fields = [comment]`); `channels` —
        только для `approve`. При одобрении EDS присваивает `ИСХ-NNN/ГГ` и публикует `approval.decided` с выбранными `channels`: ERP
        переводит КП в «Готово к отправке» и сохраняет каналы; клиенту КП отправляет менеджер заявки (`quote.send`, C1-G-4) — автоотправка
        по каналам делается в W16-D1-2. Ответ — обновлённая карточка.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ApprovalIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteDecisionIn'
      responses:
        '200':
          description: Решение принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteApprovalCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ApprovalConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/memo-approvals:
    get:
      tags: [eds-approvals]
      operationId: listMemoApprovals
      summary: 'EDS · На согласовании: служебные записки, заявления, отчёты'
      description: >-
        EDS `GET /approvals` по шаблонам «Служебная записка», «Заявление», «Отчёт». `scope=mine` (по умолчанию) — документы на
        шаге этого сотрудника; `scope=all` — документы, где он автор или участник маршрута (с правом реестра — все). Автор,
        тема, сумма и «нужно до» читаются из документа EDS. Порядок — от новых к старым. Раздел `eds.memo.approve` или
        `eds.memo.create` — чтение.
      parameters:
        - $ref: '#/components/parameters/ApprovalScope'
        - $ref: '#/components/parameters/ApprovalStatusFilter'
        - name: cursor
          in: query
          required: false
          description: Непрозрачный курсор из `next_cursor`
          schema: {type: string, maxLength: 500}
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Страница документов на согласовании
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoApprovalPage'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/memo-approvals/{ref}:
    get:
      tags: [eds-approvals]
      operationId: getMemoApproval
      summary: 'EDS · Карточка документа на согласовании (по id документа или по номеру)'
      description: >-
        EDS `GET /documents/{id}` и `GET /approvals/{approval_id}` (маршрут: шаги, `can_decide`, `allowed_decisions`).
        `ref` — UUID документа или номер `СЗ-2026/014`, `ЗЯ-…`, `ОТ-…` (по номеру — `GET /registry?number=`; косая черта допускается
        в пути как есть и как `%2F`). Документа нет в реестре или он не служебный — 404 `NOT_FOUND`. Автор без права решения
        получает карточку в режиме чтения (`can_decide = false`). Раздел `eds.memo.approve` или `eds.memo.create` — чтение.
      parameters:
        - name: ref
          in: path
          required: true
          description: UUID документа или номер СЗ/ЗЯ/ОТ
          schema: {type: string, minLength: 1, maxLength: 64}
      responses:
        '200':
          description: Карточка документа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoApprovalCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/memo-approvals/{id}/decision:
    post:
      tags: [eds-approvals]
      operationId: decideMemoApproval
      summary: 'EDS · Согласовать / Вернуть на доработку / Отклонить документ'
      description: >-
        EDS `POST /approvals/{id}/decision` (права `memos.approve` / `approvals.decide` на шаге директора, `payments.confirm` на шаге
        бухгалтера). Раздел `eds.memo.approve` — полный (директор) или `eds.payments` — полный (бухгалтер на своём шаге): автор без
        права решения получает 403 в BFF до EDS; чей это шаг, решает EDS. Бухгалтер: «Принять к оплате» (`approve`) и «Вернуть». `comment` обязателен для `return` и `reject` — пустой 422 в BFF до EDS
        (`details.fields = [comment]`). Шаг не этого сотрудника — 403 EDS (`details.reason = not_your_step`); маршрут уже закрыт —
        409 `CONFLICT`, `details.reason = route_closed`. Служебная записка с суммой после директора идёт бухгалтеру. `{id}` —
        `approval_id` из карточки. Ответ — обновлённая карточка.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ApprovalIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoDecisionIn'
      responses:
        '200':
          description: Решение принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoApprovalCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ApprovalConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/payments:
    get:
      tags: [eds-payments]
      operationId: listPayments
      summary: 'EDS · Счета и оплаты: таблица счетов вкладки'
      description: >-
        ERP `GET /finance/receivables/`. Вкладки не пересекаются, чтобы счёт стоял ровно в одной очереди: `to_issue` («К выставлению» —
        черновики), `proofs` («Платёжки на подтверждение» — есть платёжка клиента без подтверждения), `overdue` («Просрочены» —
        срок оплаты прошёл, остаток есть), `awaiting` («Ждут оплаты»), `all` («Все счета», в том числе оплаченные). «Просрочен» не
        хранится статусом, а вычисляется по сроку. `counts` — число счетов на каждой вкладке, `memos_to_pay` — число служебок к
        оплате из EDS (до 100; `null` — EDS не ответил, `sources.eds = unavailable`). Номер проекта `ПР-ГГГГ-NNN` BFF составляет из
        года и id сделки (до ERP-09). Раздел `eds.payments` — чтение (менеджер, директор, бухгалтер); читать счета вправе сотрудник
        с правом ERP на финансы — иначе ERP отвечает 403 (`source = erp`). В данных нет себестоимости, маржи и цен поставщиков.
        ERP не ответил — 503.
      parameters:
        - name: tab
          in: query
          required: false
          schema: {$ref: '#/components/schemas/PaymentTab'}
        - name: q
          in: query
          required: false
          description: Поиск по номеру счёта и названию клиента
          schema: {type: string, maxLength: 200}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Счета вкладки и счётчики
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBoard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/payment-memos:
    get:
      tags: [eds-payments]
      operationId: listPaymentMemos
      summary: 'EDS · Служебки к оплате: список'
      description: >-
        EDS `GET /documents?kind=memo&status=to_accountant` (`status=paid` — оплаченные). Служебная записка с суммой после согласования
        директора передана бухгалтеру (SPEC-v3 §3.2 п. 5); `invoice_attached` — приложен ли файл (счёт поставщика). Раздел
        `eds.payments` — чтение; видимость записок решает EDS (`registry.read`).
      parameters:
        - name: status
          in: query
          required: false
          schema: {$ref: '#/components/schemas/PaymentMemoStatus'}
        - $ref: '#/components/parameters/BusCursor'
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Служебки к оплате
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMemoPage'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/payment-memos/{id}:
    get:
      tags: [eds-payments]
      operationId: getPaymentMemo
      summary: 'EDS · Служебка к оплате: карточка'
      description: >-
        EDS `GET /documents/{id}` и `GET /approvals/{approval_id}`. `can_pay` — шаг «Бухгалтер» ждёт этого сотрудника (чей шаг, решает
        EDS: автор записки не платит свою записку, если есть другой бухгалтер); `can_return` — можно вернуть автору (через
        `POST /eds/memo-approvals/{approval_id}/decision`). Вложения (счёт поставщика, платёжка) скачиваются через
        `GET /eds/document-files/{file_id}`. Документ не служебная записка — 404.
      parameters:
        - $ref: '#/components/parameters/EdsDocumentId'
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMemoCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/payment-memos/{id}/pay:
    post:
      tags: [eds-payments]
      operationId: payPaymentMemo
      summary: 'EDS · Оплачено: оплата служебной записки (дата, сумма, платёжка)'
      description: >-
        EDS `POST /documents/{id}/payment` (право `payments.confirm`). Закрывает шаг «Бухгалтер»: записка `to_accountant` → `paid`,
        журнал `document.paid`; сумма — не больше согласованной, валюта записки, дата не в будущем (422 в BFF до EDS и в EDS —
        `details.messages`: `exceeds_approved`, `currency_mismatch`, `must_be_positive`, `in_future`). Повтор с теми же датой и суммой
        возвращает ту же записку; другие данные по оплаченной — 409 (`already_paid`); записка не у бухгалтера — 409 (`invalid_state`,
        `route_closed`); шаг не этого сотрудника — 403 (`not_your_step`). `receipt_file_id` — файл из `POST /eds/payment-receipt-files`.
        Раздел `eds.payments` — полный.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/EdsDocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMemoPayIn'
      responses:
        '200':
          description: Записка оплачена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMemoCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EdsConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/payment-receipt-files:
    post:
      tags: [eds-payments]
      operationId: uploadPaymentReceiptFile
      summary: 'EDS · Загрузить платёжку бухгалтера для «Оплачено»'
      description: >-
        EDS `POST /files` (multipart), как `POST /eds/document-files`, но с правом раздела `eds.payments` (полный): бухгалтеру не
        нужен раздел «Создать документ». Файл привязывается к записке операцией `pay`. До 25 МБ (413), PDF, изображение или документ Office
        (415).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EdsFileUpload'
      responses:
        '201':
          description: Файл сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdsFile'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/EdsPayloadTooLarge'
        '415':
          $ref: '#/components/responses/EdsUnsupportedMedia'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/payments/{id}:
    get:
      tags: [eds-payments]
      operationId: getPayment
      summary: 'EDS · Счёт: карточка (платёжки, оплаты, остаток, журнал)'
      description: >-
        ERP `GET /finance/receivables/{id}/`. Платёжки клиента (файл, откуда пришла — кабинет, бот, почта или приложил бухгалтер,
        когда), платежи с остатком, журнал счёта. Флаги `can_*` считает ERP по праву `finance.payment` и состоянию счёта: директор
        и менеджер видят карточку без кнопок. Раздел `eds.payments` — чтение. Счёта нет — 404.
      parameters:
        - $ref: '#/components/parameters/PaymentInvoiceId'
      responses:
        '200':
          description: Карточка счёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/payments/{id}/confirm:
    post:
      tags: [eds-payments]
      operationId: confirmPayment
      summary: 'EDS · Подтвердить оплату (полную или частичную) по выписке'
      description: >-
        ERP `POST /finance/receivables/{id}/confirm-payment/` (право `finance.payment`). `amount` и `date` — по выписке банка;
        сумма меньше остатка — счёт «Частично оплачен» и виден остаток, равная остатку — «Оплачен» (событие шины `invoice.paid`,
        стадия проекта «Оплата выполнена» выводится из оплаченных счетов проекта); больше остатка — 409 `CONFLICT`
        (`details.reason = exceeds_balance`), ничего не записывается. `proof_id` — подтверждаемая платёжка клиента.
        Повтор идемпотентен: `Idempotency-Key` (ERP отдаёт прежний ответ), тот же `proof_id` или тот же номер операции `reference`
        возвращают прежний платёж (`replayed = true`), по уже оплаченному счёту та же сумма и дата — тоже. Сумма не больше нуля
        и дата в будущем — 422 в BFF. Раздел `eds.payments` — полный.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PaymentInvoiceId'
        - $ref: '#/components/parameters/EdsIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentConfirmIn'
      responses:
        '200':
          description: Оплата подтверждена (или повтор)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PaymentConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/payments/{id}/proofs:
    post:
      tags: [eds-payments]
      operationId: attachPaymentProof
      summary: 'EDS · Приложить платёжку клиента к счёту'
      description: >-
        ERP `POST /finance/receivables/{id}/confirmations/` (multipart: `file`, необязательно `source` — `EMAIL`, `BOT`, `CABINET`,
        `MANUAL`, `claimed_amount`, `claimed_date`, `note`). BFF читает тело потоком до 25 МБ и передаёт ERP как есть. Платёжка
        не деньги: пока бухгалтер её не подтвердил, счёт стоит на вкладке «Платёжки на подтверждение». Счёт не ждёт оплаты — 409
        (`not_open`). Раздел `eds.payments` — полный.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PaymentInvoiceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentProofUpload'
      responses:
        '201':
          description: Платёжка приложена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PaymentConflict'
        '413':
          $ref: '#/components/responses/EdsPayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/payments/{id}/proofs/{proof_id}/file:
    get:
      tags: [eds-payments]
      operationId: downloadPaymentProof
      summary: 'EDS · Скачать платёжку клиента'
      description: >-
        ERP `GET /finance/receivables/{id}/confirmations/{proof_id}/file/`. Файл потоком, как вложение документа; платёжка другого
        счёта — 404. Раздел `eds.payments` — чтение.
      parameters:
        - $ref: '#/components/parameters/PaymentInvoiceId'
        - name: proof_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Содержимое файла
          headers:
            Content-Disposition:
              description: "`attachment; filename*=UTF-8''…`"
              schema: {type: string}
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/payments/{id}/request-payment-doc:
    post:
      tags: [eds-payments]
      operationId: requestPaymentDoc
      summary: 'EDS · Запросить платёжку у клиента (отметка в журнале счёта)'
      description: >-
        ERP `POST /finance/receivables/{id}/request-payment-doc/`. Фиксирует в журнале счёта, что платёжку запросили. Автоматической
        отправки клиенту в бот или почту в main нет (клиенту пишет бот по событиям шины, письма ERP уходят сотрудникам клиента,
        которых нет): текст сообщения сотрудник отправляет сам через «Чаты». Автоотправка — хвост (B-D24-1). Раздел `eds.payments` — полный.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PaymentInvoiceId'
      responses:
        '200':
          description: Запрос отмечен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCard'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PaymentConflict'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /eds/deal-options:
    get:
      tags: [eds-documents]
      operationId: listEdsDealOptions
      summary: 'EDS · Связь с проектом: поиск заявки или проекта по номеру'
      description: >-
        Заявки и проекты из ERP (новейшие сделки; поиск по номеру `ЗВ-2026-104`, названию и компании, как в сквозном поиске)
        для поля «Связь с проектом» формы документа: возвращает `erp_deal_id`, который EDS хранит в документе. Нужен раздел
        `crm.clients` или `eds.projects` (чтение); у роли без них поле «Связь с проектом» не показывается. Без `q` — десять
        новейших. ERP не ответила — `sources.erp = unavailable`, список пуст.
      parameters:
        - name: q
          in: query
          required: false
          schema: {type: string, maxLength: 100}
      responses:
        '200':
          description: Заявки и проекты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdsDealOptions'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/integrations:
    get:
      tags: [integrations]
      operationId: getIntegrationsOverview
      summary: 'Обзор: карточки со статусом и «Требует внимания»'
      description: >-
        Раздел `admin` — от чтения. BFF параллельно читает реестр внешних сервисов, состояние системы, коннектор ERP,
        модели, расходы и бэкапы CRM и сводит их в карточки: статус пятью уровнями (уровни реестра внешних сервисов CRM,
        ADR-0024 CRM), последняя активность и список «Требует внимания». Часть, которую CRM не отдала (нет права в CRM или
        не ответила), не роняет обзор: у карточки `access = forbidden | unavailable`. CRM не ответила целиком — 503.
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsOverview'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/integrations/erp:
    get:
      tags: [integrations]
      operationId: getErpConnector
      summary: 'Коннектор ERP: состояние сопряжения'
      description: >-
        CRM `GET /integrations/erp`. Значения токенов не возвращаются — только «задан» и последние 4 символа.
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpConnector'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/integrations/erp/check:
    post:
      tags: [integrations]
      operationId: checkErpConnector
      summary: 'Проверить связь с ERP'
      description: >-
        CRM `POST /integrations/erp/check` (проба до 5 с). ERP отвечает лимитом частоты — это `status = rate_limited`, не
        ошибка. Раздел `admin` — полный. `INTEGRATION_FAILED` (502) — причина в `details.reason` (`erp_unauthorized`,
        `erp_unavailable`, `erp_bad_response`); `NOT_CONFIGURED` (409) — ERP не подключена.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpCheck'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IntegrationConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/IntegrationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/integrations/erp/pair:
    post:
      tags: [integrations]
      operationId: pairErp
      summary: 'Подключить ERP (сопряжение по одноразовому коду)'
      description: >-
        CRM `POST /integrations/erp/pair`: CRM сама генерирует токены обоих направлений и секрет вебхуков, передаёт их ERP
        по коду, сохраняет зашифрованными и сразу проверяет связь. Пароль администратора обязателен и уходит только в CRM.
        Сопряжение удалось, даже если проверка не прошла: `check = null`, `check_error` — причина.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpPairIn'
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpPairing'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IntegrationConflict'
        '422':
          $ref: '#/components/responses/IntegrationInvalid'
        '423':
          $ref: '#/components/responses/AccountLocked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/IntegrationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/integrations/erp/rotate:
    post:
      tags: [integrations]
      operationId: rotateErpKeys
      summary: 'Ротация ключей ERP'
      description: >-
        CRM `POST /integrations/erp/rotate`: новая тройка секретов; прежний токен действует на переходный период
        (`ErpConnector.previous_secret_until`). Пароль администратора обязателен.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordConfirm'
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpPairing'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IntegrationConflict'
        '422':
          $ref: '#/components/responses/IntegrationInvalid'
        '423':
          $ref: '#/components/responses/AccountLocked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/IntegrationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/integrations/telegram:
    get:
      tags: [integrations]
      operationId: getTelegramConnector
