        initials:
          type: string
          maxLength: 3

    LoginIn:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true

    Session:
      type: object
      additionalProperties: false
      required: [me, expires_at, must_change_password]
      properties:
        me:
          $ref: '#/components/schemas/Me'
        must_change_password:
          type: boolean
          description: true — SPA сразу ведёт на смену пароля; остальные разделы недоступны до смены
        expires_at:
          type: string
          format: date-time

    Me:
      type: object
      additionalProperties: false
      required: [id, email, name, initials, language, roles, modules, resources, access, onboarding_done]
      properties:
        id:
          type: string
          description: '`crm_user_id`'
        email:
          type: string
          format: email
        name:
          type: string
        initials:
          type: string
          maxLength: 3
        position:
          type: string
          description: Должность — текст (не роль)
        avatar_url:
          type: string
          description: Адрес фото на BFF (`/staff/{id}/avatar?v=…`, тот же origin); нет — рисуются инициалы
        language:
          $ref: '#/components/schemas/Language'
        roles:
          type: array
          minItems: 1
          description: Роли сотрудника (названия — данные CRM)
          items:
            $ref: '#/components/schemas/RoleRef'
        active_role:
          description: >-
            Id роли, выбранной в профиле («вид»): при заданной роли `modules`, `resources`, `restricted_fields`, «Моя очередь»
            и карточки считаются только по ней; пусто — по объединению всех ролей. На права операций не влияет: BFF проверяет
            их по объединению ролей.
          oneOf:
            - $ref: '#/components/schemas/RoleId'
            - type: 'null'
        modules:
          type: array
          description: Модули рейла в порядке показа — для активной роли, если задана, иначе для объединения ролей
          items:
            $ref: '#/components/schemas/ModuleCode'
        resources:
          type: object
          description: >-
            Разделы каталога `platform-rbac.yaml` → уровень (максимум по матрицам ролей) — для активной роли, если задана,
            иначе для объединения ролей. Видимость пункта меню — по секции `menu` того же файла.
          additionalProperties:
            $ref: '#/components/schemas/AccessLevel'
        restricted_fields:
          type: array
          description: Поля с ограничением, которые сотруднику видны
          items:
            $ref: '#/components/schemas/RestrictedField'
        access:
          type: object
          additionalProperties: false
          required: [crm, erp]
          properties:
            crm:
              type: boolean
            erp:
              type: boolean
        onboarding_done:
          type: boolean
          description: >-
            Приветствие и тур первого входа уже показаны («Пропустить» или «Больше не показывать»); `false` — SPA показывает
            карточку «Добро пожаловать». Флаг хранит CRM (`PUT /me/onboarding`), а не браузер.
        whats_new_shown:
          description: >-
            W-REL. Дата записи «Что нового» (`2026-10-28`), о которой окно «Платформа обновлена» уже показано; `null` — ни
            одной. Запись новее — SPA один раз показывает окно. Хранит CRM (`PUT /me/whats-new`).
          oneOf:
            - $ref: '#/components/schemas/WhatsNewDate'
            - type: 'null'
        whats_new_read:
          description: >-
            W-REL. Дата последней открытой записи «Что нового»; запись новее — у «?» отметка «Новое», пока сотрудник её не
            откроет. `null` — не открывал ни одной.
          oneOf:
            - $ref: '#/components/schemas/WhatsNewDate'
            - type: 'null'

    WhatsNewDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: Запись «Что нового» — дата выкладки (`docs/kb/help/changelog/<дата>.md`)

    WhatsNewMark:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        shown:
          $ref: '#/components/schemas/WhatsNewDate'
        read:
          $ref: '#/components/schemas/WhatsNewDate'

    TicketSubject:
      type: string
      enum: [access, notification, template, error, other]
      description: Тема обращения — «Нужен доступ к разделу», «Не приходит уведомление», «Нужен шаблон документа», «Ошибка», «Другое»

    TicketStatus:
      type: string
      enum: [new, in_progress, resolved]
      description: «Новое», «В работе», «Решено»

    TicketCreate:
      type: object
      additionalProperties: false
      required: [subject, body]
      properties:
        subject:
          $ref: '#/components/schemas/TicketSubject'
        body:
          type: string
          minLength: 1
          maxLength: 20000
          description: >-
            Что случилось — до 4000 символов после обрезки пробелов (длиннее — 422 `ticket_text_too_long`). BFF сам дописывает
            в конец строку «Версия: Платформа 2026.10.28 · 1a2b3c4» (W-REL), если она помещается в предел.
        page:
          type: string
          maxLength: 2000
          description: Внутренний путь страницы Платформы с запросом (`/eds/inbox?panel=open`); внешний адрес — 422

    TicketReply:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 20000
        status:
          $ref: '#/components/schemas/TicketStatus'

    TicketStatusChange:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'

    TicketAuthor:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          description: '`crm_user_id`'
        name:
          type: string

    TicketRow:
      type: object
      additionalProperties: false
      required: [number, subject, status, author, preview, replies, created_at, updated_at]
      properties:
        number:
          type: string
          pattern: '^ОБР-[0-9]{1,9}$'
          examples: [ОБР-0012]
        subject:
          $ref: '#/components/schemas/TicketSubject'
        status:
          $ref: '#/components/schemas/TicketStatus'
        author:
          $ref: '#/components/schemas/TicketAuthor'
        author_role:
          type: string
          description: Роли автора на момент обращения (текст; подставляет BFF)
        page:
          type: string
          description: Страница, с которой написано обращение
        preview:
          type: string
          description: Начало текста для списка
        replies:
          type: integer
          minimum: 0
          description: Сколько ответов администратора
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TicketMessage:
      type: object
      additionalProperties: false
      required: [body, created_at]
      properties:
        author_name:
          type: string
          description: Кто ответил (администратор); пусто, если сотрудник удалён
        body:
          type: string
        created_at:
          type: string
          format: date-time

    Ticket:
      type: object
      additionalProperties: false
      required: [number, subject, status, author, preview, replies, created_at, updated_at, body, messages]
      properties:
        number:
          type: string
          pattern: '^ОБР-[0-9]{1,9}$'
          examples: [ОБР-0012]
        subject:
          $ref: '#/components/schemas/TicketSubject'
        status:
          $ref: '#/components/schemas/TicketStatus'
        author:
          $ref: '#/components/schemas/TicketAuthor'
        author_role:
          type: string
          description: Роли автора на момент обращения (текст; подставляет BFF)
        page:
          type: string
          description: Страница, с которой написано обращение
        preview:
          type: string
        replies:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        body:
          type: string
          description: Полный текст обращения
        messages:
          type: array
          description: Ответы администратора по порядку
          items:
            $ref: '#/components/schemas/TicketMessage'
        resolved_at:
          type: string
          format: date-time

    TicketList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketRow'

    TicketCounts:
      type: object
      additionalProperties: false
      required: [new, in_progress, resolved]
      properties:
        new:
          type: integer
          minimum: 0
        in_progress:
          type: integer
          minimum: 0
        resolved:
          type: integer
          minimum: 0

    TicketPage:
      type: object
      additionalProperties: false
      required: [items, total, counts]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketRow'
        total:
          type: integer
          minimum: 0
          description: Сколько обращений подходит под фильтр
        counts:
          $ref: '#/components/schemas/TicketCounts'

    ChangePasswordIn:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
        new_password:
          type: string
          minLength: 8
          maxLength: 256
          writeOnly: true

    EmployeeStatus:
      type: string
      enum: [active, invited, disabled]

    ErpSyncState:
      type: string
      enum: [ok, pending, error, not_applicable]
      description: Итог провижининга в ERP

    Employee:
      type: object
      additionalProperties: false
      required: [id, name, initials, email, roles, access, status, telegram_linked, erp_sync]
      properties:
        id:
          type: string
        name:
          type: string
        initials:
          type: string
          maxLength: 3
        email:
          type: string
          format: email
        position:
          type: string
          maxLength: 120
          description: Должность — текст, не роль
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        access:
          type: object
          additionalProperties: false
          required: [crm, erp]
          properties:
            crm:
              type: boolean
            erp:
              type: boolean
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        telegram_linked:
          type: boolean
          description: Привязан Telegram для уведомлений сотруднику
        erp_sync:
          $ref: '#/components/schemas/ErpSyncState'
        erp_sync_error:
          type: string
          description: Текст последней ошибки провижининга ERP (из CRM), если `erp_sync = error`

    EmployeeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Employee'

    EmployeeInvite:
      type: object
      additionalProperties: false
      required: [email, name, role_ids]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 120
        position:
          type: string
          maxLength: 120
        role_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleId'

    EmployeeCredentials:
      type: object
      additionalProperties: false
      required: [employee, temporary_password]
      description: Сотрудник и его временный пароль — показывается администратору один раз, повторно получить нельзя
      properties:
        employee:
          $ref: '#/components/schemas/Employee'
        temporary_password:
          type: string
          minLength: 1
          description: Одноразовый временный пароль; сотрудник обязан сменить его при входе. Не логируется и не кэшируется

    Bridge:
      type: object
      additionalProperties: false
      required: [crm_url, erp_url, erp_sso]
      properties:
        crm_url:
          type: [string, 'null']
          description: Публичный адрес старой CRM без завершающего `/`; `null` — не задан и не выводится
          examples: ['https://crm.example']
        erp_url:
          type: [string, 'null']
          description: Публичный адрес старого ERP без завершающего `/`; `null` — не задан и не выводится
          examples: ['https://erp.example']
        erp_sso:
          type: boolean
          description: Сотрудника можно впустить в старый ERP без второго пароля (`POST /bridge/erp-sso`)

    BridgeErpSso:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          description: '`{ERP}/sso/exchange#token=…`; токен одноразовый, живёт 60 секунд, в журнал не пишется'

    SetupState:
      type: object
      additionalProperties: false
      required: [needs_admin]
      properties:
        needs_admin:
          type: boolean
          description: В CRM ещё нет активного администратора — нужен экран «Первый запуск»

    SetupAdminIn:
      type: object
      additionalProperties: false
      required: [code, name, email, password]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Одноразовый код первого запуска из журнала `crm-api` (`setup_code_issued`)
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
          description: Правила пароля проверяет CRM; слабый — 422 `VALIDATION_FAILED` (`details.fields = [password]`)

    SetupStepKey:
      type: string
      enum: [erp, bot, mail, models, first_employee]
      description: Пять шагов чек-листа (SPEC-v3 §7.6) в порядке выполнения — ERP, бот, почта, модели ИИ, первый сотрудник

    SetupStepState:
      type: string
      enum: [done, todo, unknown]
      description: '`unknown` — бэкенд не ответил или не отдал данные; чек-лист при этом не падает'

    SetupStep:
      type: object
      additionalProperties: false
      required: [key, state]
      properties:
        key:
          $ref: '#/components/schemas/SetupStepKey'
        state:
          $ref: '#/components/schemas/SetupStepState'

    SetupCompanyStatus:
      type: object
      additionalProperties: false
      required: [required, can_setup]
      properties:
        required:
          type: boolean
          description: Своей компании в ERP ещё нет
        can_setup:
          type: boolean
          description: Текущий сотрудник может её создать (суперпользователь ERP)

    SetupChecklist:
      type: object
      additionalProperties: false
      required: [steps, done, total, company, company_blocker]
      properties:
        steps:
          type: array
          description: Всегда пять шагов в порядке `SetupStepKey`
          items:
            $ref: '#/components/schemas/SetupStep'
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 5
          maximum: 5
        company:
          oneOf:
            - $ref: '#/components/schemas/SetupCompanyStatus'
            - type: 'null'
          description: Шаг мастера «своя компания»; `null` — данных нет, причина в `company_blocker`
        company_blocker:
          oneOf:
            - $ref: '#/components/schemas/SetupCompanyBlocker'
            - type: 'null'
          description: Почему нет данных о компании (`company = null`); `null`, когда данные есть

    SetupCompanyBlocker:
      type: string
      enum: [erp_not_connected, erp_unavailable]
      description: >-
        `erp_not_connected` — ERP не сопряжена (CRM: коннектор не задан): сначала шаг «ERP», компания невозможна.
        `erp_unavailable` — ERP сопряжена, но не ответила или не выдала сессию администратору: повторить позже

    SetupCompanyIn:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        inn:
          type: string
          maxLength: 20
        legal_address:
          type: string
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 254
          description: Пусто или корректный адрес (проверяет ERP)

    SetupCompanyCreated:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    EmployeeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role_ids:
          type: array
          uniqueItems: true
          minItems: 1
          description: Полный новый набор ролей, хотя бы одна; пустой набор — 422 `ROLES_REQUIRED` (0.6.0)
          items:
            $ref: '#/components/schemas/RoleId'
        position:
          type: string
          maxLength: 120
        is_active:
          type: boolean
        transfer_to_user_id:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: >-
            Кому передать лиды в работе (`crm_user_id` коллеги), если отключение или новые роли отнимают у сотрудника работу
            с лидами; без поля при таких лидах — 409 `CONFLICT` (`details.reason = user_has_active_leads`)

    MeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        language:
          $ref: '#/components/schemas/Language'
        active_role:
          oneOf:
            - $ref: '#/components/schemas/RoleId'
            - type: 'null'

    InvalidationTopic:
      type: string
      enum: [notifications, counters, queue, activity, messages]
      description: >-
        Что перезапросить: `notifications` — `listNotifications`; `counters` — `getMenuCounters`; `queue` — `getQueue`
        и `getQueueCards`; `activity` — `getActivityToday`; `messages` (0.22.0) — `listCrmMessages` и открытая лента
        `getCrmThread` / `getCrmConversation`.

    InvalidationHint:
      type: object
      description: Данные кадра `invalidate` потока `/events/stream` — подсказка, не данные события.
      additionalProperties: false
      required: [topics, reason]
      properties:
        topics:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/InvalidationTopic'
        reason:
          type: string
          description: Тип события шины (`uz.railtech.erp.quote.sent.v1`) или `resync` (слушатель BFF переподключился — перезапросите всё)

    Health:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties: false
          required: [redis, crm, erp]
          properties:
            redis:
              type: string
              enum: [ok, fail]
            crm:
              type: string
              enum: [ok, fail]
            erp:
              type: string
              enum: [ok, fail]
        version:
          type: string

    About:
      type: object
      additionalProperties: false
      required: [release, services, checked_at]
      properties:
        release:
          $ref: '#/components/schemas/Release'
        services:
          type: array
          description: BFF, CRM, ERP и EDS — в этом порядке
          items:
            $ref: '#/components/schemas/ServiceVersion'
        checked_at:
          type: string
          format: date-time

    Release:
      type: object
      additionalProperties: false
      required: [version]
      description: >-
        Версия Платформы: «Платформа 2026.10.28 · 1a2b3c4» — `version` и `sha`. Один релиз — один sha для всех образов
        ансамбля (deploy.yml выкладывает их одним тегом).
      properties:
        version:
          type: string
          description: Дата выкладки `ГГГГ.ММ.ДД` (нет даты выкладки — дата сборки образа); локальная сборка — `dev`
        sha:
          type: string
          description: Короткий sha коммита релиза (7 знаков); нет — локальная сборка
        released_at:
          type: string
          format: date
          description: Дата выкладки на сервер (deploy.sh); нет — выкладка без даты
        built_at:
          type: string
          format: date
          description: Дата сборки образа BFF

    ServiceVersion:
      type: object
      additionalProperties: false
      required: [key, status]
      properties:
        key:
          type: string
          enum: [bff, crm, erp, eds]
        status:
          type: string
          enum: [ok, fail, disabled]
          description: '`ok` — health ответил 200; `fail` — не ответил за 3 с или ошибка; `disabled` — сервис не подключён (EDS без адреса)'
        version:
          type: string
          description: Версия сервиса, если его health её сообщает

    MenuCounter:
      type: object
      additionalProperties: false
      required: [module, section, count, attention]
      properties:
        module:
          $ref: '#/components/schemas/ModuleCode'
        section:
          type: string
          description: Ключ раздела подменю (`queue`, `inbox`, `drafts`, `approvals`, `payments`, `calc`, `leads`, `messages`…)
        count:
          type: integer
          minimum: 0
        attention:
          type: boolean
          description: true — красный бейдж «требует действия», false — серый счётчик

    MenuCounters:
      type: object
      additionalProperties: false
      required: [items, sources]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuCounter'
        sources:
          $ref: '#/components/schemas/Sources'

    QueueItemKind:
      type: string
      description: Вид действия; какой раздел и уровень нужен — секция `queue` каталога `platform-rbac.yaml`
      enum:
        - answer_lead
        - take_lead
        - create_request
        - service_request
        - resolve_letter
        - approve_quote
        - approve_memo
        - rework_document
        - problem_project
        - calc_task
        - supplier_overdue
        - confirm_payment
        - issue_invoice
        - issue_contract
        - attach_scan
        - pay_memo
        - overdue_invoice
        - ticket
        - integration_issue

    DueLabel:
      type: string
      enum: [overdue, today, tomorrow, later, memo]
      description: Бейдж срока — red «просрочено», red «срок сегодня», gold «завтра», default — дата, purple «служебка»

    ForgotPasswordIn:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: Почта (логин) сотрудника

