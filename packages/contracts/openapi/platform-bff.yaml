openapi: 3.1.0
info:
  title: RailTech Platform — BFF API (Платформа → CRM и ERP)
  version: 0.27.0
  summary: Пространство `/api/v1/` BFF Платформы — вызывает SPA `apps/platform/web` от имени сотрудника.
  description: |
    Контракт по ADR-0011 и `docs/architecture/platform-bff.md`. Версия 0.1.0 (INF-P0-1) покрывает фазу P1:
    сессия, профиль, счётчики меню, «Моя очередь», лента «Сегодня», уведомления, поиск. Экраны фаз P2–P4 добавляются
    в этот файл до кода (`docs/architecture/integration-map.md` §1).

    **Версия и журнал (DECISIONS 2026-10-28).** Добавляющее изменение `info.version` не поднимает и строку журнала ниже не
    добавляет — что изменилось, пишется в описании PR. Минор растёт только с ломающим изменением (до 1.0, oasdiff ERR).
    Журнал версий ниже — история до 2026-10-28, новые строки в него не добавляются.

    Словарь — SPEC-v3 §2 (`docs/product/SPEC-v3.md`): старых кодов стадий и статусов CRM и ERP в ответах нет.
    BFF не имеет своей базы: данные приходят из CRM и ERP, каждый вызов бэкенда — с токеном сотрудника.

    **Сессия.** `POST /auth/login` ставит cookie `rt_pf_session` (`HttpOnly; Secure; SameSite=Lax; Path=/`) и CSRF-cookie
    `rt_pf_csrf` (читается скриптом). Каждый `POST`, `PUT`, `PATCH`, `DELETE`, кроме `/auth/login` и `/setup/admin` (оба без сессии), несёт заголовок
    `X-CSRF-Token` со значением CSRF-cookie; без него или с другим значением — 403 `CSRF_FAILED`. Истёкшая или
    отозванная сессия — 401 `SESSION_EXPIRED`.

    **Ошибки.** Тело любой ошибки — `Error`: стабильный `code`, текст на языке сотрудника, источник (`crm`, `erp`, `bff`)
    и детали бэкенда для разбора.

    **Частичные данные.** Агрегирующие ответы несут `sources`: если один бэкенд не ответил за 3 с, ответ 200 с данными
    второго и `sources.<бэкенд> = unavailable`; SPA показывает плашку «данные неполные».

    **Номера объектов** — бизнес-номера SPEC-v3 §2.2 (`ЗВ-2026-104`, `L-2041`); внутренних идентификаторов бэкендов в
    ссылках нет.

    0.2.0 (волна 8): смена пароля (`POST /auth/change-password`, `Session.must_change_password`); Admin · Оргструктура —
    сотрудники, выдача ролей Платформы, приглашение по почте (`/admin/users*`, раздел матрицы `admin`).

    **0.4.0 (R-1b, ADR-0012 п. 2) — ломающее (до 1.0 допустимо).** Директор видит Ролевую матрицу только для чтения:
    `GET /admin/roles` и `GET /admin/roles/{id}` — от `admin: read` (раньше `full`), создание, изменение, удаление и
    `POST /admin/roles/preview` — по-прежнему `admin: full`. Оптимистическая блокировка роли: `Role.version` (целое, растёт при
    каждом изменении), `RoleUpdate.version` — обязательное поле (ломающее: тело PATCH без него — 422); устаревшая версия —
    409 `CONFLICT` с `details.reason = role_version_conflict` и `details.current_version`. Системная роль «Директор»: лиды
    (`crm.leads`) и внешние чаты (`chats.external`) — только чтение (`platform-rbac.yaml`), поэтому «Моя очередь» директора без видов
    «ответить лиду» и «взять лид».

    **0.3.0 (R-2, ADR-0012) — ломающее (до 1.0 допустимо): роли — данные.** Роль сотрудника — `RoleRef {id, name,
    system, code?}` вместо перечисления `RoleCode` (удалено): `Me.roles: RoleRef[]`, `Me.active_role` и `MeUpdate.active_role` —
    id роли или `null`; `Employee.roles: RoleRef[]`, `EmployeeInvite.role_ids`, `EmployeeUpdate.role_ids`; параметр `role` очереди
    и карточек — id роли; `QueueItem.role` → `QueueItem.role_id`. Доступ сотрудника (`Me.modules`, `Me.resources`,
    `Me.restricted_fields`) — объединение матриц его ролей (матрицы и права бэкендов считает CRM), «вид» — по активной роли,
    как в 0.2.2. Новое: Admin · Ролевая матрица — `GET/POST /admin/roles`, `GET/PATCH/DELETE /admin/roles/{id}`,
    `POST /admin/roles/preview` («что произойдёт»); `POST /admin/users/{id}/invite` (повтор приглашения);
    `EmployeeUpdate.transfer_to_user_id` (кому передать лиды при отключении или смене ролей); `Employee.erp_sync` и
    `erp_sync_error` — из CRM. Коды ошибок: `ROLE_IN_USE`, `ROLE_SYSTEM`, `LAST_DIRECTOR` (вместе с `LAST_ADMIN`) и `CONFLICT` с
    `details.reason` (`user_has_active_leads`, `name_taken`) или `details.invite = not_sent`; у каждого 409 в `details.reason` —
    код CRM. Каталог разделов, меню, полей и видов очереди — `packages/contracts/platform-rbac.yaml` версии 2.

    **0.5.0 (B5, ADR-0014) — поток вместо опроса.** `GET /events/stream` (SSE, `text/event-stream`): BFF — подписчик шины
    событий `rt_bus`, на событие ERP, лида CRM или сотрудника шлёт открытому соединению подсказку инвалидации
    `InvalidationHint {topics, reason}`; SPA перезапрашивает уведомления, счётчики меню, «Мою очередь» и ленту «Сегодня»
    обычными API (с проверкой прав). Данных событий в потоке нет. Пока поток жив, опрос — редкий (5 минут), при обрыве —
    прежние 30 секунд. Чисто добавляющее изменение.

    **0.8.0 (W13-A3) — Admin · Компания.** Чисто добавляющее изменение: `GET/PATCH /admin/company` (реквизиты), `/admin/company/logo`
    (загрузка `multipart/form-data` и удаление), `/admin/company/brand` (+ `/logo`, `/preview`) — бланк и бренд документов,
    `/admin/company/numbering` (+ `/preview`), `/admin/company/quote-defaults`, `/admin/company/charge-types` и `charge-templates`,
    `/admin/company/document-templates` (+ `placeholders`, `preview`, `{id}/copy`), `/admin/company/email-templates` (+ `{id}/preview`),
    `/admin/company/reference/{kind}` (страны, валюты, единицы, базисы поставки), `/admin/company/categories`,
    `/admin/company/category-requests` (+ `approve`, `reject`), `/admin/company/platform-settings`. Доступ — раздел `company.settings`
    (чтение — `GET` и предпросмотры, полный — изменения). BFF только проксирует к ERP с токеном сотрудника и сам находит свою компанию по
    профилю сотрудника в ERP; нет компании — 409 `COMPANY_NOT_SET`. Ошибки ERP: 400 -> 422 `VALIDATION_FAILED` (`details.reason` —
    код ERP в нижнем регистре, `details.fields`), «используется», «префикс занят» и «уже рассмотрен» -> 409 `CONFLICT` с
    `details.reason`. Поля маржи `QuoteDefaults` вырезаются без права на группу `cost_margin` (правило 6 CONVENTIONS).

    **0.6.0 (R-1c, R3-D-1) — ломающее (до 1.0 допустимо).** У сотрудника хотя бы одна роль: `EmployeeUpdate.role_ids` —
    `minItems: 1`, пустой набор — 422 `ROLES_REQUIRED` (`details.fields = [role_ids]`), в CRM запрос не уходит; тот же код —
    перевод отказа CRM `roles_required` (CRM API 0.3.0). Закрыть доступ — `is_active = false` («Отключить сотрудника»).

    **0.7.0 (W13-A1) — добавляющее.** Admin · Внешние интеграции (SPEC-v3 §7.6, тег `integrations`): обзор `GET /admin/integrations`
    (карточки со статусом пятью уровнями — `ok`, `warn`, `fail`, `unknown`, `off` — уровни реестра внешних сервисов CRM, ADR-0024 CRM,
    последняя активность и список «Требует внимания») и прокси к CRM под `/admin/integrations/*`: коннектор ERP (проверка,
    сопряжение, ротация ключей), Telegram-бот (токен, канал команды, профиль), почта SMTP (настройки, проверка, тестовое
    письмо, журнал), реестр внешних сервисов (проверка, выключатель), модели ИИ (смена, сброс, проверка), расходы, бэкапы,
    состояние системы. Чтение — раздел `admin` от `read`; всё изменяющее и каждая проверка — `admin: full` (директору — 403).
    Секреты (токен бота, ключи моделей, пароль SMTP, коды сопряжения) BFF только передаёт в CRM и не возвращает — в ответах
    маски (`configured`, `*_last4`). Изменение секретов подтверждается паролем администратора (`password`, повторный ввод):
    он уходит только в CRM. Коды ошибок: `WRONG_PASSWORD` (422), `NOT_CONFIGURED`, `SECRETS_KEY_MISSING`,
    `SERVICE_NOT_SWITCHABLE` (409), `INTEGRATION_FAILED` (502, причина в `details.reason`).

    **0.9.0 (W13-A2) — добавляющее.** Admin · Журнал интеграций (тег `bus`): шина `rt_bus` всех трёх доменов в одном журнале
    вместо CLI `bus status|retry` и Django admin ERP. `GET /admin/bus` — сводка по доменам (outbox, DLQ, inbox с ошибками) и
    подписчики с состоянием словом (`BusSubscriberState`: работает, ошибки подряд, пауза предохранителя до `paused_until`,
    есть DLQ, выключен, убран из подписок); `GET /admin/bus/deliveries` — доставки с фильтрами (домен, статус, подписчик,
    подстрока типа, период), DLQ — `status=dead`; `GET /admin/bus/inbox` — принятые события (`errors=true` — обработка упала
    или ждёт автоповтора); повторы `POST /admin/bus/{domain}/deliveries/{id}/retry`, `…/deliveries/retry-dead` (все `dead`
    подписчика), `…/inbox/{event_id}/retry`. Списки трёх доменов сливаются по времени, страница — непрозрачный `cursor` из
    `next_cursor`; домен, который не ответил или отказал, — `sources.<домен>`, ответ 200 с остальными. Только раздел
    `admin: full` (директору — 403 в BFF); в каждый домен — с токеном сотрудника: CRM и ERP — как раньше, EDS — токен
    сотрудника CRM `aud=eds` → `POST /api/v1/auth/sso/exchange` EDS (`docs/architecture/sso-token.md`), 15 минут, в сессии BFF.
    Тел событий нет — только метаданные доставки. `Error.source` дополнен `eds`.

    **0.10.0 (W13-A4) — добавляющее.** Первый запуск в Платформе (SPEC-v3 §7.6, тег `setup`): вместо `/setup` CRM и мастера ERP.
    Без сессии: `GET /setup/state` (CRM `/setup/state`: администратора ещё нет — `needs_admin`) и `POST /setup/admin` (одноразовый
    код первого запуска из журнала `crm-api`, имя, почта, пароль -> первый администратор; ответ — как у входа: `Session` и cookie).
    С сессией, раздел `admin` — полный: `GET /setup/checklist` (чек-лист из пяти шагов — бот, ERP, почта, модели ИИ, первый
    сотрудник — по ответам CRM; шаг мастера «своя компания» — по ERP `setup/status`) и `POST /setup/company` (ERP `setup/company`,
    токеном администратора). Приглашение без почты: `POST /admin/users` создаёт сотрудника и возвращает **временный пароль один
    раз**, `POST /admin/users/{id}/temporary-password` выдаёт новый временный пароль существующему сотруднику (CRM
    `/users/{id}/reset-password`; прежний пароль и сессии сотрудника перестают действовать). Пароль приходит только в этом ответе
    (`Cache-Control: no-store`): BFF его не пишет в журнал, не кэширует и не хранит, а повторно получить его нельзя — только выдать
    новый; сотрудник при входе обязан сменить его (`Session.must_change_password`, `POST /auth/change-password`). Коды ошибок:
    `SETUP_DONE` (409), `SETUP_CODE_INVALID`, `SETUP_CODE_EXPIRED` (422), `SETUP_LOCKED` (429, 15 минут после десяти неверных
    кодов), `OWN_COMPANY_ALREADY_EXISTS` (409). Право: чек-лист и мастер компании видит и выполняет только `admin: full` — CRM
    `/setup/checklist` требует право записи настроек; директору баннер не показывается.

    **0.11.0 (W13-A5) — добавляющее.** CRM · База знаний и Admin · Настройки бота (теги `kb` и `bot`). **База знаний** (`/crm/kb/*`,
    `/crm/sandbox/*`): документы (список, загрузка файла `.md` multipart, ручной ввод, включение и выключение, переиндексация,
    фрагменты), поиск «Что найдёт бот», пробелы (закрыть привязкой к документу, игнорировать, вернуть), справочник продуктов,
    песочница бота (сообщение, «начать заново»). Читают роли с `crm.leads` или `admin`; правят, переиндексируют и пользуются
    песочницей — `admin: full`. **Настройки бота** (`/admin/bot/*`): разделы CRM `/settings` значениями и JSON Schema (форма строится
    по схеме CRM), сохранение раздела, пробный прогон правил передачи, шаблоны быстрых ответов, выгрузки CSV лидов, клиентов и
    сделок — потоком, с правом на выгружаемые данные (`crm.leads` для лидов, `crm.clients` для клиентов и сделок). Чтение настроек
    — `admin` от `read`, правка — `admin: full`. Каталог ролей: директор (`admin: read`) читает настройки бота, шаблоны ответов и
    базу знаний (права CRM `settings:read`, `reply_templates:read`, `kb:read`); пункт меню CRM «База знаний» открывает и раздел
    `admin`; в Admin новый пункт «Настройки бота». Нового кода ошибки нет: ошибки формата документа и пути невалидных полей настроек
    — `VALIDATION_FAILED` с `details.reason`, `details.rule`, `details.messages`, `details.paths`.

    **0.13.0 (W13C-F6) — Admin · Компания: ручной ввод курса USD→UZS.** Чисто добавляющее изменение: `GET /admin/company/fx-rate`
    (текущий курс на сегодня с датой и источником «авто»/«вручную», допустимый возраст курса и журнал последних записей: ручные
    вводы и случаи «автокурс ЦБ не применён») и `POST /admin/company/fx-rate` (курс на дату вручную, на случай, если автозагрузка
    `erp-beat` не сработала). Раздел `company.settings`: чтение — `GET`, ввод — полный (в ERP — право `settings.edit`). Курс на дату
    заменяет и курс ЦБ, и прежний ручной (прежнее значение остаётся в журнале); автозагрузка ручной курс на ту же дату не
    перетирает. Отказ проверки — 422 `VALIDATION_FAILED` с `details.reason` (`fx_rate_invalid`, `fx_rate_date_invalid`,
    `fx_rate_date_in_future`, `fx_rate_date_too_old`) и `details.fields` (`rate_to_uzs` или `rate_date`).

    **0.12.0 (W13-A6) — Admin · Оргструктура, Журнал аудита, профиль.** Чисто добавляющее изменение: `POST /admin/users/{id}/reset-password/email`
    (сброс пароля сотрудника с письмом; себе — 409 `CONFLICT` с `details.reason = self_reset`; почта не подключена — 409
    `NOT_CONFIGURED`), `GET /admin/audit` (журнал аудита CRM «кто, что, когда» с фильтрами по автору, действию, объекту и периоду и
    постраничным ответом), `GET /admin/roles/{id}/journal` (изменения роли: кто, когда и что — матрица до и после; вкладка «Журнал»
    роли, скрытая с R-1b), `GET/PATCH /me/notification-settings` и `POST /me/test-notification` (личные уведомления от бота: Telegram
    привязан ли, подписки, последняя неудача доставки, пробное сообщение). Журнал и журнал роли — раздел `admin` от чтения
    (директор читает), сброс пароля — `admin: full`; профиль доступен каждому вошедшему. Секреты из записей журнала BFF вырезает
    (значения полей `password`, `secret`, `token`, `key`, `*_key`, `credentials`, `authorization`, `pin` и им подобных -> `***` целиком, любого типа).

    **0.27.0 (D1-6b) — «Доработать» в «Моей очереди» автора.** Добавляющее изменение (новое значение enum `QueueItemKind` oasdiff считает требующим минора): `QueueItemKind` += `rework_document` (секция `queue`
    каталога: раздел `eds.memo.create`, уровень `full` — автор документа). Строка — документ сотрудника, который согласующий вернул на
    доработку (служебная записка, заявление, отчёт в статусе «Возвращён на доработку»): «Доработать: СЗ-… · тема», в подписи — кто вернул и его
    комментарий; срок — «нужно до» документа, без него — «сегодня»; `object.path` — `/eds/new?draft=<id документа>` (форма «Продолжить»). Строка
    исчезает, когда автор отправил документ снова. Источник — EDS (`GET /documents?mine=true&status=returned`) по токену сотрудника
    (`aud=eds`): что вернул EDS, то и строки. `Sources.eds` (необязательное, `SourceState`, с D1-6) — есть, когда ответ собран и из EDS: `unavailable` — EDS
    не ответил (остальные строки показаны), `not_applicable` — EDS не пустил сотрудника по его токену; без доступа к разделам EDS и без обращения
    к нему поля нет. Подсказка потока (SSE): решение по документу (`approval.decided`, в том числе возврат) -> тема `queue`.

    **0.25.0 (W15-H7) — помощь, первый вход и обращения к администратору.** Добавляющее изменение (тег `tickets`). **Обращения
    сотрудников** (домен CRM, ADR-0015): `POST /tickets` (тема из списка `access|notification|template|error|other`, текст,
    адрес страницы; роль автора BFF берёт из сессии), `GET /tickets` и `GET /tickets/{number}` — только свои обращения
    (чужое — 404), не больше пяти в час (429 `TOO_MANY_REQUESTS`, `details.reason = ticket_rate_limited`). Админ:
    `GET /admin/tickets` (список с фильтрами `status`, `subject`, постранично, `counts` по статусам), `GET /admin/tickets/{number}`,
    `POST /admin/tickets/{number}/reply` (ответ; новое обращение берётся «В работу», `status` задаёт итог) и
    `POST /admin/tickets/{number}/status` («Новое → В работе → Решено», «Решено» можно вернуть «В работу»; иначе 409
    `CONFLICT`, `details.reason = ticket_status_transition`). Раздел `admin`: чтение — директор, ответ и статус — администратор.
    Номер обращения — `ОБР-0012`, внутренних id в адресах нет. Ошибки значений — 422 `VALIDATION_FAILED` с `details.fields`
    и `details.reason` (`ticket_subject_unknown`, `ticket_text_empty`, `ticket_text_too_long`, `ticket_reply_empty`…).
    **Колокольчик** (`GET /notifications`) получил ленту CRM: идентификаторы `crm:<id>`, объект — обращение (`kind = ticket`);
    ответ и решение уходят автору, новое обращение — администраторам; `POST /notifications/{id}/read` и `read-all` отмечают
    обе ленты. **Первый вход:** `Me.onboarding_done` и `PUT /me/onboarding` («Пропустить» / «Больше не показывать» —
    флаг хранит CRM, не браузер).

    **D1-6 — EDS в «Моей очереди», счётчиках и поиске (версия не поднята: добавляющее изменение к 0.26.0).** Добавляющее изменение: `Sources.eds` (необязательное, `SourceState`) — есть, когда
    ответ собран и из EDS (письма без резолюции, служебки, заявления и отчёты на моём шаге маршрута, записи реестра в поиске); `unavailable` — EDS не
    ответил (остальное показано, плашка «раздел «Документы» не ответил»), `not_applicable` — EDS не пустил сотрудника по его токену (`aud=eds`).
    Без доступа к разделам EDS и без обращения к нему поля нет. Строки `QueueItem` видов `resolve_letter`, `approve_memo`, `pay_memo`, карточки
    `letters_without_resolution` и `memos_to_approve`, бейджи `eds.inbox` и `eds.approvals`, результаты поиска по номерам ВХ, ИСХ, КП, СЗ, ЗЯ, ОТ
    (реестр EDS с проверкой раздела каталога) — те же схемы `QueueItem`, `QueueCard`, `MenuCounter`, `SearchHit`. Строка очереди «ждут ответа клиенту»
    (`answer_lead`, `take_lead`) ведёт в `/crm/messages?lead=L-NNNN`, а не в карточку лида.

    **0.24.0 (D1-4) — EDS · КП на одобрение и документы на согласовании.** Добавляющее изменение, тег `eds-approvals`: `GET /eds/quotes`
    (КП на одобрение: «на моём шаге» или все), `GET /eds/quotes/{ref}` (карточка КП по id маршрута или номеру `КП-2026/115`: шаги маршрута,
    чек-лист с датой и автором, состав и итоги из ERP, письмо и заявка, каналы отправки по контакту клиента; **внутренний блок**
    `internal` — себестоимость, маржа, порог, сроки — и значение маржи в чек-листе BFF вырезает у роли без группы `cost_margin`),
    `POST /eds/quotes/{id}/decision` («Одобрить КП → отправить клиенту» с `channels`, «Вернуть на доработку», «Отклонить»; чек-лист
    проверяет EDS: красная блокирующая строка — 409 `checklist_not_green`, строка «срок» — предупреждение, КП одобряется с отметкой),
    `GET /eds/memo-approvals` и `GET /eds/memo-approvals/{ref}` (служебные записки, заявления, отчёты на согласовании; карточка по id
    документа или номеру `СЗ-2026/014`, шаги маршрута, вложения), `POST /eds/memo-approvals/{id}/decision` («Согласовать», «Вернуть
    на доработку», «Отклонить»). Разделы: КП — `eds.drafts` (полный — решение, чтение — менеджер); служебки — `eds.memo.approve`
    (полный — решение директора) или `eds.payments` (полный — решение бухгалтера на его шаге), чтение также у `eds.memo.create` (автор видит свой документ). `comment` для `return` и `reject` обязателен
    (422 в BFF до EDS). Ошибки EDS (`not_your_step`, `route_closed`, `checklist_not_green` с `details.failed`) приходят в формате `Error`.
    Карточка КП: `snapshot_total` (итог снимка EDS), `totals_mismatch` (итог ERP расходится со снимком), строки ERP не показываются при другой редакции КП в ERP;
    карточка документа: `accountant_step` (шаг бухгалтера — «Принять к оплате», решает держатель `eds.payments` full). Отправки КП по `channels` пока нет (Δ ERP-11).


    **0.23.0 (W15-H8) — Admin · Компания: шаблоны документов и лента.** Добавляющее изменение. `DocumentTemplateIn.kind` — вид
    шаблона при создании (`letter`, `report`, `custom`, `contract`, `invoice`, `act`, `receipt`, `delivery_note`; без поля — `custom`,
    как раньше); `DocumentTemplate.kind` отдаёт вид кодом. `DocumentTemplatePreviewIn.kind` — предпросмотр договора, счёта и акта идёт
    на каркасе своего вида и с образцами блоков (остальные виды — общий каркас и подписанные заглушки). `ActivityItem.code` — код
    административного события ERP (`admin.*`), по которому SPA собирает фразу на языке сотрудника; для остальных событий `null`.
    Журнал ручных курсов в ERP виден только с правом `settings.edit` (имена и почта коллег): `GET /admin/company/fx-rate` без
    этого права отдаёт текущий курс и пустой журнал с `journal_available = false` (не ошибку; директор раздел смотрит).

    **0.22.0 (D1-1, волна 16) — Клиенты · Ждут ответа.** Добавляющее изменение (тег `messages`): очередь передач от бота с
    запиской (CRM-06) и SLA — `GET /crm/messages`; карточка лида, лента диалога с подгрузкой истории и вложениями через BFF —
    `GET /crm/messages/{lead}`, `/thread`, `/attachments/{message}/{index}`; действия — `take`, `reply` (ключ повтора
    `client_message_id`: «Повторить» не дублирует сообщение; Telegram не ответил — 502 `INTEGRATION_FAILED`, `delivery_failed`),
    `note` (заметка команде), `assist` (подсказка ответа через CRM/LiteLLM), `return-to-bot`; шаблоны — `GET /crm/reply-templates`
    (раздел `crm.leads` полный). Чтение — `crm.leads` от чтения (директор), действия — полный. Новая тема подсказки потока
    `InvalidationTopic.messages`: событие CRM `lead.message_added` (новое сообщение в переписке) и события лида — экран
    перезапрашивает очередь и открытую ленту.
    **0.19.0 (W15-H1) — мост в старые экраны.** Добавляющее изменение (тег `bridge`). Пока раздел Платформы ещё заглушка, сотрудник
    открывает ту же работу в старой CRM или старом ERP новой вкладкой. `GET /bridge` отдаёт публичные адреса старых фронтов
    (`crm_url`, `erp_url`): настройки `PLATFORM_CRM_PUBLIC_URL` и `PLATFORM_ERP_PUBLIC_URL`, а если они пусты — адрес выводится из
    адреса, по которому открыта Платформа (`platform.<домен>` -> `crm.<домен>` и `erp.<домен>`, схема и порт те же); не задан и не
    выводится — `null`, SPA не показывает кнопку. `erp_sso` — у сотрудника есть доступ к ERP, и вход можно сделать без второго пароля.
    `POST /bridge/erp-sso` — тот же путь, каким старая CRM открывает ERP: BFF просит у CRM одноразовый SSO-токен (`POST
    /auth/sso/token`, живёт 60 секунд) токеном сотрудника и возвращает готовый адрес обмена `{ERP}/sso/exchange#token=…`; адрес
    ERP берёт сама CRM (`ERP_FRONTEND_URL`). Токен в журнал не пишется, ответ — `Cache-Control: no-store`. Права раздела не нужны:
    достаточно сессии и доступа к ERP (CRM не выдала токен — 403 `FORBIDDEN`, `details.reason`: `platform_access_denied` или
    `sso_disabled`).

    **0.17.0 (D1-5) — EDS · Создать документ и «Мои документы».** Добавляющее изменение, тег `eds-documents`: `GET/POST /eds/documents`
    (мои документы или реестр «Все документы»; создать и сразу отправить), `GET/PUT /eds/documents/{id}` (карточка с маршрутом и
    решениями; сохранить черновик), `POST /eds/document-files` и `GET /eds/document-files/{file_id}` (вложения: загрузка потоком до 25 МБ,
    multipart BFF не разбирает), `GET /eds/deal-options` (связь с проектом). Вызовы идут в EDS с токеном доступа, полученным
    обменом SSO-токена CRM `aud=eds` (`platform-bff.md` §3); нет прав EDS — 403 `FORBIDDEN`, `details.reason = eds_not_granted`. Ошибки EDS
    приходят в формате `Error` с `source = eds`: текст EDS сохраняется в `message`, 422 несёт `details.fields` (список полей) и
    `details.messages` (поле → причина). `Error.code` дополнен `PAYLOAD_TOO_LARGE` (413) и `UNSUPPORTED_MEDIA_TYPE` (415).

    **0.15.0 (W13C-F1) — первый запуск: ERP раньше компании (дефект гейта C2A-G-1).** Добавляющее изменение. Порядок шагов чек-листа —
    `erp`, `bot`, `mail`, `models`, `first_employee`: сначала подключается ERP, затем создаётся компания. Все пять шагов
    `GET /setup/checklist` приносит CRM (`/setup/checklist`, ключи `erp`, `mail`, `first_employee`), BFF сам их не вычисляет. Шаг
    «своя компания» спрашивает ERP только после сопряжения; почему данных о компании нет — `SetupChecklist.company_blocker`
    (`erp_not_connected` — сначала подключите ERP, `erp_unavailable` — ERP не ответила). `POST /setup/company` без сопряжённой ERP —
    409 `ERP_NOT_CONNECTED` (новый код) с текстом и `details.link` на карточку ERP; недоступная ERP — прежний 503 `BACKEND_UNAVAILABLE`.

    **0.17.0 (W15-H3) — здоровье интеграций: одна причина, одна строка, одно действие.** Добавляющее изменение. `GET
    /admin/integrations` и `GET /admin/integrations/services` отдают группы по причине (`ServiceGroup`: состояние `ServiceState`
    — «Сломано» только после 15 минут непрерывного сбоя, «Нестабильно» для дребезга, «Ожидаемо на стенде», «Не проверено»;
    «кто исправляет» `ServiceOwner`, действия `ServiceAction`, «с …», `flaps_24h`, готовый текст `message`, замаскированный
    `technical`), у сервисов — `state`, `cause_key`, `owner`, `action`, `since`, `flaps_24h`, `last_recovered_at`, у
    `AttentionItem` — `group` и `technical`, у компонентов состояния — `expected_on_stand`. Новый `PUT
    /admin/integrations/models/providers/{provider}/key` — ключ провайдера на все его роли одной операцией (один пароль, без
    частичного применения).

    **0.16.0 (D1-3) — EDS · Входящие письма и резолюция директора.** Добавляющее изменение, тег `letters`: `GET /eds/letters`
    (список со статусом словами интерфейса и фильтром по статусу), `GET /eds/letters/{ref}` (карточка письма по id или по
    номеру `ВХ-104/26`: реквизиты, суть, вложения, связи, журнал, шаг пути заявки; данные заявки — из ERP по ссылке письма,
    ERP не ответил — частичный ответ `sources.erp = unavailable`), `POST /eds/letters/{id}/resolution` («Утвердить резолюцию →
    задание в расчёт»), `POST /eds/letters/{id}/return` («Вернуть менеджеру»), `POST /eds/letters/{id}/reject` («Отклонить»,
    причина обязательна), `GET /eds/resolution/assignees` (кандидаты в исполнители по трём зонам — по разделам каталога, не по
    кодам ролей), `GET /eds/letter-files/{file_id}` (вложение потоком). Раздел `eds.inbox`: чтение — карточка без решений
    (менеджер, бухгалтер), полный — резолюция, возврат, отказ (директор). EDS — отдельный домен: вызовы идут с токеном доступа
    EDS, полученным обменом токена сотрудника CRM `aud=eds` (`docs/architecture/platform-bff.md` §3); ошибки EDS переводятся в
    формат `Error` (`source = eds`, `details.reason` и `details.fields` EDS сохраняются).

    **0.21.0 (W15-H6) — Профиль сотрудника.** Добавляющее изменение, тег `me`: `GET/PATCH /me/profile` (имя, телефон, язык, часовой
    пояс, подпись для писем; должность и роли только читаются, правит админ), `PUT/DELETE /me/avatar` и `GET /staff/{id}/avatar`
    (фото: клиент обрезает по кругу, CRM хранит в S3, BFF отдаёт без публичных ссылок; `Me.avatar_url` — вместо инициалов),
    `POST/DELETE /me/telegram-link` (сотрудник привязывает Telegram сам: ссылка `t.me/<бот>?start=staff_<одноразовый код>` на 10
    минут), `GET /me/deputy-candidates`, `PUT/DELETE /me/deputy` (замещение на период; заместитель видит очередь замещаемого:
    `QueueItem.on_behalf_of`, права на объекты — свои). Вход: `POST /auth/forgot-password` (ответ одинаков для любой учётной
    записи; ссылка уходит на почту или в Telegram, иначе тихо ничего) и `POST /auth/reset-password` (новый пароль по одноразовой
    ссылке; неверная или просроченная — 422 `VALIDATION_FAILED`, `details.reason = reset_token_invalid`). `Me.access` остаётся для
    совместимости, но экран «Доступ: CRM · ERP» убран: вместо него роли словами.

    **0.26.0 (W15-H8b) — «Состояние»: архив WAL, Redis, шина.** Добавляющее изменение: в реестре внешних сервисов (`GET
    /admin/external-services`) новые строки `wal_archive` (возраст последнего сегмента и базовой копии), `redis_broker` и
    `redis_cache` (PING, память, AOF/RDB), `bus_dlq` (недоставленные события шины, кроме ERP) и `eds_rights` (права EDS
    сотрудников опубликованы под действующим каталогом ролей; проверка сама повторяет публикацию); действие группы
    `open_bus` — «Открыть журнал обмена» (`/admin/bus`). Строки идут по общей политике H3 (одно «Сломано»/«Восстановлено»,
    «кто исправляет»). Карточка «Хранилище» учитывает `wal_archive`. Смена пароля самим сотрудником (CRM): прочие сессии
    закрываются сразу, текущая продолжается на новой паре токенов (`POST /auth/change-password` BFF по-прежнему 204).

    0.2.4: `423 ACCOUNT_LOCKED` объявлен и на `POST /auth/change-password` (CRM блокирует учётную запись после неверных
    текущих паролей).

    0.2.3 (Q-PLT-10-1): вход при недоступной ERP проходит (ERP подключается при первом обращении, агрегаты отдают
    `sources.erp = unavailable`); 503 на входе — только если не отвечает CRM; отключённый сотрудник получает
    `INVALID_CREDENTIALS` (CRM не различает «нет такого» и «отключён» — защита от перебора), `USER_DISABLED` остаётся для
    будущих путей; новый код `ACCOUNT_LOCKED` (423) — учётная запись временно заблокирована после неудачных попыток.

    0.2.2 (Q-PLT-12-1): `active_role` — «вид»: `modules`, `resources`, `restricted_fields` и очередь считаются по активной
    роли, если она задана; право на операцию BFF всегда проверяет по объединению всех ролей сотрудника (смена активной роли
    права не сужает и не расширяет). Пункты меню привязаны к разделам матрицы секцией `menu` в `platform-rbac.yaml`.

    0.2.1 (Q-P0-3): перечень `Error.code` дополнен `INTERNAL_ERROR` (500) и нейтральными кодами 4xx `BAD_REQUEST`,
    `METHOD_NOT_ALLOWED`, `HTTP_<статус>` для ответов, которые не относятся ни к одному именованному коду.

    Лимиты: вход — 10 неудачных попыток в минуту на IP и e-mail; «Забыли пароль?» — 5 запросов в час на IP и на адрес; остальные запросы — 300 в минуту на сессию; превышение — 429
    `TOO_MANY_REQUESTS` с `Retry-After`.
servers:
  - url: https://platform.railtech.uz/api/v1
    description: prod
  - url: https://platform.localhost/api/v1
    description: стенд ансамбля (infra/compose)
security:
  - platformSession: []
tags:
  - name: auth
    description: Вход логином CRM; токены CRM и ERP живут только в сессии BFF
  - name: bridge
    description: Мост в старые экраны CRM и ERP, пока раздел Платформы ещё заглушка (адреса и вход без второго пароля; нужна только сессия)
  - name: setup
    description: Первый запуск — администратор (без сессии), чек-лист из пяти шагов и своя компания (раздел `admin`)
  - name: me
  - name: system
  - name: dashboard
  - name: notifications
  - name: search
  - name: eds-documents
    description: EDS · Создать документ, «Мои документы» и реестр «Все документы», вложения, связь с проектом (прокси к EDS; раздел `eds.memo.create` и разделы EDS)
  - name: events
    description: Поток подсказок инвалидации (SSE) — замена опроса уведомлений, счётчиков и очереди
  - name: admin
    description: Admin · Оргструктура, Ролевая матрица (CRM — источник истины по людям и ролям) и Компания (ERP — реквизиты, бланк, нумерация, справочники)
  - name: integrations
    description: Admin · Внешние интеграции — ERP, Telegram, почта, реестр внешних сервисов, модели ИИ и расходы, бэкапы, состояние системы (прокси к CRM; раздел `admin`)
  - name: bus
    description: Admin · Журнал интеграций — шина rt_bus CRM, ERP и EDS (подписчики, доставки и DLQ, inbox с ошибками, повторы; раздел `admin` full)
  - name: kb
    description: CRM · База знаний — документы, поиск, пробелы, песочница бота (прокси к CRM; разделы `crm.leads` и `admin`)
  - name: messages
    description: Клиенты · Ждут ответа — передачи от бота, переписка с клиентом, ответ, заметка, подсказка (прокси к CRM; раздел `crm.leads`)
  - name: bot
    description: Admin · Настройки бота — разделы настроек CRM, шаблоны ответов, выгрузки CSV (прокси к CRM; раздел `admin`)
  - name: eds-approvals
    description: EDS · КП на одобрение и документы на согласовании — списки, карточки, решения директора (сервис EDS, ERP для состава КП; разделы `eds.drafts`, `eds.memo.approve`)
  - name: eds-payments
    description: EDS · Счета и оплаты бухгалтера — счета, платёжки клиентов, подтверждение оплаты (ERP), служебки к оплате и «Оплачено» (EDS); раздел `eds.payments`
  - name: letters
    description: EDS · Входящие письма — список, карточка, резолюция директора, возврат менеджеру, отказ, вложения (сервис EDS; раздел `eds.inbox`)
  - name: calc
    description: Расчёт · Заявки в расчёте и расчёт по заявке — строки, визы по зонам, «Расчёт готов», ИИ-разбор, каталог (ERP; разделы `erp.calc`, `erp.calc.goods`, `erp.calc.services`)
  - name: tickets
    description: Обращения сотрудников к администратору — «Написать администратору» и Настройки · Обращения сотрудников (CRM, ADR-0015)

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход сотрудника
      description: |
        BFF входит в CRM теми же логином и паролем, читает профиль и роли Платформы, при доступе к ERP получает
        сессию ERP SSO-обменом. Ответ ставит `rt_pf_session` и `rt_pf_csrf`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
      responses:
        '200':
          description: Вошёл
          headers:
            Set-Cookie:
              description: '`rt_pf_session` и `rt_pf_csrf`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: '`INVALID_CREDENTIALS` — неверный e-mail или пароль, в том числе у отключённого сотрудника'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`NO_PLATFORM_ROLE` — у сотрудника нет ни одной роли Платформы'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: '`ACCOUNT_LOCKED` — учётная запись временно заблокирована CRM после неудачных попыток входа'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: '`BACKEND_UNAVAILABLE` — не отвечает CRM (вход невозможен). Недоступность ERP вход не останавливает'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Забыли пароль — запросить ссылку сброса
      description: >-
        Без сессии. Ответ один и тот же для существующей и несуществующей учётной записи (перечислять сотрудников нельзя). Ссылка
        на Платформу уходит на почту (если подключён SMTP) или в Telegram (если привязан); нет ни того, ни другого — ничего не
        уходит, и экран заранее говорит «обратитесь к администратору». Ссылка одноразовая, живёт час; не больше трёх в час на
        учётную запись. Лимит BFF — 5 запросов в час на IP и на адрес, сверх него 429 `TOO_MANY_REQUESTS`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordIn'
      responses:
        '202':
          description: Запрос принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordAccepted'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Задать новый пароль по ссылке сброса
      description: >-
        Без сессии. Токен из ссылки одноразовый; после успеха все открытые сессии сотрудника закрываются и вход идёт с новым
        паролем. Неверная, использованная или просроченная ссылка — 422 `VALIDATION_FAILED` с `details.reason = reset_token_invalid`
        (`details.fields = [token]`); слабый пароль — `weak_password` (`new_password`), ссылка остаётся действующей.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordIn'
      responses:
        '204':
          description: Пароль задан
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Выход — BFF закрывает сессии CRM и ERP и удаляет свою
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Вышел; cookie сброшены
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/CsrfFailed'

  /auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Смена пароля (в том числе обязательная после приглашения)
      description: BFF меняет пароль в CRM (`POST /api/v1/auth/change-password`); сессия сохраняется, `must_change_password` снимается.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordIn'
      responses:
        '204':
          description: Пароль изменён
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '423':
          description: '`ACCOUNT_LOCKED` — учётная запись временно заблокирована CRM после неверных паролей'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`WRONG_PASSWORD` (текущий неверен) или `VALIDATION_FAILED` (новый не проходит правила CRM)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Текущая сессия (для старта SPA)
      responses:
        '200':
          description: Сессия жива
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/SessionExpired'

  /setup/state:
    get:
      tags: [setup]
      operationId: getSetupState
      summary: Нужен ли первый запуск (в CRM ещё нет администратора)
      description: >-
        Без сессии (CRM `/setup/state`). `needs_admin = true` — SPA ведёт на экран «Первый запуск» вместо входа. Пока администратора
        нет, CRM выдаёт одноразовый код первого запуска и один раз пишет его в журнал `crm-api` (`setup_code_issued`); в ответе кода нет.
      security: []
      responses:
        '200':
          description: Состояние
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupState'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /setup/admin:
    post:
      tags: [setup]
      operationId: createFirstAdmin
      summary: Создать первого администратора и войти
      description: >-
        Без сессии, один раз (CRM `/setup/admin`). Код первого запуска — из журнала `crm-api`; регистр, пробелы и дефисы не важны.
        Создаётся пользователь с системной ролью «Администратор»; BFF входит под ним теми же почтой и паролем и ставит `rt_pf_session` и
        `rt_pf_csrf` — ответ как у `POST /auth/login`. Попытки считаются в том же лимите, что и вход (на IP и e-mail). Неверный код —
        422 `SETUP_CODE_INVALID`, истёкший (24 часа) — 422 `SETUP_CODE_EXPIRED`, перебор — 429 `SETUP_LOCKED` (15 минут), администратор
        уже есть — 409 `SETUP_DONE`. Слабый пароль — 422 `VALIDATION_FAILED`, `details.fields = [password]`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupAdminIn'
      responses:
        '200':
          description: Администратор создан, сессия открыта
          headers:
            Set-Cookie:
              description: '`rt_pf_session` и `rt_pf_csrf`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '409':
          description: '`SETUP_DONE` — администратор уже создан'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`SETUP_CODE_INVALID`, `SETUP_CODE_EXPIRED`, `VALIDATION_FAILED` (`details.fields`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`SETUP_LOCKED` (15 минут) или `TOO_MANY_REQUESTS`'
          headers:
            Retry-After:
              description: Секунды до повтора
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /setup/checklist:
    get:
      tags: [setup]
      operationId: getSetupChecklist
      summary: Чек-лист первого запуска из пяти шагов
      description: >-
        Раздел `admin` — полный (директору — 403: CRM отдаёт чек-лист только с правом записи настроек, а все шаги ведут на экраны
        администратора). Состояние шагов приносит CRM (`/setup/checklist`: бот, модели ИИ, ERP — коннектор задан, почта — SMTP задан,
        первый сотрудник — есть кроме администратора активный сотрудник), BFF их только сводит; шаг, которого CRM не назвала, —
        `unknown`; CRM не ответила — 503. `company` — шаг мастера «своя компания» (ERP `setup/status`); ERP спрашивается только
        после сопряжения. `null`, если ERP не сопряжена (`company_blocker = erp_not_connected`) или не ответила либо у администратора
        нет сессии ERP (`erp_unavailable`).
      responses:
        '200':
          description: Чек-лист
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupChecklist'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /setup/company:
    post:
      tags: [setup]
      operationId: createOwnCompany
      summary: Создать свою компанию (шаг мастера)
      description: >-
        Раздел `admin` — полный. ERP `setup/company/` токеном администратора: создаёт компанию с типом «продавец» и делает его
        владельцем; только пока своей компании нет. Повтор — 409 `OWN_COMPANY_ALREADY_EXISTS`. Поля формы — 422 `VALIDATION_FAILED`
        (`details.fields`, тексты ERP — `details.messages`). ERP не сопряжена (коннектор в CRM не задан) — 409 `ERP_NOT_CONNECTED`:
        сначала шаг «ERP» (`details.link` = `/admin/integrations?card=erp&panel=open`). ERP сопряжена, но не ответила или у администратора ещё нет сессии ERP (доступ
        выдаётся CRM с задержкой) — 503 `BACKEND_UNAVAILABLE`, повтор через несколько секунд. Тот же сотрудник уже не суперпользователь ERP — 403 `FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupCompanyIn'
      responses:
        '201':
          description: Компания создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupCompanyCreated'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`OWN_COMPANY_ALREADY_EXISTS` — компания уже создана; `ERP_NOT_CONNECTED` — ERP не сопряжена, сначала подключите её'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /bridge:
    get:
      tags: [bridge]
      operationId: getBridge
      summary: Публичные адреса старых CRM и ERP для кнопок «Открыть в старой CRM / ERP»
      description: >-
        Адреса задают `PLATFORM_CRM_PUBLIC_URL` и `PLATFORM_ERP_PUBLIC_URL`; пусто — выводятся из адреса Платформы (`platform.X` ->
        `crm.X`, `erp.X`). Не задан и не выводится — `null`: SPA не показывает кнопку и честно пишет, где работа делается. Адреса не
        секрет; ответ `no-store` (смена настройки подхватывается при следующей загрузке). Права раздела не нужны, но нужна сессия и
        хотя бы один раздел каталога: пока не сменён временный пароль — 403 `FORBIDDEN` с `details.reason = password_change_required`,
        у ролей нет ни одного раздела — 403 `FORBIDDEN` с `details.reason = no_sections`.
      responses:
        '200':
          description: Адреса
          headers:
            Cache-Control:
              description: '`no-store`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bridge'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /bridge/erp-sso:
    post:
      tags: [bridge]
      operationId: createBridgeErpSso
      summary: Адрес входа в старый ERP без второго пароля
      description: >-
        Тот же SSO CRM -> ERP, что у кнопки «Перейти в ERP» старой CRM (`docs/architecture/sso-token.md`): CRM выдаёт токен
        на 60 секунд, `url` — `{ERP}/sso/exchange#token=…`. Старый ERP после обмена открывает свою главную страницу. Токен в
        журнал BFF не попадает. Нужна сессия и хотя бы один раздел каталога (иначе 403 `FORBIDDEN`,
        `details.reason`: `password_change_required` или `no_sections`); нет доступа к ERP — 403 `FORBIDDEN` с `details.reason =
        platform_access_denied`; CRM отказала (переход по SSO выключен) — 403 `FORBIDDEN` с `details.reason = sso_disabled`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Адрес обмена
          headers:
            Cache-Control:
              description: '`no-store`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeErpSso'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Профиль, роли, доступные модули и разделы
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/SessionExpired'
    patch:
      tags: [me]
      operationId: updateMe
      summary: Язык интерфейса и активная роль
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /me/notification-settings:
    get:
      tags: [me]
      operationId: getNotificationSettings
      summary: Личные уведомления сотрудника от бота (профиль)
      description: >-
        Привязан ли Telegram, подписки на личные сообщения бота и последняя неудача их доставки (CRM `/me`). Доступно каждому
        вошедшему сотруднику.
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '401':
          $ref: '#/components/responses/SessionExpired'
    patch:
      tags: [me]
      operationId: updateNotificationSettings
      summary: Включить или выключить подписки на личные сообщения бота
      description: >-
        Не присланное поле не меняется; хотя бы одно поле обязательно. Подписка «системные» относится к оповещениям
        администратору; CRM принимает её от любого сотрудника, но получают её только те, кому положены системные оповещения.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingsUpdate'
      responses:
        '200':
          description: Сохранено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          description: '`BACKEND_UNAVAILABLE` — CRM не ответила'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/test-notification:
    post:
      tags: [me]
      operationId: sendTestNotification
      summary: Тестовое уведомление себе в Telegram
      description: >-
        Бот присылает сотруднику пробное личное сообщение (CRM `/me/test-notification`); успех снимает предупреждение
        «доставка не удалась». Доступно каждому вошедшему. Telegram не привязан — 409 `CONFLICT` с
        `details.reason = telegram_not_linked`; бот не подключён — 409 `NOT_CONFIGURED`; Telegram отказал (человек не нажал «Старт»
        или заблокировал бота) — 409 `CONFLICT` с `details.reason = telegram_refused`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Сообщение отправлено
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '409':
          description: '`NOT_CONFIGURED`; `CONFLICT` (`details.reason` = `telegram_not_linked` или `telegram_refused`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`BACKEND_UNAVAILABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/onboarding:
    put:
      tags: [me]
      operationId: finishOnboarding
      summary: Закрыть приветствие и тур первого входа
      description: >-
        «Пропустить» и «Больше не показывать»: ставит `Me.onboarding_done = true` (CRM `PATCH /me {onboarding_done: true}`),
        обратно флаг не снимается. Только про себя; повторный вызов безвреден. Ответ — обновлённый профиль.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Профиль с `onboarding_done = true`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /me/whats-new:
    put:
      tags: [me]
      operationId: markWhatsNew
      summary: Отметить, что окно «Платформа обновлена» показано или «Что нового» открыт
      description: >-
        W-REL. `shown` — сотрудник закрыл или открыл окно «Платформа обновлена» о записи этой даты (окно больше не
        показывается); `read` — открыл раздел «Что нового» (снимается отметка «Новое» у «?», окно о той же записи тоже не
        нужно). Отметки хранит CRM (`PATCH /me {whats_new_shown|whats_new_read}`), а не браузер; они только растут — более
        ранняя дата ничего не меняет. Только про себя; ответ — обновлённый профиль.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsNewMark'
      responses:
        '200':
          description: Профиль с новыми отметками `whats_new_shown` и `whats_new_read`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /tickets:
    get:
      tags: [tickets]
      operationId: listMyTickets
      summary: Мои обращения к администратору
      description: >-
        Только обращения самого сотрудника, новейшие первыми (CRM `GET /staff-tickets/mine`). Нужна сессия и хотя бы один
        раздел каталога; прав раздела не требуется.
      responses:
        '200':
          description: Мои обращения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'
    post:
      tags: [tickets]
      operationId: createTicket
      summary: Написать администратору
      description: >-
        Создаёт обращение: тема из списка, текст, адрес страницы (внутренний путь Платформы, `/eds/inbox?panel=open`). Роль автора
        подставляет BFF из сессии. Админам уходит строка в колокольчик и личное сообщение бота; не больше пяти обращений в
        час на сотрудника — иначе 429 `TOO_MANY_REQUESTS` с `details.reason = ticket_rate_limited`. Ошибка значения — 422
        `VALIDATION_FAILED` (`details.fields`: `subject`, `body`, `page`; `details.reason`: `ticket_subject_unknown`,
        `ticket_text_empty`, `ticket_text_too_long`, `ticket_page_invalid`).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
      responses:
        '201':
          description: Обращение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /tickets/{number}:
    get:
      tags: [tickets]
      operationId: getMyTicket
      summary: Моё обращение с ответами администратора
      description: 'Чужое обращение отвечает 404: его для этого сотрудника не существует.'
      parameters:
        - $ref: '#/components/parameters/TicketNumberPath'
      responses:
        '200':
          description: Обращение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/tickets:
