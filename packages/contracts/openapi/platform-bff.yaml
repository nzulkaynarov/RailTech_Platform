  /erp/calc/requests:
    get:
      tags: [calc]
      operationId: listCalcRequests
      summary: 'Расчёт · Заявки в расчёте (и «Мои расчёты»)'
      description: >-
        ERP `GET /calc/tasks/`: заявки с заданием расчёта по резолюции директора на стадиях расчёта, по сроку расчёта.
        Строка — номер ЗВ, клиент, шаг пути, срок, состояние расчёта, три индикатора виз (склад — товары со склада,
        снабжение — товары под заказ, гл. инженер — услуги; `none` — таких строк нет), ответственный (менеджер заявки) и
        исполнители резолюции. `mine=true` — только где сотрудник исполнитель резолюции («Мои расчёты»). Раздел `erp.calc` —
        чтение. Номер ЗВ/ПР выдаёт ERP (`Deal.number`, ERP-09); из номера `id` не разбирается.
      parameters:
        - name: mine
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Заявки в расчёте
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalcRequestList'}
        '401': {$ref: '#/components/responses/SessionExpired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}

  /erp/calc/catalog:
    get:
      tags: [calc]
      operationId: searchCalcCatalog
      summary: 'Расчёт · Каталог для сопоставления строки'
      description: >-
        ERP `GET /calc/catalog/?q=`: карточки, в названии, артикуле, коде производителя или ГОСТ которых есть каждое слово
        запроса (до 20, без ИИ). Человек выбирает карточку сам (`PATCH …/lines/{line_id}` с `product_id`). Раздел `erp.calc` —
        чтение.
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: Карточки каталога
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalcCatalogPage'}
        '401': {$ref: '#/components/responses/SessionExpired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}

  /erp/calc-jobs/{job_id}:
    get:
      tags: [calc]
      operationId: getCalcParse
      summary: 'Расчёт · Итог ИИ-разбора текста заявки (предложение строк)'
      description: >-
        ERP `GET /sourcing/ai-status/{task_id}/`. `pending` — разбор идёт (опрашивать раз в 2 с); `done` — предложение строк
        (ничего не записано: человек отмечает строки и добавляет их `POST …/lines`); `failed` — `reason` (`ai_extract_failed`,
        `ai_disabled`, `ai_budget_exceeded`, …). Чужое задание — 404. Раздел `erp.calc` — полный.
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9-]+$'}
      responses:
        '200':
          description: Состояние разбора
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalcParseResult'}
        '401': {$ref: '#/components/responses/SessionExpired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}

  /erp/calc/{number}:
    get:
      tags: [calc]
      operationId: getCalcSheet
      summary: 'Расчёт · Расчёт по заявке ЗВ-…'
      description: >-
        ERP `GET /calc/{deal_id}/` (заявку по номеру BFF находит среди заявок с заданием расчёта). Заявка, задание
        (резолюция директора — проекция события EDS в ERP: текст, дата, кто; исполнители по зонам), КП расчёта, строки
        (позиция и тип, кол-во, склад, поставщик и срок, закупка и цена клиенту без НДС, наценка, виза), итоги без НДС,
        визы по трём индикаторам, готовность «Расчёт готов» с причиной и права сотрудника по зонам. Поля с ограничением BFF
        вырезает (и ERP режет сам): закупку и себестоимость строки (в том числе ставку и дни бригады услуги) видит группа
        `cost_margin` или держатель зоны этой строки (`erp.calc.goods` — товары, `erp.calc.services` — услуги); наценку,
        итоги себестоимости и наценки и порог маржи резолюции — только `cost_margin`; цены предложений поставщиков —
        `supplier_prices` или держатель зоны товаров. Бухгалтер (`totals_only`) — цены клиенту, итоги и НДС.
        Номера нет среди заявок с заданием — 404. Раздел `erp.calc` — чтение.
      parameters:
        - $ref: '#/components/parameters/CalcNumberPath'
      responses:
        '200':
          description: Расчёт по заявке
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalcSheet'}
        '401': {$ref: '#/components/responses/SessionExpired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}

  /erp/calc/{number}/start:
    post:
      tags: [calc]
      operationId: startCalc
      summary: 'Расчёт · Начать расчёт: черновик КП из строк заявки'
      description: >-
        ERP `POST /calc/{deal_id}/start/`: черновик КП расчёта — строки заявки (точные совпадения ГОСТ/артикула с каталогом,
        закупка из своего предложения), без ИИ; у заявки без строк — пустой черновик. Уже начат — без изменений. Раздел
        `erp.calc` — полный.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CalcNumberPath'
      responses:
        '200':
          description: Расчёт по заявке
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalcSheet'}
        '401': {$ref: '#/components/responses/SessionExpired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CalcConflict'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}

  /erp/calc/{number}/lines:
    post:
      tags: [calc]
      operationId: addCalcLines
      summary: 'Расчёт · Добавить строки (вручную или подтверждённое предложение ИИ-разбора)'
      description: >-
        ERP `POST /calc/{deal_id}/lines/`. Строка-услуга (`kind = service` или карточка каталога «услуга») — раздел
        `erp.calc.services`, товар — `erp.calc.goods` (полный); иначе 403 до ERP. Решает ERP (`quote.visa_goods`,
        `quote.visa_services`). До 50 строк за раз. Ответ — обновлённый расчёт.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CalcNumberPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalcLinesIn'}
      responses:
        '200':
          description: Расчёт по заявке
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalcSheet'}
        '401': {$ref: '#/components/responses/SessionExpired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CalcConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}

  /erp/calc/{number}/lines/{line_id}:
    patch:
      tags: [calc]
      operationId: updateCalcLine
      summary: 'Расчёт · Изменить строку (виза строки снимается)'
      description: >-
        ERP `PATCH /calc/{deal_id}/lines/{item_id}/`. Правит держатель права зоны строки: товар — снабженец (закупка, валюта,
        срок, цена клиенту, карточка каталога), услуга — гл. инженер (ставка бригады и дни; закупка услуги = ставка × дни).
        Цена клиенту без НДС пересчитывает наценку строки; ниже закупки — 422 `details.reason = client_price_below_cost`.
        Закупку (`purchase_price`, `purchase_currency`) без группы `cost_margin` BFF не принимает: 422 `details.reason =
        cost_forbidden`, в ERP запрос не уходит. Любая правка снимает визу строки. Нужен раздел `erp.calc.goods` или
        `erp.calc.services` (полный); зону решает ERP (403 `details.reason = zone_not_permitted`).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CalcNumberPath'
        - $ref: '#/components/parameters/CalcLineIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalcLinePatch'}
      responses:
        '200':
          description: Расчёт по заявке
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalcSheet'}
        '401': {$ref: '#/components/responses/SessionExpired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CalcConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}
    delete:
      tags: [calc]
      operationId: deleteCalcLine
      summary: 'Расчёт · Удалить строку'
      description: >-
        ERP `DELETE /calc/{deal_id}/lines/{item_id}/`; держатель права зоны строки (разделы — как у правки).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CalcNumberPath'
        - $ref: '#/components/parameters/CalcLineIdPath'
      responses:
        '200':
          description: Расчёт по заявке
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalcSheet'}
        '401': {$ref: '#/components/responses/SessionExpired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CalcConflict'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}

  /erp/calc/{number}/lines/{line_id}/visa:
    post:
      tags: [calc]
      operationId: signCalcLine
      summary: 'Расчёт · «Подтвердить» строку (виза по зоне)'
      description: >-
        ERP `POST /calc/{deal_id}/lines/{item_id}/visa/`. Товар визирует держатель `erp.calc.goods`, услугу —
        `erp.calc.services` (решает ERP: 403 `details.reason = zone_not_permitted`). Кто визирует — факт визы (имя в
        `visa.by`): список «сотрудников зоны» в CRM ещё не появился (B-007), поэтому визирует любой держатель права зоны.
        Строка без закупки или цены клиенту — 409 `details.reason = line_incomplete`. Повтор — без изменений.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CalcNumberPath'
        - $ref: '#/components/parameters/CalcLineIdPath'
      responses:
        '200':
          description: Расчёт по заявке
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalcSheet'}
        '401': {$ref: '#/components/responses/SessionExpired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CalcConflict'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}

  /erp/calc/{number}/ready:
    post:
      tags: [calc]
      operationId: markCalcReady
      summary: 'Расчёт · «Расчёт готов → черновик КП директору»'
      description: >-
        ERP `POST /calc/{deal_id}/ready/`. Только когда завизированы все строки — иначе 409 `details.reason = visas_missing`
        (`details.missing` — сколько строк без визы); проверка на сервере, не только кнопкой. Дальше — как отправка КП на
        одобрение: клиент заявки, ненулевая сумма, курсы строк, не в убыток (409 с причиной ERP). КП получает номер и уходит
        директору в EDS событием `quote.ready_for_approval` (визы — подписи строк по зонам): у директора — «КП на одобрение»
        в Документах · Черновик КП и в «Моей очереди». Раздел `erp.calc` — полный.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CalcNumberPath'
      responses:
        '200':
          description: Расчёт у директора
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalcSheet'}
        '401': {$ref: '#/components/responses/SessionExpired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CalcConflict'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}

  /erp/calc/{number}/parse:
    post:
      tags: [calc]
      operationId: parseCalcText
      summary: 'Расчёт · ИИ-разбор текста заявки в строки (предложение)'
      description: >-
        ERP `POST /calc/{deal_id}/parse/`: задание в очереди ИИ (модель — через шлюз по алиасу), ответ — `job_id`; итог —
        `GET /erp/calc-jobs/{job_id}`. Ничего не записывается: строки добавляет человек. Без `text` разбирается текст
        заявки. ИИ выключен — 409 `details.reason = ai_disabled`; текста нет — 409 `request_text_empty`; дневной лимит ИИ —
        429. Раздел `erp.calc` — полный.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/CalcNumberPath'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalcParseIn'}
      responses:
        '202':
          description: Разбор поставлен в очередь
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalcParseJob'}
        '401': {$ref: '#/components/responses/SessionExpired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CalcConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}

components:
  securitySchemes:
    platformSession:
      type: apiKey
      in: cookie
      name: rt_pf_session

  parameters:
    TicketNumberPath:
      name: number
      in: path
      required: true
      description: Номер обращения `ОБР-0012` (в адресе — закодированный)
      schema:
        type: string
        pattern: '^ОБР-[0-9]{1,9}$'
    LeadNumber:
      name: lead
      in: path
      required: true
      description: Номер лида `L-NNNN`
      schema:
        type: string
        pattern: '^[Ll]-?\d{1,9}$'
    EmployeeId:
      name: id
      in: path
      required: true
      description: '`crm_user_id` — число без ведущих нулей (`07` и `007` — не адрес сотрудника)'
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
    RoleIdPath:
      name: id
      in: path
      required: true
      description: Id роли Платформы (CRM)
      schema:
        $ref: '#/components/schemas/RoleId'
    RoleQuery:
      name: role
      in: query
      required: false
      description: Только по этой роли сотрудника (id); чужая роль — 403
      schema:
        $ref: '#/components/schemas/RoleId'
    PageLimit:
      name: limit
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageOffset:
      name: offset
      in: query
      required: false
      description: Сколько записей пропустить
      schema:
        type: integer
        minimum: 0
        default: 0
    BusDomainQuery:
      name: domain
      in: query
      required: false
      description: Только этот домен (по умолчанию — все три)
      schema:
        $ref: '#/components/schemas/BusDomain'
    BusDomainPath:
      name: domain
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BusDomain'
    BusSubscriberQuery:
      name: subscriber
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BusSubscriberName'
    BusTypeQuery:
      name: type
      in: query
      required: false
      description: Подстрока типа события (`quote.`, `client.updated`)
      schema: {type: string, minLength: 1, maxLength: 200}
    BusCursor:
      name: cursor
      in: query
      required: false
      description: Непрозрачный курсор из `next_cursor`
      schema: {type: string, maxLength: 2000}
    BusLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    EdsIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Ключ повтора создания (8–128 знаков, на экземпляр формы и тело запроса); EDS хранит его 24 часа
      schema: {type: string, minLength: 8, maxLength: 128}
    EdsDocumentId:
      name: id
      in: path
      required: true
      description: Id документа EDS (UUID); номер `СЗ-2026/031` содержит «/» и в адресе не используется
      schema: {type: string, format: uuid}
    PaymentInvoiceId:
      name: id
      in: path
      required: true
      description: Id счёта ERP (из строки `GET /eds/payments`)
      schema: {type: integer, minimum: 1}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Значение cookie `rt_pf_csrf`
      schema:
        type: string
        minLength: 16
    KbDocumentId:
      name: id
      in: path
      required: true
      description: Id документа базы знаний (CRM)
      schema:
        type: integer
        minimum: 1
    KbGapId:
      name: id
      in: path
      required: true
      description: Id пробела базы знаний (CRM)
      schema:
        type: integer
        minimum: 1
    ReplyTemplateId:
      name: id
      in: path
      required: true
      description: Id шаблона ответа (CRM)
      schema:
        type: integer
        minimum: 1

    CompanyItemId:
      name: id
      in: path
      required: true
      description: Id объекта ERP (строкой)
      schema:
        $ref: '#/components/schemas/CompanyItemRef'
    ReferenceKindPath:
      name: kind
      in: path
      required: true
      description: Справочник ERP
      schema:
        $ref: '#/components/schemas/ReferenceKind'

    LetterIdPath:
      name: id
      in: path
      required: true
      description: UUID входящего письма (EDS)
      schema:
        type: string
        format: uuid

    CalcNumberPath:
      name: number
      in: path
      required: true
      description: Номер заявки `ЗВ-ГГГГ-NNN` (как в списке «Заявки в расчёте»)
      schema: {type: string, minLength: 1, maxLength: 40}

    CalcLineIdPath:
      name: line_id
      in: path
      required: true
      description: Строка расчёта (`CalcLine.id`)
      schema: {type: string, pattern: '^[0-9]+$', maxLength: 12}

    ApprovalIdPath:
      name: id
      in: path
      required: true
      description: UUID маршрута согласования EDS (`id` карточки КП, `approval_id` карточки документа)
      schema:
        type: string
        format: uuid
    ApprovalScope:
      name: scope
      in: query
      required: false
      description: '`mine` — на моём шаге (по умолчанию); `all` — всё, что EDS показывает сотруднику'
      schema:
        type: string
        enum: [mine, all]
        default: mine
    ApprovalStatusFilter:
      name: status
      in: query
      required: false
      description: Только маршруты в этих статусах (параметр повторяется); без параметра — `mine` показывает открытые, `all` — любые
      schema:
        type: array
        uniqueItems: true
        items: {$ref: '#/components/schemas/ApprovalRouteStatus'}
      style: form
      explode: true

  responses:
    SessionExpired:
      description: '`SESSION_EXPIRED` — сессии нет, истекла или сотрудник отключён'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CsrfFailed:
      description: '`CSRF_FAILED`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '`FORBIDDEN` — раздел или действие не положены ролям сотрудника'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: '`VALIDATION_FAILED` — `details.fields` перечисляет поля'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: '`TOO_MANY_REQUESTS`'
      headers:
        Retry-After:
          description: Секунды до повтора
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    EdsConflict:
      description: >-
        409 `CONFLICT` — документ не в том статусе для действия (`details.reason = invalid_state`) или объект изменился
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EdsPayloadTooLarge:
      description: '413 `PAYLOAD_TOO_LARGE` — файл больше 25 МБ (`details.max_bytes`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EdsUnsupportedMedia:
      description: '415 `UNSUPPORTED_MEDIA_TYPE` — допустимы PDF, изображения и документы Office'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    IntegrationConflict:
      description: >-
        409: `NOT_CONFIGURED` (коннектор или сервис не настроен), `SECRETS_KEY_MISSING` (на сервере нет ключа шифрования),
        `SERVICE_NOT_SWITCHABLE` (у сервиса нет выключателя), `CONFLICT` (состояние не позволяет действие); код CRM — в `details.reason`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IntegrationInvalid:
      description: >-
        422: `WRONG_PASSWORD` — пароль администратора неверен; `VALIDATION_FAILED` — поле не принято (`details.fields`,
        `details.reason`: `erp_invalid_url`, `erp_pairing_code_invalid`, `smtp_invalid_host`, `invalid_bot_token`, `ai_spend_period`, …)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AccountLocked:
      description: '`ACCOUNT_LOCKED` — после неверных паролей CRM временно блокирует учётную запись'
      headers:
        Retry-After:
          description: Секунды до повтора
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IntegrationFailed:
      description: >-
        502 `INTEGRATION_FAILED` — CRM не достучалась до внешнего сервиса (ERP, SMTP, Telegram, LiteLLM) или он отказал; причина —
        `details.reason` (`erp_unavailable`, `smtp_auth_failed`, `litellm_unavailable`, …)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MessagesConflict:
      description: >-
        409 `CONFLICT` — состояние лида не позволяет действие; код CRM — в `details.reason` (`lead_taken` с
        `details.assigned_user_name`, `take_first`, `no_consent`, `already_with_bot`, `delivery_unconfirmed`, `reply_in_progress` — ответ с этим
        `client_message_id` ещё отправляется, повтор безопасен, `assist_disabled`, `assist_budget`,
        `assist_empty`, `assist_no_history`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BackendUnavailable:
      description: '`BACKEND_UNAVAILABLE` — CRM не ответила за таймаут'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    CalcConflict:
      description: >-
        409 `CONFLICT` — расчёт не в том состоянии для действия: `details.reason` — код ERP в нижнем регистре
        (`visas_missing` и `details.missing`, `deal_not_in_calculation`, `quote_not_draft`, `calc_not_started`, `line_incomplete`, `purchase_required`,
        `no_lines`, `quote_below_cost`, `fx_rate_missing`, `quote_client_required`, `request_text_empty`, `ai_disabled`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    LetterConflict:
      description: >-
        409 `CONFLICT` — письмо уже не ждёт резолюции (решил другой директор, вернули, отклонили): `details.reason =
        invalid_state`; обновите карточку
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    PaymentConflict:
      description: >-
        409 `CONFLICT` — состояние счёта не позволяет действие: `details.reason` — `exceeds_balance` (сумма больше остатка),
        `already_paid`, `not_issued`, `not_open`, `cancelled`, `reference_conflict` (номер операции уже записан с другой суммой
        или датой); обновите карточку
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ApprovalConflict:
      description: >-
        409 `CONFLICT` — `details.reason = checklist_not_green` (одобрение КП при красной блокирующей строке чек-листа,
        `details.failed` — коды строк) или `route_closed` (маршрут уже решён другим или заменён новой версией КП); обновите карточку
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, source]
      properties:
        code:
          type: string
          description: Стабильный код (`INVALID_CREDENTIALS`, `SESSION_EXPIRED`, `CSRF_FAILED`, `FORBIDDEN`, `NOT_FOUND`, `VALIDATION_FAILED`, `TOO_MANY_REQUESTS`, `BACKEND_UNAVAILABLE`, `NO_PLATFORM_ROLE`, `USER_DISABLED`, `ACCOUNT_LOCKED`, `CONFLICT`, `WRONG_PASSWORD`, `EMAIL_EXISTS`, `LAST_ADMIN`, `LAST_DIRECTOR`, `ROLE_IN_USE`, `ROLE_SYSTEM`, `ROLES_REQUIRED`, `NOT_CONFIGURED`, `SECRETS_KEY_MISSING`, `SERVICE_NOT_SWITCHABLE`, `INTEGRATION_FAILED`, `PAYLOAD_TOO_LARGE`, `UNSUPPORTED_MEDIA_TYPE`, `COMPANY_NOT_SET`, `SETUP_DONE`, `SETUP_CODE_INVALID`, `SETUP_CODE_EXPIRED`, `SETUP_LOCKED`, `OWN_COMPANY_ALREADY_EXISTS`, `ERP_NOT_CONNECTED`, `INTERNAL_ERROR`, `BAD_REQUEST`, `METHOD_NOT_ALLOWED`, `HTTP_<статус>`)
          examples: [SESSION_EXPIRED]
        message:
          type: string
          description: Текст для сотрудника на его языке
        source:
          type: string
          enum: [bff, crm, erp, eds]
        details:
          type: object
          description: Код и тело ошибки бэкенда, поля валидации — для разбора, не для показа
          additionalProperties: true

    BusDomain:
      type: string
      enum: [crm, erp, eds]
      description: Домен-издатель журнала шины
    BusSourceState:
      type: string
      enum: [ok, unavailable, forbidden, not_applicable]
      description: >-
        `unavailable` — домен не ответил (сеть, таймаут, 5xx); `forbidden` — домен отказал в праве (например, права ещё не
        дошли до EDS); `not_applicable` — у сотрудника нет доступа к домену или домен вне фильтра
    BusSources:
      type: object
      additionalProperties: false
      required: [crm, erp, eds]
      properties:
        crm: {$ref: '#/components/schemas/BusSourceState'}
        erp: {$ref: '#/components/schemas/BusSourceState'}
        eds: {$ref: '#/components/schemas/BusSourceState'}
    BusSubscriberName:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,63}$'
      description: Имя подписчика шины (`crm`, `erp`, `eds`, `platform-bff`)
    BusDeliveryStatus:
      type: string
      enum: [pending, in_flight, delivered, dead]
      description: '`pending` — ждёт отправки или повтора, `in_flight` — отправляется, `delivered` — доставлено, `dead` — DLQ'
    BusInboxStatus:
      type: string
      enum: [received, processed, failed, skipped]
    BusSubscriberState:
      type: string
      enum: [ok, failing, paused, dead_letters, disabled, removed]
      description: >-
        Состояние словом (по порядку важности): `removed` — подписчика нет в файле подписок, остались доставки; `disabled` —
        выключен (`enabled: false`), события копятся; `paused` — пауза предохранителя до `paused_until`; `dead_letters` — есть
        доставки в DLQ; `failing` — ошибки подряд ниже порога предохранителя; `ok` — работает
    BusSubscriber:
      type: object
      additionalProperties: false
      required: [name, state, configured, enabled, drop, endpoint, pending, in_flight, dead, oldest_undelivered_age_seconds,
                 consecutive_failures, paused_until, last_failure_at, last_success_at, last_error]
      properties:
        name: {type: string}
        state: {$ref: '#/components/schemas/BusSubscriberState'}
        configured: {type: boolean}
        enabled: {type: boolean}
        drop: {type: boolean, description: 'Выключен с `drop: true` — события за время остановки не копятся'}
        endpoint: {type: [string, 'null'], description: 'Адрес приёмника: только схема, хост, порт и путь'}
        pending: {type: integer}
        in_flight: {type: integer}
        dead: {type: integer}
        oldest_undelivered_age_seconds: {type: [number, 'null'], description: Возраст самого старого недоставленного (без DLQ)}
        consecutive_failures: {type: integer}
        paused_until: {type: [string, 'null'], format: date-time}
        last_failure_at: {type: [string, 'null'], format: date-time}
        last_success_at: {type: [string, 'null'], format: date-time}
        last_error: {type: [string, 'null']}
    BusDomainOverview:
      type: object
      additionalProperties: false
      required: [domain, outbox_pending, oldest_undelivered_age_seconds, dlq_size, inbox_received, inbox_retrying,
                 inbox_failed, subscribers]
      properties:
        domain: {$ref: '#/components/schemas/BusDomain'}
        outbox_pending: {type: integer, description: События ещё не разложены по подписчикам}
        oldest_undelivered_age_seconds: {type: [number, 'null']}
        dlq_size: {type: integer}
        inbox_received: {type: integer, description: Принятые события ждут обработки}
        inbox_retrying: {type: integer, description: 'Из них ждут автоповтора после ошибки'}
        inbox_failed: {type: integer}
        subscribers:
          type: array
          items: {$ref: '#/components/schemas/BusSubscriber'}
    BusJournal:
      type: object
      additionalProperties: false
      required: [domains, sources]
      properties:
        domains:
          type: array
          items: {$ref: '#/components/schemas/BusDomainOverview'}
        sources: {$ref: '#/components/schemas/BusSources'}
    BusDelivery:
      type: object
      additionalProperties: false
      required: [domain, id, event_id, event_type, subscriber, status, attempts, next_attempt_at, last_attempt_at,
                 last_status_code, last_error, delivered_at, created_at, subject, correlation_id]
      description: Метаданные доставки; тела события нет.
      properties:
        domain: {$ref: '#/components/schemas/BusDomain'}
        id: {type: integer}
        event_id: {type: string, format: uuid}
        event_type: {type: string}
        subscriber: {type: string}
        status: {$ref: '#/components/schemas/BusDeliveryStatus'}
        attempts: {type: integer}
        next_attempt_at: {type: [string, 'null'], format: date-time}
        last_attempt_at: {type: [string, 'null'], format: date-time}
        last_status_code: {type: [integer, 'null']}
        last_error: {type: [string, 'null']}
        delivered_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        subject: {type: [string, 'null']}
        correlation_id: {type: [string, 'null']}
    BusDeliveryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, sources]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/BusDelivery'}
        next_cursor: {type: [string, 'null']}
        sources: {$ref: '#/components/schemas/BusSources'}
    BusInboxEntry:
      type: object
      additionalProperties: false
      required: [domain, event_id, type, publisher, subject, correlation_id, status, attempts, error, received_at,
                 processed_at]
      description: Принятое доменом событие (метаданные; тела нет).
      properties:
        domain: {$ref: '#/components/schemas/BusDomain'}
        event_id: {type: string, format: uuid}
        type: {type: string}
        publisher: {type: string}
        subject: {type: [string, 'null']}
        correlation_id: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/BusInboxStatus'}
        attempts: {type: integer}
        error: {type: [string, 'null']}
        received_at: {type: string, format: date-time}
        processed_at: {type: [string, 'null'], format: date-time}
    BusInboxPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, sources]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/BusInboxEntry'}
        next_cursor: {type: [string, 'null']}
        sources: {$ref: '#/components/schemas/BusSources'}
    BusRetryDeadIn:
      type: object
      additionalProperties: false
      required: [subscriber]
      properties:
        subscriber: {$ref: '#/components/schemas/BusSubscriberName'}
    BusRetryResult:
      type: object
      additionalProperties: false
      required: [retried]
      properties:
        retried: {type: integer, minimum: 0, description: 'Сколько поставлено на повтор; 0 — повторять нечего'}

    SourceState:
      type: string
      enum: [ok, unavailable, not_applicable]
      description: '`not_applicable` — у сотрудника нет доступа к этому бэкенду'

    Sources:
      type: object
      additionalProperties: false
      required: [crm, erp]
      properties:
        crm:
          $ref: '#/components/schemas/SourceState'
        erp:
          $ref: '#/components/schemas/SourceState'
        eds:
          $ref: '#/components/schemas/SourceState'
          description: >-
            Только если ответ собран и из EDS (с 0.25.0): `unavailable` — EDS не ответил, `not_applicable` — EDS не пустил
            сотрудника. Нет доступа к разделам EDS — поля нет.

    RoleId:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Id роли Платформы в CRM (роли — данные, ADR-0012)
      examples: ['3']

    RoleRef:
      type: object
      additionalProperties: false
      required: [id, name, system]
      properties:
        id:
          $ref: '#/components/schemas/RoleId'
        name:
          type: string
          description: Название роли — данные (его задаёт администратор); интерфейс показывает его как есть
        system:
          type: boolean
          description: Системная роль («Администратор», «Директор») — неизменна, не удаляется
        code:
          type: string
          description: >-
            Код системной роли (`ADMIN`, `DIRECTOR`) или шаблона, из которого создана роль при первом запуске (`tpl:MANAGER`);
            у созданных администратором — нет. Интерфейс на коды не опирается, кроме двух системных.

    ResourceAccess:
      type: object
      description: Раздел каталога `platform-rbac.yaml` → уровень; скрытые разделы не перечисляются
      additionalProperties:
        $ref: '#/components/schemas/AccessLevel'

    RestrictedField:
      type: string
      enum: [cost_margin, supplier_prices, totals_only]
      description: Поле с ограничением каталога (`restricted_fields`); роль перечисляет поля, которые она видит

    Role:
      type: object
      additionalProperties: false
      required: [id, name, description, system, version, access, restricted_fields, employees, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/RoleId'
        name:
          type: string
        description:
          type: string
        system:
          type: boolean
        code:
          type: string
          description: Как в `RoleRef.code`
        version:
          type: integer
          minimum: 1
          description: Растёт при каждом изменении роли; `RoleUpdate.version` присылает прочитанную (0.4.0)
        access:
          $ref: '#/components/schemas/ResourceAccess'
        restricted_fields:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RestrictedField'
        employees:
          type: integer
          minimum: 0
          description: Сколько сотрудников имеют роль
        updated_at:
          type: string
          format: date-time

    RoleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    RoleSnapshot:
      type: object
      additionalProperties: false
      description: Содержимое роли на момент записи аудита CRM
      required: [name, description, access, restricted_fields]
      properties:
        name:
          type: string
        description:
          type: string
        access:
          $ref: '#/components/schemas/ResourceAccess'
        restricted_fields:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedField'

    RoleChange:
      type: object
      additionalProperties: false
      description: Одно изменение роли. `create` — только `after`, `delete` — только `before`, `update` — оба.
      required: [id, at, action]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        action:
          type: string
          enum: [create, update, delete]
        actor_id:
          type: string
          description: Кто изменил (`crm_user_id`); нет — автор неизвестен (система или удалённый пользователь)
        actor_name:
          type: string
        before:
          $ref: '#/components/schemas/RoleSnapshot'
        after:
          $ref: '#/components/schemas/RoleSnapshot'

    RoleJournal:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleChange'
        total:
          type: integer
          minimum: 0

    AuditActorType:
      type: string
      enum: [user, system, bot]

    AuditEntry:
      type: object
      additionalProperties: false
      description: Запись аудита CRM. `action` и `entity_type` — коды CRM (`user.update`, `platform_role`); слова к ним даёт SPA по языку сотрудника.
      required: [id, at, actor_type, action, entity_type]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        actor_type:
          $ref: '#/components/schemas/AuditActorType'
        actor_id:
          type: string
        actor_name:
          type: string
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        before:
          type: object
          additionalProperties: true
          description: Значения до изменения; секретные поля заменены на `***`
        after:
          type: object
          additionalProperties: true
          description: Значения после изменения; секретные поля заменены на `***`
        ip:
          type: string

    AuditPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        total:
          type: integer
          minimum: 0
          description: Записей по фильтрам всего
        limit:
          type: integer
        offset:
          type: integer

    NotificationSettings:
      type: object
      additionalProperties: false
      description: Личные уведомления сотрудника от бота (профиль)
      required: [telegram_linked, notify_leads, notify_system]
      properties:
        telegram_linked:
          type: boolean
          description: Telegram привязан; без него подписки не работают и пробное сообщение не отправить
        notify_leads:
          type: boolean
          description: Сообщать боту, когда лид ждёт сотрудника
        notify_system:
          type: boolean
          description: Системные оповещения (мониторинг, сбои) — администратору
        delivery_failed_at:
          type: string
          format: date-time
          description: Когда последний раз личное сообщение бота не дошло; нет — доставка исправна

    NotificationSettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        notify_leads:
          type: boolean
        notify_system:
          type: boolean

    RoleCreate:
      type: object
      additionalProperties: false
      required: [name, access, restricted_fields]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        access:
          $ref: '#/components/schemas/ResourceAccess'
        restricted_fields:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RestrictedField'

    RoleUpdate:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 1
      properties:
        version:
          type: integer
          minimum: 1
          description: Версия роли, которую видел клиент (`Role.version`); при расхождении — 409 `role_version_conflict`
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        access:
          $ref: '#/components/schemas/ResourceAccess'
        restricted_fields:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RestrictedField'

    RolePreviewIn:
      type: object
      additionalProperties: false
      properties:
        role_id:
          $ref: '#/components/schemas/RoleId'
        access:
          $ref: '#/components/schemas/ResourceAccess'
        restricted_fields:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RestrictedField'

    SectionLevel:
      type: object
      additionalProperties: false
      required: [resource, level]
      properties:
        resource:
          type: string
          description: Раздел каталога
        level:
          $ref: '#/components/schemas/AccessLevel'

    RoleImpact:
      type: object
      additionalProperties: false
      required: [employee, gained, lost, fields_gained, fields_lost]
      properties:
        employee:
          $ref: '#/components/schemas/PersonRef'
        gained:
          type: array
          description: Разделы, которые появятся или станут полными (уровень «после»)
          items:
            $ref: '#/components/schemas/SectionLevel'
        lost:
          type: array
          description: Разделы, которые пропадут или станут только для чтения (уровень «до»)
          items:
            $ref: '#/components/schemas/SectionLevel'
        fields_gained:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedField'
        fields_lost:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedField'

    RolePreview:
      type: object
      additionalProperties: false
      required: [employees_total, employees, gained, lost, fields_gained, fields_lost]
      properties:
        role_id:
          oneOf:
            - $ref: '#/components/schemas/RoleId'
            - type: 'null'
        employees_total:
          type: integer
          minimum: 0
          description: Сколько сотрудников имеют роль (у черновика новой роли — 0)
        employees:
          type: array
          description: Только сотрудники, у которых права изменятся
          items:
            $ref: '#/components/schemas/RoleImpact'
        gained:
          type: array
          items:
            $ref: '#/components/schemas/SectionLevel'
        lost:
          type: array
          items:
            $ref: '#/components/schemas/SectionLevel'
        fields_gained:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedField'
        fields_lost:
          type: array
          items:
            $ref: '#/components/schemas/RestrictedField'

    IntegrationCardKey:
      type: string
      enum: [erp, telegram, mail, services, models, spend, storage, system]
      description: >-
        Карточки экрана «Внешние интеграции» в порядке показа: ERP, Telegram, Почта, Внешние сервисы, Модели ИИ, Расходы,
        Хранилище и бэкапы, Состояние системы.

    IntegrationStatus:
      type: string
      enum: [ok, warn, fail, unknown, 'off']
      description: >-
        Статус пятью уровнями — уровни реестра внешних сервисов CRM (ADR-0024 CRM): `ok` работает, `warn` внимание, `fail`
        сбой, `unknown` нет данных, `off` не подключён или не применимо. Интерфейс всегда показывает слово, не только цвет.

    IntegrationAccess:
      type: string
      enum: [ok, forbidden, unavailable]
      description: >-
        Данные карточки получены (`ok`), CRM отказала ролям сотрудника (`forbidden`, например у директора нет моделей и
        бэкапов) или не ответила (`unavailable`). Статус `unknown` у карточки без данных.

    IntegrationNote:
      type: string
      enum: [all_ok, problems, not_configured, paused, rotation_pending, backup_stale, no_backups, bot_not_running, budget_near, budget_over, no_data]
      description: >-
        Короткая пометка карточки — машинный код, фраза на языке сотрудника собирается в интерфейсе. `count` — сколько
        сервисов или алиасов с проблемой; `amount_usd` — расход за сегодня.

    IntegrationCard:
      type: object
      additionalProperties: false
      required: [key, status, access, note, count, amount_usd, last_activity_at]
      properties:
        key: {$ref: '#/components/schemas/IntegrationCardKey'}
        status: {$ref: '#/components/schemas/IntegrationStatus'}
        access: {$ref: '#/components/schemas/IntegrationAccess'}
        note: {$ref: '#/components/schemas/IntegrationNote'}
        count: {type: [integer, 'null']}
        amount_usd: {type: [number, 'null']}
        last_activity_at:
          type: [string, 'null']
          format: date-time
          description: Последняя проверка или событие карточки; `null` — данных нет

    AttentionKind:
      type: string
      enum: [not_configured, service, model_problem, backup_stale, component, budget_over, budget_near, rotation_pending, paused, bot_not_running]

    ServiceState:
      type: string
      enum: [ok, broken, unstable, degraded, not_configured, disabled, expected, not_checked]
      description: >-
        Состояние словом (W15-H3, решает CRM): `broken` Сломано (непрерывный сбой не короче 15 минут), `unstable` Нестабильно
        (короткие провалы и дребезг — жёлтое, без оповещений), `degraded` Работает с перебоями, `not_configured`
        Не настроено, `disabled` Выключено намеренно, `expected` Ожидаемо на стенде (серым, без оповещений и без «Требует
        внимания»), `not_checked` Не проверено — нажмите «Проверить», `ok` Работает.

    ServiceOwner:
      type: string
      enum: [admin, owner, hosting, provider]
      description: >-
        Кто исправляет: `admin` Вы (администратор); `owner` Владелец компании — ключ и оплата провайдера; `hosting` Хостинг —
        сервер (тот, кто разворачивал Платформу); `provider` Провайдер — сбой на их стороне, ждём.

    ServiceAction:
      type: string
      enum: [enter_key, enter_token, recheck, reconnect, open_settings, write_owner, write_hosting, disable_provider, open_bus]
      description: >-
        Действие по смыслу: `enter_key` Ввести новый ключ (форма в карточке «Модели ИИ»), `enter_token` Ввести новый токен
        (карточка Telegram), `recheck` Проверить снова, `reconnect` Переподключить, `open_settings` Открыть настройки,
        `write_owner` Написать владельцу и `write_hosting` Передать хостингу (готовый текст `message` — копируется, ничего
        не отправляется), `disable_provider` Выключить провайдера (пароль администратора), `open_bus` Открыть журнал обмена
        (`/admin/bus`, раздел `admin` — полный; строка «Шина: недоставленные события», W15-H8b).

    ServiceGroup:
      type: object
      additionalProperties: false
      required: [id, state, owner, action, more_actions, headline, detail, affected, service_keys, titles, since, technical, message, fix_card, flaps_24h]
      description: >-
        Одна причина — одна строка «Требует внимания» (W15-H3): сервисы реестра CRM с общим корнем свёрнуты вместе
        («Ключ Anthropic отклонён — не работают: диалог с клиентом, запасная модель, поиск по базе знаний»). Правило
        группировки, «кто исправляет» и действие решает CRM (`external_cause`); BFF их не оценивает.
      properties:
        id: {type: string, description: 'Корень причины (`vendor.anthropic:key_rejected`) — стабильный ключ строки'}
        state: {$ref: '#/components/schemas/ServiceState'}
        owner:
          anyOf:
          - {$ref: '#/components/schemas/ServiceOwner'}
          - {type: 'null'}
        action:
          description: Главное действие (одно); `null` — исправлять нечего
          anyOf:
          - {$ref: '#/components/schemas/ServiceAction'}
          - {type: 'null'}
        more_actions:
          type: array
          description: Запасные действия
          items: {$ref: '#/components/schemas/ServiceAction'}
        headline: {type: string, description: 'Что случилось одной фразой на русском (текст CRM), без сырых ответов провайдера'}
        detail: {type: [string, 'null'], description: 'Что сделать и кому передать (текст CRM)'}
        affected:
          type: array
          description: Что перестало работать — функции списком (текст CRM)
          items: {type: string}
        service_keys:
          type: array
          items: {type: string}
        titles:
          type: array
          items: {type: string}
        since: {type: [string, 'null'], format: date-time, description: 'Когда впервые обнаружено («с …»)'}
        technical:
          type: array
          description: >-
            Сырой текст проверки для «Технических подробностей» (свёрнуто, «Скопировать для поддержки»); секреты
            замаскированы CRM.
          items: {type: string}
        flaps_24h: {type: integer, description: 'Провалов (полос сбоя) за сутки по сервисам причины — наибольшее'}
        message:
          type: [string, 'null']
          description: Готовый текст владельцу или хостингу; пользователь копирует его сам, Платформа ничего не отправляет
        fix_card:
          description: Карточка экрана, где действие выполняется; `null` — действие не требует карточки
          anyOf:
          - {$ref: '#/components/schemas/IntegrationCardKey'}
          - {type: 'null'}

    AttentionItem:
      type: object
      additionalProperties: false
      required: [id, card, severity, kind, subject, detail, group, technical]
      properties:
        id: {type: string, description: 'Стабильный ключ строки (`group:docling:server_down`, `model:dialog-model`, `setup:erp`)'}
        card: {$ref: '#/components/schemas/IntegrationCardKey'}
        severity:
          type: string
          enum: [fail, warn, setup]
          description: '`fail` сбой, `warn` внимание, `setup` ещё не подключено'
        kind: {$ref: '#/components/schemas/AttentionKind'}
        subject:
          type: [string, 'null']
          description: Название сервиса, алиаса или компонента — данные CRM, показываются как есть
        detail:
          type: [string, 'null']
          description: Итог проверки и подсказка «что сделать» от CRM (текст CRM, на русском)
        group:
          description: >-
            Для `kind: service` — группа по причине (состояние, кто исправляет, действие, «с …»); для остальных `null`.
            «Ожидаемо на стенде» в `attention` не попадает.
          anyOf:
          - {$ref: '#/components/schemas/ServiceGroup'}
          - {type: 'null'}
        technical:
          type: [string, 'null']
          description: 'Сырой ответ провайдера (секреты замаскированы) — интерфейс показывает его только свёрнутым, под «Технические подробности»'

    IntegrationsOverview:
      type: object
      additionalProperties: false
      required: [checked_at, cards, attention]
      properties:
        checked_at: {type: string, format: date-time}
        cards:
          type: array
          items: {$ref: '#/components/schemas/IntegrationCard'}
        attention:
          type: array
          description: '«Требует внимания»: сначала сбои, затем предупреждения, затем неподключённое'
          items: {$ref: '#/components/schemas/AttentionItem'}

    PasswordConfirm:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 256
          description: Пароль администратора (повторный ввод); уходит только в CRM, нигде не сохраняется и не пишется в журнал

    ErpPairIn:
      type: object
      additionalProperties: false
      required: [base_url, password]
      properties:
        base_url: {type: string, minLength: 1, maxLength: 500, description: Адрес ERP}
        code:
          type: [string, 'null']
          format: password
          writeOnly: true
          maxLength: 64
          description: Одноразовый код из настроек ERP; без него — сопряжение без кода (если ERP его разрешает)
        password: {type: string, format: password, writeOnly: true, minLength: 1, maxLength: 256}

    TelegramTokenIn:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: {type: string, format: password, writeOnly: true, minLength: 20, maxLength: 128}
        password: {type: string, format: password, writeOnly: true, minLength: 1, maxLength: 256}

    SmtpSettingsIn:
      type: object
      additionalProperties: false
      required: [host, password]
      properties:
        host: {type: string, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535, default: 587}
        security: {type: string, enum: [starttls, ssl, none], default: starttls}
        from_email: {type: string, maxLength: 255, default: ''}
        from_name: {type: string, maxLength: 120, default: ''}
        username: {type: [string, 'null'], maxLength: 255, description: '`null` — оставить прежний логин'}
        smtp_password:
          type: [string, 'null']
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 512
          description: Пароль SMTP; `null` — оставить прежний
        password: {type: string, format: password, writeOnly: true, minLength: 1, maxLength: 256, description: Пароль администратора}

    ServiceSwitchIn:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, format: password, writeOnly: true, minLength: 1, maxLength: 256}
        reason: {type: [string, 'null'], maxLength: 200, description: Причина — попадает в аудит}

    AiModelChangeIn:
      type: object
      additionalProperties: false
      required: [provider, model, password]
      properties:
        provider: {type: string, enum: [anthropic, gemini, openai]}
        model: {type: string, minLength: 1, maxLength: 128}
        api_key:
          type: [string, 'null']
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 512
          description: Ключ провайдера; `null` — ключ из настроек сервера
        api_base: {type: [string, 'null'], maxLength: 256}
        password: {type: string, format: password, writeOnly: true, minLength: 1, maxLength: 256}

    TelegramChannelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TelegramChannel'}

    MailLog:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MailLogItem'}

    AiModelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AiModel'}

    ExternalServiceList:
      type: object
      additionalProperties: false
      required: [checked_at, summary, items, stand, groups]
      properties:
        checked_at: {type: [string, 'null'], format: date-time}
        stand: {type: boolean, description: 'Тестовый стенд (не прод): часть причин «ожидаема на стенде»'}
        groups:
          type: array
          description: 'Не-`ok` сервисы, свёрнутые по причине; порядок: сломано, перебои, не настроено, не проверено, ожидаемо, выключено'
          items: {$ref: '#/components/schemas/ServiceGroup'}
        summary: {$ref: '#/components/schemas/ServicesSummary'}
        items:
          type: array
          items: {$ref: '#/components/schemas/ExternalService'}

    ErpConnector:
      description: 'Коннектор ERP (CRM `GET /integrations/erp`). Значения токенов не возвращаются — только «задан» и последние 4 символа (`*_last4`).'
      properties:
        base_url: {type: string}
        configured: {type: boolean}
        mode: {enum: [local, erp], type: string}
        paired: {type: boolean}
        previous_secret_until: {format: date-time, type: [string, 'null']}
        rotation_pending: {type: boolean}
        secrets_enabled: {type: boolean}
        suggested_base_url: {type: string}
        token_configured: {type: boolean}
        token_last4: {type: [string, 'null']}
        token_updated_at: {format: date-time, type: [string, 'null']}
        webhook_secret_configured: {type: boolean}
        webhook_secret_last4: {type: [string, 'null']}
      required: [base_url, configured, mode, paired, previous_secret_until, rotation_pending, secrets_enabled, suggested_base_url,
        token_configured, token_last4, token_updated_at, webhook_secret_configured, webhook_secret_last4]
      type: object
      additionalProperties: false
    ErpCheck:
      description: 'Итог «Проверить связь» с ERP. `rate_limited` — ERP ответила лимитом частоты сервисного токена: это статус, не ошибка; `retry_after_s` — через сколько секунд повторить.'
      properties:
        checked_at: {format: date-time, type: string}
        latency_ms: {type: [integer, 'null']}
        migrations_applied: {type: [boolean, 'null']}
        queue_alive: {type: [boolean, 'null']}
        retry_after_s: {type: [integer, 'null']}
        status: {enum: [ok, degraded, rate_limited], type: string}
        version: {type: [string, 'null']}
      required: [checked_at, latency_ms, migrations_applied, queue_alive, retry_after_s, status, version]
      type: object
      additionalProperties: false
    ErpPairing:
      description: 'Итог сопряжения или ротации: состояние коннектора и проверка связи сразу после. Сопряжение удалось, даже если проверка не прошла: тогда `check = null`, а `check_error` — подкод причины (`erp_unauthorized`, `erp_unavailable`, …).'
      properties: {check: {anyOf: [{$ref: '#/components/schemas/ErpCheck'}, {type: 'null'}]}, check_error: {type: [string, 'null']},
        status: {$ref: '#/components/schemas/ErpConnector'}}
      required: [check, check_error, status]
      type: object
      additionalProperties: false
    TelegramConnector:
