      summary: 'Расходы бота на ИИ'
      description: >-
        CRM `GET /spend`. Директору — на чтение (в CRM право `spend:read` даёт «Сводка по компании»).
      parameters:
        - name: days
          in: query
          required: false
          description: Период в днях, 1–180 (по умолчанию 30)
          schema: {type: integer, minimum: 1, maximum: 180, default: 30}
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendReport'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/integrations/ai-spend:
    get:
      tags: [integrations]
      operationId: getAiSpendReport
      summary: 'Расходы на ИИ всего ансамбля'
      description: >-
        CRM `GET /admin/ai-spend`: журнал LiteLLM по дням, системам, функциям и моделям; бюджеты и дни превышения. Период —
        до 90 дней, не в будущем (422); шлюз недоступен — 502 `INTEGRATION_FAILED`.
      parameters:
        - name: from
          in: query
          required: false
          description: Первый день (Ташкент); по умолчанию to − 29
          schema: {type: string, format: date}
        - name: to
          in: query
          required: false
          description: Последний день (Ташкент); по умолчанию сегодня
          schema: {type: string, format: date}
        - name: group
          in: query
          required: false
          description: Измерение рядов `rows`
          schema: {type: string, enum: [day, system, feature, model], default: day}
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSpendReport'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/IntegrationInvalid'
        '502':
          $ref: '#/components/responses/IntegrationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/integrations/backups:
    get:
      tags: [integrations]
      operationId: getBackups
      summary: 'Хранилище и бэкапы'
      description: >-
        CRM `GET /system/backups`: последние копии, свежесть, сервис бэкапа.
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupsStatus'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'
    post:
      tags: [integrations]
      operationId: requestBackup
      summary: 'Сделать бэкап сейчас'
      description: >-
        CRM `POST /system/backups`: сервис бэкапа начнёт в течение ~30 с. 409 — том бэкапов не смонтирован или бэкап делает
        другой сервер.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: Готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupsStatus'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IntegrationConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/IntegrationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/integrations/system:
    get:
      tags: [integrations]
      operationId: getSystemStatus
      summary: 'Состояние системы'
      description: >-
        CRM `GET /system/status`: компоненты в порядке «сбой, предупреждение, нет данных, норма». Моделей не вызывает.
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/bus:
    get:
      tags: [bus]
      operationId: getBusJournal
      summary: 'Журнал интеграций: сводка шины по доменам и подписчики'
      description: >-
        CRM `GET /api/v1/bus/overview`, ERP `GET /api/v1/integration/bus/overview/`, EDS `GET /api/v1/bus/overview` —
        параллельно, с токеном сотрудника. Домен, который не ответил или отказал, в `domains` не попадает, его состояние —
        `sources`.
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusJournal'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/bus/deliveries:
    get:
      tags: [bus]
      operationId: listBusDeliveries
      summary: 'Журнал интеграций: доставки событий (DLQ — status=dead)'
      description: >-
        Доставки всех доменов (или одного — `domain`), новые сверху; списки доменов сливаются по `created_at`. Страница —
        `cursor` из `next_cursor` (`null` — дальше нет).
      parameters:
        - $ref: '#/components/parameters/BusDomainQuery'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BusDeliveryStatus'
        - $ref: '#/components/parameters/BusSubscriberQuery'
        - $ref: '#/components/parameters/BusTypeQuery'
        - name: from
          in: query
          required: false
          description: Создана не раньше (включительно)
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: false
          description: Создана раньше (не включительно)
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/BusCursor'
        - $ref: '#/components/parameters/BusLimit'
      responses:
        '200':
          description: Страница доставок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusDeliveryPage'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/bus/inbox:
    get:
      tags: [bus]
      operationId: listBusInbox
      summary: 'Журнал интеграций: принятые события (errors=true — с ошибкой обработки)'
      description: >-
        Принятые события всех доменов (или одного), новые сверху; `errors=true` — обработка упала (`failed`) или ждёт
        автоповтора после ошибки. Страница — `cursor` из `next_cursor`.
      parameters:
        - $ref: '#/components/parameters/BusDomainQuery'
        - name: errors
          in: query
          required: false
          schema: {type: boolean, default: false}
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BusInboxStatus'
        - $ref: '#/components/parameters/BusTypeQuery'
        - $ref: '#/components/parameters/BusCursor'
        - $ref: '#/components/parameters/BusLimit'
      responses:
        '200':
          description: Страница принятых событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusInboxPage'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/bus/{domain}/deliveries/{id}/retry:
    post:
      tags: [bus]
      operationId: retryBusDelivery
      summary: '«Повторить» доставку'
      description: >-
        Доставка `dead` или ожидающая уходит сейчас, попытки с нуля; подписчик на паузе предохранителя получает пробу.
        Идемпотентно: доставлено, в работе или нет такой — `retried: 0`. Домен пишет повтор в свой журнал с автором.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/BusDomainPath'
        - name: id
          in: path
          required: true
          description: Id доставки в домене
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Поставлено на повтор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusRetryResult'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/bus/{domain}/deliveries/retry-dead:
    post:
      tags: [bus]
      operationId: retryBusDeadLetters
      summary: '«Повторить все dead подписчика»'
      description: >-
        Все доставки `dead` подписчика в домене уходят сейчас, попытки с нуля (после исправления причины: адрес, секрет,
        приёмник). Повтор безопасен — приёмник гасит дубли по id события. `retried` — сколько поставлено.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/BusDomainPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusRetryDeadIn'
      responses:
        '200':
          description: Поставлено на повтор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusRetryResult'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/bus/{domain}/inbox/{event_id}/retry:
    post:
      tags: [bus]
      operationId: retryBusInbox
      summary: '«Повторить обработку» принятого события'
      description: >-
        Запись `failed` или `skipped` снова обрабатывается (после исправления обработчика или данных). Идемпотентно:
        обработано или ждёт — `retried: 0`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/BusDomainPath'
        - name: event_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Поставлено на повтор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusRetryResult'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/users:
    get:
      tags: [admin]
      operationId: listEmployees
      summary: Сотрудники (Admin · Оргструктура)
      description: Доступ — раздел `admin` каталога (чтение — список и карточки, полный — изменения).
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EmployeeStatus'
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeList'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [admin]
      operationId: createEmployee
      summary: Добавить сотрудника без почты — временный пароль показывается один раз
      description: >-
        Раздел `admin` — полный. Для тех, кому письмо не придёт (почта ещё не подключена, у сотрудника нет почты на этом адресе).
        BFF создаёт пользователя в CRM с ролями Платформы (CRM `/users`) и отдаёт **временный пароль в этом ответе — единственный
        раз**: BFF не пишет его в журнал, не кэширует и не хранит; ответ — `Cache-Control: no-store`. Сотрудник при первом входе
        обязан сменить пароль. Потерянный пароль не восстановить — выдать новый: `POST /admin/users/{id}/temporary-password`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInvite'
      responses:
        '201':
          description: Сотрудник создан, пароль показан
          headers:
            Cache-Control:
              description: '`no-store`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCredentials'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`EMAIL_EXISTS`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/users/invite:
    post:
      tags: [admin]
      operationId: inviteEmployee
      summary: Пригласить сотрудника по почте
      description: >-
        BFF создаёт пользователя в CRM с ролями Платформы (`role_ids`) и отправляет приглашение (CRM `/users`,
        `/users/{id}/invite`); провижининг в ERP делает CRM. Раздел `admin` — полный. Письмо не ушло — 409 `CONFLICT` с
        `details.invite = not_sent` и `details.employee_id` (сотрудник создан; повтор — `POST /admin/users/{id}/invite`).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInvite'
      responses:
        '201':
          description: Приглашён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`EMAIL_EXISTS`; `CONFLICT` с `details.invite = not_sent` (письмо не ушло)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          description: '`BACKEND_UNAVAILABLE` — CRM не ответила; если сотрудник уже создан — `details.invite = not_sent`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users/{id}/invite:
    post:
      tags: [admin]
      operationId: resendInvite
      summary: Отправить приглашение снова
      description: >-
        Повтор письма-приглашения сотруднику со статусом «Приглашён» (CRM `/users/{id}/invite`). CRM выдаёт новый
        временный пароль только при отправке письма: без подключённой почты пароль не меняется и ответ — 409 `CONFLICT` с
        `details.invite = not_sent`. Раздел `admin` — полный.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Письмо поставлено в отправку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CONFLICT` с `details.invite = not_sent` — письмо не ушло (почта не подключена)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`BACKEND_UNAVAILABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users/{id}/temporary-password:
    post:
      tags: [admin]
      operationId: issueTemporaryPassword
      summary: Выдать сотруднику новый временный пароль (без почты)
      description: >-
        Раздел `admin` — полный (CRM `/users/{id}/reset-password`). Новый пароль показан **в этом ответе один раз**
        (`Cache-Control: no-store`; BFF его не логирует, не кэширует и не хранит), прежний пароль и все сессии сотрудника в CRM и ERP
        перестают действовать, при входе он обязан сменить пароль (в списке — «Приглашён»). Повторный запрос выдаёт ещё один новый
        пароль, старый получить нельзя. Свой пароль так не меняют — 409 `CONFLICT` с `details.reason = own_account` (смена — в профиле).
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Пароль выдан
          headers:
            Cache-Control:
              description: '`no-store`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCredentials'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CONFLICT` с `details.reason = own_account` — свой пароль меняется в профиле'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/users/{id}:
    get:
      tags: [admin]
      operationId: getEmployee
      summary: Карточка сотрудника
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: Сотрудник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [admin]
      operationId: updateEmployee
      summary: Роли, должность, отключение — единое место выдачи ролей обеих систем
      description: >-
        Раздел `admin` — полный. Роли — полный новый набор `role_ids`; права в CRM и ERP вычисляет CRM. Снять последнего
        активного администратора или директора (роль или отключение) нельзя — 409 `LAST_ADMIN` / `LAST_DIRECTOR`. У сотрудника
        есть лиды в работе, а изменение отнимает у него работу с лидами, — 409 `CONFLICT` с
        `details.reason = user_has_active_leads`; повтор с `transfer_to_user_id` передаёт лиды коллеге. Пустой набор ролей —
        422 `ROLES_REQUIRED` (0.6.0): у сотрудника хотя бы одна роль, закрыть доступ — `is_active = false`.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdate'
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`LAST_ADMIN`, `LAST_DIRECTOR`, `CONFLICT` (`details.reason = user_has_active_leads`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            `ROLES_REQUIRED` — пустой набор `role_ids` (`details.fields = [role_ids]`); `VALIDATION_FAILED` — прочие поля
            (`details.fields`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users/{id}/reset-password/email:
    post:
      tags: [admin]
      operationId: resetEmployeePasswordByEmail
      summary: Сбросить пароль сотрудника и отправить временный по почте
      description: >-
        CRM `/users/{id}/reset-password/email`: новый временный пароль, письмо через коннектор «Почта», сессии сотрудника
        завершаются, при входе он обязан сменить пароль (статус «Приглашён»). Пароль в ответе не возвращается. Раздел `admin` —
        полный. Себе сбросить нельзя — 409 `CONFLICT` с `details.reason = self_reset` (в CRM запрос не уходит; свой пароль —
        «Сменить пароль» в меню аватара). Почта не подключена — 409 `NOT_CONFIGURED`, пароль не меняется; нет ключа шифрования
        секретов — 409 `SECRETS_KEY_MISSING`.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Письмо поставлено в отправку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailQueued'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CONFLICT` (`details.reason = self_reset`), `NOT_CONFIGURED`, `SECRETS_KEY_MISSING`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`BACKEND_UNAVAILABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/roles:
    get:
      tags: [admin]
      operationId: listRoles
      summary: Роли Платформы (Admin · Ролевая матрица) — системные и созданные, с числом сотрудников
      description: >-
        Раздел `admin` — от чтения (0.4.0): матрицу видят администратор (полный доступ) и директор (только чтение);
        CRM — `users:read`.
      responses:
        '200':
          description: Роли в порядке CRM (системные первыми)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      operationId: createRole
      summary: Создать роль (с нуля или из шаблона каталога — шаблон SPA подставляет в черновик)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`CONFLICT` с `details.reason = name_taken` — роль с таким названием уже есть'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/roles/preview:
    post:
      tags: [admin]
      operationId: previewRole
      summary: «Что произойдёт» — кто из сотрудников какие разделы получит или потеряет при сохранении черновика
      description: >-
        Без `role_id` — черновик новой роли (сотрудников не затрагивает), с `role_id` — изменение существующей. Ничего не
        сохраняет. Системную роль изменить нельзя — 409 `ROLE_SYSTEM`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePreviewIn'
      responses:
        '200':
          description: Последствия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePreview'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ROLE_SYSTEM`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/roles/{id}:
    get:
      tags: [admin]
      operationId: getRole
      summary: Роль
      description: Раздел `admin` — от чтения (0.4.0), как у списка.
      parameters:
        - $ref: '#/components/parameters/RoleIdPath'
      responses:
        '200':
          description: Роль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [admin]
      operationId: updateRole
      summary: Переименовать роль, изменить описание, матрицу или поля с ограничением
      description: >-
        Не присланное поле не меняется (кроме `version` нужно хотя бы одно — иначе 422); `version` — обязательная версия
        роли, которую видел клиент. Права сотрудников с этой
        ролью CRM пересчитывает сразу (CRM) и фоном (ERP). Системную роль изменить нельзя — 409 `ROLE_SYSTEM`; изменение,
        после которого не остаётся ни одного администратора, — 409 `LAST_ADMIN`; роль изменена после чтения клиентом — 409
        `CONFLICT` с `details.reason = role_version_conflict` (SPA предлагает обновить страницу).
      parameters:
        - $ref: '#/components/parameters/RoleIdPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: Сохранена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ROLE_SYSTEM`, `LAST_ADMIN`, `CONFLICT` (`details.reason = name_taken` или `role_version_conflict`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [admin]
      operationId: deleteRole
      summary: Удалить роль — только без сотрудников
      description: >-
        Роль, выданную сотрудникам, удалить нельзя — 409 `ROLE_IN_USE` с `details.employees` (сколько сотрудников);
        системную — 409 `ROLE_SYSTEM`.
      parameters:
        - $ref: '#/components/parameters/RoleIdPath'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Удалена
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ROLE_IN_USE`, `ROLE_SYSTEM`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/roles/{id}/journal:
    get:
      tags: [admin]
      operationId: getRoleJournal
      summary: Журнал изменений роли — кто, когда и что (вкладка «Журнал» бокового окна роли)
      description: >-
        Записи аудита CRM `platform_role.create|update|delete` этой роли (`/audit?entity_type=platform_role&entity_id=<id>`), новые
        первыми. В каждой — автор, время и содержимое роли до и после (название, описание, матрица разделов, поля с
        ограничением); сравнение «что изменилось» делает экран. Роли нет — 404 `NOT_FOUND`. Раздел `admin` — от чтения (директор
        читает).
      parameters:
        - $ref: '#/components/parameters/RoleIdPath'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Журнал роли
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleJournal'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          description: '`BACKEND_UNAVAILABLE` — CRM не ответила'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/audit:
    get:
      tags: [admin]
      operationId: listAudit
      summary: Журнал аудита — кто, что и когда изменил
      description: >-
        Журнал аудита CRM (`/audit`, право `audit:read`): новые записи первыми, постранично. Фильтры: автор (`actor_id`),
        действие (`action` — код или префикс, например `user` — все действия над сотрудниками), объект (`entity_type` и
        `entity_id`) и период (`from` включительно, `to` не включая). Входы в систему по умолчанию скрыты (`include_logins`).
        Раздел `admin` — от чтения: журнал читает администратор и директор; изменить записи нельзя никому. Значения секретных
        полей в `before` и `after` (пароль, токен, ключ, `*_key`, учётные данные, `authorization`, `pin`) BFF заменяет на `***` целиком, любого типа.
      parameters:
        - name: actor_id
          in: query
          required: false
          description: Автор записи (`crm_user_id`)
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
        - name: action
          in: query
          required: false
          description: Код действия или его префикс (`user.update`, `platform_role`)
          schema:
            type: string
            maxLength: 64
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
            maxLength: 32
        - name: entity_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: from
          in: query
          required: false
          description: Начало периода, включительно
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Конец периода, не включая
          schema:
            type: string
            format: date-time
        - name: include_logins
          in: query
          required: false
          description: Показывать входы и неудачные попытки входа (по умолчанию скрыты — забивают журнал изменений)
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Страница журнала
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          description: '`BACKEND_UNAVAILABLE` — CRM не ответила'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

