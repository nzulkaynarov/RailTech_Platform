      operationId: listTickets
      summary: Все обращения сотрудников (Настройки · Обращения сотрудников)
      description: >-
        Раздел `admin` от чтения (директор читает, администратор правит). Порядок: «Новое» и «В работе» выше «Решено», внутри
        — свежее выше. `counts` — по статусам без учёта фильтра.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: subject
          in: query
          schema:
            $ref: '#/components/schemas/TicketSubject'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        '200':
          description: Страница обращений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /admin/tickets/{number}:
    get:
      tags: [tickets, admin]
