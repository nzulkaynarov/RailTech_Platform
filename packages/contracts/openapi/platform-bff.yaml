          format: email
        name:
          type: string
        initials:
          type: string
          maxLength: 3
        position:
          type: string
          description: Должность — текст (не роль)
        language:
          $ref: '#/components/schemas/Language'
        roles:
          type: array
          minItems: 1
          description: Роли сотрудника (названия — данные CRM)
          items:
            $ref: '#/components/schemas/RoleRef'
