        balance: {$ref: '#/components/schemas/PaymentMoney'}
        issued_at: {type: [string, 'null'], format: date}
        due_date: {type: [string, 'null'], format: date}
        status: {$ref: '#/components/schemas/PaymentDisplayStatus'}
        days_overdue: {type: [integer, 'null'], minimum: 1}
        has_pending_proof: {type: boolean}
        proof_received_at: {type: [string, 'null'], format: date-time}
    PaymentBoard:
      type: object
