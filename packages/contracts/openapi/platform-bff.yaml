        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /me/avatar:
    put:
      tags: [me]
      operationId: uploadAvatar
      summary: Загрузить фото профиля
      description: >-
        `multipart/form-data`, поле `avatar`: уже обрезанная по кругу картинка (клиент режет её до 256x256), PNG, JPEG или WebP не
        больше 1 МБ. Тип проверяется по содержимому. Иначе 422 `VALIDATION_FAILED` с `details.reason`: `avatar_unsupported_type`,
        `avatar_type_mismatch`, `avatar_empty`; тело больше предела (1 МБ и запас на multipart) читается потоком и обрывается — 413
        `PAYLOAD_TOO_LARGE` (`details.reason = avatar_too_large`). Ответ — обновлённый `Me` (`avatar_url` с новой версией).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvatarUpload'
      responses:
        '200':
          description: Фото заменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '413':
          description: '`PAYLOAD_TOO_LARGE` — фото больше 1 МБ'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'
    delete:
      tags: [me]
      operationId: deleteAvatar
      summary: Удалить фото профиля
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Фото удалено (снова инициалы)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '503':
          $ref: '#/components/responses/BackendUnavailable'

  /staff/{id}/avatar:
    get:
