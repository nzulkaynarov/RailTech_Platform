        CRM `GET /reply-templates` (`reply_templates:read`). Раздел `crm.leads` полный — тем, кто отвечает клиентам; правит
        шаблоны администратор в Admin · Настройки бота.
      responses:
        '200':
          description: Шаблоны по названию
