          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NotificationTab'
        - name: cursor
          in: query
          required: false
          description: Непрозрачный курсор из `next_cursor`
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Страница уведомлений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/SessionExpired'

  /notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Отметить прочитанным
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор с префиксом источника — `erp:123`, `crm:45`
          schema:
            type: string
            pattern: '^(crm|erp):[0-9]+$'
