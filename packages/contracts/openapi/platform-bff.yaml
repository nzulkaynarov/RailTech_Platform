  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Состояние BFF и источников
      security: []
      responses:
        '200':
          description: BFF жив; статусы источников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /about:
    get:
      tags: [system]
      operationId: getAbout
      summary: О системе — версия Платформы и состояние сервисов
      description: >-
        W-REL. Версия релиза — по дате выкладки (`2026.10.28`) и короткому sha коммита; BFF берёт их из тега образа и
        переменных окружения (`PLATFORM_RELEASE`, `PLATFORM_RELEASE_DATE`, при сборке — `PLATFORM_BUILD_SHA`,
        `PLATFORM_BUILD_DATE`). Локальная сборка без них — `version = dev`. Сервисы — BFF и источники CRM, ERP, EDS: состояние
        по их health за 3 с и версия, если health её сообщает (сейчас — EDS и сам BFF). Нужна сессия, прав раздела не нужно:
        «О системе» есть в помощи у каждого сотрудника. Персональных данных в ответе нет.
      responses:
        '200':
          description: Версия и сервисы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/About'
        '401':
          $ref: '#/components/responses/SessionExpired'

  /menu-counters:
    get:
      tags: [dashboard]
      operationId: getMenuCounters
      summary: Бейджи подменю всех доступных модулей
      responses:
