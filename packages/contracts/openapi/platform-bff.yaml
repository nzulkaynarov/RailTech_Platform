      description: Служебная записка (СЗ), заявление (ЗЯ), отчёт (ОТ), письмо (ИСХ)
    EdsRegistryKind:
      type: string
      enum: [letter_in, letter_out, quote, memo, application, report]
      description: 'Вкладки реестра «Все документы»: письма (входящие и исходящие), КП, служебные, заявления, отчёты'
    EdsPerson:
      type: object
      additionalProperties: false
      required: [crm_user_id, full_name]
      properties:
        crm_user_id: {type: integer}
        full_name: {type: string}
    EdsMoney:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: {type: string, pattern: '^\d+\.\d{2}$', description: 'Деньги строкой с двумя знаками, больше нуля: `1500000.00`'}
        currency: {type: string, pattern: '^[A-Z]{3}$', examples: [UZS]}
    EdsRecipient:
      type: object
      additionalProperties: false
      required: [name]
      description: Адресат письма (организация) — только тип `letter_out`
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        inn: {type: [string, 'null'], maxLength: 32}
    EdsDocumentRow:
      type: object
      additionalProperties: false
      required: [kind, id, number, subject, status, author, amount, due_date, created_at, openable]
      properties:
        kind: {$ref: '#/components/schemas/EdsRegistryKind'}
        id: {type: string, format: uuid}
        number: {type: [string, 'null'], description: 'Номер реестра EDS или КП ERP; `null` — письмо до отправки'}
        subject: {type: string}
        status:
          type: string
          description: >-
            Статус словом по типу. Документ — `draft`, `on_approval`, `returned`, `rejected`, `approved`, `to_accountant`,
            `paid`, `sent`; входящее письмо — `awaiting_resolution`, `resolved`, `returned`, `rejected`; КП (маршрут) —
            `open`, `approved`, `returned`, `rejected`
        author: {oneOf: [{$ref: '#/components/schemas/EdsPerson'}, {type: 'null'}], description: 'Автор документа; у письма и КП — ответственный'}
        amount: {oneOf: [{$ref: '#/components/schemas/EdsMoney'}, {type: 'null'}], description: 'Только «Мои»; в реестре `null`'}
        due_date: {type: [string, 'null'], format: date, description: 'Только «Мои»; в реестре `null`'}
        created_at: {type: string, format: date-time, description: 'Создан (в реестре — зарегистрирован)'}
        openable:
          type: boolean
          description: Документ (`memo`, `application`, `report`, `letter_out`) открывается в боковом окне; письма и КП — в своих разделах
    EdsDocumentPage:
      type: object
