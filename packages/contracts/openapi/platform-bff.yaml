        amount: {oneOf: [{$ref: '#/components/schemas/EdsMoney'}, {type: 'null'}]}
        due_date: {type: [string, 'null'], format: date}
        files:
          type: array
          items: {$ref: '#/components/schemas/EdsFile'}
        deal: {oneOf: [{$ref: '#/components/schemas/EdsDealRef'}, {type: 'null'}], description: Связь с проектом}
