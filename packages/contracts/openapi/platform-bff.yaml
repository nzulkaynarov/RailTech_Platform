        '403':
          $ref: '#/components/responses/CsrfFailed'
        '409':
          description: '`NOT_CONFIGURED` — бот не подключён; `CONFLICT` (`details.reason = bot_not_running`) — бот сейчас не запущен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/BackendUnavailable'
    delete:
      tags: [me]
      operationId: deleteTelegramLink
