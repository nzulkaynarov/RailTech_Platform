      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        vat_rate:
          $ref: '#/components/schemas/DecimalString'
          description: Ставка НДС платформы, %
    FxRate:
      type: object
      additionalProperties: false
      required: [rate_to_uzs, rate_date, source]
      description: Курс 1 USD в сумах на дату.
      properties:
        rate_to_uzs:
          $ref: '#/components/schemas/DecimalString'
        rate_date:
          type: string
          format: date
        source:
          type: string
          enum: [auto, manual]
          description: '`auto` — автозагрузка курса ЦБ РУз, `manual` — введён вручную'
    FxRateJournalEntry:
      type: object
      additionalProperties: false
      required: [id, kind, rate_date, rate_to_uzs, previous_rate_to_uzs, previous_source, entered_by, entered_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [manual, auto_skipped]
          description: '`manual` — ввод вручную; `auto_skipped` — курс ЦБ на ту же дату не применён, оставлен ручной'
        rate_date:
          type: string
          format: date
        rate_to_uzs:
          $ref: '#/components/schemas/DecimalString'
          description: Введённый курс (`manual`) или курс ЦБ, который не применён (`auto_skipped`)
        previous_rate_to_uzs:
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
          description: Что стояло на эту дату до записи (при `auto_skipped` — оставшийся ручной курс); `null` — ничего
        previous_source:
          oneOf:
            - type: string
              enum: [auto, manual]
            - type: 'null'
        entered_by:
          type:
            - string
            - 'null'
          description: Имя (или почта) сотрудника; `null` — автозагрузка или сотрудник удалён
        entered_at:
          type: string
          format: date-time
    FxRateOverview:
      type: object
      additionalProperties: false
      required: [currency, current, max_age_days, journal]
      properties:
        currency:
          type: string
          enum: [USD]
        current:
          oneOf:
            - $ref: '#/components/schemas/FxRate'
            - type: 'null'
          description: Курс на сегодня (не старше допустимого возраста); `null` — курса нет
        max_age_days:
          type: integer
          description: Допустимый возраст курса в днях (настройка компании в ERP)
        journal:
          type: array
          items:
            $ref: '#/components/schemas/FxRateJournalEntry'
    FxRateIn:
      type: object
      additionalProperties: false
      required: [rate_date, rate_to_uzs]
      properties:
        rate_date:
          type: string
          format: date
          description: Дата курса; по умолчанию в форме — сегодня
        rate_to_uzs:
          $ref: '#/components/schemas/DecimalString'
          description: Сумов за 1 USD; больше 0, не более 6 знаков после запятой
    CreatedId:
      type: object
      additionalProperties: false
      required: [id]
      description: Объект создан в CRM.
      properties:
        id: {type: integer}

    KbDocument:
      type: object
      additionalProperties: false
      description: Документ базы знаний (CRM `KbDocumentOut`).
      required: [id, title, product_key, language, source_type, mime, version, is_active, ingest_status, ingest_error, chunk_count, created_at, updated_at]
      properties:
        id: {type: integer}
        title: {type: string}
        product_key:
          type: [string, 'null']
          description: Ключ продукта справочника; пусто — документ про компанию в целом
        language: {$ref: '#/components/schemas/Language'}
        source_type:
          type: string
          enum: [file, url, manual]
          description: '`file` — загруженный файл, `manual` — введён вручную, `url` — из ссылки (в CRM пока не создаётся)'
        mime: {type: [string, 'null']}
        version: {type: integer, minimum: 1, description: 'Версия документа'}
        is_active: {type: boolean, description: 'Выключенный документ в поиске бота не участвует'}
        ingest_status:
          type: string
          enum: [pending, processing, done, failed]
          description: 'В очереди, обрабатывается, готов, ошибка'
        ingest_error: {type: [string, 'null'], description: 'Причина, если индексация не удалась'}
        chunk_count: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    KbDocumentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/KbDocument'}

    KbDocumentUpload:
      type: object
      additionalProperties: false
      required: [file, title, language]
      properties:
        file:
          type: string
          format: binary
          description: Один файл `.md` по формату базы знаний, не больше 25 МБ
        title: {type: string, minLength: 1, maxLength: 500}
        language: {$ref: '#/components/schemas/Language'}
        product_key:
          type: string
          description: Ключ продукта; не передавать, если документ не про один продукт
        gap_id:
          type: integer
          description: Пробел базы знаний, который закрывает этот документ

    KbManualDocumentIn:
      type: object
      additionalProperties: false
      required: [title, markdown, language]
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        markdown: {type: string, minLength: 1, maxLength: 200000}
        language: {$ref: '#/components/schemas/Language'}
        product_key: {type: [string, 'null']}
        gap_id: {type: [integer, 'null']}

    KbDocumentPatch:
      type: object
      additionalProperties: false
      description: Поля, которые нужно изменить; отсутствующие не трогаются.
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        is_active: {type: boolean}
        product_key: {type: string}
        clear_product: {type: boolean, description: 'Снять продукт (документ про компанию в целом)'}

    KbChunk:
      type: object
      additionalProperties: false
      required: [id, position, heading_path, content, token_count]
      properties:
        id: {type: integer}
        position: {type: integer, minimum: 0}
        heading_path: {type: [string, 'null'], description: 'Путь заголовков: «Доставка > Сроки»'}
        content: {type: string}
        token_count: {type: integer, minimum: 0}

    KbChunkList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/KbChunk'}

    KbSearchIn:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 2000}
        language:
          oneOf:
            - {$ref: '#/components/schemas/Language'}
            - {type: 'null'}
        product_key: {type: [string, 'null']}
        top_k: {type: integer, minimum: 1, maximum: 10, default: 6}

    KbSearchHit:
      type: object
      additionalProperties: false
      required: [chunk_id, document_id, document_title, heading_path, content, similarity, rrf_score]
      properties:
        chunk_id: {type: integer}
        document_id: {type: integer}
        document_title: {type: string}
        heading_path: {type: [string, 'null']}
        content: {type: string}
        similarity: {type: [number, 'null'], description: 'Сходство 0–1; пусто — найден только по словам'}
        rrf_score: {type: number}

    KbSearchResult:
      type: object
      additionalProperties: false
      required: [hits, best_score, min_score, confident, language]
      properties:
        hits:
          type: array
          items: {$ref: '#/components/schemas/KbSearchHit'}
        best_score: {type: [number, 'null']}
        min_score: {type: number, description: 'Порог настроек «Поиск по базе знаний»: ниже бот говорит «не знаю»'}
        confident: {type: boolean, description: 'Хватит ли найденного, чтобы бот ответил'}
        language: {$ref: '#/components/schemas/Language'}

    KbGapStatus:
      type: string
      enum: [open, resolved, ignored]

    KbGap:
      type: object
      additionalProperties: false
      required: [id, lead_id, question, language, best_score, occurrences, status, resolved_document_id, created_at, updated_at]
      properties:
        id: {type: integer}
        lead_id: {type: [integer, 'null'], description: 'Лид, чей вопрос остался без ответа (номер L-NNNN — id лида)'}
        question: {type: string}
        language: {$ref: '#/components/schemas/Language'}
        best_score: {type: [number, 'null']}
        occurrences: {type: integer, minimum: 1, description: 'Сколько раз спросили'}
        status: {$ref: '#/components/schemas/KbGapStatus'}
        resolved_document_id: {type: [integer, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    KbGapPage:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/KbGap'}
        total: {type: integer, minimum: 0}

    KbGapResolveIn:
      type: object
      additionalProperties: false
      required: [document_id]
      properties:
        document_id: {type: integer, minimum: 1}

    KbProduct:
      type: object
      additionalProperties: false
      required: [key, name, description, is_active]
      properties:
        key: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$'}
        name: {type: string}
        description: {type: [string, 'null']}
        is_active: {type: boolean}

    KbProductList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/KbProduct'}

    SandboxMessageIn:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 4000}
        language: {allOf: [{$ref: '#/components/schemas/Language'}], default: ru}

    SandboxReply:
      type: object
      additionalProperties: false
      required: [text, buttons]
      properties:
        text: {type: string}
        buttons:
          type: array
          items: {type: string}

    SandboxWhy:
      type: object
      additionalProperties: false
      description: Почему бот ответил так.
      required: [decision, reason, best_score, documents, triggers, priority]
      properties:
        decision:
          type: string
          description: 'answer, fallback, handoff, deliver_document, choose_document, silent, system; новые значения экран показывает как есть'
        reason: {type: [string, 'null']}
        best_score: {type: [number, 'null']}
        documents:
          type: array
          items: {type: string}
        triggers:
          type: array
          items: {type: string}
          description: Коды сработавших правил передачи (`human_requested`, `price_or_contract_asked`, …)
        priority: {type: [string, 'null']}

    SandboxTurn:
      type: object
      additionalProperties: false
      required: [replies, why]
      properties:
        replies:
          type: array
          items: {$ref: '#/components/schemas/SandboxReply'}
        why: {$ref: '#/components/schemas/SandboxWhy'}

    BotSettings:
      type: object
      additionalProperties: false
      description: >-
        Настройки бота постранично: `values[ключ]` — текущие значения, `schemas[ключ]` — JSON Schema формы (Pydantic CRM).
        Структура значений — модель раздела в CRM (`apps/crm/backend/app/schemas/settings*.py`).
      required: [values, schemas]
      properties:
        values:
          type: object
          additionalProperties: {type: object, additionalProperties: true}
        schemas:
          type: object
          additionalProperties: {type: object, additionalProperties: true}

    EscalationSettingsIn:
      type: object
      additionalProperties: false
      description: Правила передачи менеджеру (раздел `escalation`); пропущенное поле — значение по умолчанию CRM.
      properties:
        high_score_threshold: {type: integer, minimum: 0, maximum: 100}
        no_progress_turns: {type: integer, minimum: 1}
        kb_gap_streak: {type: integer, minimum: 1}
        qualifier_min_confidence: {type: number, minimum: 0, maximum: 1}
        sla_minutes: {type: integer, minimum: 1}
        reminder_minutes: {type: integer, minimum: 1}
        disabled_triggers:
          type: array
          items: {type: string}
        price_always_to_manager: {type: boolean}
        require_phone_for_human_request: {type: boolean}
        human_request_terms:
          type: array
          items: {type: string}

    EscalationDryRunRow:
      type: object
      additionalProperties: false
      required: [run_id, lead_id, at, current, candidate]
      properties:
        run_id: {type: integer}
        lead_id: {type: integer}
        at: {type: string, format: date-time}
        current:
          type: array
          items: {type: string}
          description: Причины передачи сейчас
        candidate:
          type: array
          items: {type: string}
          description: Причины передачи с новыми правилами

    EscalationDryRun:
      type: object
      additionalProperties: false
      required: [dialogs, escalated_current, escalated_candidate, by_code_current, by_code_candidate, changed]
      properties:
        dialogs: {type: integer, minimum: 0}
        escalated_current: {type: integer, minimum: 0}
        escalated_candidate: {type: integer, minimum: 0}
        by_code_current:
          type: object
          additionalProperties: {type: integer}
        by_code_candidate:
          type: object
          additionalProperties: {type: integer}
        changed:
          type: array
          items: {$ref: '#/components/schemas/EscalationDryRunRow'}

    ReplyTemplate:
      type: object
      additionalProperties: false
      required: [id, title, text, updated_at]
      properties:
        id: {type: integer}
        title: {type: string, description: 'Видно менеджеру в списке, клиенту не отправляется'}
        text: {$ref: '#/components/schemas/LocalizedText'}
        updated_at: {type: string, format: date-time}

    ReplyTemplateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReplyTemplate'}

    ReplyTemplateIn:
      type: object
      additionalProperties: false
      required: [title, text]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        text: {$ref: '#/components/schemas/LocalizedText'}
