      headers:
        $ref: '#/components/schemas/DeliveryHeaders'
      bindings:
        $ref: '#/components/messageBindings/delivery'
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          allOf:
            - $ref: './envelope.v1.json'
            - type: object
              properties:
                source:
                  const: rt://crm
                type:
                  const: uz.railtech.crm.client.created.v1
                dataschema:
                  const: rt://contracts/events/crm/client.created/v1
                data:
                  $ref: './crm/client.created.v1.json'
