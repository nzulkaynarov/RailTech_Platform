# AsyncAPI 3.0 — шина rt_bus v1 (ADR-0014; docs/architecture/CONTRACTS.md, раздел «Шина rt_bus»).
# Канал = тип события; сообщение = конверт CloudEvents (envelope.v1.json) с data по схеме типа
# (<домен>/<сущность>.<действие>.v<N>.json). Новый тип: файл схемы + пример + канал, сообщение и операция здесь
# (тест packages/contracts/tests/test_events.py сверяет файлы и этот документ в обе стороны).
#
# schemaFormat draft-07 при схемах JSON Schema 2020-12 — ограничение @asyncapi/parser 3.x: из JSON Schema он знает
# только draft-07 (AsyncAPI Schema). Используемые ключевые слова (type, enum, const, $ref, properties, required,
# additionalProperties, oneOf, if/then, propertyNames, format) в draft-07 значат то же; $defs разрешаются как
# JSON Pointer. Источник истины для проверки data — сами файлы 2020-12 (jsonschema Draft202012Validator в тестах и rt_bus).
#
# address канала — логический (= тип события), а не путь: транспорт v1 один для всех типов — POST <endpoint
# подписчика>/bus/v1/events (servers ниже и bus/subscriptions.yaml); тип читается из поля type конверта.
asyncapi: 3.0.0
info:
  title: RailTech rt_bus
  version: 1.0.0
  description: |
    События доменов ансамбля RailTech Platform. Доставка v1 — HTTP push от издателя каждому подписчику из
    bus/subscriptions.yaml: `POST <endpoint подписчика>` (путь `/bus/v1/events`),
    `Content-Type: application/cloudevents+json`, тело — конверт CloudEvents 1.0 (structured mode).

    Заголовки: `X-RT-Publisher` (crm|erp|…), `X-RT-Event-Id` (= id конверта), `X-RT-Timestamp` (UTC ISO 8601 момента
    попытки; при каждом повторе подпись пересчитывается), `X-RT-Signature: sha256=<hex HMAC-SHA256(secret,
    "{X-RT-Event-Id}.{X-RT-Timestamp}.{raw_body}")>`, `traceparent`, `X-Request-ID` (= correlationid).
    Секрет пары — `RT_BUS_SECRET_<ИЗДАТЕЛЬ>_<ПОДПИСЧИК>` (список через запятую: первым подписывают, принимают любой).

    Приёмник: окно |now − X-RT-Timestamp| ≤ 300 с. Ответы: 2xx — принято (в т. ч. повтор id и skipped: неизвестный
    тип или версия выше поддерживаемой); 401 — нет или неверная подпись, неизвестный издатель, вне окна; 400 — не
    конверт или битый JSON; 422 — data известного типа не по схеме. Отправитель: 400, 404, 410, 413, 415, 422 —
    сразу dead (ручной «повторить» из журнала); остальное (401, 408, 409, 429, 5xx, сеть, таймаут) — повтор по
    расписанию.
defaultContentType: application/cloudevents+json
servers:
  crm:
    host: crm-api:8000
    pathname: /bus/v1/events
    protocol: http
    description: Приёмник шины CRM (внутренняя сеть; переопределение — RT_BUS_ENDPOINT_CRM)
  eds:
    host: eds-api:8000
    pathname: /bus/v1/events
    protocol: http
    description: Приёмник шины EDS (внутренняя сеть; переопределение — RT_BUS_ENDPOINT_EDS)
  erp:
    host: erp-backend:8000
    pathname: /bus/v1/events
    protocol: http
    description: Приёмник шины ERP (внутренняя сеть; переопределение — RT_BUS_ENDPOINT_ERP)
# Канал = тип события; address — логический (= тип), фактическая доставка — POST /bus/v1/events (см. шапку).
