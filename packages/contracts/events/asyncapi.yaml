components:
  operationBindings:
    delivery:
      http:
        method: POST
        bindingVersion: 0.3.0
  messageBindings:
    delivery:
      http:
        headers:
          $ref: '#/components/schemas/DeliveryHeaders'
        bindingVersion: 0.3.0
  schemas:
    Envelope:
      schemaFormat: application/schema+json;version=draft-07
      schema:
        $ref: './envelope.v1.json'
    DeliveryHeaders:
      type: object
      required: [Content-Type, X-RT-Publisher, X-RT-Event-Id, X-RT-Timestamp, X-RT-Signature, X-Request-ID]
      properties:
        Content-Type:
          type: string
          const: application/cloudevents+json
        X-RT-Publisher:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
          description: Имя издателя (crm, erp, eds, platform-bff, connector-<имя>)
        X-RT-Event-Id:
          type: string
          format: uuid
          description: Равен id конверта
        X-RT-Timestamp:
          type: string
          format: date-time
          description: UTC ISO 8601 момента попытки доставки; окно приёмника 300 с
        X-RT-Signature:
          type: string
          pattern: '^sha256=[0-9a-f]{64}$'
          description: 'sha256=<hex HMAC-SHA256(secret, "{X-RT-Event-Id}.{X-RT-Timestamp}.{raw_body}")>'
        traceparent:
          type: string
          description: W3C Trace Context (если есть)
        X-Request-ID:
          type: string
          description: Равен correlationid конверта
  messages:
    uz.railtech.crm.client.created.v1:
      name: uz.railtech.crm.client.created.v1
      title: Клиент создан
