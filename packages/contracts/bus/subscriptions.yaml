# Подписки rt_bus v1 (ADR-0014; docs/architecture/CONTRACTS.md, раздел «Шина rt_bus»; схема — subscriptions.schema.json).
# Издатель доставляет подписчику только свои события (по source) и не доставляет себе.
# Новый подписчик = строка здесь + секрет пары в окружении RT_BUS_SECRET_<ИЗДАТЕЛЬ>_<ПОДПИСЧИК>
# (верхний регистр, «-» → «_»; несколько через запятую — первым подписывают, принимают любой).
# Сервисы читают файл по пути из RT_BUS_SUBSCRIPTIONS.
version: 1
subscribers:
  # CRM получает события ERP по сущностям, а не маской uz.railtech.erp.*.v1 (волна 12, E1): quote.ready_for_approval
  # несёт себестоимость и маржу и адресован EDS — в CRM (inbox, журнал доставок) он не попадает. Новый тип ERP для CRM —
  # строка здесь.
  - name: crm
    endpoint: http://crm-api:8000/bus/v1/events
    endpoint_env: RT_BUS_ENDPOINT_CRM
    types:
      - uz.railtech.erp.act.*.v1
      - uz.railtech.erp.contract.*.v1
      - uz.railtech.erp.deal.*.v1
      - uz.railtech.erp.delivery.*.v1
      - uz.railtech.erp.document.*.v1
      - uz.railtech.erp.invite.*.v1
      - uz.railtech.erp.invoice.*.v1
      - uz.railtech.erp.request.*.v1
      - uz.railtech.erp.quote.acceptance_code_requested.v1
      - uz.railtech.erp.quote.accepted.v1
      - uz.railtech.erp.quote.rejected.v1
      - uz.railtech.erp.quote.sent.v1
      - uz.railtech.erp.quote.viewed.v1

  - name: erp
    endpoint: http://erp-backend:8000/bus/v1/events
    endpoint_env: RT_BUS_ENDPOINT_ERP
    types:
      - uz.railtech.crm.client.updated.v1
      - uz.railtech.crm.contact.*.v1
      # Волна 12 (EDS-01, EDS-03): резолюция → задание расчёта; отказ → сделка LOST; решение по КП.
      - uz.railtech.eds.letter.resolved.v1
      - uz.railtech.eds.letter.rejected.v1
      - uz.railtech.eds.approval.decided.v1

  # BFF Платформы (B5): события ERP, лидов CRM и сотрудников → подсказки инвалидации в SSE браузеру (уведомления, счётчики
  # меню, «Моя очередь», лента «Сегодня»). Данных событий BFF не хранит. Приёмник — только внутри сети compose (Caddy
  # /bus/* на домене Платформы не отдаёт). Секреты пар: RT_BUS_SECRET_ERP_PLATFORM_BFF, RT_BUS_SECRET_CRM_PLATFORM_BFF,
  # RT_BUS_SECRET_EDS_PLATFORM_BFF. События EDS (письмо, маршрут согласования, решение, документ) — подсказки «Моей
  # очереди», счётчиков и уведомлений директору и исполнителям без перезагрузки (D1-6).
  - name: platform-bff
    endpoint: http://platform-bff:8000/bus/v1/events
    endpoint_env: RT_BUS_ENDPOINT_PLATFORM_BFF
    types:
      - uz.railtech.erp.*.v1
      - uz.railtech.crm.lead.*.v1
      - uz.railtech.identity.user.*.v1
      - uz.railtech.eds.*.v1

  # EDS (волна 12, ADR-0015): проекция сотрудников с правами permissions.eds, связь письма с заявкой ERP, маршрут
  # одобрения КП (EDS-03). Приёмник — только внутри сети compose (у EDS нет внешнего маршрута в Caddy).
  # Секреты пар (только окружение, заводит infra — задача E2): RT_BUS_SECRET_CRM_EDS (crm → eds),
  # RT_BUS_SECRET_ERP_EDS (erp → eds), RT_BUS_SECRET_EDS_ERP (eds → erp), RT_BUS_SECRET_EDS_PLATFORM_BFF (eds → BFF).
  - name: eds
    endpoint: http://eds-api:8000/bus/v1/events
    endpoint_env: RT_BUS_ENDPOINT_EDS
    types:
      - uz.railtech.identity.user.*.v1
      - uz.railtech.erp.request.created.v1
      - uz.railtech.erp.quote.ready_for_approval.v1
