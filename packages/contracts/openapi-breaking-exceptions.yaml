# Исключения из проверки совместимости OpenAPI (scripts/openapi_compat.py, oasdiff; CONTRACTS §7, ADR-0016).
# Правило: ломающее изменение API — только новым мажором в пути (/v2). Исключение — для одноразового случая, когда у
# изменения нет потребителей (внутренний вебхук, эндпоинт, который никто не вызывает), и оно проходит ревью:
# запись видна в diff, у неё есть причина и срок. Не молча и не «навсегда».
#
# Поля записи:
#   file       имя файла в openapi/ (crm.yaml)
#   id         идентификатор проверки oasdiff (в сообщении make contracts — в квадратных скобках)
#   path       путь API (необязательно; без него — любой путь с этой проверкой в файле)
#   operation  метод HTTP (необязательно)
#   reason     почему можно (кто потребитель и почему его нет или он переведён) и в каком PR/задаче
#   until      ГГГГ-ММ-ДД: после этой даты запись — ошибка; уберите её, когда изменение уже в базе (origin/main)
#
# Запись, которой ничего не соответствует (изменение уже слито), печатается предупреждением: удалите её.
exceptions:
  # B4 (волна 11): приёмник шины /bus/v1/events заменяет вебхук ERP → CRM. Вызывающая сторона (ERP) переходит на шину в B3,
  # данных прода нет (карт-бланш владельца, runbook wave11-bus-v1), поэтому deprecated и срок отказа не нужны. Запись удалить
  # сразу после слияния B4 (проверка напечатает предупреждение, что она ничему не соответствует).
  - file: crm.yaml
    id: api-path-removed-without-deprecation
    path: /api/v1/integrations/erp/events
    operation: POST
    reason: "B4: вебхук ERP → CRM заменён шиной rt_bus (POST /bus/v1/events), вызывающая сторона ERP переведена в B3; потребителей нет"
    until: 2026-12-31
