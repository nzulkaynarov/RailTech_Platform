# Исключения из проверки совместимости OpenAPI (scripts/openapi_compat.py, oasdiff; CONTRACTS §7, ADR-0016).
# Правило: ломающее изменение API — только новым мажором в пути (/v2). Исключение — для одноразового случая, когда у
# изменения нет потребителей (внутренний вебхук, эндпоинт, который никто не вызывает), и оно проходит ревью:
# запись видна в diff, у неё есть причина и срок. Не молча и не «навсегда».
#
# Поля записи:
#   file       имя файла в openapi/ (crm.yaml)
#   id         идентификатор проверки oasdiff (в сообщении make contracts — в квадратных скобках)
#   path       путь API (необязательно; без него — любой путь с этой проверкой в файле)
#   operation  метод HTTP (необязательно)
#   text       подстрока текста изменения oasdiff (необязательно): сужает запись без path до одной схемы
#   reason     почему можно (кто потребитель и почему его нет или он переведён) и в каком PR/задаче
#   until      ГГГГ-ММ-ДД: после этой даты запись — ошибка; уберите её, когда изменение уже в базе (origin/main)
#
# Запись, которой ничего не соответствует (изменение уже слито), печатается предупреждением: удалите её.
exceptions:
  # B4 (волна 11): приёмник шины /bus/v1/events заменяет вебхук ERP → CRM. Вызывающая сторона (ERP) переходит на шину в B3,
  # данных прода нет (карт-бланш владельца, runbook wave11-bus-v1), поэтому deprecated и срок отказа не нужны. Запись удалить
  # сразу после слияния B4 (проверка напечатает предупреждение, что она ничему не соответствует).
  - file: crm.yaml
    id: api-path-removed-without-deprecation
    path: /api/v1/integrations/erp/events
    operation: POST
    reason: "B4: вебхук ERP → CRM заменён шиной rt_bus (POST /bus/v1/events), вызывающая сторона ERP переведена в B3; потребителей нет"
    until: 2026-12-31
  # D2-5 (волна 17): выгрузка `POST /crm/contracts/generate-from-quote/` называла успех 200, а код всегда отвечал 201 (создание
  # договора). Исправлено описание на фактический ответ; потребители (старый фронт ERP, BFF Платформы, e2e Cabinet) читают
  # фактический 201 и от описания не зависят. Удалить после слияния D2-5 (проверка напечатает предупреждение).
  - file: erp-internal.yaml
    id: response-success-status-removed
    path: /api/v1/crm/contracts/generate-from-quote/
    operation: POST
    reason: "D2-5: описание исправлено на фактический 201; код и потребители не менялись, ответ 200 этим эндпоинтом не отдавался никогда"
    until: 2026-12-31
  # CAT-CARD-1: вид документа товара — запись справочника `DocumentKind` (данные), а не перечисление в коде: `kind` в
  # `catalog/tech-docs/` стал открытой строкой-кодом (коды tz / drawing / certificate / pnr / other остались теми же и принимаются
  # как раньше, к ним добавлены новые). Сужения нет, это расширение множества значений; oasdiff видит его как «enum снят».
  # Потребитель один — BFF Платформы (переведён в том же PR); старый фронт ERP `catalog/tech-docs/` не вызывает. Удалить после слияния.
  - file: erp-internal.yaml
    id: request-parameter-enum-value-removed
    path: /api/v1/catalog/tech-docs/
    operation: GET
    reason: "CAT-CARD-1: вид документа — код из справочника; прежние коды принимаются, множество расширено"
    until: 2026-12-31
  - file: erp-internal.yaml
    id: request-property-enum-value-removed
    path: /api/v1/catalog/tech-docs/
    operation: POST
    reason: "CAT-CARD-1: вид документа — код из справочника; прежние коды принимаются, множество расширено"
    until: 2026-12-31
  - file: erp-internal.yaml
    id: request-property-min-length-set
    path: /api/v1/catalog/tech-docs/
    operation: POST
    reason: "CAT-CARD-1: у `kind` схема стала строкой (minLength 1 — след DRF-описания); пустой вид и раньше, и сейчас принимается как `other`"
    until: 2026-12-31
  # PART-PIPELINE-1: добавлен статус candidate_agreed в воронку согласования партнёрских договоров
  - file: erp-internal.yaml
    id: response-property-enum-value-added
    text: "candidate_agreed"
    reason: "PART-PIPELINE-1: добавлен статус candidate_agreed в PartnerApplication; потребители — BFF Платформы и Cabinet"
    until: 2026-12-31
  # СЦ-9: строки «Мои задачи» снабжения `order_shortage` (непокрытый товар проекта) и `ship_project` (резерв ждёт
  # отгрузки). Потребитель — BFF Платформы: неизвестные виды строк он пропускает (feeds/queue.py), строки Платформы —
  # отдельным PR; Cabinet этот путь не читает. Удалить после слияния (проверка напечатает предупреждение).
  - file: erp-internal.yaml
    id: response-property-enum-value-added
    path: /api/v1/stock/tasks/
    text: "`order_shortage`"
    reason: "СЦ-9: вид строки order_shortage; BFF Платформы пропускает неизвестные виды, строка в Платформе — следующий PR"
    until: 2026-12-31
  - file: erp-internal.yaml
    id: response-property-enum-value-added
    path: /api/v1/stock/tasks/
    text: "`ship_project`"
    reason: "СЦ-9: вид строки ship_project; BFF Платформы пропускает неизвестные виды, строка в Платформе — следующий PR"
    until: 2026-12-31
  # План 1.9 «Передать в работу»: источник заявки кандидата `letter` (заявку завёл сотрудник по входящему письму).
  # Потребитель — BFF Платформы: неизвестный источник он принимает (`to_partner_application`), новый — в том же PR.
  - file: erp-internal.yaml
    id: response-property-enum-value-added
    text: "`letter`"
    reason: "План 1.9: источник letter у PartnerApplication; потребитель — BFF Платформы, обновлён в том же PR"
    until: 2026-12-31
  # Снос старых фронтов (2026-11-11): выдача токена ERP для перехода в старую CRM и адрес старой CRM (`crm_frontend_url`)
  # нужны были только старому SPA ERP, которого больше нет. BFF Платформы эти поля и путь не читает (grep `apps/platform`).
  # Удалить записи после слияния (проверка напечатает предупреждение, что они ничему не соответствуют).
  - file: erp-internal.yaml
    id: api-path-removed-without-deprecation
    path: /api/v1/auth/sso/token/
    operation: POST
    reason: "Снос старых фронтов: токен ERP -> CRM служил кнопке «В CRM» старого SPA ERP; потребителей нет"
    until: 2026-12-31
  - file: erp-internal.yaml
    id: response-required-property-removed
    text: crm_frontend_url
    reason: "Снос старых фронтов: адрес старой CRM для ссылок старого SPA ERP (настройки, сопряжение); BFF поле не читает"
    until: 2026-12-31
  # ADR-0027 п. 9 (СУЩ-1, шаг 1): количество склада, снабжения, поставок и запросов цены — дробное (12,5 т). В выгрузке ERP
  # `integer` → `number` в ответах. Потребитель один — BFF Платформы, переведён в том же PR (`platform-bff.yaml` 0.114.0,
  # `erp-portal.yaml` 0.18.0 подняты по правилам до 1.0). Удалить после слияния.
  - file: erp-internal.yaml
    id: response-property-type-generalized
    reason: "ADR-0027 п. 9: количество склада и снабжения дробное; единственный потребитель — BFF Платформы, переведён в том же PR"
    until: 2026-12-31
  # ADR-0027 п. 9 (СУЩ-1, шаг 2): количество строк счёта — дробное; у числа нет целочисленных границ `integer`. Потребитель —
  # BFF Платформы, переведён в том же PR. Удалить после слияния.
  - file: erp-internal.yaml
    id: response-property-max-unset
    text: quantity
    reason: "ADR-0027 п. 9: количество строк счёта дробное; единственный потребитель — BFF Платформы, переведён в том же PR"
    until: 2026-12-31
  # ADR-0027 п. 9 (СУЩ-1, шаг 2): количество строк счёта — дробное; у числа нет целочисленных границ `integer`. Потребитель —
  # BFF Платформы, переведён в том же PR. Удалить после слияния.
  - file: erp-internal.yaml
    id: response-property-min-unset
    text: quantity
    reason: "ADR-0027 п. 9: количество строк счёта дробное; единственный потребитель — BFF Платформы, переведён в том же PR"
    until: 2026-12-31
  # ADR-0027 п. 1 и 9 (СУЩ-1, остаток): ручная строка счёта — карточка каталога или текст, количество дробное
  # (`integer` → `number` в запросе). Ручной счёт BFF и фронты не вызывают — потребителей нет. Удалить после слияния.
  - file: erp-internal.yaml
    id: request-property-type-changed
    path: /api/v1/crm/invoices/create-manual/
    operation: POST
    reason: "ADR-0027 п. 9: количество ручной строки счёта дробное; эндпоинт ручного счёта никто не вызывает"
    until: 2026-12-31
