# Стенд ансамбля RailTech Platform (ARCHITECTURE §10, ORCHESTRATOR §2): один PostgreSQL 17 с базами
# `crm` (pgvector) и `erp`, два Redis (брокер и кэш), один RustFS, LiteLLM + Langfuse, Caddy на три домена.
# Запуск только через overrides (корневой Makefile):
#   dev:  make up        (base.yml + dev.yml) — crm.localhost, erp.localhost, cabinet.localhost, platform.localhost
#   prod: make up-prod   (base.yml + prod.yml) — появится в M5-INF-01
# Langfuse — профиль `observability` (make up-obs). Бэкапы — профиль `backup` (M5-INF-01).
#
# Сервисы CRM перенесены из apps/crm/infra/docker-compose.yml с префиксом `crm-`; код и образы — те же.
# ERP — копия B2B (M1-ERP-01); Cabinet — статика SPA `cabinet-web` (M2-CAB-01), API портала — ERP через Caddy.

name: rt-platform

x-crm-backend: &crm-backend
  build:
    context: ../../apps/crm/backend
    target: prod
  # Только нужные backend переменные, без env_file: ключи провайдеров и секреты инфраструктуры
  # в api/worker не попадают (CRM SPEC §11).
  environment: &crm-backend-env
    APP_ENV: ${APP_ENV:-dev}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    # Шина rt_bus (B5): секрет пары «CRM → platform-bff» (BFF Платформы — подписчик, подсказки SSE); доставку ведёт crm-worker
    RT_BUS_SECRET_CRM_PLATFORM_BFF: ${RT_BUS_SECRET_CRM_PLATFORM_BFF:-}
    READY_CHECK_TIMEOUT_S: ${READY_CHECK_TIMEOUT_S:-2}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: crm
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    S3_ENDPOINT: http://rustfs:9000
    # Свой ключ CRM (S0-9): чтение и запись в kb-sources, client-documents, tg-attachments, чтение backups; чужих бакетов нет.
    S3_ACCESS_KEY: ${S3_CRM_ACCESS_KEY:?set in .env}
    S3_SECRET_KEY: ${S3_CRM_SECRET_KEY:?set in .env}
    LITELLM_BASE_URL: http://litellm:4000
    LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
    DOCLING_URL: http://docling:5001
    DOCLING_API_KEY: ${DOCLING_API_KEY}
    AGENT_CONTEXT_KEY: ${CRM_AGENT_CONTEXT_KEY}
    JWT_SECRET: ${CRM_JWT_SECRET}
    SECRETS_KEY: ${CRM_SECRETS_KEY:-}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
    TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
    TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    # Свой сервер Bot API или заглушка на стенде (S0-4); пусто — api.telegram.org.
    TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
    LANGFUSE_HOST: http://langfuse-web:3000
    LANGFUSE_PUBLIC_KEY: ${CRM_LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${CRM_LANGFUSE_SECRET_KEY:-}
    KB_MCP_URL: http://crm-mcp-kb:8101/mcp
    CRM_MCP_URL: http://crm-mcp-crm:8102/mcp
    DOCS_MCP_URL: http://crm-mcp-docs:8103/mcp
    # Сервисный режим бота (M3-CRM-07): данные клиента из ERP через erp-mcp. Ключ контекста общий с ERP
    # (`ERP_MCP_CONTEXT_KEY` проверяет erp-mcp); пустой ключ или ERP_MCP_ENABLED=false — бот без данных ERP.
    # На проде сервис erp-mcp под профилем `mcp` (RT_PROFILES): без него бот честно отвечает «не могу проверить».
    ERP_MCP_ENABLED: ${ERP_MCP_ENABLED:-true}
    ERP_MCP_URL: http://erp-mcp:8104/mcp/erp
    ERP_MCP_CONTEXT_KEY: ${ERP_MCP_CONTEXT_KEY:-}
    # Шов CRM ↔ ERP (FIX-01): значений по умолчанию в коде нет, без .env стенд не поднимается.
    # Сервисный токен и секрет вебхуков CRM берёт из «Подключений» → ERP (ADR-0022), SSO — отсюда.
    PLATFORM_SSO_SECRET: ${PLATFORM_SSO_SECRET:?set in .env}
    # Переход CRM ↔ ERP по SSO; по умолчанию выключен (FIX-03), включает владелец после FIX-10/FIX-11.
    PLATFORM_SSO_ENABLED: ${PLATFORM_SSO_ENABLED:-false}
    # Публичный адрес ERP для перехода по SSO; на стенде с HTTP_PORT≠80 порт обязателен (иначе переход уходит на :80).
    ERP_FRONTEND_URL: ${ERP_FRONTEND_URL:-http://erp.localhost:${HTTP_PORT:-80}}

services:
  # ─── Общая инфраструктура ──────────────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      # Первичная база контейнера — `crm`; остальные (`erp`, `litellm`, `langfuse`) создаёт db-init.
      POSTGRES_DB: crm
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Базы ансамбля (ADR-0002: две базы на одной инстанции) + служебные базы LiteLLM и Langfuse.
  # Идемпотентно: работает и на пустом томе, и на существующем.
  db-init:
    image: pgvector/pgvector:0.8.7-pg17
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: crm
    volumes:
      - ../db/init-databases.sh:/init-databases.sh:ro
    command: ["bash", "/init-databases.sh", "crm", "erp", "litellm", "langfuse"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  # Два экземпляра Redis с разными паролями (S0-2, ADR-0013 п. 5, ADR-0017): отказ или переполнение кэша не трогает очереди.
  # redis-broker — брокер и результаты Celery (БД 1), слой Channels ERP (БД 2), очереди BullMQ Langfuse (БД 3, S0-9);
  # `appendonly yes`, `noeviction`: ничего не вытесняется, очередь переживает рестарт (том redis_broker_data). redis-cache — кэш Django, троттлинг и одноразовые
  # jti ERP (БД 0), сессии BFF Платформы (БД 3); `volatile-lru`, у всех ключей есть срок.
  # Снимок RDB раз в 5 минут (том redis_cache_data) — сессии и jti переживают плановый рестарт. CRM Redis не использует
  # (очередь — Procrastinate в Postgres). Пределы памяти (maxmemory) ниже лимитов контейнеров на проде (prod.yml).
  redis-broker:
    image: redis:7.4.11
    command:
      - --requirepass
      - ${REDIS_BROKER_PASSWORD:?set in .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory
      - ${REDIS_BROKER_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_broker_data:/data
    environment:
      REDISCLI_AUTH: ${REDIS_BROKER_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-cache:
    image: redis:7.4.11
    command:
      - --requirepass
      - ${REDIS_CACHE_PASSWORD:?set in .env}
      - --appendonly
      - "no"
      - --save
      - "300 1"
      - --maxmemory
      - ${REDIS_CACHE_MAXMEMORY:-96mb}
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_cache_data:/data
    environment:
      REDISCLI_AUTH: ${REDIS_CACHE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-хранилище файлов — RustFS (CRM ADR-0009). Ключ на сервис (ADR-0013 п. 6, S0-9): корневой ключ знают только RustFS и
  # s3-init; ERP, CRM, Langfuse, WAL-G и бэкап ходят каждый со своим ключом и видят только свои бакеты.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ROOT_ACCESS_KEY:?set in .env}
      RUSTFS_SECRET_KEY: ${S3_ROOT_SECRET_KEY:?set in .env}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Одноразовый инициализатор (infra/s3/init.sh): бакеты, пользователь и политика на каждый сервис, удаление чужих
  # пользователей, правило erp-temp (1 сутки), проверка матрицы доступа. Идемпотентен — выполняется при каждом `up`.
  # Клиент rc — официальный образ RustFS (Alpine, Rust-бинарь без требований к CPU выше x86-64 v1); версия и digest закреплены.
  s3-init:
    image: rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    restart: "no"
    entrypoint: ["sh", "/init.sh"]
    volumes:
      - ../s3/init.sh:/init.sh:ro
    environment:
      S3_ENDPOINT: http://rustfs:9000
      # CRM: kb-sources client-documents tg-attachments (app/config.py); Langfuse: langfuse; ERP: erp-private erp-public
      # erp-temp; VPS 2: wal (WAL-G), backups (дампы). Список доступов по сервисам — в init.sh.
      S3_BUCKETS: langfuse kb-sources client-documents tg-attachments erp-private erp-public erp-temp backups wal
      S3_ROOT_ACCESS_KEY: ${S3_ROOT_ACCESS_KEY:?set in .env}
      S3_ROOT_SECRET_KEY: ${S3_ROOT_SECRET_KEY:?set in .env}
      S3_ERP_ACCESS_KEY: ${S3_ERP_ACCESS_KEY:?set in .env}
      S3_ERP_SECRET_KEY: ${S3_ERP_SECRET_KEY:?set in .env}
      S3_CRM_ACCESS_KEY: ${S3_CRM_ACCESS_KEY:?set in .env}
      S3_CRM_SECRET_KEY: ${S3_CRM_SECRET_KEY:?set in .env}
      S3_LANGFUSE_ACCESS_KEY: ${S3_LANGFUSE_ACCESS_KEY:?set in .env}
      S3_LANGFUSE_SECRET_KEY: ${S3_LANGFUSE_SECRET_KEY:?set in .env}
      S3_WAL_ACCESS_KEY: ${S3_WAL_ACCESS_KEY:?set in .env}
      S3_WAL_SECRET_KEY: ${S3_WAL_SECRET_KEY:?set in .env}
      S3_BACKUP_ACCESS_KEY: ${S3_BACKUP_ACCESS_KEY:?set in .env}
      S3_BACKUP_SECRET_KEY: ${S3_BACKUP_SECRET_KEY:?set in .env}
    healthcheck:
      disable: true
    depends_on:
      rustfs:
        condition: service_healthy

  # ─── ИИ: общий шлюз (ADR-0005) ──────────────────────────────────────────────────────────────

  # Свой образ на Debian (M5-INF-02): официальный Wolfi-образ требует x86-64-v2, прод-VPS его не даёт (servers.md «CPU прод-VPS»).
  # В проде — готовый образ rt-litellm из GHCR (prod.yml), здесь — локальная сборка.
  litellm:
    build:
      context: ../ai/litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      # Модели — в БД LiteLLM, меняются из консоли админа CRM без перезапуска (CRM ADR-0020).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ../ai/litellm.config.yaml:/app/config.yaml:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Алиасы по умолчанию в БД LiteLLM (CRM + ERP): создаёт только отсутствующие (CRM ADR-0020).
  litellm-seed:
    <<: *crm-backend
    command: ["python", "-m", "app", "litellm-seed"]
    restart: "no"
    volumes:
      - ../ai/litellm.models.yaml:/app/litellm.models.yaml:ro
    healthcheck:
      disable: true
    depends_on:
      litellm:
        condition: service_healthy

  # Конвертация документов базы знаний CRM (CRM ADR-0011).
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.36.0
    environment:
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY:?set in .env}
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_MAX_SYNC_WAIT: "600"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ─── CRM (apps/crm) ─────────────────────────────────────────────────────────────────────────

  crm-migrate:
    <<: *crm-backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db-init:
        condition: service_completed_successfully

  crm-api:
    <<: *crm-backend
    command: ["python", "-m", "app", "api"]
    environment:
      <<: *crm-backend-env
      FORWARDED_ALLOW_IPS: "*"
      # CORS формы «Я новый клиент» (только /api/v1/leads/web*, M2-CAB-03): origin страницы входа
      # Cabinet. Origin сравнивается вместе с портом, поэтому при HTTP_PORT≠80 нужен и вариант с портом.
      CABINET_ORIGIN: ${CABINET_ORIGIN:-http://cabinet.localhost,http://cabinet.localhost:${HTTP_PORT:-80},https://${CABINET_DOMAIN:-cabinet.railtech.uz}}
    volumes:
      - ../../apps/crm/infra/casbin:/app/casbin:ro
      - ../ai/litellm.models.yaml:/app/litellm.models.yaml:ro
      - crm_backups:/backups
    depends_on: &crm-backend-deps
      crm-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      litellm-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # crm-bot (S0-4): Telegram-бот отдельным процессом — polling или приём /telegram/webhook (Caddy ведёт туда сюда,
  # не в crm-api). Реплика ровно одна: второй потребитель getUpdates получит 409. Смену токена в «Подключениях» он
  # замечает сам (таблица bot_runtime), перезапускать его вручную не нужно. Порт 8001 внутренний.
  crm-bot:
    <<: *crm-backend
    command: ["python", "-m", "app", "bot"]
    volumes:
      - ../../apps/crm/infra/casbin:/app/casbin:ro
    depends_on: *crm-backend-deps
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  crm-worker:
    <<: *crm-backend
    command: ["python", "-m", "app", "worker"]
    # Центр внешних сервисов (M3-CRM-12) читает статус бэкапов из общего тома — только чтение.
    volumes:
      - crm_backups:/backups:ro
    depends_on:
      <<: *crm-backend-deps
      docling:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "procrastinate", "--app=app.tasks.queue.queue", "healthchecks"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  crm-mcp-kb:
    <<: *crm-backend
    command: ["python", "-m", "app", "mcp", "kb"]
    depends_on: *crm-backend-deps
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('localhost', 8101), timeout=2)
      interval: 15s
      timeout: 5s
      retries: 10

  crm-mcp-crm:
    <<: *crm-backend
    command: ["python", "-m", "app", "mcp", "crm"]
    depends_on: *crm-backend-deps
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('localhost', 8102), timeout=2)
      interval: 15s
      timeout: 5s
      retries: 10

  crm-mcp-docs:
    <<: *crm-backend
    command: ["python", "-m", "app", "mcp", "docs"]
    depends_on: *crm-backend-deps
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('localhost', 8103), timeout=2)
      interval: 15s
      timeout: 5s
      retries: 10

  crm-web:
    build:
      context: ../../apps/crm/frontend
      target: prod
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ─── ERP (apps/erp) — копия B2B, M1-ERP-01 ──────────────────────────────────────────────────
  # Один образ для backend (Daphne), воркеров Celery и Beat; команда выбирает процесс (как в B2B).
  # База `erp` на общем Postgres, redis-broker БД 1 (Celery) и 2 (Channels), redis-cache БД 0 (кэш). Файлы — только в RustFS (бакеты erp-*, MINIO_*);
  # тома медиа нет, на диск контейнера ERP файлы не пишутся. CORS/CSRF в коде B2B захардкожены по DEBUG — на dev DEBUG=true.

  erp-backend:
    # Образ ERP получает rt_bus и контракты шины (B3, L14) именованными контекстами: COPY --from=rtbus / --from=contracts
    # в apps/erp/backend/Dockerfile. Тот же блок — у всех сервисов ERP на этом образе (якорь).
    build: &erp-build
      context: ../../apps/erp/backend
      additional_contexts:
        rtbus: ../../packages/rt-bus
        contracts: ../../packages/contracts
    # -v 0: без access-лога Daphne — он печатает путь `/auth/magic/<токен>` в stdout мимо фильтра токена (FIX-15);
    # журнал запросов ведёт Django (core.logging.AccessLogMiddleware: console + RedactPortalTokenFilter).
    command: ["daphne", "-v", "0", "-b", "0.0.0.0", "-p", "8000", "core.asgi:application"]
    environment: &erp-env
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: core.settings
      DJANGO_SECRET_KEY: ${ERP_SECRET_KEY:?set in .env}
      DJANGO_DEBUG: ${ERP_DEBUG:-true}
      DJANGO_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTO_MIGRATE: "true"
      ALLOWED_HOSTS: erp.localhost,cabinet.localhost,localhost,127.0.0.1,erp-backend,${ERP_DOMAIN:-erp.railtech.uz},${CABINET_DOMAIN:-cabinet.railtech.uz}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/erp?sslmode=disable
      DB_SSLMODE: disable
      REDIS_CACHE_URL: redis://:${REDIS_CACHE_PASSWORD:?set in .env}@redis-cache:6379/0
      REDIS_CHANNELS_URL: redis://:${REDIS_BROKER_PASSWORD:?set in .env}@redis-broker:6379/2
      CELERY_BROKER_URL: redis://:${REDIS_BROKER_PASSWORD:?set in .env}@redis-broker:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_BROKER_PASSWORD:?set in .env}@redis-broker:6379/1
      FRONTEND_URL: ${ERP_FRONTEND_URL:-http://erp.localhost:${HTTP_PORT:-80}}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@example.com}
      EMAIL_BACKEND: ${ERP_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      # ИИ ERP — только через общий шлюз по алиасам (ADR-0005, M1-ERP-06). Ключ — виртуальный ключ ERP
      # с дневным бюджетом и трейсами Langfuse (регистрирует сервис erp-ai-gateway); нет его в .env —
      # мастер-ключ (бюджет — только журнал ERP, без трейсов). Ключей провайдеров у ERP нет.
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${ERP_LITELLM_API_KEY:-${LITELLM_MASTER_KEY}}
      AI_IMPORT_ENABLED: ${ERP_AI_ENABLED:-true}
      AI_DAILY_BUDGET_USD: ${ERP_AI_DAILY_BUDGET_USD:-1}
      # Шов CRM ↔ ERP (CONTRACTS §0, FIX-01): значений по умолчанию в коде нет; без DEBUG ERP без них
      # не стартует. Имена в .env — как в контракте (WEBHOOK_SECRET); ERP читает их под своими.
      SERVICE_TOKEN_CRM_TO_ERP: ${SERVICE_TOKEN_CRM_TO_ERP:?set in .env}
      # Секрет вебхуков сопряжения (FIX-35): список «текущий,прежний» для ротации без простоя. Вебхуков ERP → CRM больше нет;
      # от него шина выводит секреты пары CRM ↔ ERP (L12). В CRM пара вводится в «Подключениях» → ERP, без перезапуска.
      ERP_WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set in .env}${WEBHOOK_SECRET_PREVIOUS:+,${WEBHOOK_SECRET_PREVIOUS}}
      ERP_MCP_CONTEXT_KEY: ${ERP_MCP_CONTEXT_KEY:?set in .env}
      # Шина rt_bus (B5): секрет пары «ERP → platform-bff» (BFF Платформы — подписчик, подсказки SSE); доставку ведёт erp-worker
      RT_BUS_SECRET_ERP_PLATFORM_BFF: ${RT_BUS_SECRET_ERP_PLATFORM_BFF:-}
      PLATFORM_SSO_SECRET: ${PLATFORM_SSO_SECRET:?set in .env}
      # Переход CRM ↔ ERP по SSO; по умолчанию выключен (FIX-03), включает владелец после FIX-10/FIX-11.
      PLATFORM_SSO_ENABLED: ${PLATFORM_SSO_ENABLED:-false}
      # Шина rt_bus (B3, ADR-0014): подписчики и типы — packages/contracts/bus/subscriptions.yaml (в образе, RT_BUS_SUBSCRIPTIONS);
      # адрес CRM переопределяет RT_BUS_ENDPOINT_CRM. Секрет пары задают RT_BUS_SECRET_ERP_CRM (ERP → CRM) и RT_BUS_SECRET_CRM_ERP
      # (CRM → ERP); пусто — направленные секреты выводятся из секрета вебхуков сопряжения (CONTRACTS §9, L12). Приёмник
      # POST /bus/v1/events виден только внутри сети compose (Caddy его наружу не отдаёт).
      RT_BUS_ENDPOINT_CRM: ${RT_BUS_ENDPOINT_CRM:-}
      RT_BUS_SECRET_ERP_CRM: ${RT_BUS_SECRET_ERP_CRM:-}
      RT_BUS_SECRET_CRM_ERP: ${RT_BUS_SECRET_CRM_ERP:-}
      CRM_FRONTEND_URL: ${CRM_FRONTEND_URL:-http://crm.localhost:${HTTP_PORT:-80}}
      CABINET_URL: ${CABINET_URL:-http://cabinet.localhost:${HTTP_PORT:-80}}
      # Компания-владелец ERP (core.tenant); пусто — автоопределение, пока продавец с сотрудниками один.
      OWN_COMPANY_ID: ${OWN_COMPANY_ID:-}
      # CORS портала на DEBUG=False (на стенде ERP_DEBUG=true — разрешён любой origin); список как у CRM (FIX-15).
      CABINET_ORIGIN: ${CABINET_ORIGIN:-http://cabinet.localhost,http://cabinet.localhost:${HTTP_PORT:-80},https://${CABINET_DOMAIN:-cabinet.railtech.uz}}
      # SameSite cookie сессии портала: Lax (веб) или None (Telegram Mini App, только за TLS) — docs/runbooks/stand.md.
      PORTAL_COOKIE_SAMESITE: ${PORTAL_COOKIE_SAMESITE:-Lax}
      # Тот же бот, что у CRM: ERP проверяет им подпись initData Mini App (пусто — вход через Mini App закрыт).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # Файлы ERP (PDF КП, договоров, счетов, актов, сканы, загрузки портала, картинки каталога, импорт) — RustFS внутри сети
      # compose; наружу адрес не публикуется, файлы клиенту отдаёт сам ERP. Свой ключ ERP (S0-9): только бакеты erp-*.
      MINIO_ENDPOINT: http://rustfs:9000
      MINIO_ACCESS_KEY: ${S3_ERP_ACCESS_KEY:?set in .env}
      MINIO_SECRET_KEY: ${S3_ERP_SECRET_KEY:?set in .env}
      MINIO_PRIVATE_BUCKET: erp-private
      MINIO_PUBLIC_BUCKET: erp-public
      MINIO_TEMP_BUCKET: erp-temp
    volumes:
      - erp_static:/app/staticfiles
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis-broker:
        condition: service_healthy
      # Кэш ERP необязателен для работы (core.cache): при его отказе ERP стартует и работает без кэша, поэтому ждём только запуск.
      redis-cache:
        condition: service_started
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  # erp-mcp (FIX-36): инструменты ERP для агента CRM на официальном SDK `mcp` — отдельный процесс, как crm-mcp-*
  # (не в Daphne: у SDK свой lifespan/менеджер сессий, а Channels-приложение Django его не запускает). Порт 8104
  # внутренний, наружу не публикуется; Caddy отдаёт `/mcp` на erp.localhost 404 (FIX-03). Адрес для агента CRM:
  # http://erp-mcp:8104/mcp/erp (CRM ходит к нему из сервисного режима бота — M3-CRM-07). Схемы инструментов — не копия в коде:
  # файл контракта монтируется только на чтение в /packages/contracts (как в тестах ERP); нет файла — сервис не стартует.
  erp-mcp:
    build: *erp-build
    command: ["python", "-m", "integration.mcp"]
    environment:
      <<: *erp-env
      AUTO_MIGRATE: "false"
      ERP_MCP_TOOLS_PATH: /packages/contracts/mcp-tools.json
    volumes:
      - ../../packages/contracts/mcp-tools.json:/packages/contracts/mcp-tools.json:ro
    depends_on:
      erp-backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('localhost', 8104), timeout=2)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  erp-worker:
    build: *erp-build
    command: ["celery", "-A", "core", "worker", "-l", "info", "-Q", "default,pdf,imports"]
    environment: *erp-env
    depends_on:
      erp-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "core", "inspect", "ping", "-t", "10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 45s

  erp-worker-ai:
    build: *erp-build
    command: ["celery", "-A", "core", "worker", "-l", "info", "-Q", "ai", "--concurrency=2"]
    environment: *erp-env
    depends_on:
      erp-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "core", "inspect", "ping", "-t", "10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 45s

  erp-beat:
    build: *erp-build
    command: ["celery", "-A", "core", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment: *erp-env
    depends_on:
      erp-backend:
        condition: service_healthy

  # Виртуальный ключ ERP в LiteLLM (M1-ERP-06): регистрирует значение ERP_LITELLM_API_KEY с дневным
  # бюджетом (ERP_AI_DAILY_BUDGET_USD, сутки UTC) и колбэком Langfuse (ERP_LANGFUSE_*, по умолчанию —
  # проект CRM). Одноразовый, идемпотентный, всегда завершается кодом 0; мастер-ключ — только здесь.
  # В M3-CRM-11 этот шаг переезжает в консоль CRM (бюджет — settings.budget.erp_daily_usd).
  erp-ai-gateway:
    build: *erp-build
    command: ["python", "manage.py", "ai_gateway_sync"]
    environment:
      <<: *erp-env
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ERP_LANGFUSE_PUBLIC_KEY: ${ERP_LANGFUSE_PUBLIC_KEY:-${CRM_LANGFUSE_PUBLIC_KEY:-}}
      ERP_LANGFUSE_SECRET_KEY: ${ERP_LANGFUSE_SECRET_KEY:-${CRM_LANGFUSE_SECRET_KEY:-}}
      ERP_LANGFUSE_HOST: http://langfuse-web:3000
    restart: "no"
    depends_on:
      litellm:
        condition: service_healthy

  # SPA ERP: сборка Vite + nginx (как в B2B). VITE_API_URL пустой → запросы относительные, /api и /ws
  # ведёт Caddy на erp-backend с того же домена (CORS не нужен).
  erp-web:
    build:
      context: ../../apps/erp/frontend
      args:
        VITE_API_URL: ""
        VITE_WS_URL: ""
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # SPA Cabinet (M2-CAB-01): сборка Vite + nginx, своей логики нет (ADR-0004). VITE_API_URL пустой →
  # /api/portal/* Caddy ведёт с cabinet.* на erp-backend (cookie портала same-origin, CORS не нужен).
  cabinet-web:
    build:
      context: ../../apps/cabinet
      args:
        VITE_API_URL: ""
        VITE_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
        # Форма «Я новый клиент» → CRM POST /api/v1/leads/web (CORS — CABINET_ORIGIN у crm-api).
        VITE_CRM_URL: ${CABINET_CRM_URL:-http://crm.localhost:${HTTP_PORT:-80}}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Платформа (apps/platform, INF-P0-4/5): BFF и статика SPA. redis-cache БД 3 — сессии BFF (0 — кэш ERP).
  # CRM и ERP для запуска не обязательны: BFF отвечает `degraded`. Нового секрета нет. На проде образы из GHCR и лимиты
  # памяти — в prod.yml (как у CRM/ERP: здесь `build`, там `image` и `build: !reset null`).
  platform-bff:
    build:
      context: ../../apps/platform/bff
      target: prod
      # Шина событий rt_bus (B5, ADR-0014, L14): BFF — подписчик, пакет и схемы лежат вне контекста сборки.
      additional_contexts:
        rtbus: ../../packages/rt-bus
        contracts: ../../packages/contracts
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PLATFORM_CRM_URL: http://crm-api:8000
      PLATFORM_ERP_URL: http://erp-backend:8000
      REDIS_URL: redis://:${REDIS_CACHE_PASSWORD:?set in .env}@redis-cache:6379/3
      PLATFORM_SESSION_TTL_HOURS: ${PLATFORM_SESSION_TTL_HOURS:-12}
      # Вход сотрудника (Q-PLT-10-1 п. 5). Не секреты. Secure по умолчанию включён; на http-стенде его выключает dev.yml,
      # на проде prod.yml жёстко ставит true. Имя refresh-cookie — REFRESH_COOKIE_NAME ERP.
      PLATFORM_COOKIE_SECURE: ${PLATFORM_COOKIE_SECURE:-true}
      PLATFORM_ERP_REFRESH_COOKIE: ${PLATFORM_ERP_REFRESH_COOKIE:-refresh_token}
      PLATFORM_LOGIN_RATE_PER_MINUTE: ${PLATFORM_LOGIN_RATE_PER_MINUTE:-10}
      # Шина rt_bus: приёмник POST /bus/v1/events (виден только внутри сети compose; Caddy /bus/* не отдаёт). Секрет пары
      # «издатель → platform-bff» подписывает издатель (ERP, CRM), BFF проверяет; пусто — события не принимаются (401).
      # Подписка и типы — packages/contracts/bus/subscriptions.yaml (строка platform-bff, в образе).
      RT_BUS_SECRET_ERP_PLATFORM_BFF: ${RT_BUS_SECRET_ERP_PLATFORM_BFF:-}
      RT_BUS_SECRET_CRM_PLATFORM_BFF: ${RT_BUS_SECRET_CRM_PLATFORM_BFF:-}
    depends_on:
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s

  # SPA Платформы: сборка Vite + file-server Caddy (:8080). На dev пересборка — `make up` (hot reload нет).
  platform-web:
    build:
      context: ../../apps/platform/web
      target: prod
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ─── Вход: Caddy на домены ансамбля ─────────────────────────────────────────────────────────

  caddy:
    image: caddy:2.11.7-alpine
    depends_on:
      crm-api:
        condition: service_healthy
      crm-web:
        condition: service_healthy
      erp-backend:
        condition: service_healthy
      erp-web:
        condition: service_healthy
      cabinet-web:
        condition: service_healthy
      # Платформа — НЕ условие входа ансамбля (INF-P1-0): service_started, не service_healthy. Сбой образа или BFF
      # Платформы даёт 502 на её домене, а CRM, ERP и Cabinet продолжают отвечать (Caddy при этом поднят и не
      # перезапускается). Здоровье Платформы проверяет smoke (четвёртый домен), а не очерёдность запуска.
      platform-bff:
        condition: service_started
      platform-web:
        condition: service_started
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ─── Профиль observability: Langfuse v4 ─────────────────────────────────────────────────────

  clickhouse:
    profiles: [observability]
    image: clickhouse/clickhouse-server:26.4.5.143
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  # Healthcheck Langfuse — по process.env.HOSTNAME: Next.js/worker слушают адрес из HOSTNAME (eth0),
  # на 127.0.0.1 и localhost внутри контейнера — ECONNREFUSED (проверено 2026-10-13).
  langfuse-worker:
    profiles: [observability]
    image: langfuse/langfuse-worker:4.56.0
    depends_on: &langfuse-deps
      db-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      redis-broker:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_URL:-http://langfuse.localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:?set in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set in .env}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_LANGFUSE_ACCESS_KEY:?set in .env}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_LANGFUSE_SECRET_KEY:?set in .env}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://rustfs:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_LANGFUSE_ACCESS_KEY:?set in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_LANGFUSE_SECRET_KEY:?set in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://rustfs:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      # Очереди BullMQ нельзя вытеснять и терять: redis-broker (noeviction, AOF), отдельная БД 3 — не пересекается с Celery (1) и
      # Channels (2) ERP. Строка подключения — единственный способ выбрать БД.
      REDIS_CONNECTION_STRING: redis://:${REDIS_BROKER_PASSWORD}@redis-broker:6379/3
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://' + process.env.HOSTNAME + ':3030/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  langfuse-web:
    profiles: [observability]
    image: langfuse/langfuse:4.56.0
    depends_on: *langfuse-deps
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_PUBLIC_ENDPOINT:-http://s3.localhost}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://rustfs:9000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://' + process.env.HOSTNAME + ':3000/api/public/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  erp_static:
  postgres_data:
  redis_broker_data:
  redis_cache_data:
  s3_data:
  caddy_data:
  caddy_config:
  crm_backups:
  clickhouse_data:
  clickhouse_logs:
