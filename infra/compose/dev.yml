# dev-стенд ансамбля: hot reload CRM, порты наружу только на 127.0.0.1, без TLS.
# Порты на хосте задаются в .env (HTTP_PORT, DEV_*_PORT), если заняты другим проектом.

services:
  postgres:
    ports: ["127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432"]

  redis:
    ports: ["127.0.0.1:${DEV_REDIS_PORT:-6379}:6379"]

  rustfs:
    environment:
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["127.0.0.1:${DEV_S3_PORT:-9000}:9000", "127.0.0.1:${DEV_S3_CONSOLE_PORT:-9001}:9001"]

  litellm:
    ports: ["127.0.0.1:${DEV_LITELLM_PORT:-4000}:4000"]

  crm-migrate:
    build: { target: dev }
    volumes: &crm-src
      - ../../apps/crm/backend/app:/app/app:ro
      - ../../apps/crm/backend/alembic:/app/alembic:ro
      - ../../apps/crm/backend/alembic.ini:/app/alembic.ini:ro
      - ../../apps/crm/backend/prompts:/app/prompts:ro
      - ../../apps/crm/backend/evals:/app/evals:ro
      - ../../apps/crm/backend/tests:/app/tests:ro

  litellm-seed:
    build: { target: dev }
    volumes:
      - ../../apps/crm/backend/app:/app/app:ro
      - ../ai/litellm.models.yaml:/app/litellm.models.yaml:ro

  crm-api:
    build: { target: dev }
    command: ["python", "-m", "app", "api", "--reload"]
    volumes:
      - ../../apps/crm/backend/app:/app/app:ro
      - ../../apps/crm/backend/alembic:/app/alembic:ro
      - ../../apps/crm/backend/alembic.ini:/app/alembic.ini:ro
      - ../../apps/crm/backend/prompts:/app/prompts:ro
      - ../../apps/crm/backend/evals:/app/evals:ro
      - ../../apps/crm/backend/tests:/app/tests:ro
      - ../../apps/crm/infra/casbin:/app/casbin:ro
      - ../ai/litellm.models.yaml:/app/litellm.models.yaml:ro
      - crm_backups:/backups
    ports: ["127.0.0.1:${DEV_CRM_API_PORT:-8000}:8000"]

  crm-worker:
    build: { target: dev }
    volumes: *crm-src
    restart: unless-stopped

  crm-mcp-kb:
    build: { target: dev }
    volumes: *crm-src

  crm-mcp-crm:
    build: { target: dev }
    volumes: *crm-src

  crm-mcp-docs:
    build: { target: dev }
    volumes: *crm-src

  crm-web:
    build: { target: dev }
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://crm-api:8000
    volumes:
      - ../../apps/crm/frontend:/web
      - /web/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

  # ERP: код бэкенда монтируется (Daphne/Celery без автоперезагрузки — после правок перезапускать сервис).
  erp-backend:
    volumes:
      - ../../apps/erp/backend:/app
      - erp_static:/app/staticfiles
      - erp_media:/app/media
    ports: ["127.0.0.1:${DEV_ERP_API_PORT:-8010}:8000"]

  erp-mcp:
    volumes:
      - ../../apps/erp/backend:/app
    restart: unless-stopped

  erp-worker:
    volumes:
      - ../../apps/erp/backend:/app
      - erp_media:/app/media
    restart: unless-stopped

  erp-worker-ai:
    volumes:
      - ../../apps/erp/backend:/app
      - erp_media:/app/media
    restart: unless-stopped

  erp-beat:
    volumes:
      - ../../apps/erp/backend:/app
    restart: unless-stopped

  erp-ai-gateway:
    volumes:
      - ../../apps/erp/backend:/app

  # Платформа (apps/platform, INF-P0-4): BFF и статика SPA. Определены здесь, а не в base.yml, чтобы прод-набор
  # (base.yml + prod.yml) не пытался собрать их на VPS до INF-P0-5: образы из GHCR и лимиты памяти — в prod.yml.
  # Redis БД 3 — сессии BFF (0 — Langfuse, 1/2 — ERP). CRM и ERP для запуска не обязательны: BFF отвечает `degraded`.
  platform-bff:
    build:
      context: ../../apps/platform/bff
      target: prod
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PLATFORM_CRM_URL: http://crm-api:8000
      PLATFORM_ERP_URL: http://erp-backend:8000
      REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/3
      PLATFORM_SESSION_TTL_HOURS: ${PLATFORM_SESSION_TTL_HOURS:-12}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s

  # SPA Платформы: сборка Vite + file-server Caddy (:8080). Пересборка — `make up` (hot reload нет).
  platform-web:
    build:
      context: ../../apps/platform/web
      target: prod
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    volumes:
      - ../caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on:
      platform-bff:
        condition: service_healthy
      platform-web:
        condition: service_healthy

  clickhouse:
    ports: ["127.0.0.1:${DEV_CLICKHOUSE_PORT:-8123}:8123"]

  langfuse-web:
    ports: ["127.0.0.1:${DEV_LANGFUSE_PORT:-3000}:3000"]
