# prod, VPS 1 `app` (docs/runbooks/servers.md): поверх base.yml. Запуск: make up-prod или infra/deploy/deploy.sh.
#   docker compose -f base.yml -f prod.yml --env-file /opt/rt/.env.prod up -d
# Отличия от dev: образы из GHCR по тегу ${RT_IMAGE_TAG} (без сборки и bind-mount кода), без портов наружу
# (кроме Caddy 80/443), restart: unless-stopped, лимиты памяти из servers.md, логи json-file с ротацией.
# PostgreSQL — внешний, на VPS 2 (infra/compose/db.yml), по внутреннему IP ${DB_INTERNAL_IP} с TLS (sslmode=require)
# и отдельной ролью на каждую базу. Prisma (LiteLLM, Langfuse) при самоподписанном сертификате требует sslaccept=accept_invalid_certs
# (шифрование есть, проверки цепочки нет) — до выпуска собственного CA (verify-ca после пилота). Локальные `postgres` и `db-init` из base.yml под профилем `local-db` — не стартуют.
# Профили: `observability` (clickhouse, langfuse-*) и `kb-ingest` (docling) — по очереди, вместе в 8 ГБ не помещаются.

x-ops: &ops
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

# Лимиты памяти — по таблице docs/runbooks/servers.md (VPS 1).
x-mem-64: &mem-64 { deploy: { resources: { limits: { memory: 64M } } } }
x-mem-128: &mem-128 { deploy: { resources: { limits: { memory: 128M } } } }
x-mem-192: &mem-192 { deploy: { resources: { limits: { memory: 192M } } } }
x-mem-256: &mem-256 { deploy: { resources: { limits: { memory: 256M } } } }
x-mem-384: &mem-384 { deploy: { resources: { limits: { memory: 384M } } } }
x-mem-512: &mem-512 { deploy: { resources: { limits: { memory: 512M } } } }
x-mem-768: &mem-768 { deploy: { resources: { limits: { memory: 768M } } } }
x-mem-1536: &mem-1536 { deploy: { resources: { limits: { memory: 1536M } } } }

# Окружение CRM: внешняя база (роль crm_app, TLS через libpq-переменную PGSSLMODE), prod-режим.
x-crm-prod-env: &crm-prod-env
  APP_ENV: prod
  POSTGRES_HOST: ${DB_INTERNAL_IP:?set in .env}
  POSTGRES_PORT: "5432"
  POSTGRES_DB: crm
  POSTGRES_USER: crm_app
  POSTGRES_PASSWORD: ${DB_CRM_PASSWORD:?set in .env}
  PGSSLMODE: require
  # docling-serve на проде не используется (M5-CRM-02): база знаний — только Markdown
  # по docs/kb/FORMAT.md, встроенный конвертер; docling нужен лишь тексту документов клиентов.
  DOCLING_URL: ""
  ERP_FRONTEND_URL: https://${ERP_DOMAIN:?set in .env}
  # Ссылка «Вход» в письмах сотрудникам — Платформа (W15-H8a): из PLATFORM_DOMAIN; PLATFORM_PUBLIC_URL в .env.prod — переопределение.
  PLATFORM_PUBLIC_URL: ${PLATFORM_PUBLIC_URL:-https://${PLATFORM_DOMAIN:?set in .env}}
  CRM_PUBLIC_URL: https://${CRM_DOMAIN:?set in .env}
  # Адрес вебхука Telegram (FIX-66) — из домена CRM, путь тот же, что в Caddyfile.prod; явный
  # TELEGRAM_WEBHOOK_URL в .env.prod остаётся переопределением. Пустой адрес в CRM — не «удалить вебхук».
  TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-https://${CRM_DOMAIN:?set in .env}/telegram/webhook}
  # Бэкап делает VPS 2, CRM читает бакет `backups` RustFS (M5-CRM-01). Явно: том crm_backups из base.yml
  # смонтирован и в проде, и `auto` выбрал бы его.
  BACKUP_SOURCE: rustfs

# Окружение ERP: те же правила, что в B2B (INF-04): миграции — только явно, после pg_dump-гейта (deploy.sh).
x-erp-prod-env: &erp-prod-env
  DJANGO_DEBUG: "false"
  PRODUCTION: "true"
  DJANGO_LOG_FORMAT: json
  AUTO_MIGRATE: "false"
  DRF_NUM_PROXIES: "1"
  DATABASE_URL: postgresql://erp_app:${DB_ERP_PASSWORD:?set in .env}@${DB_INTERNAL_IP:?set in .env}:5432/erp?sslmode=require
  DB_SSLMODE: require
  # 127.0.0.1/localhost — healthcheck контейнера (curl http://127.0.0.1:8000/health/), erp-backend — обращения из сети compose.
  ALLOWED_HOSTS: ${ERP_DOMAIN},${CABINET_DOMAIN},erp-backend,127.0.0.1,localhost
  FRONTEND_URL: https://${ERP_DOMAIN}
  CRM_FRONTEND_URL: https://${CRM_DOMAIN:?set in .env}
  CABINET_URL: https://${CABINET_DOMAIN:?set in .env}
  CABINET_ORIGIN: https://${CABINET_DOMAIN}
  CSRF_TRUSTED_ORIGINS: https://${ERP_DOMAIN},https://${CABINET_DOMAIN}
  CORS_ALLOWED_ORIGINS: https://${ERP_DOMAIN},https://${CABINET_DOMAIN}
  EMAIL_HOST: ${SMTP_HOST:-}
  EMAIL_PORT: ${SMTP_PORT:-587}
  EMAIL_HOST_USER: ${SMTP_USER:-}
  EMAIL_HOST_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_USE_TLS: ${SMTP_USE_TLS:-True}
  DEFAULT_FROM_EMAIL: ${SMTP_FROM:-noreply@example.com}

# Окружение EDS: внешняя база (роль eds_app, TLS в параметрах URL), prod-режим. Миграции — только явно, после pg_dump-гейта
# (deploy.sh: `run --rm --no-deps eds-migrate`); eds-migrate в `up` не участвует.
x-eds-prod-env: &eds-prod-env
  APP_ENV: prod
  EDS_DATABASE_URL: postgresql+psycopg://eds_app:${DB_EDS_PASSWORD:?set in .env}@${DB_INTERNAL_IP:?set in .env}:5432/eds?sslmode=require
  EDS_VERSION: ${RT_IMAGE_TAG:?set RT_IMAGE_TAG}

# Контракты событий и подписки шины rt_bus (B3, L14) вшиты в образ ERP (/opt/rt/contracts, RT_BUS_CONTRACTS_DIR,
# RT_BUS_SUBSCRIPTIONS): монтирований схемы событий из релиза больше нет (events.schema.json удалён вместе с вебхуками).

services:
  # ─── База — снаружи (VPS 2) ─────────────────────────────────────────────────────────────────
  postgres:
    profiles: [local-db]
  db-init:
    profiles: [local-db]

  # ─── Общая инфраструктура ──────────────────────────────────────────────────────────────────
  # Два экземпляра Redis (S0-2); команды и политики вытеснения — в base.yml. maxmemory (base: 128 МБ у брокера, 96 МБ у
  # кэша) заметно ниже лимита контейнера: запас под буферы клиентов, перезапись AOF (брокер) и копирование при снимке RDB (кэш).
  redis-broker:
    <<: [*ops, *mem-256]

  redis-cache:
    <<: [*ops, *mem-192]

  rustfs:
    <<: [*ops, *mem-512]
    # Порт S3 — только на внутреннем IP VPS 1: сюда с VPS 2 ходит backup (бакет `backups`).
    # Файрвол VPS 1 разрешает 9000/tcp только с внутреннего IP VPS 2 (runbook deploy.md).
    ports: ["${APP_INTERNAL_IP:?set in .env}:9000:9000"]

  # Бакеты, пользователи и политики одинаковы на стенде и в проде — описаны в base.yml и infra/s3/init.sh.
  s3-init:
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  # Внешняя копия архива базы на корпоративном Google Drive (OPS-GDRIVE; docs/runbooks/offsite-gdrive.md): раз в сутки rclone copy
  # из бакета wal RustFS в папку общего диска — базовые копии WAL-G за OFFSITE_KEEP_DAYS и WAL с копии, покрывающей границу срока.
  # Только прод (на стенде архива WAL нет). Ключ S3 свой (S3_OFFSITE_*: чтение wal, запись только в бакет offsite — туда идёт
  # status.json для строки CRM «Внешняя копия бэкапов»). Ключ сервисного аккаунта Google владелец кладёт в /opt/rt/secrets
  # (каталог создаёт deploy.sh, chmod 700); нет ключа или OFFSITE_GDRIVE_FOLDER_ID — статус «не настроено», сервис работает.
  # Образ rclone — официальный, версия и digest закреплены; Go-бинарь без требований к CPU выше x86-64 v1 (cpu-baseline-rules.sh).
  offsite-backup:
    <<: [*ops, *mem-128]
    image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    entrypoint: ["sh", "/offsite/gdrive-sync.sh"]
    command: ["--daemon"]
    environment:
      TZ: UTC
      # Go в лимите 128 МБ: сборщик мусора держит кучу ниже предела контейнера.
      GOMEMLIMIT: 96MiB
      OFFSITE_S3_ENDPOINT: http://rustfs:9000
      OFFSITE_S3_ACCESS_KEY: ${S3_OFFSITE_ACCESS_KEY:?set in .env}
      OFFSITE_S3_SECRET_KEY: ${S3_OFFSITE_SECRET_KEY:?set in .env}
      OFFSITE_WAL_BUCKET: wal
      # Тот же каталог архива, что у WAL-G на VPS 2 и у строки CRM «Архив WAL» (по умолчанию pg17).
      OFFSITE_WAL_PREFIX: ${WAL_S3_PREFIX:-pg17}
      OFFSITE_STATUS_BUCKET: offsite
      # Ключ и ID папки из интерфейса (OPS-GDRIVE-2): CRM пишет, сервис читает раз в минуту.
      OFFSITE_CONFIG_BUCKET: offsite-config
      OFFSITE_GDRIVE_SA_FILE: /secrets/gdrive-sa.json
      OFFSITE_SA_HOST_PATH: ${RT_SECRETS_DIR:-/opt/rt/secrets}/gdrive-sa.json
      OFFSITE_GDRIVE_FOLDER_ID: ${OFFSITE_GDRIVE_FOLDER_ID:-}
      OFFSITE_GDRIVE_SHARED_DRIVE_ID: ${OFFSITE_GDRIVE_SHARED_DRIVE_ID:-}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-14}
      OFFSITE_MAX_GB: ${OFFSITE_MAX_GB:-100}
      OFFSITE_BWLIMIT: ${OFFSITE_BWLIMIT:-2M}
      OFFSITE_AT_UTC: ${OFFSITE_AT_UTC:-23:00}
    volumes:
      - ../offsite/gdrive-sync.sh:/offsite/gdrive-sync.sh:ro
      - ${RT_SECRETS_DIR:-/opt/rt/secrets}:/secrets:ro
      - offsite_state:/state
    depends_on:
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "/offsite/gdrive-sync.sh", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  litellm:
    <<: [*ops, *mem-768]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-litellm:${RT_IMAGE_TAG:?set RT_IMAGE_TAG}
    build: !reset null
    environment:
      DATABASE_URL: postgresql://litellm_app:${DB_LITELLM_PASSWORD:?set in .env}@${DB_INTERNAL_IP}:5432/litellm?sslmode=require&sslaccept=accept_invalid_certs
    depends_on: !override {}

  litellm-seed:
    <<: [*ops, *mem-256]
    restart: "no"
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-crm-backend:${RT_IMAGE_TAG}
    build: !reset null
    environment: *crm-prod-env
    depends_on: !override
      litellm:
        condition: service_healthy

  docling:
    <<: *ops
    profiles: [kb-ingest]
    deploy: { resources: { limits: { memory: 1536M } } }

  # ─── CRM ────────────────────────────────────────────────────────────────────────────────────
  crm-migrate:
    <<: [*ops, *mem-384]
    restart: "no"
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-crm-backend:${RT_IMAGE_TAG:?set RT_IMAGE_TAG}
    build: !reset null
    environment: *crm-prod-env
    depends_on: !override {}

  crm-api:
    <<: [*ops, *mem-512]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-crm-backend:${RT_IMAGE_TAG:?set RT_IMAGE_TAG}
    build: !reset null
    environment:
      <<: *crm-prod-env
      CABINET_ORIGIN: https://${CABINET_DOMAIN}
    depends_on: !override
      crm-migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      litellm-seed:
        condition: service_completed_successfully

  # crm-bot (S0-4): приём Telegram отдельно от crm-api. 512 МБ — как у crm-api: те же зависимости (aiogram, LangGraph,
  # агент диалога) в памяти постоянно. Реплика одна.
  crm-bot:
    <<: [*ops, *mem-512]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-crm-backend:${RT_IMAGE_TAG}
    build: !reset null
    environment: *crm-prod-env
    depends_on: !override
      crm-migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      litellm-seed:
        condition: service_completed_successfully

  crm-worker:
    <<: [*ops, *mem-512]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-crm-backend:${RT_IMAGE_TAG}
    build: !reset null
    environment: *crm-prod-env
    # docling — профиль kb-ingest, поднимается только на время загрузки документов в базу знаний.
    depends_on: !override
      crm-migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      litellm-seed:
        condition: service_completed_successfully

  crm-mcp-kb:
    <<: [*ops, *mem-256]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-crm-backend:${RT_IMAGE_TAG}
    build: !reset null
    environment: *crm-prod-env
    depends_on: !override
      crm-migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      litellm-seed:
        condition: service_completed_successfully

  crm-mcp-crm:
    <<: [*ops, *mem-256]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-crm-backend:${RT_IMAGE_TAG}
    build: !reset null
    environment: *crm-prod-env
    depends_on: !override
      crm-migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      litellm-seed:
        condition: service_completed_successfully

  crm-mcp-docs:
    <<: [*ops, *mem-256]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-crm-backend:${RT_IMAGE_TAG}
    build: !reset null
    environment: *crm-prod-env
    depends_on: !override
      crm-migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      litellm-seed:
        condition: service_completed_successfully

  crm-web:
    <<: [*ops, *mem-64]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-crm-frontend:${RT_IMAGE_TAG}
    build: !reset null

  # ─── EDS (apps/eds, волна 12) ───────────────────────────────────────────────────────────────
  # Без портов и без маршрута в Caddy: приёмник шины и API — только внутри сети compose (BFF Платформы, шина rt_bus).
  # Память (замер гейта C1, docs/runbooks/c1_eds_gate_report.md §2 и C1-G-8): рабочий процесс eds-api ≈ 110 МиБ после 100+
  # запросов (прод — один процесс без --reload), eds-worker 94–100 МиБ. Лимит eds-api — 256 МБ: запас ≈ 2,2× на файлы и
  # экспорт реестра (XLSX до 10 000 строк идёт в API); eds-worker — 192 МБ (запас ≈ 1,8×: только шина и задачи очереди).
  eds-migrate:
    <<: [*ops, *mem-256]
    restart: "no"
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-eds:${RT_IMAGE_TAG:?set RT_IMAGE_TAG}
    build: !reset null
    environment:
      <<: *eds-prod-env
    depends_on: !override {}

  eds-api:
    <<: [*ops, *mem-256]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-eds:${RT_IMAGE_TAG:?set RT_IMAGE_TAG}
    build: !reset null
    environment:
      <<: *eds-prod-env
    depends_on: !override
      eds-migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully

  eds-worker:
    <<: [*ops, *mem-192]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-eds:${RT_IMAGE_TAG:?set RT_IMAGE_TAG}
    build: !reset null
    environment:
      <<: *eds-prod-env
    depends_on: !override
      eds-migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully

  # ─── ERP ────────────────────────────────────────────────────────────────────────────────────
  erp-backend:
    <<: [*ops, *mem-768]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-erp-backend:${RT_IMAGE_TAG}
    build: !reset null
    environment: *erp-prod-env
    volumes: !override
      - erp_static:/app/staticfiles
    depends_on: !override
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_started
      s3-init:
        condition: service_completed_successfully

  # erp-mcp (FIX-36): инструменты ERP для агента CRM (SDK mcp), тот же образ, что erp-backend. Порт 8104 только во
  # внутренней сети compose, наружу не публикуется; Caddyfile.prod отдаёт `/mcp` на всех доменах 404 (FIX-03).
  # Контракт инструментов — файл packages/contracts/mcp-tools.json, монтируется read-only в /packages/contracts.
  # Файла нет — сервис не стартует (create_host_path: false — Docker не подменяет его пустым каталогом).
  # Профиль `mcp`: бот CRM в сервисном режиме (M3-CRM-07) берёт данные клиента из erp-mcp, поэтому на проде профиль
  # включён (`RT_PROFILES=mcp` в .env.prod, infra/.env.prod.example; release.tgz файл контракта несёт). Без профиля
  # сервис не стартует, а бот на вопросы о счетах и поставках честно отвечает «не могу проверить» и передаёт менеджеру.
  # Вручную:
  #   docker compose -f base.yml -f prod.yml --profile mcp up -d erp-mcp
  erp-mcp:
    <<: [*ops, *mem-256]
    profiles: ["mcp"]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-erp-backend:${RT_IMAGE_TAG}
    build: !reset null
    environment: *erp-prod-env
    volumes: !override
      - type: bind
        source: ../../packages/contracts/mcp-tools.json
        target: /packages/contracts/mcp-tools.json
        read_only: true
        bind: { create_host_path: false }

  # erp-worker, erp-worker-ai, erp-beat: тот же образ; контракты шины вшиты (раскладку и доставку событий ведёт воркер).
  erp-worker:
    <<: [*ops, *mem-512]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-erp-backend:${RT_IMAGE_TAG}
    build: !reset null
    environment: *erp-prod-env

  erp-worker-ai:
    <<: [*ops, *mem-384]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-erp-backend:${RT_IMAGE_TAG}
    build: !reset null
    environment: *erp-prod-env

  erp-beat:
    <<: [*ops, *mem-192]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-erp-backend:${RT_IMAGE_TAG}
    build: !reset null
    environment: *erp-prod-env

  erp-ai-gateway:
    <<: [*ops, *mem-256]
    restart: "no"
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-erp-backend:${RT_IMAGE_TAG}
    build: !reset null
    environment: *erp-prod-env

  erp-web:
    <<: [*ops, *mem-64]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-erp-frontend:${RT_IMAGE_TAG}
    build: !reset null

  cabinet-web:
    <<: [*ops, *mem-64]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-cabinet:${RT_IMAGE_TAG}
    build: !reset null

  # ─── Платформа (apps/platform) ──────────────────────────────────────────────────────────────
  # Объявлены в base.yml (окружение, healthcheck, зависимость от redis-cache); здесь — образы GHCR и лимиты памяти.
  # BFF ходит в CRM и ERP по сети compose (PLATFORM_CRM_URL / PLATFORM_ERP_URL), БД у него нет, сессии — redis-cache БД 3.
  platform-bff:
    <<: [*ops, *mem-256]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-platform-bff:${RT_IMAGE_TAG:?set RT_IMAGE_TAG}
    build: !reset null
    environment:
      # Прод — только https: cookie сессии всегда Secure, значением из .env.prod это не выключить (Q-PLT-10-1 п. 5).
      PLATFORM_COOKIE_SECURE: "true"

  platform-web:
    <<: [*ops, *mem-64]
    image: ${RT_IMAGE_REGISTRY:-ghcr.io/nzulkaynarov}/rt-platform-web:${RT_IMAGE_TAG:?set RT_IMAGE_TAG}
    build: !reset null

  # ─── Вход ───────────────────────────────────────────────────────────────────────────────────
  caddy:
    <<: [*ops, *mem-64]
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN}
      ERP_DOMAIN: ${ERP_DOMAIN}
      CABINET_DOMAIN: ${CABINET_DOMAIN}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?set in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ../caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
    ports: ["80:80", "443:443", "443:443/udp"]

  # ─── Профиль observability: Langfuse (наружу не публикуется, доступ — SSH-туннель) ─────────
  clickhouse:
    <<: [*ops, *mem-768]

  langfuse-worker:
    <<: [*ops, *mem-512]
    depends_on: !override
      s3-init:
        condition: service_completed_successfully
      redis-broker:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse_app:${DB_LANGFUSE_PASSWORD:?set in .env}@${DB_INTERNAL_IP}:5432/langfuse?sslmode=require&sslaccept=accept_invalid_certs

  langfuse-web:
    <<: [*ops, *mem-768]
    depends_on: !override
      s3-init:
        condition: service_completed_successfully
      redis-broker:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse_app:${DB_LANGFUSE_PASSWORD}@${DB_INTERNAL_IP}:5432/langfuse?sslmode=require&sslaccept=accept_invalid_certs
    ports: ["127.0.0.1:3000:3000"]

volumes:
  # Отметки offsite-backup (последний успех, сводка): переживают пересоздание контейнера; потерю тома скрипт восполняет из status.json.
  offsite_state:
