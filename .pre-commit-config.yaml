# pre-commit корня ансамбля: `make hooks` (= pre-commit install).
# Полная проверка — `make check`; здесь быстрые проверки изменённых файлов и gitleaks (ORCHESTRATOR §3.6).
# legacy/b2b не редактируется (ORCHESTRATOR §3.11) — исключён из всех хуков.
exclude: ^legacy/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        # tsconfig*.json — JSONC (комментарии, запятые в конце), не JSON
        exclude: tsconfig[^/]*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]  # apps/erp/backend/schema.json (экспорт OpenAPI) ≈ 1,4 МБ
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^apps/crm/(backend/|scripts/.*\.py$)
      - id: ruff-format
        files: ^apps/crm/(backend/|scripts/.*\.py$)

  - repo: local
    hooks:
      - id: prettier-crm
        name: prettier (apps/crm/frontend)
        language: system
        entry: bash -c 'cd apps/crm/frontend && pnpm exec prettier --write --ignore-unknown "${@#apps/crm/frontend/}"' --
        files: ^apps/crm/frontend/
        pass_filenames: true
      - id: eslint-crm
        name: eslint (apps/crm/frontend)
        language: system
        entry: bash -c 'cd apps/crm/frontend && pnpm exec eslint --max-warnings=0 "${@#apps/crm/frontend/}"' --
        files: ^apps/crm/frontend/.*\.(ts|tsx|js)$
        # Клиент orval в eslint-ignore: явная передача этих файлов даёт warning «File ignored».
        exclude: ^apps/crm/frontend/src/api/generated/
