# pre-commit корня ансамбля: `make hooks` (= pre-commit install).
# Полная проверка — `make check`; здесь быстрые проверки изменённых файлов и gitleaks (ORCHESTRATOR §3.6).
# legacy/b2b удалена по плану M2-INF-01 (тег b2b-final).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe: compose-файлы CRM используют теги `!reset` (docker compose merge)
        args: [--allow-multiple-documents, --unsafe]
      - id: check-toml
      - id: check-json
        # tsconfig*.json — JSONC (комментарии, запятые в конце), не JSON
        exclude: tsconfig[^/]*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]  # apps/erp/backend/schema.json (экспорт OpenAPI) ≈ 1,4 МБ
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^apps/crm/backend/
      - id: ruff-format
        files: ^apps/crm/backend/
      # Скрипты apps/crm/scripts лежат вне backend/ и без своей конфигурации ruff: хук брал бы умолчания (строка 88, без правил S) —
      # переформатировал бы скрипты и снимал бы `# noqa: S603`. Конфигурация бэкенда явно, как в ci_local.sh (стадия crm).
      # Для backend/ --config не передаётся: пути per-file-ignores в нём считаются от каталога конфигурации, а не от корня репозитория.
      - id: ruff-check
        alias: ruff-check-crm-scripts
        name: ruff check (apps/crm/scripts, конфигурация бэкенда)
        args: [--fix, --config, apps/crm/backend/pyproject.toml]
        files: ^apps/crm/scripts/.*\.py$
      - id: ruff-format
        alias: ruff-format-crm-scripts
        name: ruff format (apps/crm/scripts, конфигурация бэкенда)
        args: [--config, apps/crm/backend/pyproject.toml]
        files: ^apps/crm/scripts/.*\.py$

  - repo: local
    hooks:
      - id: prettier-crm
        name: prettier (apps/crm/frontend)
        language: system
        entry: bash -c 'cd apps/crm/frontend && pnpm exec prettier --write --ignore-unknown "${@#apps/crm/frontend/}"' --
        files: ^apps/crm/frontend/
        pass_filenames: true
      - id: eslint-crm
        name: eslint (apps/crm/frontend)
        language: system
        entry: bash -c 'cd apps/crm/frontend && pnpm exec eslint --max-warnings=0 --no-warn-ignored "${@#apps/crm/frontend/}"' --
        files: ^apps/crm/frontend/.*\.(ts|tsx|js)$
        # Клиент orval в eslint-ignore: явная передача этих файлов даёт warning «File ignored».
        exclude: ^apps/crm/frontend/src/api/generated/
