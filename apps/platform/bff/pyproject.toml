[project]
name = "railtech-platform-bff"
version = "0.1.0"
description = "RailTech Platform BFF: API для SPA сотрудников, без своей базы данных (ADR-0011)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "redis>=7.4.0",
    "rt-bus[fastapi]",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.83.0",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Модели CRM генерирует datamodel-codegen из packages/contracts/openapi/crm.yaml (формат и линт — его, свежесть — make crm-models-check).
extend-exclude = ["app/clients/crm_models.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "BLE", "C4", "PT", "RUF", "ASYNC", "T20", "N"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

# Шина событий rt_bus (ADR-0014, L14): библиотека по пути; в образе пакет приходит именованным контекстом `rtbus`.
[tool.uv.sources]
rt-bus = { path = "../../../packages/rt-bus", editable = true }
