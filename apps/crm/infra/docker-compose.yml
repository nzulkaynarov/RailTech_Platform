# Базовый compose (SPEC §3.2). Запуск только через overrides:
#   dev:  make up        (docker-compose.yml + docker-compose.dev.yml)
#   prod: make up-prod   (docker-compose.yml + docker-compose.prod.yml)
# Langfuse — профиль `observability` (make up-obs).

name: railtech

x-backend: &backend
  build:
    context: ../backend
    target: prod
    # Шина событий rt_bus (ADR-0014, L14): пакет и схемы контракта лежат вне контекста сборки.
    additional_contexts:
      rtbus: ../../../packages/rt-bus
      contracts: ../../../packages/contracts
  # Только нужные backend переменные, без env_file: ключи провайдеров и
  # секреты инфраструктуры в api/worker не попадают (SPEC §11).
  environment: &backend-env
    APP_ENV: ${APP_ENV:-dev}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    READY_CHECK_TIMEOUT_S: ${READY_CHECK_TIMEOUT_S:-2}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    S3_ENDPOINT: http://rustfs:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    LITELLM_BASE_URL: http://litellm:4000
    LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
    DOCLING_URL: http://docling:5001
    DOCLING_API_KEY: ${DOCLING_API_KEY}
    AGENT_CONTEXT_KEY: ${AGENT_CONTEXT_KEY}
    JWT_SECRET: ${JWT_SECRET}
    SECRETS_KEY: ${SECRETS_KEY:-}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
    TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
    TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
    LANGFUSE_HOST: http://langfuse-web:3000
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-хранилище файлов — RustFS (ADR-0009). Один том /data (single-drive).
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Создаёт бакеты (идемпотентно: повторный PUT существующего бакета → 200).
  # Бакеты приложения добавляются в S3_BUCKETS с Фазы 1.
  s3-init:
    image: rustfs/rustfs:1.0.1
    restart: "no"
    entrypoint: ["sh", "-ec"]
    command:
      - >-
        credentials="$${S3_ACCESS_KEY}:$${S3_SECRET_KEY}";
        for bucket in $${S3_BUCKETS}; do
        curl -fsS -o /dev/null --aws-sigv4 "aws:amz:us-east-1:s3"
        --user "$${credentials}" -X PUT "http://rustfs:9000/$${bucket}";
        echo "bucket ready: $${bucket}";
        done
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKETS: langfuse kb-sources client-documents tg-attachments
    healthcheck:
      disable: true
    depends_on:
      rustfs:
        condition: service_healthy

  # Отдельная БД `litellm` в том же Postgres (ADR-0020): модели и их ключи (шифр LITELLM_SALT_KEY).
  litellm-db-init:
    image: pgvector/pgvector:0.8.7-pg17
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    command:
      - sh
      - -c
      - >-
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'litellm'" | grep -q 1
        || psql -c "CREATE DATABASE litellm"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:v1.105.0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      # Модели — в БД LiteLLM, меняются из CRM без перезапуска (ADR-0020).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    depends_on:
      litellm-db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Модели по умолчанию в БД LiteLLM: создаёт только отсутствующие алиасы (ADR-0020).
  litellm-seed:
    <<: *backend
    command: ["python", "-m", "app", "litellm-seed"]
    restart: "no"
    volumes:
      - ./litellm.models.yaml:/app/litellm.models.yaml:ro
    healthcheck:
      disable: true
    depends_on:
      litellm:
        condition: service_healthy

  # Миграции Alembic (вкл. схему Procrastinate) перед стартом api и worker.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["python", "-m", "app", "api"]
    # IP клиента из X-Forwarded-For Caddy (аудит входов, lockout): порт api наружу не
    # публикуется на prod, достучаться можно только из внутренней сети стенда.
    environment:
      <<: *backend-env
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./casbin:/app/casbin:ro
      - ./litellm.models.yaml:/app/litellm.models.yaml:ro
      # Статус бэкапов и флаг «сделать сейчас» (ADR-0013); pg_dump — только в контейнере backup.
      - backups:/backups
    depends_on: &backend-deps
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      litellm-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    <<: *backend
    command: ["python", "-m", "app", "worker"]
    # Центр внешних сервисов (ADR-0024): воркер проверяет хранилище бэкапов (только чтение) и
    # берёт алиасы моделей по умолчанию, когда шлюз недоступен.
    volumes:
      - ./litellm.models.yaml:/app/litellm.models.yaml:ro
      - backups:/backups:ro
    depends_on:
      <<: *backend-deps
      docling:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "procrastinate", "--app=app.tasks.queue.queue", "healthchecks"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Конвертация документов (ADR-0011): официальный CPU-образ docling-serve.
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.36.0
    environment:
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY:?set in .env}
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_MAX_SYNC_WAIT: "600"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # MCP-серверы инструментов агентов (SPEC §7.1): только внутренняя сеть.
  kb-mcp:
    <<: *backend
    command: ["python", "-m", "app", "mcp", "kb"]
    depends_on: *backend-deps
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('localhost', 8101), timeout=2)
      interval: 15s
      timeout: 5s
      retries: 10

  crm-mcp:
    <<: *backend
    command: ["python", "-m", "app", "mcp", "crm"]
    depends_on: *backend-deps
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('localhost', 8102), timeout=2)
      interval: 15s
      timeout: 5s
      retries: 10

  docs-mcp:
    <<: *backend
    command: ["python", "-m", "app", "mcp", "docs"]
    depends_on: *backend-deps
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('localhost', 8103), timeout=2)
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../frontend
      target: prod
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2.11.7-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Бэкапы (ADR-0013): pg_dump + копия бакетов в том backups, ежедневно 03:00 Ташкент.
  # Профиль backup: на prod включён всегда (make up-prod), на dev — для make backup/restore.
  backup:
    <<: *backend
    profiles: [backup]
    build:
      context: ../backend
      target: backup
    command: ["/app/ops/backup.sh", "--daemon"]
    # Только БД и S3: ключи моделей, JWT и токен бота бэкапу не нужны.
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AT_UTC: ${BACKUP_AT_UTC:-22:00}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # --- профиль observability: Langfuse v4 и его зависимости (официальный compose) ---

  langfuse-db-init:
    profiles: [observability]
    image: pgvector/pgvector:0.8.7-pg17
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    command:
      - sh
      - -c
      - >-
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'langfuse'" | grep -q 1
        || psql -c "CREATE DATABASE langfuse"
    depends_on:
      postgres:
        condition: service_healthy

  clickhouse:
    profiles: [observability]
    image: clickhouse/clickhouse-server:26.4.5.143
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  # Redis — внутренняя зависимость Langfuse (очереди BullMQ), приложением не используется.
  redis:
    profiles: [observability]
    image: redis:7.4.11
    command: ["--requirepass", "${REDIS_AUTH:?set in .env}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_AUTH: ${REDIS_AUTH}

  langfuse-worker:
    profiles: [observability]
    image: langfuse/langfuse-worker:4.56.0
    depends_on: &langfuse-deps
      langfuse-db-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:?set in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set in .env}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://rustfs:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://rustfs:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://' + process.env.HOSTNAME + ':3030/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  langfuse-web:
    profiles: [observability]
    image: langfuse/langfuse:4.56.0
    depends_on: *langfuse-deps
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://rustfs:9000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://' + process.env.HOSTNAME + ':3000/api/public/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  backups:
  postgres_data:
  s3_data:
  caddy_data:
  caddy_config:
  clickhouse_data:
  clickhouse_logs:
  redis_data:
