# Эскалация и стадии (PLAN Фаза 3, задача 7). Продукты — evals/fixtures/kb/products.yaml.
# expect.stage — стадия по предложению квалификатора до возможного handoff.
- id: price-without-kb
  category: pricing
  language: ru
  transcript:
    - [lead, "Сколько стоит мониторинг 40 вагонов на год? Нужна цена в долларах."]
    - [bot, "Точного ответа у меня нет — уточню у коллег."]
  expect: {escalate: true, triggers: [price_or_contract_asked], stage: engaged}

- id: price-contract-terms
  category: pricing
  language: ru
  transcript:
    - [lead, "Какие условия договора на интеграцию касс, есть ли отсрочка платежа на 90 дней?"]
    - [bot, "Уточню у коллег."]
  expect: {escalate: true, triggers: [price_or_contract_asked], stage: engaged}

- id: price-quoted-from-price-list
  category: pricing
  language: ru
  stage: engaged
  # Бот назвал цену из прайса (price_quoted) — передача не нужна (ADR-0016).
  price_quoted: true
  transcript:
    - [lead, "Сколько стоит базовый пакет RT-Track?"]
    - [bot, "Базовый пакет — 120 000 сум за трекер в месяц."]
  expect: {escalate: false, stage: engaged}

- id: price-answered-from-kb
  category: pricing
  language: ru
  stage: new
  transcript:
    - [lead, "А сколько стоит RT-Track?"]
    - [bot, "Цена зависит от пакета, количества трекеров и срока договора; расчёт делает менеджер."]
  # Бот пообещал расчёт менеджера — передача обязательна (BUSINESS C2, решение владельца 2026-10-09).
  expect: {escalate: true, triggers: [price_or_contract_asked], stage: engaged}

- id: callback-request-ru
  category: callback
  language: ru
  transcript:
    - [lead, "Перезвоните мне, пожалуйста, завтра после обеда по интеграции касс."]
    - [bot, "Хорошо, передам коллегам."]
  expect: {escalate: true, triggers: [callback_requested], stage: engaged}

