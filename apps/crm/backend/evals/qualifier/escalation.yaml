- id: recommend-wants-proposal
  category: recommend
  language: en
  transcript:
    - [lead, "We run 12 stores and need POS integration with 1C. Please send a commercial proposal."]
    - [bot, "For a chain of 3–10 stores implementation takes 2 to 4 weeks."]
  # Потребность + продукт без срока, роли и бюджета → «Вовлечён» (правила по умолчанию, ADR-0016);
  # передача менеджеру остаётся — клиент просит КП.
  expect: {escalate: true, stage: engaged}

