- id: high-score-ready-buyer
  category: high_score
  language: ru
  score: 40
  transcript:
    - [lead, "Я владелец сети из 3 аптек в Ташкенте. Нужна интеграция касс АТОЛ с 1С, запустить хотим в течение месяца."]
    - [bot, "Для сети из 3–10 магазинов внедрение занимает от 2 до 4 недель."]
    - [lead, "Отлично, подготовьте предложение, позвоните мне."]
