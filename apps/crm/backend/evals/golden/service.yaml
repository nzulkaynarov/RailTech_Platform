      get_deal_status:
        {erp_deal_id: 5, number: "D-5", title: Трекеры RT-Track, stage: contract, amount: "12500000.00", currency: UZS, quotes: [], contracts: [{number: "15/2026", status: sent}], invoices: [], deliveries: [], acts: []}
  expect:
    actions: [answer]
    reply_language: ru
