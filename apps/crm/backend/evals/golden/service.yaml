- id: service-price-lead-ru
  category: service_mode
  language: ru
  mode: prospect
  stage: engaged
  message: Сколько стоит трекер RT-Track?
  expect:
    actions: [answer, fallback, handoff]
    reply_language: ru
    no_erp_calls: true
    must_not_include: ["сум", "so'm", "usd", "$", "долл"]

- id: service-erp-down-ru
  category: service_mode
  language: ru
  mode: customer
  stage: customer
  message: Где мой счёт?
