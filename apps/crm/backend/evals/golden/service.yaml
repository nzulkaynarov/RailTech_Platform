- id: service-delivery-when-ru
  category: service_mode
  language: ru
  mode: customer
  stage: customer
  message: Когда поставка по сделке D-5?
  erp:
    tools:
      list_client_deals:
        - {erp_deal_id: 5, number: "D-5", title: Трекеры RT-Track, stage: fulfilment, amount: "12500000.00", currency: UZS, next_step: null, updated_at: "2026-10-20T09:00:00Z"}
      get_delivery_status:
        - {erp_deal_id: 5, line_no: 1, title: Трекер RT-Track, quantity: "10.000", unit: шт, status: shipped, eta: "2026-10-25", tracking: null}
  expect:
    actions: [answer]
    reply_language: ru
    erp_tools_any: [get_delivery_status]
    must_include_any: ["25"]

