# Сервисный режим бота через erp-mcp (M3-CRM-07): ответы только по данным инструментов ERP.
# `erp.tools` — результаты инструментов (форма — packages/contracts/mcp-tools.json, суммы — строки с
# двумя знаками, даты ISO). Числа и даты ответа проверяет код (`unsupported_numbers`): выдуманных 0.
# Платный прогон — только с согласия владельца: EVAL_CASES=service-... make eval-quick CONFIRM=yes.
- id: service-invoice-where-ru
  category: service_mode
  language: ru
  mode: customer
  stage: customer
  message: Где мой счёт?
  erp:
    tools:
      list_client_deals:
        - {erp_deal_id: 5, number: "D-5", title: Трекеры RT-Track, stage: invoiced, amount: "12500000.00", currency: UZS, next_step: Оплатить счёт, updated_at: "2026-10-20T09:00:00Z"}
      get_deal_status:
        {erp_deal_id: 5, number: "D-5", title: Трекеры RT-Track, stage: invoiced, amount: "12500000.00", currency: UZS, quotes: [], contracts: [{number: "15/2026", status: signed}], invoices: [{erp_invoice_id: 31, number: "77", status: issued, total: {amount: "12500000.00", currency: UZS}, due_date: "2026-10-30"}], deliveries: [], acts: []}
  expect:
    actions: [answer]
    reply_language: ru
    erp_tools_any: [get_deal_status]
    must_include_any: ["77"]

- id: service-invoice-not-issued-ru
