- id: service-contract-send-ru
  category: service_mode
  language: ru
  mode: customer
  stage: customer
  message: Пришлите договор
  documents:
    - {document_id: 1, title: Договор поставки трекеров, type: contract, number: "15/2026", doc_date: "2026-07-14"}
  expect:
    actions: [deliver_document]
    reply_language: ru
    must_include_any: ["Договор поставки"]
    no_erp_calls: true

- id: service-contract-missing-ru
  category: service_mode
  language: ru
  mode: customer
  stage: customer
  message: Пришлите договор
  erp:
    tools:
      list_client_documents: []
  expect:
    actions: [answer]
    reply_language: ru
    erp_tools_any: [list_client_documents]
    must_not_include: ["прикладываю", "высылаю", "вот ваш договор"]

- id: service-price-customer-ru
  category: service_mode
  language: ru
  mode: customer
  stage: customer
  message: Сколько стоит трекер RT-Track?
  erp:
    tools:
      search_catalog:
        - {erp_product_id: 9, kind: goods, name: Трекер RT-Track, description: GPS-трекер для вагонов, unit: шт, price: {amount: "1250000.00", currency: UZS}, availability: in_stock, lead_time_days: 14}
  expect:
    actions: [answer]
    reply_language: ru
    erp_tools_any: [search_catalog]
    must_include_any: ["1 250 000", "1250000", "1,25 млн"]

