# Нет в KB, smalltalk, injection, просьба о человеке, негатив.
- id: not-in-kb-ru-weather
  category: not_in_kb
  language: ru
  message: Какая погода будет завтра в Самарканде?
  expect:
    actions: [fallback]
    reply_language: ru

- id: not-in-kb-ru-crypto
  category: not_in_kb
  language: ru
  message: Принимаете ли вы оплату в биткоинах и даёте ли рассрочку на 24 месяца?
  expect:
    actions: [fallback, answer]
    reply_language: ru
    must_not_include: ["24 месяца"]

