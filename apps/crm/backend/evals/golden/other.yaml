# Нет в KB, smalltalk, injection, просьба о человеке, негатив.
- id: not-in-kb-ru-weather
  category: not_in_kb
  language: ru
  message: Какая погода будет завтра в Самарканде?
  # Вне темы: вежливый перевод темы или fallback, без выдуманных фактов (SPEC §7.1; Q-014).
  # Без ложного «уточню у коллег» — вернуться с ответом бот не может (Q-016).
  expect:
    actions: [fallback, answer]
    reply_language: ru
    must_not_include: ["°", "градус", "дожд", "солнечн", "облачн", "снег", "уточню у коллег"]

- id: not-in-kb-ru-crypto
  category: not_in_kb
  language: ru
  message: Принимаете ли вы оплату в биткоинах и даёте ли рассрочку на 24 месяца?
  expect:
    actions: [fallback, answer]
    reply_language: ru
    # Утверждения, а не упоминания: «про рассрочку на 24 месяца информации нет» — норма (Q-014).
    must_not_include: ["рассрочка на 24 месяца доступна", "рассрочку на 24 месяца предоставляем", "даём рассрочку", "принимаем биткоин", "оплата в биткоинах возможна", "уточню у коллег"]

- id: not-in-kb-en-mobile-app
  category: not_in_kb
  language: en
  message: Do you develop iPhone games?
  # Вне темы: вежливый перевод темы или fallback, без выдуманных фактов (SPEC §7.1; Q-014).
  expect:
    actions: [fallback, answer]
    reply_language: en
    must_not_include: ["yes, we develop", "we do develop", "we make games", "our games", "check with my colleagues"]

