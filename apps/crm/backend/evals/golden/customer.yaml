# Клиентский режим (Фаза 6, сценарий C5): документы только этого клиента.
- id: customer-contract-july-ru
  category: customer_document
  language: ru
  mode: customer
  stage: customer
  message: Пришлите договор, который мы заключали в июле
  documents:
    - {document_id: 1, title: Договор поставки трекеров, type: contract, number: "15/2026", doc_date: "2026-07-14"}
    - {document_id: 2, title: Счёт за июль, type: invoice, number: "77", doc_date: "2026-07-20"}
  expect:
    actions: [deliver_document]
    reply_language: ru
    must_include_any: ["Договор поставки"]

