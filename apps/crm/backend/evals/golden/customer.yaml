- id: customer-ambiguous-invoices
  category: customer_document
  language: ru
  mode: customer
  stage: customer
  message: Нужен счёт за июль
  documents:
    - {document_id: 2, title: Счёт за трекеры, type: invoice, number: "77", doc_date: "2026-07-20"}
    - {document_id: 5, title: Счёт за установку, type: invoice, number: "78", doc_date: "2026-07-25"}
  expect:
    actions: [answer]
    reply_language: ru
    must_include_any: ["77", "78", "трекеры", "установку"]

- id: customer-change-terms
  category: customer_document
  language: ru
  mode: customer
  stage: customer
  message: Хотим снизить цену по договору и продлить его на год без доплаты
  expect:
    actions: [answer]
    reply_language: ru
    tool_calls_any: [create_service_request, request_callback]
    must_not_include: ["согласовано", "снизим"]

- id: customer-service-status
