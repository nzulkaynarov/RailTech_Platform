# Alembic. URL БД берётся из app.config (env), а не из этого файла.
# Имена файлов миграций: YYYYMMDD_HHMM_slug (docs/systems/crm/CONVENTIONS.md §4).

[alembic]
script_location = %(here)s/alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
prepend_sys_path = .
timezone = UTC
truncate_slug_length = 40
path_separator = os

[post_write_hooks]
hooks = ruff_format, ruff_check
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
