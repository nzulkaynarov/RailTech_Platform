# CI (PLAN Фаза 0, задача 7): lint → unit → integration → build.
# Интеграционные тесты — с реальными Postgres+pgvector и RustFS (S3).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: make install
      - name: Backend — ruff, mypy
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ruff check --config pyproject.toml ../scripts
          uv run ruff format --config pyproject.toml --check ../scripts
          uv run mypy app tests evals promptfoo alembic
      - name: Frontend — eslint, prettier, tsc
        working-directory: frontend
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
      - name: OpenAPI актуален
        run: |
          make openapi
          git diff --exit-code -- docs/api/openapi.json frontend/src/api/generated \
            || (echo "::error::OpenAPI или клиент orval устарели — выполните make openapi"; exit 1)
      - name: Compose-файлы валидны
        run: |
          sed 's/CHANGE_ME/ci/; s/^IMAGE_TAG=$/IMAGE_TAG=ci/' .env.example > .env
          for override in dev prod; do
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.$override.yml \
              --env-file .env --profile observability --profile backup config -q
          done
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --redact --verbose .

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: make install
      - name: Backend unit (pytest)
        working-directory: backend
        run: uv run pytest --cov --cov-report=term-missing
      - name: Frontend unit (vitest)
        working-directory: frontend
        run: pnpm test

  integration:
    name: Integration tests
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_DB: railtech_test
          POSTGRES_USER: railtech
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U railtech -d railtech_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: railtech_test
      POSTGRES_USER: railtech
      POSTGRES_PASSWORD: ci-only-password
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: railtech
      S3_SECRET_KEY: ci-only-password
    steps:
      - uses: actions/checkout@v7
      # Тот же образ, что в infra/docker-compose.yml (ADR-0009).
      - name: Start RustFS
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=railtech -e RUSTFS_SECRET_KEY=ci-only-password \
            -e RUSTFS_ADDRESS=0.0.0.0:9000 \
            rustfs/rustfs:1.0.1
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/health && exit 0
            sleep 2
          done
          docker logs rustfs; exit 1
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        working-directory: backend
        run: uv sync --frozen
      - name: Integration (pytest -m integration)
        working-directory: backend
        run: uv run pytest -m integration -v

  e2e:
    name: E2E (Playwright)
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_DB: railtech_e2e
          POSTGRES_USER: railtech
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U railtech -d railtech_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      LOG_FORMAT: console
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: railtech_e2e
      POSTGRES_USER: railtech
      POSTGRES_PASSWORD: ci-only-password
      TELEGRAM_MODE: disabled
      TELEGRAM_DRY_RUN: "true"
      E2E_MANAGER_EMAIL: manager@demo.local
      E2E_MANAGER_PASSWORD: ci-e2e-demo-42
      E2E_ADMIN_EMAIL: admin@demo.local
      E2E_ADMIN_PASSWORD: ci-e2e-boss-42
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: make install
      - name: Backend — миграции, демо-данные, API
        working-directory: backend
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          uv run alembic upgrade head
          uv run python -m app seed-demo --manager-password "$E2E_MANAGER_PASSWORD"
          uv run python -m app create-admin --email "$E2E_ADMIN_EMAIL" --password "$E2E_ADMIN_PASSWORD"
          nohup uv run python -m app api --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 1; done
      - name: Frontend — сборка и preview
        working-directory: frontend
        run: |
          pnpm build
          nohup pnpm preview --port 4173 --strictPort > ../preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/ > /dev/null && break; sleep 1; done
      - name: Playwright
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Логи и отчёт
        if: failure()
        run: |
          tail -n 200 api.log preview.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pip-audit (backend, prod-зависимости)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit@2.10.1 -r /tmp/requirements.txt --no-deps --disable-pip --progress-spinner off
      - name: pnpm audit (frontend, prod, high+)
        working-directory: frontend
        run: pnpm audit --prod --audit-level high

  build:
    name: Build images
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            target: prod
          - name: frontend
            context: frontend
            target: prod
          - name: backup
            context: backend
            target: backup
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }} (${{ matrix.target }} target)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          load: ${{ matrix.name == 'backup' }}
          tags: railtech-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Образ backup — pg_dump 16 и скрипты на месте
        if: matrix.name == 'backup'
        run: |
          docker run --rm railtech-backup:ci /usr/lib/postgresql/16/bin/pg_dump --version | grep -q "pg_dump (PostgreSQL) 16"
          docker run --rm railtech-backup:ci /app/ops/backup.sh --help
          docker run --rm railtech-backup:ci python -m app s3-mirror --help
