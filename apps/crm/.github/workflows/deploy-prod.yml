# Выкладка prod (PLAN Фаза 8): тег v* → образы в GHCR (тег = git sha) → ssh на VPS →
# scripts/deploy.sh: бэкап, pull/up, миграции, smoke, откат при провале.
# Secrets (environment production): VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS,
# VPS_APP_DIR. Настройка — docs/runbooks/deploy.md.

name: Deploy prod

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "git-тег для выкладки (v…)"
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      sha: ${{ steps.meta.outputs.sha }}
    strategy:
      matrix:
        include:
          - { name: backend, context: backend, target: prod }
          - { name: frontend, context: frontend, target: prod }
          - { name: backup, context: backend, target: backup }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: meta
        run: |
          echo "ref=${{ inputs.ref || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/railtech-${{ matrix.name }}:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/railtech-${{ matrix.name }}:${{ steps.meta.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to VPS
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: SSH-ключ
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Выкладка (scripts/deploy.sh)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ needs.images.outputs.ref }}
          SHA: ${{ needs.images.outputs.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER@$HOST" bash -s -- \
            "$APP_DIR" "$REF" "$SHA" "$GHCR_USER" <<SCRIPT
          set -euo pipefail
          cd "\$1"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "\$4" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          scripts/deploy.sh "\$2" "\$3"
          SCRIPT
