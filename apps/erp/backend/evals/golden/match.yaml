# Сопоставление строк запроса с каталогом (ARCHITECTURE §8). Шорт-лист кандидатов задан в кейсе
# (в продукте его строит триграммный поиск по БД) — модель только ранжирует. expect — id лучшего
# кандидата; null — ни один не подходит, строка должна остаться без кандидатов.

- id: exact-name-ru
  tags: [quick]
  lines:
    - name: Подшипник 6205
      candidates:
        - {id: 101, name: Подшипник шариковый 6205-2RS, sku: BRG-6205}
        - {id: 102, name: Подшипник шариковый 6305, sku: BRG-6305}
        - {id: 103, name: Втулка бронзовая 25x30}
      expect: 101

- id: latin-to-cyrillic
  tags: [quick]
  lines:
    - name: kabel VVG 3x2.5
      name_canonical: Кабель ВВГ 3x2,5
      candidates:
        - {id: 201, name: Кабель ВВГнг 3x1,5}
        - {id: 202, name: Кабель ВВГнг 3x2,5}
