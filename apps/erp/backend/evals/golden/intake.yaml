    - {name_any: [отвод], quantity: 8, unit_any: [шт]}
    - {name_any: [фланец], quantity: 4, unit_any: [шт]}

- id: csv-header-and-total-ignored
  kind: csv
  input: |
    Заявка на закупку
    Наименование,Количество,Единица
    Бумага офисная А4,20,пачка
    Ручка шариковая синяя,50,шт
