# Конфиг pytest рядом с кодом: в контейнере (scripts/test_backend_local.sh, стенд) смонтирован только backend/,
# и корневой pyproject.toml не виден — B2B отмечал это как причину расхождений CI/локально. Содержимое
# совпадает с [tool.pytest.ini_options] в ../pyproject.toml (coverage остаётся там).
[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = test_*.py *_test.py *_tests.py tests.py
# БЕЗ --nomigrations: справочники сеются данными-миграциями (Rule 1), база без них — другая база.
addopts = --strict-markers --disable-warnings --reuse-db
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
