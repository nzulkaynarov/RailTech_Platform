[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["accounts", "catalog", "crm", "sourcing", "master_data", "notifications", "core"]
skip_glob = ["*/migrations/*"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings_pytest"
pythonpath = "backend"
testpaths = ["backend"]
python_files = ["test_*.py", "*_test.py", "*_tests.py", "tests.py"]
# БЕЗ --nomigrations: по Rule 1 справочники и платформенные образцы шаблонов сеются
# ДАННЫМИ-миграциями (RunPython + get_or_create), поэтому база без миграций — это не
# «быстрее то же самое», а другая база: 22 теста падали в CI на отсутствующих DealStage /
# ContractStatus / образцах ACT и RECEIPT, проходя локально (в контейнере rootdir=/app,
# этот файл туда не попадает, и addopts не применялись — расхождение и держалось незаметным).
addopts = "--strict-markers --disable-warnings --reuse-db"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "eval: PAID model evals via LiteLLM — only `make eval-quick CONFIRM=yes` (EVAL_CONFIRM=yes)",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/migrations/*",
    "*/venv/*",
    "*/virtualenv/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/tests/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if settings.DEBUG",
    "@abstractmethod",
]
fail_under = 30
precision = 2
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
exclude = ["migrations/", "venv/"]
